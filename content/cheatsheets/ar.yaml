        explanation: نسأل عن شيء ما باستخدام `{ask}`.
        demo_code: '{ask} ما لونك المفضل؟'
    3:
        name: '{answer}'
        explanation: نعيد ترديد اجابة المستخدم عن سؤال باستخدام `{answer}`.
        demo_code: |-
            {ask} ما لونك المفضل؟
            {print} اها لونك المفضل هو{answer}
    5:
        name: '{forward}'
        explanation: ارسم خطاً مستقيماً باستخدام `{forward}`.
        demo_code: '{forward} ١٠٠'
    6:
        name: '{turn}'
        explanation: قم بالاستدارة و تحويل اتجاه الرسام باستخدام `{turn}`.
        demo_code: |-
            {forward} ٢٥
            {turn} {left}
            {forward} ٢٥
            {turn} {right}
