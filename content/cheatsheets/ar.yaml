16:
    1:
        name: 'بينما'
        explanation: نستطيع استعمال دورة التكرار أثناء استعملت لعلامة عدم التساوي !=.
        demo_code: |-
            answer = 0
            {while} answer != 25
                answer = {ask} 'What is 5 times 5?'
            {print} 'A correct answer has been given'
    2:
        name: '{while} مع علامة الأصغر'
        explanation: يمكننا أن ندمج استعمال الأمر `{while}` مع علامتي الأصغر `<` والأكبر `>`.
        demo_code: |-
            count = 1
            {while} count < 3
                {print} 'We do this ' 3 - count ' more times'
                count = count + 1
            {print} 'We are done'


