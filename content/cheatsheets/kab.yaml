13:
    1:
        name: '{print}'
        explanation: Seld `{print}` tesriḍ ad tesqedceḍ tacciwin.
        demo_code: "{print}('azul!')"
    2:
        name: '{print} with a variable'
    3:
        name: ssuter kra s {input}
        explanation: Seqdec `{input}` deg wadeg n `{ask}` i ussuter n kra.
        demo_code: "isem = {input}('Isem-ik?')\n{print}('Ihi, isem-ik ', isem)"
    4:
        name: '{if} {elif} {else}'
    5:
        name: Amecṭuḥ
        explanation: Nesseqdac `<` i usenqed ma yella uṭṭun amezwaru meẓẓiy ɣef wis sin.
    6:
        name: Meqqer ugar
        explanation: Nesseqdac `>` i usenqed ma yella uṭṭun amezwaru meqqer ɣef wis sin.
        demo_code: |-
            laεmer = {input}('Acḥal deg laεmeṛ-ik?')
            {if} laεmer > 13:
                {print}('Meqqreḍ fell-i!')
    7:
        name: Yeεdel akked
        explanation: Nesseqdac `==` i usenqed ma yella snat n tɣawsiwin kifkif-nsent.
        demo_code: |-
            tiririt = {input}('Qcu ara d-imudd 5 * 5?')
            {if} tiririt == 25:
                {print}('Iṣeḥḥa!')
    8:
        name: Yemgarrad ɣef
        explanation: Nesseqdac `!=` i usenqed ma yella magarradent snat n tɣawsiwin.
        demo_code: |-
            tiririt = {input}('D acu ara d-imudd 5 * 5?')
            {if} tiririt != 25:
                {print}('Ur iṣeḥḥa ara!')
    9:
        name: Ameẓẓyan neɣ yeεdel
        explanation: Nesseqdac `<=`i usenqed ma yella uṭṭun amezwaru meẓẓiy neɣ yeεdel akked wuṭṭun wis sin
        demo_code: |-
            leεmeṛ = {input}('Acḥal deg leεmeṛ-ik?')
            {if} leεmeṛ <= 12:
                {print}('Meẓẓiyet aṭas fell-i!')
    10:
        name: Meqqer ugar neɣ kifkif
