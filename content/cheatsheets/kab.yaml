1:
    1:
        name: '{print}'
        explanation: Siggez kra s `{print}`.
        demo_code: '{print} Azul, ansuf ɣer Hedy!'
    2:
        name: '{ask}'
        explanation: Ssuter kra s `{ask}`.
        demo_code: '{ask} D acu yini i tesmenyafayeḍ?'
    3:
        name: '{answer}'
        explanation: Ales kra s useqdec n `{answer}`.
        demo_code: |-
            {ask} D anwa ini akk i tḥemmleḍ?
            {print} Ihi, ini akk i tḥemmleḍ d {answer}
    5:
        name: '{forward}'
        explanation: Suɣen izirig s `{forward}`.
        demo_code: '{forward} 100'
    6:
        name: '{turn}'
        explanation: Zzi ifker ara isunuɣen s `{turn}`.
        demo_code: |-
            {forward} 25
            {turn} {left}
            {forward} 25
            {turn} {right}
2:
    1:
        name: '{is}'
        explanation: Mudd isem i wawal ara tesqedceḍ deg wahil s useqdec n `{is}`. Tzemreḍ ad tferneḍ kečč isem-a.
        demo_code: |-
            isem {is} Hedy
            {print} Ansuf ay isem
    3:
        name: '{sleep}'
        explanation: S `{sleep}`, tzemreḍ ad tesḥebseḍ Hedy i tasint neɣ i wugar n tsinin.
        demo_code: |-
            {sleep} 3
3:
    2:
        name: S wudem yerwin
        explanation: Fren awal kan akka seg ugraw s `{at}` akked `{random}`.
        demo_code: |-
            animals {is} dog, cat, kangaroo
            {print} animals {at} {random}
    3:
        name: '{add}'
        explanation: '`{add}` aferdis `{to_list}` tabdart.'
