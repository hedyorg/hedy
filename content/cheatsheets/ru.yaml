            клиент = 'Хеди'
            приветствовать_клиента(клиент)
    3:
        name: использование функции с возвращаемым значением
        explanation: Используйте `{return}`, чтобы использовать возвращаемое значение вне функции.
        demo_code: |-
            {def} получить_комнату(число):
                номер_комнаты = 1000 + число
                {return} номер_комнаты

            любимое_число = 7
            номер_комнаты = получить_комнату(любимое_число)
            {print}('Ваш номер комнаты: ', номер_комнаты)
    4:
        name: Ключевые слова, изученные до этого уровня
        explanation: '`{for}`, `{in}`, `{range}`, `{if}`, `{elif}`, `{else}`, `{print}`, `{input}`, `{play}`, `{turn}`, `{forward}`, `{color}`, `{sleep}`, `{clear}`'
        demo_code: |-
            # список
            фрукты = ['яблоко', 'банан', 'вишня']
            # for in
            {for} фрукт {in} фрукты:
                {print}('Я люблю ', фрукт)
            # for i in range
            {for} i {in} {range} (1,3):
                {print}(фрукты[i], ' — элемент номер ', i, ' в списке.')

            красивые_цвета = ['зелёный', 'жёлтый']
            любимый_цвет = 'оранжевый'
            # if & in
            {if} любимый_цвет {in} красивые_цвета:
                {print}('красиво!')
            # elif
            {elif} любимый_цвет == 'розовый':
                {print}('неплохо!')
            # else
            {else}:
                {print}('так себе')

            # =, input, print
            возраст = {input}('Сколько тебе лет?')
            {print}("Значит, тебе ", возраст, ' лет')

            # меньше
            {if} возраст < 12:
                {print}('Ты младше 12')
            # больше
            {if} возраст > 12:
                {print}('Ты старше 12')
            # равно ==
            {if} возраст == 12:
                {print}('Тебе 12')
            # не равно
            {if} возраст != 12:
                {print}('Тебе не 12')
            # меньше или равно
            {if} возраст <= 12:
                {print}('Тебе 12 или меньше')
            # больше или равно
            {if} возраст >= 12:
                {print}('Тебе 12 или больше')


            # play
            {play} C5
            # turn
            {turn} 90
            # forward
            {forward} 100
            # color
            {color} 'red'
            # sleep
            {sleep} 3
            # clear
            {clear}

            # математика
            {print}(5 + 5)
            {print}(5 - 5)
            {print}(5 * 5)
            {print}(5 / 5)
