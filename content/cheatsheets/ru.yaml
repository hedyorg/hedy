        demo_code: |-
            красивые_цвета = зелёный, жёлтый
            любимый_цвет = оранжевый
            # if & in
            {if} любимый_цвет {in} красивые_цвета
            {print} 'красиво!'
            # elif
            {elif} любимый_цвет {is} розовый
            {print} 'неплохо!'
            # else
            {else}
            {print} 'так себе'

            # is
            имя = Hedy
