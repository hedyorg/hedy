        explanation: Внимание! Начиная с этого уровня синтаксис похож на синтаксис Python. Это означает, что ключевые слова, изученные на предыдущих уровнях, могут не работать! Посмотрите следующие уровни, чтобы узнать, как делать то же самое по-питоновски! `{if}`, `{elif}`, `{else}`, `{print}`, `{input}`, `{play}`, `{turn}`, `{forward}`, `{color}`, `{sleep}`, `{clear}`
