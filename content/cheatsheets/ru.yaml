        explanation: Переменную i тоже можно использовать со списком.
        demo_code: |-
            фрукты = ['яблоко', 'банан', 'вишня']
            {for} i {in} {range} (1,3):
                {print}(фрукты[i], ' — элемент номер ', i, ' в списке.')
