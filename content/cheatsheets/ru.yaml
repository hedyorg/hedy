9:
    1:
        name: '{if} с несколькими линиями'
        explanation: Ответ суммы вопросов с `{ask}` и посмотрите, правильный ли он. Теперь мы выводим две строки.
        demo_code: |-
            ответ = {ask} 'Сколько будет 10 плюс 10?'
            {if} ответ {is} 20
                {print} 'Молодец!!!'
                {print} 'Ответ действительно' ответ
            {else}
                {print} 'Неправильно'
                {print} 'Ответ: 20'
    2:
        name: '{repeat} с несколькими линиями'
        explanation: Повторите несколько строк.
        demo_code: |-
            {repeat} 4 {times}
                {print} 'Hello!'
    3:
        name: Ключевые слова, изученные до этого уровня
        explanation: '`{if}`, `{elif}`, `{else}`, `{in}`, `{print}`, `{is}`, `{ask}`, `{at} {random}`, `{add} {to_list}`, `{remove} {from}`, `{play}`, `{turn}`, `{forward}`, `{color}`, `{sleep}`, `{clear}`'
        demo_code: |-
            # is
            красивые_цвета = зелёный, жёлтый
            любимый_цвет = оранжевый
            # if in
            {if} любимый_цвет {in} красивые_цвета
                {print} 'красиво!'
            # elif
            {elif} любимый_цвет {is} розовый
                {print} 'неплохо!'
            # else
            {else}
                {print} 'так себе'

            # is
            имя = Хеди
            # print
            {print} 'меня зовут ' имя
            # ask
            спорт = {ask} 'Какой твой любимый вид спорта?'

            # список
            животные = утка, собака, носорог
            # случайный выбор
            {print} животные {at} {random}
            # добавить в список
            {add} кошка {to_list} животные
            # удалить из списка
            {remove} собака {from} животные

            # play
            {play} C5
            # turn
            {turn} 90
            # forward
            {forward} 100
            # color
            {color} red
            # sleep
            {sleep} 3
            # clear
            {clear}

            # математика
            {print} '5 плюс 5 — это ' 5 + 5
            {print} '5 минус 5 — это ' 5 - 5
            {print} '5 умножить на 5 — это ' 5 * 5
            {print} '5 разделить на 5 — это ' 5 / 5
13:
    1:
        name: '{print}'
        explanation: После `{print}` необходимо использовать круглые скобки.
        demo_code: '{print}("Привет!")'
    2:
        name: '{print} с var'
        explanation: При использовании `{print}` необходимо использовать круглые скобки и запятые, если вы печатаете больше элементов.
        demo_code: |-
            имя = 'Hedy'
            {print}('Меня зовут ', имя)
    3:
        name: спросить что-нибудь с {input}
        explanation: Чтобы спросить что-то, используйте `{input}` вместо `{ask}`.
        demo_code: |-
            имя = {input}('Как вас зовут?')
            {print}('Так вас зовут ', имя)
    4:
        name: '{if} {elif} {else}'
        explanation: Ключевые слова {if}, {elif} и {else} остаются прежними, но обратите внимание на двоеточие и новые символы в if-условии.
        demo_code: |-
            имя = {input}("Как тебя зовут?")
            {if} имя == 'Хеди':
                {print} ('Привет, Хеди!')
            {elif} имя == 'Джек':
                {print} ('Убирайся, Джек!')
            {else}:
                {print} ('Приятно познакомиться!')
    5:
        name: Меньше
        explanation: Мы используем `<`, чтобы проверить, меньше ли первое число второго.
        demo_code: |-
            возраст = {input}('Сколько тебе лет?')
            {if} возраст < 13:
                {print}('Ты моложе меня!')
    6:
        name: Больше
        explanation: Мы используем `>`, чтобы проверить, больше ли первое число второго.
        demo_code: |-
            возраст = {input}('Сколько тебе лет?')
            {if} возраст < 13:
                {print}('Ты моложе меня!')
    7:
        name: Равный
        explanation: Мы используем `==`, чтобы проверить, одинаковы ли два предмета.
        demo_code: |-
            ответ = {input}('Сколько будет 5 * 5?')
            {if} ответ == 25:
                {print}('Правильно!')
    8:
        name: Не равны
        explanation: Мы используем `!=`, чтобы проверить, не являются ли две вещи одинаковыми.
        demo_code: |-
            ответ = {input}('Сколько будет 5 * 5?')
            {if} ответ != 25:
                {print}('Это неправильно!')
    9:
        name: Меньше или равно
        explanation: Мы используем `<=`, чтобы проверить, меньше или равно ли первое число второму.
        demo_code: |-
            возраст = {input}('Сколько вам лет?')
            {if} возраст <= 12:
                {print}('Ты моложе меня!')
    10:
        name: Больше или равно
        explanation: Мы используем `>=`, чтобы проверить, больше или равно ли первое число второму.
        demo_code: |-
            возраст = {input}('Сколько тебе лет?')
            {if} возраст >= 14:
                {print}('Ты старше меня!')
    11:
        name: Ключевые слова, изученные до этого уровня
        explanation: Внимание! Начиная с этого уровня синтаксис похож на синтаксис Python. Это означает, что ключевые слова, изученные на предыдущих уровнях, могут не работать! Посмотрите следующие уровни, чтобы узнать, как делать то же самое по-питоновски!
        demo_code: |-
            # play
            {play} C5
            # turn
            {turn} 90
            # forward
            {forward} 100
            # color
            {color} 'red'
            # sleep
            {sleep} 3
            # clear
            {clear}

            # математика
            {print}(5 + 5)
            {print}(5 - 5)
            {print}(5 * 5)
            {print}(5 / 5)
