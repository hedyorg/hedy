7:
    -   name: Математика
        explanation: С помощью этих математических знаков ты можешь выполнять вычисления в Hedy
        demo_code: |-
            {print} '5 плюс 5 равно ' 5 + 5
            {print} '5 минус 5 равно ' 5 - 5
            {print} '5 умножить на 5 равно ' 5 * 5
            {print} '5 разделить на 5 равно ' 5 / 5
    -   name: Знак =
        explanation: 'Вместо {is} можно использовать знак =, чтобы задать значение переменной или создать список.
            Обрати внимание: в условиях if знак = не используется.'
        demo_code: |-
            цвет = оранжевый
            {if} цвет {is} зелёный
            {print} 'красиво!'
    -   name: Десятичные дроби
        explanation: В десятичных дробях используй точку
        demo_code: '{print} 2.5 + 2.5'
