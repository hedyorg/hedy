10:
    -   name: Вложенные условия if
        explanation: Размещение одного `{if}` внутри другого `{if}` называется вложением. Следи за отступами!
        demo_code: |-
            продолжить = {ask} 'Хочешь продолжить?'
            {if} продолжить = да
                уверен = ask 'Ты уверен?'
                {if} уверен {is} да
                    {print} 'Мы продолжим'
                {else}
                    {print} 'Ты не уверен'
            {else}
                {print} 'Ты не хочешь продолжать'
    -   name: Вложенные циклы repeat
        explanation: Можно также вкладывать циклы repeat друг в друга или сочетать if и repeat. Следи за отступами!
        demo_code: |-
            {repeat} 3 {times}
                заказ = {ask} 'Что ты хочешь заказать?'
                {if} заказ {is} пицца
                    {print} 'Вкусно'
                {else}
                    {print} 'пицца лучше!'
    -   name: '{and}'
        explanation: Используй `{and}`, чтобы проверить, истинны ли оба условия.
        demo_code: |-
            любимый_цвет = оранжевый
            любимое_число = 7
            {if} любимый_цвет {is} зелёный {and} любимое_число {is} 7
                {print} 'Это лучшее сочетание!'
    -   name: '{or}'
        explanation: Используй `{or}`, чтобы проверить, истинно ли хотя бы одно из условий.
        demo_code: |-
            {print} 'Чтобы войти в этот дом с привидениями, тебе должно быть больше 14 лет или с тобой должен быть взрослый.'
            возраст = {ask} 'Тебе уже исполнилось 14 лет?'
            взрослый = {ask} 'С тобой есть взрослый?'
            {if} возраст {is} да {or} взрослый {is} да
                {print} 'Повеселись в этом доме с привидениями!'
            {else}
                {print} 'Извини, этот дом с привидениями тебе не подходит.'
    -   name: Ключевые слова, которые ты уже знаешь
        explanation: '`{if}`, `{elif}`, `{else}`, `{in}`, `{print}`, `{is}`, `{ask}`, `{at} {random}`, `{add} {to_list}`,
