1:
    -   name: '{print}'
        explanation: Напечатай что-нибудь с помощью `{print}`.
        demo_code: '{print} Привет, добро пожаловать в Hedy!'
    -   name: '{ask}'
        explanation: Спроси что-нибудь с помощью `{ask}`.
        demo_code: '{ask} Какой твой любимый вид спорта?'
    -   name: '{answer}'
        explanation: Напечатай ответ с помощью `{answer}`.
        demo_code: |-
            {ask} Какой твой любимый вид спорта?
            {print} значит, твой любимый вид спорта — {answer}
    -   name: '{play}'
        explanation: Сыграй музыкальную ноту с помощью `{play}`.
        demo_code: '{play} C5'
    -   name: '{forward}'
        explanation: Нарисуй линию с помощью `{forward}`.
        demo_code: '{forward} 100'
    -   name: '{turn}'
        explanation: Поверни черепашку с помощью `{turn}`.
        demo_code: |-
            {forward} 25
            {turn} {left}
            {forward} 25
            {turn} {right}
2:
    -   name: '{is}'
        explanation: Используй переменную с помощью `{is}`.
        demo_code: |-
            имя {is} Hedy
            {print} привет, имя
    -   name: '{ask}'
        explanation: Спроси что-нибудь с помощью `{ask}`. Внимание! Ответ нужно сохранить в переменной с помощью
            `{is}`.
        demo_code: |-
            спорт {is} {ask} Какой твой любимый вид спорта?
            {print} спорт — твой любимый вид спорта!
    -   name: '{sleep}'
        explanation: С помощью `{sleep}` можно приостановить Hedy на одну или несколько секунд.
        demo_code: '{sleep} 3'
    -   name: '{turn} 90'
        explanation: Теперь вместо одних только `{right}` и `{left}` можно задавать угол поворота в градусах.
        demo_code: |-
            {forward} 100
            {turn} 90
            {forward} 100
            {turn} -90
    -   name: Ключевые слова, которые ты уже знаешь
        explanation: '`{print}`, `{play}`, `{forward}`'
        demo_code: |-
            # print
            {print} привет, мир 🌍
            # play
            {play} C5
            # forward
            {forward} 100
3:
    -   name: Создай список с помощью {is}
        explanation: Создай список с помощью is.
        demo_code: животные {is} утка, собака, носорог
    -   name: Случайный выбор
        explanation: Выбери случайное слово из группы с помощью `{at} {random}`.
        demo_code: |-
            животные {is} утка, собака, носорог
            {print} животные {at} {random}
    -   name: '{add}'
        explanation: Добавь (`{add}`) элемент в список с помощью `{to_list}`.
        demo_code: |-
            животные {is} утка, собака, носорог
            {add} кошка {to_list} животные
    -   name: '{remove}'
        explanation: Удали (`{remove}`) элемент из списка с помощью `{from}`.
        demo_code: |-
            животные {is} утка, собака, носорог
            {remove} собака {from} животные
    -   name: Ключевые слова, которые ты уже знаешь
        explanation: '`{print}`, `{is}`, `{ask}`, `{play}`, `{turn}`, `{forward}`, `{sleep}`'
        demo_code: |-
            # print
            {print} привет, мир 🌍
            # is
            имя {is} Hedy
            # ask
            спорт {is} {ask} Какой твой любимый вид спорта?

            # play
            {play} C5
            # turn
            {turn} 90
            # forward
            {forward} 100
            # sleep
            {sleep} 3
4:
    -   name: '{print}'
        explanation: Печатай текст в прямых одинарных (') или двойных (") кавычках, как в Python. В обычном русском тексте используй «ёлочки».
        demo_code: '{print} ''Привет, добро пожаловать в Hedy.'''
    -   name: '{is}'
        explanation: Используй переменную. Оставь её за пределами кавычек.
        demo_code: |-
            имя {is} Hedy
            {print} 'меня зовут ' имя
    -   name: '{ask}'
        explanation: Спроси что-нибудь с помощью `{ask}`.
        demo_code: |-
            спорт {is} {ask} 'Какой твой любимый вид спорта?'
            {print} 'Мне тоже нравится ' спорт '!'
    -   name: '{print} с двойными кавычками'
        explanation: Иногда в тексте, который ты хочешь напечатать, нужен апостроф. В этом случае используй двойные
            кавычки.
        demo_code: '{print} "Привет! Я Hedy, друг Д''Артаньяна!"'
    -   name: '{clear}'
        explanation: Очисти экран с помощью `{clear}`.
        demo_code: '{clear}'
    -   name: '{color} red'
        explanation: Используй {color}, чтобы черепашка рисовала другим цветом.
        demo_code: |-
            {color} red
            {forward} 100
    -   name: Ключевые слова, которые ты уже знаешь
        explanation: '`{at} {random}`, `{add} {to_list}`, `{remove} {from}`, `{play}`, `{turn}`, `{forward}`, `{color}`,
            `{sleep}`, `{clear}`'
        demo_code: |-
            # список
            животные {is} утка, собака, носорог
            # at random
            {print} животные {at} {random}
            # добавить в список
            {add} кошка {to_list} животные
            # удалить из списка
            {remove} собака {from} животные

            # play
            {play} C5
            # turn
            {turn} 90
            # forward
            {forward} 100
            # sleep
            {sleep} 3
