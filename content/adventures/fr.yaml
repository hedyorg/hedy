                    La commande `{for}` crée un bloc, comme `{repeat}` et `{if}`. Il faut donc ajouter 4 espaces avant chaque ligne du bloc.
                example_code: |
                    ```
                    animaux = chiens, chats, méduses
                    {for} animal {in} animaux
                        {print} "J'aime les " animal
                    ```
                story_text_2: |
