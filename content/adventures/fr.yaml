            13:
                story_text: |
                    Bienvenue au carnaval de Hedy ! Nous allons jouer au chamboule-tout ! Dégomme une boite de conserve et choisis ta récompense !

                    ### Exercice
                    Complète les bonnes commandes après le {if} afin de faire fonctionner le programme.

                    * Le programme ne peut se lancer que si le joueur ou la joueuse n'a pas encore joué et qu'il ou elle a moins de 18 ans.
                    * Ensuite, une liste doit être affichée pour montrer au joueur ou à la joueuse les récompenses qu'il ou elle pourra choisir.
                    * Si le joueur ou la joueuse a assez de points pour une récompense (voir la liste des récompenses), cette récompense sera affichée.
                    * Le joueur ou la joueuse ne peut gagner le jeu vidéo seulement si il ou elle a au moins 14 ans.
                    * Le joueur ou la joueuse ne peut gagner le ballon que s'il ou elle a 5 ans ou moins.
                example_code: |
                    ```
                    #liste des récompenses
                    ballon = 1
                    sucette = 2
                    jeu_vidéo = 8
                    ours_en_peluche = 10

                    {print}('Chamboule tout !')
                    age = {input}('Quel âge as-tu ?')
                    a_déjà_joué = {input}('As-tu déjà joué ?)

                    # Choix de la récompense par le joueur ou la joueuse
                    {if} _ {or} _:
                        {print}('Tu peux jouer')
                        points = {input}('Combien de points a tu marqué ?)
                        {print}('Tu peux choisir parmi ces récompenses :')

                        {if} _ :
                            {print}('ours en peluche')

                        {if} _ :
                            {print}('sucette')

                        {if} _ {and} _ :
                            {print}('jeu vidéo')

                        {if} _ {and} :
                            {print}('ballon')

                        récompense = {input}('Quelle récompense souhaiterais-tu ?)
                        {print}('Bravo pour ton/ta ', récompense)

                    {else}:
                        {print}('Déso pas déso, tu ne peux pas jouer.')
                    ```
                answer_code: |
                    ```
                    #liste des récompenses
                    ballon = 1
                    sucette = 2
                    jeu_vidéo = 8
                    ours_en_peluche = 10

                    {print}('Chamboule tout !')
                    age = {input}('Quel âge as-tu ?')
                    a_déjà_joué = {input}('As-tu déjà joué ?)

                    {if} a_déjà_joué != "oui" {or} âge < 18:
                        {print}('Tu peux jouer')
                        points = {input}('Combien de points a tu marqué ?)
                        {print}('Tu peux choisir parmi ces récompenses :')

                        {if} points >= ours_en_peluche :
                            {print}('ours en peluche')

                        {if} points >= sucette :
                            {print}('sucette')

                        {if} âge >= 14 {and} points >= jeu_vidéo :
                            {print}('jeu vidéo')

                        {if} âge <= 5 {and} points >= ballon:
                            {print}('ballon')

                        récompense = {input}('Quelle récompense souhaiterais-tu ?)
                        {print}('Bravo pour ton/ta ', récompense)

                    {else}:
                        {print}('Déso pas déso, tu ne peux pas jouer.')
                    ```
