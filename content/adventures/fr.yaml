                    Finis ce code en ajoutant `{for} action {in} actions` à la ligne 2.
                example_code_2: |
                    ```
                    actions = frappe des mains, tape du pied, crie Hourra !
                    _
                        {repeat} 2 {times}
                            {print} 'Si tu as de la joie au cœur, ' action
                            {sleep} 2
                        {print} 'Si tu as de la joie au cœur, si tu as de la joie au cœur'
                        {print} 'Si tu as de la joie au cœur, ' action
                        {sleep} 3
                    ```
                answer_code: |
                    ```
