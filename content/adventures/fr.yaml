                    cachette_choisie = demande_à_l_utilisateur(questions[5])
                    cause_choisie = demande_à_l_utilisateur(questions[6])

                    {print}(nom_choisi ' était en train de ' verbe_choisi ' à ' lieu_choisi)
                    {print} ('Quand soudain, il ou elle entendit un son, qui ressemble à ', son_choisi)
                    {print}(nom_choisi " regarda autour de lui ou d'elle mais n'arrivait pas à savoir d'où venait le bruit")
                    {print} nom_choisi, ' se cacha dans ', cachette_choisie
                    {print}'Il ou elle essaya de regarder alentours, mais ne pouvait rien voir depuis sa cachette')
                    {print}nom_choisi ' parti de ', cachette_choisie
                    {print}'Et tout ce qu'elle ou il vu était seulement ' cause_choisie
                    {print}(nom_choisi ' en ria et continua sa journée")
                    'Fin' 
                    ```
                answer_code: |
                    ```
                    {def} demande_à_l_utilisateur(question):
                        réponse = {input}( 'Quelle devrait être ', question, ' dans l'histoire ?')
                        {return} réponse

                    questions = ['le nom', 'le verbe', 'le lieu', 'la cachette', 'le son', 'la cause du bruit'

                    nom_choisi = demande_à_l_utilisateur(questions[0])
                    verbe_choisi = demande_à_l_utilisateur(questions[2])
                    lieu_choisi = demande_à_l_utilisateur(questions[3])
                    son_choisi = demande_à_l_utilisateur(questions[4])
                    cachette_choisie = demande_à_l_utilisateur(questions[5])
                    cause_choisie = demande_à_l_utilisateur(questions[6])

                    {print}(nom_choisi, ' était en train de ', verbe_choisi, ' à ', lieu_choisi)
                    {print} ('Quand soudain, il ou elle entendit un son, qui ressemble à ', son_choisi)
                    {print}(nom_choisi, " regarda autour de lui ou d'elle mais n'arrivait pas à savoir d'où venait le bruit")
                    {print}(nom_choisi, ' se cacha dans ', cachette_choisie)
                    {print}('Il ou elle essaya de regarder alentours, mais ne pouvait rien voir depuis sa cachette')
                    {print}(nom_choisi, ' parti de ', cachette_choisie)
                    {print}('Et tout ce qu'elle ou il vu était seulement ', cause_choisie)
                    {print}(nom_choisi, ' en ria et continua sa journée")
                    {print}('Fin')
                    ```
