        levels:
            15:
                story_text: |
                    Maintenant que tu as appris comment utiliser les fonctions, tu vas apprendre à utiliser les arguments des fonctions.
                    Un **argument** est une variable qui peut être utiliser dans la fonction. Elle n'est pas utilisée en dehors de la fonction.

                    On peut prendre en exemple le code où nous avons programmé la première strophe de "My Bonnie is over the ocean".
                    Dans cet exemple de code, l'argument 'lieu' est utilisé. Place est une variable qui est utilisé seulement dans la fonction, comme un argument.
                    Pour utiliser 'lieu', nous avons mis `lieu` après `{define} musique`.
                    Quand la fonction est appelée, l'ordinateur remplacera l'argument 'lieu', avec le moreceau de texte après `musique{with}`.

                    ### Exercie
                    La prochaine strophe de la musqique va ici :

                    Last night as I lay on my pillow

                    Last night as I lay on my bed

                    Last night as I lay on my pillow

                    I dreamed that my Bonnie is dead



                    Peux-tu programmer cette strophe de la même manière que dans l'exemple ?
                example_code: |
                    ```
                    {def} musique(lieu):
                        {print}('My Bonnie is over the ', lieu)

                    musique('ocean')
                    musique('sea')
                    musique('ocean')
                    ```
                answer_code: |
                    ```
                    {define} musique(lieu)
                        {print} ("Last night as I lay on my " lieu)

                    musique('pillow')
                    musique('lit')
                    musique('pillow')
                    {print} "I dreamed that my Bonnie is dead"
                    ```
    functions_3:
        name: fonctions avec valeur de retour
        default_save_name: fonctions 3
        description: fonctions 3
        levels:
            15:
                story_text: |
                    Dans les niveaux précédents, tu as appris à créer des fonctions et à utiliser des arguments avec. Un autre usage important des fonctions est de leur faire calculer quelque chose pour toi.
                    Tu peux donner à la fonction un calcul et elle te donnera le résultat. Cette réponse est appelée **valeur de retour**.

                    Par exemple, dans ce code, la fonction calcule_nouveau_prix va calculer le nouveau prix de n'importe quel objet. Elle te donnera le nouveau prix comme valeur de retour.

                    ### Exercice
                    Finis ce code. Nous avons déjà créé la variable nouveau_prix pour toi, tu dois seulement lui assigner une valeur.
                    Tu dois finir la ligne de code en appelant la fonction qui calcule le nouveau prix.
                example_code: |
                    ```
                    {def} calcule_nouveau_prix(montant, pourcentage):
                        pourcentage = pourcentage / 100
                        réduction = montant * pourcentage
                        {return} montant - réduction

                    ancien_prix = {input}("Quel est le prix sur cettte étiquette ?")
                    remise = {input}("De combien de pourcents est la rédution ?")

                    nouveau_prix = _
                    {print}('Le nouveau prix est de ', nouveau_prix, ' euros')
                    ```
                answer_code: |
                    ```
                    {def} calcule_nouveau_prix(montant, pourcentage):
                        pourcentage = pourcentage / 100
                        réduction = montant * pourcentage
                        {return} montant - réduction

                    ancien_prix = {input}("Quel est le prix sur cettte étiquette ?")
                    remise = {input}("De combien de pourcents est la rédution ?")

                    nouveau_prix = calcule_nouveau_prix(ancien_prix, remise)
                    {print}('Le nouveau prix est de ', nouveau_prix, ' euros')

                    ```
