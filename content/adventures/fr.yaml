                story_text: |
                    En mathématiques, tu as sûrement déjà pu utiliser les symboles `<` et `>`.
                    Le `<` vérifie que le premier nombre est inférieur au second, par exemple âge `<` 12 vérifie si l'âge est inférieur à 12.
                    Le `>` vérifie que le premier nombre est supérieur au second, par exemple âge `>` 10 vérifie si l'âge est supérieur à 10.
                    A ton tour d'essayer !
                example_code: |
                    ```
                    âge = {input}('Quel âge as-tu ?')
                    {if} âge > 12:
                        {print}('Tu es plus vieux que moi')
                    ```
                    ```
                    âge = {input}('Quel âge as-tu ?')
                    {if} âge < 12:
                        {print}('Tu es plus jeune que moi')
                    {else}:
                        {print}('Tu es plus vieux que moi')
                    ```
