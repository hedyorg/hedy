                    Boenvenue dans l'aventure de l'hôpital. Dans cette aventure, tu aideras une directrice d'hôpital à corriger certains problèmes qui arrivent dans son hôpital. Voici ta première mission :

                    Il y a une file interminable de patients et patientes à l'accueil, et l'hôtesse d'accueil est très occuppée. Peux-tu aider cette empoyée en programmant un bureau d'auto-enregistrement ?
                    ### Exercice
                    Le bureau d'auto-enregistrment doit, pour chaque patient ou patiente :
