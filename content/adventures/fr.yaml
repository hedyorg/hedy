                    {print} Le dimanche sera assuré par infirmière_choisie
                    {remove} infirmière_choisie {from} infirmières
                    ```
            4:
                story_text: |
                    Nos informières on beaucoup de tâches aà accomplir dans une journée. L'une d'entre elles est de visiter les patients et patientes chaque matin et de leur demander leur souhait pour le petit déjeuner.
                    Peux-tu diminuer la charge de travail de nos infirmière en créant un programme dans lequel les patients et patientes choisissent leur petit-déjeuner et envoient leur commande directement en cuisine ?
                    ### Exercice
                    Pour chaque patient ou patiente, le programme doit :
                    * lui demander de renseigner son nom et numéro de chambre
                    * lui écrire un message de d'accueil
                    * afficher la liste des éléments du petit-déjeuner qui sont au menu (céréales, café, lait, pain, confiture, etc)
                    * lui demander ce qu'il ou elle veut manger
                    * lui demander ce qu'il ou elle veut boire
                    * lui montrer le récapitulatif de sa commande
                    * le remercier pour sa commande
                    * lui indiquer que la commande sera apportée dans sa chambre d'ici 15 minutes
                answer_code: |
                    ```
                    nom {is} {ask} "Quel est votre nom ?"
                    uméro_de_chambre {is} {ask} "Quel est votre numéro de chambre ?"
                    {print} "Bonjour " nom
                    {print} "Au menu d'aujourd'hui, nous avons :"
                    {print} "des céréales, une banane, une pomme, une tartine de confiture"
                    {print} "mais aussi des boissons :"
                    {print} "du jus d'orange, du thé, du café, de l'eau"
                    nourriture {is} {ask} "Que voulez-vous manger ?"
                    boisson {is} {ask} "Que voulez-vous boire ?"
                    {print} "Vous avez commandé : " nourriture " et " boisson
                    {print} "Merci de votre commande"
                    {print} "Votre commande arrivera dans votre chambre dans 5 minutes"
                    ```
            5:
                story_text: |
                    Notre service des grands brûlés imerait diminuer la charge de travail enutilisant un outil qui permet de trier les patients et patientes en fonction de la gravité de leurs brûlures. Les patients et patientes n'auront besoin de renseigner que leur nom, date de naissance en plus du type de brûlure (premier, second ou troisième degré) et il leur sera ensuite indiqué où aller ensuite.
                    Peux-tu les aider ?
                    ### Exercice
                    Le programme doit :
                    * commencer avec une phrase de bienvenue et un système d'enregistrement du nom et de la date de naissance du patient ou de la patiente
                    * pré-trier : si la peau est seulement rouge, c'est une brûlure au premier degré ; s'il y a des cloques, c'est un brûlure au second degré ; s'il n'y a plus de peau, ou que le peau est blanchie ou noircie, c'est une brûlure au 3ème degré.
                    * donner au patient ou à la patiente une indication sur la suite : pour les brûlures du premier degré, "Refroidir la brûlure en faisant couler de l'au dessus et en y appliquan une crème. Voir un médecin n'est pas nécessaire.", pour les brûlures du second degré, "Un médecin va venir vous voir et vous prescrire une crème spéciale. Veuillez attendre dans la salle d'attente", et pour une brûlure au troisième degré "Allez directement à l'accueil, vous avez besoin d'un soin urgent"
                answer_code: |
                    ```
                    nom {is} {ask} "Quel est votre nom ?"
                    date_de_naissance {is} {ask} "Quelle est votre date de naissance ?"
                    premier_degré {is} {ask} "Est-ce que la peau est rouge ?"
                    second_degré {is} {ask} "Y a-t'il des cloques sur la peau ?"
                    troisième_degré {is} {ask} "la peau a-t-elle disparu ou est-elle blanchie our noircie ?"
                    {if} premier_degré {is} "oui"
                    {print} "Refroidir la brûlure en faisant couler de l'au dessus et en y appliquan une crème. Voir un médecin n'est pas nécessaire."
                    {if} second_degré {is} "oui"
                    {print} "Un médecin va venir vous voir et vous prescrire une crème spéciale. Veuillez attendre dans la salle d'attente"
                    {if} troisième_degré {is} oui
                    {print} "Allez directement à l'accueil, vous avez besoin d'un soin urgent"
                    ```
            6:
                story_text: |
                    Nos sages-femmes ont eaucoup de questions de la parte de femmes enceintes à propos de ce qu'elles peuvent manger ou non durant la grossesse. Peux-tu aides les patientes en créant une application qui leur indique si un aliment est bon ?
                    ### Exercice
                    Le programme doit :
                    * demander à la patiente ce qu'elle veut manger
                    * vérifier si c'est dans la liste des aliments risqués
                    * si c'est le cas, indiquer à la patiente qu'il ne faut pas le manger
                    * sinon, lui dire qu'il est probablement sûr de manger cet aliment
                    * avertir la personne que l'application n'est pas finie à 100%. Puis dire à la patiente qu'elle doit toujours éviter les viandes, poisson et oeufs peu ou pas cuite, ainsi que l'alcool.
                    Quand vous êtes enceinte, il n'est pas recommander de manger : sushi, crevettes, thon, fromage bleu, tiamisu, oeuf à la coque, carpaccio, steak saignant, tartare
                answer_code: |
                    ```
                    {print} "Manger ou ne pas manger, telle est la question !"
                    aliment {is} {ask} 'Que voulez-vous manger ?'
                    aliments_non_recommandés {is} sushi, crevettes, thon, roquefort, tiramisu, oeuf à la coque, carpaccio, steak saignant, tartare
                    {if} aliment {in} aliments_non_recommandés
                    {print} "Il n'est pas recommandé de manger " aliment
                    {else}
                    {print} "Il est probablement sûr de manger " aliment 
                    {print} 'Toujours utiliser votre bon sebs car notre liste n'est pas finie. Evitez les viandes, poissons ou oeufs peu ou pas cuits ainsi que l'alcool. '
                    ```
            7:
                story_text: |
                    Nos informières surveillent le balance des fluides de nos patients. La balance des fluides représente la différence de fluide entre ce que le patient ou la patiente a ingéré (en mengeant, buvant ou par intraveineuse) et ce qu'il ou elle a perdu (en urinant ou vomissant).
                    La balance des fluide doit rester positive. Si la balance des fluides est négative, l'infirmière doit administrer plus de fluides par voie intraveineuse.
                    Peux-tu aider nos infirmières en créant un outil qui permet de calculer la balance des fluides d'un patient ou une patiente ?
                    ### Exercice
                    Pour un patient ou une patiente, le programme doit :
                    * demander combien de fluide il ou elle a ingéré en buvant dans les dernières 24 heures
                    * demander combien de fluide il ou elle a ingéré en mangeant dans les dernières 24 heures
                    * demander combien de fluide il ou elle a pris en intraveineuse dans les dernières 24 heures
                    * demander combien de fluide il ou elle a perdu en urinant dans les dernières 24 heures
                    * demander combien de fluide il ou elle a perdu en vomissant dans les dernières 24 heures
                    * calculer la balance des fluides et l'afficher à l'infirmière
                    * dire à l'infirmière de vérifier si la balance est positive ou négative afin de décider si le patient a besoin de plus de fluides en intraveineuse.
                answer_code: |
                    ```
                    fluide_pris_en_buvant = {ask} "Combien de fluide le patient ou la patiente a-t-il ou a-t-elle gagné en buvant aujourd'hui ?
                    fluide_pris_en_mangeant = {ask} "Combien de fluide le patient ou la patiente a-t-il ou a-t-elle gagné en mangeant aujourd'hui ?
                    fluide_pris_par_intraveineuse = {ask} "Combien de fluide le patient ou la patiente a-t-il ou a-t-elle pris par intraveineuse aujourd'hui ?
                    fluide_uriné = {ask} "Combien de fluide le patient ou la patiente a-t-il ou a-t-elle perdu en urinant aujourd'hui ?
                    fluide_vomi = {ask} "Combien de fluide le patient ou la patiente a-t-il ou a-t-elle perdu en vomissant aujourd'hui ?
                    balance_des_fluides = fluide_pris_en_buvant + fluide_pris_en_mangeant + fluide_pris_par_intraveineuse - fluide_uriné - fluide_vomi
                    {print} "La balance des fluides est de " balance_des_fluides
                    {print} "Vérifiez si la balance est positive ou négative afin de décider si le patient a besoin de plus de fluide par intraveineuse"
                    ```
