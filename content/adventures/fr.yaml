                    Cela signifie qu'à partir de maintenant, nous devons utiliser les parenthèses avec `{print}`.
                    Cela signifie aussi que tu peux utiliser le code Hedy de ce niveau dans n'importe quel environnement Python du moment que tu utilises les commandes en anglais.
                    Si tu ne l'as pas encore fait, tu peux basculer en anglais dans le menu des commandes.
                example_code: |
