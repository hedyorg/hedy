adventures:
    story:
        name: histoire
        default_save_name: Histoire
        description: Écrivez une histoire courte
        levels:
            1:
                story_text: |
                    Au niveau 1 tu peux faire une histoire avec un personnage principal dont tu auras choisi le nom toi-même.

                    À la première ligne, utilise `{ask}` pour demander le nom du personnage de ton histoire. Ensuite, utilise {answer} pour utiliser le nom du personnage qui a été donné.
                example_code: |
                    ```
                    {ask} Le nom du personnage principal de cette histoire est
                    {print} {answer} est en train de marcher dans la forêt
                    {print} Un peu effrayé, {answer} continue de marcher
                    {print} {answer} entend de drôles de bruits tout autour
                    {print} Il craint que cette forêt soit hantée
                    ```
                story_text_2: |
                    ### Défi
                    Crée maintenant ta propre histoire à l'aide d'au moins 6 lignes de code.
                    Cette histoire doit être différente de celle proposée dans le code d'exemple.
                    Utilise au moins une commande `{ask}` et `{answer}`.
                    Tu peux choisir n'importe quel sujet.
                    Si tu n'as pas d'idée, tu peux parler de l'un des sujets suivants : aller au cinéma, un match de sport ou une journée au zoo.
                answer_code: |
                    ```
                    {print} Un jour, je suis allé(e) au zoo.
                    {ask} Quel animal ai-je vu en premier ?
                    {print} D'abord, j'ai vu un(e) {answer}
                    {print} Ensuite j'ai vu un pingouin.
                    {print} Il était en train de prendre son repas.
                    {ask} Qu'est-ce que le pingouin était entrain de manger ?
                    {print} Le pingouin mangeait {answer} en guise de repas.
                    ```
            2:
                story_text: |
                    Dans le niveau 2 tu peux créer une histoire plus drôle. Le nom de ton personnage principal peut être à n'importe quel endroit de la phrase

                    Tu vas devoir programmer un petit supplément pour ça. Maintenant, tu dois commencer par donner un nom à ton personnage principal.

                    Tu peux ensuite mettre ce nom n'importe où dans une phrase.
                example_code: |-
                    ```
                    nom {is} {ask} Quel est le nom du personnage principal ?
                    {print} nom va courir dans les bois
                    {print} nom a un peu peur
                    {print} Soudain, il entend un bruit étrange…
                    {sleep}
                    {print} nom craint que cette forêt soit hantée
                    ```
                story_text_2: |
                    ### Défi
                    Il est maintenant temps d'ajouter des variables à l'histoire que tu as créée au niveau précédent.
                    Retourne à l'histoire du niveau 1 et copie le code. Colle le code dans l'écran de saisie de ce niveau.

                    Ce code ne fonctionnera pas dans ce niveau car il n'utilise pas encore de variables.
                    Corrige le code en utilisant des variables et le mot clé `{is}` avec la commande `{ask}` comme tu l'as appris dans ce niveau.

                    **Extra** Ajoute une commande `{sleep}` à ton code pour apporter du suspens à ton histoire.
                answer_code: |
                    ```
                    {print} Un jour je suis allé(e) au zoo.
                    premier_animal {is} {ask} Quel animal ai-je vu en premier ?
                    {print} D'abord j'ai vu un(e) premier_animal
                    {print} Puis j'ai vu un pingouin.
                    {print} Il prenait son repas.
                    nourriture {is} {ask} Que mangeait le pingouin ?
                    {print} Le pingouin mangeait...
                    {sleep} 3
                    {print} nourriture
                    ```
            3:
                story_text: |
                    Au niveau 3, tu peux rendre ton histoire plus amusante. Tu peux tirer au hasard un monstre, un animal ou un autre obstacle, comme ceci :
                example_code: |
                    ```
                    animaux {is} 🦔, 🐿, 🦉, 🦇
                    {print} Maintenant il entend des cris de animaux {at} {random}
                    ```
                story_text_2: |
                    La commande `{add}` peut aussi être pratique pour ton histoire.
                example_code_2: |
                    ```
                    {print} Il entend un bruit
                    animaux {is} un 🐿, un 🦔, une 🦇, une 🦉
                    animal {is} {ask} C'est quoi à ton avis ?
                    {add} animal {to_list} animaux
                    {print} C'était animaux {at} {random}
                    ```
                story_text_3: |
                    Ceci est un exemple de la commande `{remove}` dans ton histoire.

                    ### Exercice
                    Copie ton histoire des niveaux précédents dans celui-ci.
                    Dans ce niveau, tu as appris 3 nouvelles commandes `{at} {random}`, `{add} {to_list}` et `{remove} {from}`.
                    Ajoute de nouvelles lignes de code à ton histoire de manière à ce que ces nouvelles commandes apparaissent au moins une fois.
                example_code_3: |
                    ```
                    {print} Son sac à dos est beaucoup trop lourd.
                    {print} Il y a dedans une bouteille d'eau, une lampe torche et une brique.
                    sac_à_dos {is} eau, torche, brique
                    jeté {is} {ask} Quel objet devrions-nous jeter ?
                    {remove} jeté {from} sac_à_dos
                    ```
                answer_code: |
                    ```
                    animaux {is} lion, zèbre, flamand rose
                    {print} Bonjour les enfants ! Aujourd'hui, nous allons au zoo !
                    animal_prefere {is} {ask} Quel animal souhaites-tu voir aujourd'hui ?
                    {add} animal_prefere {to} animaux
                    {sleep} 2
                    {print} Dirigeons-nous vers les animaux {at} {random}
                    {sleep}
                    animal_le_moins_aime {is} {ask} Quel animal ne souhaites-tu pas voir ?
                    {remove} animal_le_moins_aime {from} animaux
                    {print} Allons voir les animaux {at} {random} maintenant !
                    ```
            4:
                story_text: |
                    ### Exercice
                    Copie l’exemple et ajoute des guillemets à la place des espaces vides aux lignes 1 et 2 pour le faire fonctionner.
                    Les espaces vides en ligne 3 et 4 ne doivent pas être remplacés par des guillemets, mais par une commande `{sleep}` et une commande `{clear}`. Peux-tu faire marcher tout l'exemple ?

                    ### Exercice 2
                    Rends-toi au niveau précédent et copie le code de ton histoire. Fais marcher ton code à ce niveau en ajoutant des guillemets aux bons endroits.
                    Attention : les variables de ton histoire ne doivent pas être entre guillemets, comme le montre la seconde ligne de l'exemple. Dans cette ligne, le nom de la variable n'est pas entre guillemets.
                example_code: |
                    ```
                    nom {is} {ask} _ Comment t'appelles-tu ? _
                    {print} _ Le personnage principal s'appelle _ nom
                    _
                    _
                    {print} nom _ va se promener dans les bois _
                    {print} nom _ a un peu peur _
                    animaux {is} 🦔, 🐿, 🦉, 🦇
                    {print} _ Il entend des bruits de _ animaux {at} {random}
                    {print} nom _ craint que la forêt ne soit hantée _
                    ```
                answer_code: |
                    ```
                    nom {is} {ask} 'Quel est ton nom ?'
                    {print}  'Le personnage principal s'appelle' nom
                    {print} nom  ' s'en va marcher dans la forêt.'
                    {print} nom ' a un peu peur.'
                    animaux {is} 🦔, 🐿, 🦉, 🦇
                    {print} 'Il entend le bruit d'un ' animaux {at} {random}
                    {print} nom ' a peur que la forêt soit hantée.'
                    ```
            5:
                story_text: |
                    À ce niveau, différentes fins peuvent être programmées afin de rendre ton histoire encore plus amusante.
                    L'exemple de code te montre comment réaliser deux fins différentes.

                    ### Exercice 1
                    Écris une nouvelle histoire courte du sujet de ton choix.
                    En panne d'inspiration ? Choisis l'un des sujets suivants : un super-héros, une journée d'école ennuyeuse, une île déserte.

                    Maintenant, donne la possibilité au joueur de choisir une fin heureuse ou non, comme dans le code exemple.
                    Programme les deux fins.

                    ### Exercice 2
                    Copie l'histoire créée aux niveaux précédents.
                    Trouve le moyen d'ajouter au moins deux commandes `{if}` et `{else}` à ton histoire.
                    La fin peut être heureuse ou non. Tu peux également trouver d'autres moyens d'inclure ces commandes.
                example_code: |
                    ```
                    nom {is} {ask} "Qui se promène en forêt ?"
                    {print} nom " se promène en forêt"
                    {print} nom " rencontre un monstre"
                    fin {is} {ask} "Voudrais-tu une fin triste ou heureuse ?"
                    {if} fin {is} heureuse {print} nom " sort son épée et le monstre s'enfuie à toutes jambes"
                    {else} {print} "Le monstre mange " nom
                    ```
                answer_code: |
                    ```
                    nom {is} {ask} 'Comment s'appelle le héros ?'
                    {print} 'Oh non, l'avion va s'écraser. Qui va nous sauver ?'
                    {print} "Regardez qui vole dans le ciel, c'est " nom
                    fin {is} {ask} 'Vas-tu sauver l'avion ou le détruire ?'
                    {if} fin {is} sauver {print} nom "a fait atterrir l'avion, il nous a sauvés !"
                    {else} {print} "Oh non ! " nom " détruit l'avion, au secours !"
                    ```
            6:
                story_text: "Maintenant que vous pouvez utiliser `{elif}` vous pouvez créer une histoire encore plus interactive ! Vous pourriez créer plusieurs personnages, par exemple, qui auraient tous des attributs différents.\nOu vous pourriez faire choisir à votre joueur quel chemin emprunter, quelle porte ouvrir ou quelle potion magique boire...\n\n### Exercice\nCréez votre propre histoire avec 3 options ou plus en utilisant `{elif}`."
                example_code: "```\npersonnage {is} {ask} 'Qui va vous aider dans votre quête ?'\n{if} personnage {is} 'Daisy'\n{print} 'Vous avez choisi Daisy ! C'est la plus futée de tous !'\n{elif} personnage {is} 'Jason'\n{print} 'Vous avez choisi Jason ! C'est le plus fort de tous !'\n{elif} personnage {is} 'Sam'\n{print} 'Vous avez choisi Sam ! C'est le plus rapide de tous !'\n```\n"
                answer_code: |
                    Ma réponse
            8:
                story_text: |
                    Dans une histoire, on se répète parfois. Par exemple, quand une personne appelle à l'aide ou chante une chanson.
                    Dans ce niveau, tu peux écrire ces répétitions dans ton histoire, avec `{repeat}`.

                    ### Exercice
                    Ajoute une répétition à ta propre histoire. Retourne en arrière dans tes programmes sauvegardés, choisi une histoire que tu as programmée à un niveau précédent,
                    trouve une ligne contenant `{print}` et répète la !
                example_code: |
                    ```
                    {print} "Le prince appelait à l'aide sans arrêt"
                    {repeat} 5 {times} {print} 'Au secours !'
                    {print} "Pourquoi personne ne vient m'aider ?"
                    ```
                answer_code: |
                    {print} 'Tous les enfants voulaient aller au zoo, et n'arrêtaient pas de crier : '
                    {repeat} 3 {times} {print} "On va au zoo !"
            9:
                story_text: |
                    À ce niveau tu peux utiliser plusieurs lignes dans une commande `{if}`, ainsi tu peux améliorer la fin heureuse et la fin triste !

                    ### Exercice 1
                    L'exemple de code montre deux fins différentes, une ou les personnages sautent dans une machine à voyager dans le temps et une où ce n'est pas le cas.
                    Complète les espaces vide avec, au moins, une phrase pour chaque fin.
                    **Bonus** Fait une histoire plus longue. Que se passe-t-il dans l'histoire ? Tu peux aussi ajouter une seconde commande `{ask}` avec des options différentes.

                    ### Exercice 2
                    Recherche dans tes programmes sauvegardés et choisi une histoire du niveau 5. Maintenant écrit une fin triste et une fin heureuse d'au moins trois lignes de long pour chacune !
                example_code: |
                    ```
                    {print} "OH NON ! Le T-rex se rapproche !"
                    fin = {ask} "Voulez-vous une fin triste ou heureuse ?"
                    # La fin heureuse
                    {if} fin {is} heureuse
                    …{print} "Juste à temps, Richard retourne d'un saut dans la machine à voyager dans le temps !"
                    …{print} _
                    # La fin triste
                    {else}
                    …{print} "Oh non ! Richard est trop lent…"
                    …{print} _
                    ```
                answer_code: |
                    ```
                    {print} 'OH NON ! Le T-rex se rapproche !'
                    fin = {ask} 'Veux-tu une fin heureuse ou malheureuse ?'
                    {if} fin {is} heureuse
                        {print} 'À la dernière minute, Richard saute dans la machine à voyager dans le temps !'
                        {print} 'Fiou, content qu'on ait réussi'
                        {print} 'Juste à temps.'
                    {else}
                        {print} 'Oh non ! Richard est trop lent...'
                        {print} 'Le T-rex rugit d'un énorme GRRRR'
                        {print} 'Il ouvre la gueule et ne fait qu'une seule bouchée de Richard.'
                    ```
            10:
                story_text: |
                    À ce niveau tu peux utiliser les commandes `{if}` et `{repeat}` à l'intérieur d'autres commandes `{if}`et `{repeat}`.
                    Cela te donne de nombreuses options et t'aide vraiment à rendre ton histoire interactive.

                    ### Exercice
                    Termine le code pour que les `{if}` fonctionnent correctement.

                    ### Exercice 2
                    Ajoute aussi un `{if}`et `{else}` pour la partie de l'histoire où Robin rentre à la maison.

                    ### Exercice 3
                    Retourne chercher ton histoire du niveau 8 et utilise au moins deux `{if}` à l'intérieur d'un `{if}` existant.
                example_code: |
                    ```
                    {print} "Robin se promène en ville"
                    choix = {ask} "Est-ce que Robin entre dans un magasin ou rentre-t-il à la maison ?"
                    {if} choix {is} magasin
                        {print} "Il entre dans un magasin"
                        {print} "Robin trouve un livre qui a l'air intéressant"
                        achète = {ask} "Est-ce que Robin achète le livre ?"
                        {if} achète {is} oui
                        _ {print} "Robin achète le livre et rentre à la maison"
                        _ {else}
                        _ {print} "Robin quitte le magasin et rentre à la maison"
                    {else}
                        {print} "Robin rentre à la maison"
                    ```
                story_text_2: |
                    En utilisant les commandes `{and}` et `{or}` tu peux rendre tes histoires plus flexibles. Tu peux poser deux questions et répondre à une combinaison de réponses.

                    ### Exercice 1
                    Regarde le code d'exemple et termine-le. Ensuite, ajoute au moins 2`{if}` avec un `{and}` ou un `{or}`.

                    ### Exercice 2
                    Trouve une histoire parmi les niveaux précédents et ajoute un `{and}` ou un `{or}`.
                example_code_2: |
                    ```
                    {print} 'Notre héroïne marche dans la forêt.'
                    {print} 'Le chemin se sépare en deux.'
                    chemin = {ask} 'Quel chemin devrait-elle choisir ?'
                    arme = {ask} 'Quelle arme sort-elle ?'
                    {if} chemin {is} gauche {and} arme {is} épée
                        _
                    ```
                answer_code: |
                    ```
                    {print} 'Victoire marche en ville.'
                    lieu = {ask} 'Va-t-elle dans un magasin ou rentre-t-elle à la maison ?'
                    {if} lieu {is} magasin
                        {print} 'Elle entre dans le magasin.'
                        {print} 'Victoire voit un livre qui semble intéressant.'
                        livre = {ask} 'Achète-t-elle le livre ?'
                        {if} livre {is} oui
                            {print} 'Victoire achète le livre puis rentre chez elle.'
                        {else}
                            {print} 'Victoire sort du magasin et rentre chez elle.'
                    {else}
                        {print} 'Victoire rentre chez elle.'
                        glace = {ask} 'S'arrête-t-elle prendre une glace sur le chemin du retour ?'
                        {if} glace {is} oui
                            {print} 'Victoire s'arrête d'abord pour manger une glace.'
                            {print} 'Elle choisit le sorbet au citron.'
                            {print} 'Il est délicieux.'
                        {else}
                            {print} 'Elle rentre directement à la maison.'
                    ```
                answer_code_2: |
                    ```
                    {print} 'Notre héroïne marche à travers la forêt.'
                    {print} 'Le chemin se sépare en deux.'
                    chemin = {ask} 'Quel chemin devrait-elle choisir ?'
                    arme = {ask} 'Quelle arme dégaine-t-elle ?'

                    {if} chemin {is} gauche {and} arme {is} épée
                        {print} 'Aucun montre n'ose approcher notre héroïne.'

                    {if} chemin {is} gauche {and} arme {is} lance-pierre
                        {print} 'L'héroïne est attaquée par un hibours.'

                    {if} chemin {is} droite {or} arme {is} grimoire
                        {print} 'L'héroïne rencontre un mystérieux magicien.'
                    ```
            11:
                story_text: |
                    Dans ce niveau, tu peux utiliser la commande `{for}` dans ton histoire. De cette manière, tu pourrais facilement programmer le livre pour enfant « Ours brun, que vois-tu ? »

                    ### Exercice

                    Regarde <a href="https://fliphtml5.com/jmlya/nquy"> l'histoire</a> si tu ne la connais pas déjà, et assure-toi ensuite de la programmer comme dans le livre.
                example_code: "```\nanimaux = _ , _ , _ \n{print} \"Ours brun, Ours brun\"\n{print} \"Que vois-tu ?\"\n```\n"
                answer_code: |
                    ```
                    animaux = Oiseau Rouge, Canard Jaune, Cheval Bleu, Grenouille Verte, Chat Violet, Chien Blanc, Mouton Noir, Poisson Doré, Professeur
                    {print} 'Ours brun, Ours brun'
                    {print} 'Que vois-tu' ?'
                    {for} animal {in} animaux
                        {print} Je vois un ' animal ' qui me regarde'
                        {print} animal ', ' animal
                        {print} 'Que vois-tu' ?'
                    {print} 'Je vois des enfants qui me regardent'
                    {print} 'Enfant, Enfant'
                    {print} 'Que voyez-vous' ?'
                    {print} 'Nou voyons un '
                    {for} animal {in} animaux
                        {print} animal
                    {print} 'qui nous regarde'
                    {print} 'C'est ce que nous voyons !'
                    ```
            13:
                example_code: |
                    ```
                    name = _ 
                    {print}('Bienvenue dans cette histoire !')
                    ```
                story_text: |
                    Nous allons écrire une histoire, et nous allons utiliser les accolades avec `{print}`.

                    ### Exercice
                    Crée une histoire avec au moins 5 phrases. D'abord, utilise la variable `name` dans ton histoire. Ensuite, crée deux autres variables et utilise-les aussi.
                    Note : Rappelle toi que tu peux utiliser les virgules dans un `{print}` entre du texte et des variables !
                answer_code: |
                    ```
                    name = 'Hedy'
                    {print}('Bienvenue dans cette histoire !')
                    {print}('Il était une fois un perroquet appelé ', name '.')
                    {print}(name, ' adorait programmer !')
                    {print}("Malheureusement, les autres perroquests ne savaient pas comment programmer.")
                    {print}('Un jour ', name, ' décida d'enseigner la programmation aux autres perroquets.')
                    {print}('Les leçons devinrent un énorme succès auprès des autres perroquets !')
                    ```
            16:
                story_text: "Utiliser une boucle `{while}` peut rendre vos histoires plus intéressantes. Par exemple, utiliser `{while} game == 'on'` pourrait faire durer une partie jusqu'à ce que le jeu soit fermé.\nVous pourriez également utiliser `{while} sword == 'lost'` pour que le joueur ne puisse continuer tant que l'épée n'est pas retrouvée.\n\n### Exercice\nLe code en exemple vous montre comment utiliser la boucle `{while}` dans le contexte d'une histoire. Essayez à votre tour de **trouver votre propre scénario** dans lequel le joueur doit trouver quelque chose avant de pouvoir continuer.\n"
                example_code: |
                    ```
                    clés= 'perdues'
                    {print}('Tu es dans ton jardin et tu as perdu tes clés.')
                    {print}( 'Où veux-tu les chercher ?')
                    {print}('Tu peux regarder sous : la branche, la jardinière, le caillou, la boîte aux lettres.')
                    {while} clés== 'perdues'
                        emplacement = {input}('Où veux-tu regarder ?')
                        {if} emplacement == 'la jardinière'
                            {print}( 'Elles sont là !')
                            clés = 'trouvées'
                        {else}
                            {print}('Non, elles ne sont pas sous ', emplacement)
                    {print}('Maintenant tu peux entrer dans la maison !')
                    ```
                answer_code: |
                    ```
                    raquettes= 'perdues'
                    {print}('Tu es avec tes amis et amies et vous voulez jouer au tennis, mais ta as oublié où tu as mis les raquettes.')
                    {print}('Où va tu les chercher ?')
                    {print}('Tu peux choisir : chambre, cagibi, placard, bureau')
                    {while} raquettes == 'perdues':
                        lieu = {input}('Où veux-tu chercher ?')
                        {if} lieu == 'bureau':
                            {print}('Elles sont bien là ! Tu as trouvé 6 raquettes !')
                            clés = 'trouvées'
                        {else}:
                            {print}('Non, elles ne sont pas dans ', location)
                    {print}('Maintenant tu peux jouer au tennis avec tous tes amis et amies.')
                    ```
    add_remove_command:
        name: '{add} {to_list} & {remove} {from}'
        default_save_name: add_remove_command
        description: Introduction {add} {to_list} et {remove} {from}
        levels:
            3:
                story_text: |
                    ## {add} {to_list}
                    Tu peux ajouter des éléments à une liste avec la commande `{add} {to_list}`. Pour ajouter un élément à une liste, tu peux simplement écrire : `{add} pingouin {to_list} animaux` ou tu peux utiliser la commande `{ask}` comme dans le code d'exemple.
                example_code: |
                    ```
                    animaux {is} chien, chat, kangourou
                    préféré {is} {ask} Quel est ton animal préféré ?
                    {add} préféré {to_list} animaux
                    {print} Je choisis animaux {at} {random}
                    ```
                story_text_2: |
                    ## {remove} {from}
                    Si tu peux ajouter des éléments à une liste, tu peux aussi en retirer bien sûr. Cela se fait avec la commande `{remove} {from}`.
                example_code_2: |
                    ```
                    animaux {is} chien, chat, kangourou
                    mal_aimé {is} {ask} Quel animal n'aimes-tu pas ?
                    {remove} mal_aimé {from} animaux
                    {print} Je choisis animaux {at} {random}
                    ```
                story_text_3: |
                    ### Exercice
                    Essaye les nouvelles commandes dans ce restaurant virtuel. Ajoute le parfum que le joueur désire à la liste et supprime le parfum auxquels il est allergique.
                example_code_3: |
                    ```
                    {print} Le milkshake mystérieux
                    parfums {is} fraise, chololat, vanille
                    désiré {is} {ask} Quelle parfum désires-tu ?
                    _
                    allergie {is} {ask} Es-tu allergique à un parfum ?
                    _
                    {print} Voici un milkshake parfums {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} Milkshake mystérieux
                    saveurs {is} fraise, chocolat, vanille
                    voeu {is} {ask}Quelle saveur espères-tu avoir ?
                    {add} voeu {to} saveurs
                    allergies {is} {ask} Es-tu allergique à une des saveurs ?
                    {remove} allergies {from} saveur
                    {print} Tu as obtenu un milkshake à saveurs {at} {random} 
                    ```
    and_or_command:
        levels:
            10:
                story_text: |-
                    Nous allons maintenant apprendre `{and}` et `{or}` ! Si tu veux vérifier deux expressions, tu n'as pas besoin d'utiliser deux `{if}`, tu peux plutôt utiliser `{and}` et `{or}`.
                    Si tu utilises `{and}`, alors les deux expressions, à gauche et à droite du `{and}` devront être vraies. Nous pouvons aussi utiliser `{or}`. Dans ce cas, une seule des expression devra être vraie.
                example_code: |
                    ```
                    nom = {ask} 'comment t'appelles-tu ?'
                    age = {ask} 'quel âge as-tu ?'
                    {if} nom {is} Hedy {and} age {is} 2
                        {print} 'Tu es la vraie Hedy !'
                    {elif} name {is} Hedy {or} age {is} 2
                        {print} 'Pas loin... mais tu n'es pas Hedy !'
                    {else}
