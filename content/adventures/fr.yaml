        levels:
            12:
                story_text: |
                    Dans ce niveau, tu vas apprendre à utiliser les **fonctions**. Une fonction est un bloc de code que tu peux facilement réutiliser. Utiliser les fonctions nous aide à organiser du code que nous pouvons réutiliser encore et encore.
                    Pour créer une fonction, utilise `{define}` et donne un nom à la fonction. Ensuite, ajoute toutes les lignes que tu veux dans la fonction dans un bloc indenté, sous la ligne du `{define}`.
                    Laisse une ligne vide après le bloc pour rendre ton code beau et propre. Bon travail ! tu as créé une fonction !

                    Maintenant, quand nous aurons besoin de ce bloc de code, nous pourrons juste écrire le nom de la fonction pour l'appeler ! Nous n'aurons plus besoin d'écrire ce bloc à nouveau.

                    Regarde cet exemple de code du jeu Twister. La fonction « joue_un_tour » contient un bloc de code qui choisi quel membre doit aller où.

                    ### Exercice
                    Termine ce code en complétant les lignes des deux variables `chosen_limb` et `chosen_color`.
                    Ensuite, choisi combien de fois tu veux appeler la fonction pour faire des tours de Twister.

                    ### Exercice 2
                    Améliore ton code en ajoutant une variable « personnes ». Utilise la variable pour distribuer aux joueurs et joueuses leur instruction de jeu personnelle.
                    Par exemple : « Ahmed, main droite sur vert » ou « Jessica, pied gauche sur jaune ».
                example_code: |
                    ```
                    #Entrer les options de Twister
                    cotés = "gauche", "droit(e)"
                    membres = "main", "pied"
                    couleurs = "rouge", "bleu", "vert", "jaune"

                    #Définir un tour de Twister
                    {define} tour_suivant
                        coté_choisi = cotés {at} {random}
                        membre_choisi = membres _
                        couleur_choisie = couleurs _
                        {print} membre_choisi " " coté_choisi " sur " couleur_choisie

                    #Jouer une partie de Twister
                    {print} "Jouons au Twister !"
                    {repeat} _ _
                        appelle tour_suivant
                        {sleep} 2
                    ```
                answer_code: |
                    ```
                    côtés = "gauche", "droite"
                    membres = "ta main", "ton pied"
                    couleurs = "rouge", "vert", "jaune", "bleu"
                    joueurs = "Ahmed", "Jessica"

                    {define} prochain_tour
                        {for} joueur {in} joueurs
                            côté_choisi = côtés {at} {random}
                            membre_choisi = membres {at} {random}
                            couleur_choisi = couleurs {at} {random}
                            {print} joueur ', mets ' membre_choisi ' ' côté_choisi ' sur le ' couelur_choisie
                            {sleep} 2

                    {print} "Jouons à Twister !
                    {call} prochain_tour
                    ```
            15:
                story_text: |
                    Au niveau 12, nous avons introduit la notion de fonctions. Tu écris un bout de code dans les fonctions.
                    Si tu appelles cette fonction, tout le code qui se trouve dans cette fonction sera exécuté.

                    Dans ce niveau, nous allons continuer à utiliser les fonctions et voir comment elles peuvent être encore plus utiles.
                    Nous allons commencer à les écrire comme en Python. Nous allons désormais utiliser `{def}` et ajouter `():`après le nom de la fonction.
                    Pour appeler la fonction, il suffit de taper le nom de la fonction avec les parenthèses, comme nous l'avons fait ligne 8.

                    ### Exercice
                    Ajoute une fonction qui joue un son triste (comme C6-C5-C4) et appelle la fonction quand une mauvaise réponse est donnée.
                example_code: |
                    ```
                    # Définition d'un son joyeux et d'un son triste
                    {def} joue_un_son_joyeux():
                        {play} C4
                        {play} C5
                        {play} C6

                    # Pose les questions
                    réponse = {input}("Combien font 2 + 2 ?)
                    {if} answer == 4:
                        {print}("Correct")
                        joue_un_son_joyeux()
                    {else}:
                        {print}("Faux")
                    ```
                answer_code: |-
                    ```
                    {def} joue_un_son_joyeux():
                        {play} C4
                        {play} C5
                        {play} C6

                    {def} joue_un_son_triste():
                        {play} C6
                        {play} C5
                        {play} C4

                    réponse = {input}("Combien font 2 + 2 ?)
                    {if} answer == 4:
                        {print}("Correct")
                        joue_un_son_joyeux()
                    {else}:
                        {print}("Faux")
                        joue_un_son_triste()
                    ```
