                    * lui demander sa date de naissance et afficher la réponse
                    * lui demander dans quel service est son rendez-vous
                    * lui demander le nom du médecin avec qui se passera le rendez-vous
                    * le ou la remercier pour avec réussi à s'auto-enregistrer
                    * lui indiquer d'aller dans la salle d'attente
