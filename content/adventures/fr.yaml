            3:
                story_text: |
                    Il y a un problème dans le bureau des infirmières. Toutes les infirmières se plaignent que l'emploi du temps de nuit est injuste. Certaines doivent travailler 2 nuits d'affilée dans une même semaine, alors que d'autres ne travaillent pas la nuit.
                    Peux-tu aider nos infirmières en créant un programme qui permet de réaliser un emploi du temps juste ?
                    ### Exercice
                    Ce programme doit :
                    * montrer pour chaque jour de la semaine quelle infirmière travaille de nuit
                    * s'assurer que chaque infirmière travaille une seul nuit par semaine
                    Les infirmières s'appellent : Clara, Judith, Inès, Nina, Carole, Nafissatou et Electre.
                answer_code: |
                    ```
                    infirmières {is} Clara, Judith, Inès, Nina, Carole, Nafissatou, Electre
                    infirmière_choisie {is} infirmières {at} {random}
                    {print} Le lundi sera assuré par infirmière_choisie
                    {remove} infirmière_choisie {from} infirmières
                    infirmière_choisie {is} infirmières {at} {random}
                    {print} Le mardi sera assuré par infirmière_choisie
                    {remove} infirmière_choisie {from} infirmières
                    infirmière_choisie {is} infirmières {at} {random}
                    {print} Le mercredi sera assuré par infirmière_choisie
                    {remove} infirmière_choisie {from} infirmières
                    infirmière_choisie {is} infirmières {at} {random}
                    {print} Le jeudi sera assuré par infirmière_choisie
                    {remove} infirmière_choisie {from} infirmières
                    infirmière_choisie {is} infirmières {at} {random}
                    {print} Le vendredi sera assuré par infirmière_choisie
