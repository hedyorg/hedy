                    ## O comando {print}
                    Podes imprimir texto usando o comando `{print}`.
                story_text_2: |
                    ### Exercício
                    Na Hedy vais encontrar exercícios em cada aventura. Um exercício serve para praticares novos comandos e conceitos, e deixa-te criar as tuas próprias variações sobre os exemplos.
                    Neste exercício vais ver um espaço cor-de-rosa em branco. Tens de preencher esse espaço em branco com alguma coisa para poderes correr o código.

                    Preenche o espaço com o comando `{print}` e depois adiciona mais cinco linhas de código. Cada linha tem de começar com o comando `{print}`.
                    Diverte-te!
