                story_text: |
                    我們可以使用 `{and}` 簡化超級間諜程式碼，這樣只需要一個 `{if}`。

                    ### 練習 1
                    在空格中填入正確的指令，完成程式碼。提示：超級間諜必須「兩個」問題都答對，才能取得機密資訊！

                    ### 練習 2
                    我們要讓敵人更混亂！建立一份假答案清單，並在答案錯誤時隨機選擇一項。
                example_code: |
                    ```
                    name = {ask} '你叫什麼名字？'
                    password = {ask} '你的密碼是什麼？'
                    {if} name {is} Agent007 _ password {is} TOPSECRET
                        {print} '凌晨 2 點前往機場'
                    {else}
                        {print} '上午 10 點前往火車站'
                     ```
                answer_code: |
