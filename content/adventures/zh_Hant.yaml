            10:
                story_text: |
                    在這一關，你可以使用巢狀結構，讓餐廳更真實也更有趣！

                    ### 練習
                    範例程式碼的縮排已經移除。
                    你能找出每一行需要多少縮排，讓程式正確執行嗎？
                    如果顧客點披薩，Hedy 就不應該詢問顧客想要哪種醬料。

                    **額外挑戰** 餐廳不會供應所有醬料。建立一份現有醬料清單，並在每次點餐時回答是否有販售。<br>
                    **額外挑戰** 披薩可以加配料，詢問顧客想加什麼。<br>
                    **額外挑戰** 顧客想喝飲料嗎？也問問他們！<br>
                example_code: |
                    ```
                    #歡迎客人光臨餐廳：
