adventures:
    story:
        name: 故事創作
        default_save_name: 故事
        description: 創作一則短篇故事
        levels:
            1:
                story_text: "在第 1 級中，你可以製作故事，並自行輸入不同的主角。\n\n第一行使用 `{ask}` 詢問故事的主角是誰。之後想使用角色名稱時，就使用 {answer}。\n"
                example_code: "```\n{ask} 這個故事的主角是\n{print} {answer} 現在要走進森林\n{print} {answer} 有點害怕，但還是繼續往前走\n{print} {answer} 聽到四周傳來奇怪的聲音\n{print} 他們擔心這是一座鬧鬼的森林\n```\n"
                story_text_2: |
                    ### 練習
                    現在請製作自己的故事，程式碼至少要有 6 行。
                    故事不能和範例程式碼相同。
                    至少使用一個 `{ask}` 和一個 `{answer}`。
                    主題可以自由選擇。
                    如果想不到主題，可以選擇我們提供的內容：去看電影、參加體育比賽，或到動物園玩一天。
                answer_code: |
                    ```
                    {print} 有一天，我去了動物園
                    {ask} 我第一個看到什麼動物？
                    {print} 我先看到一隻 {answer}
                    {print} 接著看到一隻企鵝
                    {print} 牠正在吃午餐
                    {ask} 企鵝在吃什麼？
                    {print} 企鵝的午餐是 {answer}
                    ```
            2:
                story_text: |
                    在第 2 關，你可以讓故事更有趣。現在主角的名字可以放在句子中的任何位置。

                    不過，你需要多寫一點程式碼：必須先為主角命名。

                    接著就能把這個名字放在句子中的任何位置。
                example_code: |-
                    ```
                    name {is} {ask} 主角叫什麼名字？
                    {print} name 現在要跑進森林
                    {print} name 有一點害怕
                    {print} 突然，她聽見一個奇怪的聲音……
                    {sleep}
                    {print} name 擔心這是一座鬧鬼的森林
                    ```
                story_text_2: |
                    ### 練習
                    現在要把變數加入上一關創作的故事。
                    前往第 1 關的故事冒險並複製程式碼，再貼到這一關的輸入畫面。

                    這段程式碼無法在本關執行，因為你還沒有使用變數。
                    運用本關學到的方式，搭配 `{ask}` 指令使用變數和 `{is}`，修正程式碼。

                    **額外挑戰** 在程式碼中加入 `{sleep}` 指令，為故事營造緊張感。
                answer_code: |
                    ```
                    {print} 有一天，我去了動物園
                    first_animal {is} {ask} 我第一個看到的動物是什麼？
                    {print} 我先看到了一隻 first_animal
                    {print} 接著我看到一隻企鵝
                    {print} 牠正在吃午餐
                    food {is} {ask} 企鵝正在吃什麼？
                    {print} 企鵝正在吃……
                    {sleep} 3
                    {print} food
                    ```
            3:
                story_text: |
                    在第 3 關，你可以讓故事變得更有趣。你可以讓怪物、動物或其他障礙物隨機出現，像這樣：
                example_code: |
                    ```
                    animals {is} 🦔, 🐿, 🦉, 🦇
                    {print} 他們現在聽見了 animals {at} {random} 的聲音
                    ```
                story_text_2: |
                    在故事中，`{add}` 指令也很方便。
                example_code_2: |
                    ```
                    {print} 他們聽見一個聲音
                    animals {is} 🐿, 🦔, 🦇, 🦉
                    animal {is} {ask} 你覺得那是什麼？
                    {add} animal {to_list} animals
                    {print} 原來是 animals {at} {random}
                    ```
                story_text_3: |
                    這是在故事中使用 `{remove}` 指令的範例。

                    ### 練習
                    把前幾關寫的故事複製到這一關。
                    這一關學了 3 個新指令：`{at} {random}`、`{add} {to_list}` 和 `{remove} {from}`。
                    在故事中加入新的程式碼，讓每個新指令都至少出現一次。
                example_code_3: |
                    ```
                    {print} 他的背包變得太重了。
                    {print} 裡面有一瓶水、一支手電筒和一塊磚頭。
                    bag {is} 水, 手電筒, 磚頭
                    dump {is} {ask} 他應該丟掉哪一樣東西？
                    {remove} dump {from} bag
                    ```
                answer_code: |
                    ```
                    animals {is} 獅子, 斑馬, 紅鶴
                    {print} 小朋友們好！今天我們要去動物園！
                    favorite_animal {is} {ask} 你今天想去看哪種動物？
                    {add} favorite_animal {to} animals
                    {sleep} 2
                    {print} 我們去找 animals {at} {random} 吧
                    {sleep}
                    least_favorite_animal {is} {ask} 你不想看到哪種動物？
                    {remove} least_favorite_animal {from} animals
                    {print} 現在去看 animals {at} {random} 吧！
                    ```
            4:
                story_text: |
                    ### 練習
                    複製範例程式碼，並在第 1 行和第 2 行的空格處加上引號，完成程式。
                    第 3 行和第 4 行的空格不能換成引號，而要分別填入 `{sleep}` 和 `{clear}` 指令。你能讓程式正確執行嗎？

                    ### 練習 2
                    回到上一關，複製你寫的故事程式碼。在正確的位置加上引號，讓程式能在這一關執行。
                    請注意：故事中的變數要放在引號外，就像範例程式碼的第 2 行；這一行把變數名稱放在引號外。
                example_code: |
                    ```
                    name {is} {ask} _ 你叫什麼名字？ _
                    {print} _ 主角叫做 _ name
                    _
                    _
                    {print} name _ 現在要走進森林 _
                    {print} name _ 有點害怕 _
                    animals {is} 🦔, 🐿, 🦉, 🦇
                    {print} _ 他聽到一隻 _ animals {at} {random} _ 的聲音
                    {print} name _ 擔心這是一座鬧鬼的森林 _
                    ```
                answer_code: |
                    ```
                    name {is} {ask} '你叫什麼名字？'
                    {print}  '主角的名字是 ' name
                    {print} name  ' 現在要走進森林'
                    {print} name ' 有一點害怕'
                    animals {is} 🦔, 🐿, 🦉, 🦇
                    {print} '他聽見了這種動物的聲音：' animals {at} {random}
                    {print} name ' 擔心這是一座鬧鬼的森林'
                    ```
            5:
                story_text: |
                    在這一關，你可以編寫不同結局，讓故事更有趣。
                    範例程式碼示範如何製作 2 種不同結局。

                    ### 練習 1
                    以自選主題寫一個至少有 6 行程式碼的新短篇故事。
                    沒有靈感嗎？可以選擇其中一個主題：超級英雄、無聊的上學日、受困荒島。

                    接著像範例程式碼一樣，讓玩家選擇快樂或悲慘的結局。
                    請把兩種結局都寫出來。

                    ### 練習 2
                    複製前幾關在故事冒險中創作的故事。
                    想辦法在故事中至少加入 2 組 `{if}` 和 `{else}` 指令。
                    可以用來製作快樂或悲慘的結局，也可以想出其他方式把指令放進故事。
                example_code: |
                    ```
                    name {is} {ask} '誰正在森林裡散步？'
                    {print} name ' 穿過森林'
                    {print} name ' 遇到了一隻怪物'
                    end {is} {ask} '你想要好結局還是壞結局？'
                    {if} end {is} good {print} name ' 拿起寶劍，怪物很快就逃走了'
                    {else} {print} '怪物吃掉了 ' name
                    ```
                answer_code: |
                    ```
                    name {is} {ask} '誰是英雄？'
                    {print} '糟糕，飛機快墜毀了，誰能救救我們？'
                    {print} "快看，是誰在空中飛？原來是 " name
                    end {is} {ask} '你要拯救飛機，還是摧毀它？'
                    {if} end {is} 拯救 {print} name "讓飛機平安降落，救了我們！"
                    {else} {print} "糟糕！" name " 正在摧毀飛機，快救命！"
                    ```
            6:
                story_text: |-
                    現在你會使用 `{elif}` 了，可以創作互動性更高的故事！例如，你可以設計多個角色，讓每個角色都有不同的特點。
                    你也可以讓玩家選擇要走哪條路、打開哪扇門，或喝下哪一瓶魔法藥水……

                    ### 練習
                    使用 `{elif}` 創作一個有 3 個以上選項的故事。
                example_code: |
                    ```
                    character {is} {ask} '誰會在冒險中幫助你？'
                    {if} character {is} 'Daisy'
                    {print} '你選了 Daisy！她是所有人當中最聰明的！'
                    {elif} character {is} 'Jason'
                    {print} '你選了 Jason！他是所有人當中最強壯的！'
                    {elif} character {is} 'Sam'
                    {print} '你選了 Sam！他是所有人當中速度最快的！'
                    ```
                answer_code: |
                    自行作答
            8:
                story_text: |
                    故事中的角色有時會重複說同一句話，例如呼救或唱歌時。
                    在這一關，你可以使用 `{repeat}` 把這種重複加入故事中。

                    ### 練習
                    在自己的故事裡加入重複內容。回到已儲存的程式，選擇你在前一關寫的故事，
                    找出包含 `{print}` 的一行，讓它重複執行！
                example_code: |
                    ```
                    {print} '王子不停大聲求救'
                    {repeat} 5 {times} {print} '救命啊！'
                    {print} '為什麼沒有人來救我？'
                    ```
                answer_code: |
                    {print} '所有孩子都想去動物園，還一直大聲喊著！'
                    {repeat} 3 {times} {print} "我們去動物園吧！"
            9:
                story_text: |
                    在這個級別中，`{if}` 指令裡可以使用多行程式碼，讓故事的快樂或悲傷結局更精彩！

                    ### 練習 1
                    範例程式碼有兩種不同結局：一種是角色跳進時光機，另一種則沒有。
                    請完成空格，每個結局至少寫一個句子。
                    **加碼挑戰** 把故事寫得更長。故事中發生了什麼事？你也可以加入第二個 `{ask}`，提供不同選項。

                    ### 練習 2
                    回到已儲存的程式，選擇第 5 級的故事程式。現在請分別寫出至少三行的好結局和壞結局！
                example_code: |
                    ```
                    {print} '糟糕！暴龍越來越近了！'
                    end = {ask} '你想要快樂還是悲傷的結局？'
                    #說出故事的快樂結局：
                    {if} end {is} 快樂
                        {print} '千鈞一髮之際，Richard 跳回了時光機！'
                        {print} _
                    #說出故事的悲傷結局：
                    {else}
                        {print} '糟糕！Richard 太慢了……'
                        {print} _
                    ```
                answer_code: |
                    ```
                    {print} '糟糕！暴龍越來越近了！'
                    end = {ask} '你想要快樂還是悲傷的結局？'
                    {if} end {is} 快樂
                        {print} '千鈞一髮之際，Richard 跳回了時光機！'
                        {print} '呼，還好我們成功了'
                        {print} '真是及時'
                    {else}
                        {print} '糟糕！Richard 太慢了……'
                        {print} '暴龍發出巨大的吼聲'
                        {print} '牠張開嘴巴，一口吞掉 Richard'
                    ```
            10:
                story_text: |
                    在這一關，你可以把 `{if}` 和 `{repeat}` 指令放進其他 `{if}` 和 `{repeat}` 指令中。
                    這會帶來許多選擇，也能幫助你創作出真正有互動的故事。

                    ### 練習 1
                    完成程式碼，讓 `{if}` 能正確執行。

                    ### 練習 2
                    在 Robin 回家的故事部分，也加入一組 `{if}` 和 `{else}`。

                    ### 練習 3
                    回到你在第 8 關寫的故事，在一個 `{if}` 裡至少再使用兩個 `{if}`。
                example_code: |
                    ```
                    {print} 'Robin 正走在市中心'
                    location = {ask} 'Robin 要進商店，還是回家？'
                    {if} location {is} 商店
                        {print} '她走進商店。'
                        {print} 'Robin 看見一本有趣的書'
                        book = {ask} 'Robin 會買這本書嗎？'
                        {if} book {is} 會
                        _ {print} 'Robin 買下這本書，然後回家'
                        _ {else}
                        _ {print} 'Robin 離開商店，然後回家'
                    {else}
                        {print} 'Robin 回家了'
                    ```
                story_text_2: |
                    使用 `{and}` 和 `{or}` 指令，可以讓故事有更多變化。你可以問兩個問題，再針對兩個答案的組合做出回應。

                    ### 練習 1
                    查看範例程式碼並完成它，接著再加入至少 2 段使用 `{and}` 或 `{or}` 的 `{if}` 程式碼。

                    ### 練習 2
                    找出前一關寫過的故事，加入一個 `{and}` 或 `{or}`。
                example_code_2: |
                    ```
                    {print} '我們的英雄正走在森林裡'
                    {print} '前方的路分成兩條'
                    path = {ask} '她該選哪條路？'
                    weapon = {ask} '她要拿出什麼武器？'
                    {if} path {is} 左邊 {and} weapon {is} 寶劍
                        _
                    ```
                answer_code: |
                    ```
                    {print} 'Robin 正走在市中心'
                    location = {ask} 'Robin 要進商店，還是回家？'
                    {if} location {is} 商店
                        {print} '她走進商店。'
                        {print} 'Robin 看見一本有趣的書'
                        book = {ask} 'Robin 會買這本書嗎？'
                        {if} book {is} 會
                            {print} 'Robin 買下這本書，然後回家'
                        {else}
                            {print} 'Robin 離開商店，然後回家'
                    {else}
                        {print} 'Robin 回家了'
                        icecream = {ask} '她回家途中會停下來吃冰淇淋嗎？'
                        {if} icecream {is} 會
                            {print} 'Robin 先停下來吃冰淇淋'
                            {print} '她選了檸檬雪酪'
                            {print} '真好吃'
                        {else}
                            {print} '她直接回家了'
                    ```
                answer_code_2: |
                    ```
                    {print} '我們的英雄走在森林裡'
                    {print} '小路分成了兩條'
                    path = {ask} '她應該選哪一條路？'
                    weapon = {ask} '她要拿出什麼武器？'

                    {if} path {is} 左邊 {and} weapon {is} 劍
                        {print} '沒有怪物敢接近英雄。'

                    {if} path {is} 左邊 {and} weapon {is} 彈弓
                        {print} '英雄遭到梟熊攻擊。'

                    {if} path {is} 右邊 {or} weapon {is} 魔法書
                        {print} '一位神祕巫師走近英雄。'
                    ```
            11:
                story_text: |
                    這個級別可以在故事中使用 `{for}` 指令。這樣就能輕鬆編寫童書《棕熊、棕熊，你看到了什麼？》。

                    ### 練習

                    如果不知道這個故事，請先看看<a href="https://fliphtml5.com/jmlya/nquy">故事內容</a>，並確認輸出結果和書中相同。
                example_code: |
                    ```
                    animals = _ , _ , _ 
                    {print} '棕熊、棕熊'
                    {print} '你看見了什麼？'
                    ```
                answer_code: |
                    ```
                    animals = 紅鳥, 黃鴨, 藍馬, 綠青蛙, 紫貓, 白狗, 黑綿羊, 金魚, 老師
                    {print} '棕熊、棕熊'
                    {print} '你看見了什麼？'
                    {for} animal {in} animals
                        {print} '我看見一隻 ' animal ' 正看著我'
                        {print} animal '、' animal
                        {print} '你看見了什麼？'
                    {print} '我看見孩子們正看著我'
                    {print} '孩子們、孩子們'
                    {print} '你們看見了什麼？'
                    {print} '我們看見了'
                    {for} animal {in} animals
                        {print} animal
                    {print} '正看著我們'
                    {print} '這就是我們看到的！'
                    ```
            13:
                story_text: |
                    我們要輸出一個故事，而且使用 `{print}` 時必須加上小括號。

                    ### 練習
                    創作一個至少有 5 句話的故事。先在故事中使用 `name` 變數，再建立另外兩個變數並使用它們。
                    提示：在 `{print}` 中，文字和變數之間要記得加上逗號！
                example_code: |
                    ```
                    name = _
                    {print}('歡迎來到這個故事！')
                    ```
                answer_code: |
                    ```
                    name = 'Hedy'
                    {print}('歡迎來到這個故事！')
                    {print}('很久很久以前，有一隻叫做 ', name, ' 的鸚鵡。')
                    {print}(name, ' 很喜歡程式設計！')
                    {print}('可惜其他鸚鵡都不會寫程式。')
                    {print}('有一天，', name, ' 決定教其他鸚鵡寫程式。')
                    {print}('其他鸚鵡都學得非常成功！')
                    ```
            16:
                story_text: |
                    使用 `{while}` 迴圈可以讓故事更有趣。例如使用 `{while} game == '進行中'`，讓玩家一直玩到遊戲結束。
                    也可以使用 `{while} sword == '不見了'`，讓玩家找到某個物品後才能繼續遊戲。

                    ### 練習
                    範例程式碼示範如何在故事中使用 `{while}` 迴圈。現在請**想出自己的情境**，讓玩家必須先找到某樣東西才能繼續。
                example_code: |
                    ```
                    keys = '不見了'
                    {print}('你站在花園裡，卻找不到鑰匙。')
                    {print}('你想去哪裡找？')
                    {print}('你可以選擇：樹、花圃、石頭、信箱')
                    {while} keys == '不見了':
                        location = {input}('你想去哪裡找？')
                        {if} location == '花圃':
                            {print}('就在這裡！')
                            keys = '找到了'
                        {else}:
                            {print}('不對，鑰匙不在 ', location)
                    {print}('現在你可以進屋了！')
                    ```
                answer_code: |
                    ```
                    rackets = '不見了'
                    {print}('你和朋友想打網球，卻忘了球拍放在哪裡。')
                    {print}('你想去哪裡找？')
                    {print}('你可以選擇：臥室、工具間、櫥櫃、書桌')
                    {while} rackets == '不見了':
                        location = {input}('你想去哪裡找？')
                        {if} location == '書桌':
                            {print}('就在這裡！你找到了 6 支球拍！')
                            keys = '找到了'
                        {else}:
                            {print}('不對，球拍不在 ', location)
                    {print}('現在你可以和所有朋友一起打網球了。')
                    ```
    add_remove_command:
        levels:
            3:
                story_text: |
                    ## {add} {to_list}
                    你可以使用 `{add} {to_list}` 指令把項目加入清單。要把項目加入清單，只要輸入：`{add} penguin {to_list} animals`，也可以像範例程式碼一樣使用 `{ask}` 指令。
                example_code: |
                    ```
                    animals {is} 狗, 貓, 袋鼠
                    like {is} {ask} 你最喜歡什麼動物？
                    {add} like {to_list} animals
                    {print} 我選擇 animals {at} {random}
                    ```
                story_text_2: |
                    ## {remove} {from}
