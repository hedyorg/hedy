    sleep_command:
        levels:
            2:
                story_text: |
                    這一關的另一個新指令是 `{sleep}`，它會讓程式暫停一秒。如果在 `{sleep}` 指令後面輸入數字，程式就會暫停該數字所代表的秒數。

                    ### 練習
                    自行編寫程式碼，至少使用 3 次 `{sleep}` 指令，練習這個新指令。每個 `{sleep}` 指令的暫停時間都要不同。
                example_code: |
                    ```
                    {print} 我最喜歡的顏色是……
                    {sleep} 2
                    {print} 綠色！
                    ```
                answer_code: |
                    ```
                    {print} 得獎者是……
                    {sleep} 2
                    {print} 瑪莉亞！
                    {print} 她贏得一輛……
                    {sleep} 1
                    {print} 全新的法拉利！
                    {print} 而且還不只這樣！
                    {print} 她還贏得……
                    {sleep} 5
                    {print} 法國之旅！
                    ```
        name: '{sleep}'
        default_save_name: 暫停指令
        description: 認識 {sleep} 指令
