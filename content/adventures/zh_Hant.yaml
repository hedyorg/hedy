                    fake_times = "晚上 10:00", "凌晨 01:00", "早上 07:00", "晚上 09:00"

                    name = {ask} '你叫什麼名字？'
                    password = {ask} '你的密碼是什麼？'

                    {if} name {is} Agent007 {and} password {is} TOPSECRET
