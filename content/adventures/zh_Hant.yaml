            10:
                story_text: |
                    急診室工作人員遇到一個問題：很多前來的病人其實並非緊急狀況，應該去看家庭醫師。
                    這些病人擠滿候診室，也讓工作人員的負擔大幅增加。你能製作一個檢傷應用程式，告訴病人是否需要去急診室，協助急診室工作人員嗎？
                    ### 練習
                    程式應告訴病人應該「立刻前往急診室」、「聯絡醫療服務人員討論狀況」，或「方便時盡快去看家庭醫師」。
                    程式會提出這些問題：
                    * 你的狀況會危及生命嗎？
                    * 你呼吸困難嗎？
                    * 你是否突然無法說話、看見、走路或移動？
                    * 你是否吞下或吸入毒物？
                    * 你有骨折嗎？
                    * 你有嚴重的過敏反應嗎？
                    * 你有劇烈疼痛嗎？

                    如果病人對任何一題回答「是」，程式就會請他立刻前往急診室，也不再詢問其他問題，因為時間非常重要。
                    如果病人對所有問題都回答「否」，程式會再問：
                    * 可以等到明天嗎？
                    如果回答「是」，程式會請病人在方便時盡快去看家庭醫師；如果回答「否」，程式會建議聯絡醫療服務人員討論狀況。
                answer_code: |
                    ```
                    lifethreatening = {ask} '你的狀況會危及生命嗎？'
                    {if} lifethreatening {is} '是'
                        {print} '請立刻前往急診室！'
                    {else}
                        breathing = {ask} '你呼吸困難嗎？'
                        {if} breathing {is} '是'
                            {print} '請立刻前往急診室！'
                        {else}
                            ability = {ask} '你是否突然無法說話、看見、走路或移動？'
                            {if} ability {is} '是'
                                {print} '請立刻前往急診室！'
                            {else}
                                poison = {ask} '你是否吞下或吸入毒物？'
                                {if} poison {is} '是'
                                    {print} '請立刻前往急診室！'
                                {else}
                                    broken_bone = {ask} '你有骨折嗎？'
                                    {if} broken_bone {is} '是'
                                        {print} '請立刻前往急診室！'
                                    {else}
                                        allergy = {ask} '你有嚴重的過敏反應嗎？'
                                        {if} allergy {is} '是'
                                            {print} '請立刻前往急診室！'
                                        {else}
                                            wait = {ask} '可以等到明天嗎？'
                                            {if} wait {is} '是'
                                                {print} '方便時請盡快去看家庭醫師。'
                                            {else}
                                                {print} '請聯絡醫療服務人員討論你的狀況'
                    ```
