                story_text_2: |
                    在這一關，你會學習新指令，進一步擴充程式碼。

                    ### 練習 1
                    在程式中合適的位置放入 `{and}` 和 `{or}`。

                    ### 練習 2
                    為餐廳至少再加入一個 `{and}` 和一個 `{or}`。
                    例如製作只適用於披薩的特殊優惠券，或是點薯條和鬆餅時免費送飲料。當然也可以想出完全不同的做法！
                example_code_2: |
                    ```
                    price = 10
                    food = {ask} '你想吃什麼？'
                    drinks = {ask} '你想喝什麼？'
                    {if} food {is} 三明治 _ drinks {is} 果汁
                        {print} '這是我們的優惠套餐'
                        price = price - 3
                    {if} drinks {is} 水 _ drinks {is} 果汁
                        {print} '這是健康的選擇'
                    {print} '總共是 ' price ' 元'
                    ```
