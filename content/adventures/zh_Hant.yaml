            11:
                story_text: |
                    在這一關，你會學習如何編寫 MASH（豪宅、公寓、棚屋、房子）遊戲。這個遊戲可以一次預測所有玩家的未來。

                    ### 練習
                    使用這一關學到的新指令填入空格。
                example_code: |
