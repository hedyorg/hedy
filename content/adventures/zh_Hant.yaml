    elif_command:
        levels:
            6:
                story_text: |
                    在這一關，你也能使用新指令：`{elif}`。`{elif}` 是 `{else}` 和 `{if}` 指令的組合，想建立 3 個（或更多）選項時就需要它。
                    注意：現在使用 {if}、{else} 或 {elif} 時要分成 2 行。第一行放 {if} 指令（例如 `{if} name {is} Hedy`），第二行則放條件成立時要執行的內容（例如 `{print} hello`）。
                    來看看吧！
                    ### 練習
                    製作自己的幸運轉盤，讓玩家可以贏得不同獎品，並顯示相對應的回應。
                example_code: |
                    ```
                    prizes {is} 100 萬美元, 蘋果派, 什麼都沒有
                    your_prize {is} prizes {at} {random}
                    {print} '你贏得了 ' your_prize
                    {if} your_prize {is} 100 萬美元
                    {print} '太好了！你發財了！'
                    {elif} your_prize {is} 蘋果派
                    {print} '真棒，是蘋果派！'
                    {else}
                    {print} '下次再接再厲……'
                    ```
                answer_code: |
                    自行作答
        name: '{elif}'
        default_save_name: 否則如果
        description: '{elif}'
    for_command:
        levels:
            11:
                story_text: |-
                    ## For
                    在這一關，我們要學習名為 `{for}` 的新程式碼。使用 `{for}` 可以建立清單，並使用清單中的每一個項目。
                    `{for}` 和 `{repeat}`、`{if}` 一樣會建立區塊，所以區塊中的每一行都要以 4 個空格開頭。
                example_code: |
                    ```
                    animals = 狗, 貓, 水滴魚
                    {for} animal {in} animals
                        {print} '我喜歡 ' animal
                    ```
                story_text_2: |
                    ### 練習
                    在第 2 行加入 `{for} action {in} actions`，完成這段程式碼。
                example_code_2: |
                    ```
                    actions = 拍拍手, 踏踏腳, 大喊好棒！
                    _
                        {repeat} 2 {times}
                            {print} '如果感到幸福，你就 ' action
                            {sleep} 2
                        {print} '如果感到幸福，而且真的想讓大家知道'
                        {print} '如果感到幸福，你就 ' action
                        {sleep} 3
                    ```
                answer_code: |
                    ```
                    actions = 拍拍手, 踏踏腳, 大喊好棒！
                    {for} action {in} actions
                        {repeat} 2 {times}
                            {print} '如果感到幸福，你就 ' action
                            {sleep} 2
                        {print} '如果感到幸福，而且真的想讓大家知道'
                        {print} '如果感到幸福，你就 ' action
                        {sleep} 3
                    ```
            14:
                story_text: |
                    最後，我們要把 `{repeat} 5 {times}` 改寫成真正的 Python 程式碼。和 `{if}` 一樣，必須使用冒號，像這樣：
                example_code: |
                    ```
                    {for} i {in} {range}(1,5):
                        {print}(i)
                    ```
                story_text_2: |
                    請記得，這個指令搭配清單使用也非常實用。
                    你可以使用變數 `{in} {range}` 配對 2 份清單。 
                example_code_2: |
                    ```
                    friends = ['Ahmed', 'Ben', 'Cayden']
                    lucky_numbers = [15, 18, 6]
                    {for} i {in} {range}(1, 3):
                        {print}(friends[i], ' 的幸運數字是 ', lucky_numbers[i])
                    ```
                answer_code: |
                    自行作答
        name: '{for}'
        default_save_name: for 迴圈
        description: '{for} 指令'
    fortune:
        levels:
            1:
                story_text: |
                    你曾在嘉年華裡請占卜師預測未來嗎？或是玩過神奇八號球？
                    那麼你大概知道，它們其實無法預測未來，但玩起來還是很有趣！

                    接下來幾關，你會學會製作自己的占卜機！
                    在第 1 關先從簡單的開始：讓 Hedy 自我介紹是一位占卜師，並重複玩家的回答。
                    就像這樣：
                example_code: |
                    ```
                    _ 哈囉，我是占卜師 Hedy！
                    _ 你是誰？
                    _ 讓我看看水晶球
                    _ 我看見了……我看見了……
                    _ 你的名字是 _
                    ```
                story_text_2: |
                    ### 練習
                    把範例程式碼複製到輸入畫面並填入空格，讓程式能夠執行。
                    **額外挑戰** 修改程式碼，讓占卜師不只預測你的名字，也能預測年齡、最喜歡的球隊或其他關於你的事情。
                answer_code: |
                    ```
                    {print} 哈囉，我是占卜師 Hedy！
                    {ask} 你是誰？
                    {print} 讓我看看水晶球
                    {print} 我看見了……我看見了……
                    {print} 你的名字是 {answer}
                    {ask} 你今年幾歲？
                    {print} 真有意思
                    {print} 我的水晶球告訴我，你是 {answer} 歲
                    {ask} 你從事哪一種運動？
                    {print} 球……這顆球……
                    {print} 它告訴我，你最喜歡的運動……
                    {print} 它說你會 {answer}
                    ```
            3:
                story_text: |
                    前幾關中，你製作了第一台占卜機，但 Hedy 還不是真的能預測任何事情。
                    在這一關，你可以使用變數和 `{at} {random}` 指令，讓 Hedy 真的為你挑選一個答案。請看看這段程式碼：
                example_code: |
                    ```
                    {print} 我是占卜師 Hedy！
                    question {is} {ask} 你想知道什麼？
                    {print} 你想知道的是：question
                    answers {is} 會, 不會, 也許
                    {print} 我的水晶球說……
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
                story_text_2: |
                    ### 練習
                    現在 Hedy 只能回答「會」、「不會」或「也許」。你能增加更多選項嗎？例如「一定會」或「再問一次」。
                answer_code: |-
                    ```
                    {print} 我是占卜師 Hedy！
                    question {is} {ask} 你想知道什麼？
                    {print} 你想知道的是：question
                    answers {is} 會, 不會, 也許, 一定會, 我不知道, 再試一次
                    {print} 我的水晶球說……
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
            4:
                story_text: |
                    ### 練習
                    我們把這段範例程式碼中的引號全部拿掉了。你能在正確的位置把引號補回去嗎？

                    ### 練習 2
                    回到上一關，複製你的算命師程式碼。在正確的位置加上引號，讓程式能在這一關執行。
                example_code: |
                    ```
                    _ 請為這段程式碼加上引號 _
                    {print} 我是占卜師 Hedy！
                    question {is} {ask} 你想知道什麼？
                    {print} 你的問題是： question
                    answers {is} 是, 否, 也許
                    {print} 我的水晶球說……
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} "我是占卜師 Hedy！"
                    question {is} {ask} '你想知道什麼？'
                    {print} '你的問題是：'  question
                    answers {is} 會, 不會, 也許
                    {print} '我的水晶球說……'
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
            6:
                story_text: |
                    ### 練習
                    範例程式碼示範如何製作一個偷偷偏袒你的算命程式。這個作弊程式總是會告訴你將中樂透，但你的朋友永遠不會中獎。

                    運用這個概念製作自己的程式，發揮創意！例如，你可以讓程式預測：
                    * 你最喜歡的運動隊伍會打敗所有對手！
                    * 電影之夜會選中你最喜歡的電影！
                    * 你會贏得最喜歡節目的門票！
                    * 就像白雪公主故事中的魔鏡，你是所有人中最美的。
                    盡情發揮想像力！

                    你的程式至少要有 10 行程式碼，而且至少要包含一個 `{if}` 和一個 `{else}` 指令。
                example_code: |
                    ```
                    friends {is} Jordan, Lucy, Dave
                    {print} '我可以預測你明天會不會中樂透！'
                    person {is} {ask} '你是誰？'
                    good_answer {is} 太棒了！你中獎了！, 你一定會中獎！, 我們找到得獎者了！
                    bad_answer {is} 運氣不好！再試一次！, 會是別人中獎, 你沒中獎！
                    {if} person {in} friends
                    {print} bad_answer {at} {random}
                    {else}
                    {print} good_answer {at} {random}
                    ```
                answer_code: |
                    ```
                    friends {is} Jordan, Lucy, Dave
                    {print} '我可以預測未來……'
                    {sleep} 2
                    {clear}
                    {print} '我可以預測你最喜歡的球隊會不會獲勝'
                    person {is} {ask} '你是誰？'
                    good_answer {is} 太棒了！你的球隊會獲勝！, 你的球隊一定會獲勝！, 你的球隊會贏！太好了！
                    bad_answer {is} 運氣不好！你的球隊不會獲勝！, 糟糕……你最喜歡的球隊會輸……, 你最喜歡的球隊會輸
                    {if} person {is} {in} friends
                    {print} bad_answer {at} {random}
                    {else}
                    {print} good_answer {at} {random}
                    ```
            7:
                story_text: |
                    在這一關，你可以在占卜預測中使用數學運算。這樣就能編造一些（傻呼呼的）公式來計算未來。
                    例如計算將來會多有錢，或長大後會有幾個孩子。

                    ### 練習
                    你能想出自己的（傻呼呼）占卜機嗎？
                example_code: |
                    ```
                    {print} '我是算命師 Hedy！'
                    {print} '我可以預測你長大後會有幾個小孩！'
                    age = {ask} '你幾歲？'
                    siblings = {ask} '你有幾個兄弟姊妹？'
                    length = {ask} '你的身高是幾公分？'
                    kids = length / age
                    kids = kids - siblings
                    {print} '你將會有……'
                    {sleep}
                    {print} kids '個小孩！'
                    ```
                answer_code: |
                    自行作答
            8:
                story_text: |
                    ### 練習
                    完成這個程式，讓它告訴你喜歡的人是否也喜歡你。
                example_code: |
                    ```
                    {print} '我有一朵帶著魔法花瓣的花'
                    {print} '摘下花瓣，它就會告訴你喜歡的人是否也喜歡你'
                    amount = {ask} '你想摘幾片花瓣？'
                    options = 喜歡你, 不喜歡你
                    _ _ _ _ options {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} '我有一朵花瓣有魔力的花'
                    {print} '摘下花瓣，這朵花就會告訴你喜歡的人是否也喜歡你'
                    amount = {ask} '你想摘下幾片花瓣？'
                    options = 喜歡你, 不喜歡你
                    {repeat} amount {times} {print} options {at} {random}
                    ```
            9:
                story_text: |
                    下一個範例會讓占卜師提出多個問題，並輸出每個問題！

                    ### 練習
                    你能在空格中填入正確的指令嗎？
                example_code: |
                    ```
                    #介紹算命師
                    {print} '我是算命師 Hedy！'
                    {print} '你可以問我 3 個問題。'
                    answers = 會, 不會, 也許
                    #問問題並回答，重複 3 次：
                    _ _ _
                       question = {ask} '你想知道什麼？'
                       {print} question
                       {sleep}
                       {print} '我的水晶球顯示……' answers {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} '我是算命師 Hedy！'
                    {print} '你可以問我 3 個問題。'
