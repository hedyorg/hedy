    quotation_marks:
        levels:
            4:
                story_text: |
                    ## 「引號」
                    在第 4 關，`{ask}` 和 `{print}` 的用法改變了。
                    你必須把想要輸出的文字放在引號裡。
                    這很實用，因為現在你想輸出什麼文字都可以，也能輸出先前用 `{is}` 儲存的內容。
                    大多數程式語言在輸出文字時也會使用引號，所以我們又向真正的程式設計邁進了一步！
                example_code: |
                    ```
                    {print} '從現在開始，你必須使用引號！'
                    answer {is} {ask} '從現在開始，我們必須使用什麼？'
                    {print} '我們必須使用 ' answer
                    ```
                story_text_2: |
                    ## 縮寫
                    注意！現在開始使用引號後，如果你在 I'm 或 What's 之類的縮寫中使用單引號，Hedy 會分不清楚。
                    同一行中使用單引號時，請務必用雙引號包住文字！
                    看看範例程式碼，了解使用單引號的錯誤方式。
                example_code_2: |
                    ```
                    _ 這是使用單引號的錯誤方式 _
                    {print} 'I'm babysitting my sister's kids'
                    {print} 'What's more fun than that?'
                    _ 這是解決方法 _
                    {print} "I'm babysitting my sister's kids"
                    {print} "What's more fun than that?"
                    ```
                answer_code: |
                    自行作答
        name: 「引號」
        default_save_name: 引號
        description: 認識引號
    random_command:
        levels:
            3:
                story_text: |
                    ## 隨機選擇
                    在這一關，你可以使用 `{is}` 指令建立清單，再讓電腦從清單中隨機選擇一個項目。方法是使用 `{at} {random}`。
                example_code: |
                    ```
                    animals {is} 狗, 貓, 袋鼠
                    {print} animals {at} {random}
                    ```
                story_text_2: |
                    你也可以在句子中使用 `{at} {random}` 指令。
                example_code_2: |
                    ```
                    food {is} 三明治, 一片披薩, 沙拉, 墨西哥捲餅
                    {print} 我午餐要吃 food {at} {random}。
                    ```
                story_text_3: |
                    ### 練習
                    試著使用 `{at} {random}` 指令製作自己的遊戲節目（就像電視上的節目），讓玩家選一扇門或一個行李箱，裡面藏著大獎！
                    你做得到嗎？我們已經把前幾行放進範例程式碼了。
                example_code_3: |
                    ```
                    {print} 大型遊戲節目！
                    {print} 你面前有 3 個行李箱……
                    chosen {is} {ask} 你要選哪個行李箱？
                    prizes {is} _
                    _
                    ```
                answer_code: |-
                    ```
                    {print} 大型猜獎節目！
                    {print} 你面前有 3 個行李箱……
                    chosen {is} {ask} 你要選哪個行李箱？
                    prices {is} 一份塔可, 一枝筆, 一百萬元
                    {print} 你贏得了…… prices {at} {random}
                    ```
            14:
                story_text: |-
                    你已經學會在清單中使用中括號，現在也要介紹另一種使用 `{at} {random}` 指令的方法。
                    只要在清單名稱後面加上 `[random]`，也就是平常輸入數字的位置！
                example_code: |-
                    ```
                    fruit = ['蘋果', '香蕉', '櫻桃']
                    {print}(fruit[random])
                    ```
                story_text_2: |-
                    ### 練習
                    完成程式碼，讓電腦隨機選出一位得獎者。
                example_code_2: |-
                    ```
                    names = _'Sarah', 'Jason', 'Meghan'_
                    {print}('得獎者是：' _ )
                    ```
                answer_code: |
                    ```
                    names = ['Sarah', 'Jason', 'Meghan']
                    {print}('得獎者是：' names[random] )
                    ```
        name: '{random}'
        default_save_name: 隨機指令
        description: 認識 {at} {random} 指令
    repeat_command:
        levels:
            8:
                story_text: |
                    這一關會加入 `{repeat}` 指令。`{repeat}` 可以讓一行程式碼執行多次，像這樣：

                    ### 練習
                    試試 `{repeat}` 指令。現在你能把原本 4 行的生日快樂歌改成只用 3 行程式碼嗎？
                example_code: |
                    ```
                    {repeat} 3 {times} {print} 'Hedy 真好玩！'
                    ```
                answer_code: |
                    ```
                    {repeat} 2 {times} {print} '祝你生日快樂'
                    {print} '親愛的 Hedy，祝你生日快樂'
                    {print} '祝你生日快樂'
                    ```
            9:
                story_text: |
                    在這一關，只要使用 1 個 `{repeat}` 指令，就能重複多行程式碼。
                    方法是把想重複的程式碼行組成一個區塊。
                    這個區塊中的每一行都需要**縮排**。
                    也就是在每一行開頭加上四個空格。即使區塊中只有一行，也必須縮排。
                example_code: |
                    ```
                    {repeat} 5 {times}
                        {print} '大家好'
                        {print} '這些內容全部會重複 5 次'
                    ```
                answer_code: |
                    ```
                    {print} 'Do you know the muffin man?'
                    {repeat} 2 times
                        {print} 'The muffin man'
                    {print} 'Do you know the muffin man, who lives on Drury Lane?'
                    ```
            10:
                story_text: |
                    做得好！你又來到新的一關！上一關教過如何在 `{if}` 或 `{repeat}` 指令中使用多行程式碼。
                    但你還不能把兩者組合起來……

                    太好了！在這一關，你可以把 `{if}` 放進另一個 `{if}`，把 `{repeat}` 放進另一個 `{repeat}`，也可以互相放進對方裡。
                    試試看吧！
                example_code: |
                    ```
                    {repeat} 3 {times}
                        order = {ask} '你想點什麼？'
                        {if} order {is} 披薩
                            {print} '真好吃'
                        {else}
                            {print} '披薩更好吃！'
                    ```
                answer_code: |
                    自行作答
        name: '{repeat}'
        default_save_name: 重複指令
        description: '{repeat} 指令'
    repeat_command_2:
        levels:
            8:
                story_text: |
                    ## 搭配其他指令和變數重複執行
                    你已經練習了把 `{repeat}` 指令搭配 `{print}` 指令使用，但你知道 `{repeat}` 也能搭配其他指令嗎？
                    在這段範例程式碼中，你可以看到 `{repeat}` 也能搭配 `{ask}`、`{if}` 或 `{else}` 指令使用。
                example_code: |
                    ```
                    {repeat} 2 {times} answer = {ask} '你知道可以重複問同一個問題嗎？'
                    {if} answer {is} 知道
                    {repeat} 2 {times} {print} '原來你已經知道了！'
                    {else}
                    {repeat} 3 {times} {print} '你學會了新東西！'
                    ```
                story_text_2: |
                    `{repeat}` 指令還有另一種有趣的用法：使用變數設定某個動作要重複幾次。在範例程式碼中，我們先詢問使用者幾歲。
                    接著在第 3 行，問題會重複 `age` 次。也就是說，我們把 `age` 變數和 `{repeat}` 指令搭配使用。
                example_code_2: |
                    ```
                    {print} '太好了！今天是你的生日！'
                    age = {ask} '你現在幾歲？'
                    {repeat} age {times} {print} '生日快樂！'
                    ```
                answer_code: |
                    自行作答
            9:
                story_text: |
                    ### 在區塊裡，還是不在？
                    這一關必須仔細思考哪些程式碼行應該在區塊中，哪些不應該。
                    例如要唱〈賣鬆餅的人〉時，只有包含「賣鬆餅的人」的那一行要重複兩次。
                    這表示最後一行不屬於區塊，因此開頭不應縮排。
                    如果最後一行也縮排，歌曲就會不正確。

                    ### 練習
                    範例程式碼的每一行開頭都有空格。移除這些空格，再判斷哪些行需要縮排、哪些不需要，讓〈賣鬆餅的人〉正確播放。
                example_code: |
                    ```
                    _ {print} 'Do you know the muffin man?'
                    _ {repeat} 2 {times}
                    _ {print} 'The muffin man'
                    _ {print} 'Do you know the muffin man, who lives on Drury Lane?'
                    ```
                answer_code: |
                    ```
                    {print} 'Do you know the muffin man?'
                    {repeat} 2 {times}
                        {print} 'The muffin man'
                    {print} 'Do you know the muffin man, who lives on Drury Lane?'
                    ```
        name: '{repeat} 2'
        default_save_name: 重複指令_2
        description: '{repeat} 指令 2'
    restaurant:
