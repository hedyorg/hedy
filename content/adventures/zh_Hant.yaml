    piggybank:
        levels:
            7:
                story_text: |
                    在這個冒險中，你會學習製作數位撲滿。

                    ### 練習
                    完成程式碼，計算你有多少錢，以及要存多久才能買到想要的東西！
                    **額外挑戰** 也許你已經存了一些錢？從還需要存的金額中扣掉它。
                example_code: |
                    ```
                    {print} '數位撲滿'
                    #詢問收入和想購買的物品
                    wish = {ask} '你想買什麼？'
                    price = {ask} '它要多少錢？'
                    saved = {ask} '你已經存了多少錢？'
                    allowance = {ask} '你每週有多少零用錢？'
                    #計算需要存錢的時間
                    to_save = price - saved
                    weeks = to_save / allowance
                    {print} '你可以在 ' _ ' 週後買到 ' _ '。'
                    ```
                answer_code: |
                    ```
                    {print} '數位撲滿'
                    wish = {ask} '你想買什麼？'
                    price = {ask} '那要多少錢？'
                    saved = {ask} '你已經存了多少錢？'
                    allowance = {ask} '你每週有多少零用錢？'
                    to_save = price - saved
                    weeks = to_save / allowance
                    {print} '再過' weeks '週，你就能買' wish '。'
                    ```
            15:
                story_text: |
                    ### 練習
                    在這一關，你可以讓 Hedy 告訴你錢是否已經存夠了！
                    填入空格，完成這段程式碼！
                example_code: |
                    ```
                    _ calculate_budget(wish, money, allowance):
                        to_save = wish - money
                        weeks = to_save / allowance
                        {if} wish _ money:
                            {print}('你還需要再存一些錢！')
                            {print}("你還需要 ', weeks, ' 週。")
                        {else}:
                            {print}('太棒了！你的錢已經夠了')
                            {print}("我們去買東西吧！")

                    money = {input}('你已經存了多少錢？')
                    wish = {input}('你需要多少錢？')
                    allowance = {input}('你每週有多少零用錢？')

                    _
                    ```
                answer_code: |
                    ```
                    {def} calculate_budget(wish, money, allowance):
                        to_save = wish - money
                        weeks = to_save / allowance
                        {if} wish > money:
                            {print}('你還需要再存一些錢！')
                            {print}('你還需要 ', weeks ', 週。')
                        {else}:
                            {print}("太棒了！你的錢已經夠了")
                            {print}("我們去買東西吧！")

                    money = {input}('你已經存了多少錢？')
                    wish = {input}('你需要多少錢？')
                    allowance = {input}('你每週有多少零用錢？')

                    calculate_budget(wish, money, allowance)
                    ```
        name: 撲滿
        default_save_name: 撲滿
        description: 算算你的零用錢！

    print_command:
        levels:
            1:
                story_text: |
                    ## `{print}` 指令
                    你可以使用 `{print}` 指令，把文字輸出到畫面上。
                example_code: |
                    ```
                    {print} 嗨，程式設計師！
                    {print} 歡迎來到 Hedy！
                    ```
                story_text_2: |
                    ### 練習
                    Hedy 的每個冒險中都有練習。練習可以幫助你熟悉新指令和概念，也能讓你用自己的創意改編範例程式碼。
                    在這個練習中，你會看到一個粉紅色的空格。執行程式碼前，必須在空格處填入內容。

                    在空格中填入 `{print}` 指令，再加入五行程式碼。每一行都必須以 `{print}` 指令開頭。
                    玩得開心！
                example_code_2: |
                    ```
                    _ 哈囉！
                    ```
                answer_code: |
                    ```
                    {print} 哈囉！
                    {print} 我正在寫程式
                    {print} 這太簡單了
                    {print} 而且非常酷！
                    {print} 這才只是第 1 關
                    {print} 希望我能學到更多！
                    ```
            13:
                story_text: |-
                    我們已經來到更像真正 Python 的程式碼了！
                    這一關不會介紹任何新指令，只會介紹一種稍微不同、也更接近 Python 的寫法。
                    也就是說，從現在開始使用 `{print}` 時必須加上小括號。
                    這也代表，只要使用英文指令，就可以把這一關開始的基本 Hedy 程式碼用在任何 Python 環境中。
                    如果還沒切換，可以在指令選單中開啟切換開關。
                example_code: |
                    ```
                    {print}('你好！')
                    ```
                story_text_2: 如果要輸出多個項目，必須使用逗號分隔。
                example_code_2: |
                    ```
                    temperature = 25
                    {print}('外面的溫度是 ', temperature, ' 度')
                    ```
                    ```
                    name = 'Hedy'
                    {print} _ '我的名字是 ', name _
                    ```
                answer_code: |
                    自行作答
        name: '{print}'
        default_save_name: 輸出
        description: 認識輸出指令
    quizmaster:
