                answer_code: |
                    ```
                    {print} 歡迎光臨 Hedy 的餐廳 🍟
                    {ask} 你想點什麼？
                    {print} 所以你想點 {answer}
                    {ask} 你想喝什麼？
                    {print} 所以你想喝 {answer}
