    if_command:
        levels:
            5:
                story_text: |
                    ## 如果……否則……
                    第 5 關出現了一個新指令：`{if}`！你可以使用 `{if}` 在兩個不同選項中做選擇。
                    在這段程式碼中，如果輸入的名字是 Hedy，就會輸出「很好」；如果輸入其他名字，就會輸出「噓！」。
                    `{ask}` 和 `{print}` 的用法仍然和第 4 關一樣。
                example_code: |
                    ```
                    name {is} {ask} '你叫什麼名字？'
                    {if} name {is} Hedy {print} '很好' {else} {print} '才怪！'
                    ```
                story_text_2: |
                    有時候，包含 `{if}` 的程式碼會很長，一行放不下。<br>你也可以把程式碼分成兩行，第二行從 `{else}` 開始，像這樣：
                example_code_2: |
                    ```
                    name {is} {ask} '你叫什麼名字？'
                    {if} name {is} Hedy {print} '很好'
                    {else} {print} '噓！'
                    ```
                story_text_3: |
                    ### 練習
                    試著用 `{if}` 和 `{else}` 編寫自己的程式碼。你也可以使用範例程式碼。
                example_code_3: |
                    ```
                    answer {is} {ask} '2 + 2 = ?'
                    _ _ _ 4 _ '太棒了！'
                    _ _ '不對，2 + 2 = 4'
                    ```
                answer_code: |
                    ```
                    answer {is} {ask} '2 + 2 = ?'
                    {if} answer {is} 4 {print} '太棒了！'
                    {else} {print} '不對，2 + 2 = 4'
                    ```
            9:
                story_text: |
                    ## If... Else...
                    你已經學會在 `{repeat}` 指令後面建立一段重複執行的程式碼區塊。
                    現在也能使用縮排，在 `{if}` 或 `{else}` 指令後面建立區塊。
                    請看看範例程式碼。

                    ### 練習
                    在範例程式碼中加入 `{else}` 指令，並使用縮排建立程式碼區塊。方法是在每一行開頭加上 4 個空格。
                example_code: |
                    ```
                    name = {ask} '你叫什麼名字？'
                    {if} name {is} Hedy
                        {print} '歡迎你，Hedy'
                        {print} '你可以玩電腦了！'
                    ```
                answer_code: |
                    ```
                    name = {ask} '你叫什麼名字？'
                    {if} name {is} Hedy
                        {print} '歡迎你，Hedy'
                        {print} '你可以玩電腦！'
                    {else}
                        {print} '發生錯誤……'
                        {sleep} 2
                        {print} '你不是 Hedy！'
                    ```
            10:
                story_text: |
                    在這一關，你也可以把一個 `{if}` 指令放進另一個 `{if}` 指令中。
                example_code: |
                    ```
                    continue = {ask} '你要繼續嗎？'
                    {if} continue is 要
                        sure = {ask} '你確定嗎？'
                        {if} sure {is} 確定
                            {print} '我們會繼續'
                        {else}
                            {print} '你還不確定'
                    {else}
                        {print} '你不想繼續'
