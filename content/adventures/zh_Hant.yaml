    functions:
        levels:
            12:
                story_text: |
                    在這一關，你會學習如何使用**函式**。函式是一段可以輕鬆重複使用的程式碼。使用函式能幫助我們整理會一再使用的程式碼。
                    若要建立函式，請使用 `{define}` 並為函式命名。接著，把函式中的所有程式碼放在 `{define}` 那一行下方，組成一個有縮排的區塊。
                    在程式碼中空一行，看起來會更整齊。做得好！你已經建立了一個函式！

                    以後需要這段程式碼時，只要用函式名稱呼叫它就可以了！不必重新輸入整段程式碼。

                    看看這個扭扭樂遊戲的範例程式碼。`turn` 函式中的程式碼會決定哪個手腳要放到哪裡。

                    ### 練習
                    設定 `chosen_limb` 和 `chosen_color` 這 2 個變數，完成這段程式碼。
                    接著，選擇要呼叫函式幾次，也就是讓扭扭樂轉盤轉幾次。

                    ### 練習 2
                    加入一個名為 `people` 的變數，改進你的程式碼。使用這個變數，分別向每位玩家下達遊戲指令。
                    例如：「Ahmed，右手放在綠色上」或「Jessica，左腳放在黃色上」。
                example_code: |
                    ```
                    #提供扭扭樂的選項：
                    sides = '左', '右'
                    limbs = '手', '腳'
                    colors = '紅色', '藍色', '綠色', '黃色'

                    #定義扭扭樂的一個回合：
                    {define} next_turn
                        chosen_side = sides {at} {random}
                        chosen_limb = limbs _
                        chosen_color = colors _
                        {print} chosen_side chosen_limb ' 放在' chosen_color '上'

                    #玩扭扭樂：
                    {print} '來玩扭扭樂吧！'
                    {repeat} _ _
                        call next_turn
                        {sleep} 2
                    ```
                answer_code: |
                    ```
                    sides = '左', '右'
                    limbs = '手', '腳'
                    colors = '紅色', '藍色', '綠色', '黃色'
                    players = 'Ahmed', 'Jessica'

                    {define} next_turn
                        {for} player {in} players
                            chosen_side = sides {at} {random}
                            chosen_limb = limbs {at} {random}
                            chosen_color = colors {at} {random}
                            {print} player '，把你的' chosen_side chosen_limb ' 放在' chosen_color '上'
                            {sleep} 2

                    {print} '來玩扭扭樂吧！'
                    {call} next_turn
                    ```
            15:
                story_text: |
                    在第 12 關，我們介紹了函式。你會把一段程式碼寫在函式裡。
                    呼叫函式時，函式裡的所有程式碼都會執行。需要重複一段程式碼時非常方便！

                    這一關會繼續學習函式，看看它還能多實用。
                    我們會開始採用 Python 的寫法：現在使用 `{def}`，並在函式後面加上 `():`。
                    要呼叫函式，只要輸入函式名稱和 ()，就像第 8 行一樣。

                    ### 練習
                    加入一個播放悲傷旋律（例如 C6-C5-C4）的函式，並在答案錯誤時呼叫它。
                example_code: |
                    ```
                    #定義快樂和悲傷的旋律：
                    {def} play_happy_tune():
                        {play} C4
                        {play} C5
                        {play} C6

                    #提出問題：
                    answer = {input}('2 + 2 是多少？')
                    {if} answer == 4:
                        {print}('答對了！')
                        play_happy_tune()
                    {else}:
                        {print}('答錯了！')
                    ```
                answer_code: |-
                    ```
                    {def} play_happy_tune():
                        {play} C4
                        {play} C5
                        {play} C6

                    {def} play_sad_tune():
                        {play} C6
                        {play} C5
                        {play} C4

