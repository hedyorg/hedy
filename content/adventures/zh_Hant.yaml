                    `{if}` 敘述中必須放入條件。在這一關，條件的寫法也有些改變：從本關開始，我們會使用符號而不是文字。
                    以前只使用 `{is}` 比較兩個內容，現在可以使用兩個等號：`==`。大多數程式語言也是這樣做。
                    現在 if 敘述的結尾也必須加上冒號。
