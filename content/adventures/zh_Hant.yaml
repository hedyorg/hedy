                    首先，為手環上要使用的**每種形狀**定義一個函式。接著像這樣把形狀加入手環：

                    手環設計程式 <img src="https://github.com/hedyorg/hedy/assets/80678586/549d7f3a-c492-4b4a-b173-746eb3400951" width="500">
                example_code: |
                    手環設計程式的提示
                    ```
                    #為不同形狀建立函式：
                    {define} draw_a_square
                    _

                    #繪製手環的開頭：
                    {color} {white}
                    {turn} -90
                    {forward} 300
                    {turn} 180

                    #在手環上繪製形狀：
                    {repeat} 5 {times}
                        {color} {gray}
                        {forward} 100
                        shape = {ask} '手環上接下來要放哪種形狀？'
                        chosen_color = {ask} '要用什麼顏色？'
                        {color} chosen_color
                        {if} shape = '正方形'
                            {call} draw_a_square
                    ```
                answer_code: |
                    手環
                    ```
                    #定義所有形狀
                    {define} draw_a_square
                        {repeat} 4 {times}
                            {turn} 90
                            {forward} 30

                    {define} draw_a_triangle
                        {repeat} 3 {times}
                            {turn} 120
                            {forward} 30

                    {define} draw_a_star
                        {repeat} 5 {times}
                            {turn} 144
                            {forward} 30

                    #從畫面左側開始
                    {color} 'white'
                    {turn} -90
                    {forward} 300
                    {turn} 180

                    #製作手環
                    {repeat} 5 {times}
                        {color} 'gray'
                        {forward} 100
                        shape = {ask} '手環上接下來要放哪種形狀？'
                        chosen_color = {ask} '要用什麼顏色？'
                        {color} chosen_color
                        {if} shape = '正方形'
                            {call} draw_a_square
                        {elif} shape = '三角形'
                            {call} draw_a_triangle
                        {elif} shape = "星星"
                            {call} draw_a_star
                    {color} 'gray'
                    {forward} 100
                    ```
