                    people = 媽媽, 爸爸, Emma, Sophie
                    dishwasher = people {at} {random}
                    {print} '星期五負責洗碗的是：' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} '星期六負責洗碗的是：' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} '星期日負責洗碗的是：' dishwasher
                    {remove} dishwasher {from} people

                    ```
            8:
