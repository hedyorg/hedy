                    {repeat} 2 {times} {play} A
                    {play} G
                    {repeat} 2 {times} {play} E
                    {repeat} 2 {times} {play} D
                    {play} C
                    ```
            9:
                story_text: |
                    現在我們可以用 `{repeat}` 指令重複多行程式碼，製作歌曲會更簡單！

                    ### 練習
                    完成〈兩隻老虎（Frère Jacques）〉這首歌。別忘了使用 `{repeat}`！
                example_code: |
                    ```
                    {print} 'Brother John'
                    #Play first line twice:
                    {repeat} 2 {times}
                        {play} C
                        {play} D
                        {play} E
                        {play} C
                    #Play second line twice:
                    {repeat} 2 {times}
                        {play} E
                        {play} F
                        {play} G
                        {sleep} 1
                    ```
                answer_code: |
                    ```
                    {print} 'Brother John'
                    {repeat} 2 {times}
                        {play} C
                        {play} D
                        {play} E
                        {play} C
                    {repeat} 2 {times}
                        {play} E
                        {play} F
                        {play} G
                        {sleep} 1
                    {repeat} 2 {times}
                        {play} G
                        {play} A
                        {play} G
                        {play} F
                        {play} E
                        {play} C
                    {repeat} 2 {times}
                        {play} C
                        {play} G3
                        {play} C
                        {sleep} 1
                    ```
            10:
                story_text: |
                    從這一關開始，你可以在 `{repeat}` 指令裡再使用 `{repeat}` 指令。
                    這能讓〈生日快樂〉等歌曲的程式碼變得更短！

                    ### 練習
                    完成這首歌！
                example_code: |
                    ```
                    first_time = 是
                    {repeat} 2 {times}
                        {repeat} 2 {times}
                            {play} C
                        {play} D
                        {play} C
                        {if} first_time {is} 是
                            {play} F
                            {play} E
                            first_time {is} 否
                        {else}
                            _
                    ```
                answer_code: |
                    ```
                    first_time = 是
                    {repeat} 2 {times}
                        {repeat} 2 {times}
                            {play} C
                        {play} D
                        {play} C
                        {if} first_time {is} 是
                            {play} F
                            {play} E
                            first_time = 否
                        {else}
                            {play} G
                            {play} F
                    ```
            12:
                story_text: |
                    在歌曲中使用函式！如範例程式碼所示，你可以為〈一閃一閃亮晶晶〉的每一行建立函式。寫好前三行後，只要按照想播放的順序呼叫函式即可。

                    ### 練習
                    完成〈一閃一閃亮晶晶〉。
                    接著回頭看看前幾關編寫的所有歌曲。你能使用函式，讓那些程式碼也變得更好、更短嗎？
                example_code: |
                    ```
                    #定義歌曲的第一行：
                    {define} first_line
                        {play} C
                        {play} C
                        {play} G
                        {play} G
                        {play} A
                        {play} A
                        {play} G
                        {sleep}

                    #定義歌曲的第二行：
                    {define} second_line
                        {play} F
                        {play} F
                        {play} E
                        {play} E
                        {play} D
                        {play} D
                        {play} C
                        {sleep}

                    #定義歌曲的第三行：
                    {define} third_line
                        {play} G
                        {play} G
                        {play} F
                        {play} F
                        {play} E
                        {play} E
                        {play} D
                        {sleep}

                    #播放歌曲的各行：
                    {call} first_line
                    _
                    _
                    ```
                answer_code: |
                    ```
                    first_time = 'yes'
                    {repeat} 2 {times}
                        {repeat} 2 {times}
                            {play} C
                        {play} D
                        {play} C
                        {if} first_time {is} 'yes'
                            {play} F
                            {play} E
                            first_time = 'no'
                        {else}
                            {play} G
                            {play} F
                    ```
            15:
                story_text: |
                    你可以為了好玩而編寫音樂程式，也可以用音符製作火災警報器之類的實用裝置！

                    ### 練習
                    發生火災時，一定要讓火災警報器響起來！
                example_code: |
                    ```
                    {def} fire_alarm():
                        {print}('失火了！')
                        {for} i {in} {range} _
                            {play} 45
                            {play} 50

                    fire = {input}('發生火災了嗎？')
                    {if} fire _
                        _
                    ```
                answer_code: |
                    ```
                    {def} fire_alarm():
                        {print}('失火了！')
                        {for} i {in} {range}(1,20):
                            {play} 45
                            {play} 50

                    fire = {input}('有發生火災嗎？')
                    {if} fire == '有':
                        fire_alarm()
                    ```
            16:
                story_text: |
                    **注意** 這個冒險可能會變得非常惱人！
                    我們也可以使用 `{while}` 指令，讓歌曲永遠重複播放。

                    ### 練習
                    完成這首永不停止的歌。
                example_code: |
                    ```
                    {def} song():
                        {play} _

                    yes_or_no = {input}('你想聽我永遠唱不完的歌嗎？')
                    {while} yes_or_no = '想':
                        song()
                        {print}('🥳')
                    ```
                answer_code: |
                    ```
                    {def} song():
                        {play} C3
                        {play} D3
                        {play} E3
                        {play} F3
                        {play} E3
                        {play} D3
                        {play} C3
                        {sleep} 1

                    yes_or_no = {input}('你想聽我永不停止的歌曲嗎？')
                    {while} yes_or_no = '是':
                        song()
                        {print}('🥳')
                    ```
        name: 音樂
        default_save_name: 音樂
        description: 演奏一段旋律！
    parrot:
        levels:
            1:
                story_text: |
                    製作一隻會模仿你的線上寵物鸚鵡！
                example_code: |
                    ```
                    {print} 我是鸚鵡 Hedy
                    {ask} 你叫什麼名字？
                    {print} {answer}
                    {print} {answer}
                    ```
                story_text_2: |
                    ### 練習
                    按一下黃色按鈕，把範例程式碼複製到輸入畫面。
                    讓鸚鵡提出另一個問題。請填入範例中的空格！
                    **加碼挑戰** 你也可以讓鸚鵡提出多個問題。在自己的程式碼下方多輸入幾行。
                example_code_2: |
                    ```
                    {print} 我是鸚鵡 Hedy
                    {ask} _
                    {print} {answer}
                    {print} {answer}
                answer_code: |
                    ```
                    {print} 我是鸚鵡 Hedy
                    {ask} 你最喜歡哪個詞？
                    {print} {answer}
                    {print} {answer}
                    {ask} 這隻鸚鵡還能回答更多問題嗎？
                    {print} {answer}
                    {print} {answer}
                    ```
            2:
                story_text: |
                    上一關製作了一隻會模仿你的鸚鵡。這一關要使用變數和 `{ask}` 指令，讓鸚鵡可以互動。
                    我們也會在說完內容後加入 `{sleep}` 指令，讓鸚鵡更像真的。
                example_code: |
                    ```
                    {print} 我是鸚鵡 Hedy
                    name _ _ 你叫什麼名字？
                    {print} name
                    _
                    {print} 嘎嘎
                    _
                    {print} name
                    ```
                story_text_2: |
                    ### 練習
                    首先，在第 2 行補上 `{is}` 和 `{ask}` 指令。
                    接著，在第 4 行和第 6 行填入 `{sleep}` 指令，讓鸚鵡安靜一下。

                    **額外挑戰** 你能增加更多程式碼，讓鸚鵡不只詢問你的名字嗎？
                answer_code: |
                    ```
                    {print} 我是鸚鵡 Hedy
                    name is {ask} 你叫什麼名字？
                    {print} name
                    {sleep} 2
                    {print} 嘎嘎
                    {sleep} 2
                    {print} name
                    ```
            3:
                story_text: |
                    使用 `{add}` 教鸚鵡一個新詞。
                    ### 練習
                    你能加入 `{add} {to_list}` 指令，讓程式正常運作嗎？
                example_code: |
                    ```
                    words {is} 嘎嘎, Hedy
                    {print} 訓練你的鸚鵡！
                    new_word {is} {ask} 你想教牠說哪個詞？
                    _ new_word _ words
                    {print} 🧒 Hedy，說 new_word！
                    {print} 🦜 words {at} {random}
                    ```
                answer_code: |
                    ```
                    words {is} 嘎嘎, Hedy
                    {print} 訓練你的鸚鵡！
                    new_word {is} {ask} 你想教牠說哪個詞？
                    {add} new_word {to} words
                    {print} 🧒 Hedy，說 new_word！
                    {print} 🦜 words {at} {random}
                    ```
            4:
                story_text: |
                    在這一關，使用 `{ask}` 和 `{print}` 指令時必須加上引號。
                    ### 練習
                    在空格處填入引號，完成程式碼。
                example_code: |
                    ```
