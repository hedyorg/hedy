                story_text_2: |
                    ### 練習
                    現在的軟體幾乎都會使用雙因素驗證來保護帳號。你不能只用一組密碼，而是需要兩組。
                    請把一個 `{if}` 放進另一個 `{if}` 裡，做出必須輸入兩組正確密碼的安全系統。
                example_code_2: |
                    ```
                    password_1 =
                    password_2 =
                    _
                    ```
                answer_code: |
                    ```
                    password_1 = 鱷魚
                    password_2 = 通心粉

