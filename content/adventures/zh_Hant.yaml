            14:
                story_text: |
                    清潔人員有一大張工作清單。有些工作每天都要做，有些則只在特定的星期、季節或日期進行。這非常容易混淆，常常會漏掉工作。
                    你能寫一個程式，輸出當天正確的工作清單嗎？
                    ### 練習
                    程式應該：
                    * 向清潔人員道早安。
                    * 詢問今天是星期幾、幾月和幾號。
                    * 輸出當天正確的工作清單。
                    需要完成的工作：
                    * 每天：拖地、清潔廁所、拉開窗簾。
                    * 星期一和星期四：為植物澆水。
                    * 星期二和星期五：拖地。
                    * 星期六：清洗咖啡機。
                    * 每月 1 日：清洗窗戶。
                    * 每月 7 日：補充自動販賣機。
                    * 每月 14 日：檢查火災警報器的電池。
                    * 冬季每天：開啟暖氣。
                    * 夏季每天：開啟空調。
                answer_code: |
                    ```
                    {print}("清潔人員早安")

                    #詢問日期
                    day = {input}("今天是星期幾？")
                    current_month = {input}("現在是幾月？")
                    date = {input}("今天是幾號？")

                    #輸出工作清單
                    print("清潔人員，你今天的工作是：")

                    #根據星期決定工作
                    {if} day == "星期一" {or} day == "星期四":
                        {print}("為植物澆水")
                    {elif} day == "星期二" {or} day == "星期五":
                        {print}("拖地")
                    {elif} day == "星期六":
                        {print}("清洗咖啡機")

                    #根據日期決定工作
                    {if} date == 1:
                        {print}("清洗窗戶")
                    {elif} date == 7:
                        {print}("補充自動販賣機")
                    {elif} date == 14:
                        {print}("檢查火災警報器的電池")

                    #建立夏季和冬季月份的清單
                    summer_months = ["四月", "五月", "六月", "七月", "八月", "九月"]
                    winter_months = ["十月", "十一月", "十二月", "一月", "二月", "三月"]

                    #根據夏季或冬季決定工作
                    {for} month {in} summer_months:
                        {if} current_month == month:
                            {print}("開啟空調")
                    {for} month {in} winter_months:
                        {if} current_month == month:
                            {print}("開啟暖氣")
                    ```
            15:
                story_text: |
                    手術後，病人有時會非常疼痛。這時可以讓病人使用嗎啡幫浦，疼痛時自行注入一些嗎啡。
                    這類幫浦必須經過非常謹慎的程式設定，才不會讓病人注入過多嗎啡。你能幫我們寫出嗎啡幫浦的程式嗎？
                    ### 練習
                    程式應該：
                    * 詢問護理師，病人今天已經使用了多少毫升的嗎啡。
                    * 請護理師把裝置交給病人。
                    * 請病人用 1 到 10 分表示目前的疼痛程度。
                    * 告訴病人，如果想再使用一些嗎啡，就按下 x 按鈕。
                    * 按下 x 時，以 pain_level 和 morphine_level 作為引數，呼叫 start_pump 函式。
                    * 當病人的疼痛程度大於或等於 6，而且嗎啡量小於 120 時，函式應輸出「將再為你注入 20 毫升嗎啡」。
                    * 注入新的嗎啡後，程式應暫停 2 分鐘（測試程式時可以改用 2 秒）。
                    * 2 分鐘後，嗎啡量應更新（增加 20 毫升），並再次詢問病人現在的感覺，以更新疼痛程度。
                    * 如果嗎啡量過高，或病人已經不痛，程式應告訴病人不會再注入嗎啡。如果病人仍然非常疼痛，就請他呼叫護理師。
                    * 告訴病人幫浦現在會關閉；若需要重新啟動，請按下 x。
                answer_code: |-
                    ```
                    {print}('嗎啡幫浦')
                    morphine_level = {input}('病人今天已經使用多少毫升的嗎啡？')
                    {print}('請現在把這個裝置交給病人')

                    pain_level = {input}('疼痛程度從 1 到 10，你覺得有多痛？')
                    {print}('按下 X 使用嗎啡')

                    {define} morphine(pain_level, morphine_level):
                        {print}('將再為你提供 20 毫升的嗎啡')
                        {sleep} 2
                        morphine_level = morphine_level + 20
                        pain_level = {input}('疼痛程度從 1 到 10，你覺得有多痛？')
                        {print}('幫浦現在會停止運作')
                        {return} morphine_level
                        {return} pain_level
                        {sleep} 2

                    {for} i {in} {range} (1,10):
                        wait_for_x = {input}('按下 X 使用嗎啡')
                        {if} wait_for_x == 'x'
                            {if} pain_level >= 6 {and} morphine_level <120:
                                morphine_level = morphine(pain_level, morphine_level)
                                pain_level = morphine(pain_level, morphine_level)
                            {else}:
                                {print}('現在再使用更多嗎啡會不安全')
                                {print}('如果你覺得太痛，請呼叫護理師')
                    ```
            16:
                story_text: |
                    醫學生必須學習身體各部位的醫學術語。他們似乎很難記住這些解剖學名稱，也覺得學習過程非常無聊。
                    你能製作一個遊戲，幫助他們練習醫學術語嗎？
                    學生需要熟記：corpus = 身體、caput = 頭、ocolus = 眼睛、nasus = 鼻子、auris = 耳朵、os = 嘴巴、collum = 脖子、manus = 手、pectus = 胸部、humerus = 肩膀、venter = 腹部、tergum = 背部。
                    ### 練習
                    程式應該：
                    * 是一個讓學生練習醫學術語的遊戲。
                    * 答對時為學生加一分並稱讚他。
                    * 答錯時扣一分，並告訴他答案不正確。
                    * 答錯時也要顯示正確答案幾秒鐘，接著從畫面清除答案，並持續提問直到答對。
                    * 持續進行，直到學生答對所有題目。
                    * 向學生顯示最後得分。
                    * 根據分數提供回饋：12 分：太厲害了！8～11 分：做得好，繼續練習！7 分以下：你應該多複習！
                answer_code: |
                    ```
                    points = 0
                    latin_terms = ['corpus', 'caput',  'ocolus',  'nasus', 'auris', 'os', 'collum',  'manus', 'pectus',  'humerus', 'venter', 'tergum']
                    english_terms = ['身體', '頭', '眼睛', '鼻子', '耳朵', '嘴巴', '脖子', '手', '胸部', '肩膀', '腹部', '背部']

                    {for} i {in} {range}(1, 12):
                        correct_answer = english_terms[i]
                        answer = 0
                        {while} answer != correct_answer:
                            answer = {input}(latin_terms[i], ' 的中文名稱是什麼？')
                            {if} answer != correct_answer:
                                {print}('答錯了')
                                {print}(latin_terms[i], ' 的正確答案是 ', english_terms[i])
                                {sleep} 3
                                clear
                                points = points - 1
                        points = points + 1
                        {print}('答對了！')

                    {print}('恭喜，你已經練習完所有術語！')
                    {print}('你的分數是：', points)

                    {if} points == 12:
                        {print}('太厲害了！')

                    {if} points <=7:
                        {print}('你應該多複習！')
                    {else}:
                        {print}('做得好，繼續練習！')
                    ```
        name: 醫院
        default_save_name: 醫院
        description: 醫院
