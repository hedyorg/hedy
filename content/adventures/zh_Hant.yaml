                    使用 `{repeat}` 可以重複執行程式碼。你能用它計算多天由誰負責洗碗！
                    ### 練習
                    使用 `{repeat}` 指令決定整週由誰洗碗。每個空格都要填入一個指令或數字！
                    **額外挑戰** 你還想得到哪些家事？修改程式碼，讓它分配三項家事。別忘了輸出每一項是什麼工作！
                example_code: |
                    ```
                    people = 媽媽, 爸爸, Emma, Sophie
                    {repeat} _ _ {print} '負責洗碗的人是 ' _ _ _
                    ```
                answer_code: |
                    ```
                    people = 媽媽, 爸爸, Emma, Sophie
                    {repeat} 7 {times} {print} '負責洗碗的人是 ' people {at} {random}

                    #額外挑戰
                    {repeat} 7 {times} {print} '負責遛狗的人是 ' people {at} {random}
                    {repeat} 7 {times} {print} '負責倒垃圾的人是 ' people {at} {random}
                    ```
            11:
