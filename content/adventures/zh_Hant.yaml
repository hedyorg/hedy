    maths:
        levels:
            7:
                story_text: |
                    在這一關，你會學到新功能：現在也可以進行計算了。

                    加法很簡單，寫法和數學一樣，例如 `5 + 5`。減法也一樣，寫成 `5 - 5`。

                    乘法有點不同，因為鍵盤上沒有乘號。不信你找找看，真的沒有！
                    所以我們使用數字 8 上方的星號來做乘法：`5 * 5`。把它念成「5 乘以 5」，就更容易記住了。
                example_code: |
                    ```
                    {print} '5 加 5 是 ' 5 + 5
                    {print} '5 減 5 是 ' 5 - 5
                    {print} '5 乘以 5 是 ' 5 * 5
                    {print} '5 除以 5 是 ' 5 / 5
                    ```
                story_text_2: |-
                    **小數**
                    到目前為止，Hedy 還不能使用 1.5 這樣的小數，但現在可以了。請注意，電腦使用 `.` 作為小數點。
                example_code_2: |
                    ```
                    {print} '二又二分之一加上二又二分之一是……'
                    {print} 2.5 + 2.5
                    ```
                story_text_3: '**使用變數進行數學運算**'
                example_code_3: |
                    ```
                    {print} '一張票 2 美元'
                    people = {ask} '你想買幾張票？'
                    price = people * 2
                    {print} '總共是 ' price ' 美元'
                    ```
                answer_code: |
                    自行作答
        name: 數學
        default_save_name: 數學
        description: 認識數學運算
    music:
        levels:
            1:
                story_text: |-
                    在這一關，你會學習如何使用 `{play}` 指令播放旋律！

                    輸入 `{play}`，後面接著想播放的音符。音階由 C-D-E-F-G-A-B 組成。
                    你可以看到共有 7 個不同的字母，但我們能播放的不只 7 個音符。
                    在字母後面輸入 0 到 9 之間的數字來選擇音域，例如 B4 後面是 C5。
                    C0 是可以播放的最低音，B9 是最高音。

                    ### 練習
                    試著執行範例程式碼，再自由玩玩看！你能創作自己的旋律嗎？
                    下一關會學習如何播放一些現有歌曲。
                example_code: |-
                    ```
                    {play} C4
                    {play} D4
                    {play} E4
                    {play} F4
                    {play} G4
                    {play} A4
                    {play} B4
                    {play} C5
                    ```
                answer_code: |
                    自行作答
            2:
                story_text: |
                    ### 練習
                    完成這些歌曲！我們已經為幾段旋律寫好開頭的程式碼。
                example_code: |
                    ```
                    {print} Old Mac Donald had a farm
                    {play} C5
                    {play} C5
                    {play} C5
                    {play} G4
                    {play} A4
                    {play} A4
                    {play} G4
                    ```
                story_text_2: 你可以看到，也能使用 `{sleep}` 指令在歌曲中加入短暫停頓。
                example_code_2: |
                    ```
                    {print} Twinkle Twinkle Little Star
                    {play} C
                    {play} C
                    {play} G
                    {play} G
                    {play} A
                    {play} A
                    {play} G
                    {sleep} 1
                    {play} F
                    {play} F
                    ```
                answer_code: |
                    Old Mac Donald
                    ```
                    {print} Old Mac Donald had a farm
                    {play} C5
                    {play} C5
                    {play} C5
                    {play} G4
                    {play} A4
                    {play} A4
                    {play} G4
                    {sleep} 1
                    {play} E5
                    {play} E5
                    {play} D5
                    {play} D5
                    {play} C5
                    ```
                    #Twinkle Twinkle Little Star
                    ```
                    {print} Twinkle Twinkle Little Star
                    {play} C
                    {play} C
                    {play} G
                    {play} G
                    {play} A
                    {play} A
                    {play} G
                    {sleep} 1
                    {play} F
                    {play} F
                    {play} E
                    {play} E
                    {play} D
                    {play} D
                    {play} C

                    ```
            3:
                story_text: |
                    創作一段隨機旋律！

                    ### 練習
                    範例程式碼會創作一段隨機旋律，但旋律非常短，使用的音符也不多。
                    在清單中加入更多音符，再多複製幾次最後一行，創作更長的旋律。
                example_code: |
                    ```
                    notes {is} A4, B4, C4
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    ```
                answer_code: |
                    ```
                    notes {is} A4, B4, C4, D4, E4, F4, G4
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    ```
            4:
                story_text: |
                    使用 `{clear}` 指令製作一台卡拉 OK 機！

                    ### 練習
                    完成〈瑪莉有隻小綿羊〉的卡拉 OK 版本。
                    接著，選一首你喜歡的歌，製作它的卡拉 OK 版本！
                example_code: |
                    ```
                    {print} 'Mary had a little lamb'
                    {play} E
                    {play} D
                    {play} C
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    {clear}
                    {print} 'Little lamb, little lamb'
                    {play} D
                    {play} D
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    {clear}
                    {print} 'Mary had a little lamb'
                    {play} E
                    ```
                answer_code: |
                    Mary had a little lamb
                    ```
                    {print} 'Mary had a little lamb'
                    {play} E
                    {play} D
                    {play} C
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    {clear}

                    {print} 'Little lamb, little lamb'
                    {play} D
                    {play} D
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    {clear}

                    {print} 'Mary had a little lamb'
                    {play} E
                    {play} D
                    {play} C
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    ```

                    Old MacDonald
                    ```
                    {print} "Old MacDonald had a farm"
                    {play} C
                    {play} C
                    {play} C
                    {play} G
                    {play} A
                    {play} A
                    {play} G
                    {clear}

                    {print} "EE i ee i o"
                    {play} E
                    {play} E
                    {play} D
                    {play} D
                    {play} C
                    {clear}
                    ```
            5:
                story_text: |
                    你不一定每次都要用 `{play}` 指令播放整首歌，有時只想播放一個音符。
                    例如製作問答遊戲時，答對可以播放快樂的高音，答錯則播放悲傷的低音。

                    ### 練習
                    在第一題加入一行程式碼，讓答案錯誤時播放 C3 音符。
                    接著再想 3 個問題，加入這個問答遊戲。
                example_code: |
                    ```
                    answer {is} {ask} '辛巴威的首都是哪裡？'
                    {if} answer {is} 哈拉雷 {play} C6
                    _
                    ```
                answer_code: |
                    ```
                    answer {is} {ask} '辛巴威的首都是哪裡？'
                    {if} answer {is} 哈拉雷 {play} C6
                    {else} {play} C3

                    answer {is} {ask} '法國的首都是哪裡？'
                    {if} answer {is} 巴黎 {play} C6
                    {else} {play} C3

                    answer {is} {ask} '哪種動物是萬獸之王？'
                    {if} answer {is} 獅子 {play} C6
                    {else} {play} C3

                    answer {is} {ask} '日本使用哪一種貨幣？'
                    {if} answer {is} 日圓 {play} C6
                    {else} {play} C3
                    ```
            6:
                story_text: |
                    你可以使用 `{elif}`，在不同情況下播放不同的音符。例如，當一個人心情愉快時，可以為他播放快樂的音符。
                    ### 練習
                    先創作一個悲傷的音符，再為其他不同心情創作至少 2 段旋律。
                example_code: |
                    ```
                    mood {is} {ask} '你今天心情如何？'
                    {if} mood {is} 開心
                    {play} C4
                    {elif} mood {is} 難過
                    {play} _
                    {elif} mood {is} _
                    {play} _
                    ```
                answer_code: |
                    ```
                    mood {is} {ask} '你今天心情如何？'
                    {if} mood {is} 開心
                    {play} C4
                    {elif} mood {is} 難過
                    {play} C2
                    {elif} mood {is} 害怕
                    {play} C8
                    {elif} mood {is} 無聊
                    {play} C3
                    ```
            7:
                story_text: |
                    除了播放音符，現在也可以播放數字。只要輸入 `{play} 1` 就能播放最低音，輸入 `{play} 70` 播放最高音，也可以輸入兩者之間的任何數字。

                    ### 練習
                    該用音樂做數學運算了！使用不同的起始數字執行範例程式碼幾次。
                    接著看看能不能用數字譜寫歌曲。
                example_code: |
                    ```
                    number = {ask} '請說一個 1 到 67 之間的起始數字'
                    #輸出並播放 3 個音符：
                    {print} number
                    {play} number
                    number = number + 1
                    {print} number
                    {play} number
                    number = number + 1
                    {print} number
                    {play} number
                    ```
                answer_code: |
                    自行作答
            8:
                story_text: |
                    使用 `{repeat}` 指令，可以大幅縮短旋律的程式碼！

                    ### 練習
                    使用 `{repeat}` 指令，完成〈一閃一閃亮晶晶〉的程式碼。
                    接著回去看看前幾關寫過的歌曲。你也能縮短那些程式碼嗎？
                example_code: |
                    ```
                    {print} 'Twinkle Twinkle Little Star'
                    {repeat} 2 {times} {play} C4
                    {repeat} 2 {times} {play} G4
                    _
                    ```
                answer_code: |
