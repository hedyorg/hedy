                    #法文單字和翻譯的清單：
                    french_words = ['bonjour', 'ordinateur', 'pomme de terre']
                    translation = ['你好', '電腦', '馬鈴薯']

                    #練習單字：
                    score = 0
                    {for} i {in} {range}(1,3):
                        answer = {input}(french_words[i], ' 是什麼意思？')
                        correct = translation[i]
                        {if} answer == correct:
                            {print}('答對了！')
                            score = score + 1
                        {else}:
                            {print}('答錯了，', french_words[i], ' 的意思是 ', translation[i])

                    #輸出分數：
                    {print}('你答對了 ', score, ' 題。')
                    ```
                answer_code: |
                    ```
                    spanish_words = ['hola', 'vale', 'te quiero']
                    translation = ['你好', '好的', '我愛你']
                    score = 0
                    {for} i {in} {range}(1,3):
                        answer = {input}(spanish_words[i], ' 是什麼意思？')
                        correct_answer = translation[i]
                        {if} answer == correct_answer:
                            {print}('答對了！')
                            score = score + 1
                        {else}:
                            {print}('答錯了，', spanish_words[i], ' 的意思是 ', translation[i])
                    {print}('你答對了 ', score, ' 題。')
                    ```
