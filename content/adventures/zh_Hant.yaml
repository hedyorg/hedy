                story_text: |-
                    我們要學習新的迴圈：`{while}` 迴圈！只要陳述式為真，迴圈就會持續執行。
                    因此，別忘了在迴圈中改變值。

                    在範例程式碼中，迴圈會持續執行，直到有人輸入正確答案。
                    如果一直沒有正確答案，迴圈就永遠不會結束！
                example_code: |
                    ```
                    answer = 0
                    {while} answer != 25:
                        answer = {input}('5 乘以 5 是多少？')
                    {print}('已輸入正確答案')
                    ```
