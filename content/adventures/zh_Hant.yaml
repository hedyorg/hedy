            7:
                story_text: |
                    護理師會記錄病人的體液平衡，也就是病人今天補充的液體（喝水、進食或點滴）減去流失的液體（排尿或嘔吐）。
                    體液平衡必須維持正數。如果是負數，護理師就需要補充更多點滴。
                    你能製作一個計算病人體液平衡的工具，協助護理師嗎？
                    ### 練習
                    程式應該：
                    * 詢問病人當天喝東西補充了多少液體。
                    * 詢問病人當天吃東西補充了多少液體。
                    * 詢問病人當天從點滴補充了多少液體。
                    * 詢問病人當天排尿流失了多少液體。
                    * 詢問病人當天嘔吐流失了多少液體。
                    * 計算病人的體液平衡，並顯示給護理師。
                    * 請護理師檢查平衡值是正數還是負數，再判斷病人今天是否需要補充更多點滴。
                answer_code: |
                    ```
                    intake_drinking = {ask} '病人喝東西補充了多少液體？'
                    intake_eating = {ask} '病人吃東西補充了多少液體？'
                    intake_IV = {ask} '病人從點滴補充了多少液體？'
                    discharge_urine = {ask} '病人排尿流失了多少液體？'
                    discharge_vomit = {ask} '病人嘔吐流失了多少液體？'
                    fluid_balance = intake_drinking + intake_eating + intake_IV - discharge_urine - discharge_vomit
                    {print} "病人的體液平衡值是 " fluid_balance
                    {print} '請檢查平衡值是正數還是負數，再判斷病人今天是否需要補充更多點滴。'
                    ```
            8:
                story_text: |
                    病人有時會忘記服藥，造成嚴重的健康問題。為了確保病人服用所有處方藥，我們會提供一個鬧鐘，每次需要服藥時就會發出嗶聲。
                    你能幫忙製作服藥提醒器嗎？

                    ### 練習
                    程式應該：

                    #第 1 部分：護理師的設定
                    * 先讓護理師設定病人的姓名。
                    * 接著填入病人每天第一劑（上午 8 點）、第二劑（中午）和最後一劑（下午 4 點）各要服用幾顆藥。
                    * 感謝護理師，請他把提醒器交給病人。顯示訊息 2 秒後清除畫面。

                    #第 2 部分：第一劑
                    * 用姓名向病人問好，並告訴他需要服藥時，提醒器會發出嗶聲。
                    * 發出 3 次嗶聲。
                    * 告訴病人現在是上午 8 點，該服用第一劑藥。
                    * 第一劑要服用幾顆藥，就詢問幾次「你服藥了嗎？」。
                    * 告訴病人已經服完第一劑，並在 2 秒後清除畫面。

                    #第 3 部分：第二劑
                    * 等待 4 秒（實際使用時會是 4 小時）。
                    * 用和第一劑相同的方式讓提醒器響起。

                    #第 4 部分：最後一劑
                    * 等待 4 秒（實際使用時會是 4 小時）。
                    * 讓提醒器為當天最後一劑藥響起。
                answer_code: |-
                    ```
                    #護理師的設定
                    {print} '護理師早安，請填寫病人的正確資料。'
                    name {is} {ask} '這位病人叫什麼名字？'
                    first_dose {is} {ask} name ' 上午 8 點要吃幾顆藥？'
                    second_dose {is} {ask} name ' 中午要吃幾顆藥？'
                    last_dose {is} {ask} name ' 下午 4 點要吃幾顆藥？'
                    {print} '謝謝，現在可以把提醒器交給病人。'
                    {sleep} 2
                    {clear}

                    #第一劑
                    {print} '你好，' name '。我是你的服藥提醒器，需要服藥時會發出嗶聲。'
                    {repeat} 3 {times} {play} C4
                    {print} "現在是上午 8 點，該服用第一劑藥了"
                    {repeat} first_dose {times} pill {is} {ask} '你服藥了嗎？'
                    {print} '你已經服完第一劑了，' name
                    {sleep} 2
                    {clear}

                    #第二劑
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "現在是中午，該服用第二劑藥了"
                    {repeat} second_dose {times} pill {is} {ask} '你服藥了嗎？'
                    {print} '你已經服完第二劑了，' name
                    {sleep} 2
                    {clear}

                    #最後一劑
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "現在是下午 4 點，該服用最後一劑藥了"
                    {repeat} last_dose {times} pill {is} {ask} '你服藥了嗎？'
                    {print} '你已經服完今天所有的藥了，' name
                    {sleep} 2
                    {clear}
                    ```
