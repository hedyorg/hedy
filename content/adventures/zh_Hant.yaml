                    練習 3
                    ```
                    {def} calculate_mean_grade(subject):
                        total = 0
                        amount_of_tests = {input}(subject, "考了幾次？")
                        {for} i {in} {range} (1, amount_of_tests):
                            grade = {input} ("第 " , i, ' 次考試得到幾分？')
                            total = total + grade
                        {return} total / amount_of_tests

                    amount_of_subjects = {input}('你想計算幾個科目的平均成績？')
                    {repeat} amount_of_subjects {times}
                        subject = {input}('你想計算哪個科目的平均成績？')
                        mean_grade = calculate_mean_grade(subject)
                        {print} (subject, '的平均成績是 ', mean_grade)
                    ```
