            2:
                story_text: |
                    在第 2 關，你可以使用變數擴充餐廳。第 1 關的 Hedy 只能記住最後點的東西。
                    現在使用變數後，Hedy 可以同時記住食物和配料！
                example_code: |
                    ```
                    {print} 歡迎光臨 Hedy 的餐廳！
                    {print} 今天供應披薩或千層麵。
                    food {is} {ask} 你想吃什麼？
                    {print} 選得好！這也是我最喜歡的食物！
                    topping {is} {ask} 你想加肉還是蔬菜？
