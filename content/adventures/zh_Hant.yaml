                story_text_2: |
                    ### 練習
                    把上一關自己寫的餐廳程式碼複製到下方的輸入畫面。
                    運用本關學到的方式，搭配 `{ask}` 指令使用變數和 `{is}`，修正程式碼。

                    程式重新運作後，就該加入更多內容了。
                    看看範例程式碼的最後一行：`{print} food with topping is on its way!`
                    這一行使用 2 個變數來整理點餐內容。
                    現在請自行加入顧客所點食物和飲料的摘要。

                    **額外挑戰** 你已經學會使用變數，所以一行中想放多少個變數都可以。你能加入更多變數嗎？例如內用或外帶、現金或刷卡、要不要吸管等。
                answer_code: |
                    ```
                    {print} 歡迎光臨 Hedy 的餐廳 🍟
                    food {is} {ask} 你想點什麼？
                    {print} 所以你想點 food
                    drink {is} {ask} 你想喝什麼？
                    {print} 所以你想喝 drink
                    straw {is} {ask} 飲料需要吸管嗎？
                    {print} 好的！
                    payment {is} {ask} 你想付現金還是刷卡？
                    {print} 沒問題
                    place {is} {ask} 你想內用還是外帶？
