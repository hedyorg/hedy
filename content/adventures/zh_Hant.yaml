    functions_2:
        name: 帶有引數的函式
        default_save_name: 函式 2
        description: 函式 2
        levels:
            15:
                story_text: |
                    你已經學會如何使用函式，接下來要學習如何使用帶有引數的函式。
                    **引數**是在函式內使用的變數，不會在函式外使用。

                    例如，我們在這段程式碼中編寫了歌曲〈My Bonnie is over the ocean〉的第一段。
                    這個範例使用了 `place` 這個引數。`place` 是只在函式中使用的變數，所以它是一個引數。
                    為了使用 `place`，我們把它放在 `{define} song` 後面。
                    呼叫函式時，電腦會用 `song {with}` 後面的文字取代引數 `place`。

                    ### 練習
                    這首歌的下一段是：

                    Last night as I lay on my pillow

                    Last night as I lay on my bed

                    Last night as I lay on my pillow

                    I dreamed that my Bonnie is dead



                    你能用和範例相同的方式編寫這段歌詞嗎？
                example_code: |
                    ```
                    {def} song(place):
                        {print}('My Bonnie is over the ', place)

                    song('ocean')
                    song('sea')
                    song('ocean')
                    ```
                answer_code: |
                    ```
                    {define} song(place)
                        {print} ('Last night as I lay on my ' place)

                    song('pillow')
                    song('bed')
                    song('pillow')
                    {print} "I dreamed that my Bonnie is dead"
                    ```
    functions_3:
        name: 帶有回傳值的函式
        default_save_name: 函式 3
        description: 函式 3
        levels:
            15:
                story_text: |
                    前幾關學會了建立函式，並搭配引數使用。函式還有另一個很棒的用途：幫你進行計算。
                    你可以把計算交給函式，函式會把計算答案交給你。這個答案稱為**回傳值**。

                    例如這段程式碼中的 calculate_new_price 函式會計算任何商品的新價格，再把新價格作為回傳值。

                    ### 練習
                    完成這段程式碼。我們已經建立 new_price 變數，你只需要設定它。
                    呼叫計算新價格的函式，完成這一行程式碼。
                example_code: |
                    ```
                    {def} calculate_new_price(amount, percentage):
                        percentage = percentage / 100
                        discount_amount = amount * percentage
                        {return} amount - discount_amount

                    old_price = {input}('價格標籤上是多少錢？')
                    discount = {input}('折扣是百分之多少？')

                    new_price = _ calculate_new_price(old_price, _)
                    {print}('新價格是 ', new_price, ' 元')
                    ```
                answer_code: |
                    ```
                    {def} calculate_new_price(amount, percentage):
                        percentage = percentage / 100
                        discount_amount = amount * percentage
                        {return} amount - discount_amount

                    old_price = {input}('價格標籤上是多少錢？')
                    discount = {input}('折扣是百分之多少？')

                    new_price = calculate_new_price(old_price, discount)
                    {print}('新價格是 ', new_price, ' 元')

                    ```
