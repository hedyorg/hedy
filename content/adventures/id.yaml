                    ```
    fortune:
        name: peramal nasib
        default_save_name: peramal
        description: Minta Hedy untuk meramal masa depan
        levels:
            1:
                story_text: |
                    Pernahkah kamu pergi ke karnaval dan masa depanmu diramalkan oleh peramal? Atau pernahkah kamu bermain dengan bola ajaib delapan?
                    Kalau begitu kamu mungkin tahu bahwa mereka tidak benar-benar bisa meramal masa depanmu, tapi tetap saja seru untuk dimainkan!

                    Di level-level berikutnya kamu bisa belajar cara membuat mesin peramal nasibmu sendiri!
                    Di level 1 kamu bisa mulai dengan mudah dengan membiarkan Hedy memperkenalkan dirinya sebagai peramal dan membiarkannya mengulang jawaban pemain.
                    Seperti ini:
                example_code: |
                    ```
                    _ Halo, aku Hedy sang peramal!
                    _ Siapa kamu?
                    _ Ijinkan aku melihat bola kristal ku
                    _ Aku lihat... Aku lihat...
                    _ Nama kamu adalah _
                    ```

                    Hedy sekarang hanya memberitahukan nama kamu. Dapatkah kamu membuat Hedy dapat memberitahukan hal-hal lain tentang masa depan kamu?

                    Tentu saja, Hedy bukan peramal yang baik, karena dia hanya bisa mengulang jawaban yang diberikan oleh pengguna!
                    Lihatlah level 2 dan tingkatkan kemampuan peramal kamu.
                story_text_2: |
                    ### Latihan
                    Salin kode contoh ke layar inputmu dan isi bagian kosong agar kode berjalan.
                    **Tambahan** Ubah kode dan biarkan peramal tidak hanya menebak namamu, tapi juga umurmu, tim olahraga favoritmu, atau hal lain tentang dirimu.
                answer_code: |
                    ```
                    {print} Halo, aku Hedy si peramal!
                    {ask} Siapa kamu?
                    {print} Biar aku lihat di bola kristalku
                    {print} Aku melihat... Aku melihat...
                    {print} Namamu adalah {answer}
                    {ask} Berapa tahun kamu sudah hidup?
                    {print} Menarik
                    {print} Bola kristalku memberitahuku kamu berumur {answer}
                    {ask} Olahraga apa yang kamu mainkan?
                    {print} Bolanya... bolanya...
                    {print} Ia memberitahuku olahraga favoritmu...
                    {print} Ia memberitahuku kamu bermain {answer}
                    ```
            3:
                story_text: |
                    Di level-level sebelumnya kamu sudah membuat mesin peramal nasib pertamamu, tapi Hedy belum benar-benar bisa meramal apa pun.
                    Di level ini kamu bisa menggunakan variabel dan perintah `{at} {random}` untuk benar-benar membiarkan Hedy memilih jawaban untukmu. Lihat kode ini misalnya:
                example_code: |
                    ```
                    {print} Aku Hedy si peramal!
                    question {is} {ask} Apa yang ingin kamu ketahui?
                    {print} Ini yang ingin kamu ketahui: question
                    answers {is} yes, no, maybe
                    {print} Bola kristalku berkata...
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
                story_text_2: |
                    ### Latihan
                    Sekarang, Hedy hanya bisa menjawab ya, tidak, atau mungkin. Bisakah kamu memberi Hedy lebih banyak opsi jawaban, seperti 'pasti' atau 'tanya lagi'.
                answer_code: |-
                    ```
                    {print} Aku Hedy si peramal!
                    question {is} {ask} Apa yang ingin kamu ketahui?
                    {print} Ini yang ingin kamu ketahui: question
                    answers {is} yes, no, maybe, definitely, i dont know, try again
                    {print} Bola kristalku berkata...
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
            6:
                story_text: |
                    ### Latihan
                    Dalam kode contoh kamu melihat cara membuat program peramal yang memungkinkanmu memiringkan peluang agar menguntungkanmu. Program curang ini selalu memberitahumu bahwa kamu akan menang lotre, tapi teman-temanmu tidak akan pernah menang.

                    Gunakan ini untuk membuat programmu sendiri, berkreasilah! Misalnya kamu bisa membuat kode yang meramalkan bahwa:
                    * tim olahraga favoritmu akan mengalahkan semua pesaing!
                    * film favoritmu akan dipilih untuk malam film!
                    * kamu memenangkan tiket ke pertunjukan favoritmu!
                    * kamu yang paling adil di antara mereka semua, seperti cermin ajaib Snow White.
                    Biarkan imajinasimu bekerja!

                    Programmu harus terdiri dari setidaknya 10 baris kode dan perlu memiliki setidaknya satu perintah `{if}` dan `{else}`.
                example_code: |
                    ```
                    friends {is} Jordan, Lucy, Dave
                    {print} 'Aku bisa memprediksi apakah kamu akan menang lotre besok!'
                    person {is} {ask} 'Siapa kamu?'
                    good_answer {is} Hore! Kamu menang!, Kamu pasti akan menang!, Kita punya pemenang!
                    bad_answer {is} Sial! Coba lagi!, Orang lain akan menang, Kamu kalah!
                    {if} person {in} friends
                    {print} bad_answer {at} {random}
                    {else}
                    {print} good_answer {at} {random}
                    ```
                answer_code: |
                    ```
                    friends {is} Jordan, Lucy, Dave
                    {print} 'Aku bisa memprediksi masa depan...'
                    {sleep} 2
                    {clear}
                    {print} 'Aku bisa memprediksi apakah tim olahraga favoritmu akan menang atau tidak'
                    person {is} {ask} 'Siapa kamu?'
                    good_answer {is} Hore! Timmu akan menang!, Timmu pasti akan menang!, Timmu akan menang! Hore!
                    bad_answer {is} Sial! Timmu tidak akan menang!, Yah... Tim olahraga favoritmu akan kalah..., Tim favoritmu akan kalah
                    {if} person {is} {in} friends
                    {print} bad_answer {at} {random}
                    {else}
                    {print} good_answer {at} {random}
                    ```
            7:
                story_text: |
                    Di level ini kamu bisa menggunakan matematika dalam prediksi peramalmu. Ini memungkinkanmu membuat rumus (konyol) untuk menghitung masa depan.
                    Misalnya kamu bisa menghitung seberapa kaya kamu nanti atau berapa banyak anak yang akan kamu miliki saat dewasa.

                    ### Latihan
                    Bisakah kamu memikirkan mesin peramal nasibmu sendiri (yang konyol)?
                example_code: |
                    ```
                    {print} 'Aku Hedy si peramal!'
                    {print} 'Aku bisa memprediksi berapa banyak anak yang akan kamu miliki saat dewasa!'
                    age = {ask} 'Berapa umurmu?'
                    siblings = {ask} 'Kamu punya berapa saudara?'
                    length = {ask} 'Berapa tinggi badanmu dalam sentimeter?'
                    kids = length / age
                    kids = kids - siblings
                    {print} 'Kamu akan punya...'
                    {sleep}
                    {print} kids ' anak!'
                    ```
                answer_code: |
                    Jawaban sendiri
