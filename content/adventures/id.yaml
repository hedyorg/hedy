            15:
                story_text: |
                    ### Latihan 2
                    **Ini bagian kedua dari petualangan ini.** Petualangan dimulai di petualangan sebelumnya.
                    Tentu saja, kamu tidak selalu ingin menghitung rata-rata 4 tes. Mungkin kamu ingin menghitung rata-rata 10 tes atau hanya 2...
                    Kita bisa memperbaiki masalah ini dengan menambahkan argumen dan variabel 'amount_of_tests'.
                    * Mulai baris baru di baris 3. Setel argumen amount_of_tests dengan menanyakan siswa berapa banyak tes yang sudah mereka kerjakan.
                    * Ubah angka 4 di baris 4 menjadi argumen baru amount_of_tests.
                    * Terakhir, ubah angka 4 di baris 6 menjadi amount_of_tests

                    Coba program barumu. Apakah bekerja?

                    ### Latihan 3
                    Mau membuat programmu lebih baik lagi? Bagus! Di program sebelumnya kamu hanya bisa menghitung rata-rata nilai 1 mata pelajaran, tapi akan lebih baik jika bisa menghitung rata-rata nilai untuk semua mata pelajaran yang kamu mau!
                    Kami tidak akan memberi tahu caranya, tapi kami beri satu tips: Mulai kodemu di baris 1 dengan: `{def} calculate_mean_grade(subject):`.
                example_code: |
                    ```
                    # Gunakan kodemu sendiri dari petualangan sebelumnya.
                    ```
                answer_code: |
                    Latihan 2
                    ```
                    {def} calculate_mean_grade():
                        total = 0
                        amount_of_tests = {input}("Kamu sudah mengerjakan berapa tes?")
                        {for} i {in} {range} (1, amount_of_tests):
                            grade = {input}("Nilai berapa yang kamu dapat untuk ujian ke-", i, '?')
                        total = total + grade
                        {return} total / amount_of_tests

                    mean_grade = calculate_mean_grade
                    {print}('Rata-rata nilaimu adalah ', mean_grade)
                    ```

                    Latihan 3
                    ```
                    {def} calculate_mean_grade(subject):
                        total = 0
                        amount_of_tests = {input}("Kamu sudah mengerjakan berapa tes untuk ", subject)
                        {for} i {in} {range} (1, amount_of_tests):
                            grade = {input} ("Nilai berapa yang kamu dapat untuk ujian ke-", i, '?')
                            total = total + grade
                        {return} total / amount_of_tests

                    amount_of_subjects = {input}('Kamu ingin menghitung rata-rata nilai untuk berapa mata pelajaran?')
                    {repeat} amount_of_subjects {times}
                        subject = {input}('Mata pelajaran apa yang ingin kamu hitung rata-rata nilainya?')
                        mean_grade = calculate_mean_grade(subject)
                        {print} ('Rata-rata nilaimu untuk ', subject, ' adalah ', mean_grade)
                    ```
