                    Perintah baru lain di level ini adalah `{sleep}`, yang menjeda programmu selama satu detik. Jika kamu mengetik angka di belakang perintah `{sleep}`, program akan jeda selama jumlah detik itu.

                    ### Latihan
                    Berlatih perintah baru ini dengan membuat kodemu sendiri di mana kamu menggunakan perintah `{sleep}` setidaknya 3 kali. Dengan setiap perintah `{sleep}` waktu jedanya harus berbeda.
