    functions:
        name: fungsi
        default_save_name: fungsi
        description: fungsi
        levels:
            12:
                story_text: |
                    Di level ini kamu akan belajar menggunakan **fungsi**. Fungsi adalah blok kode yang bisa dengan mudah kamu gunakan beberapa kali. Menggunakan fungsi membantu kita mengatur potongan kode yang bisa kita pakai berulang kali.
                    Untuk membuat fungsi, gunakan `{define}` dan beri nama fungsi itu. Lalu masukkan semua baris yang ingin ada di dalam fungsi ke dalam blok berindentasi di bawah baris `{define}`.
                    Tinggalkan satu baris kosong di kodemu agar terlihat rapi dan rapi. Kerja bagus! Kamu sudah membuat fungsi!

                    Sekarang, setiap kali kita membutuhkan blok kode itu, kita cukup menggunakan nama fungsi untuk memanggilnya! Kita tidak perlu mengetik blok kode itu lagi.

                    Lihat kode contoh permainan Twister ini. Fungsi 'turn' berisi blok kode yang memilih anggota tubuh mana yang harus pergi ke mana.

                    ### Latihan
                    Selesaikan kode ini dengan mengatur 2 variabel `chosen_limb` dan `chosen_color`.
                    Lalu, pilih berapa kali kamu ingin memanggil fungsi untuk memutar pemutar twister.

                    ### Latihan 2
                    Tingkatkan kodemu dengan menambahkan variabel bernama 'people'. Gunakan variabel itu untuk memberi semua pemain perintah mereka sendiri dalam permainan.
                    Misalnya: 'Ahmed, tangan kanan di hijau' atau 'Jessica, kaki kiri di kuning'.
                example_code: |
                    ```
                    #Memberikan opsi Twister:
                    sides = 'left', 'right'
                    limbs = 'hand', 'foot'
                    colors = 'red', 'blue', 'green', 'yellow'

                    #Mendefinisikan satu giliran Twister:
                    {define} next_turn
                        chosen_side = sides {at} {random}
                        chosen_limb = limbs _
                        chosen_color = colors _
                        {print} chosen_side ' ' chosen_limb ' on ' chosen_color

                    #Memainkan permainan Twister:
                    {print} 'Ayo main Twister!'
                    {repeat} _ _
                        call next_turn
                        {sleep} 2
                    ```
                answer_code: |
                    ```
                    sides = 'left', 'right'
                    limbs = 'hand', 'foot'
                    colors = 'red', 'blue', 'green', 'yellow'
                    players = 'Ahmed', 'Jessica'

                    {define} next_turn
                        {for} player {in} players
                            chosen_side = sides {at} {random}
                            chosen_limb = limbs {at} {random}
                            chosen_color = colors {at} {random}
                            {print} player ', letakkan ' chosen_side ' ' chosen_limb 'mu di ' chosen_color
                            {sleep} 2

                    {print} 'Ayo main Twister!'
                    {call} next_turn
                    ```
            15:
                story_text: |
                    Di level 12 kami sudah memperkenalkanmu pada fungsi. Kamu menulis sepotong kode di dalam fungsi.
                    Jika kamu memanggil fungsi ini, ia akan menjalankan semua kode di dalam fungsi. Sangat bagus saat kamu harus mengulang sepotong kode!

                    Di level ini kita akan melanjutkan dengan fungsi dan menunjukkan bagaimana itu bisa lebih berguna lagi.
                    Kita mulai menulisnya dengan cara Python. Kita akan menggunakan `{def}` sekarang dan menambahkan `():` di belakang fungsi.
                    Untuk memanggil fungsi, cukup ketik nama fungsi dan (), seperti yang kami lakukan di baris 8.

                    ### Latihan
                    Tambahkan fungsi yang memainkan melodi sedih (seperti C6-C5-C4) dan panggil fungsi itu saat jawaban salah diberikan.
                example_code: |
                    ```
                    #Mendefinisikan nada bahagia dan sedih:
                    {def} play_happy_tune():
                        {play} C4
                        {play} C5
                        {play} C6

                    #Menanyakan pertanyaan:
                    answer = {input}('Berapa 2 + 2?')
                    {if} answer == 4:
                        {print}('Benar!')
                        play_happy_tune()
                    {else}:
                      {print}('Salah!')
                    ```
                answer_code: |-
                    ```
                    {def} play_happy_tune():
