                    ### Latihan
                    Program harus:
                    * Dimulai dengan salam dan pendaftaran sederhana nama dan tanggal lahir pasien
                    * Melakukan triase. Apakah kulit hanya merah: luka bakar derajat pertama. Apakah ada lepuhan: luka bakar derajat kedua. Apakah kulit hilang/menghitam/memutih karena luka bakar: luka bakar derajat ketiga.
                    * Memberi pasien saran yang sesuai. Derajat pertama: Dinginkan luka dengan air dan oleskan krim. Kamu tidak perlu ke dokter. Derajat kedua: Dokter akan memeriksa dan meresepkan krim khusus. Silakan tunggu di area tunggu. Derajat ketiga: Silakan ke meja layanan sekarang. Kamu butuh penanganan darurat sesegera mungkin.
                answer_code: |
                    ```
                    name {is} {ask} 'masukkan namamu'
                    dob {is} {ask} 'masukkan tanggal lahirmu'
                    first_degree {is} {ask} 'Apakah kulitnya merah?'
                    second_degree {is} {ask} 'Apakah ada lepuhan di kulit?'
                    third_degree {is} {ask} 'Apakah kulitnya hilang/menghitam/memutih karena luka bakar?'
                    {if} first_degree {is} 'yes'
