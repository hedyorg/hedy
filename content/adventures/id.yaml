            10:
                story_text: |
                    Staf di unit gawat darurat kami punya masalah. Mereka mengatakan banyak pasien datang yang sebenarnya tidak dalam keadaan darurat dan seharusnya pergi ke dokter umum mereka.
                    Orang-orang ini memenuhi ruang tunggu dan menambah beban kerja staf kami. Maukah kamu membantu staf unit gawat darurat dengan membuat aplikasi triase yang memberi tahu pasien apakah mereka harus pergi ke unit gawat darurat atau tidak?
                    ### Latihan
                    Programmu harus memberi tahu pasien apakah mereka harus 'pergi ke unit gawat darurat sesegera mungkin', 'telepon penyedia layanan kesehatanmu untuk mendiskusikan situasimu', atau 'pergi ke dokter umummu sendiri secepatnya'.
                    Program akan menanyakan pertanyaan-pertanyaan ini:
                    * Apakah situasimu mengancam jiwa?
                    * Apakah kamu mengalami kesulitan bernapas?
                    * Apakah kamu tiba-tiba tidak bisa berbicara, melihat, berjalan, atau bergerak?
                    * Apakah kamu menelan atau menghirup racun?
                    * Apakah kamu patah tulang?
                    * Apakah kamu mengalami reaksi alergi serius?
                    * Apakah kamu mengalami nyeri hebat?

                    Jika pasien menjawab 'ya' untuk pertanyaan mana pun, program akan memberi tahu mereka untuk pergi ke unit gawat darurat sesegera mungkin. Program tidak akan menanyakan pertanyaan lain, karena waktu sangat penting.
                    Jika pasien menjawab 'tidak' untuk semua pertanyaan, program akan bertanya:
                    * Bisakah menunggu sampai besok?
                    Jika jawabannya 'ya', program akan memberi tahu pasien untuk pergi ke dokter umum secepatnya. Jika jawabannya 'tidak', program akan menyarankan untuk menelepon penyedia layanan kesehatan mereka untuk mendiskusikan situasi tersebut.
                answer_code: |
                    ```
                    lifethreatening = {ask} 'Apakah situasimu mengancam jiwa?'
                    {if} lifethreatening {is} 'yes'
                        {print} 'Pergi ke unit gawat darurat SEKARANG JUGA!'
                    {else}
                        breathing = {ask} 'Apakah kamu mengalami kesulitan bernapas?'
                        {if} breathing {is} 'yes'
                            {print} 'Pergi ke unit gawat darurat SEKARANG JUGA!'
                        {else}
                            ability = {ask} 'Apakah kamu tiba-tiba tidak bisa berbicara, melihat, berjalan, atau bergerak?'
                            {if} ability {is} 'yes'
                               {print} 'Pergi ke unit gawat darurat SEKARANG JUGA!'
                            {else}
                     poison = {ask} 'Apakah kamu menelan atau menghirup racun?'
                               {if} poison {is} 'yes'
                                    {print} 'Pergi ke unit gawat darurat SEKARANG JUGA!'
                                {else}
                                    broken_bone = {ask} 'Apakah kamu patah tulang?'
                                    {if} broken_bone {is} 'yes'
                                        {print} 'Pergi ke unit gawat darurat SEKARANG JUGA!'
                                    {else}
                                    allergy = {ask} 'Apakah kamu mengalami reaksi alergi serius?'
                            {if} allergy {is} 'yes'
                                            {print} 'Pergi ke unit gawat darurat SEKARANG JUGA!'
                                        {else}
                           wait = {ask} 'Bisakah menunggu sampai besok?'
                                            {if} wait {is} 'yes'
                                                {print} 'Pergi ke dokter umummu secepatnya.'
                                            {else}
                               {print} 'Telepon penyedia layanan kesehatanmu untuk mendiskusikan situasi'
                    ```
