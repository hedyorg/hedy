                    {print} 'Monday the dishes are done by: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'Tuesday the dishes are done by: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'Wednesday the dishes are done by: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'Thursday the dishes are done by: ' dishwasher
                    {remove} dishwasher {from} people

                    people = mom, dad, Emma, Sophie
                    dishwasher = people {at} {random}
                    {print} 'Friday the dishes are done by: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'Saturday the dishes are done by: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'Sunday the dishes are done by: ' dishwasher
                    {remove} dishwasher {from} people
                    ```
            8:
                story_text: "Dengan `{repeat}` kamu bisa mengulang potongan kode. Kamu bisa menggunakan ini untuk menghitung siapa yang akan mencuci piring selama beberapa hari!\n### Latihan\nGunakan perintah `{repeat}` untuk menentukan siapa yang perlu mencuci piring selama seminggu penuh. Setiap bagian kosong harus diisi dengan satu perintah atau angka!\n**Tambahan** Bisakah kamu memikirkan tugas lain di rumah? Sesuaikan kode agar memutuskan tiga pekerjaan rumah tangga. Jangan lupa mencetak tugas apa saja itu!\n"
                example_code: |
