                    people = mom, dad, Emma, Sophie
                    {repeat} _ _ {print} 'Mencuci piring akan dilakukan oleh ' _ _ _
                    ```
                answer_code: |
                    ```
                    people = mom, dad, Emma, Sophie
                    {repeat} 7 {times} {print} 'Mencuci piring akan dilakukan oleh ' people {at} {random}

                    #Tambahan
                    {repeat} 7 {times} {print} 'Mengajak anjing jalan akan dilakukan oleh ' people {at} {random}
                    {repeat} 7 {times} {print} 'Membuang sampah akan dilakukan oleh ' people {at} {random}
                    ```
            11:
                story_text: |
                    Di level ini kamu bisa membuat jadwal untuk seminggu penuh dengan cara mudah!

                    ### Latihan
                    Tambahkan tugas kedua, seperti menyedot debu atau merapikan, dan pastikan juga dibagi untuk seminggu penuh.
                    <br> **Tambahan** Program ini tidak adil, kamu bisa tidak beruntung dan mencuci piring sepanjang minggu. Bagaimana cara membuat program ini lebih adil?
                example_code: |
                    ```
                    days = Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
