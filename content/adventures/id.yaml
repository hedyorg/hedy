                    * Memeriksa apakah itu ada di daftar 'makanan tidak aman'.
                    * Jika ada di daftar makanan tidak aman, beri tahu pasien bahwa itu tidak aman dimakan.
                    * Jika tidak ada di daftar, beri tahu pasien bahwa itu kemungkinan aman dimakan.
                    * Lalu aplikasi juga memperingatkan orang untuk selalu menggunakan akal sehat karena daftarnya mungkin tidak 100% lengkap. Dan menyarankan orang untuk selalu menghindari daging mentah, ikan, telur, dan alkohol.
                    Saat hamil, tidak aman memakan: sushi, udang, tuna, keju biru, tiramisu, telur setengah matang, carpaccio, steak langka, tartar
                answer_code: |
                    ```
                    {print} "Makan atau tidak makan, itu pertanyaannya!"
                    food {is} {ask} 'Kamu mau makan apa?'
                    unsafe_foods {is} sushi, shrimp, tuna, blue cheese, tiramisu, runny eggs, carpaccio, rare steak, tartar
