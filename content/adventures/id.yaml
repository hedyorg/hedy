            7:
                story_text: |
                    Perawat kami melacak keseimbangan cairan pasien kami. Keseimbangan cairan adalah berapa banyak cairan yang didapat pasien hari ini (dengan minum, makan, atau infus) dikurangi berapa banyak cairan yang hilang hari ini (dengan buang air kecil atau muntah).
                    Keseimbangan cairan harus tetap positif. Jika keseimbangan cairan negatif, perawat perlu memberikan lebih banyak cairan infus.
                    Bisakah kamu membantu perawat kami dengan membuat alat yang bisa mereka gunakan untuk menghitung keseimbangan cairan pasien mereka?
                    ### Latihan
                    Program harus:
                    * Meminta berapa banyak cairan yang didapat pasien dari minum hari itu.
                    * Meminta berapa banyak cairan yang didapat pasien dari makan hari itu.
                    * Meminta berapa banyak cairan yang didapat pasien dari infus mereka hari itu.
                    * Meminta berapa banyak cairan yang hilang pasien dari buang air kecil hari itu.
                    * Meminta berapa banyak cairan yang hilang pasien dari muntah hari itu.
                    * Menghitung keseimbangan cairan pasien dan menampilkannya ke perawat.
                    * Memberitahu perawat untuk memeriksa apakah keseimbangan itu positif atau negatif untuk memutuskan apakah pasien butuh lebih banyak cairan infus hari ini atau tidak.
                answer_code: |
                    ```
                    intake_drinking = {ask} 'berapa banyak cairan yang didapat pasien dari minum?'
                    intake_eating = {ask} 'berapa banyak cairan yang didapat pasien dari makan?'
                    intake_IV = {ask} 'berapa banyak cairan yang didapat pasien dari infus?'
                    discharge_urine = {ask} 'berapa banyak cairan yang hilang pasien dari buang air kecil?'
                    discharge_vomit = {ask} 'berapa banyak cairan yang hilang pasien dari muntah?'
                    fluid_balance = intake_drinking + intake_eating + intake_IV - discharge_urine - discharge_vomit
                    {print} "Keseimbangan cairan pasien adalah " fluid_balance
                    {print} 'Silakan periksa apakah keseimbangan itu positif atau negatif untuk memutuskan apakah pasien butuh lebih banyak cairan infus hari ini atau tidak'
                    ```
            8:
                story_text: |
                    Pasien kami kadang lupa minum obat mereka, menyebabkan masalah kesehatan serius. Untuk memastikan pasien minum semua pil yang diresepkan, kami memberi mereka jam alarm yang berbunyi setiap kali mereka perlu minum obat.
                    Bisakah kamu membantu dengan membuat alarm pil?

                    ### Latihan
                    Program harus:

                    #Bagian 1, Pengaturan untuk perawat
                    * Mulai dengan memberi perawat kesempatan mengatur nama pasien.
                    * Lalu mereka harus mengisi berapa banyak pil yang harus diminum pasien pada dosis pertama (jam 8 pagi), kedua (siang), dan terakhir hari itu (jam 4 sore).
                    * Ucapkan terima kasih kepada perawat dan beri tahu mereka untuk memberikan alarm ke pasien. Hapus layar dua detik setelah pesan ini.

                    #Bagian 2, Dosis pertama
                    * Sapa pasien dengan nama dan beri tahu mereka alarm ini akan berbunyi saat mereka perlu minum obat.
                    * Berbunyi 3 kali
                    * Beri tahu pasien bahwa ini jam 8 pagi dan waktu untuk dosis pertama mereka.
                    * Tanyakan pada pasien 'Apakah kamu sudah minum pil?' sebanyak jumlah pil yang harus mereka minum pada dosis pertama.
                    * Beri tahu pasien bahwa mereka sudah minum semua dosis pertama dan hapus layar setelah 2 detik.

                    #Bagian 3, Dosis kedua
                    * Tunggu 4 detik (dalam kenyataannya ini 4 jam)
                    * Bunyikan alarm dengan cara yang sama seperti untuk dosis pertama.

                    #Bagian 4, Dosis terakhir
                    * Tunggu 4 detik (dalam kenyataannya 4 jam)
                    * Bunyikan alarm untuk dosis terakhir hari itu.
                answer_code: |-
                    ```
                    #Pengaturan untuk perawat
                    {print} 'Selamat pagi, perawat. Silakan isi informasi yang benar untuk pasien.'
                    name {is} {ask} 'Nama pasien ini apa?'
                    first_dose {is} {ask} 'Berapa pil yang diminum ' name ' jam 8 pagi?'
                    second_dose {is} {ask} 'Berapa pil yang diminum ' name ' siang hari?'
                    last_dose {is} {ask} 'Berapa pil yang diminum ' name ' jam 4 sore?'
                    {print} 'Terima kasih, kamu bisa memberikan pelacak ke pasien sekarang.'
                    {sleep} 2
                    {clear}

                    #Dosis pertama
                    {print} 'Halo ' name ' Aku pelacak obatmu. Aku akan berbunyi saat kamu perlu minum obat.'
                    {repeat} 3 {times} {play} C4
                    {print} "Sekarang jam 8 pagi, waktu untuk dosis pertamamu"
                    {repeat} first_dose {times} pill {is} {ask} 'Apakah kamu sudah minum pil?'
                    {print} 'Kamu sudah minum semua dosis pertamamu, ' name
                    {sleep} 2
                    {clear}

                    #Dosis kedua
                    {sleep} 4
