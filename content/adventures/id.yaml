                    tries = 0
                    _
                    _
                    _
                    _
                    _
                    {print}('Ya! Kamu melempar 6 dalam ', tries, ' percobaan.')
                    ```
                answer_code: |
                    ```
                    options = [1, 2, 3, 4, 5, 6]
                    {print}('Lempar 6 secepat yang kamu bisa!')
                    thrown = 0
                    tries = 0
                    {while} thrown == 0:
                        number = options[{random}]
                        tries = tries + 1
                        {if} number == 6:
                          thrown = 1
                            {print}('Kamu melempar 6 dalam ', tries, ' percobaan!')
                        {else}:
                            {print}('Kamu belum melempar 6, malah kamu melempar ', number)
                        {sleep} 1
                    ```
    dishes:
        name: cuci piring?
        default_save_name: Piring
        description: Gunakan komputer untuk melihat siapa yang mencuci piring
        levels:
            3:
                story_text: |-
                    Apakah kamu selalu berdebat di rumah tentang siapa yang harus mencuci piring atau membuang sampah hari ini?

                    Maka kamu dapat meminta komputer untuk memilih secara adil. Kamu dapat membuat programnya di level 2!

                    Kamu pertama harus membuat daftar anggota keluargamu. Lalu pilihlah dengan `{at} {random}` dari dalam daftar tersebut.
                example_code: |
                    ```
                    orang {is} ibu, ayah, Emma, Sophie
                    {print} orang {at} {random}
                    ```
                story_text_2: |
                    ### Latihan
                    Buat versimu sendiri dari program pencuci piring. Pertama buat daftar anggota keluargamu.
                    Lalu pikirkan tugas yang perlu dilakukan, dan biarkan komputer memutuskan siapa yang harus melakukan tugas itu dengan perintah `{at} {random}`.

                    **Tambahan** Tidak mau mencuci piring sendiri? Hack programnya dengan menghapus namamu dari daftar menggunakan perintah `{remove}` `{from}`.
                answer_code: |-
                    ```
                    people is mom, dad, Emma, Sophie
                    name {is} {ask} siapa namamu?
                    {remove} name {from} people
                    {print} people {at} {random} harus mencuci piring
                    ```
            4:
                story_text: |-
                    Dengan kutip satu, kamu dapat membuat rencana cuci piring kamu lebih cantik.
                    Kali ini kode contohnya tidak terlalu lengkap.

                    Dapatkah kamu melengkapi kode tersebut dengan mengisi bagian yang kosong? Setiap bagian harus diisi dengan sebuah kata atau simbol.

                    Tip: Jangan lupa tanda kutip satu!
                example_code: |
                    ```
                    people {is} mom, dad, Emma, Sophie
                    {print} _ piring dicuci oleh _
                    {sleep}
                    {print} people {at} _
                    ```
                answer_code: |
                    ```
                    people is mom, dad, Emma, Sophie
                    {print} 'piring dicuci oleh...'
                    {sleep}
                    {print} people {at} {random}
                    ```
            5:
                story_text: "Dengan `{if}` sekarang kamu bisa lebih seru dengan pilihan di program. Kamu bisa membuat programmu merespons pilihan yang dibuat komputer.\n### Latihan\nBisakah kamu menyelesaikan kode agar mencetak 'sayang sekali' saat giliranmu dan jika tidak 'ya!'?\nJangan lupa tanda kutip!\n"
                example_code: |
                    ```
                    people {is} mom, dad, Emma, Sophie
                    dishwasher {is} people {at} {random}
                    _ dishwasher {is} Sophie {print} _ sayang sekali aku harus mencuci piring _
                    _ {print} 'syukurlah tidak cuci piring karena ' _ ' sudah mencuci'
                    ```
                answer_code: |
                    ```
                    people {is} mom, dad, Emma, Sophie
                    dishwasher {is} people {at} {random}
                    {if} dishwasher {is} Sophie {print} 'sayang sekali aku harus mencuci piring'
                    {else} {print} 'syukurlah tidak cuci piring karena ' dishwasher ' sudah mencuci'
                    ```
            7:
                story_text: Dengan `{repeat}`, kamu dapat mengulang bagian-bagian kode. Kamu dapat melakukan ini untuk menentukan siapa yang akan mencuci piring selama seminggu kedepan.
                example_code: |
                    ```
                    people = mom, dad, Emma, Sophie
                    emma_washes = 0
                    dishwasher = people {at} {random}
                    {print} 'Pencuci piring adalah ' dishwasher
                    {if} dishwasher {is} Emma
                    emma_washes = emma_washes + 1
                    {print} 'Emma akan mencuci piring minggu ini ' emma_washes ' kali'
                    ```

                    Sekarang kamu bisa menyalin baris 3 sampai 5 beberapa kali (misalnya 7 kali untuk seminggu penuh) untuk menghitung lagi untuk seminggu penuh.
                    Mau membuat kode untuk seminggu penuh?
                story_text_2: |
                    Jika Anda sangat kurang beruntung, program sebelumnya mungkin memilih Anda untuk mencuci piring selama seminggu penuh! Itu tidak adil!
                    Untuk membuat sistem yang lebih adil Anda dapat menggunakan perintah `{remove}` untuk menghapus orang yang dipilih dari daftar. Dengan cara ini Anda tidak perlu mencuci piring lagi sampai semua orang mendapat giliran.

                    Senin dan Selasa siap untuk Anda! Bisakah Anda menambahkan sisa minggu ini?
                    Dan… dapatkah Anda menemukan solusi ketika daftar Anda kosong?
                example_code_2: |
                    ```
                    people = mom, dad, Emma, Sophie
                    dishwasher = people {at} {random}
                    {print} 'Senin piring dicuci oleh: ' dishwasher
                    {remove} dishwasher {from} people
                    dishwasher = people {at} {random}
                    {print} 'Selasa piring dicuci oleh: ' dishwasher
                    {remove} dishwasher {from} people
                    ```
                answer_code: |
                    ```
                    people = mom, dad, Emma, Sophie
