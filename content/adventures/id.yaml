                story_text: |-
                    Kita akan belajar loop baru, loop `{while}`! Kita melanjutkan loop selama pernyataannya benar.
                    Jadi jangan lupa mengubah nilai dalam loop.

                    Dalam kode contoh, kita melanjutkan sampai jawaban benar diberikan.
