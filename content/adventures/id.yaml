            14:
                story_text: |
                    Petugas kebersihan kami punya daftar tugas besar. Beberapa tugas dilakukan setiap hari, lainnya pada hari, bulan, atau tanggal tertentu. Ini sangat membingungkan dan menyebabkan situasi di mana beberapa tugas terlupakan.
                    Bisakah kamu membantu dengan menulis program yang akan mencetak daftar tugas yang benar untuk hari itu?
                    ### Latihan
                    Program harus:
                    * Mengucapkan selamat pagi kepada petugas kebersihan.
                    * Menanyakan pada petugas kebersihan hari apa dalam seminggu ini, bulan apa, dan tanggal berapa dalam bulan ini.
                    * Mencetak daftar tugas yang benar untuk hari itu.
                    Tugas yang harus dilakukan:
                    * Tugas setiap hari: mengepel lantai, membersihkan toilet, membuka tirai
                    * Pada Senin dan Kamis: menyiram tanaman
                    * Pada Selasa dan Jumat: mengepel lantai
                    * Pada Sabtu: mencuci mesin kopi
                    * Pada tanggal 1 setiap bulan: mencuci jendela
                    * Pada tanggal 7 setiap bulan: mengisi ulang mesin penjual otomatis
                    * Pada tanggal 14 setiap bulan: memeriksa baterai untuk alarm kebakaran
                    * Setiap hari di bulan-bulan musim dingin: menyalakan pemanas
                    * Setiap hari di bulan-bulan musim panas: menyalakan pendingin ruangan
                answer_code: |
                    ```
                    {print}("Selamat pagi Petugas Kebersihan")

                    #menanyakan tanggal
                    day = {input}("Hari apa ini?")
                    current_month = {input}("Bulan apa ini?")
                    date = {input}("Tanggal berapa ini?")

                    #mencetak daftar tugas
                    print("Petugas, tugasmu hari ini adalah: ")

                    #menentukan tugas berdasarkan hari dalam seminggu
                    {if} day == "monday" {or} day == "thursday":
                        {print}("siram tanaman")
                    {elif} day == "tuesday" {or} day == "friday":
                        {print}("pel lantai")
                    {elif} day == "saturday":
                        {print}("cuci mesin kopi")

                    #menentukan tugas berdasarkan tanggal
                    {if} date == 1:
                        {print}("cuci jendela")
                    {elif} date == 7:
                        {print}("isi ulang mesin penjual otomatis")
                    {elif} date == 14:
                        {print}("periksa baterai alarm kebakaran")

                    #membuat daftar bulan musim panas dan musim dingin
                    summer_months = ["april", "may", "june", "july", "august", "september"]
                    winter_months = ["october", "november", "december", "january", "february", "march"]

                    #menentukan tugas berdasarkan musim panas atau dingin
                    {for} month {in} summer_months:
                        {if} current_month == month:
                            {print}("nyalakan pendingin ruangan")
                    {for} month {in} winter_months:
                        {if} current_month == month:
                            {print}("nyalakan pemanas")
                    ```
            15:
                story_text: |
                    Setelah operasi, pasien kami kadang mengalami banyak nyeri. Dalam kasus tersebut pasien kami bisa diberi pompa morfin. Mereka bisa memberikan sendiri sedikit morfin jika merasa nyeri.
                    Pompa ini perlu diprogram dengan sangat hati-hati, agar pasien tidak memberi diri mereka sendiri terlalu banyak morfin. Bisakah kamu memprogram pompa morfin untuk kami?
                    ### Latihan
                    Program harus:
                    * Menanyakan pada perawat berapa mililiter morfin yang sudah diterima pasien hari ini.
                    * Memberitahu perawat untuk memberikan perangkat ke pasien
                    * Menanyakan pada pasien seberapa besar nyeri yang mereka rasakan dalam skala 1 sampai 10.
                    * Memberitahu pasien untuk menekan tombol x jika mereka ingin morfin lagi.
                    * Memanggil fungsi start_pump dengan argumen pain_level dan morphine_level jika x ditekan.
                    * Fungsi harus mencetak 'Kamu akan diberikan 20 ml morfin lagi' selama tingkat nyeri pasien lebih besar dari atau sama dengan 6 dan tingkat morfin lebih rendah dari 120.
                    * Setelah memberikan morfin baru program harus tidur selama 2 menit (saat menguji programmu kamu bisa menggunakan 2 detik).
                    * Setelah 2 menit itu, tingkat morfin harus diperbarui (+20ml) dan tingkat nyeri harus diperbarui dengan menanyakan pada pasien bagaimana perasaan mereka sekarang.
                    * Jika tingkat morfin terlalu tinggi atau pasien tidak lagi merasa nyeri, program harus memberi tahu pasien bahwa mereka tidak akan mendapat morfin lagi. Jika mereka sangat kesakitan, beri tahu mereka untuk memanggil perawat.
                    * Memberitahu pasien bahwa pompa akan dimatikan sekarang, dan untuk menekan x jika mereka butuh pompa dinyalakan lagi.
                answer_code: |-
                    ```
                    {print}('Pompa morfin')
                    morphine_level = {input}('Berapa ml morfin yang sudah diterima pasien hari ini?')
                    {print}('tolong berikan perangkat ini ke pasien sekarang')

                    pain_level = {input}('Seberapa besar nyeri yang kamu rasakan dari 1 sampai 10?')
                    {print}('Tekan X untuk memberikan morfin')

                    {define} morphine(pain_level, morphine_level):
                        {print}('Kamu akan diberikan 20 ml morfin lagi')
                        {sleep} 2
                        morphine_level = morphine_level + 20
                        pain_level = {input}('Seberapa besar nyeri yang kamu rasakan dari 1 sampai 10?')
                        {print}('Pompa akan dimatikan sekarang')
                        {return} morphine_level
                        {return} pain_level
                        {sleep} 2

                    {for} i {in} {range} (1,10):
                        wait_for_x = {input}('Tekan X untuk memberikan morfin')
                        {if} wait_for_x == 'x'
                            {if} pain_level >= 6 {and} morphine_level <120:
                                morphine_level = morphine(pain_level, morphine_level)
                                pain_level = morphine(pain_level, morphine_level)
                            {else}:
                                {print}('Tidak aman memberikan morfin lagi sekarang')
                                {print}('Silakan panggil perawat jika kamu terlalu kesakitan')
                    ```
            16:
                story_text: |
                    Mahasiswa kedokteran kami harus mempelajari istilah medis untuk semua bagian tubuh. Mereka tampak kesulitan mengingat semua nama anatomi dan mereka merasa belajarnya sangat membosankan.
                    Bisakah kamu membantu mereka dengan membuat permainan yang memungkinkan mereka berlatih istilah medis?
                    Ini istilah yang harus diketahui mahasiswa: corpus = tubuh, caput = kepala, ocolus = mata, nasus = hidung, auris = telinga, os = mulut, collum = leher, manus = tangan, pectus = dada, humerus = bahu, venter = perut, tergum = punggung
                    ### Latihan
                    Program harus:
                    * Menjadi permainan yang memungkinkan mahasiswa berlatih istilah medis.
                    * Memberi mahasiswa satu poin dan pujian saat mereka menjawab benar.
                    * Mengurangi satu poin dan memberi tahu mereka jawabannya salah saat mereka menjawab salah.
                    * Juga menampilkan jawaban yang benar kepada mahasiswa selama beberapa detik jika mereka menjawab salah, hapus jawaban dari layar lagi, dan terus menanyakan pertanyaan sampai mereka menjawab benar.
                    * Terus bermain sampai mahasiswa sudah menjawab semua pertanyaan dengan benar.
                    * Menampilkan skor akhir kepada mahasiswa.
                    * Memberi mahasiswa umpan balik berdasarkan skor mereka: 12 poin: Luar biasa!, 8–11 poin: Kerja bagus, terus berlatih!, 7 atau kurang: Kamu harus belajar lebih banyak!
                answer_code: |
                    ```
                    points = 0
                    latin_terms = ['corpus', 'caput',  'ocolus',  'nasus', 'auris', 'os', 'collum',  'manus', 'pectus',  'humerus', 'venter', 'tergum']
                    english_terms = ['body', 'head', 'eye', 'nose', 'ear', 'mouth', 'neck', 'hand', 'chest', 'shoulder', 'stomach', 'back']

                    {for} i {in} {range}(1, 12):
                        correct_answer = english_terms[i]
                        answer = 0
                        {while} answer != correct_answer:
                            answer = {input}('Apa nama Inggris untuk ', latin_terms[i], '?')
                            {if} answer != correct_answer:
                             {print}('Itu salah')
                                {print}('Jawaban yang benar untuk ', latin_terms[i], ' adalah ', english_terms[i])
                                {sleep} 3
                     clear
                                points = points - 1
                        points = points + 1
                        {print}('Benar!')

                    {print}("Selamat, kamu sudah berlatih semua istilah!")
                    {print}('Skormu adalah:', points)

                    {if} points == 12:
                     {print}('Luar biasa!')

                    {if} points <=7:
                        {print}('Kamu harus belajar lebih banyak!')
                    {else}:
                        {print}('Kerja bagus, terus berlatih!')
                    ```
