        levels:
            13:
                story_text: |
                    Selamat datang di Karnaval Hedy! Kita akan main Tin Can Alley! Jatuhkan kaleng-kalengnya dan pilih hadiahmu!

                    ### Latihan
                    Isi perintah yang benar setelah {if} agar program berjalan.

                    * Program harus bekerja jika pemain belum mendapat giliran dan berusia di bawah 18 tahun.
                    * Lalu, tampilkan daftar hadiah yang bisa dipilih pemain.
                    * Jika pemain punya poin cukup untuk suatu hadiah (lihat daftar hadiah), cetak hadiah tersebut.
                    * Pemain hanya bisa memenangkan video game jika berusia 14 tahun atau lebih.
                    * Pemain hanya bisa memenangkan balon jika berusia 5 tahun atau lebih muda.
                example_code: |
                    ```
                    #daftar hadiah
                    balloon = 1
                    lollipop = 2
                    video_game = 8
                    teddy_bear = 10

                    {print}('Tin Can Alley!')
                    age = {input}('Umurmu berapa?')
                    already_had_turn = {input}('Kamu sudah pernah main?')

                    # Hadiah apa yang bisa dipilih pemain?
                    {if} _ {or} _:
                        {print}('Kamu boleh main')
                        points = {input}('Kamu dapat berapa poin?')
                        {print}('Kamu bisa pilih dari hadiah-hadiah ini:')

                        {if} _ :
                            {print}('teddy bear')

                        {if} _ :
                            {print}('lollipop')

                        {if} _ {and} _ :
                            {print}('video game')

                        {if} _ {and} :
                            {print}('balloon')

                        chosen_prize = {input}('Hadiah mana yang kamu mau?')
                        {print}('Selamat atas', chosen_prize, 'mu!')

                    {else}:
                        {print}('Maaf, kamu tidak boleh main')
                    ```
                answer_code: |
                    ```
                    #daftar hadiah
                    balloon = 1
                    lollipop = 2
                    video_game = 8
                    teddy_bear = 10

                    {print}('Tin Can Alley!')
                    age = {input}('Umurmu berapa?')
                    already_had_turn = {input}('Kamu sudah pernah main?')

                    {if} already_had_turn != 'yes' {or} age < 18:
                        {print}('Kamu boleh main')
                        points = {input}('Kamu dapat berapa poin?')
                        {print}('Kamu bisa pilih dari hadiah-hadiah ini:')

                        {if} points >= teddy_bear:
                            {print}('teddy bear')

                        {if} points >= lollipop:
                            {print}('lollipop')

                        {if} age >= 14 {and} points >= video_game:
                            {print}('video game')

                        {if} age <= 5 {and} points >= balloon:
                            {print}('balloon')

                        chosen_prize = {input}('Hadiah mana yang kamu mau?')
                        {print}('Selamat atas', chosen_prize, 'mu!')

                    {else}:
                        {print}('Maaf, kamu tidak boleh main')
                    ```
