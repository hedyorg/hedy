adventures:
    story:
        name: cerita
        default_save_name: Cerita
        description: Membuat cerita pendek
        levels:
            1:
                story_text: |
                    Di level 1 kamu bisa membuat cerita dengan karakter utama berbeda yang kamu masukkan sendiri.

                    Pada baris pertama, gunakan `{ask}` dan tanyakan siapa karakter utama ceritanya. Lalu gunakan {answer} jika ingin memakai nama karakter tersebut.

                example_code: "```\n{ask} Karakter utama cerita ini adalah\n{print} {answer} sekarang akan berjalan di hutan\n{print} Agak takut, {answer} terus berjalan\n{print} {answer} mendengar suara-suara aneh di mana-mana\n{print} Mereka takut ini hutan berhantu\n```\n"
                story_text_2: |
                    ### latihan
                    Sekarang buatlah ceritamu sendiri yang terdiri dari 6 baris kode.
                    Ceritanya tidak boleh sama dengan contoh cerita sebelumnya.
                    Setidaknya gunakan minimal satu perintah`{ask}` dan`{answer}`
                    Kamu dapat membuat topik yang kamu inginkan
                    Kalau kamu tidak dapat menentukan topik, gunakan salah satu dari pilihan ini: pergi menonton film, melihat pertandingan olahraga, atau hari mengunjungi kebun binatang
                answer_code: |
                    ```
                    {print} Suatu hari aku pergi ke kebun binatang
                    {ask} Hewan apa yang aku lihat pertama?
                    {print} Pertama aku melihat seekor {answer}
                    {print} Lalu aku melihat penguin
                    {print} Sedang makan siang
                    {ask} Penguin itu makan apa?
                    {print} Penguin itu makan {answer} untuk makan siang
                    ```
            2:
                story_text: |-
                    Pada level 2, kamu dapat membuat ceritanya lebih menyenangkan. Karakter utama kamu sekarang dapat muncul dimanapun pada kalimat-kalimatnya.

                    Kamu dapat memiliki program yang lebih baik dari itu. Tapi kamu harus memberi nama karakter utama kamu terlebih dahulu.

                    Kamu lalu dapat menuliskan nama tersebut dimanapun pada sebuah kalimat.
                example_code: |-
                    ```
                    nama {is} {ask} Apa nama dari karakter utama?
                    {print} sekarang nama akan berlari kedalam hutan
                    {print} nama sedikit ketakutan
                    {print} Tiba-tiba, ia mendengar suara aneh...
                    {sleep}
                    {print} nama takut jika ternyata hutan ini merupakan hutan berhantu
                    ```
                story_text_2: |
                    ### Latihan
                    Sekarang saatnya menambahkan variabel ke ceritamu sendiri yang sudah kamu buat di level sebelumnya.
                    Buka cerita petualangan level 1-mu dan salin kodenya. Tempel kode itu di layar input level ini.

                    Kode ini tidak akan jalan di level ini, karena kamu belum menggunakan variabel.
                    Perbaiki kode dengan menggunakan variabel dan `{is}` bersama perintah `{ask}`, seperti yang sudah kamu pelajari di level ini.

                    **Tambahan** Tambahkan perintah `{sleep}` ke kodemu untuk membangun ketegangan dalam ceritamu.
                answer_code: |
                    ```
                    {print} Suatu hari aku pergi ke kebun binatang
                    first_animal {is} {ask} Hewan apa yang aku lihat pertama?
                    {print} Pertama aku melihat seekor first_animal
                    {print} Lalu aku melihat penguin
                    {print} Sedang makan siang
                    food {is} {ask} Penguin itu makan apa?
                    {print} Penguin itu makan...
                    {sleep} 3
                    {print} food
                    ```
            3:
                story_text: |
                    Di level 3 kamu bisa membuat ceritamu lebih seru. Kamu bisa menggunakan keacakan untuk monster, hewan, atau rintangan lain, seperti ini:
                story_text_2: |
                    The command `{add}` can also come in handy in your story. For example
                example_code_2: |
                    ```
                    {print} Mereka mendengar suara
                    animals {is} 🐿, 🦔, 🦇, 🦉
                    animal {is} {ask} Menurutmu itu apa?
                    {add} animal {to_list} animals
                    {print} itu adalah animals {at} {random}
                    ```
                story_text_3: |
                    Ini adalah contoh perintah `{remove}` dalam cerita Anda

                    ### Latihan
                    Salin cerita Anda dari level sebelumnya ke level ini.
                    Di level ini Anda telah mempelajari 3 perintah baru `{at} {random}` , `{add} {to_list}` dan `{remove} {from}`.
                    Tambahkan baris kode baru ke cerita Anda, sehingga semua perintah baru ditampilkan setidaknya sekali dalam cerita Anda.
                example_code: "```\nhewan {is} 🦔, 🐿, 🦉, 🦇\n{print} Sekarang mereka mendengar suara dari hewan {at} {random}\n```\n"
                example_code_3: |
                    ```
                    {print} Tas punggungnya jadi terlalu berat.
                    {print} Isinya botol air, senter, dan batu bata.
                    bag {is} water, flashlight, brick
                    dump {is} {ask} Barang mana yang harus dibuang?
                    {remove} dump {from} bag
                    ```
                answer_code: |
                    ```
                    animals {is} lion, zebra, flamingo
                    {print} Halo anak-anak! Hari ini kita akan ke kebun binatang!
                    favorite_animal {is} {ask} Hewan mana yang ingin kamu kunjungi hari ini?
                    {add} favorite_animal {to} animals
                    {sleep} 2
                    {print} Ayo menuju animals {at} {random}
                    {sleep}
                    least_favorite_animal {is} {ask} Hewan mana yang tidak ingin kamu lihat?
                    {remove} least_favorite_animal {from} animals
                    {print} Ayo menuju animals {at} {random} sekarang!
                    ```
            4:
                story_text: |
                    ### Latihan
                    Salin kode contoh dan selesaikan dengan menambahkan tanda kutip pada bagian kosong di baris 1 dan 2.
                    Bagian kosong pada baris 3 dan 4 tidak boleh diganti dengan tanda kutip, melainkan dengan perintah `{sleep}` dan `{clear}`. Bisakah Anda membuatnya berhasil?

                    ### Latihan 2
                    Kembali ke level sebelumnya dan salin kode cerita Anda. Jadikan kode berfungsi pada level ini dengan menambahkan tanda kutip di tempat yang tepat.
                    Pikiran: Variabel dalam cerita Anda sendiri harus berada di luar tanda kutip. Sama seperti baris kedua dari kode contoh. Pada baris tersebut nama variabel diletakkan di luar tanda kutip.
                example_code: |
                    ```
                    name {is} {ask} _ Siapa namamu? _
                    {print} _ Karakter utamanya bernama _ name
                    _
                    _
                    {print} name _ sekarang akan berjalan di hutan _
                    {print} name _ agak takut _
                    animals {is} 🦔, 🐿, 🦉, 🦇
                    {print} _ Dia mendengar suara _ animals {at} {random}
                    {print} name _ takut ini hutan berhantu _
                    ```
                answer_code: |
                    ```
                    name {is} {ask} 'Siapa namamu?'
                    {print} 'Karakter utamanya bernama' name
                    {print} name ' sekarang akan berjalan di hutan'
                    {print} name ' agak takut'
                    animals {is} 🦔, 🐿, 🦉, 🦇
                    {print} 'Dia mendengar suara' animals {at} {random}
                    {print} name ' takut ini hutan berhantu'
                    ```
            5:
                story_text: |
                    Di level ini kamu bisa memprogram akhir cerita yang berbeda, yang akan membuat ceritamu lebih seru.
                    Pada contoh kode kamu bisa melihat cara membuat 2 akhir berbeda.

                    ### Latihan 1
                    Tulis cerita pendek baru minimal 6 baris kode tentang topik pilihanmu.
                    Kehilangan inspirasi? Pilih salah satu topik ini: superhero, hari sekolah yang membosankan, terdampar di pulau terpencil.

                    Lalu beri pemain kesempatan memilih akhir bahagia atau buruk, seperti pada contoh kode.
                    Program kedua akhirnya.

                    ### Latihan 2
                    Salin cerita yang sudah kamu buat di petualangan ceritamu sendiri di level-level sebelumnya.
                    Cari cara untuk menambahkan setidaknya 2 perintah `{if}` dan `{else}` ke ceritamu.
                    Bisa dengan akhir bahagia atau buruk, atau coba cara lain untuk memasukkan perintah tersebut.
                example_code: |
                    ```
                    nama {is} {ask} 'Siapa yang berjalan di hutan?'
                    {print} nama 'berjalan melewati hutan'
                    {print} nama 'bertemu monster'
                    akhir {is} {ask} 'Apakah kamu ingin akhir yang baik atau buruk?'
                    {if} akhir {is} nama {print}  nama 'yang bagus  mengambil pedang dan monster itu segera lari'
                    {else} {print} nama 'Monster itu memakan '
                    ```
                answer_code: |
                    ```
                    name {is} {ask} 'Siapa pahlawannya?'
                    {print} 'Waduh pesawatnya jatuh, siapa yang akan menyelamatkan kita?'
                    {print} "Lihat siapa yang terbang di udara, itu " name
                    end {is} {ask} 'Kamu akan menyelamatkan pesawat atau menghancurkannya?'
                    {if} end {is} save {print} name "mendaratkan pesawat, dia menyelamatkan kita!"
                    {else} {print} "Waduh! " name " sedang menghancurkan pesawat, tolong!"
                    ```
            8:
                story_text: |
                    Dalam sebuah cerita, seseorang mengucapkan kata-kata beberapa kali. Misalnya saja ketika seseorang meminta bantuan atau menyanyikan sebuah lagu.
                    Anda dapat memasukkan pengulangan seperti itu ke dalam cerita Anda, di level ini dengan `{repeat}`.

                    ### Latihan
                    Tambahkan pengulangan pada cerita Anda sendiri. Kembali ke program simpanan Anda, pilih program cerita Anda dari level sebelumnya dan
                    temukan baris yang berisi `{print}` dan ulangi!
                example_code: |
                    ```
                    {print} 'Pangeran terus memanggil minta tolong'
                    {repeat} 5 {times} {print} 'Tolong!'
                    {print} 'Kenapa tidak ada yang menolongku?'
                    ```
                answer_code: |
                    ```
                    {print} 'Semua anak ingin pergi ke kebun binatang dan terus berseru!'
                    {repeat} 3 {times} {print} "Ayo ke kebun binatang!"
                    ```
            9:
                example_code: |
                    ```
                    {print} 'OH TIDAK! T-rex semakin mendekat!'
                    end = {ask} 'Kamu ingin akhir bahagia atau sedih?'
                    #Menceritakan akhir bahagia:
                    {if} end {is} happy
                        {print} 'Tepat waktu Richard melompat kembali ke dalam mesin waktu!'
                        {print} _
                    #Menceritakan akhir sedih:
                    {else}
                        {print} 'Oh tidak! Richard terlalu lambat...'
                        {print} _
                    ```
                story_text: |
                    Di level ini kamu bisa menggunakan beberapa baris dalam perintah `{if}`, sehingga kamu bisa meningkatkan akhir bahagia atau sedihmu!

                    ### Latihan 1
                    Kode contoh menunjukkan dua akhir berbeda; satu di mana karakter melompat ke mesin waktu dan satu lagi tidak.
                    Lengkapi bagian kosong dengan setidaknya satu kalimat per akhir.
                    **Tambahan** Buat ceritanya lebih panjang. Apa yang terjadi dalam cerita? Kamu juga bisa menambahkan `{ask}` kedua dengan opsi berbeda.

                    ### Latihan 2
                    Kembali ke program yang sudah kamu simpan, pilih program ceritamu dari level 5. Sekarang tulis akhir baik dan buruk masing-masing minimal tiga baris!
                answer_code: |
                    ```
                    {print} 'OH TIDAK! T-rex semakin mendekat!'
                    end = {ask} 'Kamu ingin akhir bahagia atau sedih?'
                    {if} end {is} happy
                        {print} 'Tepat waktu Richard melompat kembali ke dalam mesin waktu!'
                        {print} 'Fiuh, senang kita berhasil'
                        {print} 'Tepat waktu'
                    {else}
                        {print} 'Oh tidak! Richard terlalu lambat...'
                        {print} 'T-rex mengeluarkan RAUNGAN besar'
                        {print} 'Ia membuka mulutnya dan menelan Richard dalam satu gigitan'
                    ```
            10:
                story_text: |
                    Di level ini kamu bisa menggunakan perintah `{if}` dan `{repeat}` di dalam perintah `{if}` dan `{repeat}` lainnya.
                    Ini memberimu banyak opsi dan sangat membantu membuat ceritamu interaktif.

                    ### Latihan 1
                    Selesaikan kode agar `{if}` bekerja dengan benar.

                    ### Latihan 2
                    Tambahkan `{if}` dan `{else}` untuk bagian cerita saat Robin pulang juga.

                    ### Latihan 3
                    Kembali ke cerita level 8-mu dan gunakan setidaknya dua `{if}` di dalam `{if}` lain.
                example_code: |
                    ```
                    {print} 'Robin sedang berjalan di pusat kota'
                    lokasi = {ask} 'Apakah Robin pergi ke toko atau pulang?'
                    {if} lokasi {is} toko
                        {print} 'Dia memasuki toko.'
                        {print} 'Robin melihat buku yang tampak menarik'
                        buku = {ask} 'Apakah Robin yang membeli bukunya?'
                        {if} buku {is} ya
                        _ {print} 'Robin membeli buku itu dan pulang'
                        _ {else}
                        _ {print} 'Robin meninggalkan toko dan pulang'
                    {else}
                        {print} 'Robin pulang'
                    ```
                story_text_2: |
                    Dengan menggunakan perintah `{and}` dan `{or}`, kamu bisa membuat ceritamu lebih fleksibel. Kamu bisa mengajukan dua pertanyaan dan merespons kombinasi jawabannya.

                    ### Latihan 1
                    Lihat kode contoh dan selesaikan. Lalu tambahkan setidaknya 2 kode `{if}` lagi dengan `{and}` atau `{or}`.

                    ### Latihan 2
                    Cari cerita dari level sebelumnya, dan tambahkan satu `{and}` atau `{or}`.
                example_code_2: |
                    ```
                    {print} 'Pahlawan kita berjalan melewati hutan'
                    {print} 'Jalannya bercabang dua'
                    path = {ask} 'Jalan mana yang harus dia pilih?'
                    weapon = {ask} 'Senjata apa yang dia keluarkan?'
                    {if} path {is} left {and} weapon {is} sword
                        _
                    ```
                answer_code: |
                    ```
                    {print} 'Robin berjalan ke pusat kota'
                    location = {ask} 'Apakah Robin masuk ke toko, atau pulang?'
                    {if} location {is} shop
                        {print} 'Dia masuk ke toko.'
                        {print} 'Robin melihat buku yang tampak menarik'
                        book = {ask} 'Apakah Robin membeli buku itu?'
                       {if} book {is} yes
                            {print} 'Robin membeli buku itu dan pulang'
                        {else}
                            {print} 'Robin meninggalkan toko dan pulang'
                    {else}
                        {print} 'Robin pulang'
                        icecream = {ask} 'Apakah dia mampir beli es krim dalam perjalanan pulang?'
                        {if} icecream {is} yes
                            {print} 'Robin mampir beli es krim dulu'
                      {print} 'Dia memilih sorbet lemon'
                            {print} 'Enak sekali'
                        {else}
                            {print} 'Dia langsung pulang'
                    ```
                answer_code_2: |
                    ```
                    {print} 'Pahlawan kita berjalan melewati hutan'
                    {print} 'Jalannya bercabang dua'
                    path = {ask} 'Jalan mana yang harus dia pilih?'
                    weapon = {ask} 'Senjata apa yang dia keluarkan?'

                    {if} path {is} left {and} weapon {is} sword
                        {print} 'tidak ada monster yang berani mendekati pahlawan.'

                    {if} path {is} left {and} weapon {is} slingshot
                        {print} 'pahlawan diserang oleh owlbear.'

                    {if} path {is} right {or} weapon {is} spellbook
                        {print} 'pahlawan didekati oleh penyihir misterius.'
                    ```
            11:
                story_text: |
                    Di level ini kamu bisa menggunakan perintah `{for}` dalam ceritamu. Dengan begini kamu bisa dengan mudah memprogram buku anak-anak 'Brown bear, Brown bear, what do you see'.

                    ### Latihan

                    Lihat <a href="https://fliphtml5.com/jmlya/nquy"> cerita ini</a> jika kamu belum tahu, dan pastikan dicetak seperti di buku.
                example_code: |
                    ```
                    hewan = _ , _ , _
                    {print} 'Beruang coklat, Beruang coklat'
                    {print} 'Apa yang kamu lihat?'
                    ```
                answer_code: |
                    ```
                    animals = Red Bird, Yellow Duck, Blue Horse, Green Frog, Purple Cat, White Dog, Black Sheep, Gold Fish, Teacher
                    {print} 'Brown bear, Brown bear'
                    {print} 'What do you see?'
                    {for} animal {in} animals
                       {print} 'I see a ' animal ' looking at me'
                        {print} animal ', ' animal
                        {print} 'What do you see?'
                    {print} 'I see children looking at me'
                    {print} 'Children, Children'
                    {print} 'What do you see?'
                    {print} 'We see a '
                    {for} animal {in} animals
                        {print} animal
                    {print} 'looking at us'
                    {print} 'Thats what we see!'
                    ```
            16:
                example_code: |
                    ```
                    keys = 'lost'
                    {print}('Kamu berdiri di tamanmu dan kamu kehilangan kuncimu.')
                    {print}('Di mana kamu ingin mencarinya?')
                    {print}('Kamu bisa pilih: tree, flowerbed, rock, postbox')
                    {while} keys == 'lost':
                        location = {input}('Di mana kamu ingin mencari?')
                        {if} location == 'flowerbed':
                            {print}('Ini dia!')
                            keys = 'found'
                        {else}:
                            {print}('Bukan di ', location)
                    {print}('Sekarang kamu bisa masuk rumah!')
                    ```
                story_text: |
                    Menggunakan loop `{while}` bisa membuat ceritamu lebih menarik. Misalnya, kamu bisa pakai `{while} game == 'on'` sehingga kamu bisa bermain sampai game selesai.
                    Atau kamu bisa pakai `{while} sword == 'lost'` sehingga pemain tidak bisa melanjutkan game sampai mereka menemukan sesuatu.

                    ### Latihan
                    Kode contoh menunjukkan cara menggunakan loop `{while}` dalam cerita. Sekarang **pikirkan skenariomu sendiri** di mana pemain harus menemukan sesuatu sebelum bisa melanjutkan.
                answer_code: |
                    ```
                    rackets = 'lost'
                    {print}('Kamu bersama teman-teman dan ingin main tenis, tapi lupa di mana menaruh raket.')
                    {print}('Di mana kamu ingin mencarinya?')
                    {print}('Kamu bisa pilih: bedroom, shed, cupboard, desk')
                    {while} rackets == 'lost':
                        location = {input}('Di mana kamu ingin mencari?')
                        {if} location == 'desk':
                     {print}('Ini dia! Kamu menemukan 6 raket!')
                            keys = 'found'
                      {else}:
                            {print}('Bukan di ', location)
                    {print}('Sekarang kamu bisa main tenis dengan semua temanmu.')
                    ```
            13:
                example_code: |
                    ```
                    naam = _ 
                    {print}('Selamat datang di cerita ini!')
                    ```
                story_text: |
                    Kita akan mencetak sebuah cerita, dan kita harus menggunakan tanda kurung dengan `{print}`.

                    ### Latihan
                    Buat cerita minimal 5 kalimat. Pertama, gunakan variabel `name` dalam ceritamu. Lalu buat dua variabel lain dan gunakan juga.
                    Tips: Ingat koma dalam `{print}` antara teks dan variabel!
                answer_code: |
                    ```
                    name = 'Hedy'
                    {print}('Welcome to this story!')
                    {print}('Once upon a time there was a parrot called ', name '.')
                    {print}(name, ' loved programming!')
                    {print}("Sadly, the other parrots didn't know how to program.")
                    {print}('One day ', name, ' decided to teach programming to the other parrots.')
                    {print}('The lessons turned out to be a huge success with the other parrots!')
                    ```
            6:
                story_text: |-
                    Sekarang kamu sudah bisa menggunakan `{elif}`, kamu bisa membuat cerita yang lebih interaktif lagi! Misalnya, kamu bisa membuat beberapa karakter dengan sifat berbeda.
                    Atau biarkan pemain memilih jalan mana yang diambil, pintu mana yang dibuka, atau ramuan ajaib mana yang diminum...

                    ### Latihan
                    Buat ceritamu sendiri dengan 3 opsi atau lebih menggunakan `{elif}`.
                example_code: |
                    ```
                    character {is} {ask} 'Siapa yang akan membantumu dalam petualangan ini?'
                    {if} character {is} 'Daisy'
                    {print} 'Kamu memilih Daisy! Dia yang paling pintar di antara mereka semua!'
                    {elif} character {is} 'Jason'
                    {print} 'Kamu memilih Jason! Dia yang paling kuat di antara mereka semua!'
                    {elif} character {is} 'Sam'
                    {print} 'Kamu memilih Sam! Mereka yang paling cepat di antara mereka semua!'
                    ```
                answer_code: |
                    Jawaban sendiri
    add_remove_command:
        name: '{add} {to_list} & {remove} {from}'
        default_save_name: tambahkan_perintah_hapus
        description: memperkenalkan {add} {to_list} dan {remove} {from}
        levels:
            3:
                story_text: |
                    ## {add} {to_list}
                    Kamu bisa menambahkan item ke daftar dengan perintah `{add} {to_list}`. Untuk menambahkan item ke daftar, cukup ketik: `{add} penguin {to_list} animals` atau kamu bisa menggunakan perintah `{ask}` seperti pada kode contoh.
                example_code: |
                    ```
                    binatang {is} anjing, kucing, kanguru
                    seperti {is} {ask} Apa hewan favoritmu?
                    {add} seperti {to_list} binatang
                    {print} Saya memilih binatang {at} {random}
                    ```
                story_text_2: |
                    ## {remove} {from}
                    Jika kamu bisa menambahkan item ke daftar, tentu saja kamu juga bisa menghapusnya. Ini dilakukan dengan perintah `{remove} {from}`.
                example_code_2: |
                    ```
                    binatang {is} anjing, kucing, kanguru
                    tidak_suka {is} {ask} Hewan apa yang tidak kamu suka?
                    {remove} tidak_suka {from} binatang
                    {print} Saya memilih binatang {at} {random}
                    ```
                story_text_3: |
                    ### Latihan
                    Cobalah perintah baru di restoran virtual ini. Tambahkan rasa yang diharapkan pemain ke dalam daftar dan hilangkan rasa yang membuat mereka alergi.
                example_code_3: |
                    ```
                    {print} Milkshake misteri
                    rasa {is} stroberi, coklat, vanila
                    hope {is} {ask} Rasa apa yang kamu harapkan?
                    _
                    alergi {is} {ask} Apakah Anda alergi terhadap rasa apa pun?
                    _
                    {print} Anda mendapatkan milkshake rasa {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} Mystery milkshake
                    flavors {is} strawberry, chocolate, vanilla
                    hope {is} {ask} Rasa apa yang kamu harapkan?
                    {add} hope {to} flavors
                    allergies {is} {ask} Kamu alergi rasa apa?
                    {remove} allergies {from} flavors
                    {print} Kamu dapat milkshake flavors {at} {random}
                    ```
    ask_command:
        default_save_name: tanya_perintah
        description: Pengenalan perintah {ask}
        levels:
            1:
                story_text: |
                    ## Perintah `{ask}`
                    Sekarang kamu sudah bisa menggunakan perintah `{print}`, kamu siap mempelajari perintah berikutnya: `{ask}`. Dengan perintah `{ask}`, kamu bisa mengajukan pertanyaan. Lihat ini:
                example_code: |
                    ```
                    {print} Halo!
                    {ask} Siapa namamu?
                    ```
                story_text_2: |
                    ## `{answer}`
