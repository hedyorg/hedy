            6:
                story_text: |
                    Bidan kami mendapat banyak pertanyaan dari ibu hamil tentang apa yang boleh dan tidak boleh dimakan saat hamil. Bisakah kamu membantu pasien mereka dengan membuat aplikasi yang memberitahu apakah makanan aman atau tidak?
