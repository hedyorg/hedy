                    Kami punya masalah di klinik vaksinasi. Layar yang memanggil pasien berikutnya untuk pergi ke area vaksinasi rusak. Bisakah kamu memperbaikinya?
                    ### Latihan
                    Program harus:
                    * Punya daftar nama pasien dengan janji temu
                    * Menanyakan pada perawat apakah ada pasien baru hari ini dan jika ya berapa banyak.
                    * Menambahkan nama pasien baru ke daftar juga
                    * Lalu program harus memanggil seorang pasien untuk pergi ke area vaksinasi.
                    * Program harus menunggu 10 detik, menghapus layar, dan memanggil pasien berikutnya, sampai setiap pasien di daftar sudah dipanggil.
                answer_code: |
                    ```
                    patients {is} Bert, Julia, Abby, Oscar, Ernie, Rosita, Zoe
                    amount_patients = 7

                    new_patients = {ask} 'Apakah ada pasien baru hari ini?'
                    {if} new_patients {is} yes
                        amount_new_patients = {ask} 'Berapa banyak?'
                        amount_patients = amount_patients + amount_new_patients
                        {repeat} amount_new_patients {times}
                            name = {ask} 'Siapa nama mereka?'
                            {add} name {to} patients
                    {else}
                        {print} 'Tidak ada pasien baru hari ini'

                    {repeat} amount_patients {times}
                        chosen_patient = patients {at} {random}
                        {print} chosen_patient ', silakan ke area vaksinasi'
                        {remove} chosen_patient {from} patients
                        {sleep} 10
                        {clear}
                    ```
