                example_code: "```\n{print} 'Aku punya bunga dengan kelopak ajaib'\n{print} 'Jika kamu memetik kelopaknya, bunga itu akan memberitahumu apakah gebetanmu mencintaimu juga'\namount = {ask} 'Berapa kelopak yang ingin kamu petik?'\noptions = they love you, they love you not\n_ _ _ _ options {at} {random}\n```\n"
                answer_code: |
                    ```
