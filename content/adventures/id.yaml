                    {print} 'happy birthday dear Hedy'
                    {print} 'happy birthday to you'
                    ```
            9:
                story_text: |
                    Di level ini kamu bisa mengulang beberapa baris kode dengan hanya 1 perintah `{repeat}`.
                    Kamu melakukannya dengan membuat blok baris yang ingin kamu ulangi.
                    Baris dalam blok ini akan membutuhkan **indentasi**.
                    Itu berarti meletakkan empat spasi di awal setiap baris. Kamu juga harus melakukan indentasi saat ingin membuat blok hanya satu baris.
                example_code: |
                    ```
                    {repeat} 5 {times}
                        {print} 'Hello everyone'
                        {print} 'This is all repeated 5 times'
                    ```
                answer_code: |
                    ```
                    {print} 'Do you know the muffin man?'
                    {repeat} 2 times
                        {print} 'The muffin man'
                    {print} 'Do you know the muffin man, who lives on Drury Lane?'
                    ```
            10:
                story_text: |
                    Kerja bagus! Kamu sudah mencapai level baru lagi! Di level sebelumnya kamu sudah belajar menggunakan beberapa baris kode dalam perintah `{if}` atau `{repeat}`.
                    Tapi kamu belum bisa menggabungkan keduanya...

                    Kabar baik! Di level ini kamu diizinkan meletakkan `{if}` di dalam `{if}`, `{repeat}` di dalam perintah `{repeat}` dan saling bersilangan.
                    Cobalah!
                example_code: |
                    ```
                    {repeat} 3 {times}
                        order = {ask} 'Apa yang ingin kamu pesan?'
                        {if} order {is} pizza
                            {print} 'Yammie'
                        {else}
                            {print} 'pizza lebih enak!'
                    ```
                answer_code: |
                    Jawaban sendiri
    repeat_command_2:
        name: '{repeat} 2'
        default_save_name: perintah_repeat_2
        description: perintah {repeat} 2
        levels:
            8:
                story_text: |
                    ## Repeat dengan perintah lain dan dengan variabel
                    Kamu sudah berlatih perintah `{repeat}` dalam kombinasi dengan perintah `{print}` sekarang, tapi tahukah kamu bahwa kamu juga bisa menggunakan perintah lain dengan `{repeat}`?
                    Dalam kode contoh ini kamu bisa melihat bahwa `{repeat}` juga bisa digunakan dengan perintah `{ask}`, `{if}`, atau `{else}`.
                example_code: |
                    ```
                    {repeat} 2 {times} answer = {ask} 'Tahukah kamu bahwa kamu bisa bertanya beberapa kali?'
                    {if} answer {is} yes
                    {repeat} 2 {times} {print} 'Kamu sudah tahu itu!'
                    {else}
                    {repeat} 3 {times} {print} 'Kamu sudah belajar sesuatu yang baru!'
                    ```
                story_text_2: |
                    Hal menarik lain yang bisa kamu lakukan dengan perintah `{repeat}` adalah menggunakan variabel untuk mengatur berapa kali sesuatu harus diulang. Dalam kode contoh kamu bisa melihat bahwa kami pertama menanyakan orang itu berapa umur mereka.
                    Lalu, di baris 3, pertanyaannya diulang 'age' kali. Jadi kami sudah menggunakan variabel 'age' dengan perintah `{repeat}`.
                example_code_2: |
                    ```
                    {print} 'Yay! Ini ulang tahunmu!'
                    age = {ask} 'Sekarang kamu umur berapa?'
                    {repeat} age {times} {print} 'Hip Hip Hurray!'
                    ```
                answer_code: |
                    Jawaban sendiri
            9:
                story_text: |
                    ### Di dalam blok atau tidak?
                    Di level ini kamu harus berpikir hati-hati baris kode mana yang harus ada di dalam blok dan mana yang tidak.
                    Misalnya: Jika kamu ingin menyanyikan lagu *the muffin man*. Kamu hanya ingin baris dengan 'the muffin man' diulang dua kali.
                    Ini berarti baris terakhir tidak boleh dimulai dengan indentasi karena tidak termasuk dalam blok.
                    Jika kamu memulai baris terakhir dengan indentasi lagunya akan jadi salah.

                    ### Latihan
                    Setiap baris dalam kode contoh dimulai dengan ruang kosong. Hapus ruang kosong itu dan coba pikirkan baris mana yang butuh indentasi dan mana yang tidak untuk membuat lagu muffin man.
                example_code: |
                    ```
                    _ {print} 'Do you know the muffin man?'
                    _ {repeat} 2 {times}
                    _ {print} 'The muffin man'
                    _ {print} 'Do you know the muffin man, who lives on Drury Lane?'
                    ```
                answer_code: |
                    ```
                    {print} 'Do you know the muffin man?'
                    {repeat} 2 {times}
                        {print} 'The muffin man'
                    {print} 'Do you know the muffin man, who lives on Drury Lane?'
                    ```
    secret:
        name: mata-mata super
        default_save_name: SuperSpy
        description: Buat kode mata-matamu sendiri
        levels:
            10:
                story_text: |
                    Kita bisa menyederhanakan kode superspy dengan `{and}`, sehingga kita hanya butuh satu `{if}`.

                    ### Latihan 1
                    Selesaikan kode dengan mengisi perintah yang benar pada bagian kosong. Tips: Mata-mata super harus menjawab KEDUA pertanyaan dengan benar, sebelum mereka mendapat informasi rahasia!

                    ### Latihan 2
                    Kita ingin membingungkan musuh lebih lagi! Buat daftar dengan jawaban palsu dan pilih satu secara acak saat jawaban salah diberikan.
                example_code: |
                    ```
                    name = {ask} 'Siapa namamu?'
                    password = {ask} 'Apa kata sandimu?'
                    {if} name {is} Agent007 _ password {is} TOPSECRET
                        {print} 'Pergi ke bandara jam 02.00'
                    {else}
                        {print} 'Pergi ke stasiun kereta jam 10.00'
                    ```
                answer_code: |
                    Latihan 1
                    ```
                    name = {ask} 'Siapa namamu?'
                    password = {ask} 'Apa kata sandimu?'
                    {if} name {is} Agent007 and password {is} TOPSECRET
                      {print} 'Pergi ke bandara jam 02.00'
                    {else}
                        {print} 'Pergi ke stasiun kereta jam 10.00'
                    ```
                    Latihan 2
                    ```
                    fake_locations = "the zoo ", "the fountain ", "the library"
                    fake_times = "10.00 PM", "01.00 AM", "07.00 AM", "09.00 PM"

                    name = {ask} 'Siapa namamu?'
                    password = {ask} 'Apa kata sandimu?'

                    {if} name {is} Agent007 {and} password {is} TOPSECRET
                        {print} 'Pergi ke bandara jam 02.00'
                    {else}
                        {print} 'Pergi ke ' fake_locations {at} {random} 'pada ' fake_times {at} {random}
                    ```
