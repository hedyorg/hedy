            13:
                story_text: |
                    В нашей больнице много не только пациентов, но и персонала. Каждому сотруднику нужен бейдж с его данными.
                    Можете сделать программу, чтобы новый сотрудник вводил свои данные и получал распечатанный бейдж?
                    ### Упражнение
                    Программа должна:
                    * Поприветствовать нового сотрудника
                    * Спросить его обращение, имя, фамилию, дату рождения, место рождения, должность, отделение и кадровый номер.
                    * Поблагодарить нового сотрудника и сообщить, что его бейдж скоро будет распечатан.
                    * Приостановить программу на 2 секунды.
                    * Вывести обращение, имя и фамилию.
                    * Вывести дату рождения и место рождения.
                    * Вывести должность и отделение.
                    * Вывести кадровый номер.
                answer_code: |
                    ```
                    {print}('Добро пожаловать в больницу!')

                    обращение = {input}('Какое ваше обращение?')
                    имя = {input}('Какое ваше имя?')
                    фамилия = {input}('Какая ваша фамилия?')
                    дата_рождения = {input}('Какая ваша дата рождения?')
                    место_рождения = {input}('Какое ваше место рождения?')
                    должность = {input}('Какая ваша должность?')
                    отделение = {input}('В каком вы отделении?')
                    кадровый_номер = {input}('Какой ваш кадровый номер?')

                    {print}('Спасибо, ', имя, '. Ваш бейдж скоро будет распечатан!')

                    {sleep} 2

                    {print}(обращение, ' ' имя, ' ', фамилия)
                    {print}(дата_рождения, ' ' место_рождения)
                    {print}(должность, ' ' отделение)
                    {print}(кадровый_номер)
                    ```
            14:
                story_text: |
                    У наших уборщиков большой список задач. Некоторые задачи выполняются каждый день, другие — в определённый день, сезон или дату. Это очень запутанно и приводит к тому, что некоторые задачи забываются.
                    Можете помочь, написав программу, которая выводит правильный список задач на этот день?
                    ### Упражнение
                    Программа должна:
                    * Пожелать уборщику доброго утра.
                    * Спросить уборщика, какой сегодня день недели, месяц и число.
                    * Вывести правильный список задач на этот день.
                    Задачи, которые нужно выполнить:
                    * Ежедневные задачи: вымыть пол, убрать туалеты, открыть шторы
                    * По понедельникам и четвергам: полить растения
                    * По вторникам и пятницам: вымыть полы
                    * По субботам: помыть кофемашину
                    * Первого числа каждого месяца: помыть окна
                    * 7-го числа каждого месяца: пополнить торговые автоматы
                    * 14-го числа каждого месяца: проверить батарейки пожарных извещателей
                    * Каждый день в зимние месяцы: включить обогреватели
                    * Каждый день в летние месяцы: включить кондиционер
                answer_code: |
                    ```
                    {print}("Доброе утро, уборщик")

                    #спрашиваем дату
                    день = {input}("Какой сегодня день недели?")
                    текущий_месяц = {input}("Какой сейчас месяц?")
                    дата = {input}("Какое сегодня число?")

                    #выводим список задач
                    print("Уборщик, твои задачи на сегодня: ")

                    #определяем задачи по дню недели
                    {if} день == "понедельник" {or} день == "четверг":
                        {print}("полей растения")
                    {elif} день == "вторник" {or} день == "пятница":
                        {print}("вымой полы")
                    {elif} день == "суббота":
                        {print}("помой кофемашину")

                    #определяем задачи по дате
                    {if} дата == 1:
                        {print}("помой окна")
                    {elif} дата == 7:
                        {print}("пополни торговые автоматы")
                    {elif} дата == 14:
                        {print}("проверь батарейки пожарных извещателей")

                    #составляем список летних и зимних месяцев
                    летние_месяцы = ["апрель", "май", "июнь", "июль", "август", "сентябрь"]
                    зимние_месяцы = ["октябрь", "ноябрь", "декабрь", "январь", "февраль", "март"]

                    #определяем задачи по лету или зиме
                    {for} месяц {in} летние_месяцы:
                        {if} текущий_месяц == месяц:
                            {print}("включи кондиционер")
                    {for} месяц {in} зимние_месяцы:
                        {if} текущий_месяц == месяц:
                            {print}("включи обогреватели")
                    ```
            15:
                story_text: |
                    После операции пациенты иногда испытывают сильную боль. В таких случаях им можно дать помпу с морфином. Они могут сами вводить морфин, если им больно.
                    Такие помпы нужно программировать очень осторожно, чтобы пациенты не вводили себе слишком много морфина. Можете запрограммировать для нас помпу с морфином?
                    ### Упражнение
                    Программа должна:
                    * Спросить у медсестры, сколько миллилитров морфина пациент уже получил сегодня.
                    * Сказать медсестре передать устройство пациенту
                    * Спросить пациента, какую боль он испытывает по шкале до 10.
                    * Сказать пациенту нажать кнопку x, если он хочет ещё морфина.
                    * Вызвать функцию запустить_помпу с аргументами уровень_боли и уровень_морфина, если нажата x.
                    * Функция должна выводить «Вам введут ещё 20 мл морфина», пока уровень боли пациента больше или равен 6, а уровень морфина меньше 120.
                    * После введения нового морфина программа должна ждать 2 минуты (при тестировании можно использовать 2 секунды).
                    * Через эти 2 минуты уровень морфина должен обновиться (+20 мл), а уровень боли — обновиться после вопроса пациенту, как он себя чувствует.
                    * Если уровень морфина слишком высок или пациенту больше не больно, программа должна сообщить пациенту, что больше морфина он не получит. Если ему очень больно, сказать ему вызвать медсестру.
                    * Сказать пациенту, что помпа сейчас будет выключена, и нажать x, если нужно снова запустить помпу.
                answer_code: |-
                    ```
                    {print}('Помпа с морфином')
                    уровень_морфина = {input}('Сколько мл морфина пациент уже получил сегодня?')
                    {print}('пожалуйста, передайте это устройство пациенту сейчас')

                    уровень_боли = {input}('Какую боль вы испытываете от 1 до 10?')
                    {print}('Нажмите X, чтобы ввести морфин')

                    {define} морфин(уровень_боли, уровень_морфина):
                        {print}('Вам введут ещё 20 мл морфина')
                        {sleep} 2
                        уровень_морфина = уровень_морфина + 20
                        уровень_боли = {input}('Какую боль вы испытываете от 1 до 10?')
                        {print}('Помпа сейчас выключится')
                        {return} уровень_морфина
                        {return} уровень_боли
                        {sleep} 2

                    {for} i {in} {range} (1,10):
                        ждать_x = {input}('Нажмите X, чтобы ввести морфин')
                        {if} ждать_x == 'x'
                            {if} уровень_боли >= 6 {and} уровень_морфина <120:
                                уровень_морфина = морфин(уровень_боли, уровень_морфина)
                                уровень_боли = морфин(уровень_боли, уровень_морфина)
                            {else}:
                                {print}('Сейчас было бы небезопасно вводить ещё морфин')
                                {print}('Пожалуйста, вызовите медсестру, если боль слишком сильная')
                    ```
            16:
                story_text: |
                    Наши студенты-медики должны выучить медицинские термины для всех частей тела. Им, похоже, трудно запомнить все анатомические названия, и учиться им скучно.
                    Можете помочь им, создав игру для тренировки медицинских терминов?
                    Вот термины, которые нужно знать студентам: corpus = тело, caput = голова, oculus = глаз, nasus = нос, auris = ухо, os = рот, collum = шея, manus = рука, pectus = грудь, humerus = плечо, venter = живот, tergum = спина
                    ### Упражнение
                    Программа должна:
                    * Быть игрой, позволяющей студентам тренировать медицинские термины.
                    * Давать студентам балл и похвалу за правильный ответ.
                    * Снимать балл и сообщать, что ответ неверный, при неправильном ответе.
                    * Также показывать студентам правильный ответ на пару секунд при неверном ответе, снова стирать ответ с экрана и продолжать задавать вопрос, пока они не ответят правильно.
                    * Продолжать игру, пока студент не ответит правильно на все вопросы.
                    * Показать студенту итоговый счёт.
                    * Дать студенту обратную связь по счёту: 12 баллов: Потрясающе!, 8–11 баллов: Молодец, продолжай практиковаться!, 7 или меньше: Тебе стоит больше заниматься!
                answer_code: |
                    ```
                    баллы = 0
                    латинские_термины = ['corpus', 'caput',  'oculus',  'nasus', 'auris', 'os', 'collum',  'manus', 'pectus',  'humerus', 'venter', 'tergum']
                    русские_термины = ['тело', 'голова', 'глаз', 'нос', 'ухо', 'рот', 'шея', 'рука', 'грудь', 'плечо', 'живот', 'спина']

                    {for} i {in} {range}(1, 12):
                        правильный_ответ = русские_термины[i]
                        ответ = 0
                        {while} ответ != правильный_ответ:
                            ответ = {input}('Как по-русски называется ', латинские_термины[i], '?')
                            {if} ответ != правильный_ответ:
                                {print}('Это неверно')
                                {print}('Правильный ответ для ', латинские_термины[i], ' — ', русские_термины[i])
                                {sleep} 3
                                clear
                                баллы = баллы - 1
                        баллы = баллы + 1
                        {print}('Верно!')

                    {print}("Поздравляем, ты отработал все термины!")
                    {print}('Твой счёт:', баллы)

                    {if} баллы == 12:
                        {print}('Потрясающе!')

                    {if} баллы <=7:
                        {print}('Тебе стоит больше заниматься!')
                    {else}:
                        {print}('Молодец, продолжай практиковаться!')
                    ```
        name: Больница
        default_save_name: hospital
        description: Больница
