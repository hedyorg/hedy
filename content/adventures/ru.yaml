            14:
                story_text: |
                    У наших уборщиков большой список дел. Одни задачи нужно выполнять каждый день, другие — в определённый день недели, сезон или дату. В этом легко запутаться, и некоторые дела забываются.
                    Поможешь написать программу, которая выведет нужный список задач на сегодня?
                    ### Упражнение
                    Программа должна:
                    * Пожелать уборщику доброго утра
                    * Спросить, какой сегодня день недели, месяц и число
                    * Вывести нужный список задач на этот день
                    Вот что нужно делать:
                    * Каждый день: мыть пол, чистить туалеты, открывать шторы
                    * По понедельникам и четвергам: поливать растения
                    * По вторникам и пятницам: мыть полы
                    * По субботам: мыть кофемашину
                    * Первого числа каждого месяца: мыть окна
                    * Седьмого числа каждого месяца: пополнять торговые автоматы
                    * Четырнадцатого числа каждого месяца: проверять батарейки в пожарных извещателях
                    * Каждый день в зимние месяцы: включать обогреватели
