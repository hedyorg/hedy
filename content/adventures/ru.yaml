                    _
                    ```
                answer_code: |
                    ```
                    победа = 'нет'
                    раунд = 0
                    варианты = ['камень', 'бумага', 'ножницы']
                    {print}('Мы будем играть в камень, ножницы, бумага')
                    {while} победа == 'нет':
                        твой_выбор = {input}('Что вы выбираете?')
                        выбор_компьютера = варианты[random]
                        {print} ('вы выбрали ',  твой_выбор)
                        {print} ('компьютер выбрал ',  выбор_компьютера)
                        {if} выбор_компьютера == твой_выбор:
                            {print} ('Ничья!')
                        {if} выбор_компьютера == 'камень' {and} твой_выбор == 'ножницы':
                            {print} ('Вы проиграли!')
                        {if} выбор_компьютера == 'камень' {and} твой_выбор == 'бумага':
                            {print} ('Вы победили!')
                            победа = 'да'
                        {if} выбор_компьютера == 'бумага' {and} твой_выбор == 'камень':
                            {print} ('Вы проиграли!')
                        {if} выбор_компьютера == 'бумага' {and} твой_выбор == 'ножницы':
                            {print} ('Вы победили!')
                            победа = 'да'
                        {if} выбор_компьютера == 'ножницы' {and} твой_выбор == 'бумага':
                            {print} ('Вы проиграли!')
                        {if} выбор_компьютера == 'ножницы' {and} твой_выбор == 'камень':
                            {print} ('Вы победили!')
                            победа = 'да'
                        раунд = раунд + 1
                        {sleep} 1
                    {print}('Поздравляем, вы победили компьютер за ', раунд, ' попыток.')
                    ```
            2:
