                    выбор_компьютера {is} _
                    выбор {is} _
                    {print} 'вы выбрали ' _
                    {print} 'компьютер выбрал ' _
                    {if} _ {is} _ {print} 'ничья!' {else} {print} 'не ничья'
                    ```

                    Впишите правильный код в пропуски, чтобы узнать, ничья ли это.
