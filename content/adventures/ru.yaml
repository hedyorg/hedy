    ask_command:
        name: '{ask}'
        default_save_name: Вопросы
        description: Знакомство с командой {ask}
        levels:
            1:
                story_text: |
                    ## Команда `{ask}`
                    Теперь ты умеешь пользоваться командой `{print}` и готов узнать следующую команду: `{ask}`. С командой `{ask}` можно задать вопрос. Смотри:
