                        {play} нота
                        {print} "И-ай, и-ай, о"
                        {print} "С " животное " здесь"
                        {print} "И " животное " там"
                        {play} нота
                        {print} "Здесь " животное ", там " животное
                        {print} "Везде " животное
                        {play} нота
                        {print} ""
                        {sleep} 2
                    ```
