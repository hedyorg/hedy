                example_code: |
                    ```
                    {print}('Сделай свою викторину')
                    баллы_а = 0
                    баллы_б = 0

                    #Играем в викторину:
                    {print}('Вопрос')
                    {print}('Вариант ответа A')
                    {print}('Вариант ответа B')
                    ответ = {input}('Какой ответ?')
                    {if} ответ == 'A':
                        баллы_а = баллы_а + 1
                    {if} ответ == 'B':
                        баллы_б = баллы_б + 1

                    #Выводим итоги:
                    {print}('Конец викторины!')
