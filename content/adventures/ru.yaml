                    {print} 'Нам нужно использовать ' ответ
                    ```
                story_text_2: |
                    ## Сокращения
                    Важно! Учтите, что теперь, когда мы используем кавычки, Хеди запутается, если использовать апостроф в сокращениях вроде I'm или What's.
                    Обязательно используйте двойные кавычки, если в строке есть апостроф!
