adventures:
    story:
        name: история
        default_save_name: История
        description: Созадайте небольшую историю
        levels:
            1:
                story_text: |
                    На уровне 1 вы можете создать историю с другим главным героем, которого вы вводите сами.

                    В первой строке используйте `{ask}` и спросите, кто будет главным героем истории. Затем используйте {answer}, если хотите использовать имя героя.
                example_code: |
                    ```
                    {ask} Главный герой этой истории —
                    {print} {answer} собирается погулять по лесу
                    {print} Немного напуганный, {answer} идёт дальше
                    {print} {answer} слышит повсюду странные звуки
                    {print} Он боится, что это лес с привидениями
                    ```
                story_text_2: |
                    ## Упражнение
                    Теперь создайте свою историю, хотя бы на 6 строк кода.
                    Эта история не может быть такой же, как в примере.
                    Используйте хотя бы один `{ask}` и одну `{answer}` команду.
                    Вы можете сделать её на любую тему по вашему желанию.
                    Если вы не можете придумать тему, то используйте одну из этих: поход в кино, спортивный матч или день в зоопарке.
                answer_code: |
                    ```
                    {print} Однажды я ходил в зоопарк
                    {ask} Какое животное я увидел первым?
                    {print} Первым я увидел {answer}
                    {print} Потом я увидел пингвина
                    {print} Он обедал
                    {ask} Что кушал пингвин?
                    {print} Пингвин ел {answer} на обед
                    ```
            2:
                story_text: |
                    На уровне 2 вы можете сделать свой рассказ более интересным. Теперь имя вашего главного героя может находиться в любом месте предложения.

                    Правда, для этого вам придется немного доработать программу. Теперь вы должны сначала назвать имя своего главного героя.

                    Затем вы можете поместить это имя в любое место в предложении.
                example_code: |-
                    ```
                    имя {is} {ask} Какое имя главного героя?
                    {print} имя собирается погулять по лесу
                    {print} имя немного напуган(а)
                    {print} Повсюду слышно страшный шум...
                    {sleep}
                    {print} имя боится, что это лес с привидениями
                    ```
                answer_code: |
                    ```
                    {print} Однажды я пошёл в зоопарк
                    first_animal {is} {ask} Какое животное я увидел первым?
                    {print} Сначала я увидел first_animal
                    {print} Потом я увидел пингвина
                    {print} Он обедал
                    food {is} {ask} Что ел пингвин?
                    {print} Пингвин ел...
                    {sleep} 3
                    {print} food
                    ```
                story_text_2: |
                    ### Упражнение
                    Теперь пора добавить переменные в вашу собственную историю, созданную на предыдущем уровне.
                    Перейдите к своему приключению «История» на уровне 1 и скопируйте код. Вставьте код в поле ввода на этом уровне.

                    Этот код не будет работать на этом уровне, потому что вы ещё не использовали переменные.
                    Исправьте код, используя переменные и `{is}` с командой `{ask}`, как вы научились на этом уровне.

                    **Дополнительно** Добавьте в код команду `{sleep}`, чтобы создать напряжение в истории.
            3:
                story_text: |
                    На уровне 3 вы можете сделать свою историю более увлекательной. Вы можете использовать случайность для любого монстра, животного или другого препятствия, например, так:
                example_code: |
                    ```
                    животные {is} 🦔, 🐿, 🦉, 🦇
                    {print} Теперь он слышит звуки животные {at} {random}
                    ```
                story_text_2: |
                    Команда `{add}` также может пригодиться в вашей истории.
                example_code_2: |
                    ```
                    {print} Они слышат звук
                    animals {is} 🐿, 🦔, 🦇, 🦉
                    animal {is} {ask} Как ты думаешь, что это?
                    {add} animal {to_list} animals
                    {print} это был animals {at} {random}
                    ```
                story_text_3: |
                    Это пример команды `{remove}` в вашей истории

                    ### Упражнение
                    Скопируйте вашу историю с прошлого уровня в этот уровень.
                    В этом уровне вы изучили 3 новые команды: `{at} {random}`, `{add} {to_list}` и `{remove} {from}`.
                    Добавьте новые строки кода в вашу историю, так чтобы эти команды встречались хотя бы 1 раз в вашей истории.
                example_code_3: "```\n{print} His backpack got way too heavy.\n{print} Inside were a bottle of water, a flashlight and a brick.\nbag {is} water, flashlight, brick\ndump {is} {ask} Which item should he dump?\n{remove} dump {from} bag\n```\n"
                answer_code: |
                    ```
                    animals {is} lion, zebra, flamingo
                    {print} Привет, дети! Сегодня мы идём в зоопарк!
                    favorite_animal {is} {ask} К какому животному ты хочешь пойти сегодня?
                    {add} favorite_animal {to_list} animals
                    {sleep} 2
                    {print} Пойдём к animals {at} {random}
                    {sleep}
                    least_favorite_animal {is} {ask} Какое животное ты не хочешь видеть?
                    {remove} least_favorite_animal {from} animals
                    {print} А теперь пойдём к animals {at} {random}!
                    ```
            4:
                story_text: |
                    ### Упражнение
                    Скопируйте код примера и сделайте так, чтобы он работал, добавив кавычки в пустые места в строчках 1 и 2.
                    Пустые места в строчках 3 и 4 должны быть заменены не кавычками, а командами `{clear}` и `{sleep}`. Сможете ли вы?

                    ### Упражнение 2
                    Вернитесь на предыдущий уровень и скопируйте код вашей истории. Заставьте код работать на этом уровне, добавив кавычки в нужных местах.
                    Помните: Переменные в вашей истории должны находиться за пределами кавычек. Так же, как во второй строке кода примера. В этой строке имя переменной находится вне кавычек.
                example_code: |
                    ```
                    name {is} {ask} _ Как вас зовут? _
                    {print} _ Главного героя зовут _ name
                    _
                    _
                    {print} name _ теперь идёт по лесу _
                    {print} name _ немного боится _
                    animals {is} 🦔, 🐿, 🦉, 🦇
                    {print} _ Он слышит звук _ animals {at} {random}
                    {print} name _ боится, что это лес с привидениями _
                    ```
                answer_code: |
                    ```
                    имя {is} {ask} 'Как тебя зовут?'
                    {print}  'Главного героя зовут' имя
                    {print} имя  ' теперь идёт по лесу'
                    {print} имя ' немного боится'
                    животные {is} 🦔, 🐿, 🦉, 🦇
                    {print} 'Он слышит звук ' животные {at} {random}
                    {print} имя ' боится, что это лес с привидениями'
                    ```
            5:
                story_text: |
                    На этом уровне вы можете запрограммировать разные концовки, что сделает вашу историю ещё интереснее.
                    В примере кода видно, как сделать 2 разные концовки.

                    ### Упражнение 1
                    Напишите новую короткую историю минимум из 6 строк кода на любую тему.
                    Нет вдохновения? Выберите одну из тем: супергерой, скучный школьный день, робинзонада на необитаемом острове.

                    Теперь дайте игроку возможность выбрать счастливый или плохой конец, как в примере кода.
                    Запрограммируйте обе концовки.

                    ### Упражнение 2
                    Скопируйте историю, которую вы создали в своём приключении «История» на предыдущих уровнях.
                    Найдите способ добавить в историю хотя бы 2 команды `{if}` и `{else}`.
                    Это может быть счастливый или плохой конец, но можно попробовать и другие способы использования команд.
                example_code: |
                    ```
                    name {is} {ask} 'Кто ходит в лесу?'
                    {print} name 'идёт через лес'
                    {print} name 'встречает монстра'
                    end {is} {ask} 'Хотите ли вы счастливую или грустную концовку?'
                    {if} end {is} good {print} name 'достаёт свой меч, и монстр быстро убегает'
                    {else} {print} 'Монстр съел' name
                    ```
                answer_code: |
                    ```
                    имя {is} {ask} 'Кто герой?'
                    {print} 'О нет, самолёт падает, кто нас спасёт?'
                    {print} "Смотрите, кто летит по воздуху, это " имя
                    конец {is} {ask} 'Ты спасёшь самолёт или уничтожишь его?'
                    {if} конец {is} спасти {print} имя "посадил самолёт, он спас нас!"
                    {else} {print} "О нет! " имя " уничтожает самолёт, помогите!"
                    ```
            6:
                story_text: |-
                    Теперь, когда вы умеете использовать `{elif}`, можно создать ещё более интерактивную историю! Например, можно создать несколько персонажей с разными характерами.
                    Или дать игроку выбрать, по какой дороге пойти, какую дверь открыть или какое волшебное зелье выпить...

                    ### Упражнение
                    Создайте свою историю с 3 или более вариантами, используя `{elif}`.
                example_code: |
                    ```
                    character {is} {ask} 'Кто поможет тебе в твоём путешествии?'
                    {if} character {is} 'Daisy'
                    {print} 'Ты выбрал Дейзи! Она самая умная из всех!'
                    {elif} character {is} 'Jason'
                    {print} 'Ты выбрал Джейсона! Он самый сильный из всех!'
                    {elif} character {is} 'Sam'
                    {print} 'Ты выбрал Сэма! Он самый быстрый из всех!'
                    ```
                answer_code: |
                    Свой ответ
            8:
                story_text: |
                    В рассказе кто-то произносит слова несколько раз. Например, когда кто-то зовет на помощь или поет песню.
                    Вы можете вставить такие повторы в свой рассказ, на этом уровне с помощью `{repeat}`.

                    ### Упражнение
                    Добавьте повторы в свою собственную историю. Вернитесь к сохраненным программам, выберите свою программу рассказа с предыдущего уровня и
                    найдите строку, содержащую `{print}`, и повторите ее!
                example_code: "```\n{print} 'Принц продолжил звать на помощь'\n{repeat} 5 {times} {print} 'Помогите!'\n{print} 'Почему никто мне не помогает?'\n```\n"
                answer_code: |
                    {print} 'Все дети хотели пойти в зоопарк и всё время кричали об этом!'
                    {repeat} 3 {times} {print} "Пойдём в зоопарк!"
            9:
                story_text: |
                    В этом уровне вы можете использовать несколько строк в командах `{if}`, таким образом вы можете улучшить счастливый или грустный конец!

                    ### Упражнение 1
                    В примере кода показаны две разные концовки: одна, где герои прыгают в машину времени, и другая, где они этого не делают.
                    Заполните пробелы, используя как минимум одно предложение для каждой концовки.
                    **(дополнительно)** Сделайте историю длиннее. Что происходит в рассказе? Вы также можете добавить второй `{ask}` с различными вариантами.

                    ### Упражнение 2
                    Вернитесь к своим сохраненным программам, выберите свою программу истории из уровня 5. Теперь напишите хорошую и плохую концовку длиной не менее трех строк каждая!
                example_code: |
                    ```
                    {print} 'О НЕТ! Тираннозавр приближается!'
                    end = {ask} 'Ты хочешь счастливый или грустный конец?'
                    #Рассказываем счастливый конец истории:
                    {if} end {is} happy
                        {print} 'Как раз вовремя Ричард запрыгивает обратно в машину времени!'
                        {print} _
                    #Рассказываем грустный конец истории:
                    {else}
                        {print} 'О нет! Ричард слишком медленный...'
                        {print} _
                    ```
                answer_code: |
                    ```
                    {print} 'О НЕТ! Тираннозавр приближается!'
                    end = {ask} 'Ты хочешь счастливый или грустный конец?'
                    {if} end {is} happy
                        {print} 'Как раз вовремя Ричард запрыгивает обратно в машину времени!'
                        {print} 'Уф, хорошо, что успели'
                        {print} 'Как раз вовремя'
                    {else}
                        {print} 'О нет! Ричард слишком медленный...'
                        {print} 'Тираннозавр издаёт оглушительный РЁВ'
                        {print} 'Он открывает пасть и проглатывает Ричарда одним куском'
                    ```
            10:
                story_text: |
                    На этом уровне вы можете использовать команды `{if}` и `{repeat}` внутри других команд `{if}` и `{repeat}`. 
                    Это даёт множество возможностей и действительно помогает сделать историю интерактивной.

                    ### Упражнение 1
                    Закончите код, чтобы `{if}` работал правильно.

                    ### Упражнение 2
                    Добавьте `{if}` и `{else}` для той части истории, где Робин идёт домой.

                    ### Упражнение 3
                    Вернитесь к своей истории на уровне 8 и используйте как минимум два `{if}` внутри другого `{if}`.
                example_code: |
                    ```
                    {print} 'Робин ходит по центру'
                    location = {ask} 'Идёт ли Робин в магазин, или она идёт домой?'
                    {if} location {is} shop
                        {print} 'Она зашла в магазин.'
                        {print} 'Робин заметила интересно-выглядещюю книгу'
                        book = {ask} 'Покупает ли Робин книгу?'
                        {if} book {is} yes
                            {print} 'Робин покупает книгу и идёт домой'
                        {else}
                            {print} 'Робин покидает магазин и идёт домой'
                    {else}
                        {print} 'Робин идёт домой'
                    ```
                example_code_2: |
                    ```
                    {print} 'Наша героиня идёт через лес'
                    {print} 'Тропа разветвляется на две'
                    path = {ask} 'Какой путь она выберет?'
                    weapon = {ask} 'Какое оружие она достанет?'
                    {if} path {is} left {and} weapon {is} sword
                        _
                    ```
                answer_code: |
                    ```
                    {print} 'Робин идёт по центру города'
                    location = {ask} 'Робин идёт в магазин или домой?'
                    {if} location {is} shop
                        {print} 'Она входит в магазин.'
                        {print} 'Робин видит интересную книгу'
                        book = {ask} 'Робин покупает книгу?'
                        {if} book {is} yes
                            {print} 'Робин покупает книгу и идёт домой'
                        {else}
                            {print} 'Робин выходит из магазина и идёт домой'
                    {else}
                        {print} 'Робин идёт домой'
                        icecream = {ask} 'Она останавливается за мороженым по дороге домой?'
                        {if} icecream {is} yes
                            {print} 'Робин сначала останавливается за мороженым'
                            {print} 'Она выбирает лимонный сорбет'
                            {print} 'Это вкусно'
                        {else}
                            {print} 'Она идёт прямо домой'
                    ```
                answer_code_2: |
                    ```
                    {print} 'Наша героиня идёт через лес'
                    {print} 'Тропа разветвляется на две'
                    path = {ask} 'Какой путь она выберет?'
                    weapon = {ask} 'Какое оружие она достанет?'

                    {if} path {is} left {and} weapon {is} sword
                        {print} 'ни один монстр не смеет приблизиться к героине.'

                    {if} path {is} left {and} weapon {is} slingshot
                        {print} 'на героиню нападает совомедведь.'

                    {if} path {is} right {or} weapon {is} spellbook
                        {print} 'к героине приближается таинственный волшебник.'
                    ```
                story_text_2: |
                    Используя команды `{and}` и `{or}`, можно сделать истории более разнообразными. Можно задать несколько вопросов и реагировать на комбинацию ответов.

                    ### Упражнение 1
                    Посмотрите на пример кода и закончите его. Затем добавьте как минимум 2 команды `{if}` с `{and}` или `{or}`.

                    ### Упражнение 2
                    Найдите историю с предыдущего уровня и добавьте в неё один `{and}` или `{or}`.
            11:
                story_text: |
                    На этом уровне вы можете использовать команду `{for}` в своей истории. Так можно легко запрограммировать детскую книгу «Бурый медведь, бурый медведь, что ты видишь?».

                    ### Упражнение

                    Посмотрите на <a href="https://fliphtml5.com/jmlya/nquy">историю</a>, если вы её не знаете, и добейтесь, чтобы она выводилась как в книге.
                example_code: "```\nживотные = _ , _ , _ \n{print} 'Бурый мишка, Бурый мишка'\n{print} 'Что ты видишь?'\n```\n"
                answer_code: |
                    ```
                    animals = Red Bird, Yellow Duck, Blue Horse, Green Frog, Purple Cat, White Dog, Black Sheep, Gold Fish, Teacher
                    {print} 'Бурый медведь, бурый медведь'
                    {print} 'Что ты видишь?'
                    {for} animal {in} animals
                        {print} 'Я вижу ' animal ', который смотрит на меня'
                        {print} animal ', ' animal
                        {print} 'Что ты видишь?'
                    {print} 'Я вижу детей, которые смотрят на меня'
                    {print} 'Дети, дети'
                    {print} 'Что вы видите?'
                    {print} 'Мы видим '
                    {for} animal {in} animals
                        {print} animal
                    {print} 'который смотрит на нас'
                    {print} 'Вот что мы видим!'
                    ```
            13:
                example_code: |
                    ```
                    имя = _
                    {print}('Добро пожаловать в эту историю!')
                    ```
                answer_code: |
                    ```
                    name = 'Hedy'
                    {print}('Добро пожаловать в эту историю!')
                    {print}('Жил-был попугай по имени ', name '.')
                    {print}(name, ' любил программировать!')
                    {print}("К сожалению, другие попугаи не умели программировать.")
                    {print}('Однажды ', name, ' решил научить программированию других попугаев.')
                    {print}('Уроки оказались огромным успехом у других попугаев!')
                    ```
                story_text: |
                    Мы напечатаем историю, и для `{print}` нужно использовать скобки.

                    ### Упражнение
                    Создайте историю минимум из 5 предложений. Сначала используйте в истории переменную `имя`. Затем создайте две другие переменные и тоже используйте их.
                    Подсказка: не забывайте запятые в `{print}` между текстом и переменными!
            16:
                story_text: |
                    Использование цикла `{while}` может сделать ваши истории более интересными. Например, вы можете использовать `{while} game == 'on'`, чтобы можно было играть до тех пор, пока игра не закончится.
                    Или вы можете использовать `{while} sword == 'lost'`, чтобы игрок не мог продолжить игру, пока не найдет что-нибудь.

                    ### Exercise
                    The example code shows you how to use the `{while}` loop in a story. Now **think of your own scenario** in which the player has to find something before they can continue.
                example_code: |
                    ```
                    ключи = 'потеряны'
                    {print}('Ты стоишь в своём саду и потерял ключи.')
                    {print}('Где ты хочешь их поискать?')
                    {print}('Можно выбрать: дерево, клумба, камень, почтовый ящик')
                    {while} ключи == 'потеряны':
                        место = {input}('Где ты хочешь поискать?')
                        {if} место == 'клумба':
                            {print}('Вот они!')
                            ключи = 'найдены'
                        {else}:
                            {print}('Нет, их там нет: ', место)
                    {print}('Теперь можно войти в дом!')
                    ```
                answer_code: |
                    ```
                    ракетки = 'потеряны'
