                    {print} Вот что ты хочешь узнать: вопрос
                    ответы {is} да, нет, может быть
                    {print} Мой хрустальный шар говорит...
                    {sleep} 2
                    {print} ответы {at} {random}
                    ```
                answer_code: |-
                    ```
                    {print} Я Хеди, гадалка!
                    вопрос {is} {ask} Что ты хочешь узнать?
                    {print} Вот что ты хочешь узнать: вопрос
                    ответы {is} да, нет, может быть, определённо, я не знаю, попробуй ещё
                    {print} Мой хрустальный шар говорит...
                    {sleep} 2
                    {print} ответы {at} {random}
                    ```
            4:
                story_text: |
                    ### Упражнение
                    Мы убрали все кавычки из этого примера кода, можете ли вы добавить их во всех нужных местах?

                    ### Упражнение 2
                    Вернитесь на предыдущий уровень и скопируйте код гадалки. Заставьте код работать на этом уровне, добавив кавычки в нужных местах.
                example_code: |
                    ```
                    # Добавьте кавычки в этот код
                    {print} Я Хеди, гадалка!
                    вопрос {is} {ask} Что ты хочешь узнать?
