                    ## «Кавычки»
                    На уровне 4 `{ask}` и `{print}` изменились.
                    Текст, который нужно вывести, теперь нужно заключать в кавычки.
                    Это удобно: теперь можно выводить любые слова. А также слова, которые раньше сохраняли с помощью `{is}`.
                    Большинство языков программирования тоже используют кавычки при выводе, так что мы ещё на шаг ближе к настоящему программированию!
