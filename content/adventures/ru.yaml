        levels:
            8:
                story_text: |
                    Песни часто содержат много повторений. Например... Детеныш акулы! Если вы поете ее, вы продолжаете петь одно и то же:

                    Baby Shark tututudutudu <br>
                    Baby Shark tutututudutudu <br>
                    Baby Shark tututudutudu <br>
                    Baby Shark

                    Вы можете сделать эту песню намного короче с помощью `{repeat}`! Вы можете закончить код?
                example_code: |
                    ```
                    {repeat} _ _ {print} 'Baby Shark tututudutudu'
                    {print} 'Baby Shark'
                    ```

                    After Baby Shark you can of course also program other songs. There are many songs with repetition.
                answer_code: |
                    ```
                    {repeat} 3 {times} {print} 'Акулёнок тутутудудуду'
                    {print} 'Акулёнок'
                    ```
            9:
                story_text: |
                    На предыдущем уровне вы запрограммировали песню «Бутылки пива». Но без команды `{repeat}` приходилось копировать куплеты много раз.
                    На этом уровне можно повторить песню 99 раз, просто добавив одну простую строку!

                    ### Упражнение
                    Впишите правильную команду в пропуски и правильно расставьте отступы.
                example_code: |
                    ```
                    куплет = 99
                    _ 99 {times}
                    {print} куплет ' бутылок пива на стене'
                    {print} куплет ' бутылок пива'
                    {print} 'Возьми одну, передай по кругу'
                    куплет = куплет - 1
                    {print} куплет ' бутылок пива на стене'
                    ```
                answer_code: |
                    ```
                    куплет = 99
                    {repeat} 99 {times}
                        {print} куплет ' бутылок пива на стене'
                        {print} куплет ' бутылок пива'
                        {print} 'Возьми одну, передай по кругу'
                        куплет = куплет - 1
                        {print} куплет ' бутылок пива на стене'
                    ```
            11:
                story_text: |
                    С помощью `{for}` можно сделать всю песню про акулу (включая всех остальных акул в семье) всего за 6 строк!

                    ### Упражнение 1
                    Сможете сделать код акулы-малютки ещё короче с помощью команды `{for}`? Закончите пример кода.
                example_code: |
                    ```
                    семья = малыш, мама, папа, бабушка, дедушка
                    _ _ _ _ 
                        {print} _
                    ```
                story_text_2: |
                    ### Упражнение 2
                    Выведите песню «Пять маленьких обезьянок прыгают на кровати». Если не помните текст, поищите его.

                    **Дополнительно** Выведите песню «У старины Макдональда была ферма» и сделайте так, чтобы каждое животное издавало свой звук, используя `{if}`.
                example_code_2: |
                    ```
                    обезьянки = 5, 4, 3, 2, 1
                    ```
                answer_code: |
                    Упражнение 1
                    ```
                    семья = малыш, мама, папа, бабушка, дедушка
                    {for} имя {in} семья
                        {print} имя " акула ду, ду, ду, ду, ду, ду."
                    ```

                    Упражнение 2
                    ```
