            10:
                story_text: |
                    У сотрудников приёмного отделения проблема. Они говорят, что приходит много пациентов, у которых на самом деле нет неотложного состояния и которым следует обратиться к своему врачу.
                    Эти люди заполняют зал ожидания и создают большую нагрузку на персонал. Поможете сотрудникам приёмного отделения, сделав приложение для триажа, которое сообщает пациенту, нужно ли ему идти в приёмное отделение?
                    ### Упражнение
                    Программа должна сообщать пациенту: «немедленно идите в приёмное отделение», «позвоните своему медицинскому работнику, чтобы обсудить ситуацию» или «как можно скорее обратитесь к своему врачу».
                    Программа задаст такие вопросы:
                    * Ваше состояние угрожает жизни?
                    * У вас есть затруднения с дыханием?
                    * Вы внезапно не можете говорить, видеть, ходить или двигаться?
                    * Вы проглотили или вдохнули яд?
                    * У вас перелом?
                    * У вас серьёзная аллергическая реакция?
                    * Вы испытываете сильную боль?

                    Если пациент отвечает «да» на любой из этих вопросов, программа скажет немедленно идти в приёмное отделение. Другие вопросы она задавать не будет, потому что время дорого.
                    Если пациент отвечает «нет» на все вопросы, программа спросит:
                    * Может ли это подождать до завтра?
                    Если ответ «да», программа посоветует как можно скорее обратиться к врачу. Если ответ «нет», программа посоветует позвонить своему медицинскому работнику, чтобы обсудить ситуацию.
                answer_code: |
                    ```
                    угрожает_жизни = {ask} 'Ваше состояние угрожает жизни?'
                    {if} угрожает_жизни {is} 'да'
                        {print} 'Немедленно идите в приёмное отделение!'
                    {else}
                        дыхание = {ask} 'У вас есть затруднения с дыханием?'
                        {if} дыхание {is} 'да'
                            {print} 'Немедленно идите в приёмное отделение!'
                        {else}
                            способность = {ask} 'Вы внезапно не можете говорить, видеть, ходить или двигаться?'
                            {if} способность {is} 'да'
                                {print} 'Немедленно идите в приёмное отделение!'
                            {else}
                                яд = {ask} 'Вы проглотили или вдохнули яд?'
                                {if} яд {is} 'да'
                                    {print} 'Немедленно идите в приёмное отделение!'
                                {else}
                                    перелом = {ask} 'У вас перелом?'
                                    {if} перелом {is} 'да'
                                        {print} 'Немедленно идите в приёмное отделение!'
                                    {else}
                                        аллергия = {ask} 'У вас серьёзная аллергическая реакция?'
                                        {if} аллергия {is} 'да'
                                            {print} 'Немедленно идите в приёмное отделение!'
                                        {else}
                                            подождать = {ask} 'Может ли это подождать до завтра?'
                                            {if} подождать {is} 'да'
                                                {print} 'Как можно скорее обратитесь к своему врачу.'
                                            {else}
                                                {print} 'Позвоните своему медицинскому работнику, чтобы обсудить ситуацию'
                    ```
            11:
                story_text: |
                    У нас проблема в прививочном кабинете. Экран, который вызывает следующего пациента в зону вакцинации, сломался. Можете его починить?
                    ### Упражнение
                    Программа должна:
                    * Иметь список имён пациентов с записью
                    * Спросить у медсестры, есть ли сегодня новые пациенты и если да, то сколько.
                    * Добавить имена новых пациентов в список
                    * Затем программа должна вызвать пациента в зону вакцинации.
                    * Программа должна подождать 10 секунд, очистить экран и вызвать следующего пациента, пока не будут вызваны все пациенты из списка.
                answer_code: |
                    ```
                    пациенты {is} Берт, Джулия, Эбби, Оскар, Эрни, Розита, Зоя
                    количество_пациентов = 7

                    новые_пациенты = {ask} 'Сегодня есть новые пациенты?'
                    {if} новые_пациенты {is} да
                        количество_новых = {ask} 'Сколько?'
                        количество_пациентов = количество_пациентов + количество_новых
                        {repeat} количество_новых {times}
                            имя = {ask} 'Как их зовут?'
                            {add} имя {to} пациенты
                    {else}
                        {print} 'Сегодня новых пациентов нет'

                    {repeat} количество_пациентов {times}
                        выбранный_пациент = пациенты {at} {random}
                        {print} выбранный_пациент ', подойдите, пожалуйста, в зону вакцинации'
                        {remove} выбранный_пациент {from} пациенты
                        {sleep} 10
                        {clear}
                    ```
