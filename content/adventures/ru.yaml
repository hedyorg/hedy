                    ## Случайный выбор
                    На этом уровне можно составить список с помощью команды `{is}`. Можно позволить компьютеру выбрать случайный элемент из этого списка. Для этого используется `{at} {random}`.
                example_code: |
                    ```
                    животные {is} собаки, кошки, кенгуру
                    {print} животные {at} {random}
                    ```
                story_text_2: |
                    Команду `{at} {random}` можно использовать и внутри предложения.
                example_code_2: |
                    ```
                    еда {is} бутерброд, кусок пиццы, салат, буррито
                    {print} На обед у меня будет еда {at} {random}.
                    ```
                story_text_3: |
                    ### Упражнение
                    Попробуйте команду `{at} {random}`, сделав своё игровое шоу (как по телевизору), где вы выбираете дверь или чемодан, а внутри большой приз!
                    Сможете? Первые строки уже есть в примере кода.
                example_code_3: |
                    ```
                    {print} Большое игровое шоу!
                    {print} Перед вами 3 чемодана...
                    выбранный {is} {ask} Какой чемодан вы выбираете?
                    призы {is} _
                    _
                    ```
                answer_code: |-
                    ```
                    {print} Большое игровое шоу!
                    {print} Перед вами 3 чемодана...
                    выбранный {is} {ask} Какой чемодан вы выбираете?
                    призы {is} тако, ручка, миллион долларов
                    {print} Вы выигрываете... призы {at} {random}
                    ```
            14:
