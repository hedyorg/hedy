                    Сделаем тренировочную программу немного сложнее. Теперь игроку нужно правильно ответить на два вопроса. Заполните пропуски, чтобы закончить программу.

                    ### Упражнение 2
                    Иногда у вычисления есть несколько правильных ответов. Например, 10 можно разделить на 5 и на 2. Поэтому на вопрос «Какое число делит 10?» можно ответить и 2, и 5.
                    Задайте вычисление с несколькими правильными ответами, попросите игрока ответить и определите, верен ли ответ, с помощью `{or}`.
                    Очистите поле программирования и создайте своё решение.
                example_code: |
                    ```
                    ответ1 = {ask} 'Сколько будет 10 умножить на 7?'
                    ответ2 = {ask} 'Сколько будет 6 умножить на 7?'
                    {if} _ _ _ _ _ _ _
                        {print} _
                    ```
                answer_code: |
