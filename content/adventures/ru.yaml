                    А ещё можно проверить, что одно значение *не равно* другому. Для этого используй `!=`, вот так:
                example_code_3: |
                    ```
                    имя = {input}('Как тебя зовут?')
                    {if} имя != 'Hedy':
                        {print}('Ты не Hedy')

                    ```
