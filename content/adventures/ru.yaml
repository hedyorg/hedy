                    #Списки французских слов и их переводов:
                    французские_слова = ['bonjour', 'ordinateur', 'pomme de terre']
                    перевод = ['привет', 'компьютер', 'картофель']

                    #Тренируем слова:
                    счёт = 0
                    {for} i {in} {range}(1,3):
                        ответ = {input}('Что означает ', французские_слова[i], '?')
                        правильный_ответ = перевод[i]
