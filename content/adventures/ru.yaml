                    ### Упражнение
                    Программа должна:
                    * Показать, какая медсестра работает в ночную смену в какой день недели.
                    * Следить за тем, чтобы каждая медсестра работала только одну ночную смену в неделю.
                    Имена медсестёр: Мередит, Миранда, Алекс, Дерек, Кристина, Иззи, Джордж
                answer_code: |
                    ```
                    медсёстры {is} Мередит, Миранда, Алекс, Дерек, Кристина, Иззи, Джордж
                    выбранная_медсестра {is} медсёстры {at} {random}
                    {print} Понедельничную смену закроет выбранная_медсестра
                    {remove} выбранная_медсестра {from} медсёстры
                    выбранная_медсестра {is} медсёстры {at} {random}
                    {print} Вторничную смену закроет выбранная_медсестра
                    {remove} выбранная_медсестра {from} медсёстры
                    выбранная_медсестра {is} медсёстры {at} {random}
                    {print} Средовую смену закроет выбранная_медсестра
                    {remove} выбранная_медсестра {from} медсёстры
                    выбранная_медсестра {is} медсёстры {at} {random}
                    {print} Четверговую смену закроет выбранная_медсестра
                    {remove} выбранная_медсестра {from} медсёстры
                    выбранная_медсестра {is} медсёстры {at} {random}
                    {print} Пятничную смену закроет выбранная_медсестра
                    {remove} выбранная_медсестра {from} медсёстры
                    выбранная_медсестра {is} медсёстры {at} {random}
