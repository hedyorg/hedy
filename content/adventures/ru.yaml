                story_text: |
                    В математике вы могли встречать больше символов для сравнения двух частей уравнения. Например, когда что-то больше или равно. 
                    В программировании это тоже есть, и мы называем это операторами. 
                    Если нужно проверить, что первое число меньше или равно второму, можно использовать `<=`, например возраст `<=` 11.
                    Если нужно проверить, что первое число больше или равно второму, можно использовать `>=`, например очки `>=` 11.
