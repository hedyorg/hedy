            3:
                story_text: |
                    Создай случайную мелодию!

                    ### Упражнение
                    Пример кода создаёт случайную мелодию, но она очень короткая и использует мало нот.
                    Добавь в список больше нот, а затем скопируй последнюю строку ещё несколько раз, чтобы мелодия стала длиннее.
                example_code: |
                    ```
                    ноты {is} A4, B4, C4
                    {play} ноты {at} {random}
