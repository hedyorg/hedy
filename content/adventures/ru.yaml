    maths:
        levels:
            7:
                story_text: |
                    На этом уровне вы узнаете кое-что новое: теперь можно и вычислять.

                    Плюс прост: пишется как в математике, например `5 + 5`. Минус тоже работает, это `5 - 5`.

                    С умножением немного иначе, потому что на клавиатуре нет знака умножения. Поищите — его правда нет!
                    Поэтому для умножения используется звёздочка над цифрой 8: `5 * 5`. Читайте это как «5 умножить на 5» — так лучше всего запоминается.
                example_code: |
                    ```
                    {print} '5 плюс 5 — это ' 5 + 5
                    {print} '5 минус 5 — это ' 5 - 5
                    {print} '5 умножить на 5 — это ' 5 * 5
                    {print} '5 разделить на 5 — это ' 5 / 5
                    ```
                story_text_2: |-
                    **Десятичные числа**
                    До сих пор Hedy не допускала десятичных чисел вроде 1.5, но теперь это разрешено. Обратите внимание, что компьютеры используют `.` для десятичных чисел.
                example_code_2: |
                    ```
                    {print} 'Два с половиной плюс два с половиной — это...'
                    {print} 2.5 + 2.5
                    ```
                story_text_3: '**Математика с переменными**'
                example_code_3: |
                    ```
                    {print} 'Билет стоит $2'
                    люди = {ask} 'Сколько билетов вы хотите?'
                    цена = люди * 2
                    {print} 'С вас $' цена ', пожалуйста'
                    ```
                answer_code: |
                    Свой ответ
