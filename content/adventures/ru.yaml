    sleep_command:
        levels:
            2:
                story_text: |
                    Ещё одна новая команда на этом уровне — `{sleep}`, она приостанавливает программу на секунду. Если указать число после команды `{sleep}`, программа приостановится на столько секунд.

                    ### Упражнение
                    Потренируйте новую команду, создав свой код, в котором команда `{sleep}` используется как минимум 3 раза. При каждой команде `{sleep}` время паузы должно быть разным.
                example_code: |
                    ```
                    {print} Мой любимый цвет —...
                    {sleep} 2
                    {print} зелёный!
                    ```
                answer_code: |
                    ```
                    {print} И победитель...
                    {sleep} 2
                    {print} Мария!
                    {print} Она выиграла...
                    {sleep} 1
                    {print} новенький феррари!
                    {print} и это ещё не всё!
                    {print} Она также выигрывает...
                    {sleep} 5
                    {print} поездку во Францию!
                    ```
        name: '{sleep}'
