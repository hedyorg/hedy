                    ```
                    рост = {input}('Какой у тебя рост в сантиметрах?')
                    {if} рост >= 160:
                        {print} ('Да, ты достаточно высокий. Наслаждайся поездкой на американских горках!')
                    ```
                story_text_3: |
                    Также можно сравнивать, что что-то *не* равно чему-то, используя `!=`, вот так:
                example_code_3: |
                    ```
                    имя = {input}('Как тебя зовут?')
                    {if} имя != 'Хеди':
                        {print}('Ты не Хеди')

                    ```
