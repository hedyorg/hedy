                    ```
            11:
                story_text: |
                    Все слишком долго бросают кубики? В этом уровне вы можете позволить Хеди бросить все кубики сразу!
                    Сможете ли вы заполнить правильную строку кода на пустых местах?
                example_code: |
                    ```
                    #Готовим игру:
                    игроки = Энн, Джон, Джесси
                    варианты = 1, 2, 3, 4, 5, 6
                    #Даём каждому игроку бросить кубик:
                    _ _ _ _
                        {print} игрок ' бросает ' варианты {at} {random}
                        {sleep}
                    ```
                answer_code: |
                    ```
