    while_command:
        name: '{while}'
        default_save_name: Цикл_пока
        description: '{while}'
        levels:
            16:
                story_text: |-
                    Познакомимся с новым циклом — циклом `{while}`! Он повторяется, пока условие истинно.
                    Поэтому не забудь менять значение переменной внутри цикла.

                    В примере цикл продолжается, пока не будет дан правильный ответ.
                    Если правильный ответ так и не появится, цикл никогда не закончится!
                example_code: |
                    ```
                    ответ = 0
                    {while} ответ != 25:
                        ответ = {input}('Сколько будет 5 умножить на 5?')
                    {print}('Получен правильный ответ')
                    ```
                answer_code: |
                    Свой ответ
