                    ```
                    {def} рассчитать_бюджет(желание, деньги, карманные):
                        нужно_накопить = желание - деньги
                        недель = нужно_накопить / карманные
                        {if} желание > деньги:
                            {print}('Нужно накопить ещё немного!')
                            {print}('Понадобится ', недель ', недель.')
                        {else}:
                            {print}("Отлично! У тебя достаточно")
                            {print}("Идём за покупками!")

                    деньги = {input}('Сколько денег вы накопили?')
                    желание = {input}('Сколько денег вам нужно?')
                    карманные = {input}('Сколько карманных денег вы получаете в неделю?')

                    рассчитать_бюджет(желание, деньги, карманные)
                    ```
    print_command:
        levels:
            1:
                story_text: |
                    ## Команда {print}
                    Вы можете вывести текст на экран с помощью команды `{print}`.
                example_code: |
                    ```
                    {print} Привет, программист!
                    {print} Добро пожаловать в Хеди!
                    ```
                story_text_2: |
                    ### Упражнение
                    В Хеди в каждом приключении есть упражнения. Упражнение позволяет потренировать новые команды и концепции, а также добавить что-то своё в примеры кода.
                    В этом упражнении вы увидите розовое пустое место. Нужно заполнить его, прежде чем код можно будет запустить.

                    Впишите команду `{print}` в пустое место, а затем добавьте ещё пять строк кода. Каждая строка должна начинаться с команды `{print}`.
                    Удачи!
                example_code_2: |
                    ```
                    _ Привет!
                    ```
                answer_code: |
                    ```
                    {print} Привет!
                    {print} Я программирую
                    {print} Это так просто
                    {print} И очень круто!
                    {print} Это только уровень 1
                    {print} Надеюсь узнать гораздо больше!
                    ```
            13:
                story_text: |-
                    Мы дошли до кода, который больше похож на настоящий Python!
                    На этом уровне новых команд не будет, но мы покажем немного другой способ их записи, более похожий на то, как это делается в коде Python. 
                    Это значит, что с `{print}` с этого момента нужно использовать скобки.
                    Это также значит, что базовый код Хеди с этого уровня можно использовать в любой среде Python, если использовать английские команды. 
                    Если вы ещё этого не сделали, можно переключить тумблер в меню команд.
                example_code: |
                    ```
                    {print}('Привет!')
                    ```
                story_text_2: Если нужно вывести больше одного элемента, их нужно разделять запятыми.
                example_code_2: |
                    ```
                    температура = 25
                    {print}('На улице ', температура, ' градусов')
                    ```
                    ```
                    имя = 'Хеди'
                    {print} _ 'Меня зовут ', имя _
                    ```
                answer_code: |
                    Свой ответ
        name: '{print}'
        default_save_name: print
        description: Знакомство с командой «печать»
    quizmaster:
