                    ```
                    won = 'нет'
                    round = 0
                    options = ['камень', 'бумага', 'ножницы']
                    {print}('Сыграем в камень, ножницы, бумагу')
                    {while} won == 'нет':
                        your_choice = {input}('Что ты выбираешь?')
                        computer_choice = options[случайном]
                        {print} ('Твой выбор: ',  your_choice)
