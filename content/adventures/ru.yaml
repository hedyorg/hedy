                    С помощью команды `{and}` можно сократить код «Камень, ножницы, бумага»! Посмотрите пример кода.

                    ### Упражнение
                    Закончите код так, чтобы всегда определялся победитель. Запустите код несколько раз и убедитесь, что победитель всегда выводится.
                example_code: |
                    ```
