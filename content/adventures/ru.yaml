                    ```
                    price = 10
                    food = {ask} 'Что хочешь съесть?'
                    drinks = {ask} 'Что хочешь выпить?'
                    {if} food {is} бутерброд _ drinks {is} сок
                        {print} 'Это наше меню со скидкой'
                        price = price - 3
