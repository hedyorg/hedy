                    ```
                    варианты {is} камень, бумага, ножницы
                    выбор_компьютера {is} варианты {at} {random}
                    выбор {is} {ask} 'что вы выбираете: камень, бумагу или ножницы?'
                    {print} 'вы выбрали ' выбор
                    {print} 'компьютер выбрал ' выбор_компьютера
                    {if} выбор_компьютера {is} выбор {print} 'ничья!' {else} {print} 'не ничья'
