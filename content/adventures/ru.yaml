            4:
                story_text: |
                    У наших медсестёр много дел за день. Одно из них — утром обойти всех пациентов и спросить, что они хотели бы на завтрак.
                    Можете снизить нагрузку на медсестёр, создав программу, в которой пациенты выбирают завтрак и отправляют заказ прямо на кухню?
                    ### Упражнение
                    Программа должна:
                    * Попросить пациента ввести имя и номер палаты
                    * Поприветствовать пациента по имени
                    * Показать всё меню (бутерброды, хлопья, фрукты и т.д.) и напитки
                    * Спросить пациента, что он хочет съесть
                    * Спросить, что он хочет выпить
                    * Повторить заказ пациенту
                    * Поблагодарить пациента за заказ
                    * Сообщить, что заказ будет доставлен в его палату через 15 минут.
                answer_code: |
                    ```
                    имя {is} {ask} 'пожалуйста, введите ваше имя: '
                    номер_палаты {is} {ask} 'пожалуйста, введите номер вашей палаты:'
                    {print} 'Здравствуйте, ' имя
                    {print} 'В сегодняшнем меню у нас: '
                    {print} 'бутерброд, хлопья, банан, яблоко'
                    {print} 'а вот напитки: '
                    {print} 'апельсиновый сок, чай, кофе, вода'
                    еда {is} {ask} 'Что бы вы хотели съесть?'
                    напиток {is} {ask} 'Что бы вы хотели выпить?'
                    {print} 'вы заказали: ' еда ' и ' напиток
                    {print} 'Спасибо за ваш заказ'
                    {print} 'Ваш заказ прибудет через 15 минут.'
                    ```
            5:
                story_text: |
                    Наш центр по лечению ожогов хочет снизить нагрузку с помощью онлайн-системы триажа. Так пациенты смогут не только указать имя и дату рождения, но и какой у них ожог (первой, второй или третьей степени), и получить совет, что делать дальше.
                    Можете им помочь?
                    ### Упражнение
                    Программа должна:
                    * Начать с приветствия и простой регистрации имени и даты рождения пациента
                    * Провести триаж. Кожа только красная — ожог первой степени. Есть волдыри — ожог второй степени. Кожа отсутствует/почернела/побелела от ожога — ожог третьей степени.
                    * Дать пациенту соответствующий совет. Первая степень: охладите ожог водой и нанесите крем. К врачу идти не нужно. Вторая степень: врач вас осмотрит и выпишет специальный крем. Пожалуйста, подождите в зоне ожидания. Третья степень: пожалуйста, немедленно подойдите к стойке. Вам срочно нужна помощь.
                answer_code: |
                    ```
                    имя {is} {ask} 'пожалуйста, введите ваше имя'
                    дата_рождения {is} {ask} 'пожалуйста, введите вашу дату рождения'
                    первая_степень {is} {ask} 'Кожа красная?'
                    вторая_степень {is} {ask} 'Есть ли волдыри на коже?'
                    третья_степень {is} {ask} 'Кожа отсутствует/почернела/побелела от ожога?'
                    {if} первая_степень {is} 'да'
                    {print} 'Охладите ожог водой и нанесите крем. К врачу идти не нужно.'
                    {if} вторая_степень {is} 'да'
                    {print} 'Врач вас осмотрит и выпишет специальный крем. Пожалуйста, подождите в зоне ожидания.'
                    {if} третья_степень {is} 'да'
                    {print} 'Пожалуйста, немедленно подойдите к стойке. Вам срочно нужна помощь.'
                    ```
            6:
                story_text: |
                    Нашим акушеркам задают много вопросов беременные женщины о том, что можно и нельзя есть во время беременности. Можете помочь их пациенткам, создав приложение, которое сообщает, безопасна ли еда?
                    ### Упражнение
                    Программа должна:
                    * Спросить пациентку, что она хочет съесть.
                    * Проверить, есть ли это в списке «небезопасной еды»
                    * Если есть в списке небезопасной еды, сообщить пациентке, что это есть небезопасно.
                    * Если нет в списке, сообщить пациентке, что это, вероятно, безопасно.
                    * Затем приложение также предупреждает всегда использовать здравый смысл, поскольку список может быть не на 100 % полным. И советует всегда избегать сырого мяса, рыбы, яиц и алкоголя.
                    Во время беременности небезопасно есть: суши, креветки, тунец, сыр с плесенью, тирамису, яйца всмятку, карпаччо, стейк с кровью, тартар
                answer_code: |
                    ```
                    {print} "Есть или не есть — вот в чём вопрос!"
                    еда {is} {ask} 'Что бы вы хотели съесть?'
                    небезопасная_еда {is} суши, креветки, тунец, сыр с плесенью, тирамису, яйца всмятку, карпаччо, стейк с кровью, тартар
                    {if} еда {in} небезопасная_еда
                    {print} еда " есть небезопасно"
                    {else}
                    {print} еда " вероятно, безопасно есть"
                    {print} 'Всегда используйте здравый смысл, потому что наш список может быть не на 100% полным. Всегда избегайте сырого мяса, рыбы, яиц и алкоголя. '
                    ```
            7:
                story_text: |
                    Наши медсёстры следят за водным балансом пациентов. Водный баланс — это сколько жидкости пациент получил за день (выпил, съел или получил внутривенно) минус сколько жидкости он потерял за день (с мочой или рвотой).
                    Водный баланс должен оставаться положительным. Если баланс отрицательный, медсестре нужно ввести больше жидкости внутривенно.
                    Можете помочь нашим медсёстрам, сделав инструмент для расчёта водного баланса пациента?
                    ### Упражнение
                    Программа должна:
                    * Спросить, сколько жидкости пациент получил за день с питьём.
                    * Спросить, сколько жидкости пациент получил за день с едой.
                    * Спросить, сколько жидкости пациент получил за день внутривенно.
                    * Спросить, сколько жидкости пациент потерял за день с мочой.
                    * Спросить, сколько жидкости пациент потерял за день с рвотой.
                    * Вычислить водный баланс пациента и показать его медсестре.
                    * Сказать медсестре проверить, положительный баланс или отрицательный, чтобы решить, нужна ли пациенту сегодня дополнительная жидкость внутривенно.
                answer_code: |
                    ```
                    поступление_питьё = {ask} 'сколько жидкости пациент получил с питьём?'
                    поступление_еда = {ask} 'сколько жидкости пациент получил с едой?'
                    поступление_внутривенно = {ask} 'сколько жидкости пациент получил внутривенно?'
                    потеря_моча = {ask} 'сколько жидкости пациент потерял с мочой?'
                    потеря_рвота = {ask} 'сколько жидкости пациент потерял с рвотой?'
                    водный_баланс = поступление_питьё + поступление_еда + поступление_внутривенно - потеря_моча - потеря_рвота
                    {print} "Водный баланс пациента: " водный_баланс
                    {print} 'Пожалуйста, проверьте, положительный баланс или отрицательный, чтобы решить, нужна ли пациенту сегодня дополнительная жидкость внутривенно'
                    ```
            8:
                story_text: |
                    Наши пациенты иногда забывают принимать лекарства, что вызывает серьёзные проблемы со здоровьем. Чтобы пациенты принимали все назначенные таблетки, мы даём им будильник, который пищит каждый раз, когда нужно принять таблетки.
                    Можете помочь, создав будильник для таблеток?

                    ### Упражнение
                    Программа должна:

                    #Часть 1, Настройки для медсестры
                    * Начать с того, что дать медсестре возможность задать имя пациента.
                    * Затем она должна ввести, сколько таблеток пациент должен принять в первом (8:00), втором (полдень) и последнем приёме за день (16:00).
                    * Поблагодарить медсестру и сказать ей передать будильник пациенту. Очистить экран через две секунды после этого сообщения.

                    #Часть 2, Первый приём
                    * Поприветствовать пациента по имени и сказать, что будильник будет пищать, когда нужно принять лекарство.
                    * Пищать 3 раза
                    * Сообщить пациенту, что сейчас 8 утра и время первого приёма.
                    * Спросить пациента «Ты принял таблетку?» столько раз, сколько таблеток нужно принять в первом приёме.
                    * Сообщить пациенту, что он принял весь первый приём, и очистить экран через 2 секунды.

                    #Часть 3, Второй приём
                    * Подождать 4 секунды (в реальности это было бы 4 часа)
                    * Прозвонить будильником так же, как для первого приёма.

                    #Часть 4, Последний приём
                    * Подождать 4 секунды (в реальности 4 часа)
                    * Прозвонить будильником для последнего приёма за день.
                answer_code: |-
                    ```
                    #Настройки для медсестры
                    {print} 'Доброе утро, медсестра. Пожалуйста, введите правильную информацию о пациенте. '
                    имя {is} {ask} 'Как зовут этого пациента?'
                    первая_доза {is} {ask} 'Сколько таблеток ' имя ' принимает в 8 утра?'
                    вторая_доза {is} {ask} 'Сколько таблеток ' имя ' принимает в полдень?'
                    последняя_доза {is} {ask} 'Сколько таблеток ' имя ' принимает в 4 дня'
                    {print} 'Спасибо, теперь вы можете передать трекер пациенту.'
                    {sleep} 2
                    {clear}

                    #Первый приём
                    {print} 'Привет, ' имя ' Я твой трекер лекарств. Я буду пищать, когда тебе нужно принять лекарство.'
                    {repeat} 3 {times} {play} C4
                    {print} "Сейчас 8 утра, время первого приёма"
                    {repeat} первая_доза {times} таблетка {is} {ask} 'Ты принял таблетку?'
                    {print} 'Ты принял весь первый приём, ' имя
                    {sleep} 2
                    {clear}

                    #Второй приём
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "Сейчас полдень, время второго приёма"
                    {repeat} вторая_доза {times} таблетка {is} {ask} 'Ты принял таблетку?'
                    {print} 'Ты принял весь второй приём, ' имя
                    {sleep} 2
                    {clear}

                    #Последний приём
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "Сейчас 4 дня, время последнего приёма"
                    {repeat} последняя_доза {times} таблетка {is} {ask} 'Ты принял таблетку?'
                    {print} 'Ты принял все таблетки на сегодня, ' имя
                    {sleep} 2
                    {clear}
                    ```
