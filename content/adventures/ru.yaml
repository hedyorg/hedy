    functions_2:
        name: Функции с аргументами
        default_save_name: functions 2
        description: функции 2
        levels:
            15:
                story_text: |
                    Теперь, когда вы научились использовать функции, вы узнаете, как использовать функцию с аргументом.
                    **Аргумент** — это переменная, которая используется внутри функции. Вне функции она не используется.

                    Например, в этом коде запрограммирован первый куплет песни 'My Bonnie is over the ocean'.
                    В этом примере используется аргумент 'место'. Место — переменная, которая используется только в функции, то есть аргумент.
                    Чтобы использовать 'место', мы поместили `место` после `{define} песня`.
                    Когда функция вызывается, компьютер заменяет аргумент 'место' на текст после ` песня {with}`.

                    ### Упражнение
                    Следующий куплет этой песни:

                    Прошлой ночью, когда я лежал на подушке

                    Прошлой ночью, когда я лежал на кровати

                    Прошлой ночью, когда я лежал на подушке

                    Мне приснилось, что моя Бонни умерла



                    Сможете запрограммировать этот куплет так же, как в примере?
                example_code: |
                    ```
                    {def} песня(место):
                        {print}('Моя Бонни за ', место)

                    песня('океаном')
                    песня('морем')
                    песня('океаном')
                    ```
                answer_code: |
                    ```
                    {define} песня(место)
                        {print} ('Прошлой ночью, когда я лежал на своей ' место)

                    песня('подушке')
                    песня('кровати')
                    песня('подушке')
                    {print} "Мне приснилось, что моя Бонни умерла"
                    ```
