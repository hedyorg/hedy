    party_planner:
        name: Организатор праздника
        default_save_name: Организатор праздника
        description: Организатор праздника
        levels:
            4:
                story_text: |-
                    Создай инструмент для планирования праздника, который составит приглашение на твою вечеринку!

                    ### Упражнение
                    * Сначала впиши подходящие вопросы для игрока.
                    * Затем составь приглашение на праздник, используя ответы игрока.

                example_code: |-
                    ```
                    # Получаем ответы
                    {print} 'ОРГАНИЗАТОР ПРАЗДНИКА'
                    хозяин {is} {ask} _
                    гость {is} {ask} _
                    повод {is} {ask} _
                    дата {is} {ask} _
                    время {is} {ask} _
                    место {is} {ask} _
                    тема {is} {ask} _
                    одежда {is} {ask} _

                    # Готовим приглашение
                    {print} 'Подожди... готовим приглашение'
                    {sleep} 2
                    {clear}

                    # Выводим приглашение
                    {print} 'Привет, ' гость '!'
                    _
                    ```
                answer_code: |-
                    ```
                    # Получаем ответы
                    {print} 'ОРГАНИЗАТОР ПРАЗДНИКА'
                    хозяин {is} {ask} 'Как тебя зовут?'
                    гость {is} {ask} 'Кого ты хочешь пригласить?'
                    повод {is} {ask} 'Что ты празднуешь?'
                    дата {is} {ask} 'В какой день будет праздник?'
                    время {is} {ask} 'Во сколько начнётся праздник?'
                    место {is} {ask} 'Где будет праздник?'
                    тема {is} {ask} 'Какая тема у праздника?'
                    одежда {is} {ask} 'Как нужно одеться на праздник?'

                    # Готовим приглашение
                    {print} 'Подожди... готовим приглашение'
                    {sleep} 2
                    {clear}

                    # Выводим приглашение
                    {print} 'Привет, ' гость '!'
                    {print} 'Приглашаю тебя на праздник! Повод: ' повод
                    {print} 'Жду тебя ' дата ' в ' время
                    {print} 'Место: ' место
                    {print} 'Тема праздника: ' тема '. А вот как нужно одеться: ' одежда
                    {print} 'Надеюсь, ты придёшь!'
                    {print} 'Обнимаю, ' хозяин
                    ```
    piggybank:
        name: Копилка
        default_save_name: Копилка
        description: Подсчитай свои карманные деньги!
        levels:
            7:
                story_text: |
                    В этом приключении ты научишься делать цифровую копилку.

                    ### Задание
                    Допиши код, чтобы подсчитать, сколько у тебя денег и сколько времени нужно копить на желанную покупку!
                    **Дополнительно** Может быть, ты уже что-то накопил? Вычти эту сумму из той, которую нужно накопить.
                example_code: |
                    ```
                    {print} 'Цифровая копилка'
                    #Спрашиваем о карманных деньгах и желанной покупке
                    покупка = {ask} 'Что ты хочешь купить?'
                    цена = {ask} 'Сколько это стоит?'
                    накоплено = {ask} 'Сколько денег ты уже накопил?'
                    карманные = {ask} 'Сколько карманных денег ты получаешь в неделю?'
                    #Вычисляем, сколько времени нужно копить
                    осталось = цена - накоплено
                    недели = осталось / карманные
                    {print} 'Твоя покупка: ' _ '. Осталось копить столько недель: ' _
                    ```
                answer_code: |
                    ```
                    {print} 'Цифровая копилка'
                    покупка = {ask} 'Что ты хочешь купить?'
                    цена = {ask} 'Сколько это стоит?'
                    накоплено = {ask} 'Сколько денег ты уже накопил?'
                    карманные = {ask} 'Сколько карманных денег ты получаешь в неделю?'
                    осталось = цена - накоплено
                    недели = осталось / карманные
                    {print} 'Твоя покупка: ' покупка '. Осталось копить столько недель: ' недели
                    ```
            15:
                story_text: |
                    ### Задание
                    На этом уровне Hedy может сказать тебе, достаточно ли денег ты накопил!
                    Допиши код, заполнив пропуски!
                example_code: |
                    ```
                    _ рассчитать_бюджет(нужно, деньги, карманные):
                        осталось = нужно - деньги
                        недели = осталось / карманные
                        {if} нужно _ деньги:
                            {print}('Нужно ещё немного накопить!')
                            {print}('Осталось копить столько недель: ', недели)
                        {else}:
                            {print}('Отлично! Денег достаточно')
                            {print}('Пойдём за покупками!')

                    деньги = {input}('Сколько денег ты накопил?')
                    нужно = {input}('Сколько денег тебе нужно?')
                    карманные = {input}('Сколько карманных денег ты получаешь в неделю?')

                    _
                    ```
                answer_code: |
                    ```
                    {def} рассчитать_бюджет(нужно, деньги, карманные):
                        осталось = нужно - деньги
                        недели = осталось / карманные
                        {if} нужно > деньги:
                            {print}('Нужно ещё немного накопить!')
                            {print}('Осталось копить столько недель: ', недели)
                        {else}:
                            {print}('Отлично! Денег достаточно')
                            {print}('Пойдём за покупками!')

                    деньги = {input}('Сколько денег ты накопил?')
                    нужно = {input}('Сколько денег тебе нужно?')
                    карманные = {input}('Сколько карманных денег ты получаешь в неделю?')

                    рассчитать_бюджет(нужно, деньги, карманные)
                    ```
    print_command:
        name: '{print}'
        default_save_name: Вывод текста
        description: Знакомство с командой вывода
        levels:
            1:
                story_text: |
                    ## Команда {print}
                    Ты можешь напечатать текст на экране с помощью команды `{print}`.
                example_code: |
                    ```
                    {print} Привет, программист!
                    {print} Добро пожаловать в Hedy!
                    ```
                story_text_2: |
                    ### Упражнение
                    В Hedy в каждом приключении есть упражнения. Они помогают освоить новые команды и понятия, а ещё позволяют добавить что-то своё в примеры кода.
                    В этом упражнении ты увидишь розовый пропуск. Прежде чем запускать код, нужно что-нибудь вписать на его месте.

                    Впиши команду `{print}` в пропуск, а затем добавь ещё пять строк кода. Каждая строка должна начинаться с команды `{print}`.
                    Удачи!
                example_code_2: |
                    ```
                    _ Привет!
                    ```
                answer_code: |
                    ```
                    {print} Привет!
                    {print} Я программирую
                    {print} Это так просто
                    {print} И очень здорово!
                    {print} Это только первый уровень
                    {print} Надеюсь узнать ещё много нового!
                    ```
            13:
                story_text: |
                    Мы добрались до кода, который уже больше похож на настоящий Python!
                    На этом уровне новых команд не будет. Мы лишь немного изменим способ их записи, чтобы он стал ближе к Python.
                    Это значит, что теперь с `{print}` нужно использовать круглые скобки.
                    А ещё базовый код Hedy с этого уровня можно использовать в любой среде Python, если писать команды по-английски.
                    Если ты ещё не переключил язык команд, это можно сделать переключателем в меню команд.
                example_code: |
                    ```
                    {print}('Привет!')
                    ```
                story_text_2: |
                    Если хочешь вывести несколько значений, разделяй их запятыми.
                example_code_2: |
                    ```
                    температура = 25
                    {print}('На улице ', температура, ' градусов')
                    ```
                    ```
                    имя = 'Hedy'
                    {print} _ 'Меня зовут ', имя _
                    ```
                answer_code: |
                    Твой вариант ответа
    quizmaster:
        name: Викторина
        default_save_name: Викторина
        description: Создай свою викторину!
        levels:
            13:
                story_text: |
                    ### Упражнение
                    В этом приключении ты можешь создать свою викторину! Заполни пропуски, добавь ещё вопросы и сыграй в свою викторину!
                    Викторину можно сделать о чём угодно: о своём увлечении, любимом животном, любимой книге или о чём-то ещё!
                example_code: |
                    ```
                    {print}('Создай свою викторину')
                    points_a = 0
                    points_b = 0

                    #Играем в викторину:
                    {print}('Вопрос')
                    {print}('Вариант ответа A')
                    {print}('Вариант ответа B')
                    answer = {input}('Какой ответ выбираешь?')
                    {if} answer == 'A':
                        points_a = points_a + 1
                    {if} answer == 'B':
                        points_b = points_b + 1

                    #Выводим результаты:
                    {print}('Викторина окончена!')
                    {print}('Посмотрим на результаты!')
                    {if} points_a > points_b:
                        {print}('Ты в команде A')
                    {if} points_b > points_a:
                        {print}('Ты в команде B')
                    ```
                answer_code: |
                    Свой ответ
    quotation_marks:
        name: «Кавычки»
        default_save_name: Кавычки
        description: Знакомство с кавычками
        levels:
            4:
                story_text: |
                    ## «Кавычки»
                    На уровне 4 команды `{ask}` и `{print}` меняются.
                    Теперь текст, который ты хочешь вывести, нужно заключать в кавычки.
                    В русском тексте мы используем «ёлочки», а в примерах кода — прямые одинарные (') или двойные (") кавычки. Такие же кавычки используются в Python.
                    Это удобно: теперь можно выводить любые слова, даже те, которые ты использовал для хранения значений с помощью `{is}`.
                    Большинство языков программирования тоже используют кавычки при выводе текста, так что мы становимся ещё на шаг ближе к настоящему программированию!
                example_code: |
                    ```
                    {print} 'Теперь нужно использовать кавычки!'
                    ответ {is} {ask} 'Что теперь нужно использовать?'
                    {print} 'Теперь нужно использовать ' ответ
                    ```
                story_text_2: |
                    ## Апострофы в тексте
                    Важно! Теперь мы используем кавычки, поэтому апостроф внутри текста может запутать Hedy. Он выглядит так же, как одинарная кавычка. Например, апостроф есть в названии Кот-д'Ивуар.
                    Если в строке есть апостроф, заключи её в двойные кавычки!
                    Посмотри на пример: сначала показано, как делать неправильно.
                example_code_2: |
                    ```
                    #Так использовать апострофы неправильно
                    {print} 'Я хочу посетить Кот-д'Ивуар'
                    {print} 'Кот-д'Ивуар находится в Африке'

                    #А вот как это исправить
                    {print} "Я хочу посетить Кот-д'Ивуар"
                    {print} "Кот-д'Ивуар находится в Африке"

                    #Попробуй! Напиши ниже свою строку кода с кавычками
                    _
                    ```
                answer_code: |
                    Свой ответ
    random_command:
        name: '{random}'
        default_save_name: Случайный выбор
        description: Знакомство с командой {at} {random}
        levels:
            3:
                story_text: |
                    ## Случайный выбор
                    На этом уровне ты можешь создать список с помощью команды `{is}`. Компьютер может выбрать случайный элемент этого списка. Для этого используй `{at} {random}`.
                example_code: |
                    ```
                    животные {is} собаки, кошки, кенгуру
                    {print} животные {at} {random}
                    ```
                story_text_2: |
                    Команду `{at} {random}` можно использовать и внутри предложения.
                example_code_2: |
                    ```
                    еда {is} бутерброд, кусок пиццы, салат, буррито
                    {print} Мой обед сегодня: еда {at} {random}
                    ```
                story_text_3: |
                    ### Задание
                    Попробуй команду `{at} {random}` в деле: создай собственное игровое шоу, как по телевизору! Игрок выбирает дверь или чемодан, за которыми скрывается большой приз!
                    Справишься? Первые строки уже есть в примере.
                example_code_3: |
                    ```
                    {print} Большое игровое шоу!
                    {print} Перед тобой 3 чемодана...
                    выбор {is} {ask} Какой чемодан ты выбираешь?
                    призы {is} _
                    _
                    ```
                answer_code: |-
                    ```
                    {print} Большое игровое шоу!
                    {print} Перед тобой 3 чемодана...
                    выбор {is} {ask} Какой чемодан ты выбираешь?
                    призы {is} тако, ручка, миллион долларов
                    {print} Твой приз... призы {at} {random}
                    ```
            14:
                story_text: |-
                    Теперь, когда ты умеешь использовать скобки в списках, познакомимся с новым способом записи команды `{at} {random}`.
                    Просто добавь к имени списка `[случайном]` вместо индекса с числом!
                example_code: |-
                    ```
                    фрукты = ['яблоко', 'банан', 'вишня']
                    {print}(фрукты[случайном])
                    ```
                story_text_2: |-
                    ### Задание
                    Допиши код. Пусть компьютер выберет случайного победителя.
                example_code_2: |-
                    ```
                    имена = _'Саша', 'Женя', 'Миша'_
                    {print}('Победитель: ' _ )
                    ```
                answer_code: |
                    ```
                    имена = ['Саша', 'Женя', 'Миша']
                    {print}('Победитель: ', имена[случайном])
                    ```
    repeat_command:
        name: '{repeat}'
        default_save_name: Повторение
        description: Команда {repeat}
        levels:
            8:
                story_text: |
                    На этом уровне появляется команда `{repeat}`. С помощью `{repeat}` можно выполнить одну строку кода несколько раз. Вот так:

                    ### Упражнение
                    Поэкспериментируй с командой `{repeat}`. Сможешь теперь записать песню «С днём рождения тебя» всего в 3 строки кода вместо 4?
                example_code: |
                    ```
                    {repeat} 3 {times} {print} 'С Hedy весело!'
                    ```
                answer_code: |
                    ```
                    {repeat} 2 {times} {print} 'С днём рождения тебя'
                    {print} 'С днём рождения, дорогая Hedy'
                    {print} 'С днём рождения тебя'
                    ```
            9:
                story_text: |
                    На этом уровне ты можешь повторять несколько строк кода с помощью одной команды `{repeat}`.
                    Для этого объедини строки, которые нужно повторять, в блок.
                    Строки внутри блока должны иметь **отступ**.
                    Это значит, что в начале каждой строки нужно поставить знак табуляции или 4 пробела. Даже если в блоке только одна строка, отступ всё равно нужен.
                example_code: |
                    ```
                    {repeat} 5 {times}
                        {print} 'Всем привет'
                        {print} 'Всё это повторяется 5 раз'
                    ```
                answer_code: |
                    ```
                    {print} 'Ты знаешь пекаря?'
                    {repeat} 2 раз
                        {print} 'Того пекаря'
                    {print} 'Ты знаешь пекаря, который живёт на Друри-Лейн?'
                    ```
            10:
                story_text: |
                    Отличная работа! Ты добрался до нового уровня! На прошлом уровне ты научился использовать несколько строк кода в команде `{if}` или `{repeat}`.
                    Но совмещать их пока было нельзя…

                    Хорошие новости! На этом уровне ты можешь помещать `{if}` внутрь `{if}`, `{repeat}` внутрь `{repeat}` и вкладывать эти команды друг в друга.
                    Попробуй!
                example_code: |
                    ```
                    {repeat} 3 {times}
                        заказ = {ask} 'Что ты хочешь заказать?'
                        {if} заказ {is} пицца
                            {print} 'Вкуснятина'
                        {else}
                            {print} 'Пицца вкуснее!'
                    ```
                answer_code: |
                    Твой вариант
    repeat_command_2:
        name: '{repeat} 2'
        default_save_name: Повторение_2
        description: Команда {repeat} 2
        levels:
            8:
                story_text: |
                    ## Повторение с другими командами и переменными
                    Ты уже попробовал команду `{repeat}` вместе с командой `{print}`, но знаешь ли ты, что с `{repeat}` можно использовать и другие команды?
                    В этом примере видно, что `{repeat}` можно использовать и с командами `{ask}`, `{if}` или `{else}`.
                example_code: |
                    ```
                    {repeat} 2 {times} ответ = {ask} 'Ты знаешь, что вопрос можно задать несколько раз?'
                    {if} ответ {is} да
                    {repeat} 2 {times} {print} 'Ты уже это знаешь!'
                    {else}
                    {repeat} 3 {times} {print} 'Теперь ты знаешь кое-что новое!'
                    ```
                story_text_2: |
                    Ещё одна интересная возможность команды `{repeat}` — задавать число повторений с помощью переменной. В примере мы сначала спрашиваем человека, сколько ему лет.
                    Затем в строке 3 поздравление повторяется столько раз, сколько записано в переменной `возраст`. То есть мы использовали переменную `возраст` с командой `{repeat}`.
                example_code_2: |
                    ```
                    {print} 'Ура! У тебя день рождения!'
                    возраст = {ask} 'Сколько тебе исполнилось лет?'
                    {repeat} возраст {times} {print} 'Гип-гип, ура!'
                    ```
                answer_code: |
                    Свой ответ
            9:
                story_text: |
                    ### В блоке или нет?
                    На этом уровне нужно внимательно подумать, какие строки кода должны входить в блок, а какие — нет.
                    Например, ты хочешь спеть песенку *про пекаря*. Только строку «Того пекаря» нужно повторить дважды.
                    Значит, последняя строка не должна начинаться с отступа, ведь она не входит в блок.
                    Если поставить отступ перед последней строкой, песенка получится неправильной.

                    ### Упражнение
                    Каждая строка примера начинается с пропуска. Удали пропуски и попробуй определить, каким строкам нужны отступы, а каким нет, чтобы получилась песенка про пекаря.
                example_code: |
                    ```
                    _ {print} 'Знаешь ли ты пекаря?'
                    _ {repeat} 2 {times}
                    _ {print} 'Того пекаря'
                    _ {print} 'Знаешь ли ты пекаря, что живёт на Друри-лейн?'
                    ```
                answer_code: |
                    ```
                    {print} 'Знаешь ли ты пекаря?'
                    {repeat} 2 {times}
                        {print} 'Того пекаря'
                    {print} 'Знаешь ли ты пекаря, что живёт на Друри-лейн?'
                    ```
    restaurant:
        name: Ресторан
        default_save_name: Ресторан
        description: Создай свой виртуальный ресторан
        levels:
            1:
                story_text: |
                    На уровне 1 ты можешь создать свой виртуальный ресторан и принимать заказы гостей.
                story_text_2: |
                    ### Упражнение
                    Скопируй пример кода в редактор, нажав жёлтую кнопку.
                    Сначала впиши нужную команду вместо пропуска, чтобы код заработал правильно.
                    Затем добавь в программу ресторана ещё хотя бы 4 строки кода.
                    Спроси гостя, что он хочет выпить и как хочет заплатить: наличными или картой.
                    В конце придумай, как попрощаться с гостем.
                example_code_2: |
                    ```
