                    ```
                    настроение {is} {ask} 'Какое у тебя сегодня настроение?'
                    {if} настроение {is} радостное
                    {play} C4
                    {elif} настроение {is} грустное
                    {play} _
                    {elif} настроение {is} _
                    {play} _
