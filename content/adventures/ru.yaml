                story_text_2: |
                    В приведенном выше примере монстры предопределены. Поэтому каждый раз, когда вы запускаете свой код, результат будет один и тот же.
                    Можете ли вы добавить команды `{ask}`, чтобы сделать дом с привидениями интерактивным и чтобы игроки сами выбирали монстров, с которыми они сталкиваются?
