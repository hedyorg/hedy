                    ### Упражнение
                    Допиши мелодию «Чижик-пыжик», знакомую по уровню 2.
                    Перед каждой музыкальной фразой очищай экран и выводи её название.
                    Затем попробуй сделать караоке для любимой песни: выводи слова перед соответствующей частью мелодии!
                example_code: |
                    ```
                    {print} 'Чижик-пыжик: первая фраза'
                    {play} E5
                    {play} C5
                    {play} E5
                    {play} C5
                    {play} F5
                    {play} E5
                    {play} D5
                    {clear}
                    {print} 'Чижик-пыжик: вторая фраза'
                    {play} G4
                    _
                    ```
                answer_code: |
                    ```
                    {clear}
                    {print} 'Чижик-пыжик: первая фраза'
                    {play} E5
                    {play} C5
                    {play} E5
                    {play} C5
                    {play} F5
                    {play} E5
                    {play} D5
                    {clear}
                    {print} 'Чижик-пыжик: вторая фраза'
                    {play} G4
