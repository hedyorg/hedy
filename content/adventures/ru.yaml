                    ### Упражнение
                    В примере кода видно, как сделать программу-гадалку, которая позволяет подтасовать шансы в свою пользу. Эта жульническая программа всегда говорит, что вы выиграете в лотерею, а ваши друзья никогда не выиграют.

                    Используйте это, чтобы сделать свою программу, проявите творчество! Например, можно создать код, который предсказывает, что:
                    * ваша любимая спортивная команда победит всех соперников!
                    * ваш любимый фильм выберут для киновечера!
                    * вы выиграете билеты на любимое шоу!
                    * вы всех прекраснее, как в волшебном зеркале Белоснежки.
                    Дайте волю воображению!

                    Программа должна состоять минимум из 10 строк кода и содержать хотя бы одну команду `{if}` и `{else}`.
                answer_code: |
                    ```
                    друзья {is} Джордан, Люси, Дейв
                    {print} 'Я могу предсказать будущее...'
                    {sleep} 2
                    {clear}
                    {print} 'Я могу предсказать, победит ли твоя любимая спортивная команда'
                    человек {is} {ask} 'Кто ты?'
                    хороший_ответ {is} Ура! Твоя команда победит!, Твоя команда точно победит!, Твоя команда победит! Ура!
                    плохой_ответ {is} Не повезло! Твоя команда не победит!, Облом... Твоя любимая спортивная команда проиграет..., Твоя любимая команда проиграет
                    {if} человек {is} {in} друзья
                    {print} плохой_ответ {at} {random}
                    {else}
                    {print} хороший_ответ {at} {random}
                    ```
            7:
