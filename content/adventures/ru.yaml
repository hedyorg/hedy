    calculator_2:
        name: Калькулятор 2
        default_save_name: Калькулятор 2
        description: Калькулятор 2
        levels:
            10:
                story_text: |
                    ### Упражнение 1
                    Давай немного усложним программу для тренировки. Теперь игроку нужно правильно ответить на два вопроса. Заполни пропуски, чтобы завершить программу.

                    ### Упражнение 2
                    Иногда у задачи несколько правильных ответов. Например, 10 делится и на 5, и на 2. Поэтому на вопрос «На какое число делится 10?» можно ответить и 2, и 5.
                    Придумай задачу с несколькими правильными ответами, попроси игрока решить её и проверь ответ с помощью `{or}`.
                    Очисти поле программирования и создай своё решение.
                example_code: |
                    ```
                    ответ1 = {ask} 'Сколько будет 10 умножить на 7?'
                    ответ2 = {ask} 'Сколько будет 6 умножить на 7?'
                    {if} _ _ _ _ _ _ _
                        {print} _
                    ```
                answer_code: |
                    Упражнение 1
                    ```
                    ответ1 = {ask} 'Сколько будет 10 умножить на 7?'
                    ответ2 = {ask} 'Сколько будет 6 умножить на 7?'
                    {if} ответ1 = 70 {and} ответ2 = 42
                        {print} "Правильно!"
                    ```

                    Упражнение 2
                    ```
                    ответ = {ask} "На какое число делится 12?"
                    {if} ответ {is} 1 {or} ответ {is} 2 {or} ответ {is} 3 {or} ответ {is} 4 {or} ответ {is} 6 {or} ответ {is} 12
                        {print} "Правильно!"
                    {else}
                        {print} "Неверно!"
                    ```
            15:
                story_text: |
                    ### Упражнение 2
                    **Это вторая часть приключения.** Начало находится в предыдущем приключении.
                    Конечно, не всегда нужно вычислять среднюю оценку за 4 контрольные. Иногда нужно найти среднюю оценку за 10 контрольных или всего за 2...
                    Мы можем решить эту проблему, добавив переменную «число_контрольных» и используя её значение при вычислении.
                    * Добавь новую строку на строке 3. Задай значение переменной число_контрольных, спросив, сколько контрольных написал ученик.
                    * Замени 4 в строке 4 на число_контрольных.
                    * Наконец, замени 4 в строке 6 на число_контрольных.

                    Запусти новую программу. Всё работает?

                    ### Упражнение 3
                    Хочешь сделать программу ещё лучше? Отлично! Предыдущая программа вычисляла среднюю оценку только по одному предмету, а было бы здорово вычислять её по всем нужным предметам!
                    Мы не будем рассказывать, как это сделать, но дадим подсказку: начни первую строку кода так: `{def} рассчитать_среднюю_оценку(предмет):`.
                example_code: |
                    ```
                    # Используй свой код из предыдущего приключения.
                    ```
                answer_code: |
                    Упражнение 2
                    ```
                    {def} рассчитать_среднюю_оценку():
                        сумма = 0
                        число_контрольных = {input}("Сколько контрольных ты написал?")
                        {for} i {in} {range} (1, число_контрольных):
                            оценка = {input}("Какую оценку ты получил за контрольную № ", i, '?')
                            сумма = сумма + оценка
                        {return} сумма / число_контрольных

                    средняя_оценка = рассчитать_среднюю_оценку()
                    {print}('Твоя средняя оценка — ', средняя_оценка)
                    ```

                    Упражнение 3
                    ```
                    {def} рассчитать_среднюю_оценку(предмет):
                        сумма = 0
                        число_контрольных = {input}("Сколько контрольных у тебя по предмету ", предмет)
                        {for} i {in} {range} (1, число_контрольных):
                            оценка = {input} ("Какую оценку ты получил за контрольную № ", i, '?')
                            сумма = сумма + оценка
                        {return} сумма / число_контрольных

                    число_предметов = {input}('По скольким предметам ты хочешь вычислить среднюю оценку?')
                    {repeat} число_предметов {times}
                        предмет = {input}('По какому предмету ты хочешь вычислить среднюю оценку?')
                        средняя_оценка = рассчитать_среднюю_оценку(предмет)
                        {print} ('Твоя средняя оценка по предмету ', предмет, ' — ', средняя_оценка)
                    ```
