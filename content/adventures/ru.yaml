    for_command:
        levels:
            11:
                story_text: |-
                    ## For
                    На этом уровне мы изучаем новый код `{for}`. С помощью `{for}` можно создать список и использовать все элементы.
                    `{for}` создаёт блок, как `{repeat}` и `{if}`, поэтому все строки в блоке должны начинаться с табуляции или 4 пробелов.
                example_code: |
                    ```
                    животные = собака, кошка, рыба-капля
                    {for} животное {in} животные
                        {print} 'Я люблю ' животное
                    ```
                story_text_2: |
                    ### Упражнение
                    Закончите код, добавив `{for} действие {in} действия` во вторую строку.
                example_code_2: |
                    ```
                    действия = хлопай в ладоши, топай ногами, кричи Ура!
                    _
                        {repeat} 2 {times}
                            {print} 'Если ты счастлив и знаешь это, ' действие
                            {sleep} 2
                        {print} 'Если ты счастлив и знаешь это, и хочешь это показать'
                        {print} 'Если ты счастлив и знаешь это, ' действие
                        {sleep} 3
                    ```
                answer_code: |
                    ```
                    действия = хлопай в ладоши, топай ногами, кричи Ура!
                    {for} действие {in} действия
                        {repeat} 2 {times}
                            {print} 'Если ты счастлив и знаешь это, ' действие
                            {sleep} 2
                        {print} 'Если ты счастлив и знаешь это, и хочешь это показать'
                        {print} 'Если ты счастлив и знаешь это, ' действие
                        {sleep} 3
                    ```
            14:
                story_text: |
                    Наконец, превратим `{repeat} 5 {times}` в настоящий код Python. Как и с `{if}`, понадобится двоеточие. Вот так:
                example_code: |
                    ```
                    {for} i {in} {range}(1,5):
                        {print}(i)
                    ```
                story_text_2: |
                    Помните, эта команда также очень полезна в сочетании со списком.
                    Можно сопоставить 2 списка с помощью переменной `{in} {range}`. 
                example_code_2: |
                    ```
                    друзья = ['Ахмед', 'Бен', 'Кейден']
                    счастливые_числа = [15, 18, 6]
                    {for} i {in} {range}(1, 3):
                        {print}(друзья[i], ' счастливое число — ', счастливые_числа[i])
                    ```
                answer_code: |
                    Свой ответ
