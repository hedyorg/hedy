                    * Если его нет в списке, сообщить, что есть его, скорее всего, безопасно
                    * Затем предупредить, что всегда нужно руководствоваться здравым смыслом: список может быть неполным. Также посоветовать избегать сырых мяса, рыбы, яиц и алкоголя.
                    Во время беременности небезопасно есть: суши, креветки, тунец, сыр с плесенью, тирамису, яйца всмятку, карпаччо, стейк с кровью, тартар.
