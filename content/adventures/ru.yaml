                    Теперь, когда вы научились использовать квадратные скобки в списках, мы покажем другой способ использования команды `{at} {random}`. 
                    Просто пишите имя списка с `[random]` после него там, где обычно пишется число!
                example_code: |-
                    ```
                    фрукты = ['яблоко', 'банан', 'вишня']
                    {print}(фрукты[random])
                    ```
                story_text_2: |-
                    ### Упражнение
                    Закончите код. Пусть компьютер выберет случайного победителя.
                example_code_2: |-
                    ```
                    имена = _'Сара', 'Джейсон', 'Меган'_
                    {print}('Победитель:' _ )
                    ```
                answer_code: |
                    ```
                    имена = ['Сара', 'Джейсон', 'Меган']
                    {print}('Победитель:' имена[random] )
                    ```
