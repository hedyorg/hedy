                    На этом уровне можно использовать переменную и команду `{at} {random}`, чтобы Хеди действительно выбрала ответ за вас. Посмотрите, например, этот код:
                story_text_2: |
                    Сейчас Хеди может ответить только "да", "нет" или "может быть". Можете ли вы дать Хеди больше вариантов ответа, например, "определенно" или "переспросить"
                example_code: |
                    ```
                    {print} Я Хеди, гадалка!
