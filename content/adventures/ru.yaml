                        {if} _ {and} _ :
                            {print}('видеоигра')

                        {if} _ {and} :
                            {print}('воздушный шарик')

                        chosen_prize = {input}('Какой приз ты хочешь?')
                        {print}('Поздравляем! Твой приз: ', chosen_prize)

                    ```
