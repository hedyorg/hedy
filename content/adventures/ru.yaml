    maths:
        name: Вычисления
        default_save_name: Вычисления
        description: Знакомство с вычислениями
        levels:
            7:
                story_text: |
                    На этом уровне ты узнаешь кое-что новое: теперь можно ещё и считать.

                    Со сложением всё просто: записывай его как в математике, например `5 + 5`. Вычитание тоже работает привычным образом: `5 - 5`.

                    А вот умножение немного отличается: отдельного знака умножения на обычной клавиатуре нет. Можешь проверить!
                    Поэтому для умножения мы используем звёздочку: `5 * 5`. Читай это как «5 умножить на 5» — так легче запомнить. На английской раскладке звёздочка обычно находится на клавише 8.
                example_code: |
                    ```
                    {print} '5 плюс 5 будет ' 5 + 5
                    {print} '5 минус 5 будет ' 5 - 5
                    {print} '5 умножить на 5 будет ' 5 * 5
                    {print} '5 разделить на 5 будет ' 5 / 5
                    ```
                story_text_2: |-
                    **Десятичные дроби**
                    До сих пор в Hedy нельзя было использовать десятичные дроби, например 1.5, а теперь можно. Обрати внимание: в компьютере дробная часть отделяется точкой `.`.
                example_code_2: |
                    ```
                    {print} 'Два с половиной плюс два с половиной будет...'
                    {print} 2.5 + 2.5
                    ```
                story_text_3: |-
                    **Вычисления с переменными**
                example_code_3: |
                    ```
                    {print} 'Билет стоит 2 доллара'
                    билеты = {ask} 'Сколько билетов ты хочешь купить?'
                    цена = билеты * 2
                    {print} 'К оплате: ' цена ' долл., пожалуйста'
                    ```
                answer_code: |
                    Свой ответ
    monster:
        name: Монстр
