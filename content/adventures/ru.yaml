            15:
                story_text: |
                    После операции пациенты иногда испытывают сильную боль. В таких случаях им могут выдать помпу с морфином, чтобы при боли они могли самостоятельно получить дополнительную дозу.
                    Такие помпы нужно программировать очень внимательно, чтобы пациенты не получили слишком много морфина. Сможешь запрограммировать помпу для нас?
                    ### Упражнение
                    Программа должна:
                    * Спросить у медсестры или медбрата, сколько миллилитров морфина пациент уже получил сегодня
                    * Предложить передать устройство пациенту
                    * Спросить пациента, насколько сильна его боль по шкале от 1 до 10
                    * Сообщить пациенту, что для получения дополнительной дозы нужно нажать x
                    * При нажатии x вызвать функцию morphine с аргументами pain_level и morphine_level
                    * Функция должна выводить «Тебе будет введено ещё 20 мл морфина», пока уровень боли не ниже 6, а количество морфина меньше 120
                    * После введения новой дозы программа должна подождать 2 минуты (во время проверки можно использовать 2 секунды)
                    * После этих 2 минут нужно увеличить количество морфина на 20 мл и обновить уровень боли, спросив пациента, как он себя чувствует
                    * Если морфина уже слишком много или боль прошла, сообщить, что дополнительной дозы не будет. Если боль сильная, посоветовать позвать медсестру или медбрата.
                    * Сообщить, что помпа сейчас отключится и для повторного запуска нужно нажать x
                answer_code: |
                    ```
                    {print}('Помпа с морфином')
                    morphine_level = {input}('Сколько мл морфина пациент уже получил сегодня?')
                    {print}('Теперь передай устройство пациенту')

                    pain_level = {input}('Насколько сильна твоя боль по шкале от 1 до 10?')
                    {print}('Нажми x, чтобы получить морфин')

                    {define} morphine(pain_level, morphine_level):
                        {if} pain_level >= 6 {and} morphine_level < 120:
                            {print}('Тебе будет введено ещё 20 мл морфина')
                            {sleep} 2
                            morphine_level = morphine_level + 20
                            {print}('Помпа сейчас отключится')
                            {return} morphine_level
                        {else}:
                            {print}('Сейчас вводить ещё морфин небезопасно')
                            {print}('Если боль слишком сильная, позови медсестру или медбрата')
                            {return} morphine_level

                    {for} i {in} {range}(1, 10):
                        wait_for_x = {input}('Нажми x, чтобы получить морфин')
                        {if} wait_for_x == 'x':
                            morphine_level = morphine(pain_level, morphine_level)
                            pain_level = {input}('Насколько сильна твоя боль по шкале от 1 до 10?')
                        {sleep} 2
                    ```
            16:
                story_text: |
                    Нашим студентам-медикам нужно выучить медицинские названия частей тела. Им трудно запомнить все анатомические термины, а учёба кажется очень скучной.
                    Поможешь им, создав игру для тренировки медицинских терминов?
                    Вот термины, которые им нужно знать: corpus = тело, caput = голова, oculus = глаз, nasus = нос, auris = ухо, os = рот, collum = шея, manus = кисть, pectus = грудь, humerus = плечо, venter = живот, tergum = спина.
                    ### Упражнение
                    Программа должна:
                    * Быть игрой, в которой студенты тренируют медицинские термины
                    * Давать очко и хвалить за правильный ответ
                    * Отнимать очко и сообщать об ошибке за неправильный ответ
                    * При ошибке показывать правильный ответ на несколько секунд, затем очищать экран и повторять вопрос, пока ответ не будет верным
                    * Продолжать игру, пока студент не ответит правильно на все вопросы
                    * Показывать итоговый счёт
                    * Давать отзыв в зависимости от счёта: 12 очков — «Потрясающе!», 8–11 — «Молодец, продолжай тренироваться!», 7 и меньше — «Тебе стоит ещё поучиться!»
                answer_code: |
                    ```
                    points = 0
                    latin_terms = ['corpus', 'caput', 'oculus', 'nasus', 'auris', 'os', 'collum', 'manus', 'pectus', 'humerus', 'venter', 'tergum']
                    russian_terms = ['тело', 'голова', 'глаз', 'нос', 'ухо', 'рот', 'шея', 'кисть', 'грудь', 'плечо', 'живот', 'спина']

                    {for} i {in} {range}(1, 12):
                        correct_answer = russian_terms[i]
                        answer = 0
                        {while} answer != correct_answer:
                            answer = {input}('Как по-русски называется ', latin_terms[i], '?')
                            {if} answer != correct_answer:
                                {print}('Это неверно')
                                {print}('Правильный перевод ', latin_terms[i], ' — ', russian_terms[i])
                                {sleep} 3
                                clear
                                points = points - 1
                        points = points + 1
                        {print}('Верно!')

                    {print}('Поздравляю, ты повторил все термины!')
                    {print}('Твой счёт: ', points)

                    {if} points == 12:
                        {print}('Потрясающе!')

                    {if} points <=7:
                        {print}('Тебе стоит ещё поучиться!')
                    {else}:
                        {print}('Молодец, продолжай тренироваться!')
                    ```
