                    Добро пожаловать в приключение «Больница». В этом приключении вы помогаете директору больницы решать проблемы, возникающие в больнице. Вот ваше первое задание:

                    У нашей стойки регистрации ужасно длинная очередь, а сотрудник очень занят. Не могли бы вы помочь этому сотруднику, запрограммировав киоск самостоятельной регистрации?
                    ### Упражнение
                    Киоск самостоятельной регистрации должен:
                    * Приветствовать пациента
                    * Спросить его имя и вывести ответ
                    * Спросить его дату рождения и вывести ответ
                    * Спросить, в какое отделение у него приём
                    * Спросить, к какому врачу у него приём
                    * Поблагодарить пациента за успешную регистрацию
                    * Сказать пациенту занять место в зале ожидания
                answer_code: |
                    ```
                    {print} Здравствуйте, добро пожаловать в больницу
                    {ask} Как вас зовут?
                    {print} Ваше имя: answer
                    {ask} Какая у вас дата рождения?
                    {print} Ваша дата рождения: answer
                    {ask} В какое отделение у вас приём?
                    {print} У вас приём здесь: answer
                    {ask} К какому врачу у вас приём?
                    {print} к врачу answer
                    {print} Спасибо. Вы успешно зарегистрировались!
