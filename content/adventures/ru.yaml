            10:
                story_text: |
                    У сотрудников отделения неотложной помощи возникла проблема. К ним приходит много пациентов, которым на самом деле не нужна срочная помощь: им стоило бы обратиться к своему терапевту.
                    Эти пациенты заполняют зал ожидания и сильно увеличивают нагрузку на персонал. Поможешь сотрудникам, создав приложение, которое подскажет пациенту, нужно ли ему в отделение неотложной помощи?
                    ### Упражнение
                    Программа должна дать пациенту один из советов: «Немедленно обратись в отделение неотложной помощи», «Позвони своему врачу, чтобы обсудить ситуацию» или «Обратись к своему терапевту при первой возможности».
                    Программа задаёт следующие вопросы:
                    * Твоя ситуация угрожает жизни?
                    * Тебе трудно дышать?
                    * Ты внезапно потерял способность говорить, видеть, ходить или двигаться?
                    * Ты проглотил или вдохнул ядовитое вещество?
                    * У тебя сломана кость?
                    * У тебя сильная аллергическая реакция?
                    * Ты испытываешь сильную боль?

                    Если пациент отвечает «да» хотя бы на один вопрос, программа должна посоветовать немедленно обратиться в отделение неотложной помощи. Другие вопросы задавать не нужно: время очень важно.
                    Если пациент отвечает «нет» на все вопросы, программа должна спросить:
                    * Это может подождать до завтра?
                    Если ответ «да», программа советует обратиться к терапевту при первой возможности. Если ответ «нет», программа советует позвонить своему врачу, чтобы обсудить ситуацию.
                answer_code: |
                    ```
                    lifethreatening = {ask} 'Твоя ситуация угрожает жизни?'
                    {if} lifethreatening {is} 'да'
                        {print} 'Немедленно обратись в отделение неотложной помощи!'
                    {else}
                        breathing = {ask} 'Тебе трудно дышать?'
                        {if} breathing {is} 'да'
                            {print} 'Немедленно обратись в отделение неотложной помощи!'
                        {else}
                            ability = {ask} 'Ты внезапно потерял способность говорить, видеть, ходить или двигаться?'
                            {if} ability {is} 'да'
                                {print} 'Немедленно обратись в отделение неотложной помощи!'
                            {else}
                                poison = {ask} 'Ты проглотил или вдохнул ядовитое вещество?'
                                {if} poison {is} 'да'
                                    {print} 'Немедленно обратись в отделение неотложной помощи!'
                                {else}
                                    broken_bone = {ask} 'У тебя сломана кость?'
                                    {if} broken_bone {is} 'да'
                                        {print} 'Немедленно обратись в отделение неотложной помощи!'
                                    {else}
                                        allergy = {ask} 'У тебя сильная аллергическая реакция?'
                                        {if} allergy {is} 'да'
                                            {print} 'Немедленно обратись в отделение неотложной помощи!'
                                        {else}
                                            wait = {ask} 'Это может подождать до завтра?'
                                            {if} wait {is} 'да'
                                                {print} 'Обратись к своему терапевту при первой возможности.'
                                            {else}
                                                {print} 'Позвони своему врачу, чтобы обсудить ситуацию'
                    ```
            11:
                story_text: |
                    В прививочном кабинете сломался экран, который приглашает следующего пациента на прививку. Сможешь его починить?
                    ### Упражнение
                    Программа должна:
                    * Хранить список имён пациентов, записанных на приём
                    * Спрашивать у медсестры или медбрата, есть ли сегодня новые пациенты, и если есть, то сколько
                    * Добавлять имена новых пациентов в список
                    * Затем приглашать пациента в прививочный кабинет
                    * Ждать 10 секунд, очищать экран и приглашать следующего пациента, пока не будут приглашены все пациенты из списка
                answer_code: |
                    ```
                    patients {is} Берт, Юлия, Эбби, Оскар, Эрни, Розита, Зоя
                    amount_patients = 7

                    new_patients = {ask} 'Сегодня есть новые пациенты?'
                    {if} new_patients {is} да
                        amount_new_patients = {ask} 'Сколько?'
                        amount_patients = amount_patients + amount_new_patients
                        {repeat} amount_new_patients {times}
