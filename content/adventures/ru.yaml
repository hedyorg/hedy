            2:
                story_text: |
                    ## Использование переменных
                    На предыдущих уровнях ты научился использовать `{answer}`, чтобы выводить ответ на вопрос. Но что, если нужно использовать несколько ответов?
                    На этом уровне ты научишься работать с несколькими **переменными**. Переменная — это место для хранения ответа пользователя (или *ввода*). Ты уже пользовался переменной `{answer}`, а теперь узнаешь, как использовать и другие!
                    В этом примере показаны переменные «имя» и «возраст».

                    ## {ask}
                    Видишь, команда `{ask}` тоже изменилась? Чтобы указать компьютеру, в какой переменной сохранить ответ, начни строку с имени переменной, затем напиши `{is}`, а потом `{ask}`.
                example_code: |
