                    _
                    ```
                answer_code: |
                    ```
                    ответ {is} {ask} 'Как называется столица Зимбабве?'
                    {if} ответ {is} Хараре {play} C6
                    {else} {play} C3

                    ответ {is} {ask} 'Как называется столица Франции?'
                    {if} ответ {is} Париж {play} C6
                    {else} {play} C3

