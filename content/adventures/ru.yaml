                    На предыдущих уровнях ты научился создавать функции и передавать им аргументы. Ещё одно полезное применение функций — вычисления.
                    Можно поручить функции вычисление, и она выдаст результат. Этот результат называется **возвращаемым значением**.

                    Например, в этом коде функция рассчитать_новую_цену вычисляет новую цену любого товара. Она выдаёт новую цену как возвращаемое значение.

