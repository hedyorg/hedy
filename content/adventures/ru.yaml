                    Тогда вы, наверное, знаете, что на самом деле они не могут предсказать будущее, но играть всё равно весело!

                    На следующих уровнях можно научиться создавать свою собственную машину для гадания!
                    На уровне 1 можно начать с простого: пусть Хеди представится гадалкой и повторит ответы игроков.
                    Вот так:
                example_code: |
                    ```
