        levels:
            1:
                story_text: |
                    В этом приключении вы создаёте игру, в которой нужно выбраться из дома с привидениями, выбрав правильную дверь.
                    Если выбрать правильную дверь, вы выживете, а если нет, страшный монстр может...

                    На уровне 1 мы начинаем игру «Дом с привидениями» с придумывания страшной истории и спрашиваем игрока, какую дверь он выберет в доме с привидениями.
                story_text_2: |
                    ### Упражнение
                    Скопируйте пример кода в поле ввода, нажав жёлтую кнопку.
                    Теперь закончите историю, добавив минимум 5 строк кода.
                    Не забывайте, что каждая строка кода должна начинаться с `{print}` или `{ask}`.
                example_code: |
                    ```
                    {print} Как я сюда попал?
                    {print} Я помню, как друг сказал мне зайти в старый особняк...
                    {print} и вдруг всё потемнело.
                    {print} Но как я оказался на полу...?
                    {print} У меня голова болит, как будто меня ударили бейсбольной битой!
                    {print} Что это за звук?
                    {print} О нет! Мне кажется, я в этом доме не один!
                    {print} Мне нужно отсюда выбраться!
                    {print} Передо мной 3 двери..
                    {ask} Какую дверь мне выбрать?
                    {print} Я выбираю дверь {answer}
                    {print} ...?
                    ```
                answer_code: |
                    ```
                    {print} Как я сюда попал?
                    {print} Я помню, как друг сказал мне зайти в старый особняк...
                    {print} и вдруг всё потемнело.
                    {print} Но как я оказался на полу...?
                    {print} У меня голова болит, как будто меня ударили бейсбольной битой!
                    {print} Что это за звук?
                    {print} О нет! Мне кажется, я в этом доме не один!
