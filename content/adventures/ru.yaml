            7:
                story_text: |
                    Теперь вместо нот можно играть числа. Просто напиши `{play} 1` для самой низкой ноты, `{play} 70` для самой высокой или любое число между ними.

                    ### Упражнение
                    Пора заняться музыкальной математикой! Запусти пример кода несколько раз с разными начальными числами.
                    Затем попробуй сочинить песню с помощью чисел.
                example_code: |
                    ```
