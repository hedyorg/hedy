                    ### Упражнение
                    На этом уровне можно позволить Хеди сказать, накопили ли вы достаточно денег!
                    Закончите код, заполнив пропуски!
                example_code: |
                    ```
                    _ рассчитать_бюджет(желание, деньги, карманные):
                        нужно_накопить = желание - деньги
                        недель = нужно_накопить / карманные
                        {if} желание _ деньги:
                            {print}('Нужно накопить ещё немного!')
                            {print}("Понадобится ', недель, ' недель.")
                        {else}:
