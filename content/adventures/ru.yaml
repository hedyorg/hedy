                    {print} 'Тебе выпало: ' бросок
                    {if} бросок {is} червь
                    очки = очки + 5
                    {else}
                    очки = очки + бросок
                    {print} 'Всего очков: ' очки

                    бросок = варианты {at} {random}
                    {print} 'Тебе выпало: ' бросок
                    {if} бросок {is} червь
                    очки = очки + 5
                    {else}
                    очки = очки + бросок
                    {print} 'Всего очков: ' очки

                    бросок = варианты {at} {random}
                    {print} 'Тебе выпало: ' бросок
                    {if} бросок {is} червь
                    очки = очки + 5
                    {else}
                    очки = очки + бросок
                    {print} 'Всего очков: ' очки
                    ```
            8:
                story_text: |
                    На этом уровне ты снова можешь сделать игральный кубик. С командой `{repeat}` легко бросить сразу несколько кубиков.

                    ### Упражнение
                    Попробуй закончить пример кода! **Дополнительно** Вспомни игру с кубиком и запрограммируй её с помощью `{repeat}`.
                example_code: |
                    ```
                    варианты = 1, 2, 3, 4, 5, 6
                    _ _ _ _ _ _ _
                    ```
                answer_code: |
                    ```
                    варианты = 1, 2, 3, 4, 5, 6
                    {repeat} 5 {times} {print} варианты {at} {random}
                    ```
            11:
                story_text: |
                    ### Упражнение
                    Все слишком долго бросают кубики? На этом уровне можно поручить Hedy бросить их за всех!
                    Замени имена на имена своих друзей или родных и закончи код.
                example_code: |
                    ```
                    # Подготовка игры:
                    игроки = Энн, Джон, Джесси
                    варианты = 1, 2, 3, 4, 5, 6
                    # Каждый игрок бросает кубик:
                    _ _ _ _
                        {print} игрок ' выбрасывает ' варианты {at} {random}
                        {sleep}
                    ```
                answer_code: |
                    ```
                    игроки = Энн, Джон, Джесси
                    варианты = 1, 2, 3, 4, 5, 6
                    {for} игрок {in} игроки
                        {print} игрок ' выбрасывает ' варианты {at} {random}
                        {sleep}
                    ```
            16:
                story_text: |
                    ### Упражнение
                    На этом уровне ты можешь создать небольшую игру, в которой нужно как можно скорее выбросить 6.
                    Мы уже начали писать код. Теперь твоя очередь сделать игру рабочей!

                    Сначала добавь цикл `{while}`, который проверяет, выпала ли уже шестёрка.
                    Пока шестёрка не выпала, бросай кубик, выбирая случайное число.
                    Используй {print}, чтобы показать результат броска.
                    Увеличивай счётчик попыток на один.
                    Подожди секунду перед следующим броском или, если выпала шестёрка, перед завершением игры.
                example_code: |
                    ```
                    варианты = [1, 2, 3, 4, 5, 6]
                    {print}('Выброси 6 как можно скорее!')
                    выпало = 0
                    попытки = 0
                    _
                    _
                    _
                    _
                    _
                    {print}('Ура! Тебе выпало 6. Число попыток: ', попытки, '.')
                    ```
                answer_code: |
                    ```
                    варианты = [1, 2, 3, 4, 5, 6]
                    {print}('Выброси 6 как можно скорее!')
                    выпало = 0
                    попытки = 0
                    {while} выпало == 0:
                        число = варианты[{random}]
                        попытки = попытки + 1
                        {if} число == 6:
                            выпало = 1
                            {print}('Тебе выпало 6! Число попыток: ', попытки, '!')
                        {else}:
                            {print}('Вместо шестёрки тебе выпало ', число)
                        {sleep} 1
                    ```
    dishes:
        name: Кто моет посуду?
        default_save_name: Посуда
        description: Пусть компьютер выберет, кто моет посуду
        levels:
            3:
                story_text: |
                    Вы дома всё время спорите, кто сегодня должен мыть посуду или менять наполнитель в кошачьем лотке?
                    Тогда доверь выбор компьютеру: он будет беспристрастным. На этом уровне ты можешь это запрограммировать!
                example_code: |
                    ```
                    people {is} мама, папа, Эмма, Софи
                    {print} people {at} {random} — сегодня моет посуду
                    ```
                story_text_2: |
                    ### Задание
                    Создай свою версию программы для выбора того, кто моет посуду. Сначала составь список членов своей семьи.
                    Затем придумай домашнее дело и позволь компьютеру выбрать исполнителя с помощью команды `{at} {random}`.

                    **Дополнительно** Не хочется мыть посуду? Перехитри программу: удали своё имя из списка командой `{remove}` `{from}`.
                answer_code: |-
                    ```
                    people is мама, папа, Эмма, Софи
                    name {is} {ask} как тебя зовут?
                    {remove} name {from} people
                    {print} people {at} {random} — сегодня моет посуду
                    ```
            5:
                story_text: |
                    С командой `{if}` выбор в программе становится ещё интереснее. Теперь программа может реагировать на выбор компьютера.
                    ### Задание
                    Дополни код так, чтобы программа писала «как жаль», когда наступает твоя очередь, а иначе — «ура».
                    Не забудь кавычки!
                example_code: |
                    ```
                    people {is} мама, папа, Эмма, Софи
                    dishwasher {is} people {at} {random}
                    _ dishwasher {is} Софи {print} _ как жаль, мне придётся мыть посуду _
                    _ {print} 'ура, посуду моет ' _ ' — можно отдохнуть'
                    ```
                answer_code: |
                    ```
                    people {is} мама, папа, Эмма, Софи
                    dishwasher {is} people {at} {random}
                    {if} dishwasher {is} Софи {print} 'как жаль, мне придётся мыть посуду'
                    {else} {print} 'ура, посуду моет ' dishwasher ' — можно отдохнуть'
                    ```
            7:
                story_text: |
                    Как часто каждый будет мыть посуду? Справедливо ли это? На этом уровне ты можешь это подсчитать.
                example_code: |
                    ```
                    people = мама, папа, Эмма, Софи
                    emma_washes = 0
                    dishwasher = people {at} {random}
                    {print} 'Сегодня посуду моет ' dishwasher
                    {if} dishwasher {is} Эмма
                    emma_washes = emma_washes + 1
                    {print} 'На этой неделе Эмма моет посуду: ' emma_washes ' раз'
                    ```

                    Теперь можешь несколько раз скопировать строки 3–6 (например, 7 раз — на целую неделю), чтобы подсчитать результат за неделю.
                    Сможешь написать код на всю неделю?
                story_text_2: |
                    Если совсем не повезёт, предыдущая программа может поручить тебе мыть посуду всю неделю! Это несправедливо!
                    Чтобы сделать выбор справедливее, удали выбранного человека из списка командой `{remove}`. Тогда тебе не придётся снова мыть посуду, пока каждый не сделает это по разу.

                    Код для понедельника и вторника уже готов! Можешь добавить остальные дни недели?
                    И… сможешь придумать, что делать, когда список опустеет?
                example_code_2: |
                    ```
                    people = мама, папа, Эмма, Софи
                    dishwasher = people {at} {random}
                    {print} 'В понедельник посуду моет: ' dishwasher
                    {remove} dishwasher {from} people
                    dishwasher = people {at} {random}
                    {print} 'Во вторник посуду моет: ' dishwasher
                    {remove} dishwasher {from} people
                    ```
                answer_code: |
                    ```
                    people = мама, папа, Эмма, Софи
                    dishwasher = people {at} {random}
                    {print} 'В понедельник посуду моет: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'Во вторник посуду моет: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'В среду посуду моет: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'В четверг посуду моет: ' dishwasher
                    {remove} dishwasher {from} people

                    people = мама, папа, Эмма, Софи
                    dishwasher = people {at} {random}
                    {print} 'В пятницу посуду моет: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'В субботу посуду моет: ' dishwasher
                    {remove} dishwasher {from} people

                    dishwasher = people {at} {random}
                    {print} 'В воскресенье посуду моет: ' dishwasher
                    {remove} dishwasher {from} people

                    ```
            8:
                story_text: |
                    Команда `{repeat}` позволяет повторять фрагменты кода. С её помощью можно выбрать, кто будет мыть посуду в течение нескольких дней!
                    ### Задание
                    С помощью команды `{repeat}` выбери, кто будет мыть посуду каждый день в течение недели. На месте каждого пропуска должна быть одна команда или число!
                    **Дополнительно** Какие ещё домашние дела ты знаешь? Измени код так, чтобы он распределял три домашних дела. Не забудь вывести на экран, о каких делах идёт речь!
                example_code: |
                    ```
                    people = мама, папа, Эмма, Софи
                    {repeat} _ _ {print} 'Посуду моет: ' _ _ _
                    ```
                answer_code: |
                    ```
                    people = мама, папа, Эмма, Софи
                    {repeat} 7 {times} {print} 'Посуду моет: ' people {at} {random}

                    #Дополнительно
                    {repeat} 7 {times} {print} 'С собакой гуляет: ' people {at} {random}
                    {repeat} 7 {times} {print} 'Мусор выносит: ' people {at} {random}
                    ```
            11:
                story_text: |
                    На этом уровне ты можешь легко составить расписание на целую неделю!

                    ### Задание
                    Добавь второе дело, например уборку пылесосом или наведение порядка, и распредели его на всю неделю.
                    <br> **Дополнительно** Программа не совсем справедлива: если не повезёт, придётся мыть посуду всю неделю. Как сделать её справедливее?
                example_code: |
                    ```
                    days = понедельник, вторник, среда, четверг, пятница, суббота, воскресенье
                    names = мама, папа, Эмма, Софи
                    {for} day {in} days
                        {print} names {at} {random} ' — моет посуду, день: ' day
                    ```
                answer_code: |
                    ```
                    days = понедельник, вторник, среда, четверг, пятница, суббота, воскресенье
                    names = мама, папа, Эмма, Софи

                    {for} day {in} days
                        {print} names {at} random ' — моет посуду, день: ' day

                    {for} day {in} days
                        {print} names {at} random ' — выносит мусор, день: ' day

                    ```
    elif_command:
        name: '{elif}'
        default_save_name: elif
        description: '{elif}'
        levels:
            6:
                story_text: |
                    На этом уровне ты можешь использовать новую команду: `{elif}`. `{elif}` — это сочетание команд `{else}` и `{if}`. Она пригодится, когда нужно сделать 3 варианта или даже больше!
                    ВНИМАНИЕ: теперь для {if}, {else} или {elif} нужны 2 строки. Одна строка — для команды {if} (например, `{if} имя {is} Hedy`), а вторая — для действия, которое выполнится при соблюдении условия (например, `{print} привет`).
                    Смотри!
                    ### Упражнение
                    Сделай своё колесо фортуны с разными призами и подходящими реакциями на каждый из них.
                example_code: |
                    ```
                    призы {is} миллион долларов, яблочный пирог, ничего
                    твой_приз {is} призы {at} {random}
                    {print} 'Твой выигрыш: ' твой_приз
                    {if} твой_приз {is} миллион долларов
                    {print} 'Ура! Теперь ты богач!'
                    {elif} твой_приз {is} яблочный пирог
                    {print} 'Здорово, яблочный пирог!'
                    {else}
                    {print} 'В следующий раз повезёт...'
                    ```
                answer_code: |
                    Свой вариант ответа
    for_command:
        name: '{for}'
        default_save_name: Цикл
        description: Команда {for}
        levels:
            11:
                story_text: |
                    ## Цикл for
                    На этом уровне мы познакомимся с новой командой — `{for}`. С помощью `{for}` можно создать список и перебрать все его элементы.
                    `{for}` создаёт блок, как `{repeat}` и `{if}`, поэтому каждую строку внутри блока нужно начинать с табуляции или 4 пробелов.
                example_code: |
                    ```
                    животные = собака, кошка, рыба-капля
                    {for} животное {in} животные
                        {print} 'Мне нравится: ' животное
                    ```
                story_text_2: |
                    ### Упражнение
                    Заверши этот код, добавив `{for} действие {in} действия` во вторую строку.
                example_code_2: |
                    ```
                    действия = хлопни в ладоши, топни ногой, крикни «Ура!»
                    _
                        {repeat} 2 {times}
                            {print} 'Если весело живётся, ' действие
                            {sleep} 2
                        {print} 'Если весело живётся, мы друг другу улыбнёмся'
                        {print} 'Если весело живётся, ' действие
                        {sleep} 3
                    ```
                answer_code: |
                    ```
                    действия = хлопни в ладоши, топни ногой, крикни «Ура!»
                    {for} действие {in} действия
                        {repeat} 2 {times}
                            {print} 'Если весело живётся, ' действие
                            {sleep} 2
                        {print} 'Если весело живётся, мы друг другу улыбнёмся'
                        {print} 'Если весело живётся, ' действие
                        {sleep} 3
                    ```
            14:
                story_text: |
                    Наконец, превратим `{repeat} 5 {times}` в настоящий код Python. Как и с `{if}`, понадобится двоеточие. Вот так:
                example_code: |
                    ```
                    {for} i {in} {range}(1,5):
                        {print}(i)
                    ```
                story_text_2: |
                    Помни: эта команда очень полезна и при работе со списками.
                    С помощью `{in} {range}` и переменной индекса можно сопоставить элементы двух списков.

                example_code_2: |
                    ```
                    друзья = ['Ахмед', 'Бен', 'Кайден']
                    счастливые_числа = [15, 18, 6]
                    {for} i {in} {range}(1, 3):
                        {print}('Имя: ', друзья[i], '. Счастливое число: ', счастливые_числа[i])
                    ```
                answer_code: |
                    Твой вариант ответа
    fortune:
        name: Предсказатель
        default_save_name: Гадалка
        description: Пусть Hedy предскажет будущее
        levels:
            1:
                story_text: |
                    Ты когда-нибудь бывал на ярмарке, где гадалка предсказывала будущее? Или играл с магическим шаром с ответами?
                    Тогда ты наверняка знаешь, что на самом деле будущее они не предсказывают, но играть всё равно весело!

                    На следующих уровнях ты научишься создавать собственную машину предсказаний!
                    На уровне 1 начни с простого: пусть Hedy представится гадалкой и повторит ответы игрока.
                    Вот так:
                example_code: |
                    ```
                    _ Привет, я гадалка Hedy!
                    _ Кто ты?
                    _ Дай заглянуть в мой хрустальный шар
                    _ Я вижу... Я вижу...
                    _ Тебя зовут _
                    ```
                story_text_2: |
                    ### Упражнение
                    Скопируй пример кода в редактор и заполни пропуски, чтобы программа заработала.
                    **Дополнительно** Измени код так, чтобы гадалка предсказывала не только твоё имя, но и возраст, любимую спортивную команду или что-нибудь ещё о тебе.
                answer_code: |
                    ```
                    {print} Привет, я гадалка Hedy!
                    {ask} Кто ты?
                    {print} Дай заглянуть в мой хрустальный шар
                    {print} Я вижу... Я вижу...
                    {print} Тебя зовут {answer}
                    {ask} Сколько тебе лет?
                    {print} Интересно
                    {print} Мой хрустальный шар говорит, что твой возраст — {answer}
                    {ask} Каким спортом ты занимаешься?
                    {print} Шар... Шар...
                    {print} Он говорит, какой у тебя любимый вид спорта...
                    {print} Он говорит, что твой вид спорта — {answer}
                    ```
            3:
                story_text: |
                    На предыдущих уровнях ты создал свою первую машину предсказаний, но Hedy ещё не могла ничего предсказать.
                    На этом уровне ты можешь использовать переменную и команду `{at} {random}`, чтобы Hedy действительно выбирала для тебя ответ. Посмотри, например, на этот код:
                example_code: |
                    ```
                    {print} Я гадалка Hedy!
                    question {is} {ask} Что ты хочешь узнать?
                    {print} Вот что ты хочешь узнать: question
                    answers {is} да, нет, может быть
                    {print} Мой хрустальный шар говорит...
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
                story_text_2: |
                    ### Упражнение
                    Пока Hedy может ответить только «да», «нет» или «может быть». Сможешь добавить другие варианты, например «точно» или «спроси ещё раз»?
                answer_code: |-
                    ```
                    {print} Я гадалка Hedy!
                    question {is} {ask} Что ты хочешь узнать?
                    {print} Вот что ты хочешь узнать: question
                    answers {is} да, нет, может быть, точно, я не знаю, попробуй ещё раз
                    {print} Мой хрустальный шар говорит...
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
            4:
                story_text: |
                    ### Упражнение
                    Мы убрали из этого примера все кавычки. Сможешь расставить их в нужных местах?

                    ### Упражнение 2
                    Вернись на предыдущий уровень и скопируй свой код гадалки. Добавь кавычки в нужных местах, чтобы код заработал на этом уровне.
                example_code: |
                    ```
                    # Добавь кавычки в этот код
                    {print} Я гадалка Hedy!
                    question {is} {ask} Что ты хочешь узнать?
                    {print} Твой вопрос:  question
                    answers {is} да, нет, может быть
                    {print} Мой хрустальный шар говорит...
                    {sleep} _
                    {print} answers {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} "Я гадалка Hedy!"
                    question {is} {ask} 'Что ты хочешь узнать?'
                    {print} 'Твой вопрос: '  question
                    answers {is} да, нет, может быть
                    {print} 'Мой хрустальный шар говорит...'
                    {sleep} 2
                    {print} answers {at} {random}
                    ```
            6:
                story_text: |
                    ### Упражнение
                    В примере показано, как создать программу-гадалку, которая всегда играет тебе на руку. Эта хитрая программа всегда предсказывает тебе выигрыш в лотерею, а твоим друзьям — проигрыш.

                    Используй её как основу для своей программы. Прояви фантазию! Например, можно предсказать, что:
                    * твоя любимая спортивная команда победит всех соперников!
                    * для киновечера выберут твой любимый фильм!
                    * ты выиграешь билеты на любимое шоу!
                    * ты всех на свете милее, как говорит волшебное зеркало в сказке о Белоснежке.
                    Дай волю воображению!

