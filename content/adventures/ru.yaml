            13:
                story_text: |
                    На математике тебе, возможно, уже встречались разные знаки сравнения. Например, знак «больше или равно».
                    В программировании они тоже есть, и мы называем их операторами.
                    Чтобы проверить, что первое число меньше второго или равно ему, используй `<=`, например: возраст `<=` 11.
                    Чтобы проверить, что первое число больше второго или равно ему, используй `>=`, например: очки `>=` 11.
                example_code: |
                    ```
                    рост = {input}('Какой у тебя рост в сантиметрах?')
                    {if} рост >= 160:
                        {print} ('Ура, ты уже достаточно высокий! Приятной поездки на американских горках!')
                    ```
