        levels:
            1:
                story_text: |
                    На этом уровне ты научишься играть мелодии с помощью команды `{play}`!

                    Напиши `{play}`, а затем ноту, которую хочешь сыграть. Ноты обозначаются буквами C-D-E-F-G-A-B.
                    Как видишь, букв всего 7, но сыграть можно гораздо больше семи нот.
                    Добавь после буквы цифру от 0 до 9, чтобы выбрать октаву. Например, после B4 идёт C5.
                    C0 — самая низкая нота, которую можно сыграть, а B9 — самая высокая.

                    ### Упражнение
                    Запусти пример кода, а потом поэкспериментируй с ним! Сможешь сочинить свою мелодию?
                    На следующем уровне ты научишься играть знакомые песни.
                example_code: |-
                    ```
                    {play} C4
                    {play} D4
                    {play} E4
                    {play} F4
                    {play} G4
                    {play} A4
                    {play} B4
                    {play} C5
                    ```
                answer_code: |
                    Твой вариант ответа
            2:
                story_text: |
                    ### Упражнение
                    Допиши мелодию русской народной песенки «Чижик-пыжик». Мы уже начали её первую музыкальную фразу.
                    Напомним: C — до, D — ре, E — ми, F — фа, G — соль, A — ля, B — си.
                example_code: |
                    ```
                    {print} Чижик-пыжик
                    {play} E5
                    {play} C5
                    {play} E5
                    {play} C5
                    ```
                story_text_2: |
                    С помощью команды `{sleep}` можно добавить между музыкальными фразами небольшую паузу.
                    Здесь первая фраза уже готова. Допиши вторую: после трёх нот G4 сыграй A4, B4 и три раза C5.
                example_code_2: |
                    ```
                    {print} Чижик-пыжик
                    {play} E5
                    {play} C5
                    {play} E5
                    {play} C5
                    {play} F5
                    {play} E5
                    {play} D5
                    {sleep} 1
                    {play} G4
                    {play} G4
                    ```
                answer_code: |
                    ```
                    {print} Чижик-пыжик
                    {play} E5
                    {play} C5
                    {play} E5
                    {play} C5
                    {play} F5
                    {play} E5
                    {play} D5
                    {sleep} 1
                    {play} G4
                    {play} G4
                    {play} G4
                    {play} A4
                    {play} B4
                    {play} C5
                    {play} C5
                    {play} C5
