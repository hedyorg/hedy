                    На предыдущих уровнях вы сделали вступление к игре «Дом с привидениями», но, как вы могли заметить, история всегда заканчивалась ужасно.
                    На этом уровне можно сделать историю более интерактивной, меняя исход игры: иногда вас съедят, иногда вы сбежите!
