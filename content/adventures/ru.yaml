    elif_command:
        levels:
            6:
                story_text: |
                    На этом уровне можно использовать новую команду: `{elif}`. `{elif}` — это комбинация команд `{else}` и `{if}`, нужная, когда требуется 3 (или больше!) варианта.
                    ПРИМЕЧАНИЕ: теперь при использовании {if}, {else} или {elif} нужно использовать 2 строки. 1 строка для команды {if} (например, `{if} имя {is} Хеди`) и одна строка для того, что произойдёт при выполнении условия (например, `{print} привет`).
                    Посмотрите!
                    ### Упражнение
                    Сделайте своё колесо фортуны, где можно выиграть разные призы и получить соответствующие реакции
                example_code: |
                    ```
                    призы {is} 1 миллион долларов, яблочный пирог, ничего
                    твой_приз {is} призы {at} {random}
                    {print} 'Ты выигрываешь ' твой_приз
                    {if} твой_приз {is} 1 миллион долларов
                    {print} 'Да! Ты богат!'
                    {elif} твой_приз {is} яблочный пирог
                    {print} 'Прекрасно, яблочный пирог!'
                    {else}
                    {print} 'Повезёт в следующий раз..'
                    ```
                answer_code: |
                    Свой ответ
