                    {for} обезьянка {in} обезьянки
                        {print} обезьянка " маленьких обезьянок прыгают на кровати."
                        {print} "Одна упала и ударилась головой."
                        {print} "Мама позвонила доктору, и доктор сказал:"
                        {print} "Больше никаких обезьянок, прыгающих на кровати!"
                        {print} ""
                    ```

                    Дополнительно
                    ```
                    животные = корова, свинья, курица
                    {for} животное {in} животные
                        {if} животное = 'корова'
                            нота = C4
