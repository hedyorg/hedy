                    {print} 'Я могу предсказать, выиграете ли вы завтра в лотерею!'
                    человек {is} {ask} 'Кто вы?'
                    хороший_ответ {is} Ура! Вы выиграли!, Вы точно выиграете!, У нас есть победитель!
                    плохой_ответ {is} Не повезло! Попробуйте ещё!, Выиграет кто-то другой, Вы проиграли!
                    {if} человек {in} друзья
