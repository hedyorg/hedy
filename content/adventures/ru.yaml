                    С помощью функций можно рисовать более сложные фигуры, используя меньше кода.
                    ### Упражнение 1
                    Заполни пропуски в функции так, чтобы получились три квадрата. Чтобы рисунок выглядел аккуратнее, сделай линии между квадратами белыми.

                    ### Упражнение 2
                    Код можно ещё сократить. Помести последние строки в `{repeat}`, чтобы рисунок остался прежним.

                    ### Упражнение 3
                    Создай свой рисунок из разных фигур.
                    Меняй и количество фигур с помощью `{repeat}`, и их форму в `{define}`.
                example_code: |
                    ```
                    # Создаём функцию для квадрата:
                    {define} square
                        {repeat} 4 {times}
                            {turn} _
                            {forward} _

                    # Рисуем три квадрата:
                    {call} square
                    {forward} 50
                    {call} square
                    {forward} 50
                    {call} square
                    ```
                answer_code: |
                    Упражнение 1
                    ```
                    {define} square
                        {repeat} 4 {times}
                            {turn} 90
                            {forward} 25

                    {call} square
                    {color} "white"
                    {forward} 50
                    {color} "black"
                    {call} square
                    {color} "white"
                    {forward} 50
                    {color} "black"
                    {call} square
                    ```

                    Упражнение 2
                    ```
                    {define} square
                        {repeat} 4 {times}
                            {turn} 90
                            {forward} 25

                    {call} square
                    {repeat} 2 {times}
                        {color} "white"
                        {forward} 50
                        {color} "black"
                        {call} square
                    ```

                    Упражнение 3
                    ```
                    {define} triangle
                        {repeat} 3 {times}
                            {turn} 120
                            {forward} 25

                    {call} triangle
                    {repeat} 2 {times}
                        {color} "white"
                        {forward} 50
                        {color} "black"
                        {call} triangle
                    ```
