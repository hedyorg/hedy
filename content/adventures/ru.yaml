            7:
                story_text: |
                    Наши медсёстры и медбратья следят за водным балансом пациентов. Водный баланс — это количество жидкости, полученной за день с питьём, едой или через капельницу, минус количество жидкости, потерянной с мочой или при рвоте.
                    Водный баланс должен оставаться положительным. Если он отрицательный, нужно ввести пациенту больше жидкости через капельницу.
                    Поможешь создать инструмент для расчёта водного баланса пациентов?
                    ### Упражнение
                    Программа должна:
                    * Спросить, сколько жидкости пациент получил за день с питьём
                    * Спросить, сколько жидкости он получил за день с едой
                    * Спросить, сколько жидкости он получил за день через капельницу
                    * Спросить, сколько жидкости он потерял за день с мочой
                    * Спросить, сколько жидкости он потерял за день при рвоте
                    * Рассчитать и показать водный баланс пациента
                    * Предложить проверить, положительный баланс или отрицательный, чтобы решить, нужна ли пациенту сегодня дополнительная жидкость через капельницу
                answer_code: |
                    ```
                    intake_drinking = {ask} 'Сколько жидкости пациент получил с питьём?'
                    intake_eating = {ask} 'Сколько жидкости пациент получил с едой?'
                    intake_IV = {ask} 'Сколько жидкости пациент получил через капельницу?'
                    discharge_urine = {ask} 'Сколько жидкости пациент потерял с мочой?'
                    discharge_vomit = {ask} 'Сколько жидкости пациент потерял при рвоте?'
                    fluid_balance = intake_drinking + intake_eating + intake_IV - discharge_urine - discharge_vomit
                    {print} 'Водный баланс пациента: ' fluid_balance
                    {print} 'Проверь, положительный баланс или отрицательный, чтобы решить, нужна ли пациенту сегодня дополнительная жидкость через капельницу'
                    ```
            8:
                story_text: |
                    Наши пациенты иногда забывают принимать лекарства, что может серьёзно навредить здоровью. Чтобы они принимали все назначенные таблетки, мы выдаём им будильник, который подаёт сигнал каждый раз, когда пора принять лекарство.
                    Поможешь создать такой будильник?

                    ### Упражнение
                    Программа должна:

                    #Часть 1. Настройки для медсестры или медбрата
                    * Сначала дать возможность указать имя пациента
                    * Затем запросить количество таблеток для первого приёма (8 утра), второго (полдень) и последнего (4 часа дня)
                    * Поблагодарить и предложить передать будильник пациенту. Через две секунды после этого сообщения очистить экран.

                    #Часть 2. Первый приём
                    * Поздороваться с пациентом по имени и объяснить, что будильник подаст сигнал, когда пора принять лекарство
                    * Подать сигнал 3 раза
                    * Сообщить, что сейчас 8 утра и пора принять первую порцию таблеток
                    * Спросить «Ты уже принял таблетку?» столько раз, сколько таблеток нужно принять в первый раз
                    * Сообщить, что все таблетки первого приёма приняты, и через 2 секунды очистить экран

                    #Часть 3. Второй приём
                    * Подождать 4 секунды (в действительности это было бы 4 часа)
                    * Подать сигнал и повторить те же действия, что и при первом приёме

                    #Часть 4. Последний приём
                    * Подождать 4 секунды (в действительности — 4 часа)
                    * Подать сигнал для последнего приёма за день
                answer_code: |
                    ```
                    #Настройки для медсестры или медбрата
                    {print} 'Доброе утро! Введи данные пациента. '
                    name {is} {ask} 'Как зовут пациента?'
                    first_dose {is} {ask} 'Сколько таблеток принимает ' name ' в 8 утра?'
                    second_dose {is} {ask} 'Сколько таблеток принимает ' name ' в полдень?'
                    last_dose {is} {ask} 'Сколько таблеток принимает ' name ' в 4 часа дня?'
                    {print} 'Спасибо! Теперь можно передать будильник пациенту.'
                    {sleep} 2
                    {clear}

                    #Первый приём
                    {print} 'Привет, ' name '! Я буду напоминать тебе о лекарствах. Когда пора их принять, я подам сигнал.'
                    {repeat} 3 {times} {play} C4
                    {print} 'Сейчас 8 утра, пора принять первую порцию таблеток'
                    {repeat} first_dose {times} pill {is} {ask} 'Ты уже принял таблетку?'
                    {print} 'Все таблетки первого приёма приняты, ' name
                    {sleep} 2
                    {clear}

                    #Второй приём
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} 'Сейчас полдень, пора принять вторую порцию таблеток'
                    {repeat} second_dose {times} pill {is} {ask} 'Ты уже принял таблетку?'
                    {print} 'Все таблетки второго приёма приняты, ' name
                    {sleep} 2
                    {clear}

                    #Последний приём
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} 'Сейчас 4 часа дня, пора принять последнюю порцию таблеток'
                    {repeat} last_dose {times} pill {is} {ask} 'Ты уже принял таблетку?'
                    {print} 'Все таблетки на сегодня приняты, ' name
                    {sleep} 2
                    {clear}
                    ```
