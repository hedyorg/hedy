            6:
                story_text: |
                    С помощью `{elif}` можно играть разные ноты в разных ситуациях. Например, если человек радуется, можно сыграть для него весёлую ноту.
                    ### Упражнение
                    Сначала добавь грустную ноту, а затем придумай ещё хотя бы 2 мелодии для других настроений.
