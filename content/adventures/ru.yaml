                answer_code: |
                    ```
                    {print} 'Цифровая копилка'
                    желание = {ask} 'Что бы вы хотели купить?'
                    цена = {ask} 'Сколько это стоит?'
                    накоплено = {ask} 'Сколько денег вы уже накопили?'
                    карманные = {ask} 'Сколько карманных денег вы получаете в неделю?'
                    нужно_накопить = цена - накоплено
