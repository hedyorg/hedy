            5:
                story_text: |
                    ## Если... иначе...
                    На уровне 5 появляется кое-что новое — `{if}`! С помощью `{if}` ты можешь выбрать один из двух вариантов.
                    Этот код выводит «здорово», если ввести имя Hedy, и «бу!», если ввести что-то другое.
                    `{ask}` и `{print}` работают так же, как на уровне 4.
                example_code: |
                    ```
                    имя {is} {ask} 'Как тебя зовут?'
                    {if} имя {is} Hedy {print} 'здорово' {else} {print} 'бу!'
                    ```
                story_text_2: |
                    Иногда код с `{if}` получается очень длинным и не помещается в строку. <br> Его можно разделить на две строки, начав вторую с `{else}`, вот так:
                example_code_2: |
                    ```
                    имя {is} {ask} 'Как тебя зовут?'
                    {if} имя {is} Hedy {print} 'здорово'
                    {else} {print} 'бу!'
                    ```
                story_text_3: |
                    ### Задание
                    Попробуй написать свой код с `{if}` и `{else}`. Если хочешь, можешь использовать пример.
                example_code_3: |
                    ```
                    ответ {is} {ask} '2 + 2 = ?'
                    _ _ _ 4 _ 'Отлично!'
                    _ _ 'Нет, 2 + 2 = 4'
                    ```
                answer_code: |
                    ```
                    ответ {is} {ask} '2 + 2 = ?'
                    {if} ответ {is} 4 {print} 'Отлично!'
                    {else} {print} 'Нет, 2 + 2 = 4'
                    ```
