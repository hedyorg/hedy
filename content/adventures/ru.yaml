                    _ Let me take a look in my crystal ball
                    _ I see... I see...
                    _ Your name is _
                    ```
                story_text_2: |
                    ### Упражнение
                    Скопируйте пример кода в поле ввода и заполните пропуски, чтобы код заработал.
                    **Дополнительно** Измените код так, чтобы гадалка предсказывала не только ваше имя, но и возраст, любимую спортивную команду или что-то ещё о вас.
