            16:
                story_text: |
                    ### Упражнение
                    На этом уровне можно создать небольшую игру, в которой нужно как можно быстрее выбросить 6.
                    Мы начали код, а вам нужно заставить игру работать!

                    Сначала добавьте цикл `{while}`, который проверяет, выпала ли 6.
                    Пока 6 не выпала, бросайте кубик на случайное число.
                    {print}, что выбросил игрок.
                    Увеличивайте счётчик попыток.
                    Подождите секунду перед следующим броском или — если выпала 6 — перед окончанием игры.
                example_code: |
                    ```
                    варианты = [1, 2, 3, 4, 5, 6]
                    {print}('Брось 6 как можно быстрее!')
                    выброшено = 0
                    попытки = 0
                    _
                    _
                    _
                    _
                    _
                    {print}('Да! Ты выбросил 6 за ', попытки, ' попыток.')
                    ```
                answer_code: |
                    ```
                    варианты = [1, 2, 3, 4, 5, 6]
                    {print}('Брось 6 как можно быстрее!')
                    выброшено = 0
                    попытки = 0
                    {while} выброшено == 0:
                        число = варианты[{random}]
                        попытки = попытки + 1
                        {if} число = 6:
                            выброшено = 1
