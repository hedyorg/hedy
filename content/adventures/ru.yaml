    repeat_command:
        levels:
            8:
                story_text: |
                    На этом уровне добавляется команда `{repeat}`. `{repeat}` можно использовать, чтобы выполнить одну строку кода несколько раз. Вот так:

                    ### Упражнение
                    Поиграйте с командой `{repeat}`. Сможете теперь записать песню «С днём рождения» всего в 3 строки вместо 4?
                example_code: |
                    ```
                    {repeat} 3 {times} {print} 'Хеди — это весело!'
                    ```
                answer_code: |
                    ```
                    {repeat} 2 {times} {print} 'с днём рождения тебя'
                    {print} 'с днём рождения, дорогая Хеди'
                    {print} 'с днём рождения тебя'
                    ```
            9:
                story_text: |
                    На этом уровне можно повторять несколько строк кода всего одной командой `{repeat}`.
                    Для этого нужно создать блок строк, которые хотите повторить.
                    Строки в этом блоке должны иметь **отступ**.
                    То есть в начале каждой строки нужна табуляция или 4 пробела. Отступ нужен и тогда, когда блок состоит всего из одной строки.
                example_code: |
                    ```
                    {repeat} 5 {times}
                        {print} 'Привет всем'
                        {print} 'Всё это повторяется 5 раз'
                    ```
                answer_code: |
                    ```
                    {print} 'Знаешь ли ты человека с маффинами?'
                    {repeat} 2 times
                        {print} 'Человека с маффинами'
                    {print} 'Знаешь ли ты человека с маффинами, что живёт на Друри-лейн?'
                    ```
            10:
                story_text: |
                    Отличная работа! Вы дошли до нового уровня! На предыдущем уровне вы научились использовать несколько строк кода в команде `{if}` или `{repeat}`.
                    Но пока нельзя было их сочетать...

                    Хорошие новости! На этом уровне можно помещать `{if}` внутрь `{if}`, `{repeat}` внутрь `{repeat}` и друг в друга.
                    Попробуйте!
                example_code: |
                    ```
                    {repeat} 3 {times}
                        заказ = {ask} 'Что бы вы хотели заказать?'
                        {if} заказ {is} пицца
                            {print} 'Ням-ням'
                        {else}
                            {print} 'пицца лучше!'
                    ```
                answer_code: |
                    Свой ответ
        name: '{repeat}'
        default_save_name: repeat_command
        description: команда {repeat}
    repeat_command_2:
        levels:
            8:
                story_text: |
                    ## Повторение с другими командами и переменными
                    Вы потренировали команду `{repeat}` в сочетании с командой `{print}`, но знали ли вы, что с `{repeat}` можно использовать и другие команды?
                    В этом примере кода видно, что `{repeat}` можно использовать и с командой `{ask}`, `{if}` или `{else}`.
                example_code: |
                    ```
                    {repeat} 2 {times} ответ = {ask} 'Знали ли вы, что вопрос можно задавать несколько раз?'
                    {if} ответ {is} да
                    {repeat} 2 {times} {print} 'Вы это уже знали!'
                    {else}
                    {repeat} 3 {times} {print} 'Вы узнали что-то новое!'
                    ```
                story_text_2: |
                    Ещё одна интересная возможность команды `{repeat}` — задавать количество повторений с помощью переменной. В примере кода сначала спрашиваем возраст человека.
                    Затем в строке 3 вопрос повторяется «возраст» раз. То есть переменная «возраст» использована с командой `{repeat}`.
                example_code_2: |
                    ```
                    {print} 'Ура! У тебя день рождения!'
                    возраст = {ask} 'Сколько тебе лет сейчас?'
                    {repeat} возраст {times} {print} 'Гип-гип-ура!'
                    ```
                answer_code: |
                    Свой ответ
            9:
                story_text: |
                    ### В блоке или нет?
                    На этом уровне нужно внимательно продумать, какие строки кода должны быть в блоке, а какие нет.
                    Например, если нужно спеть песню *человек с маффинами*. Повторять дважды нужно только строку с «человек с маффинами».
                    Это значит, что последняя строка не должна начинаться с отступа, так как она не относится к блоку.
                    Если начать последнюю строку с отступа, песня получится неправильной.

                    ### Упражнение
                    Каждая строка в примере кода начинается с пробела. Уберите пробелы и попробуйте понять, какая строка нуждается в отступе, а какая нет, чтобы получилась песня про человека с маффинами.
                example_code: |
                    ```
                    _ {print} 'Знаешь ли ты человека с маффинами?'
                    _ {repeat} 2 {times}
                    _ {print} 'Человека с маффинами'
                    _ {print} 'Знаешь ли ты человека с маффинами, что живёт на Друри-лейн?'
                    ```
                answer_code: |
                    ```
                    {print} 'Знаешь ли ты человека с маффинами?'
                    {repeat} 2 {times}
                        {print} 'Человека с маффинами'
                    {print} 'Знаешь ли ты человека с маффинами, что живёт на Друри-лейн?'
                    ```
        name: '{repeat} 2'
        default_save_name: repeat_command_2
        description: команда {repeat} 2
    restaurant:
        name: Ресторан
        default_save_name: Ресторан
        description: Создайте свой собственный виртуальный ресторан
        levels:
            1:
                story_text: |
                    На первом уровне вы сможете создать свой собственный виртуальный ресторан и принимать заказы гостей.
