                    {play} G4
                    {play} A4
                    {play} B4
                    {play} C5
                    {play} C5
                    {play} C5
                    ```

            5:
                story_text: |
                    Необязательно играть целую песню с помощью команды `{play}`: иногда нужна всего одна нота.
                    Например, в викторине можно играть весёлую высокую ноту, если ответ правильный, и грустную низкую, если ответ неверный.

                    ### Упражнение
                    Дополни первый вопрос строкой кода, которая играет ноту C3 при неверном ответе.
                    Затем придумай ещё 3 вопроса для этой викторины.
                example_code: |
                    ```
                    ответ {is} {ask} 'Как называется столица Зимбабве?'
