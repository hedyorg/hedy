                    Команда `{forward}` рисует линию вперёд. Число после неё определяет, как далеко пройдёт черепаха. `{turn} {right}` поворачивает её на четверть оборота по часовой стрелке, а `{turn} {left}` — против часовой стрелки.

                    Чтобы пойти назад, используй команду `{forward}` с отрицательным числом. Например, `{forward} -100`
                example_code: |
                    ```
                    {forward} 100
                    {turn} {left}
                    ```
                story_text_2: |
                    ### Упражнение
