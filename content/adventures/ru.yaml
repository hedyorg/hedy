        levels:
            4:
                story_text: |-
                    Сделай генератор монстров. Задай игроку вопросы о том, каким должен быть его монстр, а затем создай историю по ответам.

                    ### Упражнение
                    * Придумай ещё хотя бы 5 вопросов о монстре.
                    * Сделай экран «загрузки»: покажи надпись «Создаём монстра...» на 3 секунды, а затем очисти экран.
                    * Допиши историю, используя новые переменные.
                example_code: |-
                    ```
                    # Приветствие и вопросы
                    {print} 'Добро пожаловать в генератор монстров!'
                    имя_монстра {is} {ask} 'Как зовут твоего монстра?'
                    описание_монстра {is} {ask} 'Каким словом ты опишешь своего монстра?'
                    цвет_глаз {is} {ask} 'Какого цвета глаза у твоего монстра?'
                    число_глаз {is} {ask} 'Сколько глаз у твоего монстра?'
                    _ Добавь сюда ещё вопросы _

                    # Создание монстра
                    _ Сделай экран загрузки _

                    # История о монстре
                    {print} 'Это монстр ' имя_монстра '. Вот какой он: ' описание_монстра
                    {print} 'У монстра по имени ' имя_монстра ' глаза цвета ' цвет_глаз '. Число глаз: ' число_глаз
                    _ Допиши историю, используя новые переменные _
                    ```
                answer_code: |-
                    ```
                    # Приветствие и вопросы
                    {print} 'Добро пожаловать в генератор монстров!'
                    имя_монстра {is} {ask} 'Как зовут твоего монстра?'
                    описание_монстра {is} {ask} 'Каким словом ты опишешь своего монстра?'
                    цвет_глаз {is} {ask} 'Какого цвета глаза у твоего монстра?'
                    число_глаз {is} {ask} 'Сколько глаз у твоего монстра?'
                    число_зубов {is} {ask} 'Сколько зубов у монстра?'
                    форма_носа {is} {ask} 'Какой формы у него нос?'
                    рост_монстра {is} {ask} 'Какой у монстра рост?'
                    ширина_монстра {is} {ask} 'Какой ширины монстр?'
                    покров {is} {ask} 'Чем покрыт монстр? Чешуёй, шерстью, перьями или чем-то ещё?'

                    # Создание монстра
                    {print} 'Создаём монстра...'
                    {sleep} 3
                    {clear}

                    # История о монстре
                    {print} 'Это монстр ' имя_монстра '. Вот какой он: ' описание_монстра
                    {print} 'У монстра по имени ' имя_монстра ' глаза цвета ' цвет_глаз '. Число глаз: ' число_глаз
                    {print} 'У него во рту зубы. Их число: ' число_зубов '.'
                    {print} 'А нюхает он носом вот такой формы: ' форма_носа '.'
                    {print} 'Рост монстра по имени ' имя_монстра ': ' рост_монстра ', ширина: ' ширина_монстра '.'
                    {print} 'С головы до ног монстр покрыт вот чем: ' покров
                    ```
    music:
        name: Музыка
        default_save_name: Музыка
