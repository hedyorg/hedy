    if_command:
        levels:
            5:
                story_text: |
                    ## If... else....
                    На уровне 5 есть кое-что новое — `{if}`! С помощью `{if}` можно выбирать между двумя разными вариантами.
                    Этот код выводит nice, если ввести имя Хеди, и boo!, если ввести что-то другое.
                    `{ask}` и `{print}` по-прежнему работают как на уровне 4.
                example_code: |
                    ```
                    имя {is} {ask} 'как тебя зовут?'
                    {if} имя {is} Хеди {print} 'мило' {else} {print} 'бу!'
                    ```
                story_text_2: |
                    Иногда код с `{if}` получается очень длинным и плохо помещается в строку. <br> Можно также разделить код на две строки, начиная вторую строку с `{else}`, вот так:
                example_code_2: |
                    ```
                    имя {is} {ask} 'как тебя зовут?'
                    {if} имя {is} Хеди {print} 'мило'
                    {else} {print} 'бу!'
                    ```
                story_text_3: |
                    ### Упражнение
                    Попробуйте создать свой код с `{if}` и `{else}`. При желании можно использовать пример кода.
                example_code_3: |
                    ```
                    ответ {is} {ask} '2 + 2 = ?'
                    _ _ _ 4 _ 'Молодец!'
                    _ _ 'Нет, 2 + 2 = 4'
                    ```
                answer_code: |
                    ```
                    ответ {is} {ask} '2 + 2 = ?'
                    {if} ответ {is} 4 {print} 'Молодец!'
                    {else} {print} 'Нет, 2 + 2 = 4'
                    ```
            9:
                story_text: |
