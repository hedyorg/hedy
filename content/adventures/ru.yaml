                    new_word {is} {ask} 'Какому слову вы хотите их научить?'
                    {add} new_word {to_list} words
                    said_word {is} words {at} {random}
                    {print} '🧒 Скажи новое_слово, Хеди!'
                    {print} '🦜 ' said_word
                    _ said_word {is} new_word _ '🧒 Отличная работа, Хеди! 🍪'
                    _ _ '🧒 Нет, Хеди! Скажи новое_слово
                    ```
                answer_code: |
                    ```
