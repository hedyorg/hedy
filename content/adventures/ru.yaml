            2:
                story_text: |
                    Ещё одна новая команда на этом уровне — `{sleep}`. Она приостанавливает программу на секунду. Если после команды `{sleep}` написать число, программа остановится на указанное количество секунд.

                    ### Упражнение
                    Потренируйся с новой командой: напиши свою программу, в которой команда `{sleep}` используется хотя бы 3 раза. У каждой команды `{sleep}` длительность паузы должна быть разной.
                example_code: |
                    ```
                    {print} Мой любимый цвет...
                    {sleep} 2
                    {print} зелёный!
                    ```
                answer_code: |
                    ```
                    {print} И победителем становится...
                    {sleep} 2
                    {print} Мария!
                    {print} Она выиграла...
                    {sleep} 1
                    {print} новенькую Феррари!
                    {print} И это ещё не всё!
                    {print} Ещё она получает...
                    {sleep} 5
                    {print} поездку во Францию!
                    ```
