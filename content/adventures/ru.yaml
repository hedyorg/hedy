adventures:
    story:
        name: История
        default_save_name: История
        description: Придумай небольшую историю
        levels:
            1:
                story_text: |
                    На уровне 1 ты можешь создать историю с главным героем, которого выберешь сам.

                    В первой строке используй `{ask}` и спроси, кто будет главным героем истории. Затем используй {answer}, когда захочешь вставить имя героя.

                example_code: |
                    ```
                    {ask} Кто главный герой этой истории?
                    {print} {answer} собирается погулять по лесу
                    {print} Немного дрожа от страха, {answer} идёт дальше
                    {print} {answer} слышит странные звуки со всех сторон
                    {print} Кажется, это лес с привидениями
                    ```
                story_text_2: |
                    ### Упражнение
                    Теперь придумай свою историю как минимум из 6 строк кода.
                    Она должна отличаться от истории в примере.
                    Используй хотя бы один `{ask}` и один `{answer}`.
                    Тему можешь выбрать любую.
                    Если ничего не приходит в голову, вот несколько идей: поход в кино, спортивный матч или день в зоопарке.
                answer_code: |
                    ```
                    {print} Однажды я ходил в зоопарк
                    {ask} Какое животное я увидел первым?
                    {print} Первым я увидел {answer}
                    {print} Потом я увидел пингвина
                    {print} Он обедал
                    {ask} Что ел пингвин?
                    {print} Пингвин ел {answer} на обед
                    ```
            2:
                story_text: |
                    На уровне 2 ты можешь сделать свою историю ещё интереснее. Теперь имя главного героя может стоять в любом месте предложения.

                    Правда, для этого придётся добавить немного кода. Сначала нужно сохранить имя главного героя в переменной.

                    Затем это имя можно вставить в любое место предложения.
                example_code: |-
                    ```
                    имя {is} {ask} Как зовут главного героя?
                    {print} имя собирается побегать по лесу
                    {print} имя немного боится
                    {print} Вдруг раздаётся странный звук...
                    {sleep}
                    {print} имя боится, что это лес с привидениями
                    ```
                story_text_2: |
                    ### Упражнение
                    Пора добавить переменные в историю, которую ты придумал на прошлом уровне.
                    Открой своё приключение с историей на уровне 1 и скопируй код. Вставь его в редактор кода на этом уровне.

                    Пока этот код здесь не работает: в нём ещё нет переменных.
                    Исправь его, используя переменные и `{is}` вместе с командой `{ask}`, как ты научился на этом уровне.

                    **Дополнительно** Добавь команду `{sleep}`, чтобы создать напряжение в истории.
                answer_code: |
                    ```
                    {print} Однажды я ходил в зоопарк
                    первое_животное {is} {ask} Какое животное я увидел первым?
                    {print} Первым я увидел первое_животное
                    {print} Потом я увидел пингвина
                    {print} Он обедал
                    еда {is} {ask} Что ел пингвин?
                    {print} Пингвин ел...
                    {sleep} 3
                    {print} еда
                    ```
            3:
                story_text: |
                    На уровне 3 ты можешь сделать свою историю ещё увлекательнее. Пусть монстр, животное или другое препятствие выбирается случайно. Например, вот так:
                example_code: |
                    ```
                    животные {is} 🦔, 🐿, 🦉, 🦇
                    {print} Теперь слышны звуки животные {at} {random}
                    ```
                story_text_2: |
                    Команда `{add}` тоже может пригодиться в твоей истории.
                example_code_2: |
                    ```
                    {print} Раздаётся какой-то звук
                    животные {is} 🐿, 🦔, 🦇, 🦉
                    животное {is} {ask} Как ты думаешь, кто это?
                    {add} животное {to_list} животные
                    {print} Это животные {at} {random}
                    ```
                story_text_3: |
                    Вот пример использования команды `{remove}` в истории.

                    ### Упражнение
                    Скопируй свою историю с предыдущих уровней на этот уровень.
                    Здесь ты узнал 3 новые команды: `{at} {random}`, `{add} {to_list}` и `{remove} {from}`.
                    Добавь в историю новые строки кода, чтобы каждая из этих команд встретилась хотя бы один раз.
                example_code_3: |
                    ```
                    {print} Его рюкзак стал слишком тяжёлым.
                    {print} Внутри лежали бутылка воды, фонарик и кирпич.
                    рюкзак {is} вода, фонарик, кирпич
                    лишнее {is} {ask} Какой предмет ему выложить?
                    {remove} лишнее {from} рюкзак
                    ```
                answer_code: |
                    ```
                    животные {is} лев, зебра, фламинго
                    {print} Привет, ребята! Сегодня мы идём в зоопарк!
                    любимое_животное {is} {ask} Какое животное ты хочешь увидеть сегодня?
                    {add} любимое_животное {to_list} животные
                    {sleep} 2
                    {print} Пойдём к животному: животные {at} {random}
                    {sleep}
                    нелюбимое_животное {is} {ask} Какое животное ты не хочешь видеть?
                    {remove} нелюбимое_животное {from} животные
                    {print} А теперь пойдём к животному: животные {at} {random} !
                    ```
            4:
                story_text: |
                    ### Упражнение
                    Скопируй пример кода и заполни пропуски в строках 1 и 2 кавычками.
                    Пропуски в строках 3 и 4 нужно заменить не кавычками, а командами `{sleep}` и `{clear}`. Получится запустить программу?

                    ### Упражнение 2
                    Вернись на предыдущий уровень и скопируй код своей истории. Добавь кавычки в нужных местах, чтобы код заработал на этом уровне.
                    Помни: переменные в твоей истории должны оставаться за пределами кавычек. Как во второй строке примера: там переменная имя стоит вне кавычек.
                example_code: |
                    ```
                    имя {is} {ask} _ Как тебя зовут? _
                    {print} _ Главного героя зовут _ имя
                    _
                    _
                    {print} имя _ собирается погулять по лесу _
                    {print} имя _ немного боится _
                    животные {is} 🦔, 🐿, 🦉, 🦇
                    {print} _ Слышны звуки _ животные {at} {random}
                    {print} имя _ боится, что это лес с привидениями _
                    ```
                answer_code: |
                    ```
                    имя {is} {ask} 'Как тебя зовут?'
                    {print} 'Главного героя зовут ' имя
                    {print} имя ' собирается погулять по лесу'
                    {print} имя ' немного боится'
                    животные {is} 🦔, 🐿, 🦉, 🦇
                    {print} 'Слышны звуки ' животные {at} {random}
                    {print} имя ' боится, что это лес с привидениями'
                    ```
            5:
                story_text: |
                    На этом уровне ты можешь запрограммировать разные концовки, чтобы история стала ещё интереснее.
                    В примере показано, как сделать 2 разные концовки.

                    ### Упражнение 1
                    Напиши новую короткую историю как минимум из 6 строк кода на любую тему.
                    Нет идей? Выбери одну из этих тем: супергерой, скучный день в школе, жизнь на необитаемом острове.

                    Теперь дай игроку возможность выбрать счастливую или грустную концовку, как в примере.
                    Запрограммируй обе концовки.

                    ### Упражнение 2
                    Скопируй историю, которую ты создал в своём приключении на предыдущих уровнях.
                    Найди способ добавить в неё хотя бы 2 команды `{if}` и `{else}`.
                    Можно сделать счастливую и грустную концовки или придумать другое применение этим командам.
                example_code: |
                    ```
                    имя {is} {ask} 'Кто гуляет по лесу?'
                    {print} имя ' идёт по лесу'
                    {print} имя ' встречает монстра'
                    конец {is} {ask} 'Какой будет конец: счастливый или грустный?'
                    {if} конец {is} счастливый {print} имя ' достаёт меч, и монстр быстро убегает'
                    {else} {print} 'Монстр съедает героя по имени ' имя
                    ```
                answer_code: |
                    ```
                    имя {is} {ask} 'Как зовут супергероя?'
                    {print} 'О нет, самолёт падает! Кто нас спасёт?'
                    {print} 'Смотри, кто летит по небу! Это ' имя
                    конец {is} {ask} 'Что ты выберешь: спасти самолёт или разрушить его?'
                    {if} конец {is} спасти {print} имя ' сажает самолёт! Мы спасены!'
                    {else} {print} 'О нет! ' имя ' разрушает самолёт! Помогите!'
                    ```
            6:
                story_text: |-
                    Теперь, когда ты умеешь использовать `{elif}`, твоя история может стать ещё более интерактивной! Например, можно придумать нескольких персонажей с разными способностями.
                    А можно предложить игроку выбрать дорогу, дверь или волшебное зелье...

                    ### Упражнение
                    Придумай свою историю с 3 или более вариантами выбора, используя `{elif}`.
                example_code: |
                    ```
                    персонаж {is} {ask} 'Кто поможет тебе в приключении?'
                    {if} персонаж {is} 'Дейзи'
                    {print} 'Ты выбираешь Дейзи! Она умнее всех!'
                    {elif} персонаж {is} 'Джейсон'
                    {print} 'Ты выбираешь Джейсона! Он сильнее всех!'
                    {elif} персонаж {is} 'Сэм'
                    {print} 'Ты выбираешь Сэма! Сэм быстрее всех!'
                    ```
                answer_code: |
                    Свой вариант ответа
            8:
                story_text: |
                    В историях персонажи иногда повторяют одни и те же слова. Например, когда зовут на помощь или поют песню.
                    На этом уровне ты можешь добавить такие повторы в историю с помощью `{repeat}`.

                    ### Упражнение
                    Добавь повторение в свою историю. Открой сохранённые программы, выбери историю с предыдущего уровня,
                    найди строку с `{print}` и повтори её!
                example_code: |
                    ```
                    {print} 'Принц всё звал на помощь'
                    {repeat} 5 {times} {print} 'Помогите!'
                    {print} 'Почему никто мне не помогает?'
                    ```
                answer_code: |
                    {print} 'Все дети хотели в зоопарк и без конца кричали об этом!'
                    {repeat} 3 {times} {print} 'Пойдём в зоопарк!'
            9:
                story_text: |
                    На этом уровне в командах `{if}` можно использовать несколько строк. Так ты сможешь сделать счастливую и грустную концовки ещё интереснее!

                    ### Упражнение 1
                    В примере показаны две концовки: в одной герои успевают прыгнуть в машину времени, а в другой — нет.
                    Заполни пропуски, добавив хотя бы одно предложение к каждой концовке.
                    **Дополнительно** Сделай историю длиннее. Что в ней происходит? Можно добавить второй `{ask}` с другими вариантами выбора.

                    ### Упражнение 2
                    Открой сохранённые программы и выбери свою историю с уровня 5. Теперь напиши счастливую и грустную концовки длиной не менее трёх строк каждая!
                example_code: |
                    ```
                    {print} 'О НЕТ! Тираннозавр приближается!'
                    конец = {ask} 'Какой будет конец: счастливый или грустный?'
                    # Счастливая концовка истории:
                    {if} конец {is} счастливый
                        {print} 'Ричард в последний момент прыгает обратно в машину времени!'
                        {print} _
                    # Грустная концовка истории:
                    {else}
                        {print} 'О нет! Ричард не успевает...'
                        {print} _
                    ```
                answer_code: |
                    ```
                    {print} 'О НЕТ! Тираннозавр приближается!'
                    конец = {ask} 'Какой будет конец: счастливый или грустный?'
                    {if} конец {is} счастливый
                        {print} 'Ричард в последний момент прыгает обратно в машину времени!'
                        {print} 'Уф, хорошо, что мы успели'
                        {print} 'Ещё бы секунда — и было бы поздно'
                    {else}
                        {print} 'О нет! Ричард не успевает...'
                        {print} 'Тираннозавр издаёт оглушительный РЁВ'
                        {print} 'Он открывает пасть и проглатывает Ричарда целиком'
                    ```
            10:
                story_text: |
                    На этом уровне ты можешь использовать команды `{if}` и `{repeat}` внутри других команд `{if}` и `{repeat}`.
                    Это даёт много возможностей и помогает сделать историю интерактивной.

                    ### Упражнение 1
                    Дополни код так, чтобы `{if}` работал правильно.

                    ### Упражнение 2
                    Добавь `{if}` и `{else}` и в ту часть истории, где Робин идёт домой.

                    ### Упражнение 3
                    Вернись к своей истории с уровня 8 и используй хотя бы два `{if}` внутри другого `{if}`.
                example_code: |
                    ```
                    {print} 'Робин гуляет по центру города'
                    место = {ask} 'Куда идёт Робин: в магазин или домой?'
                    {if} место {is} магазин
                        {print} 'Она заходит в магазин.'
                        {print} 'Робин замечает интересную книгу'
                        книга = {ask} 'Робин покупает книгу?'
                        {if} книга {is} да
                        _ {print} 'Робин покупает книгу и идёт домой'
                        _ {else}
                        _ {print} 'Робин выходит из магазина и идёт домой'
                    {else}
                        {print} 'Робин идёт домой'
                    ```
                story_text_2: |
                    С командами `{and}` и `{or}` твои истории станут разнообразнее. Можно задать несколько вопросов и реагировать на сочетание ответов.

                    ### Упражнение 1
                    Посмотри на пример кода и дополни его. Затем добавь ещё хотя бы 2 команды `{if}` с `{and}` или `{or}`.

                    ### Упражнение 2
                    Найди историю с предыдущего уровня и добавь в неё один `{and}` или `{or}`.
                example_code_2: |
                    ```
                    {print} 'Наша героиня идёт по лесу'
                    {print} 'Тропинка раздваивается'
                    путь = {ask} 'Куда ей пойти: налево или направо?'
                    оружие = {ask} 'Какое оружие она достаёт?'
                    {if} путь {is} налево {and} оружие {is} меч
                        _
                    ```
                answer_code: |
                    ```
                    {print} 'Робин гуляет по центру города'
                    место = {ask} 'Куда идёт Робин: в магазин или домой?'
                    {if} место {is} магазин
                        {print} 'Она заходит в магазин.'
                        {print} 'Робин замечает интересную книгу'
                        книга = {ask} 'Робин покупает книгу?'
                        {if} книга {is} да
                            {print} 'Робин покупает книгу и идёт домой'
                        {else}
                            {print} 'Робин выходит из магазина и идёт домой'
                    {else}
                        {print} 'Робин идёт домой'
                        мороженое = {ask} 'Она зайдёт за мороженым по дороге домой?'
                        {if} мороженое {is} да
                            {print} 'Сначала Робин заходит за мороженым'
                            {print} 'Она выбирает лимонный сорбет'
                            {print} 'Как вкусно!'
                        {else}
                            {print} 'Она идёт прямо домой'
                    ```
                answer_code_2: |
                    ```
                    {print} 'Наша героиня идёт по лесу'
                    {print} 'Тропинка раздваивается'
                    путь = {ask} 'Куда ей пойти: налево или направо?'
                    оружие = {ask} 'Какое оружие она достаёт?'

                    {if} путь {is} налево {and} оружие {is} меч
                        {print} 'Ни один монстр не осмеливается подойти к героине.'

                    {if} путь {is} налево {and} оружие {is} рогатка
                        {print} 'На героиню нападает совомедведь.'

                    {if} путь {is} направо {or} оружие {is} 'книга заклинаний'
                        {print} 'К героине подходит таинственный волшебник.'
                    ```
            11:
                story_text: |
                    На этом уровне ты можешь использовать команду `{for}` в своей истории. Например, с ней легко запрограммировать детскую книгу «Бурый мишка, бурый мишка, что ты видишь?».

                    ### Упражнение

                    Прочитай <a href="https://fliphtml5.com/jmlya/nquy">историю</a>, если ещё её не знаешь, и сделай так, чтобы текст выводился как в книге.
                example_code: |
                    ```
                    животные = _ , _ , _
                    {print} 'Бурый мишка, бурый мишка'
                    {print} 'Что ты видишь?'
                    ```
                answer_code: |
                    ```
                    животные = красная птица, жёлтая утка, синяя лошадь, зелёная лягушка, фиолетовая кошка, белая собака, чёрная овца, золотая рыбка, учительница
                    {print} 'Бурый мишка, бурый мишка'
                    {print} 'Что ты видишь?'
                    {for} животное {in} животные
                        {print} 'На меня смотрит ' животное
                        {print} животное ', ' животное
                        {print} 'Что ты видишь?'
                    {print} 'На меня смотрят дети'
                    {print} 'Дети, дети'
                    {print} 'Что вы видите?'
                    {print} 'Мы видим:'
                    {for} животное {in} животные
                        {print} животное
                    {print} 'Все они смотрят на нас'
                    {print} 'Вот что мы видим!'
                    ```
            13:
                story_text: |
                    Сейчас мы напечатаем историю. В команде `{print}` теперь нужны скобки.

                    ### Упражнение
                    Придумай историю как минимум из 5 предложений. Сначала используй в ней переменную `имя`. Затем создай ещё две переменные и тоже используй их.
                    Совет: не забывай про запятые между текстом и переменными в `{print}`!
                example_code: |
                    ```
                    имя = _
                    {print}('Добро пожаловать в эту историю!')
                    ```
                answer_code: |
                    ```
                    имя = 'Hedy'
                    {print}('Добро пожаловать в эту историю!')
                    {print}('Жил-был попугай по имени ', имя, '.')
                    {print}(имя, ' очень любил программировать!')
                    {print}('К сожалению, остальные попугаи не умели программировать.')
                    {print}('Однажды ', имя, ' решил научить остальных попугаев программированию.')
                    {print}('Уроки пользовались огромным успехом у остальных попугаев!')
                    ```
            16:
                story_text: |
                    Цикл `{while}` может сделать твои истории интереснее. Например, можно использовать `{while} игра == 'идёт'`, чтобы играть, пока игра не закончится.
                    Или можно использовать `{while} меч == 'потерян'`, чтобы игрок не мог продолжить, пока не найдёт нужный предмет.

                    ### Упражнение
                    В примере показано, как использовать цикл `{while}` в истории. Теперь **придумай свою ситуацию**, в которой игроку нужно что-то найти, прежде чем продолжить.
                example_code: |
                    ```
                    ключи = 'потеряны'
                    {print}('Ты стоишь в саду и никак не можешь найти ключи.')
