    functions:
        name: Функции
        default_save_name: Функции
        description: Функции
        levels:
            12:
                story_text: |
                    На этом уровне ты научишься использовать **функции**. Функция — это блок кода, который легко использовать несколько раз. Функции помогают объединять части кода, которые нужны снова и снова.
                    Чтобы создать функцию, напиши `{define}` и дай функции имя. Затем запиши все нужные строки в блоке с отступом под строкой с `{define}`.
                    Оставь в коде пустую строку, чтобы его было удобнее читать. Отлично! Ты создал функцию!

                    Теперь, когда нам понадобится этот блок кода, мы просто вызовем функцию по имени! Не нужно вводить весь блок заново.

                    Посмотри на пример кода для игры «Твистер». Функция next_turn выбирает, какую руку или ногу куда поставить.

                    ### Упражнение
                    Закончи код, задав две переменные: `chosen_limb` и `chosen_color`.
                    Затем выбери, сколько раз вызвать функцию, то есть прокрутить стрелку «Твистера».

                    ### Упражнение 2
                    Улучши код, добавив переменную players. С её помощью выдавай отдельную команду каждому игроку.
                    Например: «Ахмед, левая рука, цвет: зелёный» или «Джессика, правая нога, цвет: жёлтый».
                example_code: |
                    ```
                    # Задаём варианты для «Твистера»:
                    sides = 'левая', 'правая'
                    limbs = 'рука', 'нога'
                    colors = 'красный', 'синий', 'зелёный', 'жёлтый'

                    # Описываем один ход в «Твистере»:
                    {define} next_turn
                        chosen_side = sides {at} {random}
                        chosen_limb = limbs _
                        chosen_color = colors _
                        {print} chosen_side ' ' chosen_limb ', цвет: ' chosen_color

                    # Играем в «Твистер»:
                    {print} 'Давай сыграем в «Твистер»!'
                    {repeat} _ _
                        вызвать next_turn
                        {sleep} 2
                    ```
                answer_code: |
                    ```
                    sides = 'левая', 'правая'
                    limbs = 'рука', 'нога'
                    colors = 'красный', 'синий', 'зелёный', 'жёлтый'
                    players = 'Ахмед', 'Джессика'

                    {define} next_turn
                        {for} player {in} players
                            chosen_side = sides {at} {random}
                            chosen_limb = limbs {at} {random}
                            chosen_color = colors {at} {random}
                            {print} player ', твой ход: ' chosen_side ' ' chosen_limb ', цвет: ' chosen_color
                            {sleep} 2

                    {print} 'Давай сыграем в «Твистер»!'
                    {call} next_turn
                    ```
            15:
                story_text: |
                    На уровне 12 ты познакомился с функциями. Внутри функции ты записываешь часть кода.
                    Когда ты вызываешь функцию, выполняется весь код внутри неё. Очень удобно, если нужно повторять один и тот же код!

                    На этом уровне мы продолжим работу с функциями и покажем, как сделать их ещё полезнее.
                    Начнём писать их в стиле Python: теперь используем `{def}` и добавляем `():` после имени функции.
                    Чтобы вызвать функцию, просто напиши её имя и (), как в примере.

                    ### Упражнение
                    Добавь функцию, которая играет грустную мелодию (например, C6-C5-C4), и вызывай её, когда дан неправильный ответ.
                example_code: |
                    ```
                    # Описываем весёлую и грустную мелодии:
                    {def} play_happy_tune():
                        {play} C4
                        {play} C5
                        {play} C6

                    # Задаём вопросы:
                    ответ = {input}('Сколько будет 2 + 2?')
                    {if} ответ == 4:
                        {print}('Правильно!')
                        play_happy_tune()
                    {else}:
                        {print}('Неправильно!')
                    ```
                answer_code: |-
                    ```
                    {def} play_happy_tune():
                        {play} C4
                        {play} C5
                        {play} C6

                    {def} play_sad_tune():
                        {play} C6
                        {play} C5
                        {play} C4

                    ответ = {input}('Сколько будет 2 + 2?')
                    {if} ответ == 4:
                        {print}('Правильно!')
                        play_happy_tune()
                    {else}:
                        {print}('Неправильно!')
                        play_sad_tune()
                    ```
    functions_2:
        name: Функции с аргументами
        default_save_name: Функции 2
        description: Функции 2
        levels:
            15:
                story_text: |
                    Теперь, когда ты умеешь пользоваться функциями, пора научиться передавать им аргументы.
                    **Аргумент** — это значение, которое передают функции при вызове. Внутри функции оно доступно через переменную-параметр; эта переменная не используется за пределами функции.

                    Например, в этом коде мы создали функцию с параметром `город`, чтобы приветствовать разные города в песне о путешествии.
                    В примере используется параметр `город`. Это переменная, доступная только внутри функции, в которую передаётся аргумент.
                    Вместо прежней записи с `{define} song` здесь используется синтаксис Python: параметр `город` указан после имени функции в круглых скобках `{def} song(город)`.
                    При вызове функции компьютер заменяет `город` текстом, который мы передали в скобках.

                    ### Упражнение
                    Допиши похожую песню о лесных зверятах!
                    Пусть функция принимает параметр `подарок` и выводит:
                    «Что в подарок принесёшь? Я несу » и название подарка.
                    Вызови функцию для трёх подарков: ягодку, грибочек, ягодку.
                    А в конце выведи строку: «Заходи скорее в дом!»
                example_code: |
                    ```
                    {def} song(город):
                        {print}('Мы поедем, мы помчимся в ', город)

                    song('Сочи')
                    song('Питер')
                    song('Сочи')
                    ```
                answer_code: |
                    ```
                    {define} song(подарок):
                        {print}('Что в подарок принесёшь? Я несу ', подарок)

                    song('ягодку')
                    song('грибочек')
                    song('ягодку')
                    {print}('Заходи скорее в дом!')
                    ```
    functions_3:
