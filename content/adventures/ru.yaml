                    Если гость заказывает пиццу, Hedy не должна спрашивать, какой соус он хочет.

                    **Дополнительно** В ресторане есть не все соусы. Составь список доступных соусов и при каждом заказе сообщай, есть ли нужный соус в меню. <br>
