            7:
                story_text: |
                    На этом уровне ты можешь использовать вычисления, чтобы посчитать общую стоимость заказа гостя и сделать виртуальный ресторан более реалистичным.
                    Но можно добавить в ресторан и многое другое, например новые блюда.

                    ### Упражнение
                    В свой виртуальный ресторан можно добавить ещё много интересного. Например, сможешь ли ты...
                    - спросить, сколько будет гостей, и умножить цену на это число?
                    - добавить ещё одно блюдо?
                    - сделать скидку для тех, кто введёт (секретный) промокод?
                    - добавить детское меню?
                    - придумать что-нибудь ещё?
                example_code: |
                    Можно написать простой код ресторана, например такой:
                    ```
                    #Приветствуем гостя:
                    {print} 'Добро пожаловать в ресторан Chez Hedy'
                    {print} 'Вот наше меню:'
                    {print} 'Наши основные блюда: пицца, лазанья и спагетти'
                    main = {ask} 'Какое основное блюдо хочешь заказать?'
                    #Считаем стоимость:
                    price = 0
                    {if} main {is} пицца
                    price = 10
                    {if} main {is} лазанья
                    price = 12
                    {if} main {is} спагетти
                    price = 8
                    #Сообщаем гостю стоимость:
                    {print} 'Твой заказ: ' main
                    {print} 'С тебя ' price ' долларов'
                    {print} 'Спасибо, приятного аппетита!'
                    ```
                answer_code: |
                    ```
                    {print} 'Добро пожаловать в ресторан Chez Hedy'
                    {print} 'Вот наше меню:'
                    {print} 'Наши основные блюда: пицца, лазанья и спагетти'
                    main = {ask} 'Какое основное блюдо хочешь заказать?'
                    price = 0
                    {if} main {is} пицца
                    price = 10
                    {if} main {is} лазанья
                    price = 12
                    {if} main {is} спагетти
                    price = 8
                    {print} 'Твой заказ: ' main
                    amount = {ask} 'На сколько человек ты хочешь это заказать?'
                    correct_discount = Hedy
                    given_discount = {ask} 'Введи промокод, если знаешь его'
                    {if} given_discount {is} correct_discount
                    price = price / 2
                    {else}
                    {print} 'Неверный промокод!'
