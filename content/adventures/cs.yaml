            10:
                story_text: "V této úrovni můžeš pomocí vnoření vytvořit ještě skutečnější a zábavnější restauraci!\n\n### Cvičení\nZ ukázkového kódu zmizelo odsazení.\nZjistíš, kolik mezer potřebuje každý řádek, aby kód správně fungoval?\nKdyž si zákazník objedná pizzu, Hedy se nemá ptát, jakou chce omáčku.\n\n**Navíc** Restaurace nemá všechny omáčky. Vytvoř seznam dostupných omáček a u každé objednávky odpověz, jestli ji nabízíš. <br>\n**Navíc** Na pizzu patří různé přísady. Zeptej se zákazníků, co si přejí.<br>\n**Navíc** Chtějí zákazníci něco k pití? Zeptej se i na to! <br>\n"
