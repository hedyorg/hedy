            7:
                story_text: |
                    Naše zdravotní sestry a bratři sledují bilanci tekutin pacientů. Bilance tekutin je množství tekutin, které pacient za den přijal (pitím, jídlem nebo infuzí), minus množství tekutin, které za den ztratil (močením nebo zvracením).
                    Bilance tekutin musí zůstat kladná. Pokud je záporná, musí sestra nebo bratr podat infuzí další tekutiny.
                    Pomůžeš jim nástrojem pro výpočet bilance tekutin pacienta?
                    ### Cvičení
                    Program má:
                    * zeptat se, kolik tekutin pacient za den přijal pitím;
                    * zeptat se, kolik tekutin za den přijal jídlem;
                    * zeptat se, kolik tekutin za den přijal infuzí;
                    * zeptat se, kolik tekutin za den ztratil močením;
                    * zeptat se, kolik tekutin za den ztratil zvracením;
                    * vypočítat bilanci tekutin pacienta a vypsat ji sestře nebo bratrovi;
                    * vyzvat ke kontrole, zda je bilance kladná nebo záporná, a k rozhodnutí, jestli pacient dnes potřebuje infuzí další tekutiny.
                answer_code: |
                    ```
                    příjem_pitím = {ask} 'Kolik tekutin pacient přijal pitím?'
                    příjem_jídlem = {ask} 'Kolik tekutin pacient přijal jídlem?'
                    příjem_infuzí = {ask} 'Kolik tekutin pacient přijal infuzí?'
                    ztráta_močením = {ask} 'Kolik tekutin pacient ztratil močením?'
                    ztráta_zvracením = {ask} 'Kolik tekutin pacient ztratil zvracením?'
                    bilance_tekutin = příjem_pitím + příjem_jídlem + příjem_infuzí - ztráta_močením - ztráta_zvracením
                    {print} "Bilance tekutin pacienta je " bilance_tekutin
                    {print} 'Zkontroluj prosím, zda je bilance kladná nebo záporná, a rozhodni podle toho, jestli pacient dnes potřebuje infuzí další tekutiny.'
                    ```
            8:
                story_text: |
                    Naši pacienti někdy zapomenou užít léky, což může způsobit vážné zdravotní problémy. Aby užili všechny předepsané tablety, dáváme jim budík, který pípne pokaždé, když je čas na léky.
                    Pomůžeš vytvořit takový budík?

                    ### Cvičení
                    Program má:

                    # Část 1: Nastavení pro sestru nebo bratra
                    * Umožnit zadat jméno pacienta.
                    * Zeptat se na počet tablet v první dávce v 8:00, druhé v poledne a poslední v 16:00.
                    * Poděkovat a vyzvat k předání budíku pacientovi. Po 2 sekundách vymazat obrazovku.

                    # Část 2: První dávka
                    * Přivítat pacienta s uvedením jména a vysvětlit, že budík pípá, když je čas na léky.
                    * Třikrát pípnout.
                    * Oznámit 8:00 a čas první dávky.
                    * Zeptat se na užití tablety tolikrát, kolik tablet je v první dávce.
                    * Oznámit pacientovi, že užil celou první dávku a po 2 sekundách vymazat obrazovku.

                    # Část 3: Druhá dávka
                    * Počkat 4 sekundy (v reálném rozvrhu by to byly 4 hodiny).
                    * Zopakovat připomínání pro druhou dávku.

                    # Část 4: Poslední dávka
                    * Počkat 4 sekundy (v reálném rozvrhu 4 hodiny).
                    * Připomenout poslední dávku dne.
                answer_code: |-
                    ```
                    # Nastavení pro ošetřující personál
                    {print} 'Dobré ráno. Zadej správné údaje pacienta. '
                    jméno {is} {ask} 'Jak se tento pacient jmenuje?'
                    první_dávka {is} {ask} 'Počet tablet pro ' jméno ', první dávka v 8:00?'
                    druhá_dávka {is} {ask} 'Počet tablet pro ' jméno ', druhá dávka v poledne?'
                    poslední_dávka {is} {ask} 'Počet tablet pro ' jméno ', poslední dávka v 16:00?'
                    {print} 'Děkuji, teď můžeš připomínač předat pacientovi.'
                    {sleep} 2
                    {clear}

                    # První dávka
                    {print} 'Ahoj. Jméno: ' jméno '. Jsem tvůj připomínač léků. Pípnu, až na ně bude čas.'
                    {repeat} 3 {times} {play} C4
                    {print} "Je 8:00, čas první dávky"
                    {repeat} první_dávka {times} tableta {is} {ask} 'Je tableta užitá?'
                    {print} 'Celá první dávka je užitá. Jméno: ' jméno
                    {sleep} 2
                    {clear}

                    # Druhá dávka
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "Je poledne, čas druhé dávky"
                    {repeat} druhá_dávka {times} tableta {is} {ask} 'Je tableta užitá?'
                    {print} 'Celá druhá dávka je užitá. Jméno: ' jméno
                    {sleep} 2
                    {clear}

                    # Poslední dávka
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "Je 16:00, čas poslední dávky"
                    {repeat} poslední_dávka {times} tableta {is} {ask} 'Je tableta užitá?'
                    {print} 'Všechny dnešní tablety jsou užité. Jméno: ' jméno
                    {sleep} 2
                    {clear}
                    ```
