                example_code: "```\n# Doplň do kódu uvozovky\n{print} Vítej v restauraci Chez Hedy!\n{print} Dnes podáváme pizzu nebo lasagne.\njídlo {is} {ask} Co si dáš k jídlu?\n{print} Skvělá volba! Můj favorit: jídlo!\npřísada {is} {ask} Přeješ si k tomu maso, nebo zeleninu?\n{print} Objednávka: jídlo, doplněk: přísada už se chystá!\nnápoje {is} {ask} Co si k tomu dáš k pití?\n{print} Děkuji za objednávku.\n{print} Objednané jídlo a pití tu budou hned: jídlo, nápoje\n{sleep} _\n{print} Tvoje jídlo je hotové! Tady ho máš!\n```\n"
