            12:
                story_text: |
                    ### Cvičení
                    Nakresli se želvou stejné obrázky!

                    Nejprve definuj funkci **pro každý tvar**, který chceš použít na náramku. Potom tvary přidávej na náramek takto:

                    Program pro návrh náramku <img src="https://github.com/hedyorg/hedy/assets/80678586/549d7f3a-c492-4b4a-b173-746eb3400951" width="500">
                example_code: |
                    Nápověda k programu pro návrh náramku
                    ```
                    # Funkce pro různé tvary:
                    {define} nakresli_čtverec
                    _

                    # Kreslení začátku náramku:
                    {color} {white}
                    {turn} -90
                    {forward} 300
                    {turn} 180

                    # Kreslení tvarů na náramku:
                    {repeat} 5 {times}
                        {color} {gray}
                        {forward} 100
                        tvar = {ask} 'Jaký tvar chceš mít na náramku jako další?'
                        vybraná_barva = {ask} 'Jakou barvou?'
                        {color} vybraná_barva
                        {if} tvar = 'čtverec'
                            {call} nakresli_čtverec
                    ```
                answer_code: |
                    Náramek
                    ```
                    # Definice všech tvarů
                    {define} nakresli_čtverec
                        {repeat} 4 {times}
                            {turn} 90
                            {forward} 30

                    {define} nakresli_trojúhelník
                        {repeat} 3 {times}
                            {turn} 120
                            {forward} 30

                    {define} nakresli_hvězdu
                        {repeat} 5 {times}
                            {turn} 144
                            {forward} 30

                    # Začátek na levé straně obrazovky
                    {color} 'white'
                    {turn} -90
                    {forward} 300
                    {turn} 180

                    # Kreslení náramku
                    {repeat} 5 {times}
                        {color} 'gray'
                        {forward} 100
                        tvar = {ask} 'Jaký tvar chceš mít na náramku jako další?'
                        vybraná_barva = {ask} 'Jakou barvou?'
                        {color} vybraná_barva
                        {if} tvar = 'čtverec'
                            {call} nakresli_čtverec
                        {elif} tvar = 'trojúhelník'
                            {call} nakresli_trojúhelník
                        {elif} tvar = "hvězda"
                            {call} nakresli_hvězdu
                    {color} 'gray'
                    {forward} 100
                    ```
            15:
                story_text: |
                    ### Cvičení
                    Napiš program, který se hráče zeptá na počet stran obrazce a potom ho nakreslí.
                    Obrazec na obrázku vznikne, když hráč zadá 10.

                    <div class="w-full flex flex-row gap-2">
                     <img src="https://github.com/hedyorg/hedy/assets/80678586/ee32f40e-dea1-4e7c-a813-3ef63671254b" width="300">
                     <img src="https://github.com/hedyorg/hedy/assets/80678586/3621bf77-527d-41e8-a44f-c5a21bb4ffd2" width="200">
                    </div>
                example_code: |
                    ```
                    {def} vypočti_úhel(počet_stran):
                        úhel = 360 / _
                        _ úhel

                    {def} nakresli_obrazec(úhel, počet_stran):
                        {for} i {in} {range} _
                            {forward} 70
                            {turn} _

                    počet_stran = {input}('Kolik stran má mít obrazec?')
