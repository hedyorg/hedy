            15:
                story_text: "### Cvičení 2\n**Tohle je druhá část dobrodružství.** Začátek najdeš v předchozím dobrodružství.\nPrůměr samozřejmě nemusí být vždy ze 4 testů. Možná chceš průměr z 10 testů nebo jen ze 2...\nProblém vyřešíme přidáním argumentu a proměnné počet_testů.\n* Na řádku 3 začni nový řádek. Nastav argument počet_testů otázkou, kolik testů má žák za sebou.\n* Na řádku 4 nahraď 4 novým argumentem počet_testů.\n* Nakonec na řádku 6 nahraď 4 za počet_testů.\n\nVyzkoušej nový program. Funguje?\n\n### Cvičení 3\nChceš program ještě vylepšit? Skvělé! Zatím počítá průměrnou známku jen z 1 předmětu. Bylo by ale lepší spočítat ji ze všech předmětů, které chceš!\nNeřekneme ti, jak na to. Máme jen jednu radu: první řádek začni takto: `{def} spočítej_průměrnou_známku(předmět):`.\n"
                example_code: "```\n# Použij vlastní kód z předchozího dobrodružství.\n```\n"
                answer_code: |
                    Cvičení 2
                    ```
                    {def} spočítej_průměrnou_známku():
                        součet = 0
                        počet_testů = {input}("Kolik testů máš?")
                        {for} i {in} {range} (1, počet_testů):
                            známka = {input}("Jakou známku máš z testu ", i, '?')
                            součet = součet + známka
                        {return} součet / počet_testů

