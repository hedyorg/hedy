            7:
                story_text: "V této úrovni můžeš pomocí výpočtů zjistit celkovou cenu objednávky. Tvoje virtuální restaurace tak bude ještě skutečnější.\nPřidat ale můžeš i spoustu dalších věcí, třeba více chodů.\n\n### Cvičení\nCo dalšího do své restaurace přidáš? Dokážeš třeba…\n- zeptat se, kolik lidí přijde, a vynásobit cenu tímto počtem?\n- přidat další chod?\n- dát lidem slevu po zadání (tajného) slevového kódu?\n- přidat dětské menu?\n- vymyslet něco dalšího pro zábavu?\n"
                example_code: "Jednoduchý kód restaurace může vypadat třeba takto:\n```\n# Přivítání zákazníka:\n{print} 'Vítej v restauraci Chez Hedy'\n{print} 'Tady je jídelní lístek:'\n{print} 'Naše hlavní jídla: pizza, lasagne nebo špagety'\nhlavní_jídlo = {ask} 'Které hlavní jídlo si dáš?'\n# Výpočet ceny:\ncena = 0\n{if} hlavní_jídlo {is} pizza\ncena = 10\n{if} hlavní_jídlo {is} lasagne\ncena = 12\n{if} hlavní_jídlo {is} špagety\ncena = 8\n# Sdělení ceny zákazníkovi:\n{print} 'Tvoje objednávka: ' hlavní_jídlo\n{print} 'Cena v dolarech: ' cena\n{print} 'Děkuji a dobrou chuť!'\n```\n"
                answer_code: |
                    ```
                    {print} 'Vítej v restauraci Chez Hedy'
                    {print} 'Tady je jídelní lístek:'
                    {print} 'Naše hlavní jídla: pizza, lasagne nebo špagety'
                    hlavní_jídlo = {ask} 'Které hlavní jídlo si dáš?'
                    cena = 0
                    {if} hlavní_jídlo {is} pizza
                    cena = 10
                    {if} hlavní_jídlo {is} lasagne
                    cena = 12
                    {if} hlavní_jídlo {is} špagety
                    cena = 8
                    {print} 'Tvoje objednávka: ' hlavní_jídlo
                    počet = {ask} 'Pro kolik lidí to objednáváš?'
                    správný_kód = Hedy
                    zadaný_kód = {ask} 'Pokud znáš slevový kód, napiš ho sem'
                    {if} zadaný_kód {is} správný_kód
                    cena = cena / 2
                    {else}
                    {print} 'Chybný kód!'
                    {print} 'Cena v dolarech: ' cena * počet
                    {print} 'Děkuji a dobrou chuť!'
                    ```
