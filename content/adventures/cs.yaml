            14:
                story_text: |
                    Pracovníci úklidu a údržby mají dlouhý seznam úkolů. Některé se dělají denně, jiné v určitý den týdne, datum nebo roční období. V tom zmatku se na něco zapomíná.
                    Pomůžeš programem, který vypíše správný seznam úkolů pro daný den?
                    ### Cvičení
                    Program má:
                    * popřát dobré ráno;
                    * zeptat se na den týdne, měsíc a den v měsíci;
                    * vypsat správný seznam úkolů.
                    Potřebné úkoly:
                    * každý den: vytřít podlahu, umýt toalety, roztáhnout závěsy;
                    * v pondělí a ve čtvrtek: zalít rostliny;
                    * v úterý a v pátek: vytřít podlahy;
                    * v sobotu: umýt kávovar;
                    * prvního v měsíci: umýt okna;
                    * sedmého v měsíci: doplnit prodejní automaty;
                    * čtrnáctého v měsíci: zkontrolovat baterie požárních hlásičů;
                    * každý den v zimních měsících: zapnout topení;
                    * každý den v letních měsících: zapnout klimatizaci.
                answer_code: |
                    ```
                    {print}("Dobré ráno, údržbáři")

                    #dotaz na datum
                    den = {input}("Který je den v týdnu?")
                    aktuální_měsíc = {input}("Který je měsíc?")
                    datum = {input}("Kolikátého je?")

                    #výpis seznamu úkolů
                    print("Údržbáři, tvoje dnešní úkoly jsou: ")

                    #výběr úkolů podle dne v týdnu
                    {if} den == "pondělí" {or} den == "čtvrtek":
                        {print}("zalít rostliny")
                    {elif} den == "úterý" {or} den == "pátek":
                        {print}("vytřít podlahy")
                    {elif} den == "sobota":
                        {print}("umýt kávovar")

                    #výběr úkolů podle dne v měsíci
                    {if} datum == 1:
                        {print}("umýt okna")
                    {elif} datum == 7:
                        {print}("doplnit prodejní automaty")
                    {elif} datum == 14:
                        {print}("zkontrolovat baterie požárních hlásičů")

                    #seznam letních a zimních měsíců
                    letní_měsíce = ["duben", "květen", "červen", "červenec", "srpen", "září"]
                    zimní_měsíce = ["říjen", "listopad", "prosinec", "leden", "únor", "březen"]

                    #výběr úkolů podle letních a zimních měsíců
                    {for} měsíc {in} letní_měsíce:
                        {if} aktuální_měsíc == měsíc:
                            {print}("zapnout klimatizaci")
                    {for} měsíc {in} zimní_měsíce:
                        {if} aktuální_měsíc == měsíc:
                            {print}("zapnout topení")
                    ```
            15:
                story_text: |
                    Po operaci mohou pacienti někdy cítit silnou bolest. V takových případech mohou dostat morfinovou pumpu. Pokud je něco bolí, mohou si sami podat trochu morfinu.
                    Tyto pumpy je třeba naprogramovat velmi pečlivě, aby si pacienti nepodali příliš mnoho morfinu. Dokážeš pro nás morfinovou pumpu naprogramovat?
                    ### Cvičení
                    Program má:
                    * zeptat se sestry nebo bratra, kolik mililitrů morfinu už pacient dnes dostal;
                    * vyzvat sestru nebo bratra, aby přístroj předali pacientovi;
                    * zeptat se pacienta, jak silnou bolest cítí na stupnici do 10;
                    * vyzvat pacienta, aby stiskl tlačítko x, pokud chce další morfin;
                    * po stisknutí x zavolat funkci spusť_pumpu s argumenty míra_bolesti a množství_morfinu;
                    * ve funkci vypisovat zprávu Dostaneš dalších 20 ml morfinu, dokud je míra bolesti alespoň 6 a množství morfinu menší než 120;
                    * po podání dalšího morfinu počkat 2 minuty (při testování programu můžeš použít 2 sekundy);
                    * po těchto 2 minutách aktualizovat množství morfinu (+20 ml) a novou otázkou zjistit, jak se pacient teď cítí;
                    * pokud je množství morfinu příliš vysoké nebo už pacient nemá bolesti, oznámit, že další morfin nedostane; při silné bolesti vyzvat k přivolání sestry nebo bratra;
                    * oznámit, že se pumpa vypne a pro její další spuštění je třeba znovu stisknout x.
                answer_code: |-
                    ```
                    {print}('Morfinová pumpa')
                    množství_morfinu = {input}('Kolik ml morfinu už dnes pacient dostal?')
                    {print}('Teď prosím předej tento přístroj pacientovi')

                    míra_bolesti = {input}('Jak silnou bolest cítíš na stupnici od 1 do 10?')
                    {print}('Pro podání morfinu stiskni X')

                    {define} morfin(míra_bolesti, množství_morfinu):
                        {print}('Dostaneš dalších 20 ml morfinu')
                        {sleep} 2
                        množství_morfinu = množství_morfinu + 20
                        míra_bolesti = {input}('Jak silnou bolest cítíš na stupnici od 1 do 10?')
                        {print}('Pumpa se teď vypne')
                        {return} množství_morfinu
                        {return} míra_bolesti
                        {sleep} 2

                    {for} i {in} {range} (1,10):
                        čekání_na_x = {input}('Pro podání morfinu stiskni X')
                        {if} čekání_na_x == 'x'
                            {if} míra_bolesti >= 6 {and} množství_morfinu <120:
                                množství_morfinu = morfin(míra_bolesti, množství_morfinu)
                                míra_bolesti = morfin(míra_bolesti, množství_morfinu)
                            {else}:
                                {print}('Teď by nebylo bezpečné podat další morfin')
                                {print}('Pokud máš příliš silnou bolest, přivolej prosím zdravotní sestru')
                    ```
            16:
                story_text: |
                    Studenti medicíny se učí latinské názvy částí těla, ale pletou se jim a učení je nudí.
                    Vytvoříš hru, ve které si je procvičí?
                    Potřebná slovíčka: corpus = tělo, caput = hlava, ocolus = oko, nasus = nos, auris = ucho, os = ústa, collum = krk, manus = ruka, pectus = hrudník, humerus = rameno, venter = břicho, tergum = záda.
                    ### Cvičení
                    Program má:
                    * procvičovat latinské názvy;
                    * za správnou odpověď přidat bod a pochválit;
                    * za chybnou odpověď bod odečíst a oznámit chybu;
                    * na několik sekund ukázat správnou odpověď, vymazat ji a dál se ptát až do správné odpovědi;
                    * pokračovat, dokud nejsou všechna slovíčka zodpovězená správně;
                    * vypsat konečné skóre;
                    * podle skóre vypsat zpětnou vazbu:12 bodů: Úžasné!,8–11 bodů: Dobrá práce, procvičuj dál!,7 a méně: Ještě si to procvič!.
                answer_code: |
                    ```
                    body = 0
                    latinské_názvy = ['corpus', 'caput',  'ocolus',  'nasus', 'auris', 'os', 'collum',  'manus', 'pectus',  'humerus', 'venter', 'tergum']
                    české_názvy = ['tělo', 'hlava', 'oko', 'nos', 'ucho', 'ústa', 'krk', 'ruka', 'hrudník', 'rameno', 'břicho', 'záda']

                    {for} i {in} {range}(1, 12):
                        správná_odpověď = české_názvy[i]
                        odpověď = 0
                        {while} odpověď != správná_odpověď:
                            odpověď = {input}('Jak se česky řekne ', latinské_názvy[i], '?')
                            {if} odpověď != správná_odpověď:
                                {print}('To není správně')
                                {print}('Správný překlad pro ', latinské_názvy[i], ' je ', české_názvy[i])
                                {sleep} 3
                                clear
                                body = body - 1
                        body = body + 1
                        {print}('Správně!')

                    {print}("Gratuluji, všechna slovíčka jsou procvičená!")
                    {print}('Tvoje skóre:', body)

                    {if} body == 12:
                        {print}('Úžasné!')

                    {if} body <=7:
                        {print}('Ještě si to procvič!')
                    {else}:
                        {print}('Dobrá práce, procvičuj dál!')
                    ```
