adventures:
    story:
        name: Příběh
        default_save_name: Příběh
        description: Vytvoř krátký příběh
        levels:
            1:
                story_text: |
                    V úrovni 1 můžeš vytvořit příběh, jehož hlavní postavu určíš při spuštění.

                    Na prvním řádku použij `{ask}` a zeptej se, kdo bude hlavní postavou příběhu. Když potom chceš použít jméno postavy, napiš {answer}.
                example_code: |
                    ```
                    {ask} Hlavní postavou tohoto příběhu je
                    {print} {answer} se teď vydává na procházku do lesa
                    {print} {answer} má trochu strach, ale jde dál
                    {print} {answer} všude slyší podivné zvuky
                    {print} Má strach, že v tomto lese straší
                    ```
                story_text_2: |
                    ### Cvičení
                    Vytvoř vlastní příběh, který má alespoň 6 řádků kódu.
                    Nesmí být stejný jako ukázka.
                    Použij alespoň jedno `{ask}` a jedno `{answer}`.
                    Téma si můžeš vybrat. Pokud tě nic nenapadá, zkus návštěvu kina, sportovní utkání nebo den v zoo.
                answer_code: |
                    ```
                    {print} Jednoho dne jsem navštívil*a zoo
                    {ask} Které zvíře jsem viděl*a jako první?
                    {print} První zvíře, které jsem viděl*a: {answer}
                    {print} Potom jsem viděl*a tučňáka
                    {print} Právě obědval
                    {ask} Co tučňák jedl?
                    {print} Tučňákův oběd: {answer}
                    ```
            2:
                story_text: |
                    V úrovni 2 můžeš svůj příběh zpestřit. Jméno hlavní postavy teď může být kdekoli ve větě.

                    Musíš ale naprogramovat něco navíc. Nejprve hlavní postavu pojmenuj.

                    Potom můžeš její jméno umístit kamkoli do věty.
                example_code: |-
                    ```
                    jméno {is} {ask} Jak se jmenuje hlavní postava?
                    {print} jméno se teď rozběhne lesem
                    {print} jméno má trochu strach
                    {print} Najednou slyší podivný zvuk…
                    {sleep}
                    {print} jméno má strach, že v tomto lese straší
                    ```
                story_text_2: |
                    ### Cvičení
                    Přidej proměnné do svého příběhu z předchozí úrovně.
                    Vrať se ke svému příběhovému dobrodružství v úrovni 1 a zkopíruj kód. Vlož ho do editoru v této úrovni.

                    Kód tady zatím nebude fungovat, protože ještě nepoužívá proměnné.
                    Oprav ho pomocí proměnných a příkazů `{is}` a `{ask}`, jak ses v této úrovni naučil*a.

                    **Navíc** Přidej `{sleep}`, aby byl příběh napínavější.
                answer_code: |
                    ```
                    {print} Jednoho dne jsem navštívil*a zoo
                    první_zvíře {is} {ask} Které zvíře jsem viděl*a jako první?
                    {print} První zvíře, které jsem viděl*a: první_zvíře
                    {print} Potom jsem viděl*a tučňáka
                    {print} Právě obědval
                    jídlo {is} {ask} Co tučňák jedl?
                    {print} Tučňákův oběd…
                    {sleep} 3
                    {print} jídlo
                    ```
            3:
                story_text: "V úrovni 3 můžeš příběh zpestřit náhodným výběrem příšery, zvířete nebo jiné překážky. Třeba takto:\n"
                example_code: "```\nzvířata {is} 🦔, 🐿, 🦉, 🦇\n{print} Teď slyší, jak se ozývá zvířata {at} {random}\n```\n"
                story_text_2: "V příběhu se může hodit také příkaz `{add}`.\n"
                example_code_2: |
                    ```
                    {print} Slyší zvuk
                    zvířata {is} 🐿, 🦔, 🦇, 🦉
                    odhad {is} {ask} Co to podle tebe je?
                    {add} odhad {to_list} zvířata
                    {print} Zvuk vydalo toto zvíře: zvířata {at} {random}
                    ```
                story_text_3: "Toto je příklad příkazu `{remove}` v příběhu.\n\n### Cvičení\nZkopíruj do této úrovně svůj příběh z předchozích úrovní.\nV této úrovni ses naučil*a tři nové příkazy: `{at} {random}`, `{add} {to_list}` a `{remove} {from}`.\nPřidej do příběhu řádky kódu tak, aby se každý nový příkaz objevil alespoň jednou.\n"
                example_code_3: "```\n{print} Jeho batoh už byl moc těžký.\n{print} Uvnitř byla láhev vody, svítilna a cihla.\nbatoh {is} voda, svítilna, cihla\nvyhodit {is} {ask} Kterou věc má vyhodit?\n{remove} vyhodit {from} batoh\n```\n"
                answer_code: |
                    ```
                    zvířata {is} lev, zebra, plameňák
                    {print} Ahoj děti! Dnes půjdeme do zoo!
                    oblíbené_zvíře {is} {ask} Za kterým zvířetem chceš dnes jít?
                    {add} oblíbené_zvíře {to} zvířata
                    {sleep} 2
                    {print} Pojďme navštívit toto zvíře. Je to zvířata {at} {random}
                    {sleep}
                    neoblíbené_zvíře {is} {ask} Které zvíře nechceš vidět?
                    {remove} neoblíbené_zvíře {from} zvířata
                    {print} Teď pojďme navštívit toto zvíře. Je to zvířata {at} {random}
                    ```
            4:
                story_text: "### Cvičení\nZkopíruj ukázkový kód a doplň na prázdná místa v řádcích 1 a 2 uvozovky.\nPrázdná místa na řádcích 3 a 4 nenahrazuj uvozovkami, ale příkazy `{sleep}` a `{clear}`. Dokážeš program zprovoznit?\n\n### Cvičení 2\nVrať se do předchozí úrovně a zkopíruj kód svého příběhu. Přidej uvozovky na správná místa, aby kód fungoval i v této úrovni.\nPozor: Proměnné v příběhu musí zůstat mimo uvozovky, stejně jako proměnná jméno na druhém řádku ukázkového kódu.\n"
                example_code: "```\njméno {is} {ask} _ Jak se jmenuješ? _\n{print} _ Hlavní postava se jmenuje _ jméno\n_\n_\n{print} jméno _ se teď vydává na procházku do lesa _\n{print} jméno _ má trochu strach _\nzvířata {is} 🦔, 🐿, 🦉, 🦇\n{print} _ Slyší se ozývat: _ zvířata {at} {random}\n{print} jméno _ má strach, že v tomto lese straší _\n```\n"
                answer_code: |
                    ```
                    jméno {is} {ask} 'Jak se jmenuješ?'
                    {print}  'Hlavní postava se jmenuje' jméno
                    {print} jméno  ' teď půjde na procházku do lesa'
                    {print} jméno ' má trochu strach'
                    zvířata {is} 🦔, 🐿, 🦉, 🦇
                    {print} 'Slyší zvuk, který vydává toto zvíře: ' zvířata {at} {random}
                    {print} jméno ' má strach, že v tomto lese straší'
                    ```
            5:
                story_text: "V této úrovni můžeš naprogramovat různé konce, a příběh tak bude ještě zábavnější.\nUkázkový kód předvádí dva různé konce.\n\n### Cvičení 1\nNapiš nový krátký příběh na vlastní téma, který má alespoň 6 řádků kódu.\nNenapadá tě téma? Vyber si třeba superhrdinu, nudný den ve škole nebo uvíznutí na pustém ostrově.\n\nDej hráči možnost vybrat si dobrý, nebo špatný konec, stejně jako v ukázce.\nNaprogramuj oba konce.\n\n### Cvičení 2\nZkopíruj svůj příběh z některého předchozího příběhového dobrodružství.\nPřidej do něj alespoň dva příkazy `{if}` a `{else}`.\nMůžeš použít dobrý a špatný konec, ale zkus vymyslet i jiné způsoby, jak příkazy do příběhu zapojit.\n"
                example_code: "```\njméno {is} {ask} 'Kdo jde lesem?'\n{print} jméno ' prochází lesem'\n{print} jméno ' potká příšeru'\nkonec {is} {ask} 'Chceš dobrý, nebo špatný konec?'\n{if} konec {is} dobrý {print} jméno ' vezme meč a příšera rychle uteče'\n{else} {print} 'Příšera sní postavu jménem ' jméno\n```\n"
                answer_code: |
                    ```
                    jméno {is} {ask} 'Kdo je hrdinou?'
                    {print} 'Ale ne, letadlo padá! Kdo nás zachrání?'
                    {print} "Podívejte, kdo letí vzduchem: " jméno
                    konec {is} {ask} 'Chceš letadlo zachránit, nebo zničit?'
                    {if} konec {is} zachránit {print} jméno " přistál s letadlem a zachránil nás!"
                    {else} {print} "Ale ne! " jméno " ničí letadlo, pomoc!"
                    ```
            8:
                story_text: |
                    V příběhu někdo opakuje slova několikrát. Například, když někdo volá o pomoc nebo zpívá píseň.
                    Takové opakování můžete vložit do svého příběhu, na této úrovni s `{repeat}`.

                    ### Cvičení
                    Přidejte opakování do svého vlastního příběhu. Vraťte se ke svým uloženým programům, vyberte svůj příběhový program z předchozí úrovně a najděte řádek obsahující `{print}` a opakujte ho!
                example_code: "```\n{print} 'Princ pořád volal o pomoc'\n{repeat} 5 {times} {print} 'Pomoc!'\n{print} 'Proč mi nikdo nepomáhá?'\n```\n"
                answer_code: |
                    {print} 'Všechny děti chtěly do zoo a pořád to vykřikovaly!'
                    {repeat} 3 {times} {print} "Pojďme do zoo!"
            9:
                story_text: |
                    V této úrovni můžeš v příkazech `{if}` použít více řádků a vylepšit tak šťastný i smutný konec příběhu!

                    ### Cvičení 1
                    Ukázkový kód nabízí dva různé konce: v jednom postavy naskočí do stroje času, v druhém ne.
                    Doplň na prázdná místa alespoň jednu větu pro každý konec.
                    **Navíc** Prodluž příběh. Co se v něm stane? Můžeš přidat i druhou otázku s `{ask}` a další možnosti.

                    ### Cvičení 2
                    Vrať se k uloženým programům a vyber svůj příběh z úrovně 5. Napiš mu dobrý i špatný konec, každý alespoň na tři řádky!
                example_code: |
                    ```
                    {print} 'ALE NE! T-rex se blíží!'
                    konec = {ask} 'Chceš šťastný, nebo smutný konec?'
                    # Šťastný konec příběhu:
                    {if} konec {is} šťastný
                        {print} 'Richard na poslední chvíli skočí zpátky do stroje času!'
                        {print} _
                    # Smutný konec příběhu:
                    {else}
                        {print} 'Ale ne! Richard je příliš pomalý…'
                        {print} _
                    ```
                answer_code: |
                    ```
                    {print} 'ALE NE! T-rex se blíží!'
                    konec = {ask} 'Chceš šťastný, nebo smutný konec?'
                    {if} konec {is} šťastný
                        {print} 'Richard na poslední chvíli skočí zpátky do stroje času!'
                        {print} 'Uf, ještě že to vyšlo'
                        {print} 'Právě včas'
                    {else}
                        {print} 'Ale ne! Richard je příliš pomalý…'
                        {print} 'T-rex mohutně ZAŘVE'
                        {print} 'Otevře tlamu a spolkne Richarda na jedno sousto'
                    ```
            10:
                story_text: "V této úrovni můžeš používat příkazy `{if}` a `{repeat}` uvnitř jiných příkazů `{if}` a `{repeat}`.\nOtevírá to spoustu možností, jak vytvořit interaktivní příběh.\n\n### Cvičení 1\nDoplň kód tak, aby `{if}` správně fungovalo.\n\n### Cvičení 2\nPřidej `{if}` a `{else}` také do části příběhu, ve které Robin jde domů.\n\n### Cvičení 3\nVrať se ke svému příběhu z úrovně 8 a použij alespoň dvě `{if}` uvnitř dalšího `{if}`.\n"
                example_code: |
                    ```
                    {print} 'Robin prochází centrem města'
                    místo = {ask} 'Kam půjde Robin? Obchod, nebo domů?'
                    {if} místo {is} obchod
                        {print} 'Vstoupí do obchodu.'
                        {print} 'Robin si všimne zajímavé knihy'
                        kniha = {ask} 'Koupí si Robin knihu?'
                        {if} kniha {is} ano
                        _ {print} 'Robin si koupí knihu a jde domů'
                        _ {else}
                        _ {print} 'Robin odejde z obchodu a jde domů'
                    {else}
                        {print} 'Robin jde domů'
                    ```
                story_text_2: "Pomocí `{and}` a `{or}` můžeš své příběhy obohatit. Polož více otázek a reaguj na kombinaci odpovědí.\n\n### Cvičení 1\nProhlédni si ukázkový kód a doplň ho. Potom přidej alespoň dva další příkazy `{if}` s `{and}` nebo `{or}`.\n\n### Cvičení 2\nNajdi svůj příběh z předchozí úrovně a přidej do něj jedno `{and}` nebo `{or}`.\n"
                answer_code: |
                    ```
                    {print} 'Robin prochází centrem města'
                    místo = {ask} 'Kam půjde Robin? Obchod, nebo domů?'
                    {if} místo {is} obchod
                        {print} 'Vstoupí do obchodu.'
                        {print} 'Robin si všimne zajímavé knihy'
                        kniha = {ask} 'Koupí si Robin knihu?'
                        {if} kniha {is} ano
                            {print} 'Robin si koupí knihu a jde domů'
                        {else}
                            {print} 'Robin odejde z obchodu a jde domů'
                    {else}
                        {print} 'Robin jde domů'
                        zmrzlina = {ask} 'Zastaví se cestou domů na zmrzlinu?'
                        {if} zmrzlina {is} ano
                            {print} 'Robin se nejprve zastaví na zmrzlinu'
                            {print} 'Vybere si citronový sorbet'
                            {print} 'Je výborný'
                        {else}
                            {print} 'Jde rovnou domů'
                    ```
                example_code_2: |
                    ```
                    {print} 'Naše hrdinka prochází lesem'
                    {print} 'Cesta se rozděluje'
                    cesta = {ask} 'Kterou cestu si má vybrat?'
                    zbraň = {ask} 'Jakou zbraň vytáhne?'
                    {if} cesta {is} vlevo {and} zbraň {is} meč
                        _
                    ```
                answer_code_2: |
                    ```
                    {print} 'Naše hrdinka prochází lesem'
                    {print} 'Cesta se rozděluje'
                    cesta = {ask} 'Kterou cestu si má vybrat?'
                    zbraň = {ask} 'Jakou zbraň vytáhne?'

                    {if} cesta {is} vlevo {and} zbraň {is} meč
                        {print} 'K hrdince se neodváží přiblížit žádná příšera.'

                    {if} cesta {is} vlevo {and} zbraň {is} prak
                        {print} 'Na hrdinku zaútočí soví medvěd.'

                    {if} cesta {is} vpravo {or} zbraň {is} 'kniha kouzel'
                        {print} 'K hrdince přistoupí tajemný kouzelník.'
                    ```
            11:
                story_text: "V této úrovni můžeš v příběhu použít příkaz `{for}`. Snadno tak naprogramuješ například dětskou knihu „Kam to koukáš, medvěde?“.\n\n### Cvičení\n\nPokud příběh neznáš, podívej se na <a href=\"https://fliphtml5.com/jmlya/nquy\"> příběh</a> a pohlídej si, aby výpis odpovídal knize.\n"
                example_code: |
                    ```
                    zvířata = _ , _ , _ 
                    {print} 'Hnědý medvěde, hnědý medvěde'
                    {print} 'Co vidíš?'
                    ```
                answer_code: |
                    ```
                    zvířata = červený pták, žlutá kachna, modrý kůň, zelená žába, fialová kočka, bílý pes, černá ovce, zlatá rybka, učitel
                    {print} 'Hnědý medvěde, hnědý medvěde'
                    {print} 'Co vidíš?'
                    {for} zvíře {in} zvířata
                        {print} 'Vidím, jak se na mě dívá ' zvíře
                        {print} 'Na řadě je ' zvíře ', ' zvíře
                        {print} 'Co vidíš?'
                    {print} 'Vidím, jak se na mě dívají děti'
                    {print} 'Děti, děti'
                    {print} 'Co vidíte?'
                    {print} 'Vidíme, jak se na nás dívají:'
                    {for} zvíře {in} zvířata
                        {print} zvíře
                    {print} ''
                    {print} 'Tohle vidíme!'
                    ```
            13:
                example_code: |
                    ```
                    jméno = _
                    {print}('Vítej v tomto příběhu!')
                    ```
                story_text: |
                    Budeme vypisovat příběh a u `{print}` musíme použít kulaté závorky.

                    ### Cvičení
                    Vytvoř příběh alespoň o 5 větách. Nejprve v něm použij proměnnou `jméno`. Potom vytvoř další dvě proměnné a použij je také.
                    Tip: U `{print}` nezapomeň na čárky mezi textem a proměnnými!
                answer_code: |
                    ```
                    jméno = 'Hedy'
                    {print}('Vítej v tomto příběhu!')
                    {print}('Kdysi žil papoušek jménem ', jméno '.')
                    {print}(jméno, ' miloval programování!')
                    {print}("Bohužel ostatní papoušci neuměli programovat.")
                    {print}('Jednoho dne se ', jméno, ' rozhodl učit ostatní papoušky programovat.')
                    {print}('Lekce měly u ostatních papoušků obrovský úspěch!')
                    ```
            16:
                story_text: "Cyklus `{while}` může tvoje příběhy zpestřit. Například pomocí `{while} hra == 'zapnutá'` necháš hráče hrát, dokud hra neskončí.\nNebo použij `{while} meč == 'ztracený'`, aby hráč nemohl pokračovat, dokud něco nenajde.\n\n### Cvičení\nUkázkový kód předvádí cyklus `{while}` v příběhu. Teď **vymysli vlastní situaci**, ve které musí hráč nejprve něco najít, aby mohl pokračovat.\n"
                example_code: "```\nklíče = 'ztracené'\n{print}('Stojíš na zahradě a nemůžeš najít klíče.')\n{print}('Kde je chceš hledat?')\n{print}('Můžeš zvolit: strom, záhon, kámen, schránka')\n{while} klíče == 'ztracené':\n    místo = {input}('Kde chceš hledat?')\n    {if} místo == 'záhon':\n        {print}('Tady jsou!')\n        klíče = 'nalezené'\n    {else}:\n        {print}('Ne, na tomto místě nejsou: ', místo)\n{print}('Teď můžeš vejít do domu!')\n```\n"
                answer_code: |
                    ```
                    rakety = 'ztracené'
                    {print}('Jsi s kamarády a chcete si zahrát tenis, ale nemůžeš si vzpomenout, kam jsi dal*a rakety.')
                    {print}('Kde je chceš hledat?')
                    {print}('Můžeš zvolit: ložnice, kůlna, skříňka, stůl')
                    {while} rakety == 'ztracené':
                        místo = {input}('Kde chceš hledat?')
                        {if} místo == 'stůl':
                            {print}('Tady jsou! Počet nalezených raket: 6!')
                            klíče = 'nalezené'
                        {else}:
                            {print}('Ne, na tomto místě nejsou: ', místo)
                    {print}('Teď si můžeš zahrát tenis se všemi kamarády.')
                    ```
            6:
                story_text: |-
                    Teď umíš používat `{elif}`, takže můžeš svůj příběh udělat ještě interaktivnější! Můžeš třeba vytvořit více postav s různými vlastnostmi.
                    Nebo nechat hráče vybrat cestu, dveře k otevření či kouzelný lektvar k vypití…

                    ### Cvičení
                    Pomocí `{elif}` vytvoř vlastní příběh se třemi nebo více možnostmi.
                example_code: |
                    ```
                    postava {is} {ask} 'Kdo ti pomůže na tvé výpravě?'
                    {if} postava {is} 'Daisy'
                    {print} 'Tvoje volba: Daisy! Je ze všech nejchytřejší!'
                    {elif} postava {is} 'Jason'
                    {print} 'Tvoje volba: Jason! Je ze všech nejsilnější!'
                    {elif} postava {is} 'Sam'
                    {print} 'Tvoje volba: Sam! Je ze všech nejrychlejší!'
                    ```
                answer_code: |
                    Vlastní řešení
    and_or_command:
        levels:
            10:
                story_text: |-
                    Teď se naučíme `{and}` a `{or}`! Když chceš ověřit dvě podmínky, nemusíš používat dvě `{if}`. Můžeš použít `{and}` a `{or}`.
                    U `{and}` musí platit obě podmínky, vlevo i vpravo od `{and}`. U `{or}` stačí, když platí alespoň jedna.
                example_code: |
                    ```
                    jméno = {ask} 'Jak se jmenuješ?'
                    věk = {ask} 'Kolik ti je let?'
                    {if} jméno {is} Hedy {and} věk {is} 2
                        {print} 'Ty jsi ta pravá Hedy!'
