                    ### Cvičení
                    Nakresli se želvou stejné obrázky!

                    **Navíc** Číslo v závorkách udává, na kolika řádcích kódu lze obrazec nakreslit. Dokážeš to na stejném počtu řádků?

                    **Navíc** Nech hráče vybrat, vlajku které země chce vidět.

                    <div class="w-full flex flex-row gap-2">
                    Kříž (7) <img src="https://github.com/hedyorg/hedy/assets/80678586/76e42c76-aa3f-4863-8eee-ead73c09a186" width="150">
                    Vnořené čtverce s náhodnými barvami (8) <img src="https://github.com/hedyorg/hedy/assets/80678586/17f878cc-e893-4c10-b32e-a09a50bf08de" width="200">
                    Vlajky <img src="https://github.com/hedyorg/hedy/assets/80678586/877fc337-df80-4185-8005-a6c28904f66e" width="300">
                    </div>
                example_code: |
                    Nápověda pro vnořené čtverce:
                    ```
                    barvy = red, blue, orange, yellow, pink, purple, green, brown, black
                    vzdálenost = 120
                    {repeat} 5 {times}
                    _
                    ```
                    Nápověda pro vlajky:
                    ```
                    země = {ask} 'Vlajku které země chceš vidět?'
                    {if} země {is} Nizozemsko
                        barva_1 = red
                        barva_2 = white
                        barva_3 = blue
                    ```
                answer_code: |
                    Vnořené čtverce
                    ```
                    barvy = red, blue, orange, yellow, pink, purple, green, brown, black
                    vzdálenost = 120
                    {repeat} 5 {times}
                        {color} barvy {at} {random}
                        vzdálenost = vzdálenost - 20
                        {repeat} 4 {times}
                            {forward} vzdálenost
                            {turn} 90
                    ```

                    Vlajky
                    ```
                    země = {ask} 'Vlajku které země chceš vidět?'
                    {if} země is 'Nizozemsko'
                        barva_1 = red
                        barva_2 = white
                        barva_3 = blue
                    {if} země is 'Německo'
                        barva_1 = black
                        barva_2 = red
                        barva_3 = yellow
                    {turn} 90
                    {color} barva_1
                    {repeat} 4 {times}
                        {forward} 100
                        {turn} 90
                        {forward} 2
                        {turn} 90
                        {forward} 100
                        {turn} -90
                        {forward} 2
                        {turn} -90
                    {color} barva_2
                    {repeat} 4 {times}
                        {forward} 100
                        {turn} 90
                        {forward} 2
                        {turn} 90
                        {forward} 100
                        {turn} -90
                        {forward} 2
                        {turn} -90
                    {color} barva_3
                    {repeat} 4 {times}
                        {forward} 100
                        {turn} 90
                        {forward} 2
                        {turn} 90
                        {forward} 100
                        {turn} -90
                        {forward} 2
                        {turn} -90
                    ```

                    Kříž
                    ```
                    {repeat} 4 {times}
                        {forward} 50
                        {turn} 90
                        {forward} 50
                        {turn} -90
                        {forward} 50
                        {turn} 90
                    ```
