                    ```

                    Cvičení 3
                    ```
                    {def} spočítej_průměrnou_známku(předmět):
                        součet = 0
                        počet_testů = {input}("Kolik testů máš z předmětu ", předmět)
                        {for} i {in} {range} (1, počet_testů):
                            známka = {input} ("Jakou známku máš z testu ", i, '?')
                            součet = součet + známka
                        {return} součet / počet_testů

                    počet_předmětů = {input}('Z kolika předmětů chceš spočítat průměrnou známku?')
                    {repeat} počet_předmětů {times}
                        předmět = {input}('Z jakého předmětu chceš spočítat průměrnou známku?')
                        průměrná_známka = spočítej_průměrnou_známku(předmět)
                        {print} ('Tvoje průměrná známka z předmětu ', předmět, ' je ', průměrná_známka)
                    ```
            10:
