                    ```
                    #lista dei premi
                    palloncino = 1
                    lecca_lecca = 2
                    videogioco = 8
                    orsacchiotto = 10

                    {print}('Tiro ai barattoli!')
                    eta = {input}('Quanti anni hai?')
                    gia_giocato = {input}('Hai già fatto il tuo turno?')

                    {if} gia_giocato != 'sì' {and} eta < 18:
                        {print}('Puoi giocare')
