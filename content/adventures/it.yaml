                    In questo livello imparerai a usare il comando `{play}` per suonare una melodia!

                    Scrivi `{play}` seguito dalla nota che vuoi suonare. La scala è C-D-E-F-G-A-B, cioè Do-Re-Mi-Fa-Sol-La-Si.
                    Come vedi ci sono 7 lettere diverse, ma possiamo suonare più di 7 note.
                    Scrivi un numero tra 0 e 9 dopo la lettera per scegliere l'ottava: per esempio dopo B4 viene C5.
                    C0 è la nota più bassa che puoi suonare, B9 la più alta.

                    ### Esercizio
                    Prova il codice di esempio e poi divertiti a modificarlo! Riesci a creare una tua melodia?
                    Nel prossimo livello imparerai a suonare alcune canzoni che già esistono.
                example_code: |-
                    ```
                    {play} C4
                    {play} D4
                    {play} E4
                    {play} F4
                    {play} G4
                    {play} A4
                    {play} B4
                    {play} C5
