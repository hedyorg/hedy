            1:
                story_text: |
                    Con Hedy puoi anche disegnare. Combinando svolte e linee, puoi creare un quadrato o una scala!

                    Con `{forward}` disegni una linea in avanti. Il numero che segue indica quanto deve camminare la tartaruga. `{turn} {right}` fa girare di un quarto di giro in senso orario, `{turn} {left}` in senso antiorario.

                    Se vuoi andare indietro, usi il comando `{forward}` ma con un numero negativo. Per esempio `{forward} -100`
                example_code: |
                    ```
                    {forward} 100
                    {turn} {left}
                    ```
                story_text_2: |
