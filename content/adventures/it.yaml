                story_text: |-
                    Crea uno strumento per organizzare feste che prepara un invito alla tua festa!

                    ### Esercizio
                    * Per prima cosa inserisci le domande giuste da fare al giocatore
                    * Poi crea un invito alla festa usando le risposte che ti ha dato il giocatore
                example_code: |-
                    ```
                    #chiediamo le informazioni
                    {print} 'ORGANIZZATORE DI FESTE'
                    nome_organizzatore {is} {ask} _
                    nome_invitato {is} {ask} _
                    motivo_festa {is} {ask} _
                    data_festa {is} {ask} _
                    ora_festa {is} {ask} _
                    luogo_festa {is} {ask} _
                    tema_festa {is} {ask} _
                    dress_code {is} {ask} _

                    #prepariamo l'invito
                    {print} 'attendi... sto preparando il tuo invito'
                    {sleep} 2
                    {clear}

                    #stampiamo l'invito
                    {print} 'Ciao ' nome_invitato ','
                    _
                    ```
                answer_code: |-
                    ```
                    #chiediamo le informazioni
                    {print} 'ORGANIZZATORE DI FESTE'
                    nome_organizzatore {is} {ask} 'Come ti chiami?'
