    fortune:
        name: Indovino
        levels:
            1:
                story_text: |
                    Siete mai stati a un carnevale e vi siete fatti predire il futuro da un'indovino? O hai mai giocato con una palla otto magica?
                    Allora probabilmente saprai che non possono davvero predire il tuo futuro, ma è comunque divertente giocarci!

                    Nei prossimi livelli potrai imparare a creare la tua macchina per predire il futuro!
                    Nel livello 1 puoi iniziare in modo semplice lasciando che Hedy si presenti come un'indovino e lasci che `{answer}` le risposte dei giocatori.
                    Come questo:
                example_code: |
                    ```
                    _ Ciao, sono Hedy l'indovina!
                    _ Chi sei?
                    _ Fammi guardare nella mia sfera di cristallo
                    _ Vedo... vedo...
                    _ Il tuo nome è _
                    ```
                story_text_2: |
                    ### Esercizio
                    Copia il codice di esempio nella schermata di input e riempi gli spazi vuoti per far funzionare il codice.
                    **Extra** Modifica il codice in modo che l'indovina non predica solo il tuo nome, ma anche la tua età, la tua squadra del cuore o qualcos'altro di te.
                answer_code: |
                    ```
                    {print} Ciao, sono Hedy l'indovina!
                    {ask} Chi sei?
                    {print} Fammi guardare nella mia sfera di cristallo
                    {print} Vedo... vedo...
                    {print} Il tuo nome è {answer}
                    {ask} Quanti anni hai?
                    {print} Interessante
                    {print} La mia sfera di cristallo mi dice che hai {answer} anni
                    {ask} Che sport fai?
                    {print} La sfera... la sfera...
                    {print} Mi dice il tuo sport preferito...
                    {print} Mi dice che fai {answer}
                    ```
            3:
                story_text: |
                    Nei livelli precedenti hai creato la tua prima macchina per predire il futuro, ma Hedy non poteva davvero predire niente.
                    In questo livello puoi usare una variabile e il comando `{at} {random}` per far scegliere davvero a Hedy una risposta per te. Guarda per esempio questo codice:
                example_code: |
                    ```
                    {print} Sono Hedy l'indovina!
                    domanda {is} {ask} Cosa vuoi sapere?
                    {print} Ecco cosa vuoi sapere: domanda
                    risposte {is} sì, no, forse
                    {print} La mia sfera di cristallo dice...
                    {sleep} 2
                    {print} risposte {at} {random}
                    ```
                story_text_2: |
                    ### Esercizio
                    Per ora Hedy può rispondere solo sì, no o forse. Riesci a dare a Hedy più risposte possibili, come 'sicuramente' o 'chiedimelo di nuovo'?
                answer_code: |-
                    ```
                    {print} Sono Hedy l'indovina!
                    domanda {is} {ask} Cosa vuoi sapere?
                    {print} Ecco cosa vuoi sapere: domanda
                    risposte {is} sì, no, forse, sicuramente, non lo so, riprova
                    {print} La mia sfera di cristallo dice...
                    {sleep} 2
                    {print} risposte {at} {random}
                    ```
            4:
                story_text: |
                    ### Esercizio
                    Abbiamo tolto tutte le virgolette da questo codice di esempio: riesci a rimetterle nei punti giusti?

                    ### Esercizio 2
                    Torna al livello precedente e copia il codice della tua indovina. Fai funzionare il codice in questo livello aggiungendo le virgolette nei punti giusti.
                example_code: |
                    ```
                    # Aggiungi le virgolette a questo codice
                    {print} Sono Hedy l'indovina!
                    domanda {is} {ask} Cosa vuoi sapere?
                    {print} Questa è la tua domanda:  domanda
                    risposte {is} sì, no, forse
                    {print} La mia sfera di cristallo dice...
                    {sleep} _
                    {print} risposte {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} "Sono Hedy l'indovina!"
                    domanda {is} {ask} 'Cosa vuoi sapere?'
                    {print} 'Questa è la tua domanda: '  domanda
                    risposte {is} sì, no, forse
                    {print} 'La mia sfera di cristallo dice...'
                    {sleep} 2
                    {print} risposte {at} {random}
                    ```
            6:
                story_text: |
                    ### Esercizio
                    Nel codice di esempio vedi come creare un programma da indovina che ti permette di truccare le probabilità a tuo favore. Questo programma imbroglione ti dice sempre che vincerai alla lotteria, mentre i tuoi amici non vinceranno mai.

                    Usalo per creare un tuo programma, sii creativo! Per esempio potresti creare un codice che predice che:
                    * la tua squadra del cuore batterà tutte le altre!
                    * il tuo film preferito verrà scelto per la serata cinema!
                    * vincerai i biglietti per il tuo spettacolo preferito!
                    * sei la persona più bella del reame, come nello specchio magico di Biancaneve.
                    Lascia lavorare la fantasia!

                    Il tuo programma deve avere almeno 10 righe di codice e deve contenere almeno un comando `{if}` e un comando `{else}`.
                example_code: |
                    ```
                    amici {is} Jordan, Lucy, Dave
                    {print} 'Posso prevedere se domani vincerai alla lotteria!'
                    persona {is} {ask} 'Chi sei?'
                    risposta_buona {is} Evviva! Hai vinto!, Vincerai sicuramente!, Abbiamo un vincitore!
                    risposta_cattiva {is} Che sfortuna! Riprova!, Vincerà qualcun altro, Hai perso!
                    {if} persona {in} amici
                    {print} risposta_cattiva {at} {random}
                    {else}
                    {print} risposta_buona {at} {random}
                    ```
                answer_code: |
                    ```
                    amici {is} Jordan, Lucy, Dave
                    {print} 'Posso prevedere il futuro...'
                    {sleep} 2
                    {clear}
                    {print} 'Posso prevedere se la tua squadra del cuore vincerà oppure no'
                    persona {is} {ask} 'Chi sei?'
                    risposta_buona {is} Evviva! La tua squadra vincerà!, La tua squadra vincerà sicuramente!, La tua squadra vincerà! Urrà!
                    risposta_cattiva {is} Che sfortuna! La tua squadra non vincerà!, Peccato... La tua squadra del cuore perderà..., La tua squadra del cuore perderà
                    {if} persona {in} amici
                    {print} risposta_cattiva {at} {random}
                    {else}
                    {print} risposta_buona {at} {random}
                    ```
            7:
                story_text: |
                    In questo livello puoi usare la matematica nelle tue previsioni da indovina. Così puoi inventare formule (buffe) per calcolare il futuro.
                    Per esempio potresti calcolare quanto diventerai ricco o quanti figli avrai da grande.

                    ### Esercizio
                    Ti viene in mente una tua macchina (buffa) per predire il futuro?
                example_code: |
                    ```
                    {print} 'Sono Hedy, la tua indovina!'
                    {print} 'Posso prevedere quanti figli avrai da grande!'
                    eta = {ask} 'Quanti anni hai?'
                    fratelli = {ask} 'Quanti fratelli e sorelle hai?'
                    altezza = {ask} 'Quanti centimetri sei alto?'
                    figli = altezza / eta
                    figli = figli - fratelli
                    {print} 'Avrai ...'
                    {sleep}
                    {print} figli ' figli!'
                    ```
                answer_code: |
                    Risposta libera
            8:
                story_text: |
                    ### Esercizio
                    Completa questo programma, che ti dice se la persona che ti piace ricambia i tuoi sentimenti oppure no.
                example_code: |
                    ```
                    {print} 'Ho un fiore dai petali magici'
                    {print} 'Se stacchi i petali, il fiore ti dirà se la persona che ti piace ricambia'
                    quantita = {ask} 'Quanti petali vuoi staccare?'
                    opzioni = mi ama, non mi ama
                    _ _ _ _ opzioni {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} 'Ho un fiore dai petali magici'
                    {print} 'Se stacchi i petali, il fiore ti dirà se la persona che ti piace ricambia'
                    quantita = {ask} 'Quanti petali vuoi staccare?'
                    opzioni = mi ama, non mi ama
                    {repeat} quantita {times} {print} opzioni {at} {random}
                    ```
            9:
                story_text: |
                    Nel prossimo esempio puoi far fare alla tua indovina più domande e anche stamparle!

                    ### Esercizio
                    Riesci a inserire il comando giusto negli spazi vuoti?
                example_code: |
                    ```
                    #Presentiamo l'indovina
                    {print} 'Sono Hedy, la tua indovina!'
                    {print} 'Puoi farmi 3 domande.'
                    risposte = sì, no, forse
                    #Facciamo una domanda e rispondiamo 3 volte:
                    _ _ _
                       domanda = {ask} 'Cosa vuoi sapere?'
                       {print} domanda
                       {sleep}
                       {print} 'La mia sfera di cristallo dice... ' risposte {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} 'Sono Hedy, la tua indovina!'
                    {print} 'Puoi farmi 3 domande.'
                    risposte = sì, no, forse
                    {repeat} 3 {times}
                       domanda = {ask} 'Cosa vuoi sapere?'
                       {print} domanda
                       {sleep}
                       {print} 'La mia sfera di cristallo dice...' risposte {at} {random}
                    ```
            11:
                story_text: |
                    In questo livello imparerai a programmare il gioco MASH (in inglese: villa, appartamento, baracca, casa). In questo gioco puoi predire in una volta sola il futuro di tutti i giocatori.

                    ### Esercizio
                    Riempi gli spazi vuoti usando il nuovo comando che hai imparato in questo livello.
                example_code: |
                    ```
                    #Definiamo le diverse opzioni:
                    case = villa, appartamento, baracca, casa
                    amori = nessuno, un principe, il vicino di casa, il vero amore
                    animali = cane, gatto, elefante
                    nomi = Jenna, Ryan, Jim
                    #Prediciamo il futuro di tutte le persone:
                    _
                        {print} nome ' abiterà in: ' case {at} {random}
                        {print} nome ' sposerà ' amori {at} {random}
                        {print} nome ' avrà come animale domestico: ' animali {at} {random}
                        {sleep}
                    ```
                answer_code: |
                    ```
                    case = villa, appartamento, baracca, casa
                    amori = nessuno, un principe, il vicino di casa, il vero amore
                    animali = cane, gatto, elefante
                    nomi = Jenna, Ryan, Jim
                    {for} nome {in} nomi
                        {print} nome ' abiterà in: ' case {at} {random}
                        {print} nome ' sposerà ' amori {at} {random}
                        {print} nome ' avrà come animale domestico: ' animali {at} {random}
                        {sleep}
                    ```
