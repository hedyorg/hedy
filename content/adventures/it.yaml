        levels:
            3:
                story_text: |
                    In questo livello puoi usare `{at} {random}` con la tartaruga che disegna. Una scelta casuale fa sì che la tartaruga percorra ogni volta un percorso diverso.
                    Utilizza `{at} {random}` per scegliere un valore da un elenco.
                    ### Esercizio
                    Puoi copiare e incollare le righe 2 e 3 per creare un percorso casuale più lungo?
                example_code: |
                    ```
                    angoli {is} 10, 50, 90, 150, 250
                    {turn} angoli {at} {random}
                    {forward} 25
                    ```
                answer_code: |
                    ```
                    angoli {is} 10, 50, 90, 150, 250
                    {turn} angoli {at} {random}
                    {forward} 25
                    {turn} angoli {at} {random}
                    {forward} 25
                    {turn} angoli {at} {random}
                    {forward} 25
                    {turn} angoli {at} {random}
                    {forward} 25
