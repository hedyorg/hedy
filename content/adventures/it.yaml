    quotation_marks:
        name: virgolette
        default_save_name: virgolette
        description: Introduzione alle virgolette
        levels:
            4:
                story_text: |
                    ## Le virgolette
                    Nel livello 4 `{ask}` e `{print}` sono cambiati.
                    Devi mettere tra virgolette il testo che vuoi stampare.
                    È utile, perché ora puoi stampare tutte le parole che vuoi, anche quelle che hai usato per salvare qualcosa con `{is}`.
                    Anche la maggior parte dei linguaggi di programmazione usa le virgolette per stampare, quindi ci avviciniamo un altro po' alla vera programmazione!
                example_code: |
                    ```
                    {print} 'Da adesso devi usare le virgolette!'
                    risposta {is} {ask} 'Cosa dobbiamo usare da adesso?'
                    {print} 'Dobbiamo usare le ' risposta
                    ```
                story_text_2: |
                    ## Gli apostrofi
                    Importante! Ora che usiamo le virgolette, Hedy si confonde se usi l'apostrofo nelle parole con l'elisione, come c'è o l'amica.
                    Quando nella riga c'è un apostrofo, usa le virgolette doppie!
                    Guarda il codice di esempio per vedere il modo sbagliato di usare gli apostrofi.
                example_code_2: |
                    ```
                    #Questo è il modo sbagliato di usare gli apostrofi
                    {print} 'C'è un'amica di mia sorella'
                    {print} 'Com'è divertente!'

                    #Così risolvi il problema
                    {print} "C'è un'amica di mia sorella"
                    {print} "Com'è divertente!"

                    # Provaci! Scrivi qui sotto una riga di codice con le virgolette
                    _
                    ```
                answer_code: |
                    Risposta libera
    random_command:
        name: '{random}'
        default_save_name: casuale
        description: introduzione al comando {at} {random}
        levels:
            3:
                story_text: |
                    ## A caso
                    In questo livello puoi creare una lista con il comando `{is}`. Puoi far scegliere al computer un elemento a caso da quella lista. Lo fai con `{at} {random}`.
                example_code: |
                    ```
                    animali {is} cani, gatti, canguri
                    {print} animali {at} {random}
                    ```
                story_text_2: |
                    Puoi usare il comando `{at} {random}` anche in una frase.
                example_code_2: |
                    ```
                    cibo {is} panino, trancio di pizza, insalata, burrito
                    {print} A pranzo mangerò: cibo {at} {random}.
                    ```
                story_text_3: |
                    ### Esercizio
                    Prova il comando `{at} {random}` creando un tuo quiz a premi (come quelli in tv) in cui scegli una porta o una valigia che contiene un grande premio!
                    Ci riesci? Abbiamo già scritto le prime righe nel codice di esempio.
                example_code_3: |
                    ```
                    {print} Il grande quiz a premi!
                    {print} Davanti a te ci sono 3 valigie...
                    scelta {is} {ask} Quale valigia scegli?
                    premi {is} _
                    _
                    ```
                answer_code: |-
                    ```
                    {print} Il grande quiz a premi!
                    {print} Davanti a te ci sono 3 valigie...
                    scelta {is} {ask} Quale valigia scegli?
                    premi {is} un taco, una penna, un milione di euro
                    {print} Hai vinto... premi {at} {random}
                    ```
            14:
                story_text: |-
                    Ora che hai imparato a usare le parentesi quadre nelle liste, introduciamo anche un modo diverso di usare il comando `{at} {random}`.
                    Basta scrivere il nome della lista seguito da `[random]`, dove normalmente scriveresti un numero!
                example_code: |-
                    ```
                    frutta = ['mela', 'banana', 'ciliegia']
                    {print}(frutta[random])
                    ```
                story_text_2: |-
                    ### Esercizio
                    Completa il codice. Fai scegliere al computer un vincitore a caso.
                example_code_2: |-
                    ```
                    nomi = _'Sarah', 'Jason', 'Meghan'_
                    {print}('Ha vinto:' _ )
                    ```
                answer_code: |
                    ```
                    nomi = ['Sarah', 'Jason', 'Meghan']
                    {print}('Ha vinto:' nomi[random] )
                    ```
    repeat_command:
        name: '{repeat}'
        default_save_name: ripeti
        description: comando {repeat}
        levels:
            8:
                story_text: |
                    Questo livello aggiunge il comando `{repeat}`. `{repeat}` serve a eseguire più volte una riga di codice. Così:

                    ### Esercizio
                    Prova a giocare con il comando `{repeat}`. Riesci a scrivere la canzone "Tanti auguri a te" con solo 3 righe di codice invece di 4?
                example_code: |
                    ```
                    {repeat} 3 {times} {print} 'Hedy è divertente!'
                    ```
                answer_code: |
                    ```
                    {repeat} 2 {times} {print} 'tanti auguri a te'
                    {print} 'tanti auguri cara Hedy'
                    {print} 'tanti auguri a te'
                    ```
            9:
                story_text: |
                    In questo livello puoi ripetere più righe di codice con un solo comando `{repeat}`.
                    Per farlo, crei un blocco con le righe che vuoi ripetere.
                    Le righe di questo blocco hanno bisogno dell'**indentazione**.
                    Questo significa mettere una tabulazione o 4 spazi all'inizio di ogni riga. Devi usare l'indentazione anche quando vuoi creare un blocco di una sola riga.
                example_code: |
                    ```
                    {repeat} 5 {times}
                        {print} 'Ciao a tutti'
                        {print} 'Tutto questo viene ripetuto 5 volte'
                    ```
                answer_code: |
                    ```
                    {print} 'Fra Martino campanaro'
                    {repeat} 2 {times}
                        {print} 'dormi tu?'
                    {print} 'Suona le campane, din don dan!'
                    ```
            10:
                story_text: |
                    Ottimo lavoro! Sei arrivato a un nuovo livello! Nel livello precedente hai imparato a usare più righe di codice in un comando `{if}` o `{repeat}`.
                    Ma non puoi ancora combinare le due cose...

                    Buone notizie! In questo livello potrai mettere un `{if}` dentro un `{if}`, un `{repeat}` dentro un comando `{repeat}`, e l'uno dentro l'altro.
                    Provaci!
                example_code: |
                    ```
                    {repeat} 3 {times}
                        ordine = {ask} 'Cosa vorresti ordinare?'
                        {if} ordine {is} pizza
                            {print} 'Gnam'
                        {else}
                            {print} 'la pizza è più buona!'
                    ```
                answer_code: |
                    Risposta libera
    repeat_command_2:
        name: '{repeat} 2'
        default_save_name: ripeti_2
        description: comando {repeat} 2
        levels:
            8:
                story_text: |
                    ## Ripetere con altri comandi e con le variabili
                    Finora ti sei esercitato con il comando `{repeat}` insieme al comando `{print}`, ma sapevi che con `{repeat}` puoi usare anche altri comandi?
                    In questo codice di esempio puoi vedere che `{repeat}` si può usare anche con un comando `{ask}`, `{if}` o `{else}`.
                example_code: |
                    ```
                    {repeat} 2 {times} risposta = {ask} 'Sapevi che puoi fare una domanda più volte?'
                    {if} risposta {is} sì
                    {repeat} 2 {times} {print} 'Lo sapevi già!'
                    {else}
                    {repeat} 3 {times} {print} 'Hai imparato qualcosa di nuovo!'
                    ```
                story_text_2: |
                    Un'altra cosa interessante che puoi fare con il comando `{repeat}` è usare le variabili per decidere quante volte ripetere qualcosa. Nel codice di esempio puoi vedere che prima chiediamo alla persona quanti anni ha.
                    Poi, alla riga 3, la frase viene ripetuta 'eta' volte. Quindi abbiamo usato la variabile 'eta' con il comando `{repeat}`.
                example_code_2: |
                    ```
                    {print} 'Evviva! È il tuo compleanno!'
                    eta = {ask} 'Quanti anni compi?'
                    {repeat} eta {times} {print} 'Hip hip urrà!'
                    ```
                answer_code: |
                    Risposta libera
            9:
                story_text: |
                    ### Nel blocco o no?
                    In questo livello devi pensare bene a quali righe di codice devono stare nel blocco e quali no.
                    Per esempio, se vuoi cantare la canzone *Fra Martino*, vuoi che solo la riga 'dormi tu?' venga ripetuta due volte.
                    Questo significa che l'ultima riga non deve iniziare con l'indentazione, perché non fa parte del blocco.
                    Se inizi anche l'ultima riga con l'indentazione, la canzone verrà sbagliata.

                    ### Esercizio
                    Ogni riga del codice di esempio inizia con uno spazio vuoto. Togli gli spazi vuoti e cerca di capire quali righe hanno bisogno dell'indentazione e quali no, per ottenere la canzone di Fra Martino.
                example_code: |
                    ```
                    _ {print} 'Fra Martino campanaro'
                    _ {repeat} 2 {times}
                    _ {print} 'dormi tu?'
                    _ {print} 'Suona le campane, din don dan!'
                    ```
                answer_code: |
                    ```
                    {print} 'Fra Martino campanaro'
                    {repeat} 2 {times}
                        {print} 'dormi tu?'
                    {print} 'Suona le campane, din don dan!'
                    ```
    sleep_command:
        name: '{sleep}'
        default_save_name: pausa
        description: introduzione al comando {sleep}
        levels:
            2:
                story_text: |
                    Un altro comando nuovo di questo livello è `{sleep}`, che mette in pausa il programma per un secondo. Se scrivi un numero dopo il comando `{sleep}`, il programma resta in pausa per quel numero di secondi.

                    ### Esercizio
                    Esercitati con questo nuovo comando scrivendo un tuo codice in cui usi il comando `{sleep}` almeno 3 volte. Ogni comando `{sleep}` deve avere una durata della pausa diversa.
                example_code: |
                    ```
                    {print} Il mio colore preferito è...
                    {sleep} 2
                    {print} il verde!
                    ```
                answer_code: |
                    ```
                    {print} E a vincere è...
                    {sleep} 2
                    {print} Maria!
                    {print} Ha vinto...
                    {sleep} 1
                    {print} una ferrari nuova di zecca!
                    {print} e non è tutto!
                    {print} Vince anche...
                    {sleep} 5
                    {print} un viaggio in Francia!
                    ```
