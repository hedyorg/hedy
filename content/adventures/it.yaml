                    #disegniamo una figura con gli angoli:
                    {forward} 50
                    {turn} angolo
                    {forward} 50
                    {turn} angolo
                    {forward} 50
                    {turn} angolo
                    {forward} 50
                    {turn} angolo
                    {forward} 50
                    {turn} angolo
                    {forward} 50
                    {turn} angolo
                    ```
                answer_code: |
