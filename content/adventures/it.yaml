                    **Extra** Le pizze hanno dei condimenti. Chiedi ai clienti cosa vogliono.<br>
                    **Extra** I clienti vogliono qualcosa da bere? Chiedi anche questo! <br>
                story_text_2: |
                    In questo livello imparerai nuovi comandi per ampliare ancora di più il tuo codice.

                    ### Esercizio 1
                    Metti un `{and}` e un `{or}` nel punto giusto del programma.

                    ### Esercizio 2
                    Amplia il tuo ristorante con almeno un altro `{and}` e un altro `{or}`.
                    Per esempio, crea un buono sconto speciale valido solo per la pizza, oppure offri al tuo cliente una bevanda gratis
                    con patatine e pancake. Oppure qualcosa di completamente diverso, naturalmente!
                example_code_2: |
                    ```
                    prezzo = 10
                    cibo = {ask} 'Cosa vorresti mangiare?'
                    bevande = {ask} 'Cosa vorresti bere?'
                    {if} cibo {is} panino _ bevande {is} succo
                        {print} 'Questo è il nostro menu scontato'
                        prezzo = prezzo - 3
                    {if} bevande {is} acqua _ bevande {is} succo
                        {print} 'È una scelta sana'
                    {print} 'Il totale è ' prezzo ' euro'
                    ```
                answer_code: |
                    ```
                    {print} 'Benvenuti al Ristorante Chez Hedy!'
                    persone = {ask} 'Quante persone si uniranno a noi oggi?'
                    {print} 'Fantastico!'
                    prezzo = 0
                    {repeat} persone {times}
                        cibo = {ask} 'Cosa vorresti ordinare?'
                        {print} cibo
                        {if} cibo {is} patatine
                            prezzo = prezzo + 3
                            salsa = {ask} 'Che tipo di salsa vorresti con le tue patatine?'
                            {if} salsa {is} no
                                {print} 'senza salsa'
                            {else}
                                prezzo = prezzo + 1
                                {print} 'con ' salsa
                        {if} cibo {is} pizza
                            prezzo = prezzo + 4
                    {print} 'Il totale è ' prezzo ' euro'
                    {print} 'Buon appetito!'
                    ```
