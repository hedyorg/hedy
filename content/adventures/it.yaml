                story_text: |
                    Il nostro personale delle pulizie ha una lunga lista di compiti. Alcuni si fanno tutti i giorni, altri in un certo giorno, in una certa stagione o in una certa data. È molto confuso e a volte qualche compito viene dimenticato.
                    Riesci ad aiutarli scrivendo un programma che stampi la lista giusta dei compiti di quel giorno?
                    ### Esercizio
                    Il programma deve:
                    * Augurare il buongiorno.
                    * Chiedere che giorno della settimana è, in che mese siamo e che giorno del mese è.
                    * Stampare la lista giusta dei compiti di quel giorno.
                    I compiti da fare sono:
                    * Tutti i giorni: lavare il pavimento, pulire i bagni, aprire le tende
                    * Il lunedì e il giovedì: innaffiare le piante
                    * Il martedì e il venerdì: lavare i pavimenti
                    * Il sabato: lavare la macchina del caffè
                    * Il primo di ogni mese: lavare le finestre
                    * Il 7 di ogni mese: ricaricare i distributori automatici
                    * Il 14 di ogni mese: controllare le batterie degli allarmi antincendio
                    * Tutti i giorni nei mesi invernali: accendere i termosifoni
                    * Tutti i giorni nei mesi estivi: accendere l'aria condizionata
                answer_code: |
                    ```
                    {print}("Buongiorno!")

                    #chiediamo la data
                    giorno = {input}("Che giorno della settimana è?")
                    mese_attuale = {input}("In che mese siamo?")
                    data = {input}("Che giorno del mese è?")

                    #stampiamo la lista dei compiti
                    print("Ecco i tuoi compiti di oggi: ")

                    #decidiamo i compiti in base al giorno della settimana
                    {if} giorno == "lunedì" {or} giorno == "giovedì":
                        {print}("innaffia le piante")
                    {elif} giorno == "martedì" {or} giorno == "venerdì":
                        {print}("lava i pavimenti")
                    {elif} giorno == "sabato":
                        {print}("lava la macchina del caffè")

                    #decidiamo i compiti in base alla data
                    {if} data == 1:
                        {print}("lava le finestre")
                    {elif} data == 7:
                        {print}("ricarica i distributori automatici")
                    {elif} data == 14:
                        {print}("controlla le batterie degli allarmi antincendio")

                    #creiamo una lista dei mesi estivi e dei mesi invernali
                    mesi_estivi = ["aprile", "maggio", "giugno", "luglio", "agosto", "settembre"]
                    mesi_invernali = ["ottobre", "novembre", "dicembre", "gennaio", "febbraio", "marzo"]

                    #decidiamo i compiti in base all'estate o all'inverno
                    {for} mese {in} mesi_estivi:
                        {if} mese_attuale == mese:
                            {print}("accendi l'aria condizionata")
                    {for} mese {in} mesi_invernali:
                        {if} mese_attuale == mese:
                            {print}("accendi i termosifoni")
                    ```
