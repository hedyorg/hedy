            12:
                story_text: |
                    ### Esercizio
                    Ricrea i disegni con la tartaruga!

                    Per prima cosa definisci una funzione **per ogni forma** che vuoi usare nel braccialetto. Poi aggiungi le forme al braccialetto, così:

                    Programma per disegnare braccialetti <img src="https://github.com/hedyorg/hedy/assets/80678586/549d7f3a-c492-4b4a-b173-746eb3400951" width="500">
                example_code: |
                    Suggerimento per il programma per disegnare braccialetti
                    ```
                    #Creiamo le funzioni per le diverse forme:
                    {define} disegna_un_quadrato
                    _

                    #Disegniamo l'inizio del braccialetto:
                    {color} 'bianco'
                    {turn} -90
                    {forward} 300
                    {turn} 180

                    #Disegniamo le forme sul braccialetto:
                    {repeat} 5 {times}
                        {color} 'grigio'
                        {forward} 100
                        forma = {ask} 'Quale forma vuoi aggiungere al braccialetto?'
                        colore_scelto = {ask} 'Di che colore?'
                        {color} colore_scelto
                        {if} forma = 'quadrato'
                            {call} disegna_un_quadrato
                    ```
                answer_code: |
                    Braccialetto
                    ```
                    #definiamo tutte le forme
                    {define} disegna_un_quadrato
                        {repeat} 4 {times}
                            {turn} 90
                            {forward} 30

                    {define} disegna_un_triangolo
                        {repeat} 3 {times}
                            {turn} 120
                            {forward} 30

                    {define} disegna_una_stella
                        {repeat} 5 {times}
                            {turn} 144
                            {forward} 30

                    #iniziamo dal lato sinistro dello schermo
                    {color} 'bianco'
                    {turn} -90
                    {forward} 300
                    {turn} 180

                    #creiamo il braccialetto
                    {repeat} 5 {times}
                        {color} 'grigio'
                        {forward} 100
                        forma = {ask} 'Quale forma vuoi aggiungere al braccialetto?'
                        colore_scelto = {ask} 'Di che colore?'
                        {color} colore_scelto
                        {if} forma = 'quadrato'
                            {call} disegna_un_quadrato
                        {elif} forma = 'triangolo'
                            {call} disegna_un_triangolo
                        {elif} forma = "stella"
                            {call} disegna_una_stella
                    {color} 'grigio'
                    {forward} 100
                    ```
