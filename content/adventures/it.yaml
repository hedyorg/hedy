                    Non devi usare sempre il comando `{play}` per suonare una canzone intera: a volte vuoi suonare una sola nota.
                    Per esempio, se vuoi creare un quiz, puoi suonare una nota alta e allegra se la risposta è giusta e una nota bassa e triste se la risposta è sbagliata.

                    ### Esercizio
                    Completa la prima domanda aggiungendo una riga di codice che suona la nota C3 se viene data la risposta sbagliata.
                    Poi pensa ad altre 3 domande da aggiungere a questo quiz.
                example_code: |
                    ```
