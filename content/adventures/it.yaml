                story_text: |
                    Ora che hai imparato a usare le funzioni, imparerai a usare una funzione con un argomento.
                    Un **argomento** è una variabile che si usa dentro una funzione. Non si usa fuori dalla funzione.

                    Per esempio, in questo codice abbiamo programmato la prima strofa della canzone 'My Bonnie is over the ocean' (La mia Bonnie è di là dal mare).
                    In questo codice di esempio si usa l'argomento 'luogo'. Luogo è una variabile che si usa solo nella funzione, quindi è un argomento.
                    Per usare 'luogo' abbiamo scritto `luogo` tra le parentesi dopo `{def} canzone`.
                    Quando la funzione viene chiamata, il computer sostituisce l'argomento 'luogo' con il testo scritto tra le parentesi dopo `canzone`.

                    ### Esercizio
                    La strofa successiva di questa canzone dice:

                    Ieri notte, mentre ero sul mio cuscino

                    Ieri notte, mentre ero sul mio letto

                    Ieri notte, mentre ero sul mio cuscino

                    ho sognato che la mia Bonnie era morta



                    Riesci a programmare questa strofa nello stesso modo dell'esempio?
                example_code: |
                    ```
                    {def} canzone(luogo):
                        {print}('La mia Bonnie è di là dal ', luogo)

                    canzone('mare')
                    canzone('monte')
                    canzone('mare')
                    ```
                answer_code: |
                    ```
                    {def} canzone(luogo):
                        {print} ('Ieri notte, mentre ero sul mio ', luogo)

                    canzone('cuscino')
                    canzone('letto')
                    canzone('cuscino')
                    {print} "ho sognato che la mia Bonnie era morta"
                    ```
