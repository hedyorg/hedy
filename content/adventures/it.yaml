                    ### Esercizio 1
                    Il codice di esempio crea un quadrato. Modifica il codice in modo che crei un'altra figura, come un triangolo o un esagono.
                    Per farlo devi cambiare due righe di codice.
                    Suggerimento: un giro completo è di 360 gradi.

                    ### Esercizio 2
                    Ora crea un disegno composto da almeno due poligoni.
                example_code: |
                    ```
                    angolo = 90
                    {repeat} 4 {times}
                        {turn} angolo
                        {forward} 50
