                story_text: |
                    In questa avventura costruirai una calcolatrice che calcola la media dei tuoi voti. Se riesci a far funzionare la calcolatrice, puoi passare all'avventura successiva, in cui potrai aggiungere due funzionalità in più.

                    ### Esercizio 1
                    Riempi gli spazi vuoti per far funzionare la calcolatrice.
                    * Inizia dalla quarta riga: aggiungi una domanda per scoprire che voto ha preso lo studente.
                    * Nella quinta riga devi calcolare il totale di tutti i voti, quindi totale = totale + voto.
                    * Poi impostiamo il valore restituito. Vogliamo restituire la media, cioè il totale diviso per il numero di verifiche (4).
                    * Infine completiamo il codice chiamando la funzione alla riga 8.

                    Ce l'hai fatta? Fantastico! Vuoi aggiungere ancora altro alla tua calcolatrice? **Questa avventura continua nell'avventura successiva!**
                answer_code: |
                    ```
                    {def} calcola_media():
                        totale = 0
                        {for} i {in} {range}(1, 4):
                            voto = {input} ("Che voto hai preso nella verifica " i '?')
                            totale = totale + voto
                        {return} totale / 4

                    media = calcola_media()
                    {print} 'La tua media è ' media
                    ```
