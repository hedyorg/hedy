            12:
                story_text: |
                    In questo livello imparerai a usare le **funzioni**. Una funzione è un blocco di codice che puoi usare facilmente più volte. Le funzioni ci aiutano a organizzare pezzi di codice che possiamo usare ancora e ancora.
                    Per creare una funzione, usa `{define}` e dai un nome alla funzione. Poi metti tutte le righe che vuoi nella funzione in un blocco indentato sotto la riga con `{define}`.
                    Lascia una riga vuota nel codice, così è più bello e ordinato. Ottimo lavoro! Hai creato una funzione!

                    Ora, ogni volta che ci serve quel blocco di codice, basta usare il nome della funzione per chiamarla! Non dobbiamo scrivere di nuovo quel blocco di codice.

                    Guarda questo codice di esempio per una partita a Twister. La funzione 'prossimo_turno' contiene un blocco di codice che sceglie dove va messa ogni parte del corpo.

                    ### Esercizio
                    Completa questo codice impostando le 2 variabili `parte_scelta` e `colore_scelto`.
                    Poi scegli quante volte vuoi chiamare la funzione per far girare la ruota di Twister.

                    ### Esercizio 2
                    Migliora il tuo codice aggiungendo una variabile chiamata 'giocatori'. Usa la variabile per dare a ogni giocatore il suo comando nel gioco.
                    Per esempio: 'Ahmed, mano di destra sul verde' oppure 'Jessica, piede di sinistra sul giallo'.
                example_code: |
                    ```
                    #Le opzioni di Twister:
                    lati = 'di sinistra', 'di destra'
                    parti_del_corpo = 'mano', 'piede'
                    colori = 'rosso', 'blu', 'verde', 'giallo'

                    #Definiamo un turno di Twister:
                    {define} prossimo_turno
                        lato_scelto = lati {at} {random}
                        parte_scelta = parti_del_corpo _
                        colore_scelto = colori _
                        {print} parte_scelta ' ' lato_scelto ' sul ' colore_scelto

                    #Giochiamo una partita a Twister:
                    {print} 'Giochiamo a Twister!'
                    {repeat} _ _
                        {call} prossimo_turno
                        {sleep} 2
                    ```
                answer_code: |
                    ```
                    lati = 'di sinistra', 'di destra'
                    parti_del_corpo = 'mano', 'piede'
                    colori = 'rosso', 'blu', 'verde', 'giallo'
                    giocatori = 'Ahmed', 'Jessica'

                    {define} prossimo_turno
                        {for} giocatore {in} giocatori
                            lato_scelto = lati {at} {random}
                            parte_scelta = parti_del_corpo {at} {random}
                            colore_scelto = colori {at} {random}
                            {print} giocatore ', ' parte_scelta ' ' lato_scelto ' sul ' colore_scelto
                            {sleep} 2

                    {print} 'Giochiamo a Twister!'
                    {call} prossimo_turno
                    ```
            15:
                story_text: |
                    Nel livello 12 ti abbiamo presentato le funzioni. Dentro le funzioni scrivi un pezzo di codice.
                    Se chiami questa funzione, verrà eseguito tutto il codice al suo interno. Ottimo quando devi ripetere un pezzo di codice!

                    In questo livello continueremo con le funzioni e ti mostreremo come possono essere ancora più utili.
                    Iniziamo a scriverle come si fa in Python. Ora useremo `{def}` e aggiungeremo `():` dopo il nome della funzione.
                    Per chiamare la funzione, basta scrivere il nome della funzione seguito da (), come abbiamo fatto alla riga 8.

                    ### Esercizio
                    Aggiungi una funzione che suona una melodia triste (come C6-C5-C4) e chiama la funzione quando viene data una risposta sbagliata.
                example_code: |
                    ```
                    #Definiamo una melodia allegra e una triste:
                    {def} suona_melodia_allegra():
                        {play} C4
                        {play} C5
                        {play} C6

                    #Facciamo le domande:
                    risposta = {input}('Quanto fa 2 + 2?')
                    {if} risposta == 4:
                        {print}('Giusto!')
                        suona_melodia_allegra()
                    {else}:
                        {print}('Sbagliato!')
                    ```
                answer_code: |-
                    ```
                    {def} suona_melodia_allegra():
                        {play} C4
                        {play} C5
                        {play} C6

                    {def} suona_melodia_triste():
                        {play} C6
                        {play} C5
                        {play} C4

                    risposta = {input}('Quanto fa 2 + 2?')
                    {if} risposta == 4:
                        {print}('Giusto!')
                        suona_melodia_allegra()
                    {else}:
                        {print}('Sbagliato!')
                        suona_melodia_triste()
