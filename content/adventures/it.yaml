                    eta = {input}('Quanti anni hai?')
                    gia_giocato = {input}('Hai già fatto il tuo turno?')

                    # Quali premi può scegliere il giocatore?
                    {if} _ {and} _:
                        {print}('Puoi giocare')
                        punti = {input}('Quanti punti hai fatto?')
                        {print}('Puoi scegliere tra questi premi:')

                        {if} _ :
                            {print}('orsacchiotto')

                        {if} _ :
                            {print}('lecca-lecca')

                        {if} _ {and} _ :
                            {print}('videogioco')

                        {if} _ {and} :
                            {print}('palloncino')

                        premio_scelto = {input}('Quale premio vorresti?')
                        {print}('Complimenti per il tuo premio: ', premio_scelto)

                    {else}:
                        {print}('Mi dispiace, non puoi giocare')
                    ```
