adventures:
    story:
        name: Storia
        default_save_name: Storia
        description: Crea una storia breve
        levels:
            1:
                story_text: |
                    Nel livello 1 puoi creare una storia con un personaggio principale diverso che inserisci tu stesso.

                    Nella prima riga, usa `{ask}` e chiedi chi sarà il personaggio principale della storia.
                example_code: |
                    ```
                    {ask} Il personaggio principale di questa storia è
                    {print} Il personaggio principale ora camminerà nella foresta
                    {print} È un po' spaventato,{answer}
                    {print} Sente rumori terrificanti ovunque
                    {print} Ha paura che questa sia una foresta infestata
                    ```
                story_text_2: |
                    ### Esercizio
                    Ora crea la tua storia di almeno 6 righe di codice.
                    Questa storia non può essere uguale al codice di esempio.
                    Utilizza almeno un comando `{ask}` e un comando `{answer}`.
                    Puoi farlo su qualsiasi argomento che ti piace.
                    Se non riesci a pensare a un argomento, usa una delle nostre scelte: andare al cinema, una partita sportiva o una giornata allo zoo.
                answer_code: |
                    ```
                    {print} Un giorno ho visitato lo zoo
                    {ask} Quale animale ho visto per primo?
                    {print} Per primo ho visto: {answer}
                    {print} Poi ho visto un pinguino
                    {print} Stava pranzando
                    {ask} Cosa mangiava il pinguino?
                    {print} A pranzo il pinguino mangiava {answer}
                    ```
            2:
                story_text: |
                    Nel livello 2 puoi rendere la tua storia più divertente. Il nome del tuo personaggio principale ora può essere ovunque nella frase.

                    Devi programmare un po' di più per quello. Ora devi prima nominare il tuo personaggio principale.

                    Puoi quindi inserire quel nome ovunque in una frase.
                example_code: "```\nnome {is} {ask} Qual è il nome del personaggio principale?\n{print} nome sta per correre nel bosco\n{print} nome è un po' spaventato\n{print} All'improvviso sente un rumore inquietante...\n{sleep}\n{print} nome teme che questa sia un bosco infestato\n```"
                story_text_2: |
                    ### Esercizio
                    Ora è il momento di aggiungere le variabili alla storia che hai creato nel livello precedente.
                    Vai alla tua avventura della storia del livello 1 e copia il codice. Incolla il codice nella schermata di input di questo livello.

                    Questo codice non funzionerà in questo livello, perché non hai ancora usato le variabili.
                    Correggi il codice usando le variabili e `{is}` insieme al comando `{ask}`, come hai imparato in questo livello.

                    **Extra** Aggiungi un comando `{sleep}` al tuo codice per creare un po' di suspense nella tua storia.
                answer_code: |
                    ```
                    {print} Un giorno ho visitato lo zoo
                    primo_animale {is} {ask} Quale animale ho visto per primo?
                    {print} Per primo ho visto: primo_animale
                    {print} Poi ho visto un pinguino
                    {print} Stava pranzando
                    cibo {is} {ask} Cosa mangiava il pinguino?
                    {print} Il pinguino mangiava...
                    {sleep} 3
                    {print} cibo
                    ```
            3:
                story_text: |
                    Nel livello 3 puoi rendere la tua storia più divertente. Puoi usare la casualità per qualsiasi mostro, animale o ostacolo, in questo modo:
                story_text_3: |
                    Questo è un esempio del comando `{remove}` nella tua storia

                    ### Esercizio
                    Copia la tua storia dai livelli precedenti a questo livello.
                    In questo livello hai imparato 3 nuovi comandi `{at} {random}`, `{add} {to_list}` e `{remove} {from}`.
                    Aggiungi nuove righe di codice alla tua storia, in modo che tutti i nuovi comandi siano presenti almeno una volta nella tua storia.
                example_code: "```\nanimali {is} 🦔, 🐿, 🦉, 🦇\n{print} Ora sentono il verso di un animali {at} {random}\n```\n"
                story_text_2: "Il comando `{add}` può essere utile nella tua storia.\n"
                example_code_2: "```\n{print} Sentono un suono\nanimali {is} 🐿, 🦔, 🦇, 🦉\nanimale {is} {ask} Quale pensi che sia?\n{add} animale {to_list} animali\n{print} era un animali {at} {random}\n```\n"
                example_code_3: "```\n{print} His backpack got way too heavy.\n{print} Inside were a bottle of water, a flashlight and a brick.\nbag {is} water, flashlight, brick\ndump {is} {ask} Which item should he dump?\n{remove} dump {from} bag\n```\n"
                answer_code: |
                    ```
                    animali {is} leone, zebra, fenicottero
                    {print} Ciao ragazzi! Oggi andiamo allo zoo!
                    animale_preferito {is} {ask} Quale animale vuoi andare a vedere oggi?
                    {add} animale_preferito {to_list} animali
                    {sleep} 2
                    {print} Andiamo a vedere: animali {at} {random}
                    {sleep}
                    animale_odiato {is} {ask} Quale animale non vuoi vedere?
                    {remove} animale_odiato {from} animali
                    {print} Ora andiamo a vedere: animali {at} {random}!
                    ```
            4:
                story_text: |
                    ### Esercizio
                    Copia il codice di esempio e completalo aggiungendo virgolette sugli spazi vuoti nelle righe 1 e 2.
                    Gli spazi nelle righe 3 e 4 non devono essere sostituiti da virgolette, ma da un comando `{sleep}` e un comando `{clear}`. Puoi farlo funzionare?

                    ### Esercizio 2
                    Torna al livello precedente e copia il codice della storia. Fai funzionare il codice in questo livello aggiungendo virgolette nei punti giusti.
                    Attenzione: le variabili nella tua storia dovrebbero essere fuori dalle virgolette. Proprio come la seconda riga del codice di esempio. In quella riga il nome della variabile viene inserito fuori dalle virgolette.
                example_code: |
                    ```
                    nome {is}{ask} _ Come ti chiami? _
                    {print} _ Il personaggio principale si chiama _ nome
                    _
                    _
                    {print} nome _ ora camminerà nel bosco _
                    {print} nome _ è un po' spaventato _
                    animali {is} 🦔, 🐿, 🦉, 🦇
                    {print} _ Sente il suono di _ animali {at} {random}
                    {print} nome _ ha paura che questa sia una foresta infestata _
                    ```
                answer_code: |
                    ```
                    nome {is} {ask} 'Come ti chiami?'
                    {print} 'Il personaggio principale si chiama ' nome
                    {print} nome ' ora camminerà nel bosco'
                    {print} nome ' è un pochino spaventato'
                    animali {is} 🦔, 🐿, 🦉, 🦇
                    {print} 'Sente il verso di ' animali {at} {random}
                    {print} nome ' ha paura che questa sia una foresta infestata'
                    ```
            5:
                story_text: |
                    In questo livello puoi programmare diversi finali, che renderanno la tua storia ancora più divertente.
                    Nel codice di esempio puoi vedere come realizzare 2 finali diversi.

                    ### Esercizio 1
                    Scrivi un nuovo racconto di almeno 6 righe di codice su un argomento di tua scelta.
                    Nessuna ispirazione? Scegli uno di questi argomenti: un supereroe, una noiosa giornata scolastica, bloccato su un'isola deserta.

                    Ora dai al giocatore la possibilità di scegliere un finale bello o brutto, come nel codice di esempio.
                    Programma entrambi i finali.

                    ### Esercizio 2
                    Copia la storia che hai creato nella tua avventura narrativa nei livelli precedenti.
                    Trova un modo per aggiungere almeno 2 comandi `{if}` e `{else}` alla tua storia.
                    Questo può avvenire con un finale bello o brutto, ma puoi anche provare a trovare altri modi per inserire i comandi.
                example_code: |
                    ```
                    nome {is} {ask} 'Chi sta camminando nella foresta?'
                    {print} nome 'cammina nella foresta'
                    {print} nome 'incontra un mostro'
                    fine {is} {ask} 'Vuoi un lieto fine o un brutto finale?'
                    {if} fine {is} lieto {print} nome 'prende la spada e il mostro scappa velocemente'
                    {else} {print} 'Il mostro mangia' nome
                    ```
                answer_code: |
                    ```
                    nome {is} {ask} 'Chi è il supereroe?'
                    {print} "Oh no, l'aereo sta precipitando, chi ci salverà?"
                    {print} "Guarda chi sta volando nel cielo, è " nome
                    fine {is} {ask} "Vuoi salvare l'aereo o distruggerlo?"
                    {if} fine {is} salvare {print} nome " ha fatto atterrare l'aereo, ci ha salvati!"
                    {else} {print} "Oh no! " nome " sta distruggendo l'aereo, aiuto!"
                    ```
            8:
                story_text: |
                    In una storia, qualcuno dice le parole più volte. Ad esempio, quando qualcuno chiede aiuto o canta una canzone.
                    Puoi inserire tali ripetizioni nella tua storia, in questo livello con `{repeat}`.

                    ### Esercizio
                    Aggiungi ripetizione alla tua storia. Torna ai programmi salvati, scegli il programma della storia dal livello precedente e
                    trova una riga contenente `{print}` e ripetila!
                example_code: "```\n{print} 'Il principe continuava a chiedere aiuto'\n{repeat} 5 {times} {print} 'Aiuto!'\n{print} 'perché nessuno mi aiuta?'\n```\n"
                answer_code: |
                    {print} 'Tutti i bambini volevano andare allo zoo e continuavano a gridarlo!'
                    {repeat} 3 {times} {print} 'Andiamo allo zoo!'
            9:
                story_text: |
                    In questo livello puoi utilizzare più righe nei comandi `{if}`, in questo modo puoi migliorare il tuo lieto fine o il tuo triste finale!

                    ### Esercizio 1
                    Il codice di esempio mostra due finali diversi; uno in cui i personaggi saltano in una macchina del tempo e uno in cui no.
                    Completa gli spazi vuoti con almeno una frase per conclusione.
                    **Extra** Rendi la storia più lunga. Cosa succede nella storia? Puoi anche aggiungere un secondo `{ask}` con diverse opzioni.

                    ### Esercizio 2
                    Torna ai tuoi programmi salvati, scegli il tuo programma storia dal livello 5. Ora scrivi un finale bello e uno brutto di almeno tre righe ciascuno!
                example_code: |
                    ```
                    {print} 'OH NO! Il T-rex si sta avvicinando!'
                    end = {ask} 'Vuoi un finale felice o triste?'
                    {if} la fine {is} felice
                        {print} 'Appena in tempo Richard torna nella macchina del tempo!'
                        {print} _
                    {else}
                        {print} 'Oh no! Richard è troppo lento...'
                        {print}_
                    ```
                answer_code: |
                    ```
                    {print} 'OH NO! Il T-rex si sta avvicinando!'
                    fine = {ask} 'Vuoi un finale felice o triste?'
                    {if} fine {is} felice
                        {print} 'Appena in tempo Richard torna nella macchina del tempo!'
                        {print} 'Uff, per fortuna siamo salvi'
                        {print} 'Appena in tempo'
                    {else}
                        {print} 'Oh no! Richard è troppo lento...'
                        {print} 'Il T-rex lancia un RUGGITO fortissimo'
                        {print} 'Apre la bocca e divora Richard in un solo boccone'
                    ```
            10:
                story_text: |
                    In questo livello puoi utilizzare i comandi `{if}` e `{repeat}` all'interno di altri comandi `{if}` e `{repeat}`.
                    Questo ti offre molte opzioni e ti aiuta davvero a rendere la tua storia interattiva.

                    ### Esercizio 1
                    Completa il codice in modo che `{if}` funzioni correttamente.

                    ### Esercizio 2
                    Aggiungi un `{if}` e un `{else}` per la parte della storia in cui anche Robin torna a casa.

                    ### Esercizio 3
                    Torna alla tua storia di livello 8 e usa almeno due `{if}` all'interno di un altro `{if}`.
                example_code: |
                    ```
                    {print} 'Robin sta camminando in centro'
                    luogo = {ask} 'Robin entra in un negozio o torna a casa?'
                    {if} luogo {is} negozio
                        {print} 'Lei entra nel negozio.'
                        {print} "Robin vede un libro dall'aspetto interessante"
                        prenota = {ask} 'Robin compra il libro?'
                        {if} prenota {is} sì
                        _ {print} 'Robin compra il libro e torna a casa'
                        _ {else}
                        _ {print} 'Robin esce dal negozio e torna a casa'
                    {else}
                        {print} 'Robin va a casa'
                    ```
                story_text_2: |
                    Usando i comandi `{and}` e `{or}` puoi rendere le tue storie più varie. Puoi fare più domande e reagire alla combinazione delle risposte.

                    ### Esercizio 1
                    Guarda il codice di esempio e completalo. Poi aggiungi almeno altri 2 codici `{if}` con `{and}` o `{or}`.

                    ### Esercizio 2
                    Prendi una storia di un livello precedente e aggiungi un `{and}` o un `{or}`.
                example_code_2: |
                    ```
                    {print} 'La nostra eroina cammina nella foresta'
                    {print} 'Il sentiero si divide in due'
                    sentiero = {ask} 'Quale sentiero deve scegliere?'
                    arma = {ask} 'Quale arma estrae?'
                    {if} sentiero {is} sinistro {and} arma {is} spada
                        _
                    ```
                answer_code: |
                    ```
                    {print} 'Robin sta camminando in centro'
                    luogo = {ask} 'Robin entra in un negozio o torna a casa?'
                    {if} luogo {is} negozio
                        {print} 'Lei entra nel negozio.'
                        {print} "Robin vede un libro dall'aspetto interessante"
                        libro = {ask} 'Robin compra il libro?'
                        {if} libro {is} sì
                            {print} 'Robin compra il libro e torna a casa'
                        {else}
                            {print} 'Robin esce dal negozio e torna a casa'
                    {else}
                        {print} 'Robin torna a casa'
                        gelato = {ask} 'Si ferma a prendere un gelato tornando a casa?'
                        {if} gelato {is} sì
                            {print} 'Robin si ferma prima a prendere un gelato'
                            {print} 'Sceglie un sorbetto al limone'
                            {print} 'È buonissimo'
                        {else}
                            {print} 'Torna dritta a casa'
                    ```
                answer_code_2: |
                    ```
                    {print} 'La nostra eroina cammina nella foresta'
                    {print} 'Il sentiero si divide in due'
                    sentiero = {ask} 'Quale sentiero deve scegliere?'
                    arma = {ask} 'Quale arma estrae?'

                    {if} sentiero {is} sinistro {and} arma {is} spada
                        {print} 'nessun mostro osa avvicinarsi alla nostra eroina.'

                    {if} sentiero {is} sinistro {and} arma {is} fionda
                        {print} 'la nostra eroina viene attaccata da un orsogufo.'

                    {if} sentiero {is} destro {or} arma {is} libro_degli_incantesimi
                        {print} 'alla nostra eroina si avvicina un mago misterioso.'
                    ```
            11:
                story_text: |
                    In questo livello puoi usare il comando {for} nella tua storia. In questo modo potrete facilmente programmare il libro per bambini 'Orso bruno, Orso bruno, cosa vedi'.

                    ### Esercizio

                    Guarda <a href="https://www.yonkerspublicschools.org/cms/lib/NY01814060/Centricity/Domain/1621/Brown%20Bear%20Book.pdf"> la storia</a> se non la conosci e assicurati che sia stampato come nel libro.
                example_code: |
                    ```
                    animali = _ , _ , _
                    {print} 'Orso bruno, orso bruno'
                    {print} 'Cosa vedi?'
                    ```
                answer_code: |
                    ```
                    animali = un uccello rosso, una papera gialla, un cavallo blu, una rana verde, un gatto viola, un cane bianco, una pecora nera, un pesce rosso, la maestra
                    {print} 'Orso bruno, orso bruno'
                    {print} 'Cosa vedi?'
                    {for} animale {in} animali
                        {print} 'Vedo ' animale ' che mi guarda'
                        {print} animale ', ' animale
                        {print} 'Cosa vedi?'
                    {print} 'Vedo dei bambini che mi guardano'
                    {print} 'Bambini, bambini'
                    {print} 'Cosa vedete?'
                    {print} 'Vediamo '
                    {for} animale {in} animali
                        {print} animale
                    {print} 'che ci guardano'
                    {print} 'Ecco cosa vediamo!'
                    ```
            13:
                example_code: |
                    ```
                    nome = _ 
                    {print}('Benvenuti in questa storia!')
                    ```
                story_text: "Scriveremo un'altra storia, ma ora dobbiamo usare le parentesi con `{print}`.\n\n### Esercizio 1\nCrea una storia di almeno 5 frasi. Non devi ancora usare 'nome'.\n"
                answer_code: |
                    ```
                    nome = 'Hedy'
                    {print}('Benvenuti in questa storia!')
                    {print}('Tanto tempo fa viveva un pappagallo di nome ', nome '.')
                    {print}(nome, ' adorava programmare!')
                    {print}("Purtroppo gli altri pappagalli non sapevano programmare.")
                    {print}('Un giorno ', nome, ' decise di insegnare a programmare agli altri pappagalli.')
                    {print}('Le lezioni ebbero un enorme successo tra gli altri pappagalli!')
                    ```
            16:
                story_text: "Usando la funzione `{while}`  puoi rendere le tue storie più interessanti. Per esempio puoi usare `{while} game == 'on'` in modo da giocare fino alla fine della partita.\nO puoi usare `{while} sword == 'lost'` in modo che il giocatore non possa continuare la partita fino a quando non hanno trovato qualcosa.\n\n###  Esercizio\nIl codice di esempio ti mostra come usare la funzione `{while}`  in una storia. Ora **pensa ad un tuo scenario** in cui il giocatore deve trovare qualcosa per continuare.\n"
                example_code: "```\nkeys = 'lost'\n{print} 'You are standing in your garden and you have lost your keys.'\n{print} 'Where do you want to look for them?'\n{print} 'You can choose: tree, flowerbed, rock, postbox'\n{while} keys == 'lost'\n    location = {ask} 'Where do you want to look?'\n    {if} location == 'flowerbed'\n        {print} 'Here they are!'\n        keys = 'found'\n    {else}\n        {print} 'Nope they are not at the ' location\n{print} 'Now you can enter the house!'\n```\n"
                answer_code: |
                    ```
                    racchette = 'perse'
                    {print}('Sei con i tuoi amici e volete giocare a tennis, ma non ti ricordi dove hai messo le racchette.')
                    {print}('Dove vuoi cercarle?')
                    {print}('Puoi scegliere: camera, capanno, armadio, scrivania')
                    {while} racchette == 'perse':
                        luogo = {input}('Dove vuoi cercare?')
                        {if} luogo == 'scrivania':
                            {print}('Eccole! Hai trovato 6 racchette!')
                            racchette = 'trovate'
                        {else}:
                            {print}('Niente, non sono qui: ', luogo)
                    {print}('Ora puoi giocare a tennis con tutti i tuoi amici.')
                    ```
            6:
                story_text: |-
                    Ora che puoi usare `{elif}` puoi creare una storia ancora più interattiva! Potresti creare più personaggi con diversi tratti per esempio.
                    Oppure potresti far scegliere al tuo giocatore quale strada prendere, quale porta apire o quale pozione magica bere...

                    ### Esercizio
                    Crea la tua storia con 3 o più opzioni usando {elif}.
                example_code: |
                    ```
                    personaggio {is} {ask} 'Chi ti aiuterà in questa sfida?'
                    {if} personaggio {is} 'Daisy'
                    {print} 'Hai scelto Daisy! Lei è la più intelligente di tutti!'
                    {elif} personaggio {is} 'Jason'
                    {print} 'Hai scelto Jason! Lui è il più forte di tutti!'
                    {elif} personaggio {is} 'Sam'
                    {print} 'Hai scelto Sam! Lui è il più veloce di tutti!'
                    ```
                answer_code: |
                    Risposta libera
    add_remove_command:
        default_save_name: aggiungi_rimuovi_comando
        description: introducendo {add} {to_list} e {remove} {from}
        levels:
            3:
                story_text: |
                    ## Aggiungere a
                    Puoi aggiungere elementi all'elenco con il comando `{add} {to_list}`. Per aggiungere un elemento a una lista puoi semplicemente digitare: `{add} penguin {to_list} animals` oppure puoi usare il comando `{ask}` come nel codice di esempio.
                example_code: |
                    ```
                    animali {is} cane, gatto, canguro
                    like {is} {ask} Qual è il tuo animale preferito?
                    {add} mi piace {to_list} animali
                    {print} Scelgo gli animali {at} {random}
                    ```
                story_text_2: |
                    ## Rimuovere da
                    Se puoi aggiungere elementi a un elenco, ovviamente puoi anche rimuoverli. Questo viene fatto con il comando `{remove} {from}`.
                example_code_2: |
                    ```
                    animali {is} cane, gatto, canguro
                    non_mi_piace {is} {ask} Quale animale non ti piace?
                    {remove} non_mi_piace {from} animali
                    {print} Scelgo gli animali {at} {random}
                    ```
                story_text_3: |
                    ### Esercizio
                    Prova i nuovi comandi in questo ristorante virtuale. Aggiungi il gusto che il giocatore desidera alla lista e rimuovi i sapori ai quali è allergico.
                example_code_3: |
                    ```
                    {print} Milkshake misterioso
                    Sapori {is} fragola, cioccolato, vaniglia
                    Speranza {is} {ask} Quale gusto speri di avere?
                    _
                    Allergie {is} {ask} Hai qualche allergia ai sapori?
                    _
                    {print} Ottieni un milkshake con il sapore di {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} Milkshake misterioso
                    Sapori {is} fragola, cioccolato, vaniglia
                    Speranza {is} {ask} Quale gusto speri di avere?
                    {add} Speranza {to_list} Sapori
                    Allergie {is} {ask} Hai qualche allergia ai sapori?
                    {remove} Allergie {from} Sapori
                    {print} Ottieni un milkshake con il sapore di Sapori {at} {random}
                    ```
        name: '{add} {to_list} & {remove} {from}'
    ask_command:
        description: Introduzione comando {ask}
        levels:
            1:
                story_text: |
                    ## Il comando `{ask}`
                    Ora che sai usare il comando `{print}`, sei pronto per imparare il prossimo comando: `{ask}`. Con il comando `{ask}`, puoi fare una domanda. Guarda:
                example_code: |
                    ```
                    {print} Ciao!
                    {ask} Come ti chiami?
                    ```
                story_text_2: |
                    ## La risposta `{answer}`
                    Se vuoi stampare la risposta, puoi farlo così:
                example_code_2: |
                    ```
                    {print} Ciao!
                    {ask} Come ti chiami?
                    {print} Ciao, {answer}!
                    ```
                story_text_3: |
                    ### Esercizio
                    Prova il comando `{ask}` e `{answer}`. Per prima cosa, completa gli spazi vuoti per far funzionare questo programma.
                    Poi fai altre 2 domande con il comando `{ask}` e, dopo ogni `{ask}`, usa `{answer}` per stampare la risposta sullo schermo.
                example_code_3: |
                    ```
                    _ Come stai?
                    _ Stai _
                    ```
                answer_code: |
                    ```
                    {ask} Come stai?
                    {print} Stai {answer}
                    {ask} Qual è il tuo sport preferito?
                    {print} Ti piace {answer}
                    {ask} Qual è lo sport che ti piace di meno?
                    {print} {answer} è lo sport che ti piace di meno
                    ```
            2:
                story_text: |
                    ## Il comando `{ask}`
                    Ora che possiamo utilizzare le **variabili** nei nostri codici, non abbiamo più bisogno del comando `{echo}`.
                    Possiamo utilizzare le variabili per memorizzare le risposte alle nostre domande e in questo modo possiamo utilizzare la risposta a più domande nei nostri codici.
                    Guarda:

                    In questo modo il tuo codice diventa interattivo!
                example_code: |
                    ```
                    name {is} {ask} Come ti chiami?
                    {print} Ciao name
                    age {is} {ask} Quanti anni hai?
                    {print} name ha age anni.
                    ```
