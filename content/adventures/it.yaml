                        {play} G
                        {play} G
                        {play} F
                        {play} F
                        {play} E
                        {play} E
                        {play} D
                        {sleep}

                    #Suoniamo le righe della canzone:
                    {call} prima_riga
                    _
                    _
                    ```
                answer_code: |
