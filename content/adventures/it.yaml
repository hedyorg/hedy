                    Dopo un'operazione, a volte i nostri pazienti sentono molto dolore. In questi casi possiamo dare loro una pompa di morfina, con cui possono somministrarsi da soli un po' di morfina quando sentono dolore.
                    Queste pompe vanno programmate con molta attenzione, così i pazienti non si danno troppa morfina. Riesci a programmare una pompa di morfina per noi?
                    ### Esercizio
                    Il programma deve:
                    * Chiedere quanti millilitri di morfina ha già ricevuto oggi il paziente.
                    * Dire di consegnare il dispositivo al paziente.
                    * Chiedere al paziente quanto dolore sente, su una scala da 1 a 10.
                    * Dire al paziente di premere il tasto x se vuole altra morfina.
                    * Se viene premuto x, chiamare la funzione con gli argomenti livello_dolore e livello_morfina.
                    * La funzione deve stampare 'Riceverai altri 20 ml di morfina' finché il livello di dolore del paziente è maggiore o uguale a 6 e il livello di morfina è minore di 120.
                    * Dopo aver somministrato la morfina, il programma deve restare in pausa per 2 minuti (mentre provi il programma puoi usare 2 secondi).
                    * Dopo quei 2 minuti, il livello di morfina deve essere aggiornato (+20 ml) e il livello di dolore deve essere aggiornato chiedendo al paziente come si sente adesso.
                    * Se il livello di morfina è troppo alto o il paziente non sente più dolore, il programma deve dire al paziente che non riceverà altra morfina. Se sente molto dolore, digli di chiamare il personale infermieristico.
                    * Dire al paziente che ora la pompa si spegnerà e di premere x se ha bisogno che la pompa riparta.
                answer_code: |-
                    ```
                    {print}('Pompa di morfina')
                    livello_morfina = {input}('Quanti ml di morfina ha già ricevuto oggi il paziente?')
                    {print}('ora consegna questo dispositivo al paziente')

                    livello_dolore = {input}('Quanto dolore senti, da 1 a 10?')
                    {print}('Premi X per ricevere la morfina')

                    {define} morfina(livello_dolore, livello_morfina):
                        {print}('Riceverai altri 20 ml di morfina')
                        {sleep} 2
                        livello_morfina = livello_morfina + 20
                        livello_dolore = {input}('Quanto dolore senti, da 1 a 10?')
                        {print}('Ora la pompa si spegnerà')
                        {return} livello_morfina
                        {return} livello_dolore
                        {sleep} 2

                    {for} i {in} {range} (1,10):
                        attendi_x = {input}('Premi X per ricevere la morfina')
                        {if} attendi_x == 'x'
                            {if} livello_dolore >= 6 {and} livello_morfina <120:
                                livello_morfina = morfina(livello_dolore, livello_morfina)
                                livello_dolore = morfina(livello_dolore, livello_morfina)
                            {else}:
                                {print}('Ora non sarebbe sicuro somministrare altra morfina')
                                {print}('Chiama il personale infermieristico se senti troppo dolore')
                    ```
