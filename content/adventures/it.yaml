            7:
                story_text: |
                    Il nostro personale infermieristico tiene sotto controllo il bilancio idrico dei pazienti. Il bilancio idrico è la quantità di liquidi che il paziente ha assunto oggi (bevendo, mangiando o con la flebo) meno la quantità di liquidi che ha perso oggi (urinando o vomitando).
                    Il bilancio idrico deve restare positivo. Se il bilancio idrico è negativo, bisogna somministrare al paziente altri liquidi con la flebo.
                    Riesci ad aiutare il personale infermieristico creando uno strumento per calcolare il bilancio idrico dei pazienti?
                    ### Esercizio
                    Il programma deve:
                    * Chiedere quanti liquidi ha assunto il paziente bevendo durante la giornata.
                    * Chiedere quanti liquidi ha assunto il paziente mangiando durante la giornata.
                    * Chiedere quanti liquidi ha assunto il paziente con la flebo durante la giornata.
                    * Chiedere quanti liquidi ha perso il paziente urinando durante la giornata.
                    * Chiedere quanti liquidi ha perso il paziente vomitando durante la giornata.
                    * Calcolare il bilancio idrico del paziente e mostrarlo.
                    * Ricordare di controllare se il bilancio è positivo o negativo, per decidere se oggi il paziente ha bisogno di altre flebo oppure no.
                answer_code: |
                    ```
                    entrate_bevande = {ask} 'quanti liquidi ha assunto il paziente bevendo?'
                    entrate_cibo = {ask} 'quanti liquidi ha assunto il paziente mangiando?'
                    entrate_flebo = {ask} 'quanti liquidi ha assunto il paziente con la flebo?'
                    uscite_urina = {ask} 'quanti liquidi ha perso il paziente urinando?'
                    uscite_vomito = {ask} 'quanti liquidi ha perso il paziente vomitando?'
                    bilancio_idrico = entrate_bevande + entrate_cibo + entrate_flebo - uscite_urina - uscite_vomito
                    {print} "Il bilancio idrico del paziente è " bilancio_idrico
                    {print} 'Controlla se il bilancio è positivo o negativo per decidere se oggi il paziente ha bisogno di altre flebo oppure no'
                    ```
