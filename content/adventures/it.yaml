            10:
                story_text: |
                    Con il comando `{and}` puoi accorciare il tuo codice di sasso, carta, forbici! Guarda il codice di esempio.

                    ### Esercizio
                    Completa il codice in modo che ci sia sempre un vincitore. Esegui il codice alcune volte per verificare che venga sempre stampato chi ha vinto.
                example_code: |
                    ```
                    #Il computer e il giocatore scelgono sasso, carta o forbici:
                    opzioni = sasso, carta, forbici
                    la_tua_scelta = {ask} 'Cosa scegli?'
                    scelta_computer = opzioni {at} {random}
                    #Stampiamo le opzioni scelte:
                    {print} 'Hai scelto ' la_tua_scelta
                    {print} 'Il computer sceglie ' scelta_computer
                    #Stampiamo chi ha vinto:
                    {if} scelta_computer {is} la_tua_scelta
                        {print} 'Pareggio'
                    {elif} scelta_computer {is} sasso {and} la_tua_scelta {is} carta
                        {print} 'Hai vinto!'
                    {elif} scelta_computer {is} sasso {and} la_tua_scelta {is} forbici
                        {print} 'Vince il computer!'
                    _
                    ```
                answer_code: |
                    ```
                    opzioni = sasso, carta, forbici
