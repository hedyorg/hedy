            15:
                story_text: |
                    ### Esercizio
                    Crea un programma che chiede al giocatore quanti lati deve avere la sua figura e poi crea quella figura.
                    La figura nell'immagine è l'output quando il giocatore inserisce 10.

                    <div class="w-full flex flex-row gap-2">
                     <img src="https://github.com/hedyorg/hedy/assets/80678586/ee32f40e-dea1-4e7c-a813-3ef63671254b" width="300">
                     <img src="https://github.com/hedyorg/hedy/assets/80678586/3621bf77-527d-41e8-a44f-c5a21bb4ffd2" width="200">
                    </div>
                example_code: |
                    ```
                    {def} calcola_gradi(numero_lati):
                        gradi = 360 / _
                        _ gradi

                    {def} disegna_figura(gradi, numero_lati):
                        {for} i {in} {range} _
                            {forward} 70
                            {turn} _

                    numero_lati = {input}('Quanti lati vuoi che abbia la figura?')
                    gradi = calcola_gradi(numero_lati)

                    _
                    _
                    ```
                answer_code: |
                    ```
                    {def} calcola_gradi(numero_lati):
                        gradi = 360 / numero_lati
                        {return} gradi

                    {def} disegna_figura(gradi, numero_lati):
                        {for} i {in} {range} (1, numero_lati):
                            {forward} 70
                            {turn} gradi

                    numero_lati = {input}('Quanti lati vuoi che abbia la figura?')
                    gradi = calcola_gradi(numero_lati)

                    calcola_gradi(numero_lati)
                    disegna_figura(gradi, numero_lati)
                    ```
