            7:
                story_text: |
                    In questo livello puoi usare la matematica per calcolare il prezzo totale dell'ordine del cliente, e così il tuo ristorante virtuale diventa più realistico.
                    Ma puoi aggiungere al tuo ristorante virtuale anche molte altre cose, per esempio altre portate.

                    ### Esercizio
                    Puoi aggiungere molte altre cose al tuo ristorante virtuale. Per esempio, riesci a...
                    - chiedere quante persone vengono e moltiplicare il prezzo per quel numero?
                    - aggiungere un'altra portata?
                    - fare uno sconto a chi inserisce un codice sconto (segreto)?
                    - aggiungere un menu per bambini?
                    - pensare ad altre cose divertenti da aggiungere?
                example_code: |
                    Puoi creare un semplice codice per un ristorante, così:
                    ```
                    #Accogliamo il cliente:
                    {print} 'Benvenuti al Ristorante Chez Hedy'
                    {print} 'Ecco il nostro menu:'
                    {print} 'I nostri piatti principali sono pizza, lasagne o spaghetti'
                    principale = {ask} 'Quale piatto principale vorresti?'
                    #Calcoliamo il prezzo:
                    prezzo = 0
                    {if} principale {is} pizza
                    prezzo = 10
                    {if} principale {is} lasagne
                    prezzo = 12
                    {if} principale {is} spaghetti
                    prezzo = 8
                    #Diciamo il prezzo al cliente:
