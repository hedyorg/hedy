    haunted:
        name: Casa stregata
        default_save_name: Casa stregata
        description: Scappa dalla casa stregata
        levels:
            1:
                story_text: |
                    In questa avventura lavori per creare un gioco in cui devi scappare da una casa stregata scegliendo la porta giusta.
                    Se scegli la porta giusta ti salvi, altrimenti un mostro terribile potrebbe...

                    Nel livello 1 iniziamo il gioco della casa stregata inventando una storia spaventosa e chiedendo al giocatore quale porta sceglie nella casa stregata.
                example_code: |
                    ```
                    {print} Dove mi trovo?
                    {print} Ricordo che un mio amico mi ha detto di entrare nella vecchia villa...
                    {print} e all'improvviso è diventato tutto buio.
                    {print} Ma perché mi trovo sul pavimento...?
                    {print} Mi fa male la testa, come se mi avessero colpito con una mazza da baseball!
                    {print} Cos'è questo rumore?
                    {print} Oh no! Ho la sensazione che in questa casa ci sia qualcun altro!
                    {print} Devo uscire da qui!
                    {print} Davanti a me ci sono 3 porte..
                    {ask} Quale porta devo scegliere?
                    {print} Scelgo la porta {answer}
                    {print} ...?
                    ```
                story_text_2: |
                    ### Esercizio
                    Copia il codice di esempio nella schermata di input cliccando sul pulsante giallo.
                    Ora completa la storia aggiungendo almeno 5 righe di codice.
                    Ricorda di iniziare ogni riga di codice con `{print}` o `{ask}`.
                answer_code: |
                    ```
                    {print} Dove mi trovo?
                    {print} Ricordo che un mio amico mi ha detto di entrare nella vecchia villa...
                    {print} e all'improvviso è diventato tutto buio.
                    {print} Ma perché mi trovo sul pavimento...?
                    {print} Mi fa male la testa, come se mi avessero colpito con una mazza da baseball!
                    {print} Cos'è questo rumore?
                    {print} Oh no! Ho la sensazione che in questa casa ci sia qualcun altro!
                    {print} Devo uscire da qui!
                    {print} Davanti a me ci sono 3 porte..
                    {ask} Quale porta devo scegliere?
                    {print} Scelgo la porta {answer}
                    {print} Apro la porta con cautela
                    {print} Guardo dietro l'angolo
                    {print} Oh no!
                    {print} C'è un branco di lupi affamati che mi guarda
                    {print} Chiudo subito la porta.
                    ```
            2:
                story_text: |
                    In questa casa stregata puoi scegliere i tuoi mostri con le emoji. Naturalmente potresti usare anche le parole.
                example_code: |
                    ```
                    mostro_1 {is} 👻
                    mostro_2 {is} 🤡
                    mostro_3 {is} 👶
                    {print} Entri nella casa stregata.
                    {print} All'improvviso vedi un mostro_1
                    {print} Corri nell'altra stanza...
                    {print} Ma lì ti aspetta un mostro_2!
                    {print} Oh no! Corri in cucina.
                    {print} Ma appena entri, mostro_3 ti attacca!
                    ```
                story_text_2: |
                    ### Esercizio
                    Nell'esempio qui sopra i mostri sono decisi in anticipo. Quindi ogni volta che esegui il codice, l'output è lo stesso.
                    Riesci ad aggiungere dei comandi `{ask}` per rendere interattiva la casa stregata e far scegliere ai giocatori i mostri che incontrano?
                example_code_2: |
                    ```
                    mostro_1 {is} _
                    mostro_2 {is} _
                    mostro_3 {is} _
                    {print} Entri nella casa stregata.
                    {print} All'improvviso vedi un mostro_1
                    {print} Corri nell'altra stanza...
                    {print} Ma lì ti aspetta un mostro_2!
                    {print} Oh no! Corri in cucina.
                    {print} Ma appena entri, mostro_3 ti attacca!
                    ```
                answer_code: |
                    ```
                    mostro_1 {is} {ask} Quale mostro ti fa un po' paura?
                    mostro_2 {is} {ask} Di quale altro mostro hai paura?
                    mostro_3 {is} {ask} Qual è il mostro più spaventoso che ti viene in mente?
                    {print} Entri nella casa stregata.
                    {print} All'improvviso vedi un mostro_1
                    {print} Corri nell'altra stanza...
                    {print} Ma lì ti aspetta un mostro_2!
                    {print} Oh no! Corri in cucina.
                    {print} Ma appena entri, mostro_3 ti attacca!
                    ```
            3:
                story_text: |
                    Nei livelli precedenti hai creato l'introduzione del tuo gioco della casa stregata, ma come avrai notato la storia finiva sempre male.
                    In questo livello puoi rendere la tua storia più interattiva cambiando il finale del gioco: a volte verrai mangiato, a volte riuscirai a scappare!
                    Lascia decidere a Hedy, a caso!

                    ### Esercizio
                    Copia i codici di esempio e riempi gli spazi vuoti per farli funzionare!

                    **Extra** Questa storia è piuttosto semplice: magari puoi renderla più spaventosa aggiungendo una storia più emozionante.
                    Inoltre per ora i finali possibili sono pochi: dietro le porte ci sono solo 3 opzioni. Magari ti vengono in mente altri mostri da aggiungere alla lista!
