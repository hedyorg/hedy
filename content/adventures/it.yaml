                    Inserisci i comandi giusti dopo {if} per far funzionare il programma.

                    * Il programma deve funzionare se il giocatore non ha ancora fatto il suo turno e ha meno di 18 anni.
                    * Poi deve comparire una lista con i premi tra cui il giocatore può scegliere.
                    * Se il giocatore ha abbastanza punti per un premio (guarda la lista dei premi), quel premio deve essere stampato.
                    * Il giocatore può vincere il videogioco solo se ha almeno 14 anni.
                    * Il giocatore può vincere il palloncino solo se ha al massimo 5 anni.
                example_code: |
                    ```
                    #lista dei premi
                    palloncino = 1
                    lecca_lecca = 2
                    videogioco = 8
