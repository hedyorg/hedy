            14:
                story_text: |
                    ### Esercizio
                    Guarda il codice di esempio. È un programma per esercitarsi con il vocabolario francese. Ora crea un tuo programma per esercitarti con il vocabolario di una nuova lingua.
                    Se non conosci altre lingue, puoi usare Google Traduttore oppure le emoji e la tua lingua madre.
                example_code: |
                    ```
                    #Liste di parole francesi e delle loro traduzioni:
                    parole_francesi = ['bonjour', 'ordinateur', 'pomme de terre']
                    traduzione = ['ciao', 'computer', 'patata']

                    #Esercitiamoci con le parole:
                    punteggio = 0
                    {for} i {in} {range}(1,3):
                        risposta = {input}('Cosa significa ', parole_francesi[i], '?')
                        corretta = traduzione[i]
                        {if} risposta == corretta:
                            {print}('Giusto!')
                            punteggio = punteggio + 1
                        {else}:
                            {print}('Sbagliato, ', parole_francesi[i], ' significa ', traduzione[i])

                    #Stampiamo il punteggio:
                    {print}('Hai dato ', punteggio, ' risposte giuste.')
                    ```
                answer_code: |
                    ```
                    parole_spagnole = ['hola', 'vale', 'te quiero']
                    traduzione = ['ciao', 'va bene', 'ti voglio bene']
                    punteggio = 0
                    {for} i {in} {range}(1,3):
                        risposta = {input}('Cosa significa ', parole_spagnole[i], '?')
                        risposta_corretta = traduzione[i]
                        {if} risposta == risposta_corretta:
                            {print}('Giusto!')
                            punteggio = punteggio + 1
                        {else}:
                            {print}('Sbagliato, ', parole_spagnole[i], ' significa ', traduzione[i])
                    {print}('Hai dato ', punteggio, ' risposte giuste.')
                    ```
