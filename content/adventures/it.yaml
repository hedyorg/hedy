                    Puoi dare alla funzione un calcolo e lei ti darà il risultato. Questo risultato si chiama **valore restituito**.

                    Per esempio, in questo codice la funzione calcola_nuovo_prezzo calcola il nuovo prezzo di qualsiasi articolo. Ti darà il nuovo prezzo come valore restituito.

                    ### Esercizio
                    Completa questo codice. Abbiamo già creato per te la variabile nuovo_prezzo: devi solo impostarla.
                    Devi completare la riga di codice chiamando la funzione che calcola il nuovo prezzo.
                example_code: |
                    ```
                    {def} calcola_nuovo_prezzo(importo, percentuale):
                        percentuale = percentuale / 100
                        importo_sconto = importo * percentuale
                        {return} importo - importo_sconto

                    vecchio_prezzo = {input}('Quanto costa secondo il cartellino?')
                    sconto = {input}('Qual è la percentuale di sconto?')

                    nuovo_prezzo = _ calcola_nuovo_prezzo(vecchio_prezzo, _)
                    {print}('Il nuovo prezzo è ', nuovo_prezzo, ' euro')
                    ```
