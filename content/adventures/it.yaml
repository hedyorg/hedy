            12:
                story_text: |
                    Usa le funzioni nelle tue canzoni! Come vedi nel codice di esempio, puoi creare una funzione per ogni riga di Twinkle Twinkle Little Star. Dopo aver programmato le prime tre righe, devi solo chiamare le funzioni nell'ordine in cui vuoi suonarle.

                    ### Esercizio
                    Completa la canzone Twinkle Twinkle Little Star.
                    Poi ripensa a tutte le canzoni che hai programmato nei livelli precedenti: riesci a rendere anche quei codici migliori e più corti usando le funzioni?
                example_code: |
                    ```
                    #Definiamo la prima riga della canzone:
                    {define} prima_riga
                        {play} C
                        {play} C
                        {play} G
                        {play} G
                        {play} A
                        {play} A
                        {play} G
                        {sleep}

