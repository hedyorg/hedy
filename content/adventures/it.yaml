                    ```
                    opzioni = [1, 2, 3, 4, 5, 6]
                    {print}('Lancia un 6 il più velocemente possibile!')
                    lanciato = 0
                    tentativi = 0
                    _
                    _
                    _
                    _
                    _
                    {print}('Sì! Hai lanciato un 6 in ', tentativi, ' tentativi.')
                    ```
                answer_code: |
                    ```
                    opzioni = [1, 2, 3, 4, 5, 6]
                    {print}('Lancia un 6 il più velocemente possibile!')
                    lanciato = 0
                    tentativi = 0
                    {while} lanciato == 0:
                        numero = opzioni[{random}]
                        tentativi = tentativi + 1
                        {if} numero = 6:
                            lanciato = 1
                            {print}('Hai lanciato un 6 in ', tentativi, ' tentativi!')
                        {else}:
                            {print}('Non hai lanciato un 6, hai lanciato ', numero)
                        {sleep} 1
                    ```
