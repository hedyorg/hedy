                    {if} attrazione == 'Montagne russe':
                        paura = {input}('Soffri di vertigini?')
                        {if} paura == 'sì':
                            {print}('Mi dispiace, è meglio che tu resti con i piedi per terra.')
                        {elif} _ :
                            altezza = _

                    {if} attrazione == 'Giostra':
                        _

                    ```
