                    * Togliere un punto e dire che la risposta è sbagliata quando sbagliano.
                    * Se la risposta è sbagliata, mostrare anche la risposta giusta per un paio di secondi, cancellarla dallo schermo e continuare a fare la domanda finché non rispondono correttamente.
                    * Continuare a giocare finché lo studente non ha risposto correttamente a tutte le domande.
                    * Mostrare allo studente il punteggio finale.
                    * Dare allo studente un commento in base al punteggio: 12 punti: Fantastico!, 8 - 11 punti: Bel lavoro, continua a esercitarti!, 7 o meno: Dovresti studiare di più!
                answer_code: |
                    ```
                    punti = 0
                    termini_latini = ['corpus', 'caput',  'ocolus',  'nasus', 'auris', 'os', 'collum',  'manus', 'pectus',  'humerus', 'venter', 'tergum']
                    termini_italiani = ['corpo', 'testa', 'occhio', 'naso', 'orecchio', 'bocca', 'collo', 'mano', 'petto', 'spalla', 'stomaco', 'schiena']

                    {for} i {in} {range}(1, 12):
                        risposta_corretta = termini_italiani[i]
                        risposta = 0
                        {while} risposta != risposta_corretta:
                            risposta = {input}('Come si dice in italiano ', termini_latini[i], '?')
                            {if} risposta != risposta_corretta:
                                {print}('Sbagliato')
                                {print}('La risposta giusta per ', termini_latini[i], ' è ', termini_italiani[i])
                                {sleep} 3
                                {clear}
                                punti = punti - 1
                        punti = punti + 1
                        {print}('Giusto!')

                    {print}("Complimenti, hai ripassato tutti i termini!")
                    {print}('Il tuo punteggio è:', punti)

                    {if} punti == 12:
                        {print}('Fantastico!')

                    {if} punti <=7:
                        {print}('Dovresti studiare di più!')
                    {else}:
                        {print}('Bel lavoro, continua a esercitarti!')
                    ```
