            15:
                story_text: |
                    ### Esercizio 2
                    **Questa è la seconda parte di questa avventura.** L'avventura inizia nell'avventura precedente.
                    Naturalmente non vorrai sempre calcolare la media di 4 verifiche. Potresti voler calcolare la media di 10 verifiche, oppure solo di 2...
                    Possiamo risolvere questo problema aggiungendo l'argomento e la variabile 'numero_verifiche'.
                    * Inizia una nuova riga alla riga 3. Imposta l'argomento numero_verifiche chiedendo allo studente quante verifiche ha fatto.
                    * Cambia il 4 alla riga 4 con il nuovo argomento numero_verifiche.
                    * Infine, cambia il 4 alla riga 6 con numero_verifiche

                    Prova il tuo nuovo programma. Funziona?

                    ### Esercizio 3
                    Vuoi rendere il tuo programma ancora migliore? Ottimo! Nel programma precedente potevi calcolare la media dei voti di una sola materia, ma sarebbe meglio poter calcolare la media di tutte le materie che vuoi!
                    Non ti diremo come farlo, ma ti daremo un suggerimento: inizia il tuo codice alla riga 1 con: `{def} calcola_media(materia):`.
                example_code: |
                    ```
                    # Usa il tuo codice dell'avventura precedente.
                    ```
                answer_code: |
                    Esercizio 2
                    ```
                    {def} calcola_media():
                        totale = 0
                        numero_verifiche = {input}("Quante verifiche hai fatto?")
                        {for} i {in} {range} (1, numero_verifiche):
                            voto = {input}("Che voto hai preso nella verifica ", i, '?')
                            totale = totale + voto
                        {return} totale / numero_verifiche

                    media = calcola_media
                    {print}('La tua media è ', media)
                    ```

                    Esercizio 3
                    ```
                    {def} calcola_media(materia):
                        totale = 0
                        numero_verifiche = {input}("Quante verifiche hai fatto in ", materia)
                        {for} i {in} {range} (1, numero_verifiche):
                            voto = {input} ("Che voto hai preso nella verifica ", i, '?')
                            totale = totale + voto
                        {return} totale / numero_verifiche

                    numero_materie = {input}('Per quante materie vuoi calcolare la media?')
                    {repeat} numero_materie {times}
                        materia = {input}('Di quale materia vuoi calcolare la media?')
                        media = calcola_media(materia)
                        {print} ('La tua media in ', materia, ' è ', media)
                    ```
