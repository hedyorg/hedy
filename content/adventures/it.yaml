                story_text: |
                    A volte i nostri pazienti si dimenticano di prendere le medicine, e questo può causare gravi problemi di salute. Per essere sicuri che i pazienti prendano tutte le pillole prescritte, diamo loro una sveglia che suona ogni volta che devono prendere le pillole.
                    Riesci ad aiutarci creando una sveglia per le pillole?

                    ### Esercizio
                    Il programma deve:

                    #Parte 1, impostazioni per il personale infermieristico
                    * Iniziare dando la possibilità di impostare il nome del paziente.
                    * Poi bisogna inserire quante pillole deve prendere il paziente nella prima dose (alle 8), nella seconda (a mezzogiorno) e nell'ultima dose della giornata (alle 16).
                    * Ringraziare e dire di consegnare la sveglia al paziente. Pulire lo schermo due secondi dopo questo messaggio.

                    #Parte 2, prima dose
                    * Salutare il paziente per nome e dirgli che questa sveglia suonerà quando dovrà prendere le medicine.
                    * Suonare 3 volte
                    * Dire al paziente che sono le 8 ed è ora della prima dose.
                    * Chiedere al paziente 'Hai preso la pillola?' tante volte quante sono le pillole della prima dose.
                    * Dire al paziente che ha preso tutta la prima dose e pulire lo schermo dopo 2 secondi.

                    #Parte 3, seconda dose
                    * Aspettare 4 secondi (nella realtà sarebbero 4 ore)
                    * Far suonare la sveglia come per la prima dose.

                    #Parte 4, ultima dose
                    * Aspettare 4 secondi (nella realtà 4 ore)
                    * Far suonare la sveglia per l'ultima dose della giornata.
                answer_code: |-
                    ```
                    #Impostazioni per il personale infermieristico
                    {print} 'Buongiorno! Inserisci le informazioni corrette per il paziente. '
                    nome {is} {ask} 'Come si chiama questo paziente?'
                    prima_dose {is} {ask} 'Quante pillole prende ' nome ' alle 8?'
                    seconda_dose {is} {ask} 'Quante pillole prende ' nome ' a mezzogiorno?'
                    ultima_dose {is} {ask} 'Quante pillole prende ' nome ' alle 16?'
                    {print} 'Grazie, ora puoi consegnare la sveglia al paziente.'
                    {sleep} 2
                    {clear}

                    #Prima dose
                    {print} 'Ciao ' nome ', sono la tua sveglia per le medicine. Suonerò quando dovrai prendere le medicine.'
                    {repeat} 3 {times} {play} C4
                    {print} "Sono le 8, è ora della prima dose"
                    {repeat} prima_dose {times} pillola {is} {ask} 'Hai preso la pillola?'
                    {print} 'Hai preso tutta la prima dose, ' nome
                    {sleep} 2
                    {clear}

                    #Seconda dose
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "È mezzogiorno, è ora della seconda dose"
                    {repeat} seconda_dose {times} pillola {is} {ask} 'Hai preso la pillola?'
                    {print} 'Hai preso tutta la seconda dose, ' nome
                    {sleep} 2
                    {clear}

                    #Ultima dose
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "Sono le 16, è ora dell'ultima dose"
                    {repeat} ultima_dose {times} pillola {is} {ask} 'Hai preso la pillola?'
                    {print} 'Hai preso tutte le pillole di oggi, ' nome
                    {sleep} 2
                    {clear}
                    ```
