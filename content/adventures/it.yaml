                    ```
            12:
                story_text: |
                    Possiamo usare le funzioni per disegnare figure più complesse con meno codice.
                    ### Esercizio 1
                    Completa la funzione in modo che vengano creati tre quadrati. Se vuoi che il disegno sia più bello, puoi rendere bianche le linee tra i quadrati.

                    ### Esercizio 2
                    Il codice si può accorciare ancora. Metti le ultime righe dentro un `{repeat}`, in modo che la figura resti la stessa.

                    ### Esercizio 3
                    Crea un tuo disegno con figure diverse.
                    Cambia sia il numero di figure con `{repeat}` sia la forma delle figure in `{define}`
                example_code: |
                    ```
                    #Creiamo una funzione per un quadrato:
                    {define} quadrato
                        {repeat} 4 {times}
                            {turn} _
                            {forward} _

                    #Disegniamo tre quadrati:
                    {call} quadrato
                    {forward} 50
                    {call} quadrato
                    {forward} 50
                    {call} quadrato
                    ```
                answer_code: |
