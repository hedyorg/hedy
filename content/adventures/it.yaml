    dishes:
        name: Piatti?
        default_save_name: Piatti
        description: Use the computer to see who does the dishes (Start at level 2)
        levels:
            3:
                story_text: |
                    A casa sei sempre in disaccordo su chi dovrebbe lavare i piatti o cambiare la lettiera oggi?
                    Quindi puoi lasciare che sia il computer a scegliere in modo molto equo. Puoi programmarlo in questo livello!
                example_code: |
                    ```
                    people {is} mom, dad, Emma, Sophie
                    {print} people {at} {random}
                    ```
                story_text_2: |
                    ### Esercizio
                    Crea la tua versione del programma per lavastoviglie. Per prima cosa fai un elenco dei membri della tua famiglia.
                    Quindi pensa a un'attività che deve essere eseguita e lascia che sia il computer a decidere chi deve eseguirla con il comando `{at} {random}`.

                    **Extra** Non hai voglia di lavare i piatti da solo? Hackera il programma rimuovendo il tuo nome dall'elenco con il comando `{remove}` `{from}`.
                answer_code: |-
                    ```
                    persone {is} mamma, papà, Emma, Sophie
                    nome {is} {ask} come ti chiami?
                    {remove} nome {from} persone
                    {print} persone {at} {random} deve lavare i piatti
                    ```
            5:
                story_text: |
                    Con `{if}` ora puoi divertirti di più con la scelta nel programma. Puoi fare in modo che il tuo programma risponda alla scelta fatta dal computer.
                    ### Esercizio
                    Puoi completare il codice in modo che venga stampato "peccato" quando tocca a te e altrimenti "sì!"?
                    Non dimenticare le virgolette!
                example_code: |
                    ```
                    people {is} mom, dad, Emma, Sophie
                    dishwasher {is} people {at} {random}
                    {if} dishwasher {is} Sophie {print} _ too bad I have to do the dishes _ {else} {print} 'luckily no dishes because' _ 'is already washing up'
                    ```
                answer_code: |
                    ```
                    persone {is} mamma, papà, Emma, Sophie
                    lavapiatti {is} persone {at} {random}
                    {if} lavapiatti {is} Sophie {print} 'peccato, devo lavare i piatti'
                    {else} {print} 'per fortuna niente piatti, perché ' lavapiatti ' sta già lavando'
                    ```
            7:
                story_text: |
                    Quante volte laverà i piatti ognuno? È giusto? In questo livello puoi contarlo.
                example_code: |
                    ```
                    persone = mamma, papà, Emma, Sophie
                    lavaggi_emma = 0
                    lavapiatti = persone {at} {random}
                    {print} 'Lava i piatti: ' lavapiatti
                    {if} lavapiatti {is} Emma
                    lavaggi_emma = lavaggi_emma + 1
                    {print} 'Questa settimana Emma laverà i piatti ' lavaggi_emma ' volte'
                    ```

                    Ora puoi copiare le righe da 3 a 5 alcune volte (per esempio 7 volte per un'intera settimana) per fare di nuovo il calcolo per tutta la settimana.
                    Riesci a scrivere il codice per tutta la settimana?
                story_text_2: |
                    Se sei proprio sfortunato, il programma precedente potrebbe scegliere te per lavare i piatti tutta la settimana! Non è giusto!
                    Per creare un sistema più giusto puoi usare il comando `{remove}` per togliere dalla lista la persona scelta. Così non dovrai lavare di nuovo i piatti finché non sarà toccato a tutti.

                    Lunedì e martedì sono già pronti! Riesci ad aggiungere il resto della settimana?
                    E… riesci a trovare una soluzione per quando la tua lista è vuota?
                example_code_2: |
                    ```
                    persone = mamma, papà, Emma, Sophie
                    lavapiatti = persone {at} {random}
                    {print} 'Lunedì i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone
                    lavapiatti = persone {at} {random}
                    {print} 'Martedì i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone
                    ```
                answer_code: |
                    ```
                    persone = mamma, papà, Emma, Sophie
                    lavapiatti = persone {at} {random}
                    {print} 'Lunedì i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone

                    lavapiatti = persone {at} {random}
                    {print} 'Martedì i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone

                    lavapiatti = persone {at} {random}
                    {print} 'Mercoledì i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone

                    lavapiatti = persone {at} {random}
                    {print} 'Giovedì i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone

                    persone = mamma, papà, Emma, Sophie
                    lavapiatti = persone {at} {random}
                    {print} 'Venerdì i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone

                    lavapiatti = persone {at} {random}
                    {print} 'Sabato i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone

                    lavapiatti = persone {at} {random}
                    {print} 'Domenica i piatti li lava: ' lavapiatti
                    {remove} lavapiatti {from} persone

                    ```
            8:
                story_text: |
                    Con `{repeat}` puoi ripetere dei pezzi di codice. Puoi usarlo per calcolare chi laverà i piatti per più giorni!
                    ### Esercizio
                    Usa il comando `{repeat}` per decidere chi deve lavare i piatti per un'intera settimana. Ogni spazio vuoto va riempito con un comando o con un numero!
                    **Extra** Ti vengono in mente altri lavori di casa? Modifica il codice in modo che decida tre lavori di casa. Non dimenticare di stampare di quali lavori si tratta!
                example_code: |
                    ```
                    persone = mamma, papà, Emma, Sophie
                    {repeat} _ _ {print} 'I piatti li lava ' _ _ _
                    ```
                answer_code: |
                    ```
                    persone = mamma, papà, Emma, Sophie
                    {repeat} 7 {times} {print} 'I piatti li lava ' persone {at} {random}

                    #Extra
                    {repeat} 7 {times} {print} 'Il cane lo porta a spasso ' persone {at} {random}
                    {repeat} 7 {times} {print} 'La spazzatura la porta fuori ' persone {at} {random}
                    ```
            11:
                story_text: |
                    In questo livello puoi creare facilmente un calendario per tutta la settimana!

                    ### Esercizio
                    Aggiungi un secondo lavoro di casa, come passare l'aspirapolvere o mettere in ordine, e fai in modo che anche questo venga diviso per tutta la settimana.
                    <br> **Extra** Il programma non è giusto: potresti essere sfortunato e lavare i piatti tutta la settimana. Come potresti rendere il programma più giusto?
                example_code: |
                    ```
                    giorni = lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica
                    nomi = mamma, papà, Emma, Sophie
                    {for} giorno {in} giorni
                        {print} nomi {at} {random} ' lava i piatti di ' giorno
                    ```
                answer_code: |
                    ```
                    giorni = lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica
                    nomi = mamma, papà, Emma, Sophie

                    {for} giorno {in} giorni
                        {print} nomi {at} {random} ' lava i piatti di ' giorno

                    {for} giorno {in} giorni
