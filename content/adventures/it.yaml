                    {define} prima_riga
                        {play} C
                        {play} C
                        {play} G
                        {play} G
                        {play} A
                        {play} A
                        {play} G
                        {sleep}

                    {define} seconda_riga
                        {play} F
                        {play} F
                        {play} E
                        {play} E
                        {play} D
                        {play} D
                        {play} C
                        {sleep}

                    {define} terza_riga
                        {play} G
                        {play} G
                        {play} F
                        {play} F
                        {play} E
                        {play} E
                        {play} D
                        {sleep}

                    {call} prima_riga
                    {call} seconda_riga
                    {call} terza_riga
                    {call} terza_riga
                    {call} prima_riga
                    {call} seconda_riga
