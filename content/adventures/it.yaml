            11:
                story_text: |
                    In questo livello puoi far disegnare una figura alla tartaruga.
                    La tartaruga percorrerà le distanze della lista, una alla volta, facendo passi sempre più lunghi.
                    ### Esercizio 1
                    Aggiungi nel ciclo una svolta di 90 gradi, in modo da disegnare una spirale.
                    Aggiungi almeno 5 numeri alla lista, così la spirale diventa più grande.
                    **(extra)** riesci a trasformare la spirale in un'altra forma? Fai delle prove con i numeri della svolta!
                    ### Esercizio 2
                    La spirale viene disegnata verso l'esterno: riesci a farla andare verso l'interno?
                example_code: |
                    ```
                    {turn} 90
                    distanze = 10, 20, 30, 40, 50, 60
                    {for} distanza {in} distanze
                        {forward} distanza
                    ```
