                    In questo livello puoi usare l'annidamento, che ti permette di rendere la casa stregata ancora più interattiva!

                    ### Esercizio
                    Per ora è molto difficile vincere questo gioco: riesci a renderlo più facile?
                    Modifica il codice in modo che ci siano una sola porta sbagliata e due porte giuste, invece di una porta giusta e due sbagliate.
                    Suggerimento: questo significa cambiare la variabile porta_giusta in porta_sbagliata e scambiare il codice di `{if}` e di `{else}`.
                    E naturalmente puoi anche cambiare la storia e farla tua. Cambia i mostri, oppure trasformala in un allegro quiz a premi in cui ricevi un regalo!
                example_code: |
                    ```
                    {print} 'Scappa dalla casa stregata!'
                    giocatore = vivo
                    porte = 1, 2, 3
                    mostri = zombie, vampiro, ragno gigante
                    {repeat} 3 {times}
                        {if} giocatore {is} vivo
                            porta_giusta {is} porte {at} {random}
                            {print} 'Davanti a te ci sono 3 porte...'
                            porta_scelta = {ask} 'Quale porta scegli?'
                            {if} porta_scelta {is} porta_giusta
                                {print} 'Qui non ci sono mostri!'
                            {else}
                                {print} 'Ti ha mangiato: ' mostri {at} {random}
                                giocatore = morto
                        {else}
                            {print} 'GAME OVER'
                    {if} giocatore {is} vivo
                        {print} 'Ottimo! Sei in salvo!'
                    ```
