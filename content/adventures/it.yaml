                story_text: |
                    Il personale del nostro pronto soccorso ha un problema. Dice che arrivano tanti pazienti che non hanno davvero un'emergenza e che dovrebbero andare dal loro medico di base.
                    Queste persone riempiono la sala d'attesa e aumentano molto il lavoro del personale. Riesci ad aiutare il personale del pronto soccorso creando un'app di triage che dica al paziente se deve andare al pronto soccorso oppure no?
                    ### Esercizio
                    Il tuo programma deve dire al paziente se deve 'andare al pronto soccorso il prima possibile', 'chiamare il proprio medico per parlare della situazione' oppure 'andare dal proprio medico di base appena possibile'.
                    Il programma farà queste domande:
                    * La tua situazione mette in pericolo la tua vita?
                    * Hai difficoltà a respirare?
                    * Di colpo non riesci più a parlare, vedere, camminare o muoverti?
                    * Hai ingerito o inalato del veleno?
                    * Hai un osso rotto?
                    * Hai una reazione allergica grave?
                    * Hai un dolore molto forte?

                    Se il paziente risponde 'sì' a una qualsiasi di queste domande, il programma gli dirà di andare al pronto soccorso il prima possibile. Non farà altre domande, perché il tempo è prezioso.
                    Se il paziente risponde 'no' a tutte le domande, il programma chiederà:
                    * Può aspettare fino a domani?
                    Se la risposta è 'sì', il programma dirà al paziente di andare dal medico di base appena possibile. Se la risposta è 'no', il programma consiglierà di chiamare il proprio medico per parlare della situazione.
                answer_code: |
                    ```
                    pericolo_di_vita = {ask} 'La tua situazione mette in pericolo la tua vita?'
                    {if} pericolo_di_vita {is} 'sì'
                        {print} 'Vai al pronto soccorso il prima possibile!'
                    {else}
                        respiro = {ask} 'Hai difficoltà a respirare?'
                        {if} respiro {is} 'sì'
                            {print} 'Vai al pronto soccorso il prima possibile!'
                        {else}
                            capacita = {ask} 'Di colpo non riesci più a parlare, vedere, camminare o muoverti?'
                            {if} capacita {is} 'sì'
                                {print} 'Vai al pronto soccorso il prima possibile!'
                            {else}
                                veleno = {ask} 'Hai ingerito o inalato del veleno?'
                                {if} veleno {is} 'sì'
                                    {print} 'Vai al pronto soccorso il prima possibile!'
                                {else}
                                    osso_rotto = {ask} 'Hai un osso rotto?'
                                    {if} osso_rotto {is} 'sì'
                                        {print} 'Vai al pronto soccorso il prima possibile!'
                                    {else}
                                        allergia = {ask} 'Hai una reazione allergica grave?'
                                        {if} allergia {is} 'sì'
                                            {print} 'Vai al pronto soccorso il prima possibile!'
                                        {else}
                                            attesa = {ask} 'Può aspettare fino a domani?'
                                            {if} attesa {is} 'sì'
                                                {print} 'Vai dal tuo medico di base appena possibile.'
                                            {else}
                                                {print} 'Chiama il tuo medico per parlare della situazione'
                    ```
