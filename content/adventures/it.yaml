                    {print} 'Il totale è ' prezzo ' euro, per favore'
                    {print} 'Grazie, buon appetito!'
                    ```
                answer_code: |
                    ```
                    {print} 'Benvenuti al Ristorante Chez Hedy'
                    {print} 'Ecco il nostro menu:'
                    {print} 'I nostri piatti principali sono pizza, lasagne o spaghetti'
                    principale = {ask} 'Quale piatto principale vorresti?'
                    prezzo = 0
                    {if} principale {is} pizza
                    prezzo = 10
                    {if} principale {is} lasagne
                    prezzo = 12
                    {if} principale {is} spaghetti
                    prezzo = 8
                    {print} 'Hai ordinato ' principale
                    quantita = {ask} 'Per quante persone vuoi ordinarlo?'
                    sconto_corretto = Hedy
                    sconto_inserito = {ask} 'Inserisci qui il codice sconto, se ne conosci uno'
                    {if} sconto_inserito {is} sconto_corretto
                    prezzo = prezzo / 2
                    {else}
                    {print} 'Codice sbagliato!'
                    {print} 'Il totale è ' prezzo * quantita ' euro, per favore'
                    {print} 'Grazie, buon appetito!'
                    ```
