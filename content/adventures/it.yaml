                    ```
                    {print}("Benvenuti nel nostro parco divertimenti: 'Hedy High'")
                    {print}("In questo parco abbiamo tre attrazioni principali: Casa stregata, Montagne russe e Giostra." )

                    #Prova una delle tre attrazioni:
