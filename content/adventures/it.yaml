            7:
                story_text: |
                    In questo livello puoi usare i calcoli per disegnare figure diverse.
                    Forse a scuola hai imparato che un giro completo è di 360 gradi. Se non lo sapevi, ora lo sai!
                    Per questo per un quadrato usi 90 gradi: 360 diviso 4 fa 90.
                    Ora che possiamo fare i calcoli con Hedy, possiamo disegnare tutte le figure che vogliamo!
                    ### Esercizio
                    Crea le tue forme!
                example_code: |
                    ```
                    # definiamo l'angolo per la figura:
                    angoli = {ask} 'Quanti angoli vuoi?'
