                    Sad ćemo naučiti `{and}` i `{or}`! Ako želiš provjeriti dvije tvrdnje, ne moraš koristiti dva `{if}`-a nego možeš koristiti `{and}` i `{or}`.
                    Ako koristiš `{and}`, onda obje tvrdnje, lijevo i desno od `{and}`, moraju biti istinite. Možemo koristiti i `{or}`. Onda samo jedna tvrdnja mora biti točna.
                example_code: |
                    ```
