                    'Dobrodošli u Hedy pizzeriju'
                    jos_hrane = input 'Želite li naručiti pizzu?'
                    while jos_hrane = 'da':
                        return jos_hrane
                        jos_hrane == input('Želite li naručiti pizzu?')
