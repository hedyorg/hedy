                    * Pitati pacijenta što bi želio jesti
                    * Pitati ga što bi želio piti
                    * Ponoviti narudžbu pacijentu
                    * Zahvaliti pacijentu na narudžbi
                    * Reći mu da će njegova narudžba stići u njegovu sobu za 15 minuta.
