            14:
                story_text: |
                    Naši domari imaju velik popis zadataka. Neki zadaci obavljaju se svaki dan, drugi određenog dana, godišnjeg doba ili datuma. Ovo je vrlo zbunjujuće i dovodi do situacija u kojima se neki zadaci zaborave.
                    Možeš li pomoći tako da napišeš program koji će ispisati ispravan popis zadataka za taj dan?
                    ### Vježba
                    Program treba:
                    * Zaželjeti domaru dobro jutro.
                    * Pitati domara koji je dan u tjednu, koji mjesec i koji datum u mjesecu.
                    * Ispisati ispravan popis zadataka za taj dan.
                    Zadaci koje treba obaviti:
                    * Svakodnevni zadaci: obriši pod, očisti zahode, otvori zavjese
                    * Ponedjeljkom i četvrtkom: zalij biljke
                    * Utorkom i petkom: obriši podove
                    * Subotom: operi aparat za kavu
                    * Prvog u svakom mjesecu: operi prozore
                    * 7. u svakom mjesecu: napuni automate
                    * 14. u svakom mjesecu: provjeri baterije za požarne alarme
                    * Svaki dan u zimskim mjesecima: uključi grijanje
                    * Svaki dan u ljetnim mjesecima: uključi klimu
                answer_code: |
                    ```
                    {print}("Dobro jutro, domaru")

                    #pitanje za datum
                    dan = {input}("Koji je dan u tjednu?")
                    trenutni_mjesec = {input}("Koji je mjesec?")
                    datum = {input}("Koji je datum?")

                    #ispis popisa zadataka
                    print("Domaru, tvoji zadaci za danas su: ")

                    #odlučivanje o zadacima na temelju dana u tjednu
                    {if} dan == "ponedjeljak" {or} dan == "četvrtak":
                        {print}("zalij biljke")
                    {elif} dan == "utorak" {or} dan == "petak":
                        {print}("obriši podove")
                    {elif} dan == "subota":
                        {print}("operi aparat za kavu")

                    #odlučivanje o zadacima na temelju datuma
                    {if} datum == 1:
                        {print}("operi prozore")
                    {elif} datum == 7:
                        {print}("napuni automate")
                    {elif} datum == 14:
                        {print}("provjeri baterije za požarne alarme")

                    #pravljenje liste ljetnih i zimskih mjeseci
                    ljetni_mjeseci = ["travanj", "svibanj", "lipanj", "srpanj", "kolovoz", "rujan"]
                    zimski_mjeseci = ["listopad", "studeni", "prosinac", "siječanj", "veljača", "ožujak"]

                    #odlučivanje o zadacima na temelju ljeta ili zime
                    {for} mjesec {in} ljetni_mjeseci:
                        {if} trenutni_mjesec == mjesec:
                            {print}("uključi klimu")
                    {for} mjesec {in} zimski_mjeseci:
                        {if} trenutni_mjesec == mjesec:
                            {print}("uključi grijanje")
                    ```
