    ask_command:
        levels:
            1:
                story_text: |
                    ## Naredba `{ask}`
                    Sad kad znaš koristiti naredbu `{print}`, spreman si za sljedeću naredbu: `{ask}`. Naredbom `{ask}` možeš postaviti pitanje. Pogledaj:
                example_code: |
                    ```
