                    ### Vježba 1
                    Popuni praznine da kalkulator proradi.
                    * Počni s četvrtim retkom, dodaj pitanje da doznaš koju je ocjenu učenik dobio.
                    * U petom retku želiš izračunati zbroj svih ocjena, dakle ukupno = ukupno + ocjena.
                    * Zatim postavljamo povratnu vrijednost. Želimo vratiti prosjek, dakle ukupno podijeljeno s brojem ispita (4).
                    * Na kraju dovršavamo kod pozivanjem funkcije u 8. retku.

                    Uspio si? Odlično! Želiš li dodati još kalkulatoru? **Ova avantura nastavlja se u sljedećoj avanturi!**
                example_code: |
                    ```
                    {def} izracunaj_prosjek():
                        ukupno = 0
                        {for} i {in} {range}(1,4):
                            ocjena = {input} _
                            ukupno = ukupno + _
                            {return} _ / 4

