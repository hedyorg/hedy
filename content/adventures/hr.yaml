    functions:
        levels:
            12:
                story_text: |
                    U ovoj razini naučit ćeš kako koristiti **funkcije**. Funkcija je blok koda koji možeš lako koristiti više puta. Funkcije nam pomažu organizirati dijelove koda koje možemo koristiti iznova i iznova.
                    Da napraviš funkciju, koristi `{define}` i daj funkciji ime. Zatim stavi sve retke koje želiš u funkciji u uvučeni blok ispod retka `{define}`.
                    Ostavi jedan prazan redak u kodu da izgleda lijepo i uredno. Bravo! Napravio si funkciju!

                    Sad, kad god trebamo taj blok koda, samo koristimo ime funkcije da ga pozovemo! Ne moramo ponovno tipkati taj blok koda.

                    Pogledaj ovaj primjer koda igre Twister. Funkcija 'sljedeci_potez' sadrži blok koda koji bira koji ud treba ići kamo.

                    ### Vježba
                    Dovrši ovaj kod postavljanjem 2 varijable `odabrani_ud` i `odabrana_boja`.
                    Zatim odaberi koliko puta želiš pozvati funkciju da zavrtiš Twister strelicu.

                    ### Vježba 2
                    Poboljšaj svoj kod dodavanjem varijable 'igraci'. Koristi varijablu da svim igračima daš vlastitu naredbu u igri.
                    Na primjer: 'Ahmed, desna ruka na zeleno' ili 'Jessica, lijeva noga na žuto'.
                example_code: |
                    ```
                    #Zadavanje Twister opcija:
                    strane = 'lijeva', 'desna'
                    udovi = 'ruka', 'noga'
                    boje = 'crvena', 'plava', 'zelena', 'žuta'

                    #Definiranje jednog Twister poteza:
                    {define} sljedeci_potez
                        odabrana_strana = strane {at} {random}
                        odabrani_ud = udovi _
                        odabrana_boja = boje _
                        {print} odabrana_strana ' ' odabrani_ud ' na ' odabrana_boja

                    #Igranje Twister igre:
                    {print} 'Idemo igrati Twister!'
                    {repeat} _ _
                        call sljedeci_potez
                        {sleep} 2
                    ```
                answer_code: |
                    ```
                    strane = 'lijeva', 'desna'
                    udovi = 'ruka', 'noga'
                    boje = 'crvena', 'plava', 'zelena', 'žuta'
                    igraci = 'Ahmed', 'Jessica'

                    {define} sljedeci_potez
                        {for} igrac {in} igraci
                            odabrana_strana = strane {at} {random}
                            odabrani_ud = udovi {at} {random}
                            odabrana_boja = boje {at} {random}
                            {print} igrac ', stavi svoju ' odabrana_strana ' ' odabrani_ud ' na ' odabrana_boja
                            {sleep} 2

                    {print} 'Idemo igrati Twister!'
                    {call} sljedeci_potez
                    ```
            15:
                story_text: |
                    U razini 12 predstavili smo ti funkcije. Napišeš dio koda unutar funkcije.
                    Ako pozoveš tu funkciju, izvršit će sav kod unutar funkcije. Odlično kad moraš ponoviti dio koda!

                    U ovoj razini nastavit ćemo s funkcijama i pokazati ti kako mogu biti još korisnije.
                    Počinjemo pisati na Python način. Sad ćemo koristiti `{def}` i dodati `():` iza funkcije.
                    Da pozoveš funkciju, jednostavno upiši ime funkcije i (), kao što smo učinili u 8. retku.

                    ### Vježba
                    Dodaj funkciju koja svira tužnu melodiju (poput C6-C5-C4) i pozovi funkciju kad se da pogrešan odgovor.
                example_code: |
                    ```
                    #Definiranje vesele i tužne melodije:
                    {def} sviraj_veselu_melodiju():
                        {play} C4
                        {play} C5
                        {play} C6

                    #Postavljanje pitanja:
                    odgovor = {input}('Koliko je 2 + 2?')
                    {if} odgovor == 4:
                        {print}('Točno!')
                        sviraj_veselu_melodiju()
                    {else}:
                        {print}('Netočno!')
                    ```
                answer_code: |-
                    ```
                    {def} sviraj_veselu_melodiju():
                        {play} C4
                        {play} C5
                        {play} C6

                    {def} sviraj_tuznu_melodiju():
                        {play} C6
                        {play} C5
                        {play} C4

                    odgovor = {input}('Koliko je 2 + 2?')
                    {if} odgovor == 4:
                        {print}('Točno!')
                        sviraj_veselu_melodiju()
                    {else}
                        {print}('Netočno!')
                        sviraj_tuznu_melodiju()
                    ```
