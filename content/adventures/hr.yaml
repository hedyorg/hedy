                            {print}("Idemo u kupovinu!")

                    novac = {input}('Koliko si novca uštedio?')
                    zelja = {input}('Koliko ti novca treba?')
                    dzeparac = {input}('Koliko džeparca dobivaš svaki tjedan?')

                    izracunaj_budzet(zelja, novac, dzeparac)
                    ```
