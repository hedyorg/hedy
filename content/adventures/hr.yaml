                    ```
            2:
                story_text: |
                    ## Korištenje varijabli
                    U prethodnim razinama naučio/la si koristiti `{answer}` za ispis odgovora na pitanje, ali što ako želiš koristiti više od jednog odgovora?
                    U ovoj razini naučit ćeš kako koristiti više **varijabli**. Varijabla je mjesto za pohranu odgovora (ili *unosa*) od korisnika. Već si koristio/la varijablu `{answer}`, ali sad ćeš naučiti kako koristiti više varijabli!
                    Ovaj primjer pokazuje kako možeš koristiti varijable 'ime' i 'dob'.

                    ## {ask}
                    Vidiš li kako se i naredba `{ask}` promijenila? Da bi računalu rekao/la u koju varijablu želiš spremiti svoj odgovor, redak započinješ imenom varijable, zatim `{is}` pa `{ask}`.
                example_code: |
                    ```
                    ime {is} {ask} Kako se zoveš?
