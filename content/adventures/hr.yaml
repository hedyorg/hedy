    functions_2:
        name: Funkcije s argumentima
        description: Funkcije koje primaju argumente
        levels:
            15:
                story_text: |
                    Sad kad si naučio kako koristiti funkcije, naučit ćeš kako koristiti funkciju s argumentom.
                    **Argument** je varijabla koja se koristi unutar funkcije. Ne koristi se izvan funkcije.

                    Na primjer, u ovom kodu isprogramirali smo prvu kiticu pjesme 'My Bonnie is over the ocean'.
                    U ovom primjeru koda koristi se argument 'mjesto'. Mjesto je varijabla koja se koristi samo u funkciji, dakle argument.
                    Da koristimo 'mjesto', stavili smo `mjesto` iza `{define} pjesma`.
                    Kad se funkcija pozove, računalo će zamijeniti argument 'mjesto' dijelom teksta iza ` pjesma {with}`.

                    ### Vježba
                    Sljedeća kitica ove pjesme glasi:

                    Sinoć dok sam ležao na jastuku

                    Sinoć dok sam ležao u krevetu

                    Sinoć dok sam ležao na jastuku

                    Sanjao sam da je moja Bonnie mrtva



                    Možeš li isprogramirati ovu kiticu na isti način kao primjer?
                example_code: |
                    ```
                    {def} pjesma(mjesto):
                        {print}('Moja Bonnie je preko ', mjesto)

                    pjesma('oceana')
                    pjesma('mora')
                    pjesma('oceana')
                    ```
                answer_code: |
                    ```
                    {define} pjesma(mjesto)
                        {print} ('Sinoć dok sam ležao na ' mjesto)

                    pjesma('jastuku')
                    pjesma('krevetu')
                    pjesma('jastuku')
                    {print} "Sanjao sam da je moja Bonnie mrtva"
                    ```
        default_save_name: Funkcije 2
    functions_3:
        name: Funkcije s povratnom vrijednošću
        description: Funkcije koje vraćaju vrijednost
        levels:
            15:
                story_text: |
                    U prethodnim razinama naučio si stvarati funkcije i koristiti argumente s njima. Još jedna odlična upotreba funkcije je da za tebe nešto izračuna.
                    Možeš funkciji dati izračun i ona će ti dati odgovor izračuna. Taj se odgovor zove **povratna vrijednost**.

                    Na primjer, u ovom kodu funkcija izracunaj_novu_cijenu izračunat će novu cijenu bilo koje stavke. Dat će ti novu cijenu kao povratnu vrijednost.

                    ### Vježba
                    Dovrši ovaj kod. Već smo za tebe napravili varijablu nova_cijena, samo je trebaš postaviti.
                    Redak koda trebaš dovršiti pozivanjem funkcije koja izračunava novu cijenu.
                example_code: |
                    ```
                    {def} izracunaj_novu_cijenu(iznos, postotak):
                        postotak = postotak / 100
                        iznos_popusta = iznos * postotak
                        {return} iznos - iznos_popusta

                    stara_cijena = {input}('Koliko piše na cjeniku?')
                    popust = {input}('Koji je postotak popusta?')

                    nova_cijena = _ izracunaj_novu_cijenu(stara_cijena, _)
                    {print}('Nova cijena je ', nova_cijena, ' eura')
                    ```
                answer_code: |
                    ```
