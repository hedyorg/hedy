            8:
                story_text: |
                    Naši pacijenti ponekad zaborave uzeti lijek, što uzrokuje ozbiljne zdravstvene probleme. Da bismo bili sigurni da pacijenti uzimaju sve propisane tablete, dajemo im budilicu koja se oglašava svaki put kad trebaju uzeti tablete.
                    Možeš li pomoći tako da napraviš alarm za tablete?

                    ### Vježba
                    Program treba:

                    #1. dio, Postavke za sestru
                    * Započeti tako da sestri da mogućnost postavljanja imena pacijenta.
                    * Zatim trebaju upisati koliko tableta pacijent treba uzeti u prvoj (8 h), drugoj (podne) i posljednjoj dozi dana (16 h).
                    * Zahvaliti sestri i reći joj da preda alarm pacijentu. Očisti ekran dvije sekunde nakon ove poruke.

                    #2. dio, Prva doza
                    * Pozdravi pacijenta imenom i reci mu da će se ovaj alarm oglasiti kad treba uzeti lijek.
                    * Oglasi se 3 puta
                    * Reci pacijentu da je 8 h i vrijeme za prvu dozu.
                    * Pitaj pacijenta 'Jesi li uzeo tabletu?' onoliko puta koliko tableta treba uzeti u prvoj dozi.
                    * Reci pacijentu da je uzeo cijelu prvu dozu i očisti ekran nakon 2 sekunde.

                    #3. dio, Druga doza
                    * Pričekaj 4 sekunde (u stvarnosti bi to bila 4 sata)
                    * Oglasi alarm na isti način kao za prvu dozu.

                    #4. dio, Posljednja doza
                    * Pričekaj 4 sekunde (u stvarnosti 4 sata)
                    * Oglasi alarm za posljednju dozu dana.
                answer_code: |-
                    ```
                    #Postavke za sestru
                    {print} 'Dobro jutro, sestro. Molimo upišite točne podatke za pacijenta. '
                    ime {is} {ask} 'Kako se zove ovaj pacijent?'
                    prva_doza {is} {ask} 'Koliko tableta ' ime ' uzima u 8 h?'
                    druga_doza {is} {ask} 'Koliko tableta ' ime ' uzima u podne?'
                    zadnja_doza {is} {ask} 'Koliko tableta ' ime ' uzima u 16 h'
                    {print} 'Hvala, sad možete predati alarm pacijentu.'
                    {sleep} 2
                    {clear}

                    #Prva doza
                    {print} 'Bok ' ime ' ja sam tvoj pratitelj lijekova. Oglasit ću se kad trebaš uzeti lijek.'
                    {repeat} 3 {times} {play} C4
                    {print} "8 je sati, vrijeme za prvu dozu"
                    {repeat} prva_doza {times} tableta {is} {ask} 'Jesi li uzeo tabletu?'
                    {print} 'Uzeo si cijelu prvu dozu, ' ime
                    {sleep} 2
                    {clear}

                    #Druga doza
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "Podne je, vrijeme za drugu dozu"
                    {repeat} druga_doza {times} tableta {is} {ask} 'Jesi li uzeo tabletu?'
                    {print} 'Uzeo si cijelu drugu dozu, ' ime
                    {sleep} 2
                    {clear}

                    #Posljednja doza
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "16 je sati, vrijeme za posljednju dozu"
                    {repeat} zadnja_doza {times} tableta {is} {ask} 'Jesi li uzeo tabletu?'
                    {print} 'Uzeo si sve tablete za danas, ' ime
                    {sleep} 2
                    {clear}
                    ```
