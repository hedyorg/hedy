                    * Pitati sestru koliko je mililitara morfija pacijent već danas dobio.
                    * Reći sestri da preda uređaj pacijentu
                    * Pitati pacijenta koliko boli osjeća na skali od 1 do 10.
                    * Reći pacijentu da pritisne tipku x ako želi još morfija.
                    * Pozvati funkciju pumpa s argumentima razina_boli i razina_morfija ako se pritisne x.
                    * Funkcija treba ispisati 'Dat će ti se još 20 ml morfija' dok je razina boli pacijenta veća ili jednaka 6 i razina morfija manja od 120.
                    * Nakon davanja novog morfija program treba spavati 2 minute (dok testiraš program možeš koristiti 2 sekunde).
                    * Nakon te 2 minute, razina morfija treba se ažurirati (+20 ml), a razina boli treba se ažurirati pitanjem pacijenta kako se sad osjeća.
                    * Ako je razina morfija previsoka ili pacijent više ne osjeća bol, program treba reći pacijentu da neće dobiti više morfija. Ako osjeća jaku bol, reci mu da nazove sestru.
                    * Reci pacijentu da će se pumpa sad ugasiti i da pritisne x ako treba da pumpa ponovno počne.
                answer_code: |-
                    ```
                    {print}('Pumpa s morfijem')
                    razina_morfija = {input}('Koliko ml morfija je pacijent već danas dobio?')
                    {print}('molimo predajte ovaj uređaj pacijentu sad')

                    razina_boli = {input}('Koliko boli osjećaš od 1 do 10?')
                    {print}('Pritisni X za davanje morfija')

                    {define} morfij(razina_boli, razina_morfija):
                        {print}('Dat će ti se još 20 ml morfija')
                        {sleep} 2
                        razina_morfija = razina_morfija + 20
                        razina_boli = {input}('Koliko boli osjećaš od 1 do 10?')
                        {print}('Pumpa će se sad ugasiti')
                        {return} razina_morfija
                        {return} razina_boli
                        {sleep} 2

                    {for} i {in} {range} (1,10):
                        cekaj_x = {input}('Pritisni X za davanje morfija')
                        {if} cekaj_x == 'x'
                            {if} razina_boli >= 6 {and} razina_morfija <120:
                                razina_morfija = morfij(razina_boli, razina_morfija)
                                razina_boli = morfij(razina_boli, razina_morfija)
                            {else}:
                                {print}('Ne bi bilo sigurno dati više morfija sad')
                                {print}('Molimo nazovite sestru ako osjećate preveliku bol')
                    ```
            16:
                story_text: |
                    Naši studenti medicine moraju naučiti medicinske nazive za sve dijelove tijela. Čini se da se muče zapamtiti sve anatomske nazive i čini im se da je učenje vrlo dosadno.
                    Možeš li im pomoći tako da napraviš igru koja im omogućuje vježbanje medicinskih naziva?
                    Ovo su nazivi koje studenti trebaju znati: corpus = tijelo, caput = glava, ocolus = oko, nasus = nos, auris = uho, os = usta, collum = vrat, manus = ruka, pectus = prsa, humerus = rame, venter = trbuh, tergum = leđa
                    ### Vježba
                    Program treba:
                    * Biti igra koja studentima omogućuje vježbanje medicinskih naziva.
                    * Dati studentima bod i kompliment kad daju točan odgovor.
                    * Oduzeti bod i reći im da je odgovor netočan kad daju pogrešan odgovor.
                    * Također pokazati studentima točan odgovor na nekoliko sekundi ako su dali pogrešan odgovor, obrisati odgovor s ekrana i nastaviti postavljati pitanje dok ne pogode.
                    * Nastaviti igrati dok student ne odgovori točno na sva pitanja.
                    * Pokazati konačni rezultat studentu.
                    * Dati studentu povratnu informaciju na temelju rezultata: 12 bodova: Nevjerojatno!, 8 - 11 bodova: Bravo, nastavi vježbati!, 7 ili manje: Trebaš više učiti!
                answer_code: |
                    ```
                    bodovi = 0
                    latinski_pojmovi = ['corpus', 'caput',  'ocolus',  'nasus', 'auris', 'os', 'collum',  'manus', 'pectus',  'humerus', 'venter', 'tergum']
                    hrvatski_pojmovi = ['tijelo', 'glava', 'oko', 'nos', 'uho', 'usta', 'vrat', 'ruka', 'prsa', 'rame', 'trbuh', 'leđa']

                    {for} i {in} {range}(1, 12):
                        tocan_odgovor = hrvatski_pojmovi[i]
                        odgovor = 0
                        {while} odgovor != tocan_odgovor:
                            odgovor = {input}('Koji je hrvatski naziv za ', latinski_pojmovi[i], '?')
                            {if} odgovor != tocan_odgovor:
                                {print}('To je netočno')
                                {print}('Točan odgovor za ', latinski_pojmovi[i], ' je ', hrvatski_pojmovi[i])
                                {sleep} 3
                                clear
                                bodovi = bodovi - 1
                        bodovi = bodovi + 1
                        {print}('Točno!')

                    {print}("Čestitamo, uvježbao si sve pojmove!")
                    {print}('Tvoj rezultat je:', bodovi)

                    {if} bodovi == 12:
                        {print}('Nevjerojatno!')

                    {if} bodovi <=7:
                        {print}('Trebaš više učiti!')
                    {else}:
                        {print}('Bravo, nastavi vježbati!')
                    ```
