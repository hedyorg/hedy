    carnival:
        name: Karneval
        description: Zabava na karnevalu
        levels:
            13:
                story_text: |
                    Dobrodošao na Hedy karneval! Igrat ćemo Gađanje limenki! Obori limenke i odaberi svoju nagradu!

                    ### Vježba
                    Upiši ispravne naredbe nakon {if} da program proradi.

                    * Program treba raditi ako igrač još nije bio na redu i mlađi je od 18.
                    * Zatim treba prikazati popis koji pokazuje koje nagrade igrač može birati.
                    * Ako igrač ima dovoljno bodova za nagradu (vidi popis nagrada), ta nagrada treba biti ispisana.
                    * Igrač može osvojiti videoigru samo ako ima 14 godina ili više.
                    * Igrač može osvojiti balon samo ako ima 5 godina ili manje.
                example_code: |
                    ```
                    #popis nagrada
                    balon = 1
                    lizalica = 2
                    videoigra = 8
                    medo = 10

                    {print}('Gađanje limenki!')
                    dob = {input}('Koliko imaš godina?')
                    vec_bio_na_redu = {input}('Jesi li već bio na redu?')

                    # Koje nagrade igrač može birati?
                    {if} _ {or} _:
                        {print}('Smiješ igrati')
                        bodovi = {input}('Koliko si bodova osvojio?')
                        {print}('Možeš birati između ovih nagrada:')

                        {if} _ :
                            {print}('medo')

                        {if} _ :
                            {print}('lizalica')

                        {if} _ {and} _ :
                            {print}('videoigra')

                        {if} _ {and} :
                            {print}('balon')

                        odabrana_nagrada = {input}('Koju nagradu želiš?')
                        {print}('Čestitamo na', odabrana_nagrada)

                    {else}:
                        {print}('Žao nam je, ne smiješ igrati')
                    ```
                answer_code: |
                    ```
                    #popis nagrada
                    balon = 1
                    lizalica = 2
                    videoigra = 8
                    medo = 10

                    {print}('Gađanje limenki!')
                    dob = {input}('Koliko imaš godina?')
                    vec_bio_na_redu = {input}('Jesi li već bio na redu?')

                    {if} vec_bio_na_redu != 'da' {or} dob > 18:
                        {print}('Smiješ igrati')
                        bodovi = {input}('Koliko si bodova osvojio?')
                        {print}('Možeš birati između ovih nagrada:')

                        {if} bodovi >= medo:
                            {print}('medo')

                        {if} bodovi >= lizalica:
                            {print}('lizalica')

                        {if} dob >= 14 {and} bodovi >= videoigra:
                            {print}('videoigra')

                        {if} dob <= 5 {and} bodovi >= balon:
                            {print}('balon')

                        odabrana_nagrada = {input}('Koju nagradu želiš?')
                        {print}('Čestitamo na', odabrana_nagrada)

                    {else}:
                        {print}('Žao nam je, ne smiješ igrati')
                    ```
