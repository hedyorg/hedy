                    {print} Volim najdraza_zivotinja

                    {print} Dakle voliš _ , _ i _ .
                    ```
                answer_code: |
                    ```
                    najdraza_zivotinja {is} {ask} Koja ti je najdraža životinja?
                    {print} Volim najdraza_zivotinja
                    najdrace_pice {is} {ask} Koje ti je najdraže piće?
                    {print} Volim piti najdrace_pice
                    najdraza_knjiga {is} {ask} Koja ti je najdraža knjiga?
                    {print} Volim čitati najdraza_knjiga
