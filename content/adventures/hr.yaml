                    Osoblje naše hitne službe ima problem. Kažu da dolazi mnogo pacijenata koji zapravo nemaju hitan slučaj i koji bi trebali otići svom liječniku obiteljske medicine.
                    Ti ljudi pune čekaonicu i stvaraju veliko opterećenje našem osoblju. Hoćeš li pomoći osoblju hitne službe tako da napraviš aplikaciju za trijažu koja pacijentu govori mora li ići na hitnu ili ne?
                    ### Vježba
                    Tvoj program treba pacijentu reći treba li 'odmah otići na hitnu', 'nazvati svog liječnika da razgovarate o situaciji' ili 'otići svom liječniku obiteljske medicine čim prije'.
                    Program će postaviti ova pitanja:
                    * Je li tvoja situacija opasna po život?
                    * Imaš li poteškoća s disanjem?
                    * Odjednom ne možeš govoriti, vidjeti, hodati ili se micati?
                    * Jesi li progutao ili udahnuo otrov?
                    * Jesi li slomio kost?
                    * Imaš li ozbiljnu alergijsku reakciju?
                    * Osjećaš li jaku bol?

                    Ako pacijent odgovori 'da' na bilo koje od ovih pitanja, program će mu reći da odmah ode na hitnu. Neće postavljati druga pitanja jer je vrijeme presudno.
                    Ako pacijent odgovori 'ne' na sva pitanja, program će pitati:
                    * Može li pričekati do sutra?
                    Ako je odgovor 'da', program će pacijentu reći da ode svom liječniku čim prije. Ako je odgovor 'ne', program će savjetovati da nazove svog liječnika da razgovaraju o situaciji.
                answer_code: |
                    ```
                    opasno_po_zivot = {ask} 'Je li tvoja situacija opasna po život?'
                    {if} opasno_po_zivot {is} 'da'
                        {print} 'Odmah idi na hitnu!'
                    {else}
                        disanje = {ask} 'Imaš li poteškoća s disanjem?'
                        {if} disanje {is} 'da'
                            {print} 'Odmah idi na hitnu!'
                        {else}
                            sposobnost = {ask} 'Odjednom ne možeš govoriti, vidjeti, hodati ili se micati?'
                            {if} sposobnost {is} 'da'
                                {print} 'Odmah idi na hitnu!'
                            {else}
                                otrov = {ask} 'Jesi li progutao ili udahnuo otrov?'
                                {if} otrov {is} 'da'
                                    {print} 'Odmah idi na hitnu!'
                                {else}
                                    slomljena_kost = {ask} 'Jesi li slomio kost?'
                                    {if} slomljena_kost {is} 'da'
                                        {print} 'Odmah idi na hitnu!'
                                    {else}
                                        alergija = {ask} 'Imaš li ozbiljnu alergijsku reakciju?'
                                        {if} alergija {is} 'da'
                                            {print} 'Odmah idi na hitnu!'
                                        {else}
                                            cekanje = {ask} 'Može li pričekati do sutra?'
                                            {if} cekanje {is} 'da'
                                                {print} 'Idi svom liječniku čim prije.'
                                            {else}
                                                {print} 'Nazovi svog liječnika da razgovarate o situaciji'
                    ```
