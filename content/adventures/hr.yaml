adventures:
    story:
        name: Priča
        default_save_name: Priča
        description: Napiši kratku priču
        levels:
            1:
                story_text: "U razini 1 možeš napraviti priču s glavnim likom kojeg sam odabereš.\n\nU prvom retku upotrijebi `{ask}` i pitaj tko će biti glavni lik priče. Zatim upotrijebi {answer} kad god želiš iskoristiti ime lika.\n"
                example_code: "```\n{ask} Glavni lik ove priče je\n{print} {answer} sada ide u šetnju šumom\n{print} Pomalo uplašen, {answer} nastavlja dalje\n{print} {answer} posvuda čuje čudne zvukove\n{print} Boji se da je ovo ukleta šuma\n```\n"
                story_text_2: "### Zadatak\nSada napiši vlastitu priču od najmanje 6 redaka koda.\nPriča ne smije biti ista kao primjer koda.\nUpotrijebi barem jedan `{ask}` i jedan `{answer}`.\nTema može biti bilo što.\nAko ti ništa ne pada na pamet, odaberi jednu od naših ideja: odlazak u kino, sportska utakmica ili dan u zoološkom vrtu.\n"
                answer_code: |
                    ```
                    {print} Jednog dana otišao sam u zoološki vrt
                    {ask} Koju sam životinju prvo vidio?
                    {print} Prvo sam vidio {answer}
                    {print} Zatim sam vidio pingvina
                    {print} Upravo je ručao
                    {ask} Što je pingvin jeo?
                    {print} Pingvin je za ručak jeo {answer}
                    ```
            2:
                story_text: "U razini 2 svoju priču možeš učiniti zabavnijom. Ime tvog glavnog lika sada može biti bilo gdje u rečenici.\n\nZa to moraš programirati malo više. Sada prvo moraš imenovati svog glavnog lika.\n\nZatim to ime možeš staviti bilo gdje u rečenici.\n"
                example_code: "```\nime {is} {ask} Kako se zove glavni lik?\n{print} ime sada trči kroz šumu\n{print} ime se pomalo boji\n{print} Odjednom čuje čudan zvuk...\n{sleep}\n{print} ime se boji da je ovo ukleta šuma\n```"
                story_text_2: |
                    ### Zadatak
                    Vrijeme je da u svoju priču iz prethodne razine dodaš varijable.
                    Otvori svoju priču iz razine 1 i kopiraj kod. Zalijepi kod u svoj ekran za unos u ovoj razini.

                    Ovaj kod neće raditi u ovoj razini jer još nisi upotrijebio varijable.
                    Popravi kod koristeći varijable i `{is}` s naredbom `{ask}`, kao što si naučio u ovoj razini.

                    **Dodatno** Dodaj naredbu `{sleep}` u svoj kod da pojačaš napetost u priči.
                answer_code: |
                    ```
                    {print} Jednog dana otišao sam u zoološki vrt
                    prva_zivotinja {is} {ask} Koju sam životinju prvo vidio?
                    {print} Prvo sam vidio prva_zivotinja
                    {print} Zatim sam vidio pingvina
                    {print} Upravo je ručao
                    hrana {is} {ask} Što je pingvin jeo?
                    {print} Pingvin je jeo...
                    {sleep} 3
                    {print} hrana
                    ```
            3:
                story_text: "U razini 3 svoju priču možeš učiniti još zabavnijom. Možeš koristiti nasumičnost za bilo koje čudovište, životinju ili drugu prepreku, ovako:\n"
                example_code: "```\nzivotinje {is} 🦔, 🐿, 🦉, 🦇\n{print} Sada čuju zvuk — zivotinje {at} {random}\n```\n"
                story_text_2: "U priči ti može dobro doći i naredba `{add}`.\n"
                example_code_2: "```\n{print} Čuju neki zvuk\nzivotinje {is} 🐿, 🦔, 🦇, 🦉\nzivotinja {is} {ask} Što misliš, koja je to životinja?\n{add} zivotinja {to_list} zivotinje\n{print} bila je to zivotinje {at} {random}\n```\n"
                story_text_3: "Ovo je primjer naredbe `{remove}` u tvojoj priči\n\n### Zadatak\nKopiraj svoju priču iz prethodnih razina u ovu razinu.\nU ovoj razini naučio si 3 nove naredbe: `{at} {random}`, `{add} {to_list}` i `{remove} {from}`.\nDodaj nove retke koda u svoju priču tako da svaka nova naredba bude iskorištena barem jednom.\n"
                example_code_3: "```\n{print} Ruksak mu je postao pretežak.\n{print} Unutra su bili boca vode, svjetiljka i cigla.\ntorba {is} voda, svjetiljka, cigla\nvisak {is} {ask} Koju stvar treba izbaciti?\n{remove} visak {from} torba\n```\n"
                answer_code: |
                    ```
                    zivotinje {is} lav, zebra, plamenac
                    {print} Pozdrav djeco! Danas idemo u zoološki vrt!
                    najdraza_zivotinja {is} {ask} Kojoj životinji želiš ići danas?
                    {add} najdraza_zivotinja {to} zivotinje
                    {sleep} 2
                    {print} Idemo do — zivotinje {at} {random}
                    {sleep}
                    najgora_zivotinja {is} {ask} Koju životinju ne želiš vidjeti?
                    {remove} najgora_zivotinja {from} zivotinje
                    {print} Sada idemo do — zivotinje {at} {random}
                    ```
            4:
                story_text: "### Zadatak\nKopiraj primjer koda i dovrši ga dodavanjem navodnika na prazna mjesta u recima 1 i 2.\nPrazna mjesta u recima 3 i 4 ne popunjavaju se navodnicima, nego naredbama `{sleep}` i `{clear}`. Možeš li učiniti da radi?\n\n### Zadatak 2\nVrati se na prethodnu razinu i kopiraj kod svoje priče. Učini da kod radi u ovoj razini dodavanjem navodnika na prava mjesta.\nPazi: varijable u tvojoj priči trebaju biti izvan navodnika. Baš kao u drugom retku primjera koda — u tom je retku varijabla ime smještena izvan navodnika.\n"
                example_code: "```\nime {is} {ask} _ Kako se zoveš? _\n{print} _ Glavni lik zove se _ ime\n_\n_\n{print} ime _ sada ide u šetnju šumom _\n{print} ime _ se pomalo boji _\nzivotinje {is} 🦔, 🐿, 🦉, 🦇\n{print} _ Čuje zvuk — _ zivotinje {at} {random}\n{print} ime _ se boji da je ovo ukleta šuma _\n```\n"
                answer_code: |
                    ```
                    ime {is} {ask} 'Kako se zoveš?'
                    {print} 'Glavni lik zove se' ime
                    {print} ime ' sada ide u šetnju šumom'
                    {print} ime ' se pomalo boji'
                    zivotinje {is} 🦔, 🐿, 🦉, 🦇
                    {print} 'Čuje zvuk — ' zivotinje {at} {random}
                    {print} ime ' se boji da je ovo ukleta šuma'
                    ```
            5:
                story_text: "U ovoj razini možeš programirati različite završetke, što će tvoju priču učiniti još zabavnijom.\nU primjeru koda vidiš kako napraviti 2 različita završetka.\n\n### Zadatak 1\nNapiši novu kratku priču od najmanje 6 redaka koda o temi po svom izboru.\nNemaš inspiracije? Odaberi jednu od ovih tema: superjunak, dosadan školski dan, brodolomac na pustom otoku.\n\nSada daj igraču mogućnost da odabere sretan ili loš kraj, baš kao u primjeru koda.\nProgramiraj oba završetka.\n\n### Zadatak 2\nKopiraj priču koju si napravio u avanturi Priča u prethodnim razinama.\nPronađi način da u svoju priču dodaš barem 2 naredbe `{if}` i `{else}`.\nTo može biti sretan ili loš kraj, ali možeš pronaći i druge načine za korištenje tih naredbi.\n"
                example_code: |
                    ```
                    ime {is} {ask} 'Tko šeće šumom?'
                    {print} ime ' šeće kroz šumu'
                    {print} ime ' susreće čudovište'
                    kraj {is} {ask} 'Želiš li dobar ili loš kraj?'
                    {if} kraj {is} dobar {print} ime ' uzima mač i čudovište brzo bježi'
                    {else} {print} 'Čudovište proždire ' ime
                    ```
                answer_code: |
                    ```
                    ime {is} {ask} 'Tko je junak?'
                    {print} 'O ne, avion se ruši, tko će nas spasiti?'
                    {print} "Gle tko leti zrakom, pa to je " ime
                    kraj {is} {ask} 'Hoćeš li spasiti avion ili ga uništiti?'
                    {if} kraj {is} spasiti {print} ime "je sletio avionom, spasio nas je!"
                    {else} {print} "O ne! " ime " uništava avion, upomoć!"
                    ```
            6:
                story_text: |-
                    Sad kad možeš koristiti `{elif}` možeš stvoriti još interaktivniju priču! Mogao bi na primjer stvoriti više likova koji svi imaju različite osobine.
                    Ili bi mogao pustiti igrača da odabere kojim putem krenuti, koja vrata otvoriti ili koji čarobni napitak popiti...

                    ### Vježba
                    Stvori vlastitu priču s 3 ili više opcija koristeći `{elif}`.
                example_code: |
                    ```
                    lik {is} {ask} 'Tko će ti pomoći u tvojoj potrazi?'
                    {if} lik {is} 'Daisy'
                    {print} 'Odabrao si Daisy! Ona je najpametnija od svih!'
                    {elif} lik {is} 'Jason'
                    {print} 'Odabrao si Jasona! On je najjači od svih!'
                    {elif} lik {is} 'Sam'
                    {print} 'Odabrao si Sama! On je najbrži od svih!'
                    ```
                answer_code: |
                    Vlastiti odgovor
            8:
                story_text: |
                    U priči netko kaže riječi nekoliko puta. Na primjer, kad netko zove upomoć ili pjeva pjesmu.
                    Takva ponavljanja možeš staviti u svoju priču, u ovoj razini s `{repeat}`.

                    ### Vježba
                    Dodaj ponavljanje u vlastitu priču. Vrati se na svoje spremljene programe, odaberi svoj program priče iz prethodne razine i
                    pronađi redak s `{print}` i ponovi ga!
                example_code: |
                    ```
                    {print} 'Princ je stalno zvao upomoć'
                    {repeat} 5 {times} {print} 'Upomoć!'
                    {print} 'Zašto mi nitko ne pomaže?'
                    ```
                answer_code: |
                    {print} 'Sva djeca htjela su ići u zoološki vrt i stalno su to vikala!'
                    {repeat} 3 {times} {print} "Idemo u zoološki vrt!"
            9:
                story_text: |
                    U ovoj razini možeš koristiti više redaka u svojim naredbama `{if}`, ovako možeš nadograditi svoj sretan ili tužan kraj!

                    ### Vježba 1
                    Primjer koda pokazuje dva različita kraja; jedan gdje likovi skaču u vremeplov i jedan gdje ne skaču.
                    Dovrši praznine s barem jednom rečenicom po kraju.
                    **Dodatno** Produlji priču. Što se događa u priči? Možeš dodati i drugi `{ask}` s različitim opcijama.

                    ### Vježba 2
                    Vrati se na svoje spremljene programe, odaberi svoj program priče iz razine 5. Sad napiši dobar i loš kraj, svaki dug barem tri retka!
                example_code: |
                    ```
                    {print} 'O NE! T-rex se približava!'
                    kraj = {ask} 'Želiš li sretan ili tužan kraj?'
                    #Pričanje sretnog kraja priče:
                    {if} kraj {is} sretan
                        {print} 'Baš na vrijeme Richard skoči natrag u vremeplov!'
                        {print} _
                    #Pričanje tužnog kraja priče:
                    {else}
                        {print} 'O ne! Richard je prespor...'
                        {print} _
                    ```
                answer_code: |
                    ```
                    {print} 'O NE! T-rex se približava!'
                    kraj = {ask} 'Želiš li sretan ili tužan kraj?'
                    {if} kraj {is} sretan
                        {print} 'Baš na vrijeme Richard skoči natrag u vremeplov!'
                        {print} 'Uh, drago mi je da smo uspjeli'
                        {print} 'Baš na vrijeme'
                    {else}
                        {print} 'O ne! Richard je prespor...'
                        {print} 'T-rex ispusti golem RIK'
                        {print} 'Otvori usta i proguta Richarda u jednom zalogaju'
                    ```
            10:
                story_text: |
                    U ovoj razini možeš koristiti naredbe `{if}` i `{repeat}` unutar drugih naredbi `{if}` i `{repeat}`.
                    To ti daje mnogo opcija i stvarno ti pomaže da svoju priču učiniš interaktivnom.

                    ### Vježba 1
                    Dovrši kod tako da `{if}` ispravno radi.

                    ### Vježba 2
                    Dodaj `{if}` i `{else}` za dio priče gdje Robin također ide kući.

                    ### Vježba 3
                    Vrati se na svoju priču iz razine 8 i koristi barem dva `{if}`-a unutar drugog `{if}`.
                example_code: |
                    ```
                    {print} 'Robin šeta centrom grada'
                    lokacija = {ask} 'Ide li Robin u trgovinu ili ide kući?'
                    {if} lokacija {is} trgovina
                        {print} 'Ulazi u trgovinu.'
                        {print} 'Robin vidi zanimljivu knjigu'
                        knjiga = {ask} 'Kupuje li Robin knjigu?'
                        {if} knjiga {is} da
                        _ {print} 'Robin kupuje knjigu i ide kući'
                        _ {else}
                        _ {print} 'Robin izlazi iz trgovine i ide kući'
                    {else}
                        {print} 'Robin ide kući'
                    ```
                story_text_2: |
                    Korištenjem naredbi `{and}` i `{or}` možeš svoje priče učiniti svestranijima. Možeš postaviti dva pitanja i odgovoriti na kombinaciju odgovora.

                    ### Vježba 1
                    Pogledaj primjer koda i dovrši ga. Zatim dodaj barem još 2 `{if}` koda s `{and}` ili `{or}`.

                    ### Vježba 2
                    Pronađi priču iz prethodne razine i dodaj jedan `{and}` ili `{or}`.
                example_code_2: |
                    ```
                    {print} 'Naša junakinja šeta kroz šumu'
                    {print} 'Put se dijeli u dva smjera'
                    put = {ask} 'Koji put treba odabrati?'
                    oruzje = {ask} 'Koje oružje izvlači?'
                    {if} put {is} lijevo {and} oruzje {is} mač
                        _
                    ```
                answer_code: |
                    ```
                    {print} 'Robin šeta centrom grada'
                    lokacija = {ask} 'Ide li Robin u trgovinu ili ide kući?'
                    {if} lokacija {is} trgovina
                        {print} 'Ulazi u trgovinu.'
                        {print} 'Robin vidi zanimljivu knjigu'
                        knjiga = {ask} 'Kupuje li Robin knjigu?'
                        {if} knjiga {is} da
                            {print} 'Robin kupuje knjigu i ide kući'
                        {else}
                            {print} 'Robin izlazi iz trgovine i ide kući'
                    {else}
                        {print} 'Robin ide kući'
                        sladoled = {ask} 'Staje li usput kući po sladoled?'
                        {if} sladoled {is} da
                            {print} 'Robin prvo staje po sladoled'
                            {print} 'Bira sorbet od limuna'
                            {print} 'Ukusan je'
                        {else}
                            {print} 'Ide ravno kući'
                    ```
                answer_code_2: |
                    ```
                    {print} 'Naša junakinja šeta kroz šumu'
                    {print} 'Put se dijeli u dva smjera'
                    put = {ask} 'Koji put treba odabrati?'
                    oruzje = {ask} 'Koje oružje izvlači?'

                    {if} put {is} lijevo {and} oruzje {is} mač
                        {print} 'nijedno se čudovište ne usudi prići junakinji.'

                    {if} put {is} lijevo {and} oruzje {is} praćka
                        {print} 'junakinju napadne sovomedvjed.'

                    {if} put {is} desno {or} oruzje {is} knjiga_carolija
                        {print} 'junakinji prilazi tajanstveni čarobnjak.'
                    ```
            11:
                story_text: |
                    U ovoj razini možeš koristiti naredbu `{for}` u svojoj priči. Tako bi lako mogao isprogramirati dječju knjigu 'Smeđi medo, smeđi medo, što vidiš?'.

                    ### Vježba

                    Pogledaj <a href="https://fliphtml5.com/jmlya/nquy"> priču</a> ako je ne znaš i pobrini se da bude ispisana kao u knjizi.
                example_code: |
                    ```
                    zivotinje = _ , _ , _ 
                    {print} 'Smeđi medo, smeđi medo'
                    {print} 'Što vidiš?'
                    ```
                answer_code: |
                    ```
                    zivotinje = Crvena Ptica, Žuta Patka, Plavi Konj, Zelena Žaba, Ljubičasta Mačka, Bijeli Pas, Crna Ovca, Zlatna Ribica, Učiteljica
                    {print} 'Smeđi medo, smeđi medo'
                    {print} 'Što vidiš?'
                    {for} zivotinja {in} zivotinje
                        {print} 'Vidim ' zivotinja ' kako me gleda'
                        {print} zivotinja ', ' zivotinja
                        {print} 'Što vidiš?'
                    {print} 'Vidim djecu kako me gledaju'
                    {print} 'Djeco, djeco'
                    {print} 'Što vidite?'
                    {print} 'Vidimo '
                    {for} zivotinja {in} zivotinje
                        {print} zivotinja
                    {print} 'kako nas gledaju'
                    {print} 'To je ono što vidimo!'
                    ```
            13:
                story_text: |
                    Ispisat ćemo priču i moramo koristiti zagrade s `{print}`.

                    ### Vježba
                    Stvori priču od barem 5 rečenica. Prvo koristi varijablu `ime` u svojoj priči. Zatim stvori dvije druge varijable i također ih koristi.
                    Savjet: Ne zaboravi zareze u `{print}` između teksta i varijabli!
                example_code: |
                    ```
                    ime = _
                    {print}('Dobrodošli u ovu priču!')
                    ```
                answer_code: |
                    ```
                    ime = 'Hedy'
                    {print}('Dobrodošli u ovu priču!')
                    {print}('Jednom davno bila je papiga po imenu ', ime '.')
                    {print}(ime, ' je voljela programiranje!')
                    {print}("Nažalost, druge papige nisu znale programirati.")
                    {print}('Jednog dana ', ime, ' je odlučila naučiti druge papige programirati.')
                    {print}('Lekcije su se pokazale kao velik uspjeh kod drugih papiga!')
                    ```
            16:
                story_text: |
                    Korištenje `{while}` petlje može tvoje priče učiniti zanimljivijima. Na primjer, možeš koristiti `{while} igra == 'traje'` da možeš igrati dok igra ne završi.
                    Ili možeš koristiti `{while} mač == 'izgubljen'` da igrač ne može nastaviti igru dok ne pronađe nešto.

                    ### Vježba
                    Primjer koda pokazuje ti kako koristiti `{while}` petlju u priči. Sad **smisli vlastiti scenarij** u kojem igrač mora nešto pronaći prije nego može nastaviti.
                example_code: |
                    ```
                    kljucevi = 'izgubljeni'
                    {print}('Stojiš u svom vrtu i izgubio si ključeve.')
                    {print}('Gdje ih želiš potražiti?')
                    {print}('Možeš birati: stablo, gredica, kamen, poštanski sandučić')
                    {while} kljucevi == 'izgubljeni':
                        lokacija = {input}('Gdje želiš tražiti?')
                        {if} lokacija == 'gredica':
                            {print}('Evo ih!')
                            kljucevi = 'pronađeni'
                        {else}:
                            {print}('Ne, nisu kod ', lokacija)
                    {print}('Sad možeš ući u kuću!')
                    ```
                answer_code: |
                    ```
                    reketi = 'izgubljeni'
                    {print}('S prijateljima si i želiš igrati tenis, ali zaboravio si gdje si stavio rekete.')
                    {print}('Gdje ih želiš potražiti?')
                    {print}('Možeš birati: spavaća soba, spremište, ormar, radni stol')
                    {while} reketi == 'izgubljeni':
                        lokacija = {input}('Gdje želiš tražiti?')
                        {if} lokacija == 'radni stol':
                            {print}('Evo ih! Pronašao si 6 reketa!')
                            kljucevi = 'pronađeni'
                        {else}:
                            {print}('Ne, nisu kod ', lokacija)
                    {print}('Sad možeš igrati tenis sa svim prijateljima.')
                    ```
    add_remove_command:
        levels:
            3:
                story_text: |
                    ## {add} {to_list}
                    Stavke možeš dodati na popis naredbom `{add} {to_list}`. Da dodaš stavku na popis, možeš jednostavno upisati: `{add} pingvin {to_list} zivotinje` ili možeš koristiti naredbu `{ask}` kao u primjeru koda.
                example_code: |
                    ```
                    zivotinje {is} pas, mačka, klokan
                    odabir {is} {ask} Koja ti je najdraža životinja?
                    {add} odabir {to_list} zivotinje
                    {print} Biram zivotinje {at} {random}
                    ```
                story_text_2: |
                    ## {remove} {from}
                    Ako stavke možeš dodavati na popis, naravno da ih možeš i micati. To radiš naredbom `{remove} {from}`.
                example_code_2: |
                    ```
                    zivotinje {is} pas, mačka, klokan
                    neodabir {is} {ask} Koju životinju ne voliš?
                    {remove} neodabir {from} zivotinje
                    {print} Biram zivotinje {at} {random}
                    ```
                story_text_3: |
                    ### Vježba
                    Isprobaj nove naredbe u ovom virtualnom restoranu. Dodaj okus koji igrač priželjkuje na popis i makni okuse na koje je alergičan.
                example_code_3: |
                    ```
                    {print} Tajni frape
                    okusi {is} jagoda, čokolada, vanilija
                    zelja {is} {ask} Koji okus priželjkuješ?
                    _
                    alergije {is} {ask} Jesi li alergičan na neki okus?
                    _
                    {print} Dobiješ frape okusi {at} {random}
                    ```
                answer_code: |
                    ```
                    {print} Tajni frape
                    okusi {is} jagoda, čokolada, vanilija
                    zelja {is} {ask} Koji okus priželjkuješ?
                    {add} zelja {to} okusi
                    alergije {is} {ask} Jesi li alergičan na neki okus?
                    {remove} alergije {from} okusi
                    {print} Dobiješ frape okusi {at} {random}
                    ```
        name: '{add} {to_list} & {remove} {from}'
        description: Upoznavanje s naredbama {add} {to_list} i {remove} {from}
        default_save_name: Dodaj i makni
    and_or_command:
        levels:
            10:
