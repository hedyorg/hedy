                    Isprobaj naredbu `{ask}` i `{answer}`. Prvo popuni praznine da program proradi.
                    Zatim postavi još 2 pitanja naredbom `{ask}`, a nakon svakog `{ask}` upotrijebi `{answer}` da ispišeš odgovor na ekran.
                example_code_3: |
                    ```
                    _ Kako si danas?
                    _ Ti si _
                    ```
                answer_code: |
                    ```
