    quotation_marks:
        levels:
            4:
                story_text: |
                    ## 'Navodnici'
                    U razini 4 promijenile su se naredbe `{ask}` i `{print}`.
                    Tekst koji želiš ispisati sada moraš staviti između navodnika.
                    Ovo je korisno jer sad možeš ispisati sve riječi koje želiš. Pa i riječi koje si prije koristio/la za pohranu nečega naredbom `{is}`.
                    Većina programskih jezika također koristi navodnike prilikom ispisa, pa smo tako još korak bliže pravom programiranju!
                example_code: |
                    ```
                    {print} 'Od sada moraš koristiti navodnike!'
                    odgovor {is} {ask} 'Što od sada moramo koristiti?'
                    {print} 'Moramo koristiti ' odgovor
                    ```
                story_text_2: |
                    ## Apostrofi
                    Važno! Pazi, sad kad koristimo navodnike, Hedy će se zbuniti kad u tekstu koristiš apostrof, npr. u stranim imenima poput O'Brien ili D'Angelo.
                    Pazi da koristiš dvostruke navodnike kad u retku koristiš apostrof!
                    Pogledaj primjer koda da vidiš pogrešan način korištenja apostrofa.
                example_code_2: |
                    ```
                    _ Ovo je pogrešan način korištenja apostrofa _
                    {print} 'Čuvam O'Brienove klince'
                    {print} 'Poznaješ D'Angelovu obitelj?'
                    _ Ovako to rješavaš _
                    {print} "Čuvam O'Brienove klince"
                    {print} "Poznaješ D'Angelovu obitelj?"
                    ```
                answer_code: |
                    Vlastiti odgovor
