                    * Pitati koliko je tekućine pacijent dobio pićem toga dana.
                    * Pitati koliko je tekućine pacijent dobio jelom toga dana.
                    * Pitati koliko je tekućine pacijent dobio infuzijom toga dana.
                    * Pitati koliko je tekućine pacijent izgubio mokrenjem toga dana.
                    * Pitati koliko je tekućine pacijent izgubio povraćanjem toga dana.
                    * Izračunati ravnotežu tekućine pacijenta i prikazati je sestri.
                    * Reći sestri da provjeri je li ravnoteža pozitivna ili negativna kako bi odlučila treba li pacijentu danas više tekućine infuzijom ili ne.
                answer_code: |
                    ```
