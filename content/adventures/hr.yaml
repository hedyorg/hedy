                        _ stupnjevi

                    {def} nacrtaj_lik(stupnjevi, broj_stranica):
                        {for} i {in} {range} _
                            {forward} 70
                            {turn} _

                    broj_stranica = {input}('Koliko stranica želiš da lik ima?')
                    stupnjevi = izracunaj_stupnjeve(broj_stranica)

                    _
                    _
                    ```
                answer_code: |
                    ```
                    {def} izracunaj_stupnjeve(broj_stranica)
                        stupnjevi = 360 / broj_stranica
                        {return} stupnjevi

                    {def} nacrtaj_lik(stupnjevi, broj_stranica)
                        {for} i {in} {range} (1, broj_stranica)
                            {forward} 70
                            {turn} stupnjevi

                    broj_stranica = {input}('Koliko stranica želiš da lik ima?')
                    stupnjevi = izracunaj_stupnjeve(broj_stranica)

                    izracunaj_stupnjeve(broj_stranica)
                    nacrtaj_lik(stupnjevi, broj_stranica)
