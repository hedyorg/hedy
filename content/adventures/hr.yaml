            16:
                story_text: |
                    ### Vježba
                    U ovoj razini možeš napraviti malu igru u kojoj moraš baciti 6 što je brže moguće.
                    Započeli smo kod, na tebi je da natjeraš igru da radi!

                    Prvo dodaj `{while}` petlju koja provjerava je li bačena 6 ili ne.
                    Sve dok još nisi bacio 6, baci kocku na nasumičan broj.
                    {print} što je igrač bacio.
                    Dodaj pokušaj broju pokušaja.
                    Pričekaj sekundu prije nego ponovno baciš, ili - u slučaju da si bacio 6 - prije nego igra završi.
                example_code: |
                    ```
                    opcije = [1, 2, 3, 4, 5, 6]
                    {print}('Baci 6 što brže možeš!')
                    bacen = 0
                    pokusaji = 0
                    _
                    _
                    _
                    _
                    _
                    {print}('Da! Bacio si 6 u ', pokusaji, ' pokušaja.')
                    ```
                answer_code: |
                    ```
                    opcije = [1, 2, 3, 4, 5, 6]
                    {print}('Baci 6 što brže možeš!')
                    bacen = 0
                    pokusaji = 0
                    {while} bacen == 0:
                        broj = opcije[{random}]
                        pokusaji = pokusaji + 1
                        {if} broj = 6:
                            bacen = 1
                            {print}('Bacio si 6 u ', pokusaji, ' pokušaja!')
                        {else}:
                            {print}('Nisi bacio 6, umjesto toga bacio si ', broj)
                        {sleep} 1
                    ```
