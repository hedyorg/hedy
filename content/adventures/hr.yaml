                    ```
                    {def} narudzba_hrane():
                        prilozi = {input}('Pepperoni, tuna, vege ili sir?')
                        velicina = {input}('Velika, srednja ili mala?')
                        broj_pizza = {input}('Koliko ovih pizza želite?')

                        {print}('NARUČILI STE')
                        {print}(broj_pizza, ' ', velicina , ' ', prilozi, ' pizza')

                    {def} narudzba_pica():
                        pice = {input}('Voda, kola, ledeni čaj, limunada ili kava?')
                        broj_pica = {input}('Koliko ovih pića želite?')

                        {print}('NARUČILI STE')
                        {print}(broj_pica, ' ', pice)

                    {print}('Dobrodošli u Hedy pizzeriju')
                    jos_hrane = {input}('Želite li naručiti pizzu?')
                    {while} jos_hrane == 'da':
                        narudzba_hrane()
                        jos_hrane = {input}('Želite li naručiti pizzu?')
                    jos_pica = {input}('Želite li naručiti pića?')
                    {while} jos_pica == 'da':
                        narudzba_pica()
                        jos_pica = {input}('Želite li naručiti još pića?')

                    {print}('Hvala na narudžbi!')
                    ```
