                        ukupno = 0
                        broj_ispita = {input}("Koliko si ispita napisao iz ", predmet)
                        {for} i {in} {range} (1, broj_ispita):
                            ocjena = {input} ("Koju si ocjenu dobio na ispitu ", i, '?')
                            ukupno = ukupno + ocjena
                        {return} ukupno / broj_ispita

                    broj_predmeta = {input}('Za koliko predmeta želiš izračunati prosjek?')
                    {repeat} broj_predmeta {times}
                        predmet = {input}('Za koji predmet želiš izračunati prosjek?')
                        prosjek = izracunaj_prosjek(predmet)
                        {print} ('Tvoj prosjek iz ', predmet, ' je ', prosjek)
                    ```
