            15:
                story_text: |
                    ### Vježba 2
                    **Ovo je drugi dio ove avanture.** Avantura počinje u prethodnoj avanturi.
                    Naravno, ne želiš uvijek izračunati prosjek 4 ispita. Možda želiš izračunati prosjek 10 ispita ili samo 2...
                    Ovaj problem možemo riješiti dodavanjem argumenta i varijable 'broj_ispita'.
                    * Počni novi redak u 3. retku. Postavi argument broj_ispita pitanjem učenika koliko je ispita napisao.
                    * Promijeni 4 u 4. retku u novi argument broj_ispita.
                    * Na kraju promijeni 4 u 6. retku u broj_ispita

                    Isprobaj svoj novi program. Radi li?

                    ### Vježba 3
                    Želiš li svoj program učiniti još boljim? Odlično! U prethodnom programu mogao si izračunati prosjek samo 1 predmeta, ali bilo bi bolje kad bi mogao izračunati prosjek za sve predmete koje želiš!
                    Nećemo ti reći kako to učiniti, ali dat ćemo ti jedan savjet: Počni svoj kod u 1. retku s: `{def} izracunaj_prosjek(predmet):`.
                example_code: |
                    ```
                    # Koristi vlastiti kod iz prethodne avanture.
                    ```
                answer_code: |
                    Vježba 2
                    ```
                    {def} izracunaj_prosjek():
                        ukupno = 0
                        broj_ispita = {input}("Koliko si ispita napisao?")
                        {for} i {in} {range} (1, broj_ispita):
                            ocjena = {input}("Koju si ocjenu dobio na ispitu ", i, '?')
                            ukupno = ukupno + ocjena
                        {return} ukupno / broj_ispita

