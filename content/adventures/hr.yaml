    random_command:
        levels:
            3:
                story_text: |
                    ## Nasumično
                    U ovoj razini možeš napraviti popis naredbom `{is}`. Računalo možeš pustiti da odabere nasumičnu stavku s tog popisa. To radiš naredbom `{at} {random}`.
                example_code: |
                    ```
                    zivotinje {is} psi, mačke, klokani
                    {print} zivotinje {at} {random}
                    ```
                story_text_2: |
                    Naredbu `{at} {random}` možeš koristiti i u rečenici.
                example_code_2: |
                    ```
                    hrana {is} sendvič, komad pizze, salata, burrito
                    {print} Za ručak ću pojesti hrana {at} {random}.
                    ```
                story_text_3: |
                    ### Vježba
                    Isprobaj naredbu `{at} {random}` tako da napraviš vlastiti kviz-show (poput onih na televiziji) gdje biraš vrata ili kovčeg u kojem je velika nagrada!
                    Možeš li? Prve retke već smo stavili u primjer koda.
                example_code_3: |
                    ```
                    {print} Veliki kviz-show!
                    {print} Pred tobom su 3 kovčega...
                    odabir {is} {ask} Koji kovčeg biraš?
                    nagrade {is} _
                    _
                    ```
                answer_code: |-
                    ```
                    {print} Veliki kviz-show!
                    {print} Pred tobom su 3 kovčega...
                    odabir {is} {ask} Koji kovčeg biraš?
                    nagrade {is} taco, olovka, milijun dolara
                    {print} Osvajaš... nagrade {at} {random}
                    ```
            14:
                story_text: |-
                    Sad kad si naučio koristiti zagrade u listama, uvest ćemo i drugačiji način korištenja naredbe `{at} {random}`.
                    Jednostavno upišeš ime svoje liste s `[random]` iza njega, gdje bi inače upisao broj!
                example_code: |-
                    ```
                    voce = ['jabuka', 'banana', 'trešnja']
                    {print}(voce[random])
                    ```
                story_text_2: |-
                    ### Vježba
                    Dovrši kod. Pusti računalo da odabere nasumičnog pobjednika.
                example_code_2: |-
                    ```
                    imena = _'Sarah', 'Jason', 'Meghan'_
                    {print}('Pobjednik je:' _ )
                    ```
                answer_code: |
                    ```
                    imena = ['Sarah', 'Jason', 'Meghan']
                    {print}('Pobjednik je:' imena[random] )
                    ```
        name: '{random}'
        description: Upoznavanje s naredbom {at} {random}
        default_save_name: Nasumično
    repeat_command:
        levels:
            8:
                story_text: |
                    Ova razina dodaje naredbu `{repeat}`. `{repeat}` se može koristiti za izvršavanje jednog retka koda više puta. Ovako:

                    ### Vježba
                    Igraj se s naredbom `{repeat}`. Možeš li sad napraviti pjesmu sretan rođendan u samo 3 retka koda umjesto 4?
                example_code: |
                    ```
                    {repeat} 3 {times} {print} 'Hedy je zabavan!'
                    ```
                answer_code: |
                    ```
                    {repeat} 2 {times} {print} 'sretan ti rođendan'
                    {print} 'sretan rođendan draga Hedy'
                    {print} 'sretan ti rođendan'
                    ```
            9:
                story_text: |
                    U ovoj razini možeš ponoviti više redaka koda samo s 1 naredbom `{repeat}`.
                    To radiš tako da napraviš blok redaka koje želiš ponoviti.
                    Retci u tom bloku trebat će **uvlačenje** .
                    To znači stavljanje četiriju razmaka na početak svakog retka. Uvlačenje ćeš morati koristiti i kad želiš napraviti blok od samo jednog retka.
                example_code: |
                    ```
                    {repeat} 5 {times}
                        {print} 'Bok svima'
                        {print} 'Ovo se sve ponavlja 5 puta'
                    ```
                answer_code: |
                    ```
                    {print} 'Znaš li pjesmu o muffinu?'
                    {repeat} 2 times
                        {print} 'Čovjek s muffinima'
                    {print} 'Znaš li čovjeka s muffinima koji živi u Ulici Drury?'
                    ```
            10:
                story_text: |
                    Bravo! Stigao/la si do još jedne nove razine! U prethodnoj razini naučio/la si koristiti više redaka koda u naredbi `{if}` ili `{repeat}`.
                    Ali još ih ne možeš kombinirati...

                    Dobre vijesti! U ovoj razini smjet ćeš staviti `{if}` unutar `{if}`, `{repeat}` unutar naredbe `{repeat}` i jedno u drugo.
                    Probaj!
                example_code: |
                    ```
                    {repeat} 3 {times}
                        narudzba = {ask} 'Što biste željeli naručiti?'
                        {if} narudzba {is} pizza
                            {print} 'Njam'
                        {else}
                            {print} 'pizza je bolja!'
                    ```
                answer_code: |
                    Vlastiti odgovor
        name: '{repeat}'
        description: Upoznavanje s naredbom {repeat}
        default_save_name: Ponavljanje
    repeat_command_2:
        levels:
            8:
                story_text: |
                    ## Ponavljanje s drugim naredbama i s varijablama
                    Sad si uvježbao naredbu `{repeat}` u kombinaciji s naredbom `{print}`, ali jesi li znao da s `{repeat}` možeš koristiti i druge naredbe?
                    U ovom primjeru koda vidiš da se `{repeat}` može koristiti i s naredbom `{ask}`, `{if}` ili `{else}`.
                example_code: |
                    ```
                    {repeat} 2 {times} odgovor = {ask} 'Jesi li znao da možeš postaviti pitanje više puta?'
                    {if} odgovor {is} da
                    {repeat} 2 {times} {print} 'To si već znao!'
                    {else}
                    {repeat} 3 {times} {print} 'Naučio si nešto novo!'
                    ```
                story_text_2: |
                    Još jedna zanimljiva stvar koju možeš raditi s naredbom `{repeat}` je korištenje varijabli za postavljanje koliko puta se nešto treba ponoviti. U primjeru koda vidiš da prvo pitamo osobu koliko ima godina.
                    Zatim se, u 3. retku, pitanje ponavlja 'dob' puta. Dakle koristili smo varijablu 'dob' s naredbom `{repeat}`.
                example_code_2: |
                    ```
                    {print} 'Juhu! Rođendan ti je!'
                    dob = {ask} 'Koliko sad imaš godina?'
                    {repeat} dob {times} {print} 'Hip Hip Hura!'
                    ```
                answer_code: |
                    Vlastiti odgovor
            9:
                story_text: |
                    ### U bloku ili ne?
                    U ovoj razini moraš pažljivo razmisliti koji retci koda trebaju biti u bloku, a koji ne.
                    Na primjer: Ako želiš otpjevati pjesmu *čovjek s muffinima*. Želiš da se samo redak s 'čovjek s muffinima' ponovi dvaput.
                    To znači da posljednji redak ne bi trebao započeti uvlačenjem jer ne pripada bloku.
                    Ako posljednji redak ipak započneš uvlačenjem, pjesma će ispasti pogrešna.

                    ### Vježba
                    Svaki redak u primjeru koda započinje prazninom. Ukloni praznine i pokušaj shvatiti koji redak treba uvlačenje, a koji ne da napraviš pjesmu čovjek s muffinima.
                example_code: |
                    ```
                    _ {print} 'Znaš li pjesmu o muffinu?'
                    _ {repeat} 2 {times}
                    _ {print} 'Čovjek s muffinima'
                    _ {print} 'Znaš li čovjeka s muffinima koji živi u Ulici Drury?'
                    ```
                answer_code: |
                    ```
                    {print} 'Znaš li pjesmu o muffinu?'
                    {repeat} 2 {times}
                        {print} 'Čovjek s muffinima'
                    {print} 'Znaš li čovjeka s muffinima koji živi u Ulici Drury?'
                    ```
        name: '{repeat} 2'
        description: Vježbanje naredbe {repeat}
        default_save_name: Ponavljanje 2
    restaurant:
        levels:
            1:
                story_text: |
                    U razini 1 možeš napraviti vlastiti virtualni restoran i zaprimati narudžbe gostiju.
                story_text_2: |
                    ### Zadatak
                    Kopiraj primjer koda na svoj ekran za unos klikom na žuti gumb.
                    Prvo upiši ispravnu naredbu na prazna mjesta da kod ispravno radi.
                    Zatim dodaj još najmanje 4 retka koda u program restorana.
                    Pitaj gosta što želi popiti te želi li platiti gotovinom ili karticom.
                    Na kraju smisli lijep način da se pozdraviš s gostom.
                example_code_2: |
                    ```
                    {print} Dobro došli u Hedyn restoran 🍟
                    _ Što biste željeli naručiti?
                    {print} Dakle, željeli biste naručiti {answer}
                    {print} Hvala na narudžbi!
                    {print} Već stiže!
                    ```
                answer_code: |
                    ```
                    {print} Dobro došli u Hedyn restoran 🍟
                    {ask} Što biste željeli naručiti?
                    {print} Dakle, željeli biste naručiti {answer}
                    {ask} Što biste željeli popiti?
                    {print} Dakle, za piće želite {answer}
                    {ask} Želite li platiti gotovinom ili karticom
                    {print} plaćate {answer}
                    {print} Hvala na narudžbi!
                    {print} Već stiže!
                    {print} Doviđenja!
                    ```
            2:
                story_text: |
                    U razini 2 mogao/la si proširiti svoj restoran koristeći varijable. U razini 1 Hedy je mogao zapamtiti samo posljednju naručenu stvar.
                    Sad možeš koristiti varijable i Hedy može zapamtiti i jelo i dodatke!
                example_code: |
                    ```
                    {print} Dobrodošli u Hedyjev restoran!
                    {print} Danas poslužujemo pizzu ili lazanje.
                    jelo {is} {ask} Što biste željeli jesti?
                    {print} Odličan izbor! jelo mi je najdraže!
                    dodatak {is} {ask} Želite li meso ili povrće uz to?
                    {print} jelo s dodatak stiže!
                    ```
                story_text_2: |
                    ### Vježba
                    Kopiraj svoj kod restorana iz prethodne razine u polje za unos ispod.
                    Ispravi kod koristeći varijable i `{is}` s naredbom `{ask}`, kao što si naučio/la u ovoj razini.

                    Sad kad tvoj kod opet radi, vrijeme je da dodaš nešto više.
                    Pogledaj posljednji redak primjera koda: `{print} jelo s dodatak stiže!`
                    U tom jednom retku korištene su 2 varijable za izradu sažetka narudžbe.
                    Sad dodaj vlastiti sažetak jela i pića koje je gost naručio.

                    **Dodatno** Sad kad si naučio/la koristiti varijable, možeš u jednom retku koristiti koliko god varijabli želiš. Možeš li dodati više varijabli u svoj kod, poput jesti ovdje ili ponijeti, gotovina ili kartica, sa slamkom ili bez itd.?
                answer_code: |
                    ```
                    {print} Dobrodošli u Hedyjev restoran 🍟
                    jelo {is} {ask} Što biste željeli naručiti?
                    {print} Dakle, željeli biste naručiti jelo
                    pice {is} {ask} Što biste željeli popiti?
                    {print} Dakle, željeli biste pice
                    slamka {is} {ask} Želite li slamku uz to?
                    {print} u redu!
                    placanje {is} {ask} Želite li platiti gotovinom ili karticom?
                    {print} Nema problema
                    mjesto {is} {ask} Želite li jesti ovdje ili ponijeti?
                    {print} Hvala na narudžbi!
                    {print} Stiže!
                    {print} Hvala! Doviđenja!
                    ```
            3:
                story_text: |
                    Muka ti je odlučiti što ćeš za večeru? Možeš pustiti Hedyja da odabere za tebe!
                    Jednostavno dodaj popise svojih najdražih (ili najmanje dragih) jela i Hedy može nasumično odabrati tvoju večeru.
                    Možeš se i malo zabaviti tako da pustiš Hedyja da odabere i cijenu tvoje večere! Što ćeš dobiti?
                example_code: |
                    ```
                    jela {is} špageti, kelj pupčar, hamburgeri
                    {print} Večeras ćeš imati jela {at} {random}!
                    cijene {is} 1 euro, 10 eura, 100 eura
                    {print} To će biti cijene {at} {random} molim.
                    ```
                story_text_2: |
                    ### Vježba
                    Sad napravi vlastitu verziju nasumičnog restorana.
                    Sam/a napravi popis predjela, glavnih jela, deserata, pića i cijena.
                    Zatim naredbama `{print}` i `{at} {random}` reci gostu što će večeras biti na njegovom jelovniku.
                example_code_2: |
                    ```
                    {print} Dobrodošli u svoj nasumični restoran!
                    predjela {is} _
                    glavna_jela {is} _
                    deserti {is} _
                    pica {is} _
                    cijene {is} _
                    _
                    ```
                answer_code: |
                    ```
                    {print} Dobrodošli u svoj nasumični restoran!
                    predjela {is} juha, salata, ništa
                    glavna_jela {is} kelj pupčar, pržene paukove noge, pizza
                    deserti {is} čokoladna torta, francuski sirevi, panna cotta
                    pica {is} kola, voda, pivo
                    cijene {is} 50 centi, 50 eura, 500 eura
                    {print} imat ćeš predjela {at} {random}
                    {print} zatim glavna_jela {at} {random}
                    {print} na kraju ćeš dobiti deserti {at} {random}
                    {print} pit ćeš pica {at} {random}
                    {print} to će biti cijene {at} {random} molim!
                    ```
            4:
                story_text: |
                    U restoranu također moraš koristiti navodnike kad koristiš naredbu `{print}` ili `{ask}`.

                    ### Vježba
                    Dodaj navodnike ovom kodu da proradi! Pazi: varijable ne smiju biti unutar navodnika.
                    Zatim koristi naredbu `{clear}` da u svom izlaznom ekranu odjednom prikažeš samo jedan redak.

                    ### Vježba 2
                    Vrati se na prethodnu razinu i kopiraj svoj kod restorana. Učini da kod radi u ovoj razini dodavanjem navodnika na prava mjesta i dodaj nekoliko naredbi `{clear}`.
                example_code: |
                    ```
                    _ Dodaj navodnike ovom kodu _
                    {print} Dobrodošli u restoran Chez Hedy!
                    {print} Danas poslužujemo pizzu ili lazanje.
                    jelo {is} {ask} Što biste željeli jesti?
                    {print} Odličan izbor! jelo mi je najdraže!
                    dodatak {is} {ask} Želite li meso ili povrće uz to?
                    {print} jelo  s  dodatak  stiže!
                    pice {is} {ask} Što biste željeli popiti uz to?
                    {print} Hvala na narudžbi.
                    {print} Vaše  jelo  i  pice  stižu odmah!
                    ```
                answer_code: |
                    ```
                    {print} 'Dobrodošli u restoran Chez Hedy!'
                    {print} 'Danas poslužujemo pizzu ili lazanje.'
                    jelo {is} {ask} 'Što biste željeli jesti?'
                    {print} 'Odličan izbor! ' jelo ' mi je najdraže!'
                    dodatak {is} {ask} 'Želite li meso ili povrće uz to?'
                    {print} jelo ' s dodatak stiže!'
                    pice {is} {ask} 'Što biste željeli popiti uz to?'
                    {print} 'Hvala na narudžbi.'
                    {print} 'Vaše  jelo  i  pice  stižu odmah!'
                    ```
            6:
                story_text: |
                    ### Vježba
                    Primjer koda pokazuje kako bi mogao programirati da ti je ponestalo neke stavke s jelovnika u restoranu.
                    Kopiraj vlastiti kod restorana iz prethodnih razina. Napravi problem u svom restoranu i isprogramiraj ga, kao što je pokazao primjer koda.
                    Na primjer, može ti ponestati neke stavke s jelovnika, ili ne primaš kreditne kartice, ili je pokvaren stroj za sladoled.

                    **Dodatno** Jesi li isprogramirao/la problem i odgovarajuće odgovore? Onda pokušaj dodati još naredbi `{if}` i `{else}` u svoj kod.
                    Pokušaj dodati `{if}` nakon svake naredbe `{ask}` u svom kodu da kod bude što interaktivniji!
                example_code: |
                    ```
                    pica_na_zalihi {is} voda, limunada, kola, sok od naranče
                    pice {is} {ask} 'Što biste željeli popiti?'
                    {if} pice {in} pica_na_zalihi
                    {print} 'Jedna ' pice ' stiže!'
                    {else}
                    {print} 'Žao nam je, to ne prodajemo'
                    ```
                answer_code: |
                    ```
                    hrana_na_zalihi {is} burger, pomfrit, palačinke, pileći medaljoni
                    hrana {is} {ask} 'Što biste željeli jesti?'
                    {if} hrana {is} {in} hrana_na_zalihi
