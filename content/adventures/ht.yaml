adventures:
    story:
        name: istwa
        default_save_name: Istwa
        description: Kreye yon istwa kout
        levels:
            1:
                story_text: |
                    Nan nivo 1 ou ka fè yon istwa ak yon karaktè prensipal diferan ke ou antre .

                    Nan premye liy lan, sèvi ak '{mande}' epi mande ki moun ki pral karaktè prensipal la nan istwa a. Lè sa a, sèvi ak {repons} si ou vle sèvi ak non karaktè a.
                example_code: |
                    ```
                    {mande} Karaktè prensipal istwa sa a se
                    {enprime} {repons} kounye a pral mache nan forè a
                    {enprime} Malgre li yon ti jan pè, {repons} kontinye mache 
                    {enprime} {repons} tande bri fou toupatou
                    {enprime} Yo pè sa a se yon forè ante
                    ```
                story_text_2: |
                    ### Egzèsis
                    Koulye a, kreye pwòp istwa ou nan omwen 6 liy  kòd
                    Istwa sa a pa ka menm jan ak kòd nan egzanp la.
                    Sèvi ak omwen yon '{mande}' ak yon sèl '{reponn}'.
                    Ou ka fè li sou nenpòt sijè ou renmen.
                    Si ou pa ka panse a yon sijè, sèvi ak youn nan chwa nou yo: ale nan sinema yo, yon match espò oswa yon jou nan zou a.
