adventures:
    story:
        levels:
            1:
                story_text: |
                    توی مرحله ۱ می‌تونی یه داستان با یه شخصیت اصلی متفاوت بسازی که خودت واردش می‌کنی. 
                     
                    توی خط اول، از `{ask}` استفاده کن و بپرس شخصیت اصلی داستان کی می‌خواد باشه. بعد اگه می‌خوای از اسم اون شخصیت استفاده کنی، از {answer} استفاده کن.
                example_code: |
                    ``` 
                    {ask} شخصیت اصلی این داستان کیه 
                    {print} {answer} حالا می‌خواد بره توی جنگل قدم بزنه 
                    {print} یه‌کم ترسیده، {answer} به راهش ادامه می‌ده 
                    {print} {answer} از هر طرف صداهای عجیب و غریب می‌شنوه 
                    {print} می‌ترسه که این یه جنگل جن‌زده باشه 
                    ```
                story_text_2: |
                    ### تمرین 
                    حالا داستان خودت رو با حداقل ۶ خط کد بساز. 
                    این داستان نباید مثل کد نمونه باشه. 
                    حداقل از یه `{ask}` و یه `{answer}` استفاده کن. 
                    می‌تونه داستانت درباره هر موضوعی که دوست داری باشه. 
                    اگه به ذهنت موضوعی نمی‌رسه، از یکی از انتخاب‌های ما استفاده کن: رفتن به سینما، یه مسابقه ورزشی یا یه روز توی باغ‌وحش.
                answer_code: |
                    ``` 
                    {print} یه روز من به باغ‌وحش رفتم 
                    {ask} چه حیوونی رو اول دیدم؟ 
                    {print} اول یه {answer} دیدم 
                    {print} بعد یه پنگوئن دیدم 
                    {print} اون داشت ناهار می‌خورد 
                    {ask} پنگوئن داشت چی می‌خورد؟ 
                    {print} پنگوئن برای ناهار {answer} می‌خورد 
                    ```
            2:
                story_text: |
                    توی مرحله ۲ میتونی داستانت رو باحال‌تر کنی. الان اسم شخصیت اصلیت می‌تونه هر جایی تو جمله باشه. 
                     
                    برای این کار باید یه‌کم بیشتر برنامه‌نویسی کنی. الان باید اول اسم شخصیت اصلیت رو انتخاب کنی. 
                     
                    بعد می‌تونی اون اسم رو هر جای جمله که بخوای بذاری.
                example_code: |-
                    ``` 
                    اسم {is} {ask} اسم شخصیت اصلی چیه؟ 
                    {print} الان اسم قراره توی جنگل بدوئه 
                    {print} اسم کمی ترسیده
                    {print} یهویی صدای عجیبی می‌شنوه... 
                    {sleep} 
                    {print} اسم می‌ترسه که این یه جنگل جن‌زده باشه 
                    ```
                story_text_2: |
                    ### تمرین 
                    الان وقتشه که چندتا متغیر به داستان خودت که توی مرحله قبلی ساختی، اضافه کنی. 
                    به ماجراجوییت توی مرحله ۱ برو و کد رو کپی کن. کد رو توی صفحه ورودی این مرحله پیست کن. 
                     
                    این کد در این مرحله کار نمی‌کنه، چون تو هنوز از متغیرها استفاده نکردی. 
                    کد رو با استفاده از متغیرها و `{is}` با دستور `{ask}` همون‌طور که توی این مرحله یاد گرفتی، مشکلاتش رو درست کن. 
                     
                    **اضافی** یه دستور `{sleep}` به کدت اضافه کن تا هیجان داستانت بیشتر بشه.
                answer_code: |
                    ``` 
                    {print} یه روز به باغ‌وحش رفتم 
                    حیوون_اول {is} {ask} چه حیوونی اول دیدم؟ 
                    {print} اول یه حیوون_اول دیدم 
                    {print} بعد یه پنگوئن دیدم 
                    {print} داشت ناهار می‌خورد 
                    غذا {is} {ask} پنگوئن چی می‌خورد؟ 
                    {print} پنگوئن داشت می‌خورد... 
                    {sleep} ۳ 
                    {print} غذا 
                    ```
            3:
                story_text: |
                    توی مرحله ۳ می‌تونی داستانت رو باحال‌تر کنی. می‌تونی از تصادفی بودن برای هر هیولا، حیوون یا هر مانع دیگه‌ای استفاده کنی؛ مثل این:
                example_code: |
                    ``` 
                    حیوون‌ها {is} 🦔، 🐿، 🦉، 🦇 
                    {print} اونها الان صدای حیوون‌ها {at} {random} رو می‌شنون 
                    ```
        name: داستان
        default_save_name: داستان
        description: یه داستان کوتاه بساز
