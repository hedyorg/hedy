            14:
                story_text: |
                    Naši údržbári majú veľký zoznam úloh. Niektoré sa robia každý deň, iné v určitý deň, obdobie alebo dátum. To je veľmi mätúce a vedie k situáciám, keď sa na niektoré úlohy zabudne.
                    Vieš pomôcť programom, ktorý vypíše správny zoznam úloh na ten deň?
                    ### Cvičenie
                    Program má:
                    * Popriať údržbárovi dobré ráno.
                    * Opýtať sa, aký je deň v týždni, ktorý mesiac a ktorý deň v mesiaci.
                    * Vypísať správny zoznam úloh na ten deň.
                    Úlohy, ktoré treba urobiť:
                    * Každý deň: umyť podlahu, vyčistiť toalety, otvoriť záclony
                    * V pondelok a vo štvrtok: poliať rastliny
                    * V utorok a v piatok: umyť podlahy
                    * V sobotu: umyť kávovar
                    * Prvého každého mesiaca: umyť okná
                    * Siedmeho každého mesiaca: doplniť automaty
                    * Štrnásteho každého mesiaca: skontrolovať batérie požiarnych hlásičov
                    * Každý deň v zimných mesiacoch: zapnúť kúrenie
                    * Každý deň v letných mesiacoch: zapnúť klimatizáciu
                answer_code: |
                    ```
                    {print}("Dobré ráno, údržbár")

                    #asking the date
                    day = {input}("Aký je dnes deň v týždni?")
                    current_month = {input}("Aký je mesiac?")
                    date = {input}("Aký je dátum?")

                    #printing the task list
                    print("Údržbár, tvoje úlohy na dnes sú: ")

                    #deciding the tasks based on day of the week
                    {if} day == "monday" {or} day == "thursday":
                        {print}("poliať rastliny")
                    {elif} day == "tuesday" {or} day == "friday":
                        {print}("umyť podlahy")
                    {elif} day == "saturday":
                        {print}("umyť kávovar")

                    #deciding the tasks based on date
                    {if} date == 1:
                        {print}("umyť okná")
                    {elif} date == 7:
                        {print}("doplniť automaty")
                    {elif} date == 14:
                        {print}("skontrolovať batérie požiarnych hlásičov")

                    #making a list of summer months and winter months
                    summer_months = ["april", "may", "june", "july", "august", "september"]
                    winter_months = ["october", "november", "december", "january", "february", "march"]

                    #deciding tasks based on summer or winter
                    {for} month {in} summer_months:
                        {if} current_month == month:
                            {print}("zapnúť klimatizáciu")
                    {for} month {in} winter_months:
                        {if} current_month == month:
                            {print}("zapnúť kúrenie")
                    ```
            15:
                story_text: |
                    Po operácii môžu pacienti niekedy cítiť veľkú bolesť. Vtedy môžu dostať morfínovú pumpu. Pri bolesti si môžu podať trochu morfínu sami.
                    Tieto pumpy treba naprogramovať veľmi opatrne, aby si pacienti nepodali príliš veľa morfínu. Vieš pre nás naprogramovať morfínovú pumpu?
                    ### Cvičenie
                    Program má:
                    * Opýtať sa sestry, koľko mililitrov morfínu pacient už dnes dostal.
                    * Povedať sestre, nech dá zariadenie pacientovi
                    * Opýtať sa pacienta, akú veľkú bolesť cíti na stupnici od 1 do 10.
                    * Povedať pacientovi, nech stlačí tlačidlo x, ak chce viac morfínu.
                    * Zavolať funkciu start_pump s argumentmi pain_level a morphine_level, ak je stlačené x.
                    * Funkcia má vypísať 'Podá sa ešte 20 ml morfínu', kým je úroveň bolesti pacienta vyššia alebo rovná 6 a úroveň morfínu je nižšia ako 120.
                    * Po podaní nového morfínu má program počkať 2 minúty (pri testovaní programu stačia 2 sekundy).
                    * Po tých 2 minútach sa má úroveň morfínu aktualizovať (+20 ml) a úroveň bolesti aktualizovať otázkou, ako sa pacient cíti teraz.
                    * Ak je úroveň morfínu príliš vysoká alebo pacient už nemá bolesť, program má povedať, že viac morfínu nedostane. Ak je veľká bolesť, povedať, nech zavolá sestru.
                    * Povedať pacientovi, že pumpa sa teraz vypne, a nech stlačí x, ak ju treba znova spustiť.
                answer_code: |-
                    ```
                    {print}('Morfínová pumpa')
                    morphine_level = {input}('Koľko ml morfínu pacient už dnes dostal?')
                    {print}('prosím, daj toto zariadenie teraz pacientovi')

                    pain_level = {input}('Akú veľkú bolesť cítiš od 1 do 10?')
                    {print}('Stlač X na podanie morfínu')

                    {define} morphine(pain_level, morphine_level):
                        {print}('Podá sa ešte 20 ml morfínu')
                        {sleep} 2
                        morphine_level = morphine_level + 20
                        pain_level = {input}('Akú veľkú bolesť cítiš od 1 do 10?')
                        {print}('Pumpa sa teraz vypne')
                        {return} morphine_level
                        {return} pain_level
                        {sleep} 2

                    {for} i {in} {range} (1,10):
                        wait_for_x = {input}('Stlač X na podanie morfínu')
                        {if} wait_for_x == 'x'
                            {if} pain_level >= 6 {and} morphine_level <120:
                                morphine_level = morphine(pain_level, morphine_level)
                                pain_level = morphine(pain_level, morphine_level)
                            {else}:
                                {print}('Teraz by nebolo bezpečné podať ďalší morfín')
                                {print}('Ak je príliš veľká bolesť, zavolaj sestru')
                    ```
            16:
                story_text: |
                    Naši medickí študenti sa musia naučiť lekárske názvy všetkých častí tela. Zdá sa, že majú problém pamätať si všetky anatomické názvy a štúdium im príde veľmi nudné.
                    Vieš im pomôcť hrou, v ktorej si môžu precvičiť lekárske pojmy?
                    Toto sú pojmy, ktoré majú študenti vedieť: corpus = body, caput = head, ocolus = eye, nasus = nose, auris = ear, os = mouth, collum = neck, manus = hand, pectus = chest, humerus = shoulder, venter = stomach, tergum = back
                    ### Cvičenie
                    Program má:
                    * Byť hrou, v ktorej si študenti môžu precvičiť lekárske pojmy.
                    * Dať študentovi bod a kompliment, keď je odpoveď správna.
                    * Zobrať bod a povedať, že odpoveď je nesprávna, keď je odpoveď zlá.
                    * Pri zlej odpovedi aj na pár sekúnd ukázať správnu odpoveď, potom ju z obrazovky znova zmazať a pýtať sa otázku, kým nie je správna.
                    * Hrať, kým študent neodpovie správne na všetky otázky.
                    * Ukázovať študentovi finálne skóre.
                    * Dať študentovi spätnú väzbu podľa skóre: 12 bodov: Úžasné!, 8 - 11 bodov: Dobrá práca, pokračuj v cvičení!, 7 alebo menej: Treba sa viac učiť!
                answer_code: |
                    ```
                    points = 0
                    latin_terms = ['corpus', 'caput',  'ocolus',  'nasus', 'auris', 'os', 'collum',  'manus', 'pectus',  'humerus', 'venter', 'tergum']
                    english_terms = ['body', 'head', 'eye', 'nose', 'ear', 'mouth', 'neck', 'hand', 'chest', 'shoulder', 'stomach', 'back']

                    {for} i {in} {range}(1, 12):
                        correct_answer = english_terms[i]
                        answer = 0
                        {while} answer != correct_answer:
                            answer = {input}('Aké je anglické pomenovanie pre ', latin_terms[i], '?')
                            {if} answer != correct_answer:
                                {print}('To je nesprávne')
                                {print}('Správna odpoveď pre ', latin_terms[i], ' je ', english_terms[i])
                                {sleep} 3
                                clear
                                points = points - 1
                        points = points + 1
                        {print}('Správne!')

                    {print}("Gratulujeme, všetky pojmy sú precvičené!")
                    {print}('Tvoje skóre je:', points)

                    {if} points == 12:
                        {print}('Úžasné!')

                    {if} points <=7:
                        {print}('Treba sa viac učiť!')
                    {else}:
                        {print}('Dobrá práca, pokračuj v cvičení!')
                    ```
