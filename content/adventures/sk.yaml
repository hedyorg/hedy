                example_code: |
                    ```
                    _ calculate_budget(wish, money, allowance):
                        to_save = wish - money
                        weeks = to_save / allowance
                        {if} wish _ money:
                            {print}('Treba ešte našetriť!')
                            {print}('Treba ešte ', weeks, ' týždňov.')
                        {else}:
                            {print}('Super! Peniaze stačia')
                            {print}("Poďme nakupovať!")

                    money = {input}('Koľko peňazí už je našetrených?')
