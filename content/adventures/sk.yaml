                    Na tejto úrovni sa použije viac **premenných**. Premenná je miesto, kde sa uloží odpoveď (alebo *vstup*) od používateľa. Premenná `{answer}` sa už používala, teraz ich bude viac!
                    Táto ukážka ukazuje premenné „name“ a „age“.

                    ## {ask}
