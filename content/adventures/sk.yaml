                    {repeat} 2 {times} {play} A
                    {play} G
                    {repeat} 2 {times} {play} E
                    {repeat} 2 {times} {play} D
                    {play} C
                    ```
            9:
                story_text: |
                    Keď už ide `{repeat}` na viac riadkov, pesničky sa dajú robiť ešte ľahšie!

                    ### Cvičenie
                    Dokonči pesničku Braček Ján (Frère Jacques). Nezabudni použiť `{repeat}`!
                example_code: |
                    ```
                    {print} 'Braček Ján'
                    #Play first line twice:
                    {repeat} 2 {times}
                        {play} C
                        {play} D
                        {play} E
                        {play} C
                    #Play second line twice:
                    {repeat} 2 {times}
                        {play} E
                        {play} F
                        {play} G
                        {sleep} 1
                    ```
                answer_code: |
                    ```
                    {print} 'Braček Ján'
                    {repeat} 2 {times}
                        {play} C
                        {play} D
                        {play} E
                        {play} C
                    {repeat} 2 {times}
                        {play} E
                        {play} F
                        {play} G
                        {sleep} 1
                    {repeat} 2 {times}
                        {play} G
                        {play} A
                        {play} G
                        {play} F
                        {play} E
                        {play} C
                    {repeat} 2 {times}
                        {play} C
                        {play} G3
                        {play} C
                        {sleep} 1
                    ```
            10:
                story_text: |
                    Od tejto úrovne ide — okrem iného — dať príkaz `{repeat}` do iného príkazu `{repeat}`.
                    Tak sú pesničky ako „Všetko najlepšie“ ešte kratšie!

                    ### Cvičenie
                    Dokonči pesničku!
                example_code: |
                    ```
                    first_time = áno
                    {repeat} 2 {times}
                        {repeat} 2 {times}
                            {play} C
                        {play} D
                        {play} C
                        {if} first_time {is} áno
                            {play} F
                            {play} E
                            first_time {is} nie
                        {else}
                            _
                    ```
                answer_code: |
                    ```
                    first_time = áno
                    {repeat} 2 {times}
                        {repeat} 2 {times}
                            {play} C
                        {play} D
                        {play} C
                        {if} first_time {is} áno
                            {play} F
                            {play} E
                            first_time = nie
                        {else}
                            {play} G
                            {play} F
                    ```
            12:
                story_text: |
                    Použi funkcie v pesničkách! Ako vidíš v ukážke, pre každý riadok Hviezdičky sa dá spraviť funkcia. Keď sú naprogramované prvé tri riadky, stačí funkcie volať v poradí, v akom sa majú hrať.

                    ### Cvičenie
                    Dokonči pesničku Hviezdička.
                    Potom sa pozri na všetky pesničky z predchádzajúcich úrovní: vieš tie kódy cez funkcie spraviť lepšie a kratšie?
                example_code: |
                    ```
                    #Defining the first line of the song:
                    {define} first_line
                        {play} C
                        {play} C
                        {play} G
                        {play} G
                        {play} A
                        {play} A
                        {play} G
                        {sleep}

                    #Defining the second line of the song:
                    {define} second_line
                        {play} F
                        {play} F
                        {play} E
                        {play} E
                        {play} D
                        {play} D
                        {play} C
                        {sleep}

                    #Defining the third line of the song:
                    {define} third_line
                        {play} G
                        {play} G
                        {play} F
                        {play} F
                        {play} E
                        {play} E
                        {play} D
                        {sleep}

                    #Playing the lines of the song:
                    {call} first_line
                    _
                    _
                    ```
                answer_code: |
                    ```
                    first_time = 'áno'
                    {repeat} 2 {times}
                        {repeat} 2 {times}
                            {play} C
                        {play} D
                        {play} C
                        {if} first_time {is} 'áno'
                            {play} F
                            {play} E
                            first_time = 'nie'
                        {else}
                            {play} G
                            {play} F
                    ```
            15:
                story_text: |
                    Hudbu sa dá programovať pre zábavu, ale noty sa dajú použiť aj na niečo užitočné, napríklad na požiarny poplach!

                    ### Cvičenie
                    Zabezpeč, aby požiarny poplach zvonil, keď je požiar!
                example_code: |
                    ```
                    {def} fire_alarm():
                        {print}('POŽIAR!')
                        {for} i {in} {range} _
                            {play} 45
                            {play} 50

                    fire = {input}('Je požiar?')
                    {if} fire _
                        _
                    ```
                answer_code: |
                    ```
                    {def} fire_alarm():
                        {print}('POŽIAR!')
                        {for} i {in} {range}(1,20):
                            {play} 45
                            {play} 50

                    fire = {input}('Je požiar?')
                    {if} fire == 'áno':
                        fire_alarm()
                    ```
            16:
                story_text: |
                    **Pozor** Toto dobrodružstvo môže byť veľmi otravné!
                    Cez príkaz `{while}` sa dá pesnička opakovať donekonečna.

                    ### Cvičenie
                    Dokonči nekonečnú pesničku.
                example_code: |
                    ```
                    {def} song():
                        {play} _

                    yes_or_no = {input}('Chceš počuť moju nekonečnú pesničku?')
                    {while} yes_or_no = 'áno':
                        song()
                        {print}('🥳')
                    ```
                answer_code: |
                    ```
                    {def} song():
                        {play} C3
                        {play} D3
                        {play} E3
                        {play} F3
                        {play} E3
                        {play} D3
                        {play} C3
                        {sleep} 1

                    yes_or_no = {input}('Chceš počuť moju nekonečnú pesničku?')
                    {while} yes_or_no = 'áno':
                        song()
                        {print}('🥳')
                    ```
