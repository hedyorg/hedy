    functions:
        name: funkcie
        default_save_name: funkcie
        description: funkcie
        levels:
            12:
                story_text: |
                    Na tejto úrovni sa používajú **funkcie**. Funkcia je blok kódu, ktorý sa dá ľahko použiť viackrát. Funkcie pomáhajú usporiadať kusy kódu, ktoré sa používajú znova a znova.
                    Funkciu vytvoríš cez `{define}` a dáš jej názov. Všetky riadky, ktoré majú byť vo funkcii, daj do odsadeného bloku pod riadok `{define}`.
                    Nechaj v kóde jeden prázdny riadok, aby vyzeral pekne a uprataný. Skvelá práca! Funkcia je hotová!

                    Keď ten blok kódu treba, stačí zavolať funkciu jej názvom! Blok sa už nemusí písať znova.

                    Pozri si ukážku hry Twister. Funkcia „turn“ obsahuje blok kódu, ktorý vyberie, ktorá končatina ide kam.

                    ### Cvičenie
                    Dokonči kód nastavením 2 premenných `chosen_limb` a `chosen_color`.
                    Potom vyber, koľkokrát sa funkcia zavolá, aby sa koliesko Twistera otočilo.

                    ### Cvičenie 2
                    Kód vylepši premennou „people“. Cez ňu daj každému hráčovi vlastný pokyn v hre.
                    Napríklad: „Ahmed, pravá ruka na zelenú“ alebo „Jessica, ľavá noha na žltú“.
                example_code: |
                    ```
                    #Možnosti Twistera:
                    sides = 'ľavá', 'pravá'
                    limbs = 'ruka', 'noha'
                    colors = 'červená', 'modrá', 'zelená', 'žltá'

                    #Jedno kolo Twistera:
                    {define} next_turn
                        chosen_side = sides {at} {random}
                        chosen_limb = limbs _
                        chosen_color = colors _
                        {print} chosen_side ' ' chosen_limb ' na ' chosen_color

                    #Hra Twister:
                    {print} 'Poďme hrať Twister!'
                    {repeat} _ _
                        call next_turn
                        {sleep} 2
                    ```
                answer_code: |
                    ```
                    sides = 'ľavá', 'pravá'
                    limbs = 'ruka', 'noha'
                    colors = 'červená', 'modrá', 'zelená', 'žltá'
                    players = 'Ahmed', 'Jessica'

                    {define} next_turn
                        {for} player {in} players
                            chosen_side = sides {at} {random}
                            chosen_limb = limbs {at} {random}
                            chosen_color = colors {at} {random}
                            {print} player ', daj ' chosen_side ' ' chosen_limb ' na ' chosen_color
                            {sleep} 2

                    {print} 'Poďme hrať Twister!'
                    {call} next_turn
                    ```
            15:
                story_text: |
                    Na úrovni 12 sme predstavili funkcie. Do funkcie sa napíše kus kódu.
                    Keď sa funkcia zavolá, spustí sa všetok kód v nej. Hodí sa to, keď sa kus kódu má opakovať!

                    Na tejto úrovni vo funkciách pokračujeme a ukážeme, ako vedia byť ešte užitočnejšie.
                    Začíname ich písať po pythonsky. Teraz sa používa `{def}` a za funkciu sa pridá `():`.
                    Funkciu zavoláš tak, že napíšeš jej názov a (), ako na riadku 8.

                    ### Cvičenie
                    Pridaj funkciu, ktorá zahrá smutnú melódiu (napríklad C6-C5-C4), a zavolaj ju, keď je odpoveď zlá.
                example_code: |
                    ```
                    #Veselá a smutná melódia:
                    {def} play_happy_tune():
                        {play} C4
                        {play} C5
                        {play} C6

                    #Otázky:
                    answer = {input}('Koľko je 2 + 2?')
                    {if} answer == 4:
                        {print}('Správne!')
                        play_happy_tune()
                    {else}:
                        {print}('Zle!')
                    ```
                answer_code: |-
                    ```
                    {def} play_happy_tune():
                        {play} C4
                        {play} C5
                        {play} C6

                    {def} play_sad_tune():
                        {play} C6
                        {play} C5
                        {play} C4

                    answer = {input}('Koľko je 2 + 2?')
                    {if} answer == 4:
                        {print}('Správne!')
                        play_happy_tune()
                    {else}
                        {print}('Zle!')
                        play_sad_tune()
                    ```
    functions_2:
        name: funkcie s argumentmi
        default_save_name: funkcie 2
        description: funkcie 2
        levels:
            15:
                story_text: |
                    Keď už ide používať funkcie, teraz príde funkcia s argumentom.
                    **Argument** je premenná, ktorá sa používa vo vnútri funkcie. Mimo funkcie sa nepoužíva.

                    V tomto kóde je napríklad prvá sloha pesničky „My Bonnie is over the ocean“.
                    V ukážke sa používa argument „place“. Place je premenná len vo funkcii, čiže argument.
                    Aby sa „place“ použilo, `place` je za `{define} song`.
                    Keď sa funkcia zavolá, počítač nahradí argument „place“ textom za ` song {with}`.

                    ### Cvičenie
                    Ďalšia sloha tejto pesničky znie:

                    Včera v noci na vankúši

                    Včera v noci na posteli

                    Včera v noci na vankúši

                    Snívalo sa mi, že Bonnie je mŕtva



                    Vieš tento verš naprogramovať rovnako ako v príklade?
                example_code: |
                    ```
                    {def} song(place):
                        {print}('My Bonnie is over the ', place)

                    song('ocean')
                    song('sea')
                    song('ocean')
                    ```
                answer_code: |
                    ```
                    {define} song(place)
                        {print} ('Včera v noci na ' place)

                    song('vankúši')
                    song('posteli')
                    song('vankúši')
                    {print} "Snívalo sa mi, že Bonnie je mŕtva"
                    ```
    functions_3:
        name: funkcie s návratovou hodnotou
        default_save_name: funkcie 3
        description: funkcie 3
        levels:
            15:
                story_text: |
                    Na predchádzajúcich úrovniach už ide vytvárať funkcie a používať pri nich argumenty. Funkcia sa tiež hodí na to, aby niečo vypočítala.
                    Funkcii sa dá dať výpočet a ona vráti výsledok. Tento výsledok sa volá **návratová hodnota**.

                    V tomto kóde funkcia calculate_new_price vypočíta novú cenu akejkoľvek veci. Novú cenu vráti ako návratovú hodnotu.

                    ### Cvičenie
                    Dokonči tento kód. Premenná new_price už je pripravená, treba ju len nastaviť.
                    Riadok dokonči zavolaním funkcie, ktorá počíta novú cenu.
                example_code: |
                    ```
                    {def} calculate_new_price(amount, percentage):
                        percentage = percentage / 100
                        discount_amount = amount * percentage
                        {return} amount - discount_amount

                    old_price = {input}('Koľko je na cenovke?')
                    discount = {input}('Koľko percent je zľava?')

                    new_price = _ calculate_new_price(old_price, _)
                    {print}('Nová cena je ', new_price, ' dolár')
                    ```
                answer_code: |
                    ```
                    {def} calculate_new_price(amount, percentage):
                        percentage = percentage / 100
                        discount_amount = amount * percentage
                        {return} amount - discount_amount

                    old_price = {input}('Koľko je na cenovke?')
                    discount = {input}('Koľko percent je zľava?')

                    new_price = calculate_new_price(old_price, discount)
                    {print}('Nová cena je ', new_price ', dolár')

                    ```
