            10:
                story_text: |
                    Personál na našej pohotovosti má problém. Hovoria, že prichádza veľa pacientov, ktorí v skutočnosti nemajú akútny stav a mali by ísť k svojej všeobecnej lekárke alebo lekárovi.
                    Títo ľudia zapĺňajú čakáreň a pridávajú personálu veľa práce. Vieš personálu pohotovosti pomôcť triážovou aplikáciou, ktorá pacientovi povie, či má ísť na pohotovosť alebo nie?
                    ### Cvičenie
                    Program má pacientovi povedať, či má 'ísť na pohotovosť čo najskôr', 'zavolať poskytovateľovi zdravotnej starostlivosti a situáciu prebrať' alebo 'ísť k svojej všeobecnej lekárke alebo lekárovi pri prvej možnosti'.
                    Program sa opýta tieto otázky:
                    * Je situácia život ohrozujúca?
                    * Máš ťažkosti s dýchaním?
                    * Náhla neschopnosť hovoriť, vidieť, chodiť alebo sa hýbať?
                    * Požilo alebo vdýchlo sa jed?
                    * Je zlomená kosť?
                    * Je vážna alergická reakcia?
                    * Je silná bolesť?

                    Ak pacient na ktorúkoľvek z týchto otázok odpovie 'áno', program povie ísť na pohotovosť čo najskôr. Ďalšie otázky sa už nepýta, lebo čas je dôležitý.
                    Ak pacient na všetky otázky odpovie 'nie', program sa opýta:
                    * Môže to počkať do zajtra?
                    Ak je odpoveď 'áno', program povie ísť k všeobecnej lekárke alebo lekárovi pri prvej možnosti. Ak je odpoveď 'nie', program odporučí zavolať poskytovateľovi zdravotnej starostlivosti a situáciu prebrať.
                answer_code: |
                    ```
                    lifethreatening = {ask} 'Je situácia život ohrozujúca?'
                    {if} lifethreatening {is} 'áno'
                        {print} 'Choď na pohotovosť ČO NAJSKÔR!'
                    {else}
                        breathing = {ask} 'Máš ťažkosti s dýchaním?'
                        {if} breathing {is} 'áno'
                            {print} 'Choď na pohotovosť ČO NAJSKÔR!'
                        {else}
                            ability = {ask} 'Náhla neschopnosť hovoriť, vidieť, chodiť alebo sa hýbať?'
                            {if} ability {is} 'áno'
                                {print} 'Choď na pohotovosť ČO NAJSKÔR!'
                            {else}
                                poison = {ask} 'Požilo alebo vdýchlo sa jed?'
                                {if} poison {is} 'áno'
                                    {print} 'Choď na pohotovosť ČO NAJSKÔR!'
                                {else}
                                    broken_bone = {ask} 'Je zlomená kosť?'
                                    {if} broken_bone {is} 'áno'
                                        {print} 'Choď na pohotovosť ČO NAJSKÔR!'
                                    {else}
                                        allergy = {ask} 'Je vážna alergická reakcia?'
                                        {if} allergy {is} 'áno'
                                            {print} 'Choď na pohotovosť ČO NAJSKÔR!'
                                        {else}
                                            wait = {ask} 'Môže to počkať do zajtra?'
                                            {if} wait {is} 'áno'
                                                {print} 'Choď k všeobecnej lekárke alebo lekárovi pri prvej možnosti.'
                                            {else}
                                                {print} 'Zavolaj poskytovateľovi zdravotnej starostlivosti a situáciu preber'
                    ```
