                    V matematike sa dajú vidieť ďalšie symboly na porovnanie dvoch strán rovnice. Napríklad keď je niečo väčšie alebo rovné. 
                    To isté je aj v programovaní a hovorí sa tomu operátory. 
                    Ak má byť prvé číslo menšie alebo rovné druhému, ide `<=`, napríklad age `<=` 11.
                    Ak má byť prvé číslo väčšie alebo rovné druhému, ide `>=`, napríklad points `>=` 11.
                example_code: |
                    ```
                    height = {input}('Aká je tvoja výška v cm?')
                    {if} height >= 160:
                        {print} ('Áno, výška stačí. Uži si horskú dráhu!')
                    ```
                story_text_3: |
                    Dá sa aj porovnať, či sa niečo niečomu *nerovná*, cez `!=`, takto:
                example_code_3: |
                    ```
                    name = {input}('Ako sa voláš?')
                    {if} name != 'Hedy':
                        {print}('Toto nie je Hedy')

                    ```
                answer_code: |
                    Vlastná odpoveď
