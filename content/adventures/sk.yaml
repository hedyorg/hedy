                    Na tejto úrovni treba dobre premyslieť, ktoré riadky patria do bloku a ktoré nie.
                    Napríklad pri pesničke *predavač mafinov* sa má dvakrát zopakovať len riadok „predavač mafinov“.
                    Posledný riadok preto nemá začínať odsadením, lebo do bloku nepatrí.
                    Ak posledný riadok odsadením začne, pesnička nevyjde správne.

                    ### Cvičenie
                    Každý riadok v ukážke začína prázdnym miestom. Prázdne miesta zmaž a zisti, ktorý riadok treba odsadiť a ktorý nie, aby vyšla pesnička o predavačovi mafinov.
                example_code: |
                    ```
                    _ {print} 'Poznáš predavača mafinov?'
