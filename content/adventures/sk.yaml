                    _ {print} 'Predavač mafinov'
                    _ {print} 'Poznáš predavača mafinov, ktorý býva na Drury Lane?'
                    ```
                answer_code: |
                    ```
                    {print} 'Poznáš predavača mafinov?'
                    {repeat} 2 {times}
                        {print} 'Predavač mafinov'
                    {print} 'Poznáš predavača mafinov, ktorý býva na Drury Lane?'
                    ```
