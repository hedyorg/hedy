            15:
                story_text: |
                    ### Cvičenie 2
                    **Toto je druhá časť tohto dobrodružstva.** Dobrodružstvo začína v predchádzajúcom dobrodružstve.
                    Priemer sa, samozrejme, nepočíta vždy len zo 4 testov. Niekedy treba priemer z 10 testov, alebo len z 2...
                    Toto sa dá opraviť argumentom a premennou „amount_of_tests“.
                    * Na riadku 3 začni nový riadok. Argument amount_of_tests nastav otázkou, koľko testov je hotových.
                    * Štvorku na riadku 4 zmeň na nový argument amount_of_tests.
                    * Nakoniec štvorku na riadku 6 zmeň na amount_of_tests

                    Vyskúšaj nový program. Funguje to?

                    ### Cvičenie 3
                    Chceš program ešte vylepšiť? Super! V predchádzajúcom programe šiel priemer len z 1 predmetu, ale lepšie je počítať priemer zo všetkých predmetov, z ktorých treba!
