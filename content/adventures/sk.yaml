        levels:
            1:
                story_text: |-
                    Na tejto úrovni sa naučíš príkaz `{play}` a zahraješ melódiu!

                    Napíš `{play}` a za ním notu, ktorú chceš zahrať. Stupnica ide C-D-E-F-G-A-B.
                    Ako vidíš, je 7 rôznych písmen, ale hrať sa dá viac než len 7 nôt.
                    Za písmeno napíš číslo od 0 do 9 a zvolíš oktávu, napríklad za B4 ide C5.
                    C0 je najnižšia nota, B9 je najvyššia.

                    ### Cvičenie
                    Vyskúšaj ukážkový kód a potom si s ním pohraj! Vieš vytvoriť vlastnú melódiu?
                    Na ďalšej úrovni sa naučíš hrať aj známe pesničky.
                example_code: |-
                    ```
                    {play} C4
                    {play} D4
                    {play} E4
                    {play} F4
                    {play} G4
                    {play} A4
                    {play} B4
                    {play} C5
                    ```
                answer_code: |
                    Vlastná odpoveď
            2:
                story_text: |
                    ### Cvičenie
                    Dokonči pesničky! Kódy niektorých melódií už sú začaté.
                example_code: |
                    ```
                    {print} Starý MacDonald mal farmu
                    {play} C5
                    {play} C5
                    {play} C5
                    {play} G4
                    {play} A4
                    {play} A4
                    {play} G4
                    ```
                story_text_2: Ako vidíš, cez príkaz `{sleep}` sa do pesničky dá pridať aj malá pauza.
                example_code_2: |
                    ```
                    {print} Hviezdička
                    {play} C
                    {play} C
                    {play} G
                    {play} G
                    {play} A
                    {play} A
                    {play} G
                    {sleep} 1
                    {play} F
                    {play} F
                    ```
                answer_code: |
                    Starý MacDonald
                    ```
                    {print} Starý MacDonald mal farmu
                    {play} C5
                    {play} C5
                    {play} C5
                    {play} G4
                    {play} A4
                    {play} A4
                    {play} G4
                    {sleep} 1
                    {play} E5
                    {play} E5
                    {play} D5
                    {play} D5
                    {play} C5
                    ```
                    #Twinkle Twinkle Little Star
                    ```
                    {print} Hviezdička
                    {play} C
                    {play} C
                    {play} G
                    {play} G
                    {play} A
                    {play} A
                    {play} G
                    {sleep} 1
                    {play} F
                    {play} F
                    {play} E
                    {play} E
                    {play} D
                    {play} D
                    {play} C

                    ```
            3:
                story_text: |
                    Vytvor náhodnú melódiu!

                    ### Cvičenie
                    Ukážkový kód vytvorí náhodnú melódiu, ale je veľmi krátka a používa málo nôt.
                    Pridaj do zoznamu viac nôt a sprav dlhšiu melódiu tak, že posledný riadok skopíruješ ešte niekoľkokrát.
                example_code: |
                    ```
                    notes {is} A4, B4, C4
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    ```
                answer_code: |
                    ```
                    notes {is} A4, B4, C4, D4, E4, F4, G4
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    {play} notes {at} {random}
                    ```
            4:
                story_text: |
                    Cez príkaz `{clear}` vznikne karaoke!

                    ### Cvičenie
                    Dokonči karaoke verziu „Mala Mary malé jahňa“.
                    Potom sprav karaoke verziu akejkoľvek pesničky, akú chceš!
                example_code: |
                    ```
                    {print} 'Mala Mary malé jahňa'
                    {play} E
                    {play} D
                    {play} C
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    {clear}
                    {print} 'Malé jahňa, malé jahňa'
                    {play} D
                    {play} D
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    {clear}
                    {print} 'Mala Mary malé jahňa'
                    {play} E
                    ```
                answer_code: |
                    Mala Mary malé jahňa
                    ```
                    {print} 'Mala Mary malé jahňa'
                    {play} E
                    {play} D
                    {play} C
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    {clear}

                    {print} 'Malé jahňa, malé jahňa'
                    {play} D
                    {play} D
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    {clear}

                    {print} 'Mala Mary malé jahňa'
                    {play} E
                    {play} D
                    {play} C
                    {play} D
                    {play} E
                    {play} E
                    {play} E
                    ```

                    Starý MacDonald
                    ```
                    {print} "Starý MacDonald mal farmu"
                    {play} C
                    {play} C
                    {play} C
                    {play} G
                    {play} A
                    {play} A
                    {play} G
                    {clear}

                    {print} "Í í ó"
                    {play} E
                    {play} E
                    {play} D
                    {play} D
                    {play} C
                    {clear}
                    ```
            5:
                story_text: |
                    Nie vždy treba príkaz `{play}` na celú pesničku, niekedy stačí zahrať jednu notu.
                    Napríklad pri kvíze sa dá zahrať veselá vysoká nota pri správnej odpovedi a smutná nízka nota pri zlej.

                    ### Cvičenie
                    Dokonči prvú otázku: pridaj riadok kódu, ktorý zahraje notu C3 pri zlej odpovedi.
                    Potom vymysli ešte 3 otázky do tohto kvízu.
                example_code: |
                    ```
                    answer {is} {ask} 'Aké je hlavné mesto Zimbabwe?'
                    {if} answer {is} Harare {play} C6
                    _
                    ```
                answer_code: |
                    ```
                    answer {is} {ask} 'Aké je hlavné mesto Zimbabwe?'
                    {if} answer {is} Harare {play} C6
                    {else} {play} C3

                    answer {is} {ask} 'Aké je hlavné mesto Francúzska?'
                    {if} answer {is} Paríž {play} C6
                    {else} {play} C3

                    answer {is} {ask} 'Ktoré zviera je kráľ všetkých zvierat?'
                    {if} answer {is} lev {play} C6
                    {else} {play} C3

                    answer {is} {ask} 'Aká mena sa používa v Japonsku?'
                    {if} answer {is} jen {play} C6
                    {else} {play} C3
                    ```
            6:
                story_text: |
                    Cez `{elif}` sa dajú hrať rôzne noty v rôznych situáciách. Napríklad pri veselom pocite sa dá zahrať veselá nota.
                    ### Cvičenie
                    Najprv sprav smutnú notu, potom aspoň 2 ďalšie melódie pre iné nálady.
                example_code: |
                    ```
                    mood {is} {ask} 'Ako sa dnes cítiš?'
                    {if} mood {is} veselo
                    {play} C4
                    {elif} mood {is} smutno
                    {play} _
                    {elif} mood {is} _
                    {play} _
                    ```
                answer_code: |
                    ```
                    mood {is} {ask} 'Ako sa dnes cítiš?'
                    {if} mood {is} veselo
                    {play} C4
                    {elif} mood {is} smutno
                    {play} C2
                    {elif} mood {is} vystrašene
                    {play} C8
                    {elif} mood {is} nuda
                    {play} C3
                    ```
            7:
                story_text: |
                    Namiesto nôt sa teraz dajú hrať aj čísla. Jednoducho napíš `{play} 1` pre najnižšiu notu, `{play} 70` pre najvyššiu, alebo čokoľvek medzi tým.

                    ### Cvičenie
                    Toto volá po hudobnej matematike! Vyskúšaj ukážkový kód niekoľkokrát s rôznymi počiatočnými číslami.
                    Potom skús zložiť pesničku pomocou čísel.
                example_code: |
                    ```
                    number = {ask} 'Povedz počiatočné číslo medzi 1 a 67'
                    # Printing and playing 3 notes:
                    {print} number
                    {play} number
                    number = number + 1
                    {print} number
                    {play} number
                    number = number + 1
                    {print} number
                    {play} number
                    ```
                answer_code: |
                    Vlastná odpoveď
            8:
                story_text: |
                    Cez príkaz `{repeat}` môžu byť kódy melódií oveľa kratšie!

                    ### Cvičenie
                    Dokonči kód pre Hviezdičku cez príkaz `{repeat}`.
                    Potom sa vráť k pesničkám z predchádzajúcich úrovní. Vieš tie kódy tiež skrátiť?
                example_code: |
                    ```
                    {print} 'Hviezdička'
                    {repeat} 2 {times} {play} C4
                    {repeat} 2 {times} {play} G4
                    _
                    ```
                answer_code: |
                    Hviezdička
                    ```
                    {print} 'Hviezdička'
                    {repeat} 2 {times} {play} C4
                    {repeat} 2 {times} {play} G4
                    {repeat} 2 {times} {play} A4
                    {play} G4
                    ```

                    Mala Mary malé jahňa
                    ```
                    {play} E
                    {play} D
                    {play} C
                    {play} D
                    {repeat} 3 {times} {play} E
                    {repeat} 3 {times} {play} D
                    {repeat} 3 {times} {play} E
                    {play} E
                    {play} D
                    {play} C
                    {play} D
                    {repeat} 3 {times} {play} E
                    ```

                    #Old MacDonald
