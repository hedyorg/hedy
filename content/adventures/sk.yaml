adventures:
    story:
        name: príbeh
        default_save_name: Príbeh
        description: Napíš krátky príbeh
        levels:
            1:
                story_text: |
                    Na úrovni 1 sa dá spraviť príbeh s inou hlavnou postavou, ktorú si zadáš.

                    V prvom riadku použi `{ask}` a spýtaj sa, kto bude hlavná postava príbehu. Potom použi {answer}, keď chceš použiť meno postavy.
                example_code: |
                    ```
                    {ask} Hlavná postava tohto príbehu je
                    {print} {answer} teraz ide kráčať do lesa
                    {print} {answer} ide ďalej a trochu sa bojí
                    {print} {answer} počuje všade bláznivé zvuky
                    {print} Bojí sa, že toto je strašidelný les
                    ```
                story_text_2: |
                    ### Cvičenie
                    Teraz vytvor vlastný príbeh aspoň so 6 riadkami kódu.
                    Tento príbeh nesmie byť rovnaký ako ukážkový kód.
                    Použi aspoň jedno `{ask}` a jedno `{answer}`.
                    Môže byť o čomkoľvek.
                    Ak ťa nič nenapadá, vyber si z našich tém: návšteva kina, športový zápas alebo deň v zoo.
                answer_code: |
                    ```
                    {print} Jedného dňa to bolo v zoo
                    {ask} Aké zviera bolo prvé?
                    {print} Najprv to bolo {answer}
                    {print} Potom prišiel tučniak
                    {print} Mal obed
                    {ask} Čo tučniak jedol?
                    {print} Tučniak mal na obed {answer}
                    ```
            2:
                story_text: |
                    Na úrovni 2 sa dá príbeh spraviť zábavnejší. Meno hlavnej postavy môže byť kdekoľvek vo vete.

                    Na to treba naprogramovať ešte trochu navyše. Najprv treba hlavnú postavu pomenovať.

                    Potom sa to meno dá dať kamkoľvek do vety.
                example_code: |-
                    ```
                    meno {is} {ask} Ako sa volá hlavná postava?
                    {print} meno teraz pobeží v lese
                    {print} meno je trochu vystrašené
                    {print} Zrazu začuje bláznivý zvuk...
                    {sleep}
                    {print} meno sa bojí, že je to strašidelný les
                    ```
                story_text_2: |
                    ### Cvičenie
                    Teraz je čas pridať premenné do vášho príbehu, ktorý ste vytvorili v predchádzajúcej úrovni.
                    Prejdite do svojho príbehového dobrodružstva úrovne 1 a skopírujte kód. Vložte kód do vstupnej obrazovky v tejto úrovni.

                    Tento kód nebude v tejto úrovni fungovať, pretože ste ešte nepoužili premenné.
                    Opravte kód pomocou premenných a `{is}` pomocou príkazu `{ask}`, ako ste sa naučili v tejto úrovni.

                    **Extra** Pridajte do kódu príkaz `{sleep}`, aby ste vo svojom príbehu zvýšili napätie.
                answer_code: |
                    ```
                    {print} Jedného dňa som išiel do zoo
                    first_animal {is} {ask} Aké zviera som videl ako prvé?
                    {print} Najprv som videl first_animal
                    {print} Potom som videl tučniaka
                    {print} Obedoval
                    jedlo {is} {ask} Čo jedol tučniak?
                    {print} Tučniak jedol...
                    {sleep} 3
                    {print} jedlo
                    ```
            3:
                story_text: |
                    V 3. úrovni si môžete príbeh urobiť zábavnejším. Náhodnosť môžete použiť pre akékoľvek monštrum, zviera alebo inú prekážku, napríklad takto:
                example_code: |
                    ```
                    zvieratá {is} 🦔, 🐿, 🦉, 🦇
                    {print} Teraz počujú zvuk zvierat {at} {random}
                    ```
                story_text_2: |
                    Príkaz `{add}` sa vám môže vo vašom príbehu tiež hodiť.
                example_code_2: |
                    ```
                    {print} Počujú zvuk
                    animals {is} 🐿, 🦔, 🦇, 🦉
                    animal {is} {ask} Čo si myslíš, že to je?
                    {add} animal {to_list} animals
                    {print} bolo to animals {at} {random}
                    ```
                story_text_3: |
                    Toto je ukážka príkazu `{remove}` v príbehu

                    ### Cvičenie
                    Skopíruj svoj príbeh z predchádzajúcich úrovní na túto úroveň.
                    Na tejto úrovni sú 3 nové príkazy `{at} {random}` , `{add} {to_list}` a `{remove} {from}`.
                    Pridaj do príbehu nové riadky kódu tak, aby každý nový príkaz bol v príbehu aspoň raz.
                example_code_3: |
                    ```
                    {print} Jeho batoh bol príliš ťažký.
                    {print} Vnútri bola fľaša vody, baterka a tehla.
                    bag {is} water, flashlight, brick
                    dump {is} {ask} Ktorú vec má vyhodiť?
                    {remove} dump {from} bag
                    ```
                answer_code: |
                    ```
                    animals {is} lev, zebra, plameniak
                    {print} Ahoj deti! Dnes ideme do zoo!
                    favorite_animal {is} {ask} Ku ktorému zvieraťu chceš ísť dnes?
                    {add} favorite_animal {to} animals
                    {sleep} 2
                    {print} Poďme k animals {at} {random}
                    {sleep}
                    least_favorite_animal {is} {ask} Ktoré zviera nechceš vidieť?
                    {remove} least_favorite_animal {from} animals
                    {print} Teraz poďme k animals {at} {random}!
                    ```
            4:
                story_text: |
                    ### Cvičenie
                    Skopíruj ukážkový kód a dokonči ho pridaním úvodzoviek na prázdne miesta v riadkoch 1 a 2.
                    Prázdne miesta v riadkoch 3 a 4 nemajú nahradiť úvodzovky, ale príkaz `{sleep}` a `{clear}`. Vieš to rozbehnúť?

                    ### Cvičenie 2
                    Choď späť na predchádzajúcu úroveň a skopíruj kód príbehu. Na tejto úrovni ho rozbehni tak, že na správne miesta pridáš úvodzovky.
                    Pozor: Premenné vo vlastnom príbehu majú byť mimo úvodzoviek. Rovnako ako v druhom riadku ukážkového kódu. V tom riadku je premenná name mimo úvodzoviek.
                example_code: |
                    ```
                    name {is} {ask} _ Ako sa voláš? _
                    {print} _ Hlavná postava sa volá _ name
                    _
                    _
                    {print} name _ teraz ide kráčať do lesa _
                    {print} name _ sa trochu bojí _
                    animals {is} 🦔, 🐿, 🦉, 🦇
                    {print} _ Počuje zvuk _ animals {at} {random}
                    {print} name _ sa bojí, že toto je strašidelný les _
                    ```
                answer_code: |
                    ```
                    name {is} {ask} 'Ako sa voláš?'
                    {print}  'Hlavná postava sa volá' name
                    {print} name  ' teraz ide kráčať do lesa'
                    {print} name ' sa trochu bojí'
                    animals {is} 🦔, 🐿, 🦉, 🦇
                    {print} 'Počuje zvuk ' animals {at} {random}
                    {print} name ' sa bojí, že toto je strašidelný les'
                    ```
            5:
                story_text: |
                    Na tejto úrovni sa dajú naprogramovať rôzne konce, a príbeh bude ešte zábavnejší.
                    V ukážkovom kóde je vidieť, ako spraviť 2 rôzne konce.

                    ### Cvičenie 1
                    Napíš nový krátky príbeh aspoň so 6 riadkami kódu na tému podľa seba.
                    Chýba inšpirácia? Vyber si jednu z týchto tém: superhrdina, nudný školský deň, uviaznutie na pustom ostrove.

                    Teraz daj hráčovi možnosť vybrať si šťastný alebo zlý koniec, ako v ukážkovom kóde.
                    Naprogramuj oba konce.

                    ### Cvičenie 2
                    Skopíruj príbeh, ktorý vznikol vo vlastnom dobrodružstve príbeh na predchádzajúcich úrovniach.
                    Nájdi spôsob, ako do príbehu pridať aspoň 2 príkazy `{if}` a `{else}`.
                    Môže to byť so šťastným alebo zlým koncom, ale dajú sa hľadať aj iné spôsoby, ako príkazy zapojiť.
                example_code: |
                    ```
                    name {is} {ask} 'Kto kráča v lese?'
                    {print} name ' kráča lesom'
                    {print} name ' stretne monštrum'
                    end {is} {ask} 'Chceš dobrý alebo zlý koniec?'
                    {if} end {is} dobrý {print} name ' vezme meč a monštrum rýchlo utečie'
                    {else} {print} 'Monštrum zožerie ' name
                    ```
                answer_code: |
                    ```
                    name {is} {ask} 'Kto je hrdina?'
                    {print} 'Ó nie, lietadlo padá, kto nás zachráni?'
                    {print} "Pozri, kto letí vzduchom, je to " name
                    end {is} {ask} 'Chceš lietadlo zachrániť alebo zničiť?'
                    {if} end {is} zachrániť {print} name " zachránilo lietadlo a zachránilo nás!"
                    {else} {print} "Ó nie! " name " ničí lietadlo, pomoc!"
                    ```
            6:
                story_text: |-
                    Keď ide použiť `{elif}`, dá sa spraviť ešte interaktívnejší príbeh! Dajú sa napríklad vytvoriť viaceré postavy, z ktorých každá má iné vlastnosti.
                    Alebo môže hráč vybrať, ktorou cestou ísť, ktoré dvere otvoriť, alebo ktorý magický elixír vypiť...

                    ### Cvičenie
                    Vytvor vlastný príbeh s 3 alebo viacerými možnosťami cez `{elif}`.
                example_code: |
                    ```
                    character {is} {ask} 'Kto ti pomôže na výprave?'
                    {if} character {is} 'Daisy'
                    {print} 'Vyberáš Daisy! Je najmúdrejšia zo všetkých!'
                    {elif} character {is} 'Jason'
                    {print} 'Vyberáš Jasona! Je najsilnejší zo všetkých!'
                    {elif} character {is} 'Sam'
                    {print} 'Vyberáš Sam! Zo všetkých je najrýchlejší!'
                    ```
                answer_code: |
                    Vlastná odpoveď
            8:
                story_text: |
                    V príbehu niekto hovorí slová niekoľkokrát. Napríklad keď volá o pomoc alebo spieva pieseň.
                    Také opakovania sa dajú dať do príbehu, na tejto úrovni cez `{repeat}`.

                    ### Cvičenie
                    Pridaj opakovanie do vlastného príbehu. Choď späť k uloženým programom, vyber program príbehu z predchádzajúcej úrovne a
                    nájdi riadok s `{print}` a zopakuj ho!
                example_code: |
                    ```
                    {print} 'Princ stále volal o pomoc'
                    {repeat} 5 {times} {print} 'Pomoc!'
                    {print} 'Prečo mi nikto nepomôže?'
                    ```
                answer_code: |
                    {print} 'Všetky deti chceli ísť do zoo a stále to kričali!'
                    {repeat} 3 {times} {print} "Poďme do zoo!"
            9:
                story_text: |
                    Na tejto úrovni sa dajú v príkazoch `{if}` použiť viaceré riadky, tak sa dá vylepšiť šťastný alebo smutný koniec!

                    ### Cvičenie 1
                    Ukážkový kód ukazuje dva rôzne konce; jeden, kde postavy skočia do stroja času, a jeden, kde nie.
                    Doplň prázdne miesta aspoň jednou vetou na každý koniec.
                    **Navyše** Sprav príbeh dlhší. Čo sa v príbehu deje? Dá sa pridať aj druhé `{ask}` s inými možnosťami.

                    ### Cvičenie 2
                    Choď späť k uloženým programom, vyber program príbehu z úrovne 5. Teraz napíš dobrý a zlý koniec, každý aspoň tri riadky dlhý!
                example_code: |
                    ```
                    {print} 'Ó NIE! T-rex sa blíži!'
                    end = {ask} 'Chceš šťastný alebo smutný koniec?'
                    #Telling the happy ending of the story:
                    {if} end {is} šťastný
                        {print} 'Presne načas Richard skáče späť do stroja času!'
                        {print} _
                    #Telling the sad ending of the story:
                    {else}
                        {print} 'Ó nie! Richard je príliš pomalý...'
                        {print} _
                    ```
                answer_code: |
                    ```
                    {print} 'Ó NIE! T-rex sa blíži!'
                    end = {ask} 'Chceš šťastný alebo smutný koniec?'
                    {if} end {is} šťastný
                        {print} 'Presne načas Richard skáče späť do stroja času!'
                        {print} 'Uf, dobre, že sme to stihli'
                        {print} 'Presne načas'
                    {else}
                        {print} 'Ó nie! Richard je príliš pomalý...'
                        {print} 'T-rex spustí obrovské ZAČÍ'
                        {print} 'Otvorí tlamu a zožerie Richarda na jeden hlt'
                    ```
            10:
                story_text: |
                    Na tejto úrovni sa dajú príkazy `{if}` a `{repeat}` dať do iných príkazov `{if}` a `{repeat}`.
                    To dáva veľa možností a naozaj pomáha spraviť príbeh interaktívny.

                    ### Cvičenie 1
                    Dokonči kód tak, aby `{if}` fungovalo správne.

                    ### Cvičenie 2
                    Pridaj `{if}` a `{else}` aj pre časť príbehu, kde Robin ide domov.

                    ### Cvičenie 3
                    Choď späť k príbehu z úrovne 8 a použi aspoň dve `{if}` vo vnútri iného `{if}`.
                example_code: |
                    ```
                    {print} 'Robin kráča centrom mesta'
                    location = {ask} 'Ide Robin do obchodu, alebo ide domov?'
                    {if} location {is} obchod
                        {print} 'Vchádza do obchodu.'
                        {print} 'Robin vidí zaujímavú knihu'
                        book = {ask} 'Kúpi Robin knihu?'
                        {if} book {is} áno
                        _ {print} 'Robin kupuje knihu a ide domov'
                        _ {else}
                        _ {print} 'Robin odchádza z obchodu a ide domov'
                    {else}
                        {print} 'Robin ide domov'
                    ```
                story_text_2: |
                    Cez príkazy `{and}` a `{or}` sa dajú príbehy spraviť všestrannejšie. Dá sa položiť viacero otázok a reagovať na kombináciu odpovedí.

                    ### Cvičenie 1
                    Pozri si ukážkový kód a dokonči ho. Potom pridaj aspoň 2 ďalšie kódy `{if}` s `{and}` alebo `{or}`.

                    ### Cvičenie 2
                    Nájdi príbeh z predchádzajúcej úrovne a pridaj jedno `{and}` alebo `{or}`.
                example_code_2: |
                    ```
                    {print} 'Naša hrdinka kráča lesom'
                    {print} 'Cesta sa delí na dve strany'
                    path = {ask} 'Ktorú cestu má vybrať?'
                    weapon = {ask} 'Akú zbraň vytiahne?'
                    {if} path {is} ľavá {and} weapon {is} meč
                        _
                    ```
                answer_code: |
                    ```
                    {print} 'Robin kráča centrom mesta'
                    location = {ask} 'Ide Robin do obchodu, alebo ide domov?'
                    {if} location {is} obchod
                        {print} 'Vchádza do obchodu.'
                        {print} 'Robin vidí zaujímavú knihu'
                        book = {ask} 'Kúpi Robin knihu?'
                        {if} book {is} áno
                            {print} 'Robin kupuje knihu a ide domov'
                        {else}
                            {print} 'Robin odchádza z obchodu a ide domov'
                    {else}
                        {print} 'Robin ide domov'
                        icecream = {ask} 'Zastaví sa cestou domov po zmrzlinu?'
                        {if} icecream {is} áno
                            {print} 'Robin sa najprv zastaví po zmrzlinu'
                            {print} 'Vyberie si citrónový sorbet'
                            {print} 'Je výborný'
                        {else}
                            {print} 'Ide rovno domov'
                    ```
                answer_code_2: |
                    ```
                    {print} 'Naša hrdinka kráča lesom'
                    {print} 'Cesta sa delí na dve strany'
                    path = {ask} 'Ktorú cestu má vybrať?'
                    weapon = {ask} 'Akú zbraň vytiahne?'

                    {if} path {is} ľavá {and} weapon {is} meč
                        {print} 'žiadne monštrum sa neodváži priblížiť k hrdinke.'

                    {if} path {is} ľavá {and} weapon {is} prak
                        {print} 'hrdinku napadne sova-medveď.'

                    {if} path {is} pravá {or} weapon {is} kniha kúziel
                        {print} 'k hrdinke sa priblíži tajomný čarodejník.'
                    ```
            11:
                story_text: |
                    Na tejto úrovni sa dá v príbehu použiť príkaz `{for}`. Tak sa dá ľahko naprogramovať detská knižka 'Brown bear, Brown bear, what do you see'.

                    ### Cvičenie

                    Pozri si <a href="https://fliphtml5.com/jmlya/nquy"> príbeh</a>, ak ho nepoznáš, a uisti sa, že sa vypíše ako v knihe.
                example_code: |
                    ```
                    animals = _ , _ , _ 
                    {print} 'Brown bear, Brown bear'
                    {print} 'What do you see?'
                    ```
                answer_code: |
                    ```
                    animals = Red Bird, Yellow Duck, Blue Horse, Green Frog, Purple Cat, White Dog, Black Sheep, Gold Fish, Teacher
                    {print} 'Brown bear, Brown bear'
                    {print} 'What do you see?'
                    {for} animal {in} animals
                        {print} 'I see a ' animal ' looking at me'
                        {print} animal ', ' animal
                        {print} 'What do you see?'
                    {print} 'I see children looking at me'
                    {print} 'Children, Children'
                    {print} 'What do you see?'
                    {print} 'We see a '
                    {for} animal {in} animals
                        {print} animal
                    {print} 'looking at us'
                    {print} 'Thats what we see!'
                    ```
            13:
                story_text: |
                    Budeme vypisovať príbeh a pri `{print}` treba zátvorky.

                    ### Cvičenie
                    Vytvor príbeh aspoň z 5 viet. Najprv v príbehu použi premennú `name`. Potom vytvor dve ďalšie premenné a použi ich tiež.
                    Tip: Pri `{print}` nezabudni na čiarky medzi textom a premennými!
                example_code: |
                    ```
                    name = _
                    {print}('Vitaj v tomto príbehu!')
                    ```
                answer_code: |
                    ```
                    name = 'Hedy'
                    {print}('Vitaj v tomto príbehu!')
                    {print}('Kde bolo, tam bolo, žil raz papagáj menom ', name '.')
                    {print}(name, ' milovala programovanie!')
                    {print}("Žiaľ, ostatné papagáje nevedeli programovať.")
                    {print}('Jedného dňa sa ', name, ' rozhodla naučiť ostatné papagáje programovať.')
                    {print}('Hodiny vyšli s ostatnými papagájmi na výbornú!')
                    ```
            16:
                story_text: |
                    Cyklus `{while}` môže príbehy spraviť zaujímavejšie. Napríklad sa dá použiť `{while} game == 'on'`, aby sa hralo, kým hra neskončí.
                    Alebo `{while} sword == 'lost'`, aby hráč nemohol pokračovať, kým niečo nenájde.

                    ### Cvičenie
                    Ukážkový kód ukazuje, ako použiť cyklus `{while}` v príbehu. Teraz **vymysli vlastný scenár**, v ktorom hráč musí niečo nájsť, kým môže pokračovať.
                example_code: |
                    ```
                    keys = 'lost'
                    {print}('Stojíš v záhrade a stratili sa ti kľúče.')
                    {print}('Kde ich chceš hľadať?')
                    {print}('Môžeš vybrať: strom, záhon, kameň, schránka')
                    {while} keys == 'lost':
                        location = {input}('Kde chceš hľadať?')
                        {if} location == 'záhon':
                            {print}('Tu sú!')
                            keys = 'found'
                        {else}:
                            {print}('Nie, pri ', location, ' nie sú')
                    {print}('Teraz môžeš vojsť do domu!')
                    ```
                answer_code: |
                    ```
                    rackets = 'lost'
                    {print}('Si s kamarátmi a chceš hrať tenis, ale nevieš, kde sú rakety.')
                    {print}('Kde ich chceš hľadať?')
                    {print}('Môžeš vybrať: spálňa, kôlňa, skriňa, stôl')
                    {while} rackets == 'lost':
                        location = {input}('Kde chceš hľadať?')
                        {if} location == 'stôl':
                            {print}('Tu sú! Je tu 6 rakiet!')
                            keys = 'found'
                        {else}:
                            {print}('Nie, pri ', location, ' nie sú')
                    {print}('Teraz môžeš hrať tenis so všetkými kamarátmi.')
                    ```
    add_remove_command:
        name: '{add} {to_list} & {remove} {from}'
        default_save_name: pridaj a odober
        description: predstavujeme {add} {to_list} a {remove} {from}
        levels:
            3:
                story_text: |
                    ## {add} {to_list}
                    Veci do zoznamu pridáš príkazom `{add} {to_list}`. Dá sa napísať jednoducho `{add} penguin {to_list} animals`, alebo použiť príkaz `{ask}` ako v ukážke.
                example_code: |
                    ```
                    animals {is} pes, mačka, kengura
                    like {is} {ask} Ktoré zviera máš najradšej?
                    {add} like {to_list} animals
                    {print} Vyberám animals {at} {random}
                    ```
                story_text_2: |
                    ## {remove} {from}
                    Keď sa dajú veci do zoznamu pridávať, dajú sa aj odoberať. Slúži na to príkaz `{remove} {from}`.
                example_code_2: |
                    ```
                    animals {is} pes, mačka, kengura
                    dislike {is} {ask} Ktoré zviera sa ti nepáči?
                    {remove} dislike {from} animals
                    {print} Vyberám animals {at} {random}
                    ```
                story_text_3: |
                    ### Cvičenie
                    Vyskúšaj nové príkazy v tejto virtuálnej reštaurácii. Do zoznamu pridaj príchuť, ktorú hráč chce, a odober príchute, na ktoré má alergiu.
                example_code_3: |
                    ```
                    {print} Tajomný milkshake
                    flavors {is} jahoda, čokoláda, vanilka
                    hope {is} {ask} Akú príchuť chceš?
                    _
                    allergies {is} {ask} Máš na niektorú príchuť alergiu?
                    _
                    {print} Dostaneš flavors {at} {random} milkshake
                    ```
                answer_code: |
                    ```
                    {print} Tajomný milkshake
                    flavors {is} jahoda, čokoláda, vanilka
                    hope {is} {ask} Akú príchuť chceš?
                    {add} hope {to} flavors
                    allergies {is} {ask} Máš na niektorú príchuť alergiu?
                    {remove} allergies {from} flavors
