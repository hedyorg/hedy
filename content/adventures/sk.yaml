                    ### Cvičenie
                    V ukážke je vidieť, ako spraviť veštecký program, ktorý nakloní šance v tvoj prospech. Tento podvádzací program vždy povie, že vyhráš v lotérii, ale kamaráti nikdy nevyhrajú.

                    Použi to na vlastný program a zapoj fantáziu! Napríklad môže vzniknúť kód, ktorý predpovie, že:
                    * tvoj obľúbený športový tím porazí všetkých súperov!
                    * na filmový večer padne tvoj obľúbený film!
                    * padnú lístky na tvoje obľúbené predstavenie!
                    * vyzeráš najkrajšie zo všetkých, ako magické zrkadlo zo Snehulienky.
                    Nech fantázia pracuje!

                    Program musí mať aspoň 10 riadkov kódu a aspoň jeden príkaz `{if}` a `{else}`.
                example_code: |
                    ```
                    friends {is} Jordan, Lucy, Dave
                    {print} 'Viem predpovedať, či zajtra vyhráš v lotérii!'
                    person {is} {ask} 'Kto si?'
                    good_answer {is} Hurá! Výhra!, Určite vyhráš!, Máme víťaza!
                    bad_answer {is} Smola! Skús znova!, Vyhrá niekto iný, Prehra!
                    {if} person {in} friends
