            7:
                story_text: |
                    Naše sestry sledujú bilanciu tekutín pacientov. Bilancia tekutín je, koľko tekutín pacient dnes prijal (pitím, jedlom alebo infúziou) mínus koľko tekutín dnes stratil (močením alebo zvracaním).
                    Bilancia tekutín má ostať kladná. Ak je záporná, sestra musí podať viac infúzie.
                    Vieš sestrám pomôcť nástrojom na výpočet bilancie tekutín pacienta?
                    ### Cvičenie
                    Program má:
                    * Opýtať sa, koľko tekutín pacient prijal pitím v ten deň.
                    * Opýtať sa, koľko tekutín pacient prijal jedlom v ten deň.
                    * Opýtať sa, koľko tekutín pacient prijal infúziou v ten deň.
                    * Opýtať sa, koľko tekutín pacient stratil močením v ten deň.
                    * Opýtať sa, koľko tekutín pacient stratil zvracaním v ten deň.
                    * Vypočítať bilanciu tekutín pacienta a zobraziť ju sestre.
                    * Povedať sestre, nech skontroluje, či je bilancia kladná alebo záporná, a podľa toho rozhodne, či pacient potrebuje dnes viac infúzie.
                answer_code: |
                    ```
                    intake_drinking = {ask} 'koľko tekutín pacient prijal pitím?'
                    intake_eating = {ask} 'koľko tekutín pacient prijal jedlom?'
                    intake_IV = {ask} 'koľko tekutín pacient prijal infúziou?'
                    discharge_urine = {ask} 'koľko tekutín pacient stratil močením?'
                    discharge_vomit = {ask} 'koľko tekutín pacient stratil zvracaním?'
                    fluid_balance = intake_drinking + intake_eating + intake_IV - discharge_urine - discharge_vomit
                    {print} "Bilancia tekutín pacienta je " fluid_balance
                    {print} 'Prosím, skontroluj, či je bilancia kladná alebo záporná, a rozhodni, či pacient potrebuje dnes viac infúzie'
                    ```
            8:
                story_text: |
                    Naši pacienti niekedy zabudnú vziať lieky, čo môže spôsobiť vážne zdravotné problémy. Aby pacienti brali všetky predpísané tabletky, dostanú budík, ktorý pípne vždy, keď majú lieky vziať.
                    Vieš pomôcť vytvorením budíka na tabletky?

                    ### Cvičenie
                    Program má:

                    #Časť 1, Nastavenia pre sestru
                    * Najprv dať sestre možnosť nastaviť meno pacienta.
                    * Potom vyplniť, koľko tabletiek má pacient vziať v prvej (8:00), druhej (poludnie) a poslednej dávke dňa (16:00).
                    * Poďakovať sestre a povedať, nech dá budík pacientovi. Obrazovku vymazať dve sekundy po tejto správe.

                    #Časť 2, Prvá dávka
                    * Privítať pacienta menom a povedať, že budík pípne, keď treba vziať lieky.
                    * Pípnuť 3-krát
                    * Povedať pacientovi, že je 8:00 a čas na prvú dávku.
                    * Opýtať sa 'Máš už tabletku?' toľkokrát, koľko tabletiek má v prvej dávke.
                    * Povedať pacientovi, že prvá dávka je hotová, a po 2 sekundách vymazať obrazovku.

                    #Časť 3, Druhá dávka
                    * Počkať 4 sekundy (v skutočnosti by to boli 4 hodiny)
                    * Zaznieť budík rovnako ako pri prvej dávke.

                    #Časť 4, Posledná dávka
                    * Počkať 4 sekundy (v skutočnosti 4 hodiny)
                    * Zaznieť budík na poslednú dávku dňa.
                answer_code: |-
                    ```
                    #Settings for the nurse
                    {print} 'Dobré ráno, sestra. Vyplň prosím správne údaje o pacientovi. '
                    name {is} {ask} 'Ako sa volá táto pacientka alebo pacient?'
                    first_dose {is} {ask} 'Koľko tabletiek berie ' name ' o 8:00?'
                    second_dose {is} {ask} 'Koľko tabletiek berie ' name ' na poludnie?'
                    last_dose {is} {ask} 'Koľko tabletiek berie ' name ' o 16:00'
                    {print} 'Ďakujeme, teraz môžeš dať sledovač pacientovi.'
                    {sleep} 2
                    {clear}

                    #First dose
                    {print} 'Ahoj' name ' Som tvoj sledovač liekov. Pípnem, keď máš vziať lieky.'
                    {repeat} 3 {times} {play} C4
                    {print} "Je 8:00, čas na prvú dávku"
                    {repeat} first_dose {times} pill {is} {ask} 'Máš už tabletku?'
                    {print} 'Prvá dávka je hotová, ' name
                    {sleep} 2
                    {clear}

                    #Second dose
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "Je poludnie, čas na druhú dávku"
                    {repeat} second_dose {times} pill {is} {ask} 'Máš už tabletku?'
                    {print} 'Druhá dávka je hotová, ' name
                    {sleep} 2
                    {clear}

                    #Last dose
                    {sleep} 4
                    {repeat} 3 {times} {play} C4
                    {print} "Je 16:00, čas na poslednú dávku"
                    {repeat} last_dose {times} pill {is} {ask} 'Máš už tabletku?'
                    {print} 'Všetky tabletky na dnes sú vzaté, ' name
                    {sleep} 2
                    {clear}
                    ```
