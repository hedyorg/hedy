    repeat_command:
        name: '{repeat}'
        default_save_name: príkaz opakuj
        description: príkaz {repeat}
        levels:
            8:
                story_text: |
                    Na tejto úrovni pribúda príkaz `{repeat}`. `{repeat}` spustí jeden riadok kódu viackrát. Takto:

                    ### Cvičenie
                    Pohraj sa s príkazom `{repeat}`. Vieš pesničku k narodeninám spraviť len na 3 riadkoch kódu namiesto 4?
                example_code: |
                    ```
                    {repeat} 3 {times} {print} 'Hedy je zábava!'
                    ```
                answer_code: |
                    ```
                    {repeat} 2 {times} {print} 'všetko najlepšie'
                    {print} 'všetko najlepšie, milá Hedy'
                    {print} 'všetko najlepšie'
                    ```
            9:
                story_text: |
                    Na tejto úrovni sa dá jedným príkazom `{repeat}` zopakovať viac riadkov kódu.
                    Robí sa to blokom riadkov, ktoré sa majú zopakovať.
                    Riadky v tomto bloku potrebujú **odsadenie**.
                    To znamená štyri medzery na začiatku každého riadka. Odsadiť treba aj vtedy, keď má blok len jeden riadok.
                example_code: |
                    ```
                    {repeat} 5 {times}
                        {print} 'Ahoj všetci'
                        {print} 'Toto sa celé zopakuje 5-krát'
                    ```
                answer_code: |
                    ```
                    {print} 'Poznáš predavača mafinov?'
                    {repeat} 2 times
                        {print} 'Predavač mafinov'
                    {print} 'Poznáš predavača mafinov, ktorý býva na Drury Lane?'
                    ```
            10:
                story_text: |
                    Skvelá práca! Ďalšia nová úroveň! Na predchádzajúcej úrovni už ide použiť viac riadkov kódu v príkaze `{if}` alebo `{repeat}`.
                    Spojiť sa to však ešte nedalo...

                    Dobrá správa! Na tejto úrovni sa dá dať `{if}` do `{if}`, `{repeat}` do príkazu `{repeat}` a aj do seba navzájom.
                    Skús to!
                example_code: |
                    ```
                    {repeat} 3 {times}
                        order = {ask} 'Čo chceš objednať?'
                        {if} order {is} pizza
                            {print} 'Mňam'
                        {else}
                            {print} 'pizza je lepšia!'
                    ```
                answer_code: |
                    Vlastná odpoveď
    repeat_command_2:
        name: '{repeat} 2'
        default_save_name: príkaz opakuj 2
        description: príkaz {repeat} 2
        levels:
            8:
                story_text: |
                    ## Opakovanie s inými príkazmi a s premennými
                    Príkaz `{repeat}` spolu s `{print}` už je precvičený, ale vieš, že s `{repeat}` idú aj iné príkazy?
                    V tejto ukážke je vidno, že `{repeat}` ide aj s príkazom `{ask}`, `{if}` alebo `{else}`.
                example_code: |
                    ```
                    {repeat} 2 {times} answer = {ask} 'Vieš, že otázka sa dá položiť viackrát?'
                    {if} answer {is} áno
                    {repeat} 2 {times} {print} 'To už je známe!'
                    {else}
                    {repeat} 3 {times} {print} 'Niečo nové!'
                    ```
                story_text_2: |
                    S príkazom `{repeat}` sa dá ešte niečo zaujímavé: premennou určiť, koľkokrát sa niečo zopakuje. V ukážke sa najprv opýtame, koľko je rokov.
                    Potom sa na riadku 3 otázka zopakuje toľkokrát, koľko je „age“. Premenná „age“ je teda použitá s príkazom `{repeat}`.
                example_code_2: |
                    ```
                    {print} 'Jupí! Sú narodeniny!'
                    age = {ask} 'Koľko je rokov?'
                    {repeat} age {times} {print} 'Hip hip hurá!'
                    ```
                answer_code: |
                    Vlastná odpoveď
