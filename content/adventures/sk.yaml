            16:
                story_text: |
                    Cez `{while}` sa dá zabezpečiť, že zákazníci môžu pridávať objednávky, kým neskončia.

                    ### Cvičenie
                    Správne pridaj do tohto kódu príkaz `{while}`.
                example_code: |
                    ```
                    {print}('Vitaj v McHedy')
                    more = 'áno'
                    _
                        order = {input}('Čo chceš objednať?')
                        {print}(order)
                        more = {input}('Chceš objednať ešte niečo?')
                    {print}('Ďakujeme!')
                    ```
                answer_code: |
                    ```
                    {print}('Vitaj v McHedy')
                    more = 'áno'
                    {while} more == 'áno':
                        order = {input}('Čo chceš objednať?')
                        {print}( order )
                        more = {input}('Chceš objednať ešte niečo?')
                    {print}('Ďakujeme!')
                    ```
