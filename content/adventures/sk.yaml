                    Dokonči tento kód: na riadok 2 pridaj `{for} action {in} actions`.
                example_code_2: |
                    ```
                    actions = tlieskaj, dupkaj, zakrič hurá!
                    _
                        {repeat} 2 {times}
                            {print} 'Keď je veselo a vieš o tom, ' action
                            {sleep} 2
                        {print} 'Keď je veselo a vieš o tom a naozaj to chceš ukázať'
                        {print} 'Keď je veselo a vieš o tom, ' action
                        {sleep} 3
                    ```
                answer_code: |
                    ```
