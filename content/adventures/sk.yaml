                    ```
                answer_code: |
                    ```
                    options = [1, 2, 3, 4, 5, 6]
                    {print}('Hoď 6 čo najrýchlejšie!')
                    thrown = 0
                    tries = 0
                    {while} thrown == 0:
                        number = options[{random}]
                        tries = tries + 1
                        {if} number = 6:
                            thrown = 1
                            {print}('Šestka padla na ', tries, ' pokusov!')
                        {else}:
                            {print}('Šestka nepadla, namiesto toho padlo ', number)
                        {sleep} 1
                    ```
