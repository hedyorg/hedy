            7:
                story_text: |
                    Na tejto úrovni sa dá počítaním spočítať celková cena objednávky zákazníka, a virtuálna reštaurácia môže byť realistickejšia.
                    Ale do virtuálnej reštaurácie sa dá pridať aj veľa iného, napríklad viac chodov.

                    ### Cvičenie
                    Do virtuálnej reštaurácie sa dá pridať veľa vecí. Napríklad, vieš...
                    - spýtať sa, koľko ľudí príde, a vynásobiť cenu tým číslom?
                    - pridať ďalší chod?
                    - dať ľuďom zľavu, keď zadajú (tajný) kupónový kód?
                    - pridať detský jedálny lístok?
                    - vymyslieť iné zábavné veci na pridanie?
                example_code: |
                    Jednoduchý kód reštaurácie môže vyzerať takto:
                    ```
                    #Welcoming the customer:
                    {print} 'Vitaj v reštaurácii Chez Hedy'
                    {print} 'Tu je náš jedálny lístok:'
                    {print} 'Naše hlavné jedlá sú pizza, lasagne alebo špagety'
                    main = {ask} 'Aké hlavné jedlo chceš?'
                    #Calculating the price:
                    price = 0
                    {if} main {is} pizza
                    price = 10
                    {if} main {is} lasagne
                    price = 12
                    {if} main {is} spaghetti
                    price = 8
                    #Telling the price to the customer:
                    {print} 'Máš objednané ' main
                    {print} 'To bude ' price ' dolárov, prosím'
                    {print} 'Ďakujeme, prajeme dobrú chuť!'
                    ```
                answer_code: |
                    ```
                    {print} 'Vitaj v reštaurácii Chez Hedy'
                    {print} 'Tu je náš jedálny lístok:'
                    {print} 'Naše hlavné jedlá sú pizza, lasagne alebo špagety'
                    main = {ask} 'Aké hlavné jedlo chceš?'
                    price = 0
                    {if} main {is} pizza
                    price = 10
                    {if} main {is} lasagne
                    price = 12
                    {if} main {is} spaghetti
                    price = 8
                    {print} 'Máš objednané ' main
                    amount = {ask} 'Pre koľko ľudí to chceš objednať?'
                    correct_discount = Hedy
                    given_discount = {ask} 'Ak poznáš zľavový kód, vyplň ho sem'
                    {if} given_discount {is} correct_discount
                    price = price / 2
                    {else}
                    {print} 'Zlý kód!'
                    {print} 'To bude ' price * amount ' dolárov, prosím'
                    {print} 'Ďakujeme, prajeme dobrú chuť!'
                    ```
