                        {for} i {in} {range} (1, amount_of_tests):
                            grade = {input} ("Aká známka padla na skúške ", i, '?')
                            total = total + grade
                        {return} total / amount_of_tests

                    amount_of_subjects = {input}('Z koľkých predmetov sa má počítať priemer?')
