                    house('fialová')
                    house('modrá')
                    ```

                    Ulica v rôznych veľkostiach
                    ```
                    def house(size):
                        {for} i {in} {range} (1,4):
                            {forward} size
                            {turn} 90
                        {forward} size
                        {turn} 30
                        {forward} size
                        {turn} 120
                        {forward} size
                        {turn} 30
                        {forward} size
                        {turn} 270
                        {forward} 30
                        {turn} 270

                    house(90)
                    house(60)
                    house(30)
                    ```
