            10:
                story_text: |
                    Na tejto úrovni sa dá cez vnorenie spraviť reštaurácia realistickejšia a zábavnejšia!

                    ### Cvičenie
                    V ukážkovom kóde odsadenie zmizlo.
                    Vieš zistiť, koľko odsadenia potrebuje každý riadok, aby kód správne fungoval?
                    Ak si zákazník objedná pizzu, Hedy sa nemá pýtať na omáčku.

                    **Navyše** Reštaurácia nemá všetky omáčky. Sprav zoznam dostupných omáčok a pri každej objednávke odpovedz, či ju predávate. <br>
                    **Navyše** Pizze majú prílohy. Spýtaj sa zákazníkov, čo chcú.<br>
                    **Navyše** Chcú zákazníci nápoj? Spýtaj sa aj na to! <br>
                example_code: |
                    ```
                    #welcoming customers to the restaurant:
                    {print} 'Vitaj v reštaurácii Chez Hedy!'
                    people = {ask} 'Koľko ľudí sa dnes pridá?'
                    {print} 'Výborne!'
                    price = 0
                    #Asking all people what they want to order:
                    {repeat} people {times}
                    _ food = {ask} 'Čo chceš objednať?'
                    _ {print} food
                    _ {if} food {is} hranolky
                    _ price = price + 3
                    _ sauce = {ask} 'Akú omáčku chceš k hranolkám?'
                    _ {if} sauce {is} nie
                    _ {print} 'žiadna omáčka'
                    _ {else}
                    _ price = price + 1
                    _ {print} 's ' sauce
                    _ {if} food {is} pizza
                    _ price = price + 4
                    {print} 'To bude ' price ' dolár'
                    {print} 'Prajeme dobrú chuť!'
                    ```
                story_text_2: |
                    Na tejto úrovni pribudnú nové príkazy, ktorými sa kód dá ešte viac rozšíriť.

                    ### Cvičenie 1
                    Daj `{and}` a `{or}` na logické miesto v programe.

                    ### Cvičenie 2
                    Rozšír reštauráciu aspoň o jedno ďalšie `{and}` a jedno `{or}`.
                    Napríklad vytvor špeciálny zľavový kupón, ktorý platí len na pizzu, alebo daj zákazníkovi nápoj zadarmo
                    k hranolkám a lievancom. Alebo niečo úplne iné!
                example_code_2: |
                    ```
                    price = 10
                    food = {ask} 'Čo chceš jesť?'
                    drinks = {ask} 'Čo chceš piť?'
                    {if} food {is} sendvič _ drinks {is} džús
                        {print} 'To je naše zľavové menu'
                        price = price - 3
                    {if} drinks {is} voda _ drinks {is} džús
                        {print} 'To je zdravá voľba'
                    {print} 'To bude ' price ' dolárov'
                    ```
                answer_code: |
                    ```
                    {print} 'Vitaj v reštaurácii Chez Hedy!'
                    people = {ask} 'Koľko ľudí sa dnes pridá?'
                    {print} 'Výborne!'
                    price = 0
                    {repeat} people {times}
                        food = {ask} 'Čo chceš objednať?'
                        {print} food
                        {if} food {is} hranolky
                            price = price + 3
                            sauce = {ask} 'Akú omáčku chceš k hranolkám?'
                            {if} sauce {is} nie
                                {print} 'žiadna omáčka'
                            {else}
                                price = price + 1
                                {print} 's ' sauce
                        {if} food {is} pizza
                            price = price + 4
                    {print} 'To bude ' price ' dolár'
                    {print} 'Prajeme dobrú chuť!'
