levels:
    1:
        intro: "### Штампање и унос\nНа крају овог часа, можете:\n* Написати код који штампа текст\n* Креирати причу са уносом"
        exercises:
        -   contents: "### Вежбе\nРачунар не ради само нешто сам од себе. Увек морате дати рачунару задатак. Такав задатак се зове команда. Да бисте штампали код, користимо команду `{print}`.\n\n### Штампање текста\nНа екрану сте управо видели команду `{print}`.\nКоманда `{print}` штампа реч, када је између наводника. На пример `{print} hello`.\n#### Вежба 1: Предвидите излаз"
            type: текст
        -   code: print Здраво сви
            answer: Здраво сви
            lines: '1'
            type: излаз
        -   code: print добро јутро
            answer: добро јутро
            lines: '1'
            type: излаз
        -   new-page

        -   contents: "#### Вежба 2: Грешка?\nПонекад грешка упадне у ваш код. То није велика ствар, али Хеди не може правилно да чита ваш код.\nКоји од ових програма мислите да су погрешни?"
            type: текст
        -   code: prnt Здраво сви!
            answer: Погрешно
            options:
            -   Десно
            -   Погрешно
            type: МЦ-код
        -   code: print print
            answer: Десно
            options:
            -   Десно
            -   Погрешно
            type: МЦ-код
        -   contents: "### Питање за унос\n\nСам текст је мало досадан. Такође можете питати за _унос_ у Хеди. Унос је текст који дајете рачунару.\nРачунар запамти тај текст и може вам га касније показати.\nОвај код показује питање 'Како се зовете?'\n \n```hedy\nask Како се зовете?\n```\n\n### Показивање уноса\n\nКоманда ask чува одговор, али га још не показује. За то вам је потребна команда `{echo}`. `{echo}` ће показати одговор на крају реченице.\nКао ово:\n\n```hedy\nask како се зовете?\necho тако да се зовете:\n```\n\nАко би неко по имену Оливија користио овај код, излаз би био:\n\n```\nтако да се зовете: Оливија\n```\n\nИмајте на уму да ће рачунар штампати текст тачно онако како сте га унели. Дакле, са двотачком и истом употребом великих или малих слова!\n\n#### Вежба 3: Предвидите излаз\n\nПредвидите излаз ових програма. Претпоставите да сте унели своје име."
            type: текст
        -   code: "ask како се зовете?\necho тако да се зовете:"
            answer: 'тако да се зовете: **име**'
            lines: '2'
            type: излаз
        -   code: "ask Како се зовете?\necho Драго ми је што смо се упознали,"
            answer: Драго ми је што смо се упознали, **име**
            lines: '2'
            type: излаз
        -   contents: "#### Вежба 4: Програмске речи\n\nСваке лекције ћемо учити нове речи, а тако и у овој лекцији. Знате ли шта ови термини значе? Објасните их својим речима."
            type: текст
        -   answer: Задатак који ћете дати рачунару, нпр. print.
            lines: '1'
            type: дефиниши
            word: команда
        -   answer: Шта куцате у рачунар када Hedy прикаже екран за питање
            lines: '1'
            type: дефиниши
            word: унос
        -   answer: Шта Hedy показује на десном екрану након што сте притиснули дугме 'изврши код'.
            lines: '1'
            type: дефиниши
            word: излаз
        -   contents: "#### Вежба 5: Команде\n\nДо сада смо научили 3 команде: `{print}`, `{ask}` и `{echo}`. Шта оне раде? Објасните својим речима."
            type: текст
        -   answer: Показује текст на екрану.
            lines: '1'
            type: дефиниши
            word: команда `{print}`
        -   answer: Пита корисника за унос.
            lines: '1'
            type: дефиниши
            word: команда `{ask}`
        -   answer: Поново понавља корисников унос.
            lines: '1'
            type: дефиниши
            word: команда `{echo}`
    2:
        intro: "### Променљиве\nДо краја ове лекције, можете:\n* Сачувати нешто у променљивој\n * Креирати причу или цртеж користећи променљиве"
