            type: круг
        -   contents: "#### Вежба 2: Предвидите излаз\nСавет: Да ли имате проблема са предвиђањем излаза? Пратите ове кораке:\n\n1. Обележите место где се променљива поставља\n 2. Обележите место где се променљива користи\n3. Набрисите линију између ова два места\n4. Напишите вредност (шта долази после `{is}`) на месту где се променљива користи."
