            К концу этого урока ты сможешь:
            * Повторить несколько строк кода
        exercises:
            -   code: |-
                    repeat 5 times
                        print 'Акулёнок!'
                contents: |-
                    ### Повторение
                    Возможно, ты заметил, что раньше можно было повторять только одну строку кода — это очень просто.
                    Но часто нужно повторить несколько строк, чтобы создать более сложную программу.
                    В Hedy, как и в Python, для этого используются отступы!
                    Отступ — это несколько пробелов в начале строки.
                type: text
            -   contents: |-
                    #### Упражнение 1: Какие строки будут повторяться?

                    Подсказка: внимательно посмотри на отступы (пробелы в начале строки).
                type: text
            -   code: |-
                    repeat 3 times
                        print 'Акулёнок!'
                        print 'Ту-ду ту-ду ту-ду!'
                    print 'Акулёнок!'
                answer: Строки 2 и 3
                goal: отступы
                type: circle
            -   code: |-
                    print 'Привет!'
                    repeat 2 times
                        print 'Да, всем привет'
                answer: Строка 3
                goal: отступы
                type: circle
            -   code: |-
                    имя is ask 'Как тебя зовут?'
                    if имя is Hedy
                        print 'Да'
                    else
                        print 'Нет'
                answer: Ни одной! Отступы здесь нужны для if и else, но ни одна строка не будет повторяться.
                goal: отступы
                type: circle
            -   contents: |-
                    #### Упражнение 2: Предскажи результат
                    Что выведут эти программы?
                type: text
            -   code: |-
                    print 'Привет!'
                    repeat 1 times
                        print ':)'
                answer: |-
                    Привет!
                    :)
                type: output
            -   code: |-
                    print 'Привет!'
                    repeat 5 times
                        print ':('
                    print 'Готово!'
                answer: |-
                    Привет!
                    :(
                    :(
                    :(
                    :(
                    :(
                    Готово!
                type: output
            -   contents: |
                    ## If и else
                    С `if` и `else` тоже нужны отступы. Так можно выполнить несколько строк, когда условие истинно или ложно.

                    ### Упражнение 3: Предскажи результат

                    Предскажи результат этих программ.
                type: text
            -   code: |-
                    имя is ask 'Как тебя зовут?'
                    if имя is Hedy
                        print 'Да'
                    else
                        print 'Нет'
                answer: Нет
                lines: 1
                type: output
            -   code: |-
                    числа is 1, 2, 3, 4, 5, 6, 7
                    выбор is числа at random
                    if выбор is пять
                        print 'Ура!'
                        print 'Ура!'
                    else
                        print 'О нет!'
                answer: О нет!
                lines: 2
                type: output
            -   code: |-
                    кость = 1, 2, 3, 4, 5, 6
                    repeat 3 times
                        print 'Тебе выпало: ' кость at random
                        print 'Игра окончена'
                answer: |-
                    Тебе выпало: < 1, 2, 3, 4, 5 или 6>
                    Игра окончена
                    Тебе выпало: < 1, 2, 3, 4, 5 или 6>
                    Игра окончена
                    Тебе выпало: < 1, 2, 3, 4, 5 или 6>
                    Игра окончена
                lines: 6
                type: output
            -   contents: |-
                    ### Упражнение 4: Верно или неверно?
                    Внимательно посмотри на программы и реши, появится ли сообщение об ошибке.
                type: text
            -   code: |-
                    имя is Германс
                    if имя is Сенкал
                      print 'Ура!'
                    else
                    print 'Не повезло'
                answer: Неверно, после else нет отступа
                options:
                    - Верно
                    - Неверно
                type: MC-code
            -   code: |-
                    число is 10
                      if число is 5
                    print 'Ура!'
                      else
                    print 'Не повезло'
                answer: Неверно, отступы расставлены наоборот.
                options:
                    - Верно
                    - Неверно
                type: MC-code
            -   code: |-
                    люди = мама, папа, Эмма, Софи
                    repeat 7 times print 'Посуду помоет ' люди at random
                answer: Неверно, команду repeat больше нельзя записывать в одну строку.
                options:
                    - Верно
                    - Неверно
                type: MC-code
            -   code: |-
                    день is ask 'Какой сегодня день?'
                    if день is пятница
                        print 'Да!'
                answer: Верно
                options:
                    - Верно
                    - Неверно
                type: MC-code
            -   contents: |-
                    #### Упражнение 5: Напиши код
                    Внимательно посмотри на результат и напиши код, который его выдаёт. По возможности используй `repeat`.

                    Обрати внимание на нужное количество строк!
                type: text
            -   output: |-
                    У-ху!
                    У-ху!
                    У-ху!
                    У-ху!
                answer: |-
                    repeat 4 times
                        print 'У-ху!'
                type: input
            -   output: |-
                    Ты ещё спишь?
                    Ты ещё спишь?
                    Брат Иван
                    Брат Иван
                    Утренний колокол звонит!
                    Утренний колокол звонит!
                    Динь-дан-дон
                    Динь-дан-дон
                answer: |-
                    repeat 2 times
                        print 'Ты ещё спишь?'
                    repeat 2 times
                        print 'Брат Иван'
                    repeat 2 times
                        print 'Утренний колокол звонит!'
                    repeat 2 times
                        print 'Динь-дан-дон!'
                type: input
            -   contents: |-
                    #### Упражнение 6: Слова из программирования
                    Мы снова выучили новый термин из программирования: отступ! Объясни его своими словами.
                type: text
            -   answer: Добавить несколько пробелов в начало строки
                lines: 1
                type: define
                word: Как сделать отступ?
            -   contents: '#### Что ты думаешь?'
                type: text
            -   text: Какое упражнение на этом уровне понравилось тебе больше всего?
                lines: 1
                type: question
            -   text: Что тебе понравилось в этом упражнении?
                lines: 5
