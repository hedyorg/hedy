title: Documentazione di Hedy
home-sections:
-   title: Programmazione testuale resa semplice!
    text: |-
        Molte scuole e insegnanti in tutto il mondo vogliono insegnare a programmare ai propri studenti. All'inizio lo si fa spesso con strumenti giocosi, dal robot Bee-Bot a
        Scratch Junior o Scratch. Dopo aver usato questi strumenti, i ragazzi spesso vogliono passare a linguaggi di programmazione testuali e più potenti, come Python.

        Python però è difficile, perché è disponibile solo in inglese e richiede di imparare tutti insieme concetti e sintassi di programmazione complessi.
        Hedy è il modo semplice per iniziare con i linguaggi di programmazione testuali! Hedy è gratuito, open source e diverso da qualsiasi altro linguaggio di programmazione testuale in tre aspetti.

        1. Hedy è multilingue: puoi usare Hedy nella tua lingua
        2. Hedy è graduale: puoi imparare un concetto e la sua sintassi alla volta
        3. Hedy è pensato per la classe: gli insegnanti possono personalizzare completamente l'esperienza dei propri studenti
-   title: Programmazione multilingue
    text: Anche se quasi tutti i linguaggi di programmazione testuali hanno parole chiave in inglese, come `for` o `repeat`, Hedy può essere usato in qualsiasi lingua! Al momento supportiamo 47 lingue diverse, tra cui olandese, spagnolo, arabo, turco, cinese e hindi. Se la tua lingua non è disponibile, puoi sempre avviare una nuova traduzione.
-   title: Apprendimento passo dopo passo
    text: Imparare un linguaggio di programmazione può essere scoraggiante, perché bisogna imparare allo stesso tempo i concetti (per esempio se-altrimenti o i cicli) e la sintassi (come le virgolette o le parentesi tonde). In Hedy i concetti vengono introdotti prima con poca sintassi e poi perfezionati. Un modo di imparare scientificamente provato!
-   title: Pensato per la classe
    text: |-
        Hedy è adatto a ragazzi dai 10 anni in su ed è progettato per l'uso in classe.
        Gli insegnanti possono usare i nostri piani di lezione gratuiti e integrati, ma possono anche creare le proprie lezioni e caricarle nell'interfaccia di Hedy.
-   title: Programmare in contesto
    text: Hedy mostra la programmazione nel modo più ampio possibile e può essere usato in tanti modi stimolanti. Con Hedy si possono creare storie digitali e interattive, disegni colorati da mostrare sullo schermo, ma anche da disegnare con un plotter a penna o ricamare su una maglietta, e si possono creare giochi o app con pulsanti e azioni da tastiera.
-   title: Hedy è gratuito?
    text: |-
        Sì! Hedy è 'open source', il che significa che chiunque può aiutarci a migliorarlo.
        Puoi trovare il nostro codice su <a href="https://github.com/hedyorg/hedy" target="_blank">Github</a>.
        Se ti piace Hedy e vuoi contribuire, accettiamo (e ti siamo molto grati per) le <a href="https://github.com/sponsors/hedyorg" target="_blank">donazioni</a>!
        Usiamo il denaro per mantenere attivo il server e per gestire e migliorare il sito di Hedy.
-   title: Devo installare qualcosa?
    text: No. Hedy funziona nel browser, cioè il programma che stai usando per vedere questa pagina. Probabilmente Chrome, Edge o Firefox. Hedy funziona anche su smartphone e tablet.
-   title: Serve esperienza di programmazione per insegnare con Hedy?
    text: |-
        No, non è necessario. Tutti i concetti sono spiegati nelle slide e nell'interfaccia per gli studenti.
        Se crei un account gratuito per insegnanti, hai anche accesso al manuale per insegnanti, con informazioni su come insegnare
        e sugli errori più frequenti.
join-sections:
-   title: Sostenere Hedy
    text: "# Ci sono tre modi in cui puoi sostenere Hedy!"
-   title: Migliorare il linguaggio
    text: |-
        La natura graduale e multilingue di Hedy crea molte sfide tecniche interessanti.
        Trovi queste questioni su <a href="https://github.com/hedyorg/hedy/issues?q=is%3Aopen+is%3Aissue+label%3Alanguage" target="_blank">Github</a>.
-   title: Tradurre Hedy
    text: |-
        Non sai programmare? Nessun problema! Un altro modo per sostenere Hedy è <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">tradurre le parole chiave, i messaggi di errore, le avventure e gli altri contenuti</a>.
        Questo è lo stato attuale: aiutaci a completare una lingua o aggiungine una nuova!
        <a href="https://hosted.weblate.org/engage/hedy/">
        <img src="https://hosted.weblate.org/widgets/hedy/-/multi-auto.svg" alt="Stato delle traduzioni" /></a>
-   title: Aiutare gli insegnanti a iniziare
    text: |-
        Hedy è progettato per aiutare gli insegnanti a fare lezioni di programmazione in classe. Abbiamo funzionalità specifiche per gli insegnanti, come la possibilità di creare una classe, personalizzarla e vedere come stanno andando i tuoi studenti.
        Se ti piace Hedy, puoi contattare le scuole che conosci per aiutare gli insegnanti a iniziare! Possiamo aiutarti a trovare scuole o insegnanti tramite <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord</a>.
