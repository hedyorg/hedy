        level: '4'
        concepts_and_changes: |-
            Nel livello 4 gli studenti scoprono per la prima volta l'importanza della sintassi nella programmazione. In questo livello vengono introdotte le virgolette attorno al testo di `{print}` e `{ask}`. Forse non è il livello più emozionante, ma è un'abilità molto importante da padroneggiare prima di passare ai livelli successivi. Gli studenti potrebbero trovare questo livello impegnativo, soprattutto quando nel testo compaiono delle variabili. Consigliamo di dare istruzioni esplicite e di esercitarsi insieme agli studenti.

            Novità di questo livello:

            * Usare le virgolette attorno a ogni tipo di testo dopo `{print}` e `{ask}`
            * Lasciare le variabili fuori dalle virgolette
            * Usare le virgolette doppie quando nel testo ci sono degli apostrofi
            * Pulire lo schermo con `{clear}`
            * Usare i colori con la tartaruga grazie a `{color}`
