                    {repeat} 3 {times} bevanda = {ask} 'Cosa vorresti bere?'
                    {print} bevanda
                solution_text: Per poter ripetere più righe bisogna passare al livello successivo. Quindi in questo livello dovrai stampare tutto separatamente.
                solution_code: |-
                    bevanda = {ask} 'Cosa vorresti bere?'
                    {print} bevanda
                    bevanda = {ask} 'Cosa vorresti bere?'
                    {print} bevanda
                    bevanda = {ask} 'Cosa vorresti bere?'
                    {print} bevanda
            title: Gli studenti provano a ripetere più righe
        -   example:
                error_text: In questo livello è molto facile creare programmi che impiegano molto tempo per finire. Se il programma impiega troppo tempo, viene fermato, per evitare di sovraccaricare il computer dello studente.
                error_code: "{repeat} 100 {times} {print} 'Quante volte posso ripetere questo?'"
                solution_text: Assicurati che il codice non impieghi troppo tempo per essere eseguito
                solution_code: "{repeat} 20 {times} {print} 'Così basta'"
            title: Gli studenti creano programmi che impiegano troppo tempo per essere eseguiti
        level: '8'
        concepts_and_changes: |-
            In quest'ultimo livello di Hedy Base i tuoi studenti impareranno a usare la ripetizione nei loro programmi! Possono ripetere più volte solo una riga. La ripetizione di più righe verrà insegnata nei livelli successivi.

            Novità di questo livello:
            * Ripetere una riga con `{repeat} 3 {times}`
            * Ripetere una riga un numero di volte dato da una variabile
    -   sections:
        -   example:
                error_text: L'indentazione è un concetto nuovo in questo livello e per alcuni studenti potrebbe essere difficile da imparare. Assicurati che si esercitino con qualche esempio semplice prima di creare un intero programma.
                error_code: |-
                    {repeat} 3 {times}
                    {print} 'ciao'
                solution_text: 'Questo è il codice corretto:'
                solution_code: |-
                    {repeat} 3 {times}
                        {print} 'ciao'
            title: Gli studenti usano l'indentazione in modo sbagliato
        -   title: Gli studenti ripetono solo 1 riga quando volevano ripeterne più di una
            example:
                error_text: Per esempio, nel codice qui sotto lo studente voleva prendere le ordinazioni delle bevande di 3 persone. Invece il programma ha fatto la domanda 3 volte, ma ha scritto una sola ordinazione.
                error_code: |-
                    {repeat} 3 {times}
                        bevanda = {ask} 'Cosa vorresti bere?'
                    {print} bevanda
                solution_text: |-
                    Nel codice corretto anche la terza riga inizia con l'indentazione. In questo modo fa parte del blocco repeat e quindi verrà ripetuta 3 volte.
                    Mostrare queste differenze ai tuoi studenti può aiutarli a capire perché serve l'indentazione per far funzionare i nostri programmi.
                solution_code: |-
                    {repeat} 3 {times}
                        bevanda = {ask} 'Cosa vorresti bere?'
                        {print} bevanda
        -   title: Gli studenti vogliono annidare istruzioni `{if}` o mettere istruzioni `{if}` dentro un ciclo
            example:
                error_text: |-
                    In questo livello gli studenti non possono ancora mettere istruzioni `{if}` dentro altre istruzioni `{if}` o dentro i cicli repeat.
                    Nel livello successivo è consentito.
                error_code: |-
                    compleanno = {ask} 'È il tuo compleanno?'
                    {if} compleanno = sì
                        {repeat} 3 {times}
                            {print} 'Hip hip urrà!'
                solution_text: 'Questo è il codice corretto per questo livello:'
                solution_code: |-
                    compleanno = {ask} 'È il tuo compleanno?'
                    {if} compleanno = sì
                        {print} 'Hip hip urrà!'
                        {print} 'Hip hip urrà!'
                        {print} 'Hip hip urrà!'
        -   title: Gli studenti creano programmi che impiegano troppo tempo per essere eseguiti
            example:
                error_text: In questo livello è molto facile creare programmi che impiegano molto tempo per finire. Se il programma impiega troppo tempo, viene fermato, per evitare di sovraccaricare il computer dello studente.
                error_code: |-
                    {repeat} 100 {times}
                        {print} 'Quante volte posso ripetere questo?'
                solution_text: Assicurati che il codice non impieghi troppo tempo per essere eseguito
                solution_code: |-
                    {repeat} 20 {times}
                        {print} 'Così basta'
        level: '9'
        concepts_and_changes: |-
            In questo primo livello di Hedy Avanzato gli studenti imparano a usare l'indentazione. Questo permette loro di usare più righe in un'istruzione if o di ripetere più righe. Agli studenti spesso piace molto questo livello, perché permette di creare programmi più elaborati.
            D'altra parte, alcuni studenti faranno fatica a capire quando usare l'indentazione e come farlo.

            Novità di questo livello:
            * Più righe dopo un `{if}`, `{elif}` o `{else}` usando l'indentazione
            * Più righe dopo un `{repeat}` usando l'indentazione
    -   sections:
        -   example:
                error_text: La parte più difficile di questo livello è usare correttamente l'indentazione. Agli studenti piace molto annidare le istruzioni `{if}`, a volte anche dentro altre istruzioni `{if}` già annidate. Tenere traccia dell'indentazione può diventare piuttosto complicato.
                error_code: |-
                    {print} 'Robin sta camminando in centro'
                    luogo = {ask} 'Robin entra in un negozio o torna a casa?'
                    {if} luogo {is} negozio
                        {print} 'Lei entra nel negozio.'
                        {print} 'Robin vede un libro molto interessante'
                        libro = {ask} 'Robin compra il libro?'
                            {if} libro {is} sì
                    {print} 'Robin compra il libro e torna a casa'
                    {else}
                        {print} 'Robin esce dal negozio e torna a casa'
                    {else}
                        {print} 'Robin torna a casa'
                solution_text: Questo è il codice corretto. Cerca di tenere traccia di tutte le diverse strutture quando metti istruzioni `{if}` dentro altre istruzioni `{if}`.
                solution_code: |-
                    {print} 'Robin sta camminando in centro'
                    luogo = {ask} 'Robin entra in un negozio o torna a casa?'
                    {if} luogo {is} negozio
                        {print} 'Lei entra nel negozio.'
                        {print} 'Robin vede un libro molto interessante'
                        libro = {ask} 'Robin compra il libro?'
                        {if} libro {is} sì
                            {print} 'Robin compra il libro e torna a casa'
                        {else}
                            {print} 'Robin esce dal negozio e torna a casa'
                    {else}
                        {print} 'Robin torna a casa'
            title: Gli studenti fanno errori con l'indentazione
        -   example:
                error_text: I due comandi possono sembrare simili, ma le loro funzioni sono molto diverse.
                error_code: |-
                    gioco = {ask} 'Vuoi fare un gioco?'
                    tempo = {ask} 'Hai tempo per giocare?'
                    {if} gioco {is} 'sì' {or} tempo {is} 'sì'
                        {print} 'Giochiamo!'
                solution_text: In questo caso la persona deve rispondere sì a entrambe le domande, quindi devi usare `and`.
                solution_code: |-
                    gioco = {ask} 'Vuoi fare un gioco?'
                    tempo = {ask} 'Hai tempo per giocare?'
                    {if} gioco {is} 'sì' {and} tempo {is} 'sì'
                        {print} 'Giochiamo!'
            title: Gli studenti confondono `{and}` con `{or}`
        -   title: Gli studenti scrivono righe incomplete con `{or}`
            example:
                error_text: Dopo un {or} la condizione deve essere completa.
                error_code: |-
                    colore = {ask} 'Che colore ti piace?'
                    {if} colore {is} blu {or} verde
                        {print} 'Bellissimo!'
                solution_text: 'Completa la riga così:'
                solution_code: |-
                    colore = {ask} 'Che colore ti piace?'
                    {if} colore {is} blu {or} colore {is} verde
                        {print} 'Bellissimo!'
        level: '10'
        concepts_and_changes: |-
            In questo livello amplieremo di nuovo {if} e {repeat}. Nel livello precedente gli studenti hanno imparato a usare più righe dopo {repeat}, {if}, {elif} o {else}.
            Ora gli studenti impareranno anche l'*annidamento*, cioè mettere un {if} o un {repeat} dentro un {if} o un {repeat}. Impareranno anche due nuovi comandi: {and} e {or}.
            Questo darà agli studenti molte più possibilità per creare programmi più versatili.

            Novità di questo livello:
            * Annidare {if} e {repeat}
            * Usare {and} e {or} dopo un {if}
    -   sections:
        -   example:
                error_text: Vediamo spesso che gli studenti provano a stampare la lista (nell'esempio animali) invece degli elementi della lista.
                error_code: |-
                    animali {is} cane, gatto, pesce blob
                    {for} animale {in} animali
                      {print} 'Adoro ' animali
                solution_text: La parola animali nell'ultima riga va cambiata in animale.
                solution_code: |-
                    animali {is} cane, gatto, pesce blob
                    {for} animale {in} animali
                      {print} 'Adoro ' animale
            title: Gli studenti non usano correttamente il comando `{for}`
        -   example:
                error_text: Gli studenti tendono a dimenticare l'indentazione dopo un comando for.
                error_code: |-
                    animali {is} cane, gatto, pesce blob
                    {for} animale {in} animali
                    {print} 'Adoro ' animali
                solution_text: Dopo un comando for devi usare l'indentazione.
                solution_code: |-
                    animali {is} cane, gatto, pesce blob
                    {for} animale {in} animali
                      {print} 'Adoro ' animale
            title: Gli studenti dimenticano l'indentazione
        level: '11'
        concepts_and_changes: |-
            In questo livello gli studenti scopriranno i cicli con {for}.

            Novità di questo livello:
            * Cicli con {for}
    -   sections:
        -   example:
                error_text: Una funzione funziona solo quando la chiami.
                error_code: |-
                    {define} saluta_cliente
                        {print} 'Ciao'
                        {print} 'Come stai?'
                solution_text: Chiama la funzione
                solution_code: |-
                    {define} saluta_cliente
                        {print} 'Ciao'
                        {print} 'Come stai?'

                    {call} saluta_cliente
            title: Gli studenti creano una funzione ma dimenticano di chiamarla.
        -   example:
                error_text: Per molti studenti l'indentazione resterà complicata
                error_code: |-
                    {define} funzione
                    {print} 'In una funzione si usa l indentazione.'
                    {if} usa_if {is} 'sì'
                    {print} 'E non dimenticare di indentare anche i cicli'
                solution_text: Usa l'indentazione corretta quando usi una funzione
                solution_code: |-
                    {define} funzione
                        {print} 'In una funzione si usa l indentazione.'
                        {if} usa_if_anche {is} 'sì'
                            {print} 'E non dimenticare di indentare anche i cicli'
            title: Gli studenti hanno difficoltà con l'indentazione.
        -   example:
                error_text: Ora gli studenti hanno bisogno di più virgolette rispetto ai livelli precedenti. In questo esempio sono state dimenticate le virgolette nella lista e nel comando `{if}`.
                error_code: |-
                    supereroi = Spiderman, Batman, Iron Man
                    supereroe = supereroi {at} {random}
                    {if} supereroe = Batman
                        {print} 'IO SONO BATMAN!'
                solution_text: 'Questo è il codice corretto:'
                solution_code: |-
                    supereroi = 'Spiderman', 'Batman', 'Iron Man'
                    supereroe = supereroi {at} {random}
                    {if} supereroe {is} 'Batman'
                        {print} 'IO SONO BATMAN!'
            title: Gli studenti dimenticano le virgolette
        level: '12'
        concepts_and_changes: |-
            In quest'ultimo livello di Hedy Avanzato gli studenti impareranno a usare le funzioni di base.

            Novità di questo livello:
            * Usare le funzioni di base con {define} e {call}
    -   sections:
        -   example:
                error_text: Questo livello contiene molte nuove regole di sintassi.
                error_code: |-
                    umore {is} {ask} 'Come stai ' nome '?'
                    {if} umore {is} bene
                        {print} 'Ottimo!'
                solution_text: Usa la sintassi corretta.
                solution_code: |-
                    umore = input('Come stai, ', nome, '?')
                    {if} umore == 'bene':
                        {print}('Ottimo!')
            title: Gli studenti dimenticano di usare la nuova sintassi
        -   title: Gli studenti confondono i segni < e >
            example:
                error_text: Spesso gli studenti conoscono già questi segni dalle lezioni di matematica. Ma se i tuoi studenti non li conoscono ancora, potrebbero trovarli difficili.
                error_code: |-
                    eta = {ask} 'Quanti anni hai?'
                    {if} eta < 12
                        {print} 'Sei più grande di me!'
                solution_text: 'Questo è il codice corretto:'
                solution_code: |-
                    eta = {ask} 'Quanti anni hai?'
                    {if} eta > 12
                        {print} 'Sei più grande di me!'
        -   title: Gli studenti usano i segni sbagliati per `!=` `<=` e `>=`
            example:
                error_text: Questi segni sono probabilmente nuovi per la maggior parte degli studenti. Assicurati di spiegarli ai tuoi studenti.
                error_code: |-
                    nome = {ask} 'Come ti chiami?'
                    {if} nome =  'Hedy'
                        {print} 'Non sei Hedy'
                solution_text: 'Questo è il codice corretto:'
                solution_code: |-
                    nome = {ask} 'Come ti chiami?'
                    {if} nome != 'Hedy'
                        {print} 'Non sei Hedy'
        -   title: Gli studenti dimenticano di usare il segno ==
            example:
                error_text: In questo livello gli studenti possono ancora usare = o is. Ma in altri livelli, o in Python, potrebbero avere problemi. Quindi è meglio abituarli a usarlo.
                error_code: |-
                    nome = {ask} 'Come ti chiami?'
                    {if} nome = 'Hedy'
                        {print} 'Sei forte!'
                solution_text: 'Questo è il codice corretto:'
                solution_code: |-
                    nome = {ask} 'Come ti chiami?'
                    {if} nome == 'Hedy'
                        {print} 'Sei forte!'
        -   title: Gli studenti provano a usare funzionalità imparate nei livelli precedenti che non fanno parte della sintassi di Python.
            example:
                error_text: Gli studenti proveranno a usare, per esempio, la ripetizione, le funzioni o le liste.
                error_code: |-
                    {define} scegli_un_animale
                        animali = cane, gatto, criceto
                        {repeat} 3 {times}
                        {print} animali {at} {random}

                    {call} scegli_un_animale
                solution_text: Impareranno a fare queste cose nei prossimi livelli.
                solution_code: "#Quando sei pronto, dai un'occhiata ai prossimi livelli. Oppure continua prima a esercitarti con le basi in questo livello."
        level: '13'
        concepts_and_changes: |-
            In questo primo livello di Hedy Esperto gli studenti entreranno sempre di più nei concetti e nella sintassi dei veri linguaggi di programmazione.
            Consigliamo di lavorare sui livelli di Hedy Esperto con i tuoi studenti solo se il tuo obiettivo è farli lavorare in seguito con altri 'veri' linguaggi di programmazione (come Python).
            Se questo obiettivo di apprendimento non è adatto ai tuoi studenti, consigliamo di lavorare solo su Hedy Base e Hedy Avanzato, dove gli studenti impareranno i principi di base della programmazione senza essere disturbati da regole di sintassi specifiche.

            **Nota bene**: da questo livello in poi la sintassi di Hedy è (quasi) la sintassi di Python. Questo significa che la sintassi di Hedy imparata in precedenza potrebbe non funzionare qui. Spiegheremo tutta la nuova sintassi in stile Python nei prossimi livelli ma, per non sovraccaricare gli studenti, l'abbiamo distribuita su più livelli.
            Di conseguenza alcune funzionalità, per esempio le funzioni e le liste, non funzioneranno più nel modo di Hedy, ma non saranno ancora state spiegate nel nuovo modo di Python. Per questo agli studenti serve un po' di pazienza: facciamo un passo indietro rispetto ai livelli precedenti per impostare bene la sintassi, e poi passiamo a imparare tutte le funzionalità nel modo di Python.

            In questo livello gli studenti impareranno anche a lavorare con gli operatori, che danno loro più possibilità di usare la matematica nei programmi.


            Novità di questo livello:
            * Stampare con la sintassi di Python: `{print}('Ciao mondo!')`
            * Stampare testo e variabili insieme, così: `{print}('Ciao, ', nome, '!')`
            * Fare domande con `{input}`
            * Usare i due punti dopo le istruzioni {if}
            * Usare questi operatori: < > == != <= >=
