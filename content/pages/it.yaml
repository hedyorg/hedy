start-sections:
-   title: Iniziare con Hedy
    text: |-
        Ti diamo il benvenuto in Hedy, siamo felici di aiutarti a iniziare.

        Il nostro [Manuale per insegnanti](https://www.hedy.org/for-teachers/manual) contiene una panoramica dettagliata di tutte le funzionalità, ma in questa pagina trovi un breve riepilogo, così sai come orientarti prima di cominciare.

        Alcune cose importanti da sapere:
        * Hedy è uno strumento pensato per aiutarti a gestire una classe di ragazzi che programmano! Puoi creare le tue classi e i tuoi piani di lezione e seguire come stanno andando i ragazzi.
        * Non serve sapere molto di programmazione per cominciare: Hedy funziona passo dopo passo, anche per te!
        * Puoi usare Hedy nella tua lingua madre, perché è stato tradotto in molte altre lingue!
        * Tutti i ragazzi possono programmare!! Hedy è particolarmente utile per i ragazzi con problemi di vista, perché può leggere ad alta voce i contenuti senza bisogno del mouse.
        * Siamo qui per aiutarti: puoi trovarci per esempio su [Discord](https://discord.gg/8yY7dEme9r) oppure puoi [scriverci un'email](hello@hedy.org).
-   title: Gli insegnanti parlano di Hedy
    text: |-
        Molti insegnanti in tutto il mondo hanno espresso la loro passione per Hedy, come alcuni ci hanno raccontato:

        *Incredibilmente stimolante! Un modo davvero ottimo per rendere la programmazione molto più accessibile, per sé stessi ma anche per gli studenti. È molto divertente da usare e ha un grande potenziale per lavorare con gli studenti. Penso che sia uno strumento molto bello! Credo che sia un modo prezioso per far iniziare i bambini a programmare. Python e il coding sono sempre stati molto emozionanti, perché la soglia per imparare è molto alta. Ora tutto è un po' più basso ed è stato spiegato che in realtà può essere molto facile. Mi è piaciuto vedere come Hedy cerca di rendere la programmazione il più accessibile possibile per chi la usa!*
        Paesi Bassi: insegnanti di matematica in formazione (scuola secondaria)

        *Interfaccia semplice e buoni esempi.* Insegnante: dalla 3ª alla 6ª classe (scuola primaria)

        *La programmazione multilingue e il concetto stesso di programmazione graduale.* Stati Uniti: middle school, dalla 6ª all'8ª classe

        *La natura graduale con cui viene introdotta la programmazione.* Australia: scuola superiore

        *Prosegue in automatico.* Paesi Bassi: 2 HAVO-VWO

        *Sia il fatto che la spiegazione possa essere in olandese (e il codice in inglese), sia il fatto che si costruisce con sempre più possibilità.* Paesi Bassi: gruppo di una classe di potenziamento

        *Ma Hedy e i suoi livelli graduali... che idea! Volevo ringraziarvi personalmente per averlo creato. Non vi ringrazierò mai abbastanza. Inoltre, non avevo mai visto il livello di coinvolgimento e di entusiasmo dei miei studenti che ho visto con Hedy. Siamo arrivati fino al livello 5 e pensiamo di dedicarci ancora una settimana in classe e in laboratorio, prima di iniziare con Python.* Pakistan

        *La 'concretezza' della programmazione: assomiglia a come è nella realtà.* Paesi Bassi: classe di potenziamento, gruppi dal 4 all'8

        *Attività passo dopo passo. Attività divertenti.* Paesi Bassi: 1e tutti i livelli, 2e VWO/HAVO 2e VWO +, 3e HAVO 3e VWO

        *Mi piace davvero moltissimo Hedy ed è anche ben strutturato, il che lo rende adatto alla scuola primaria. L'approccio graduale di Hedy funziona molto bene. La breve spiegazione all'inizio di ogni livello e i brevi programmi di esempio aiutano i bambini a capire subito cosa c'è di nuovo nel livello scelto. Anche i diversi compiti che i bambini possono scegliere funzionano molto bene. Si vede che i bambini scelgono i compiti che li attirano e poi ci lavorano, attraverso i livelli. Hedy è molto divertente per i bambini che sono bravi a programmare e vogliono assaggiare un vero linguaggio di programmazione. È una buona preparazione per la scuola secondaria, appena lì si farà più informatica.* Paesi Bassi: scuola Montessori di Oegstgeest

        *La struttura è fatta benissimo.* Paesi Bassi: scuola secondaria inferiore HAVO-VWO

        *Riesco a seguire il ritmo della classe.* Paesi Bassi: gruppi 7 e 8

        ![Felienne insegna ai bambini](/images/teacherfeedback/Fkids1.JPG) *Felienne insegna ai bambini*        ![Bambini che imparano Hedy](/images/teacherfeedback/Fkids2.JPG) *Bambini che imparano Hedy*
teacher-guide:
-   title: Informazioni di base
    key: intro
    subsections:
    -   title: Cos'è Hedy?
        text: |-
            Hedy è un linguaggio di programmazione testuale, sviluppato appositamente per preadolescenti e adolescenti (dai 10 ai 15 anni).
            A differenza dei linguaggi di programmazione per bambini come Scratch, Hedy non usa blocchi di codice ma codice testuale.
            Quindi con Hedy imparerai a scrivere codice come fanno i veri programmatori, ma a piccoli passi e con esercizi giocosi.
            In questo modo Hedy può fare da trampolino verso veri linguaggi di programmazione come Python, in modo accessibile e soprattutto divertente!
            Se vuoi saperne di più, puoi guardare questo <a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">video</a> (in inglese) sullo sviluppo di Hedy come linguaggio di programmazione.
    -   title: Destinatari
        text: |-
            Hedy è stato sviluppato pensando agli studenti delle scuole medie e dei primi anni delle superiori (dai 10 ai 15 anni), ma può essere usato da chiunque voglia imparare a programmare!
            È importante che gli studenti sappiano leggere bene. Consigliamo di non iniziare con Hedy prima che gli studenti abbiano raggiunto almeno il livello di lettura di una terza elementare.
            Gli studenti (e gli insegnanti!) non hanno bisogno di alcuna esperienza di programmazione prima di iniziare con Hedy.
    -   title: Come funziona Hedy?
        text: |-
            Hedy è diviso in livelli, in cui vengono insegnati nuovi comandi e concetti di programmazione. Ogni livello contiene diverse avventure per esercitarsi con i comandi appena imparati.
            Hedy è diviso in tre sezioni: Base, Avanzato ed Esperto. In Hedy Base (livelli 1–8) si esplorano concetti di programmazione semplici e divertenti, come stampare, chiedere un input, usare semplici variabili e la ripetizione. In Hedy Avanzato (livelli 9–12) i tuoi studenti andranno un po' oltre e impareranno ad affrontare idee più complesse come i cicli, l'annidamento e le funzioni. Hedy Esperto (livelli 13–16) è pensato per passare senza difficoltà alla sintassi completa di Python.
            Quindi, qualunque sia il tuo obiettivo per i tuoi studenti, Hedy è adatto. Che si tratti solo di far provare loro il piacere di programmare, di insegnare i concetti di base o di prepararli alla vera sintassi di Python.

            Come insegnante, non solo puoi decidere quali livelli sono disponibili per i tuoi studenti, ma puoi anche decidere quali avventure sono disponibili in ogni livello. Creeranno un ristorante, una calcolatrice o una casa stregata? All'interno di ogni livello, le avventure sono ordinate dalla più facile alla più difficile, ma puoi combinarle nel modo più adatto ai tuoi studenti.
            Gli studenti possono svolgere le avventure da soli, ma consigliamo di usarle durante una lezione frontale.

            Le avventure includono anche un codice di esempio e le soluzioni, così anche gli insegnanti meno esperti di tecnologia possono usare Hedy!
            Naturalmente Hedy è pensato anche per gli insegnanti creativi che amano creare i propri piani di lezione e le proprie avventure!

            Puoi seguire il lavoro e i progressi dei tuoi studenti nella pagina della classe.
    -   title: Dispositivi
        text: |-
            Hedy funziona sul web, il che significa che funziona su qualsiasi dispositivo con un browser (Google Chrome, Firefox, Edge ecc.), quindi computer portatili, Chromebook, tablet e perfino smartphone sono adatti per usare Hedy.
            Non serve scaricare nulla prima di lavorare con Hedy: basta andare sul sito ed è tutto pronto!
            È disponibile anche una <a href="https://github.com/hedyorg/hedy/wiki/Offline-Hedy " target="_blank">versione offline</a> di Hedy.
    -   title: La comunità di Hedy
        text: |-
            Tutti gli insegnanti, i programmatori e gli altri appassionati di Hedy sono invitati a unirsi al nostro <a href="https://discord.gg/8yY7dEme9r" target="_blank">server Discord</a>. È il posto ideale per parlare di Hedy: abbiamo canali dove puoi mostrare i tuoi progetti e le tue lezioni più belle, canali per segnalare bug e canali per chiacchierare con altri insegnanti e con il team di Hedy.
            <a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">Qui</a> trovi un video (in inglese) su come unirti alla comunità Discord.

            Puoi anche seguire le novità di Hedy <a href="https://hedy.org/subscribe" target="_blank">iscrivendoti alla nostra newsletter</a>. Oppure seguici su <a href="https://nl.linkedin.com/company/hedyorg" target="_blank">LinkedIn</a>.
    -   title: Hedy e il GDPR
        text: |-
            Le organizzazioni nell'UE devono rispettare il GDPR (Regolamento generale sulla protezione dei dati) quando trattano dati personali.
            Poiché per molte scuole si tratta di una questione complessa, puoi usare tutte le funzionalità di programmazione di Hedy senza condividere dati personali.
            Il modo più semplice per farlo è usare Hedy senza creare account per l'insegnante e per gli studenti. Senza account Hedy è disponibile, ma senza l'area riservata agli insegnanti. Non potrai seguire i progressi dei tuoi studenti né decidere quali avventure e livelli sono disponibili per loro. È una limitazione, ma ci sono scuole che usano Hedy in questo modo.

            Un secondo modo è che l'insegnante crei un account con un indirizzo email che non contiene dati personali, per esempio "docente25@email.com". A parte un indirizzo email, che serve solo per reimpostare la password, non devi condividere alcuna informazione quando crei un account per insegnanti.
            Con un account per insegnanti puoi creare account anonimi per gli studenti, per esempio arcobaleno-studente1, arcobaleno-studente2 ecc. (vedi 'Preparazione delle lezioni' per una guida dettagliata). In questo modo puoi usare tutte le funzionalità di Hedy, compreso il salvataggio dei progressi, senza condividere dati personali tuoi o dei tuoi studenti.

            Se quanto sopra non è sufficiente per il tuo contesto, possiamo firmare un accordo sul trattamento dei tuoi dati personali.
    -   title: Fai una donazione a Hedy
        text: Il tuo aiuto ci serve per far funzionare Hedy. Usiamo il denaro per mantenere attivo il server e per gestire e migliorare il sito di Hedy. Ogni donazione a Hedy è benvenuta! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Clicca qui per donare in euro </a> oppure <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">clicca qui per donare in dollari statunitensi</a>. Grazie!
-   levels:
    -   sections:
        -   example:
                error_text: Per esempio scrivono una frase senza usare print.
                error_code: Hedy non può stampare questo
                solution_text: Insegna ai tuoi studenti a iniziare sempre una riga di codice con un comando.
                solution_code: '{print} Hedy può stampare questo!'
            title: Gli studenti dimenticano di scrivere i comandi
        -   example:
                error_text: I comandi non funzionano se sono scritti in maiuscolo.
                error_code: |-
                    Chiedi Perché il mio codice non funziona?
                    Stampa Perché sto usando le maiuscole.
                solution_text: Togli le maiuscole.
                solution_code: |-
                    {ask} Perché ora il mio codice funziona?
                    {print} Perché ho tolto le maiuscole!
            title: Gli studenti usano le maiuscole quando scrivono i comandi
        -   example:
                error_text: answer serve a ripetere una risposta dopo un comando ask. Senza ask, answer non fa nulla.
                error_code: '{print} Il tuo nome è {answer}'
                solution_text: Aggiungi un comando ask per farlo funzionare.
                solution_code: |-
                    {ask} Come ti chiami?
                    {print} Il tuo nome è {answer}
            title: Gli studenti usano answer senza ask
        -   example:
                error_text: Spesso agli studenti piace provare numeri grandi con la tartaruga, e così la freccia esce dallo schermo.
                error_code: |-
                    {forward} 300
                    {turn} 90
                solution_text: Nell'esempio gli studenti tendono a pensare che il comando turn non abbia funzionato, anche se ha fatto quello che doveva. In realtà la tartaruga è andata oltre i bordi dello schermo. Usa numeri più piccoli per evitarlo.
                solution_code: |-
                    {forward} 100
                    {turn} 90
            title: 'Tartaruga: gli studenti fanno uscire la tartaruga dallo schermo'
        -   example:
                error_text: Indietro non è un comando.
                error_code: indietro 100
                solution_text: 'Per far andare indietro la tartaruga, si usa il comando forward con un numero negativo. Per esempio:'
                solution_code: '{forward} -100'
            title: 'Tartaruga: gli studenti usano il comando indietro, ma questo comando non esiste.'
        level: '1'
        concepts_and_changes: |-
            Nel livello 1 gli studenti scrivono ed eseguono le loro primissime righe di codice. Non c'è
            ancora nessuna punteggiatura di cui preoccuparsi: ogni riga inizia con un comando e il resto della
            riga è testo semplice. La lezione ruota attorno a un'unica idea: un computer fa esattamente
            quello che gli dici di fare, né più né meno.

            Novità di questo livello:

            * Mostrare del testo sullo schermo con `{print}`
            * Fare una domanda con `{ask}` e usare la risposta con `{answer}`
            * Disegnare con la tartaruga usando `{forward}` e `{turn}`
