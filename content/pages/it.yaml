        level: '14'
        concepts_and_changes: |-
            Questo livello si concentra sul lavoro con le liste. Gli studenti impareranno anche a usare la ripetizione nel modo di Python.

            Novità di questo livello:
            * Lavorare con le liste
            * Combinare le liste con {for}, {if} e {random}
            * La ripetizione con {for} i {range}(1,10)
    -   sections:
        -   example:
                error_text: Gli studenti hanno difficoltà con la sintassi corretta e l'indentazione di una funzione
                error_code: |-
                    {def} saluta_il_cliente(nome
                    {print}('Ciao ', nome, '!')

                    cliente = 'Hedy
                    saluta_il_cliente()cliente
                solution_text: Osserva con attenzione la sintassi e l'indentazione.
                solution_code: |-
                    {def} saluta_il_cliente(nome):
                        {print}('Ciao ', nome, '!')

                    cliente = 'Hedy'
                    saluta_il_cliente(cliente)
            title: Gli studenti hanno difficoltà con la sintassi corretta e l'indentazione di una funzione
        -   title: Gli studenti dimenticano di usare {return} nella funzione
            example:
                error_text: Gli studenti dimenticano di usare return nella funzione
                error_code: |-
                    {def} assegna_una_stanza(numero):
                        numero_stanza = 1000 + numero

                    numero_preferito = 7
                    numero_stanza = {return} assegna_una_stanza(numero_preferito)
                    print('Il numero della tua stanza è ', numero_stanza)
                solution_text: 'Questo è il codice corretto:'
                solution_code: |-
                    def assegna_una_stanza(numero):
                        numero_stanza = 1000 + numero
                        return numero_stanza

                    numero_preferito = 7
                    numero_stanza = assegna_una_stanza(numero_preferito)
                    print('Il numero della tua stanza è ', numero_stanza)
        level: '15'
        concepts_and_changes: |-
            Questo livello si concentra sulle funzioni. In Hedy Avanzato gli studenti hanno imparato a usare una funzione di base. In questo livello non impareranno solo la sintassi di Python per usare una funzione, ma anche a usare gli argomenti nelle funzioni e {return} {value}.

            Novità di questo livello:
            * Usare una funzione nel modo di Python
            * Usare gli argomenti in una funzione
            * Usare {return} {value}
    -   sections:
        -   example:
                error_text: L'indentazione è spesso difficile per gli studenti.
                error_code: |-
                    risposta = 0
