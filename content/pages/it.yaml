                    {print} 'È stata data una risposta corretta'
            title: Gli studenti dimenticano l'indentazione nel ciclo while
        -   example:
                error_text: Gli studenti creano un ciclo {while}, ma senza un modo per fermarlo.
                error_code: |-
                    allarme = acceso
                    {while} allarme = acceso
                        {play} C
                        {play} D
                solution_text: 'Questo è il codice corretto:'
                solution_code: '# Premi il pulsante rosso per fermare il programma e interromperlo forzatamente'
            title: Gli studenti creano (per sbaglio) un ciclo infinito
        level: '16'
        concepts_and_changes: |-
            In quest'ultimo livello di Hedy gli studenti impareranno a usare un ciclo {while} e si eserciteranno ancora con la nuova sintassi.
            Dopo questo livello, gli studenti sono pronti a continuare a programmare con i 'veri' compilatori Python.

            Novità di questo livello:
            * Il ciclo {while}
    title: Errori comuni
    key: common_mistakes
    intro: Si impara dai propri errori, soprattutto quando si programma! Fare errori è inevitabile ed è un'ottima occasione per imparare, ma per gli insegnanti può essere difficile trovare la correzione giusta! Soprattutto perché i programmi diventano sempre più lunghi man mano che gli studenti avanzano nei livelli. Per questo abbiamo preparato un elenco degli errori più frequenti in ogni livello, con le relative soluzioni.
-   title: Come fare...
    key: manual
    subsections:
    -   title: Come creare una classe
        text: |-
            Crea una classe cliccando su <a href="https://hedy.org/for-teachers/class/new" target="_blank">Create a new class</a> nella pagina per gli insegnanti.
            Hai tre opzioni:
            * Creare una classe standard. Tutte le impostazioni della classe saranno quelle predefinite, cioè tutti i livelli e tutte le avventure saranno disponibili per gli studenti. Puoi sempre personalizzarle in seguito.
            * Copiare una classe esistente ('Copy existing class'). Crea una nuova classe con le impostazioni e le avventure di una classe esistente. Gli studenti non vengono copiati.
            * Classe senza avventure ('Class without adventures'). Crea una classe senza avventure incluse.
    -   title: Come creare gli account degli studenti e aggiungerli alla tua classe
        text: |-
            Vai alla <a href="https://hedy.org/for-teachers/class/all" target="_blank">pagina della classe</a> e clicca sulla classe a cui vuoi aggiungere gli studenti.
            Clicca su 'Manage Students'. Se i tuoi studenti hanno già creato un account, scegli 'Invite by username' e invita gli studenti nella tua classe.
            Se non hanno ancora un account, scegli 'Create accounts'.
            Puoi scegliere di generare automaticamente le password per i tuoi studenti, oppure puoi sceglierle tu. I tuoi studenti potranno creare la propria password dopo il primo accesso.
            Scrivi i nomi degli account che vuoi dare ai tuoi studenti, oppure incolla semplicemente un elenco da un foglio di calcolo che hai già, e clicca su 'Create accounts'.
            Troverai un elenco con le password degli studenti. Puoi stampare questo elenco e consegnare nomi utente e password ai tuoi studenti, oppure copiare l'elenco negli appunti e salvare i dati altrove.
    -   title: Come seguire i progressi dei tuoi studenti con il grafico dei risultati
        text: |-
            Il grafico dei risultati ('Performance Graph') può darti un'idea di come stanno andando gli studenti della tua classe. Lo trovi nella pagina della classe.
            Seleziona il livello su cui stanno lavorando i tuoi studenti. Ora vedrai un grafico in cui ogni studente è un punto. Sull'asse x vedi su quante avventure hanno lavorato: più il punto è a destra, più avventure hanno affrontato.
            Sull'asse y vedi il numero di errori che hanno fatto: più il punto è in alto, più programmi con un errore hanno eseguito.
            Passando con il mouse sopra un punto ottieni più informazioni: compaiono il nome utente, il numero di avventure, il numero di errori e il numero di esecuzioni riuscite in questo livello.
    -   title: Come valutare il lavoro dei tuoi studenti
        text: |-
            Vai alla pagina della classe e poi su 'Grading'. Qui trovi una tabella con tutti i programmi consegnati dai tuoi studenti.
            Usa i filtri per selezionare il livello, lo studente o l'avventura che vuoi valutare. Nota che devi premere il pulsante 'Filter' perché il filtro funzioni.
            Sei pronto a iniziare la valutazione? Clicca sull'avventura nella tabella per controllare il lavoro dello studente. Sei soddisfatto del lavoro dello studente? Clicca sul segno di spunta nella colonna 'Accepted'.
            Anche lo studente riceverà un segno di spunta nel menu delle avventure, così saprà che il suo lavoro è stato accettato.
            Vuoi guardare meglio il programma o eseguirlo? Clicca su 'View program' e si aprirà una nuova scheda con il programma.
            Se sei soddisfatto del lavoro dello studente, puoi accettare il programma. Altrimenti puoi rimandarlo allo studente premendo 'Allow Resubmission'.
            Quando hai finito di valutare un programma, puoi premere 'Next adventure' e passare al programma successivo nella tabella.
    -   title: Come dare un riscontro ai miei studenti
        text: |-
            In Hedy puoi accettare un programma consegnato da uno studente oppure rimandarglielo. Non ci sono opzioni per inviare messaggi o commenti ai tuoi studenti.
            Per questo dovrai usare il sistema di comunicazione della tua scuola, oppure, naturalmente, dare il tuo riscontro a voce!
    -   title: Come cambiare i livelli disponibili per i miei studenti
        text: Vai alla pagina della classe e clicca su 'Configure'. In cima a questa pagina vedrai degli interruttori con cui puoi aprire o chiudere i livelli per i tuoi studenti.
    -   title: Come cambiare le avventure disponibili per i miei studenti
        text: |-
            Vai alla pagina della classe e clicca su 'Configure'. Vai alla sezione 'Customize levels' e seleziona il livello che vuoi personalizzare.
            Qui vedrai l'elenco delle avventure attualmente disponibili per i tuoi studenti in questo livello. Puoi aggiungere avventure (anche le tue!), toglierle per i tuoi studenti o cambiarne l'ordine.
            Non ti piacciono le modifiche che hai fatto? Puoi sempre tornare alle impostazioni standard ripristinando le avventure predefinite.
            Vuoi vedere cosa significano le modifiche per i tuoi studenti? Usa l'anteprima come studente e vedrai come appare il livello ai tuoi studenti.
    -   title: Come aggiungere o togliere altri insegnanti dalla mia classe
        text: Vai alla pagina della classe e clicca su 'Configure'. Nella sezione 'Additional teachers' puoi aggiungere o togliere altri insegnanti della tua classe.
    -   title: Come archiviare o eliminare una classe
        text: Vai alla pagina della classe, scorri fino alla zona di pericolo ('Danger zone') e archivia o elimina la classe.
    -   title: Come preparare la lezione
        text: |-
            Vai alla pagina 'For teachers' e clicca su 'Teaching Materials'. Vai alla sezione 'Prepare a level' e seleziona il livello che insegnerai.
            Qui trovi una panoramica degli obiettivi di apprendimento di questo livello, l'accesso alle slide e ai quaderni di esercizi, e un elenco degli errori comuni di quel livello.
    -   title: Come usare le slide
        text: Vai alla pagina 'For teachers' e clicca su 'Teaching Materials'. Qui trovi le slide. Per ogni livello di Hedy abbiamo creato delle slide per aiutarti a insegnare. Le slide contengono le spiegazioni di ogni livello ed esempi di codice Hedy che puoi eseguire direttamente nelle slide. Le slide introduttive sono una spiegazione generale di Hedy. Basta cliccare su 'Present' e cominciare! Durante la presentazione puoi premere 'S' per aprire le note del relatore. Queste note ti guideranno durante la lezione e ti daranno consigli per l'insegnamento.
    -   title: Come creare le tue avventure
        text: Vai alla pagina 'For teachers' e clicca su 'Adventures'. Se clicchi su 'Create adventure' puoi creare una tua avventura personalizzata.
    -   title: Come attivare le tue avventure nella tua classe
        text: Dopo aver creato un'avventura, devi attivarla perché i tuoi studenti possano usarla. Vai su For teachers > pagina della classe > Configure > Customize levels per aggiungere l'avventura a un livello per i tuoi studenti.
    -   title: Come condividere la tua avventura con altri insegnanti
        text: Vai all'avventura che vuoi condividere, apri le impostazioni e attiva 'Make public', così gli altri insegnanti potranno usare la tua avventura.
    -   title: Come usare un'avventura creata da un altro insegnante
        text: |-
            Vai alla pagina 'For teachers', clicca su 'Adventures' e poi su 'Browse public adventures'. Qui trovi tutte le avventure pubbliche. Vuoi usare una di queste avventure con i tuoi studenti?
            Clicca su 'Clone' e una copia dell'avventura verrà aggiunta alle tue avventure. Puoi usare questa copia come qualsiasi avventura che hai creato tu.
    -   title: Come donare a Hedy
        text: Il tuo aiuto ci serve per far funzionare Hedy. Usiamo il denaro per mantenere attivo il server e per gestire e migliorare il sito di Hedy. Ogni donazione a Hedy è benvenuta! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Clicca qui per donare in euro </a> oppure <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">clicca qui per donare in dollari statunitensi</a>. Grazie!
    -   title: Come segnalare un bug o dare un suggerimento al team di Hedy
        text: Siamo sempre felici di ricevere suggerimenti o segnalazioni di bug. Contattaci all'indirizzo [hello@hedy.org](mailto:hello@hedy.org) oppure unisciti al nostro <a href="https://discord.gg/8yY7dEme9r" target="_blank">server Discord</a>.
    -   title: Come aiutare a tradurre Hedy
        text: Un ottimo modo per aiutare Hedy è <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">tradurre le parole chiave, i messaggi di errore, le avventure e gli altri contenuti</a>.
    -   title: Come restare aggiornati su Hedy
        text: Puoi seguire le novità di Hedy <a href="https://hedy.org/subscribe" target="_blank">iscrivendoti alla nostra newsletter</a> oppure unendoti al nostro <a href="https://discord.gg/8yY7dEme9r" target="_blank">server Discord</a>.
    -   title: Come entrare in contatto con altri insegnanti di Hedy
        text: Sul nostro <a href="https://discord.gg/8yY7dEme9r" target="_blank">server Discord</a> ci sono molti insegnanti che lavorano con Hedy, pronti a condividere consigli e trucchi per insegnare e a rispondere alle tue domande.
