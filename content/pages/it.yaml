                    {print}('Adoro il gelato al ' gelato[{random}])
            title: Gli studenti dimenticano le virgolette perché si concentrano sulle parentesi
        -   title: Gli studenti usano ancora il vecchio comando at random
            example:
                error_text: '{random} è cambiato in questo livello'
                error_code: |-
                    gelato = [fragola, cioccolato]
