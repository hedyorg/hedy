                error_code: "{if} nome {is} Jesse, David, Souf {print} 'Sei divertente' {else} {print} 'Non sei divertente'"
                solution_text: |-
                    Per questo potresti usare il comando `{in}`. Anche se viene spiegato in un livello successivo, funziona già nel livello 5.
                    Un'altra soluzione è usare più comandi `{if}` e nessun comando `{else}`. Lo svantaggio è che così il programma non dirà agli altri compagni che non sono divertenti.
                solution_code: |-
                    amici {is} Jesse, David, Souf
                    nome {is} {ask} 'Chi sei?'
                    {if} nome {in} amici {print} 'Sei divertente'
                    {else} {print} 'Non sei divertente'

