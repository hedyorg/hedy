    title: Erros frequentes
    key: common_mistakes
    intro: A gente aprende com os erros, especialmente na programação! Cometer erros é inevitável e uma ótima oportunidade de aprendizado, mas para os professores, pode ser um desafio encontrar a correção certa para um erro! Especialmente à medida que os programas ficam cada vez mais longos conforme os alunos progridem nos níveis. É por isso que criamos uma lista com erros frequentes em cada nível e as suas soluções.
