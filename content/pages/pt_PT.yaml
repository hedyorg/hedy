start-sections:
-   title: Começar a utilizar a Hedy
    text: 'Bem-vindo à Hedy, teremos todo o gosto em ajudá-lo a começar a utilizar a Hedy.


        O nosso [Manual do Professor](https://www.hedy.org/for-teachers/manual) tem uma visão geral de todas as funcionalidades em pormenor, mas esta página tem uma breve visão geral para que saiba o que é o quê antes de começar.


        Alguns destaques que são importantes conhecer:

        * A Hedy é uma ferramenta concebida para ajudar a gerir uma sala de aula com crianças a programar! Pode criar as suas próprias turmas, planos de aula e acompanhar o desempenho das crianças.

        * Não precisa de saber muito de programação para começar, o Hedy trabalha passo a passo, também para si!

        * Pode utilizar a Hedy na sua língua materna porque foi traduzida para muitas outras línguas!

        * Todas as crianças podem programar!! A Hedy é especialmente útil para as crianças que têm problemas de visão, porque pode ler o material em voz alta sem a necessidade de um rato.

        * Estamos aqui para ajudar, pode encontrar-nos, por exemplo, no [Discord](https://discord.gg/8yY7dEme9r) ou pode [enviar-nos um e-mail](hello@hedy.org).'
-   title: Professores sobre a Hedy
    text: "Vários professores de todo o mundo expressaram a sua paixão pela Hedy, como alguns partilharam connosco:\n\n*Incrívelmente inspirador! É uma óptima maneira de tornar a programação muito mais acessível para si, mas também para os alunos. É muito divertido brincar com ela e tem muito potencial para ser utilizada com os alunos. Penso que é uma ferramenta muito boa! Penso que esta é uma forma valiosa para as crianças começarem a aprender programação. Python e a programação sempre foram muito interessantes, porque a barreira à aprendizagem é muito elevada. Agora tudo está um pouco mais baixo e foi-me explicado que pode ser muito fácil. Gostei de ver como a Hedy tenta tornar a programação tão acessível quanto possível para os utilizadores!\nPaíses Baixos: Professores de matemática em formação (ensino secundário)\n\n*Interface simples e bons exemplos.* Professor: 3º - 6º ano (ensino básico)\n\n*Programação multilingue e apenas o próprio conceito de programação gradual em si. EUA: escola secundária, 6º-8º ano\n\n*A natureza gradual da introdução à programação.* Austrália: Ensino secundário\n\n*Continua automaticamente.* Países Baixos: 2 HAVO-VWO\n\n*Tanto o fato da explicação poder ser dada em neerlandês (e o código em inglês), como o facto de se desenvolverem cada vez mais possibilidades.* Países Baixos: Grupo de turma Plus\n\n*Mas a Hedy e os seus níveis graduais... que ideia, queria agradecer-vos pessoalmente por terem criado isto. Não tenho palavras para vos agradecer. Além disso, nunca vi o nível de envolvimento e entusiasmo dos meus alunos, como tenho visto com a Hedy. Cobrimos até o nível 5 e planeamos passar mais uma semana nele em aulas e laboratórios, antes de começar Python.* Paquistão\n\n*A \"realidade\" da programação, assemelha-se ao que é na realidade.* Países Baixos: Grupo de turmas Plus 4 a 8\n\n*Atividades passo-a-passo. Atividades divertidas.* Países Baixos: 1e Todos os níveis, 2e VWO/HAVO 2e VWO +, 3e HAVO 3e VWO\n\n*Gosto muito da Hedy e está muito bem organizada, o que a torna adequada para ser utilizada na escola primária. A abordagem gradual da Hedy funciona muito bem. A breve explicação no início de cada nível e os pequenos programas de exemplo ajudam a dar às crianças uma visão rápida do que há de novo no nível escolhido. As diferentes tarefas que as crianças podem escolher também funcionam muito bem. As crianças escolhem tarefas que lhes agradam e depois trabalham com elas, ao longo dos níveis. A Hedy é muito divertida para as crianças que são boas em programação e que querem experimentar uma verdadeira linguagem de programação. É uma boa preparação para a escola secundária, logo que nela seja ministrado mais ensino das TIC.* Países Baixos: Escola Montessori de Oegstgeest\n\n*A construção é muito boa... Países Baixos: Escola secundária inferior HAVO-VWO\n\n*Consigo manter o ritmo da aula.* Países Baixos: grupo 7 e 8\n\n![Felienne a ensinar crianças](/images/teacherfeedback/Fkids1.JPG) *Felienne a ensinar crianças*\n \n\n![Crianças a aprender sobre a Hedy](/images/teacherfeedback/Fkids2.JPG) *Crianças a aprender sobre a Hedy*"
teacher-guide:
-   title: Introdução
    key: intro
    subsections:
    -   title: O que é a Hedy?
        text: |-
            A Hedy é uma linguagem de programação textual, especificamente desenvolvida para (pré-)adolescentes (dos 10 aos 15 anos de idade).
            Ao contrário das linguagens de programação para crianças, como o Scratch, a Hedy não utiliza blocos de código, mas código textual.
            Assim, com a Hedy, vais aprender a escrever código como os programadores realmente o fazem, mas em pequenos passos com exercícios lúdicos.
            Desta forma, a Hedy pode funcionar como um trampolim para linguagens de programação reais, como Python, de uma forma acessível e acima de tudo divertida!
            Aqui, podes ver um <a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">vídeo</a> sobre o desenvolvimento da Hedy como uma linguagem de programação.
    -   title: Público-alvo
        text: |-
            A Hedy foi desenvolvida a pensar nos estudantes do ensino básico e secundário (entre os 10 e os 15 anos de idade).
            É importante que os estudantes sejam capazes de ler bem. Não recomendamos que se comece com a Hedy antes dos estudantes terem atingido pelo menos um nível de leitura do 3º ano.
            Os estudantes (e professores!) não precisam de qualquer experiência em programação antes de começarem com a Hedy.
    -   title: Como funciona a Hedy?
        text: "A Hedy é dividida em níveis, nos quais são ensinados novos comandos. Cada nível contém uma variedade de aventuras para praticar os novos comandos aprendidos.\nComo professor, pode decidir que aventuras estão disponíveis para os seus alunos. Irão criar um restaurante, uma calculadora ou uma casa assombrada neste nível? Dentro de cada nível, as aventuras estão organizadas da mais fácil para a mais difícil.\nAssim, os seus alunos continuarão a ser desafiados. As aventuras podem ser completadas, individualmente, pelos alunos ou pode usá-las numa instrução clássica.\n\nAs aventuras também incluem um código exemplo, para garantir que os professores menos digitalmente informados, possam utilizar a Hedy também!\nClaro que a Hedy também serve os professores que adoram criar os seus próprios planos de aula e aventuras.\n\nApós programar todas as aventuras de um determinado nível, os seus alunos podem testar os seus conhecimento num breve questionário.\nPode acompanhar o trabalho dos seus alunos e a sua evolução na página da turma."
    -   title: Dispositivos
        text: |-
            A Hedy é baseada na web, o que significa que funciona em qualquer dispositivo com um navegador (Google Chrome, Firefox, Edge, entre outros), portanto, portáteis, Chromebooks, tablets e até telemóveis são apropriados para usar a Hedy.
            Não existe necessidade de descarregar nada antes de começar a trabalhar com a Hedy, basta aceder à página de internet e está pronto(a)!
    -   title: A Comunidade Hedy
        text: |-
            Todos os professores Hedy, programadores e outros fãs são convidados a juntar-se ao nosso <a href="https://discord.gg/8yY7dEme9r" target="_blank">servidor Discord </a>. Este é o espaço ideal para conversar sobre a Hedy: nós temos canais onde pode apresentar os seus projetos e aulas incríveis, canais para reportar problemas e canais onde pode conversar com outros professores e com a equipa Hedy.
            <a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">Aqui</a> encontra um vídeo que mostra como aderir à Comunidade Discord.
    -   title: Hedy e o RGPD
        text: |-
            Organizações na UE devem cumprir com o RGPD (Regulamento Geral sobre a Proteção de Dados) quando processam dados pessoais.
            Como este é um tema complexo para muitas escolas, pode usar todas as funcionalidades de programação da Hedy sem partilhar dados pessoais.
            A forma mais simples para tal, é usar a Hedy sem criar contas para o professor e os alunos. Sem contas, todas as funcionalidades estão disponíveis, com a excepção da personalização de níveis, guardar os programas dos alunos e observar o seu progresso. Pode ser limitante, mas existem escolas que usam a Hedy desta forma.

            Outra maneira passa pelo professor criar uma conta com um email sem dados pessoais, por exemplo, "docente25@email.com". Para além de um endereço de email, que apenas é necessário para reiniciar a sua palavra-passe, não precisa partilhar qualquer informação quando cria uma conta de professor.
            Com uma conta de professor, pode criar contas anónimas para os seus alunos, e.g. aluno-unicornio1, aluno-unicornio2, etc (Aceda a 'Preparações para ensino' para um manual detalhado). Desta forma, pode usar todas as funcionalidades da Hedy, incluindo guardar o progresso, sem partilhar os seus dados ou dos seus alunos.

            Se a explicação acima é insuficiente para o contextualizar, podemos assinar um acordo de processamento para processar os seus dados pessoais.
    -   title: Doar para o Hedy
-   levels:
    -   sections:
        -   example:
                error_text: Por exemplo, escrever uma frase sem usar imprima.
                error_code: Hedy não consegue imprimir isto
                solution_text: Ensine os seus alunos a sempre começar uma linha de código com um comando.
                solution_code: '{print} ¡Hedy consegue imprimir isto!'
            title: Os alunos esquecem de digitar os comandos
        -   example:
                error_text: Os comandos não funcionam quando escritos em maiúsculas.
                error_code: |-
                    Pergunte Por que o meu código não funciona?
                    Imprima Porque estou usando maiúsculas.
                solution_text: Tire as maiúsculas.
                solution_code: |-
                    {ask} Por que o meu código funciona agora?
                    {print} Porque tirei as maiúsculas!
            title: Os alunos usam maiúsculas ao digitar os comandos
        -   example:
                error_text: Os alunos às vezes gostam de tentar números enormes ao usar a tartaruga, o que faz ela sair do ecrã.
                solution_text: Nesse exemplo, os alunos costumam achar que o comando «gire» falhou, apesar de ter feito o que devia. O que aconteceu é que a tartaruga andou além dos limites do ecrã. Use números menores para evitar que isso ocorra.
                solution_code: |-
                    {forward} 100
                    {turn} 90
            title: 'Tartaruga: os alunos fazem a tartaruga sair do ecrã'
        -   example:
                error_text: Voltar não é um comando.
        -   example: {}
        level: '1'
    -   sections:
        -   example:
                error_text: Hedy não consegue reconhecer comandos digitados incorretamente.
                error_code: imprimma Não cometa erros de digitação
                solution_text: Ensine os seus alunos a ler as mensagens de erro. Assim eles conseguem descobrir por si mesmos o que deu errado.
                solution_code: '{print} Não cometa erros de digitação'
            title: Os alunos cometem erros de digitação nos comandos
        -   example:
                error_text: Neste nível, os alunos aprendem sobre variáveis. O comando perguntar também requer variáveis, mas os alunos esquecem-se disso.
                error_code: pergunte o que gostaria de comer
                solution_text: Neste nível, precisa dizer a Hedy onde guardar a resposta para usá-la depois. Isto chama-se uma variável.
            title: Os estudantes esquecem-se que o comando perguntar mudou
        -   example: {}
        -   example:
                error_text: No exemplo abaixo, a palavra 'nome' é usada como uma variável, mas também como parte do texto. O resultado desse código será 'Olá, o meu Hedy é Hedy'.
                error_code: |-
                    nome {is} Hedy
                    {print} Olá, chamo-me nome
                solution_text: Portanto não use uma palavra que queira usar no texto como nome de variável. No nível 4, isto será resolvido com aspas.
                solution_code: |-
                    nome {is} Hedy
                    {print} Olá, chamo-me nome
            title: Os alunos usam o nome de uma variável como uma palavra normal
        -   example:
                error_text: Um nome de variável deve ter aoenas uma palavra. Pode-se usar um traço sublinhado '_' para unir duas palavras, assim conta como se fosse uma palavra.
                error_code: porta escolhida é pergunte Qual porta escolhe
                solution_code: porta_escolhida {is} {ask} Qual porta escolhe
            title: Os estudantes usam nomes de variáveis grandes que contém duas palavras.
        -   example:
                error_text: Nesse exemplo, o aluno usou 'cavalo' e 'nome' para a mesma variável.
                error_code: |-
                    cavalo {is} {ask} Como se chama o seu cavalo
                    {print} O seu cavalo chama-se nome
                solution_text: Sempre verifique que uma variável tenha o mesmo nome em todo o código. Pequenas diferenças podem ser difíceis de perceber (como plurais, por exemplo) mas interferem com o código.
                solution_code: |-
                    nome {is} {ask} Como se chama o seu cavalo
                    {print} O seu cavalo chama-se nome
            title: Os alunos às vezes usam dois nomes diferentes para a mesma variável
        level: '2'
    -   sections:
        -   example:
                error_text: Não se pode imprimir uma lista. Só se pode imprimir um único elemento de uma lista com {at} {random} .
                error_code: |-
                    compras {is} maçãs, leite, chocolate
                    {print} compras
                solution_text: Para imprimir uma lista de todas as compras, simplesmente põe-as depois de um comando `{print}`. Ou depois usa a lista para imprimir um elemento com `{at}` `{random}`.
                solution_code: |-
                    {print} maçãs, leite, chocolate

                    #ou

                    compras {is} maçãs, leite, chocolate
                    {print} compras {at} {random}
            title: Os alunos tentam imprimir listas inteiras
        -   example:
                error_text: Provavelmente esse problema já ocorria no nível 2. Agora pode acontecer com listas também.
                error_code: |-
                    nome {is} Hedy
                    {print} Oi, chamo-me nome

                    #o

                    animal {is} rinoceronte, abelha, cisne
                    {print} O melhor animal é... animal {at} {random}
                solution_text: Não use o nome de variáveis em texto normal para imprimir. No nível 4 este problema é resolvido com aspas.
                solution_code: |-
                    nome {is} Hedy
                    {print} Olá, sou nome

                    #o

                    animais {is} rinoceronte, abelha, cisne
                    {print} O melhor animal é... animais {at} {random}
            title: Os alunos usam um nome de variável ou lista como texto normal
        -   example:
                error_text: Como no exemplo
                error_code: |-
                    aves {is} pardal, gaivota, sabiá
                    {print} aves aleatório
                solution_text: Este problema resolve-se usando a palavra 'em'.
                solution_code: |-
                    aves {is} pardal, gaivota, sabiá
                    {print} aves {at} {random}
            title: Os alunos esquecem-se do `{at}`em `{at}` `{random}`
