title: Documentation de Hedy
home-sections:
-   title: La programmation textuelle facilement !
    text: |-
        Beaucoup d'écoles et d'enseignant·e·s dans le monde veulent enseigner à leurs élèves la programmation. Pour commencer, cela se fait souvent avec des outils ludiques, allant de Bee-Bot robot à
        Scratch Junior ou Scratch. Après avoir utilisé de tels outils, les enfants désirent souvent passer à quelque chose de plus puissant, un langage de programmation textuelle, comme Python.

        Par contre, Python est difficile, car il n'est disponible qu'en anglais, et demande aux enfants d'apprendre simultanément des concepts de programmation et une syntaxe complexes.
        Hedy est un moyen facile pour démarrer avec les langages de programmation textuelle ! Hedy est gratuit, open source, et différent d'autres langages de programmation textuelle, de trois façons.

        1. Hedy est multilingue, vous pouvez utiliser Hedy dans votre propre langue
        2. Hedy est progressif, de sorte que vous puissiez apprendre un seul concept et sa syntaxe à la fois
        3. Hedy est fait pour la salle de classe, permettant aux enseignants et enseignantes de personnaliser totalement l'expérience de leurs élèves
-   title: Programmation multilingue
    text: Alors que la plupart des langages de programmation textuelle ont des mots clés en anglais, comme par exemple « for » ou « repeat », Hedy peut être utilisé dans n'importe quelle langue ! Nous supportons actuellement 47 langues différentes, comme le néerlandais, l'espagnol, l'arabe, le turc, le chinois et l'hindi. Si votre langue n'est pas disponible, vous pouvez toujours commencer une nouvelle traduction.
-   title: Apprendre pas à pas
    text: Apprendre un langage de programmation peut être décourageant, car les apprenants doivent apprendre des concepts (par exemple, si-sinon ou les boucles) et la syntaxe (comme les guillemets ou les accolades) en même temps. Dans Hedy, les concepts sont introduits d'abord avec peu de syntaxe, puis affinés. Une façon scientifiquement prouvée d'apprendre !
-   title: Fait pour la salle de classe
    text: |-
        Hedy est adapté pour les enfants âgés de 10 ans et plus, conçu pour être utilisé en salle de classe.
        Les enseignants peuvent utiliser nos plans de cours intégrés gratuitement, mais peuvent aussi concevoir leur propre cours et les sauvegarder dans leur espace utilisateur de Hedy.
-   title: Programmation en contexte
    text: Hedy montre la programmation de la façon la plus large possible, et peut être utilisé de nombreuses façons amusantes. Hedy permet la création d'histoire numérique et interactive, de dessins colorés qui peuvent être affichés à l'écran, mais aussi dessinés avec une table traçante ou brodé sur un T-shirt, et peut être utilisé pour créer des jeux ou applications avec des boutons et des actions au clavier.
-   title: Est-ce que Hedy est gratuit ?
    text: |-
        Oui ! Hedy est « Open source », ce qui signifie que tout le monde peut nous aider à améliorer Hedy.
        Vous pouvez trouver notre code sur <a href="https://github.com/hedyorg/hedy" target="_blank">Github</a>.
        Si vous aimez Hedy et que vous voulez y contribuer, nous acceptons (et nous vous sommes vraiment reconnaissants pour ça) <a href="https://github.com/sponsors/hedyorg" target="_blank">les dons</a> !
        L'argent sert à payer le serveur, à maintenir et à améliorer le site web de Hedy.
-   title: Est-ce qu'il faut installer quelque chose ?
    text: Non, Hedy fonctionne dans le navigateur, le programme que vous utilisez pour voir cette page. Probablement Firefox, Chrome ou Edge. Hedy fonctionne aussi sur téléphones et tablettes.
-   title: Ai-je besoin d'avoir une expérience en programmation pour enseigner avec Hedy ?
    text: |-
        Non, ce n'est pas nécessaire. Tous les concepts sont expliqués dans les diapositives et dans l'interface pour les élèves.
        Si vous créez un compte enseignant gratuit, vous aurez aussi accès aux manuels des enseignants avec des informations sur comment enseigner
        et les erreurs fréquemment rencontrées par les élèves.
join-sections:
-   text: '# Il existe trois manières de soutenir Hedy !'
    title: Soutenir Hedy
-   title: Améliorer le langage
    text: |-
        La nature incrémentale et multilangage de Hedy produit beaucoup de défis techniques intéressants.
        Vous pouvez les trouver sur <a href="https://github.com/hedyorg/hedy/issues?q=is%3Aopen+is%3Aissue+label%3Alanguage" target="_blank">Github</a>.
-   title: Traduire Hedy
    text: |-
        Vous n'êtes pas développeur ? Aucun problème ! Un autre moyen de supporter Hedy est de <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">traduire les mot-clé, messages d'erreur, les aventures et autre contenu</a>.
        Voici le statut actuel, aidez-nous à compléter une langue, ou à en ajouter une nouvelle !
        <a href="https://hosted.weblate.org/engage/hedy/">
        <img src="https://hosted.weblate.org/widgets/hedy/-/multi-auto.svg" alt="Translation status" /></a>
-   title: Aider les professeurs à se lancer
    text: |-
        Hedy a été pensé pour apporter un support aux enseignants et enseignantes qui veulent donner des leçons de programmation durant leurs cours. Nous avons des fonctionnalités dédiées aux enseignants et enseignantes, comme la création de classes, que vous pouvez personnaliser et utiliser pour observer la progression de vos élèves.
        Si vous aimez Hedy, vous pouvez en parler aux écoles que vous connaissez pour aider les enseignants à se lancer ! Nous pouvons vous aider à trouver des écoles ou des enseignants via <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord</a>.
start-sections:
-   title: Commencez avec Hedy
    text: "Bienvenue sur Hedy, nous nous réjouissons de pouvoir vous aider à démarrer avec Hedy.\n\nNotre [Manuel de l'enseignant ou de l'enseignante](https://www.hedy.org/for-teachers/manual) contient un descriptif détaillé de toutes les fonctionnalités. Cette page présente un bref aperçu pour que vous sachiez de quoi il s'agit avant de vous lancer.\n\nQuelques points importants à connaître :\n* Hedy est un outil conçu pour aider à gérer un cours de programmation pour enfants § ! Vous pouvez créer vos propres classes, leçons et garder un œil sur ce que font les enfants.\n* Vous n'avez pas besoin d'être expert ou experte en programmation, Hedy vous accompagne pas à pas !\n* Vous pouvez utiliser Hedy dans votre langue maternelle car le logiciel a été traduit dans beaucoup de langues !\n* Chaque enfant peut programmer !! Hedy est particulièrement adapté pour les enfants qui ont des problèmes de vue car Hedy peut vous lire à haute voix son contenu sans avoir besoin de la souris.\n* Nous sommes disponibles pour vous aider, par exemple sur [Discord](https://discord.gg/8yY7dEme9r) or you can [email-us](hello@hedy.org)."
-   title: "Les enseignants et Hedy"
teacher-guide:
-   title: Le contexte
    key: intro
    subsections:
    -   title: Qu'est-ce que Hedy ?
        text: |-
            Hedy est un langage de programmation textuel, spécifiquement développé pour les (pré-)ados (10 à 15 ans).
            Contrairement aux langages de programmation pour les enfants, comme Scratch, Hedy n'utilise pas de blocs de code.
            Ainsi, avec Hedy vous apprendrez à taper du code comme les vrais programmeurs, mais par petites étapes avec des exercices ludiques.
            De cette façon, Hedy peut fonctionner comme un tremplin vers de vrais langages de programmation comme Python d'une manière accessible et surtout amusante !
            Si vous voulez en savoir plus, vous pouvez regarder cette <a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">vidéo en anglais</a> sur le développement d'Hedy et tant que langage de programmation.
    -   title: Public visé
        text: |-
            Hedy est développé avec en tête des élèves du collège et du lycée (âgés de 10 à 15 ans), mais peut être utilisé par toutes les personnes qui désirent apprendre la programmation.
            Il est important que les élèves soient capables de bien lire. Nous recommandons de ne pas commencer avec Hedy avant que les élèves aient atteint au moins un niveau de lecture de la 6ème.
            Les élèves (et les professeurs !) n'ont pas besoin d'avoir une expérience en programmation avant de commencer avec Hedy.
    -   title: Comment fonctionne Hedy ?
        text: |-
            Hedy est divisé en plusieurs niveaux, chacun permettant d'enseigner de nouvelles commandes et de nouveaux concepts. Chaque niveau comprend divers aventures pour pratiquer les commandes découvertes.
            Hedy est divisé en trois sections : Basic, Avancée et Expert. Avec Hedy Basic (niveau 1-8), vous pouvez explorer des concepts simple et amusant, comme l'affichage, demander une entrée, utiliser des variables simples et faire des répétitions. Avec Hedy Avancé (niveau 9-12), vos élèves s'avanceront un peu plus loin et apprendront à mettre en place des idées plus astucieuses comme les boucles, la hiérarchisation et les fonctions. Hedy Expert (niveau 13-16) est fait pour permettre la transition en douceur vers la syntaxe Python complète.
            Donc, quelque soit ce que vous vouliez accomplir pour vos élèves, Hedy est adapté pour le faire. Que ce soit leur faire découvrir la joie de la programmation, leur enseigner les concepts de base ou les préparer pour la syntaxe Python de la vraie vie.

            En tant que professeur, vous ne décidez pas seulement des niveaux disponibles pour vos élèves, mais vous pouvez aussi décider quelles aventures sont disponibles par niveau. Feront-ils un restaurant, une calculatrice ou une maison hantée ? À chaque niveau, les aventures sont classées par ordre de difficulté croissante, de la plus simple à la plus difficile, mais vous pouvez les réorganiser de la manière qui conviendra le mieux à vos élèves.
            Les aventures peuvent être effectuées par les élèves individuellement, mais nous recommandons de les utiliser en classe.

            Les aventures incluent aussi du code exemple et des solutions, pour que les professeurs les moins au fait de la technologie puissent aussi utiliser Hedy !
            Bien sûr, Hedy est aussi pour les professeurs créatifs qui adorent créer leurs propres aventures et plan d'études !

            Vous pouvez suivre le progrès et le travail de vos étudiants depuis la page Classe.
    -   title: Dispositifs
        text: |-
            Hedy est une application web, cela signifie qu'il peut fonctionner sur n'importe quel ordinateur avec un navigateur internet (Firefox, Google Chrome, Edge, etc) donc Hedy fonctionne avec les ordinateurs portables, les Chromebooks, les tablettes et même les smartphones !
            Il n'y a pas besoin de télécharger quoi que ce soit pour faire marcher Hedy, il faut juste aller sur le site web et c'est parti !
            Il y a aussi une <a href="https://github.com/hedyorg/hedy/wiki/Offline-Hedy " target="_blank">version hors-ligne</a> de Hedy disponible.
    -   title: La communauté Hedy
        text: |-
            Tous les enseignants et enseignantes Hedy, programmeurs, programmeuses et autres fans sont les bienvenus sur notre <a href="https://discord.gg/8yY7dEme9r" target="_blank">serveur Discord</a>. C'est l'endroit idéal pour tchatter à propos de Hedy : nous avons des canaux où vous pouvez montrer vos super projets cools et vos leçons, des canaux pour remonter les bugs et des canaux pour tchatter avec d'autres enseignants et l'équipe Hedy.
            <a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">Ici</a> vous trouverez une vidéo en anglais expliquant comment rejoindre notre communauté sur Discord.
    -   title: Hedy et la RGPD
-   title: Erreurs fréquemment commises
    key: erreurs_courantes
    intro: |-
        Vous pouvez apprendre de vos erreurs, surtout en codage ! Il est inévitable de faire des erreurs, et c'est une excellente occasion d'apprendre, mais pour les enseignants, il peut être difficile de trouver la bonne solution à une erreur ! D'autant plus que les codes deviennent de plus en plus longs au fil des niveaux. C'est pourquoi nous avons dressé une liste des erreurs fréquemment commises dans chaque niveau, ainsi que leurs solutions.
    levels:
    -   level: "1"
        sections:
        -   title: Les élèves oublient de taper les commandes
            example:
                error_text: Par exemple, ils tapent une phrase sans `{print}`.
                error_code: Hedy ne peut pas afficher ça
                solution_text: Apprenez à vos élèves à toujours commencer une ligne par une commande.
                solution_code: "{print} Hedy peut imprimer ceci !"
        -   title: Les élèves utilisent des majuscules lorsqu'ils tapent des commandes
            example:
                error_text: Les commandes ne fonctionneront pas si elles sont en majuscules.
                error_code: |-
                    Demander Pourquoi mon code ne marche pas ?
                    Imprime Parce que j'utilise des commandes avec des majuscules.
                solution_text: Enlevez les majuscules.
                solution_code: |-
                    {ask} Pourquoi mon code marche-t-il ?
                    {print} Parce que j'ai enlevé les majuscules !
        -   title: Les élèves utilisent `{answer}` sans `{ask}`
            example:
                error_text: "`{answer}` est fait pour répéter une réponse après une commande `{ask}`. Sans `{ask}`, `{answer}` ne fera rien."
                error_code: "{print} Ton nom est {answer}"
                solution_text: Ajoute une commande `{ask}` pour que cela fonctionne.
                solution_code: |-
                    {ask} Quel est votre nom ?
                    {print} Ton nom est {answer}
        -   title: "Tortue : Les élèves laissent la tortue sortir de l'écran"
            example:
                error_text: Souvent, les élèves aiment essayer les grands nombres en utilisant la tortue, ce qui fait sortir la flèche de l'écran.
                error_code: |-
                    {forward} 300
                    {turn} 90
                solution_text: Dans l'exemple, les élèves ont tendance à penser que la commande "tourne" ne fonctionne pas. Bien qu'elle fonctionne, vous ne pouvez pas voir son effet en dehors de l'écran. Utilisez des nombres plus petits pour éviter cela.
                solution_code: |-
                    {forward} 100
                    {turn} 90
        -   title: "Tortue : les élèves utilisent la commande \"recule\", mais elle n'existe pas."
            example:
                error_text: Recule n'est pas une commande.
                error_code: recule 100
                solution_text: "Pour faire reculer la tortue, il faut utiliser la commande avance et un nombre négatif. Par exemple :"
                solution_code: avance -100
        concepts_and_changes: |-
            Le niveau 1, c'est là où les élèves écrivent et exécutent leurs toutes premières lignes de code. Inutile de s'inquiéter
            de la ponctuation pour l'instant : toutes les lignes commencent par une commande et le reste de la ligne est
            du texte libre. La leçon porte en réalité sur une seule idée, qu'un ordinateur fait exactement ce qu'on lui dit de faire,
            ni plus ni moins.

            Nouveautés de ce niveau :

            * Afficher du texte à l'écran avec `{print}`
            * Poser une question avec `{ask}` et utiliser la réponse avec `{answer}`
            * Dessiner avec la tortue en utilisant `{forward}` et `{turn}`
            * Jouer une note de musique avec `{play}`
    -   level: "2"
        sections:
        -   title: Les élèves font des fautes de frappe dans leurs commandes
            example:
                error_text: Hedy ne peut pas reconnaître une commande contenant une faute de frappe.
                error_code: afffiche Ne faites pas de fautes de frappe
                solution_text: Apprenez à vos élèves à lire les messages d'erreur. Ils pourront ainsi découvrir eux-mêmes ce qui n'a pas fonctionné.
                solution_code: affiche Ne fais pas de fautes de frappe
        -   title: Les élèves oublient que la commande "demande" a changé
            example:
                error_text: Dans ce niveau, les élèves apprennent ce que sont les variables. La commande demande nécessite également une variable, mais les élèves l'oublient.
                error_code: demande Qu'aimeriez-vous manger 
                solution_text: Dans ce niveau, tu dois dire à Hedy où enregistrer ta réponse pour qu'elle puisse être utilisée plus tard. C'est ce qu'on appelle une variable.
                solution_code: demande Qu'aimeriez-vous manger
        -   title: Les élèves essaient d'utiliser `{answer}` pour plusieurs questions
            example:
                error_text: La variable `{answer}` fonctionne toujours, mais elle stocke seulement une réponse à la fois. Les élèves vont parfois essayer de stocker plusieurs réponses dans une seule variable.
                error_code: |-
                    réponse {is} {ask} Comment t'appelles-tu ?
                    réponse {is} {ask} Quel âge as-tu ?
                    {print} Hi {réponse}.
                    {print} Tu as {réponse} ans.
                solution_text: Apprenez à vos élèves l'importance de nommer les variables avec précision.
                solution_code: |-
                    nom {is} {ask} Comment t'appelles-tu ?
                    âge {is} {ask} Quel âge as-tu ?
                    {print} Bonjour {name}.
                    {print} Tu as {âge}ans.
        -   title: Les élèves utilisent un nom de variable ou un mot normal
            example:
                error_text: Dans l'exemple ci-dessous, le mot "nom" est utilisé comme variable, mais aussi comme texte normal. Le résultat de ce code sera "Bonjour mon Hedy est Hedy".
                error_code: |-
                    nom est Hedy
                    affiche Bonjour mon nom est nom
                solution_text: N'utilise donc pas un mot que vous voulez utiliser dans le texte comme nom de variable. Au niveau 4, ce problème est résolu à l'aide de guillemets.
                solution_code: |-
                    nom est Hedy
                    affiche Bonjour, je suis nom
        -   title: Les élèves utilisent des noms de variables longs contenant deux mots.
            example:
                error_text: Une variable doit être nommée avec un seul mot. Vous pouvez utiliser un tiret bas pour relier deux mots. Cela compte pour un seul mot.
                error_code: porte choisie est demande Quelle porte choisissez-vous
                solution_text: Ajoute un tiret bas.
                solution_code: porte_choisie est demande Quelle porte choisissez-vous
        -   title: Les élèves peuvent utiliser deux noms différents pour la même variable
            example:
                error_text: Dans cet exemple, l'élève a utilisé "cheval" et "nom" pour les mêmes variables.
                error_code: |-
                    cheval est demande Quel est le nom de votre cheval
                    affiche Votre cheval est appelé nom
                solution_text: Vérifiez toujours si la variable porte le même nom dans tout le code. De légères différences peuvent être difficiles à repérer (par exemple les pluriels), mais elles interfèrent avec le code.
                solution_code: |-
                    nom est demande Quel est le nom de votre cheval
                    affiche Votre cheval s'appelle nom
    -   level: "3"
        sections:
        -   title: Les élèves essaient d'imprimer des listes en entier
            example:
                error_text: Une liste ne peut pas être imprimée. Vous ne pouvez imprimer qu'un seul élément de la liste, au hasard.
                error_code: |-
                    courses est pommes, lait, chocolat
                    affiche courses
                solution_text: Pour afficher une liste de toutes les courses, il suffit de les placer après une commande affiche. Sinon, vous pouvez utiliser la liste pour imprimer un article au hasard.
                solution_code: |-
                    {print} pommes, lait, chocolat

                    ou

                    courses {is} pommes, lait, chocolat
                    {affiche} épicerie {at} {random}
        -   title: Le élèves utilisent le nom de la variable ou d'une liste comme du texte normal
            example:
                error_text: Ce problème s'est probablement produit au niveau 2 également. Désormais, il peut aussi se produire avec les listes.
                error_code: |-
                    nom {is} Hedy
                    {print} Bonjour, mon nom est nom

                    ou

                    animal {is} rhinocéros, abeille, cygne
                    {affiche} Le meilleur animal est... animal {at} {random}
                solution_text: N'utilisez pas les noms de variables ou de listes dans du texte normal à imprimer. Au niveau 4, ce problème est résolu avec des guillemets.
                solution_code: |-
                    nom est Hedy
                    affiche Bonjour je suis nom

                    ou

                    animaux est rhinocéros, abeille, cygne
                    affiche Le meilleur animal est... animal au hasard
        -   title: Les élèves oublient `{at}` dans `{at}` `{random}`
            example:
                error_text: Comme dans l'exemple
                error_code: |-
                    oiseaux est moineau, mouette, corneille
                    affiche oiseaux hasard
                solution_text: Ce problème est résolu en ajoutant le mot au.
                solution_code: |-
                    oiseaux {is} moineau, mouette, corneille
                    {print} oiseaux {at} {random}
        -   title: Les élèves oublient d'utiliser la commande `{print}` quand ils utilisent aussi la commande `{at}` `{random}`
            example:
                error_text: Ou alors ils vont parfois mettre `{at}` `{random}` au début d'une ligne.
                error_code: |-
                    fruit {is} pomme, cerise, banane
                    fruit {at} {random}
                solution_text: Insistez auprès de vos élèves sur le fait que vous avez toujours besoin de la commande `{print}` pour afficher un texte.
                solution_code: |-
                    fruit {is} pomme, cerise, banane
                    {print} fruit {at} {random}
        -   title: Les élèves oublient d'utiliser des virgules dans leurs listes
            example:
                error_text: Dans une liste, les éléments sont séparés par une virgule.
                error_code: |-
                    pizzas {is} champignons thon quatre saisons
                    {print} pizzas {at} {random}
                solution_text: Chaque élément de votre liste doit être suivi d'une virgule
                solution_code: |-
                    pizzas {is} champignons, thon, quatre saisons
                    {print} pizzas {at} {random}
        -   title: Les élèves essaient d'utiliser `{at}` `{random}` avec autre chose qu'une liste
            example:
                error_text: Par exemple
                error_code: |-
                    clubs {is} Machester United
                    {print} clubs {at} {random}
                solution_text: Hedy ne peut pas afficher quelque chose au hasard, parce qu'il n'y a pas de liste à partir de laquelle choisir.
                solution_code: |-
                    clubs {is} Manchester United, FC Bayern Munich, FC Barcelona
                    {print} clubs {at} {random}
        -   title: Les élèves essaient d'utiliser les fonctions ajouter/supprimer sans liste
            example:
                error_text: Dans l'exemple ci-dessous, "noms" n'est pas une liste, mais une variable. Vous ne pouvez rien y ajouter.
                error_code: |-
                    noms {is} Jacques
                    ton_nom {is} {ask} Qui es-tu ?
                    {add} ton_nom {to_list} noms
                    {print} noms {at} {random}
                solution_text: Il faut d'abord qu'il y ait une liste, donc vous devez ajouter un deuxième nom pour transformer les noms en liste, par exemple Amy. Si vous ne voulez pas d'Amy dans votre liste, vous pouvez utiliser remove pour la supprimer ensuite.
                solution_code: |-
                    noms {is} Jacques, Amy
                    ton_nom {is} {ask} Qui es-tu ?
                    {add} ton_nom {to_list} noms
                    {print} noms {at} {random}
        -   title: Les élèves oublient d'utiliser `{to}`/`{from}` dans `{add}`/`{remove}`
            example:
                error_text: Sans `{to}`/`{from}`, la commande `{add}`/`{remove}` ne marchera pas.
                error_code: |-
                    aventures {is} histoire, perroquet, dé
                    choix {is} Quelle aventure tu préfères?
                    {add} choix
                    {remove} dé
                    {print} J'aime aventures {at} {random}
                solution_text: Hedy doit savoir à quelle liste l'élément doit être ajouté/supprimé.
                solution_code: |-
                    aventures {is} histoire, perroquet, dé
                    choix {is} Quelle aventure préférez-vous ?
                    {add} choix {to} aventures
                    {remove} dé {from} aventures
                    {print} J'aime aventures {at} {random}
    -   level: "4"
        sections:
        -   title: Les élèves oublient d'utiliser les guillemets des deux côtés du texte
            example:
                error_text: Dans ce niveau, il affiche et demande ont besoin de guillemets. Un avant le texte et un après.
                error_code: |-
                    {print} Hello
                    humeur {is} {ask} 'Comment vas-tu ?'
                solution_text: Ajoute correctement les guillemets.
                solution_code: |-
                    {print} 'Hello'
                    humeur {is} {ask} 'Comment vas-tu?'
        -   title: Les élèves utilisent les mauvais guillemets
            example:
                error_text: Il est important de commencer votre cours en vérifiant si les étudiants savent comment taper un guillemet correctement. Sinon, ils pourraient utiliser les "doubles guillemets" ou les guillemets inversés ` .
                error_code: |-
                    {print} `Bienvenue au restaurant`
                    nourriture {is} {ask} ,Que voulez-vous commander?,
                solution_text: "Ce sont les guillemets corrects :"
                solution_code: |-
                    {print} Bienvenue au restaurant
                    nourriture {is} {ask} 'Que voulez-vous commander ?'
        -   title: Les élèves utilisent une apostrophe dans leur texte tout en utilisant les simples quotes comme délimiteur
            example:
                error_text: Les apostrophes peuvent être utilisées seulement avec les doubles guillemets. Elles sont souvent utilisées en français pour signifier l'élision de voyelles comme dans « l'entrée ».
                error_code: "{print} 'Il y a une erreur'"
                solution_text: Utilise les guillemets doubles pour résoudre le problème.
                solution_code: |-
                    {print} "Tu n'as plus d'erreur maintenant !"
