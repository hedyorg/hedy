                solution_text: |-
                    Na to sa dá použiť príkaz `{in}`. Vysvetľuje sa na vyššej úrovni, ale na úrovni 5 už funguje.
                    Ďalšie riešenie je viac príkazov `{if}` a žiadny `{else}`. Nevýhoda je, že ostatným spolužiakom nepovie, že vtipní nie sú.
                solution_code: |-
                    friends {is} Jesse, David, Souf
