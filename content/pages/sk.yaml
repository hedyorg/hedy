start-sections:
-   title: Začíname s Hedy
    text: |-
        Vitaj v Hedy, radi ti pomôžeme začať.

        [Príručka pre učiteľov](https://www.hedy.org/for-teachers/manual) má podrobný prehľad všetkých funkcií. Táto stránka je krátky prehľad, aby bolo pred ponorením jasné, čo je čo.

        Pár dôležitých vecí:
        * Hedy je nástroj na vedenie triedy detí, ktoré programujú. Môžeš vytvárať vlastné triedy, prípravy hodín a sledovať, ako sa deťom darí.
        * Na začiatku nemusíš vedieť veľa o programovaní. Hedy ide krok za krokom, aj pre teba.
        * Hedy môžeš používať vo svojom jazyku, lebo je preložené do mnohých jazykov.
        * Programovať vie každé dieťa. Hedy zvlášť pomáha deťom s problémami so zrakom, lebo text vie čítať nahlas a netreba myš.
        * Sme tu, aby sme pomohli. Nájdeš nás napríklad na [Discorde](https://discord.gg/8yY7dEme9r) alebo nám môžeš [napísať](hello@hedy.org).
-   title: Učitelia o Hedy
    text: |-
        Učitelia z celého sveta hovoria, že ich Hedy baví. Niektorí nám napísali toto:

        *Neuveriteľne inšpirujúce! Veľmi dobrý spôsob, ako spraviť programovanie oveľa dostupnejšie pre seba aj pre žiakov. Veľká zábava a veľa možností na použitie so žiakmi. Myslím, že je to veľmi pekný nástroj. Verím, že je to cenný spôsob, ako deti začnú s programovaním. Python a kódovanie boli vždy vzrušujúce, lebo prekážka pri učení je vysoká. Teraz je všetko o kúsok nižšie a vysvetlilo sa, že to môže byť aj jednoduché. Páčilo sa mi, ako sa Hedy snaží spraviť programovanie čo najdostupnejšie.*
        Holandsko: budúci učitelia matematiky (stredná škola)

        *Jednoduché rozhranie a dobré príklady.* Učiteľ: 3. až 6. ročník (základná škola)

        *Viacjazyčné programovanie a samotný postupný princíp.* USA: stredná škola, 6. až 8. ročník

        *Postupné uvádzanie programovania.* Austrália: stredná škola

        *Pokračuje automaticky.* Holandsko: 2. ročník HAVO-VWO

        *Aj to, že vysvetlenie môže byť po holandsky (a kód po anglicky), aj to, že sa to buduje s čoraz väčšími možnosťami.* Holandsko: skupina plus

        *Hedy a jeho postupné úrovne... aký nápad. Chcel som osobne poďakovať za to, že toto vzniklo. Neviem sa dostatočne poďakovať. Takú mieru zapojenia a nadšenia svojich žiakov, ako pri Hedy, som ešte nevidel. Prešli sme po úroveň 5 a plánujeme tomu venovať ešte týždeň na hodinách a v laboratóriu, kým začneme s Pythonom.* Pakistan

        *„Skutočnosť“ programovania, podobá sa tomu, ako to je naozaj.* Holandsko: skupina plus 4 až 8

        *Činnosti krok za krokom. Zábavné činnosti.* Holandsko: 1. ročník všetky úrovne, 2. VWO/HAVO, 2. VWO +, 3. HAVO, 3. VWO

        *Hedy sa mi naozaj veľmi páči a je aj pekne postavené, takže sa hodí na základnú školu. Postupný prístup Hedy funguje veľmi dobre. Krátke vysvetlenie na začiatku každej úrovne a krátke ukážkové programy pomáhajú deťom rýchlo vidieť, čo je na zvolenej úrovni nové. Rôzne úlohy, z ktorých si deti môžu vybrať, tiež fungujú veľmi dobre. Deti si vyberú úlohy, ktoré ich zaujmú, a potom s nimi pracujú naprieč úrovňami. Hedy je veľká zábava pre deti, ktorým programovanie ide a chcú ochutnať skutočný programovací jazyk. Je to dobrá príprava na strednú školu, keď sa tam bude učiť viac informatiky.* Holandsko: montessori škola Oegstgeest

        *Stavba je taká dobrá.* Holandsko: nižšia stredná škola HAVO-VWO

        *Viem udržať tempo triedy.* Holandsko: skupiny 7 a 8

        ![Felienne učí deti](/images/teacherfeedback/Fkids1.JPG) *Felienne učí deti*        ![Deti sa učia o Hedy](/images/teacherfeedback/Fkids2.JPG) *Deti sa učia o Hedy*
teacher-guide:
-   title: Úvod
    key: intro
    subsections:
    -   title: Čo je Hedy?
        text: |-
            Hedy je textový programovací jazyk vytvorený pre deti a tínedžerov (10 až 15 rokov).
            Na rozdiel od jazykov pre deti, ako je Scratch, Hedy nepoužíva bloky, ale textový kód.
            S Hedy sa teda píše kód tak, ako to robia skutoční programátori, ale malými krokmi a hravými cvičeniami.
            Hedy tak môže byť schodíkom k skutočným jazykom, ako je Python, prístupne a väčšinou aj zábavne.
            Ak chceš vedieť viac, môžeš si pozrieť toto <a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">video</a> o vývoji Hedy ako programovacieho jazyka.
    -   title: Pre koho je
        text: |-
            Hedy je navrhnuté pre žiakov druhého stupňa a nižšej strednej školy (10 až 15 rokov), ale môže ho použiť ktokoľvek, kto sa chce učiť programovať.
            Dôležité je, aby žiaci vedeli dobre čítať. Odporúčame nezačínať s Hedy skôr, ako žiaci dosiahnu aspoň čitateľskú úroveň 3. ročníka.
            Žiaci (ani učitelia) pred začiatkom s Hedy nepotrebujú žiadnu skúsenosť s programovaním.
    -   title: Ako Hedy funguje?
        text: |-
            Hedy je rozdelené na úrovne, v ktorých sa učia nové príkazy a pojmy. Každá úroveň má rôzne dobrodružstvá na precvičenie nových príkazov.
            Hedy má tri časti: Základy, Pokročilí a Experti. V Hedy Základy (úrovne 1–8) sa dajú skúšať jednoduché pojmy, napríklad výpis, otázka, jednoduché premenné a opakovanie. V Hedy Pokročilí (úrovne 9–12) žiaci idú ďalej a učia sa náročnejšie veci, ako cykly, vnorenie a funkcie. Hedy Experti (úrovne 13–16) má hladko prejsť k plnej syntaxi Pythonu.
            Nech chceš pre žiakov dosiahnuť čokoľvek, Hedy sa na to hodí. Či majú len zažiť radosť z kódu, naučiť sa základné pojmy, alebo sa pripraviť na skutočnú syntax Pythonu.

            Ako učiteľ môžeš rozhodnúť nielen to, ktoré úrovne sú pre žiakov dostupné, ale aj to, ktoré dobrodružstvá sú dostupné na každej úrovni. Budú robiť reštauráciu, kalkulačku alebo strašidelný dom? V rámci úrovne idú dobrodružstvá od najľahšieho po najťažšie, ale môžeš ich poskladať tak, ako to žiakom vyhovuje.
            Dobrodružstvá môžu žiaci robiť samostatne, ale odporúčame ich použiť pri spoločnom výklade.

            Dobrodružstvá majú aj ukážku kódu a riešenia, aby Hedy vedeli použiť aj učitelia, ktorí sú v digitálnych veciach menej zbehlí.
            Hedy samozrejme slúži aj tvorivým učiteľom, ktorí radi robia vlastné prípravy a dobrodružstvá.

            Prácu žiakov a ich postup môžeš sledovať na stránke triedy.
    -   title: Zariadenia
        text: |-
            Hedy beží na webe, takže funguje na každom zariadení s prehliadačom (Google Chrome, Firefox, Edge a podobne). Hodia sa notebooky, Chromebooky, tablety aj telefóny.
            Pred prácou s Hedy netreba nič sťahovať, stačí otvoriť web a môžeš začať.
            Existuje aj <a href="https://github.com/hedyorg/hedy/wiki/Offline-Hedy " target="_blank">offline verzia</a> Hedy.
    -   title: Komunita Hedy
        text: |-
            Všetci učitelia, programátori a ďalší fanúšikovia Hedy sú vítaní na našom <a href="https://discord.gg/8yY7dEme9r" target="_blank">serveri Discord</a>. Je to ideálne miesto na rozhovor o Hedy: sú tu kanály na ukážky projektov a hodín, hlásenie chýb aj rozhovor s inými učiteľmi a tímom Hedy.
            <a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">Tu</a> je video, ako sa do komunity na Discorde pridať.

            O Hedy môžeš byť v obraze aj <a href="https://hedy.org/subscribe" target="_blank">prihlásením sa na newsletter</a>. Alebo nás sleduj na <a href="https://nl.linkedin.com/company/hedyorg" target="_blank">LinkedIne</a>.
    -   title: Hedy a GDPR
        text: |-
            Organizácie v EÚ musia pri spracúvaní osobných údajov dodržiavať GDPR (všeobecné nariadenie o ochrane údajov).
            Pre veľa škôl je to zložitá téma, preto sa dajú všetky programovacie funkcie Hedy použiť aj bez zdieľania osobných údajov.
            Najjednoduchšie je používať Hedy bez účtov pre učiteľa a žiakov. Bez účtov je Hedy dostupné, ale bez učiteľského rozhrania. Nebudeš môcť sledovať postup žiakov ani rozhodovať, ktoré dobrodružstvá a úrovne majú k dispozícii. Je to obmedzenie, ale niektoré školy Hedy takto používajú.

            Druhá možnosť je, že si učiteľ vytvorí účet s e-mailom bez osobných údajov, napríklad „docent25@email.com“. Okrem e-mailu, ktorý treba len na obnovenie hesla, pri vytvorení učiteľského účtu netreba zdieľať žiadne údaje.
            S učiteľským účtom môžeš žiakom vytvoriť anonymné účty, napríklad rainbow-student1, rainbow-student2 (podrobný návod je v časti Príprava na výučbu). Tak sa dajú použiť všetky funkcie Hedy vrátane ukladania postupu, bez osobných údajov teba aj žiakov.

            Ak ti toto na tvoje podmienky nestačí, môžeme podpísať zmluvu o spracúvaní osobných údajov.
    -   title: Dar pre Hedy
        text: Pomoc s chodom Hedy sa nám zíde. Peniaze používame na chod servera, údržbu a vylepšovanie webu Hedy. Každý dar si vážime. <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Tu môžeš darovať v eurách </a> alebo <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">tu v amerických dolároch</a>. Ďakujeme!
-   title: Časté chyby
    key: common_mistakes
    intro: Z chýb sa dá učiť, hlavne pri kóde. Chyby sú nevyhnutné a sú dobrá príležitosť na učenie, ale pre učiteľa môže byť ťažké nájsť správnu opravu. Najmä keď sú programy s postupom úrovní dlhšie a dlhšie. Preto máme zoznam častých chýb na každej úrovni a ich riešenia.
    levels:
    -   level: '1'
        concepts_and_changes: |-
            Úroveň 1 je miesto, kde žiaci napíšu a spustia svoje prvé riadky kódu. Zatiaľ netreba riešiť
            interpunkciu: každý riadok začína príkazom a zvyšok riadka je obyčajný text.
            Hodina je naozaj o jednej myšlienke, že počítač urobí presne
            to, čo mu povieš, nič viac a nič menej.

            Nové na tejto úrovni:

            * Zobrazenie textu na obrazovke pomocou `{print}`
            * Otázka pomocou `{ask}` a použitie odpovede pomocou `{answer}`
            * Kreslenie korytnačkou pomocou `{forward}` a `{turn}`
            * Zahratie hudobného tónu pomocou `{play}`
        sections:
        -   title: Žiaci zabudnú napísať príkazy
            example:
                error_text: Napríklad napíšu vetu bez print.
                error_code: Hedy toto nevie vypísať
