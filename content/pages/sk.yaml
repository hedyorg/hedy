                solution_code: animal {is} {ask} 'Aké je tvoje obľúbené zviera?' {if} animal {is} dog {print} 'Aj mne sa páčia psy!' {elif} animal {is} cat {print} 'Mačky sú v pohode' {else} {print} 'Super zviera'
