            * Znak = namiesto `{is}`
        sections:
        -   title: Žiaci majú problém s úvodzovkami
            example:
                error_text: Niektorí žiaci váhajú, či úvodzovky pridať. Ak ich pridáš, obrazovka ukáže doslova „5+5“.
                error_code: "{print} '5 + 5'"
                solution_text: V tomto kóde obrazovka vypíše „10“.
                solution_code: '{print} 5 + 5'
        -   title: Žiaci majú problém s počítaním s premennou
            example:
                error_text: 'Niektorým žiakom bude ťažké počítať s premennými. Ukáž im veľmi jednoduché príklady, napríklad:'
                error_code: |-
                    age = {ask} 'Koľko máš rokov?'
                    {print} 'Budúci rok budeš mať ' age + 1
                solution_text: Alebo choď o krok ďalej, takto.
                solution_code: |-
                    price = 0
                    {print} 'Vitaj v našej burgerovej reštaurácii'
                    burger = {ask} 'Chceš hamburger?'
                    {if} burger = áno
                    price = price + 10
                    drink = {ask} 'Chceš niečo na pitie?'
                    {if} drink = áno
                    price = price + 4
                    {print} 'Bude to ' price ' eur, prosím'
        -   title: Žiaci zabudnú znak =
            example:
                error_text: Ak zabudnú použiť = namiesto {is}, v Hedy to bude stále dovolené, takže problém to nie je. Ak je cieľ, aby žiaci smerovali k skutočnému Pythonu alebo iným jazykom, odporúča sa učiť ich používať =. Ak je cieľ len ochutnávka programovania, nerieš, či používajú = alebo {is}.
                error_code: name {is} Hedy
                solution_text: znak =
                solution_code: name = Hedy
        -   title: Žiaci v desatinných číslach použijú čiarku namiesto bodky
            example:
                error_text: V niektorých jazykoch sa pri desatinných číslach používa čiarka. V programovacích jazykoch sa používa bodka, teda aj v Hedy.
                error_code: '{print} 2,5 + 2,5'
                solution_text: V desatinných číslach použi bodky
                solution_code: '{print} 2.5 + 2.5'
    -   level: '8'
        concepts_and_changes: |-
            Na tejto poslednej úrovni Hedy Základy sa žiaci naučia v programoch opakovať. Zatiaľ môžu opakovať len jeden riadok viackrát. Opakovanie viacerých riadkov príde na ďalších úrovniach.

            Nové na tejto úrovni:
            * Opakovanie riadka pomocou `{repeat} 3 {times}`
            * Opakovanie riadka toľkokrát, koľko je v premennej
        sections:
        -   title: Žiaci zabudnú jedno slovo príkazu repeat, alebo zabudnú príkaz print
            example:
                error_text: Uisti sa, že žiaci vedia použiť celý príkaz repeat aj príkaz print.
                error_code: |-
                    {repeat} 3 {times}  "Veď je to poriadny kamarát"
                    {repeat} 3 {print} 'To nikto nemôže poprieť!'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    {repeat} 3 {times} {print} "Veď je to poriadny kamarát"
                    {repeat} 3 {times} {print} 'To nikto nemôže poprieť!'
        -   title: Žiaci sa snažia opakovať viac riadkov
            example:
                error_text: Na tejto úrovni sa dá viackrát opakovať len jeden riadok kódu. V tomto kóde žiak chcel vypísať 3 rôzne nápoje, ale nebude to fungovať. Otázku položí 3-krát a vypíše len poslednú odpoveď.
                error_code: |-
                    {repeat} 3 {times} drink = {ask} 'Čo si chceš dať na pitie?'
                    {print} drink
                solution_text: Na opakovanie viacerých riadkov treba prejsť na ďalšiu úroveň. Na tejto úrovni treba všetko vypísať osobitne.
                solution_code: |-
                    drink = {ask} 'Čo si chceš dať na pitie?'
                    {print} drink
                    drink = {ask} 'Čo si chceš dať na pitie?'
                    {print} drink
                    drink = {ask} 'Čo si chceš dať na pitie?'
                    {print} drink
        -   title: Žiaci robia programy, ktoré bežia príliš dlho
            example:
                error_text: Na tejto úrovni sa veľmi ľahko spraví program, ktorý trvá dlho. Ak trvá príliš dlho, zastaví sa, aby sa nezaťažoval počítač žiaka.
                error_code: "{repeat} 100 {times} {print} 'Koľkokrát toto môžem opakovať?'"
                solution_text: Uisti sa, že kód netrvá príliš dlho
                solution_code: "{repeat} 20 {times} {print} 'Toto stačí'"
    -   level: '9'
        concepts_and_changes: |-
            Na tejto prvej úrovni Hedy Pokročilí sa žiaci učia odsadenie. Vďaka nemu môžu použiť viac riadkov v if alebo opakovať viac riadkov. Túto úroveň žiaci často majú radi, lebo vedia robiť zložitejšie programy.
            Na druhej strane niektorí budú mať problém pochopiť, kedy a ako odsadiť.

            Nové na tejto úrovni:
            * Viac riadkov za `{if}`, `{elif}` alebo `{else}` vďaka odsadeniu
            * Viac riadkov za `{repeat}` vďaka odsadeniu
        sections:
        -   title: Žiaci použijú odsadenie zle
            example:
                error_text: Odsadenie je na tejto úrovni nový pojem a pre niektorých žiakov môže byť ťažké. Nechaj ich precvičiť jednoduché príklady, kým s ním spravia celý program.
                error_code: |-
                    {repeat} 3 {times}
                    {print} 'ahoj'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    {repeat} 3 {times}
                        {print} 'ahoj'
        -   title: Žiaci opakujú len 1 riadok, hoci chceli opakovať viac riadkov
            example:
                error_text: V kóde nižšie žiak chcel zobrať objednávku nápojov od 3 ľudí. Program sa však opýtal 3-krát, ale zapísal len jednu objednávku.
                error_code: |-
                    {repeat} 3 {times}
                        drink = {ask} 'Čo si chceš dať na pitie?'
                    {print} drink
                solution_text: |-
                    V správnom kóde začína odsadením aj tretí riadok. Tak patrí do bloku repeat a zopakuje sa 3-krát.
                    Keď žiakom ukážeš tieto rozdiely, lepšie pochopia, prečo programy potrebujú odsadenie.
                solution_code: |-
                    {repeat} 3 {times}
                        drink = {ask} 'Čo si chceš dať na pitie?'
                        {print} drink
        -   title: Žiaci chcú vnoriť príkazy `{if}` alebo dať `{if}` do cyklu
            example:
                error_text: |-
                    Na tejto úrovni žiaci ešte nemôžu dať `{if}` do iného `{if}` ani do cyklu repeat.
                    Na ďalšej úrovni je to dovolené.
                error_code: |-
                    birthday = {ask} 'Máš narodeniny?'
                    {if} birthday = áno
                        {repeat} 3 {times}
                            {print} 'Hip hip hurá!'
                solution_text: 'Toto je správny kód pre túto úroveň:'
                solution_code: |-
                    birthday = {ask} 'Máš narodeniny?'
                    {if} birthday = áno
                        {print} 'Hip hip hurá!'
                        {print} 'Hip hip hurá!'
                        {print} 'Hip hip hurá!'
        -   title: Žiaci robia programy, ktoré bežia príliš dlho
            example:
                error_text: Na tejto úrovni sa veľmi ľahko spraví program, ktorý trvá dlho. Ak trvá príliš dlho, zastaví sa, aby sa nezaťažoval počítač žiaka.
                error_code: |-
                    {repeat} 100 {times}
                        {print} 'Koľkokrát toto môžem opakovať?'
                solution_text: Uisti sa, že kód netrvá príliš dlho
                solution_code: |-
                    {repeat} 20 {times}
                        {print} 'Toto stačí'
    -   level: '10'
        concepts_and_changes: |-
            Na tejto úrovni znova rozširujeme {if} a {repeat}. Na predchádzajúcej úrovni sa žiaci naučili použiť viac riadkov za {repeat}, {if}, {elif} alebo {else}.
            Teraz sa naučia aj *vnorenie*, teda dať {if} alebo {repeat} do iného {if} alebo {repeat}. Naučia sa aj dva nové príkazy: {and} a {or}.
            Žiaci tak budú mať oveľa viac možností na pestrejšie programy.

            Nové na tejto úrovni:
            * Vnorenie {if} a {repeat}
            * Použitie {and} a {or} za {if}
        sections:
        -   title: Žiaci robia chyby v odsadení
            example:
                error_text: Najťažšie na tejto úrovni je trafiť odsadenie. Žiaci radi vnorujú príkazy `{if}`, niekedy aj do iných vnorených `{if}`. Sledovať odsadenie vie byť poriadne ťažké.
                error_code: |-
                    {print} 'Robin ide centrom mesta'
                    location = {ask} 'Ide Robin do obchodu, alebo ide domov?'
                    {if} location {is} shop
                        {print} 'Vojde do obchodu.'
                        {print} 'Robin vidí zaujímavo vyzerajúcu knihu'
                        book = {ask} 'Kúpi Robin knihu?'
                            {if} book {is} áno
                    {print} 'Robin kúpi knihu a ide domov'
                    {else}
                        {print} 'Robin odíde z obchodu a ide domov'
                    {else}
                        {print} 'Robin ide domov'
                solution_text: Toto je správny kód. Keď dávaš príkazy `{if}` do iných `{if}`, snaž sa sledovať všetky rôzne konštrukcie.
                solution_code: |-
                    {print} 'Robin ide centrom mesta'
                    location = {ask} 'Ide Robin do obchodu, alebo ide domov?'
                    {if} location {is} shop
                        {print} 'Vojde do obchodu.'
                        {print} 'Robin vidí zaujímavo vyzerajúcu knihu'
                        book = {ask} 'Kúpi Robin knihu?'
                        {if} book {is} áno
                            {print} 'Robin kúpi knihu a ide domov'
                        {else}
                            {print} 'Robin odíde z obchodu a ide domov'
                    {else}
                        {print} 'Robin ide domov'
        -   title: Žiaci si mýlia `{and}` s `{or}`
            example:
                error_text: Oba príkazy môžu vyzerať podobne, ale robia veľmi odlišné veci.
                error_code: |-
                    game = {ask} 'Chceš sa hrať hru?'
                    time = {ask} 'Máš čas hrať sa?'
                    {if} game {is} 'áno' {or} time {is} 'áno'
                        {print} 'Poďme sa hrať!'
                solution_text: V tomto prípade má osoba na obe otázky odpovedať áno, takže treba použiť `{and}`.
                solution_code: |-
                    game = {ask} 'Chceš sa hrať hru?'
                    time = {ask} 'Máš čas hrať sa?'
                    {if} game {is} 'áno' {and} time {is} 'áno'
                        {print} 'Poďme sa hrať!'
        -   title: Žiaci robia neúplné riadky s `{or}`
            example:
                error_text: Za {or} má byť podmienka úplná.
                error_code: |-
                    color = {ask} 'Aká farba sa ti páči?'
                    {if} color {is} blue {or} green
                        {print} 'Krása!'
                solution_text: 'Dokonči riadok takto:'
                solution_code: |-
                    color = {ask} 'Aká farba sa ti páči?'
                    {if} color {is} blue {or} color {is} green
                        {print} 'Krása!'
    -   level: '11'
        concepts_and_changes: |-
            Na tejto úrovni sa žiaci zoznámia s cyklami {for}.

            Nové na tejto úrovni:
            * Cykly s {for}
        sections:
        -   title: Žiaci nepoužijú príkaz `{for}` správne
            example:
                error_text: Často vidíme, že žiaci sa snažia vypísať zoznam (v príklade animals) namiesto položiek zoznamu.
                error_code: |-
                    animals {is} dog, cat, blobfish
                    {for} animal {in} animals
                      {print} 'Páči sa mi ' animals
                solution_text: Slovo animals na poslednom riadku treba zmeniť na animal.
                solution_code: |-
                    animals {is} dog, cat, blobfish
                    {for} animal {in} animals
                      {print} 'Páči sa mi ' animal
        -   title: Žiaci zabudnú odsadenie
            example:
                error_text: Žiaci často zabudnú použiť odsadenie za príkazom for.
                error_code: |-
                    animals {is} dog, cat, blobfish
                    {for} animal {in} animals
                    {print} 'Páči sa mi ' animals
                solution_text: Za príkazom for treba použiť odsadenie.
                solution_code: |-
                    animals {is} dog, cat, blobfish
                    {for} animal {in} animals
                      {print} 'Páči sa mi ' animal
    -   level: '12'
        concepts_and_changes: |-
            Na tejto poslednej úrovni Hedy Pokročilí sa žiaci naučia základné funkcie.

            Nové na tejto úrovni:
            * Základné funkcie pomocou {define} a {call}
        sections:
        -   title: Žiaci spravia funkciu, ale zabudnú ju zavolať.
            example:
                error_text: Funkcia funguje len vtedy, keď ju zavoláš.
                error_code: |-
                    {define} greet_costumer
                        {print} 'Ahoj'
                        {print} 'Ako sa máš?'
                solution_text: Zavolaj funkciu
                solution_code: |-
                    {define} greet_costumer
                        {print} 'Ahoj'
                        {print} 'Ako sa máš?'

                    {call} greet_costumer
        -   title: Žiaci majú problém s odsadením.
            example:
                error_text: Odsadenie ostane pre veľa žiakov ťažké
                error_code: |-
                    {define} zábavaction
                    {print} 'Vo zábavakcii použi odsadenie.'
                    {if} use_if_statement {is} 'áno'
                    {print} 'A nezabudni odsadiť aj cykly'
                solution_text: Pri funkcii použi správne odsadenie
                solution_code: |-
                    {define} zábavaction
                        {print} 'Vo zábavakcii použi odsadenie.'
                        {if} use_if_statement_too {is} 'áno'
                            {print} 'A nezabudni odsadiť aj cykly'
        -   title: Žiaci zabudnú úvodzovky
            example:
                error_text: Žiaci teraz potrebujú viac úvodzoviek ako na predchádzajúcich úrovniach. V tomto príklade úvodzovky chýbali v zozname aj v príkaze `{if}`.
                error_code: |-
                    superheroes = Spiderman, Batman, Iron Man
                    superhero = superheroes {at} {random}
                    {if} superhero = Batman
                        {print} 'SOM BATMAN!'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    superheroes = 'Spiderman', 'Batman', 'Iron Man'
                    superhero = superheroes {at} {random}
                    {if} superhero {is} 'Batman'
                        {print} 'SOM BATMAN!'
    -   level: '13'
        concepts_and_changes: |-
            Na tejto prvej úrovni Hedy Experti sa žiaci čoraz viac dostávajú k pojmom a syntaxi skutočných programovacích jazykov.
            Úrovne Hedy Experti odporúčame so žiakmi robiť len vtedy, ak je cieľ, aby neskôr pracovali s inými „skutočnými“ jazykmi (napríklad Pythonom).
            Ak tento cieľ žiakom nesedí, odporúčame ostať pri Hedy Základy a Hedy Pokročilí, kde sa naučia základné princípy programovania a nezaťažujú ich konkrétne pravidlá syntaxe.

            **Poznámka:** od tejto úrovne je syntax Hedy takmer syntax Pythonu. To znamená, že predtým naučená syntax Hedy tu nemusí fungovať. Novú pythónovskú syntax vysvetlíme na ďalších úrovniach, ale aby žiakov nezahltila, rozložili sme ju na viac úrovní.
            Niektoré veci, napríklad funkcie a zoznamy, preto nebudú fungovať spôsobom Hedy a novým pythónovským spôsobom ešte vysvetlené nebudú. Žiaci potrebujú trochu trpezlivosti. Od predchádzajúcich úrovní cúvame, aby sedela syntax, a potom sa všetky funkcie naučíme spôsobom Pythonu.

            Na tejto úrovni sa žiaci naučia aj operátory, takže v programoch budú môcť viac počítať.


            Nové na tejto úrovni:
            * Výpis so syntaxou Pythonu: `{print}('Hello world!')
            * Výpis textu a premenných spolu, takto: `{print}('Hello, ', name, '!')
            * Otázky pomocou `{input}`
            * Dvojbodka za príkazmi {if}
            * Tieto operátory: < > == != <= >=
        sections:
        -   title: Žiaci zabudnú použiť novú syntax
            example:
                error_text: Táto úroveň má veľa nových pravidiel syntaxe.
                error_code: |-
                    mood {is} {ask} 'Ako sa máš ' name '?'
                    {if} mood {is} dobre
                        {print} 'Skvelé!'
                solution_text: Použi správnu syntax.
                solution_code: |-
                    mood = input('Ako sa máš?', name, '?')
                    {if} mood == 'dobre':
                        {print}('Skvelé!')
        -   title: Žiaci si mýlia znaky < a >
            example:
                error_text: Žiaci tieto znaky často poznajú z matematiky. Ak ich ešte nepoznajú, môže to byť pre nich ťažké.
                error_code: |-
                    age = {ask} 'Koľko máš rokov?'
                    {if} age < 12
                        {print} 'Máš viac rokov, ako mám ja!'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    age = {ask} 'Koľko máš rokov?'
                    {if} age > 12
                        {print} 'Máš viac rokov, ako mám ja!'
        -   title: Žiaci použijú zlé znaky pre `!=` `<=` a `>=`
            example:
                error_text: Tieto znaky sú pre väčšinu žiakov pravdepodobne nové. Určite im ich vysvetli.
                error_code: |-
                    name = {ask} 'Ako sa voláš?'
                    {if} name =  'Hedy'
                        {print} 'Nie si Hedy'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    name = {ask} 'Ako sa voláš?'
                    {if} name != 'Hedy'
                        {print} 'Nie si Hedy'
        -   title: Žiaci zabudnú použiť znak ==
            example:
                error_text: Na tejto úrovni žiaci ešte môžu použiť = alebo is. Na iných úrovniach alebo v Pythone ich to však môže dostať do problémov. Najlepšie je naučiť ich to používať.
                error_code: |-
                    name = {ask} 'Ako sa voláš?'
                    {if} name = 'Hedy'
                        {print} 'Si super!'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    name = {ask} 'Ako sa voláš?'
                    {if} name == 'Hedy'
                        {print} 'Si super!'
        -   title: Žiaci budú skúšať funkcie z predchádzajúcich úrovní, ktoré nie sú v syntaxi Pythonu.
            example:
                error_text: Žiaci budú skúšať napríklad opakovanie, funkcie alebo zoznamy.
                error_code: |-
                    {define} pick_an_animal
                        animals = dog, cat, hamster
                        {repeat} 3 {times}
                        {print} animals {at} {random}

                    {call} pick_an_animal
                solution_text: Ako sa to robí, naučia sa na ďalších úrovniach.
                solution_code: '# Keď na to budeš pripravený, pozri si ďalšie úrovne. Alebo si na tejto úrovni najprv precvič základy.'
    -   level: '14'
        concepts_and_changes: |-
            Táto úroveň sa sústredí na zoznamy. Žiaci sa naučia aj opakovanie spôsobom Pythonu.

            Nové na tejto úrovni:
            * Práca so zoznamami
            * Spájanie zoznamov s {for}, {if} a {random}
            * Opakovanie pomocou {for} i {range}(1,10)
        sections:
        -   title: Žiaci zabudnú zátvorky
            example:
                error_text: Od tejto úrovne majú byť zoznamy v zátvorkách.
                error_code: |-
                    icecream = 'strawberry', 'chocolate'
                    {print} 'Páči sa mi ' zmrzlinu[{random}] ' zmrzlinu'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print} 'Páči sa mi ' zmrzlinu[{random}] ' zmrzlinu'
        -   title: Žiaci použijú zlé zátvorky
            example:
                error_text: Od tejto úrovne majú byť zoznamy v zátvorkách.
                error_code: |-
                    icecream = ('strawberry', 'chocolate')
                    {print} 'Páči sa mi ' zmrzlinu[{random}] ' zmrzlinu'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print} ('Páči sa mi ' zmrzlinu[{random}] ' zmrzlinu')
        -   title: Žiaci pri sústredení na zátvorky zabudnú úvodzovky
            example:
                error_text: Žiaci sa niekedy tak sústredia na novú časť syntaxe, že zabudnú úvodzovky.
                error_code: |-
                    icecream = [strawberry, chocolate]
                    {print} 'Páči sa mi ' zmrzlinu[{random}] ' zmrzlinu'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print}('Páči sa mi ' zmrzlinu[{random}] ' zmrzlinu')
        -   title: Žiaci stále používajú starý príkaz at random
            example:
                error_text: '{random} sa na tejto úrovni zmenilo'
                error_code: |-
                    icecream = [strawberry, chocolate]
                    {print} 'Páči sa mi ' zmrzlinu at random ' zmrzlinu'
                solution_text: 'Toto je správny kód:'
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print} 'Páči sa mi ' zmrzlinu[{random}] ' zmrzlinu'
    -   level: '15'
        concepts_and_changes: |-
            Táto úroveň sa sústredí na funkcie. V Hedy Pokročilí sa žiaci naučili základnú funkciu. Tu sa naučia nielen syntax Pythonu pre funkciu, ale aj argumenty funkcií a {return} {value}.

            Nové na tejto úrovni:
            * Funkcia spôsobom Pythonu
            * Argumenty funkcie
            * Použitie {return} {value}
        sections:
        -   title: Žiaci majú problém so správnou syntaxou a odsadením funkcie
            example:
                error_text: Žiaci majú problém so správnou syntaxou a odsadením funkcie
                error_code: |-
                    {def} greet_the_costumer(name
