title: Dokumentácia Hedy
home-sections:
-   title: Textové programovanie jednoducho!
    text: |-
        Mnohé školy a učitelia na svete chcú učiť žiakov programovať. Na začiatku sa to často robí hravými nástrojmi, od robota Bee-Bot až po
        Scratch Junior alebo Scratch. Po nich deti často chcú prejsť k silnejším textovým jazykom, napríklad k Pythonu.

        Python je však ťažký, lebo je len po anglicky a žiaci sa musia naraz učiť zložité pojmy aj syntax.
        Hedy je ľahký začiatok s textovými programovacími jazykmi. Hedy je zadarmo, má otvorený zdrojový kód a od iných textových jazykov sa líši tromi vecami.

        1. Hedy je viacjazyčné, môžeš ho používať vo vlastnom jazyku
        2. Hedy ide postupne, takže sa naraz učíš jeden pojem a jeho syntax
        3. Hedy je stavané do triedy, učitelia môžu úplne prispôsobiť, čo žiaci zažijú
-   title: Programovanie vo viacerých jazykoch
    text: Takmer všetky textové programovacie jazyky majú kľúčové slová po anglicky, napríklad `for` alebo `repeat`. Hedy sa dá používať v ľubovoľnom jazyku. Teraz podporujeme 47 jazykov, vrátane holandčiny, španielčiny, arabčiny, turečtiny, čínštiny a hindčiny. Ak tvoj jazyk chýba, vždy môžeš začať nový preklad.
-   title: Učenie krok za krokom
    text: Učenie programovacieho jazyka vie byť náročné, lebo sa naraz učia pojmy (napríklad if-else alebo cykly) aj syntax (úvodzovky alebo okrúhle zátvorky). V Hedy sa pojmy najprv ukážu s málo syntaxe a potom sa spresňujú. Je to vedecky overený spôsob učenia!
-   title: Stavané do triedy
    text: |-
        Hedy sa hodí pre deti od 10 rokov a je navrhnuté na použitie v triede.
        Učitelia môžu použiť naše bezplatné vstavané prípravy hodín, alebo napísať vlastné a nahrať ich do rozhrania Hedy.
-   title: Programovanie v súvislostiach
    text: Hedy ukazuje programovanie čo najširšie a dá sa použiť na veľa zaujímavých vecí. Dajú sa v ňom tvoriť digitálne a interaktívne príbehy, farebné kresby na obrazovke, kresliacim perom alebo vyšité na tričku, aj hry a aplikácie s tlačidlami a klávesnicou.
-   title: Je Hedy zadarmo?
    text: |-
        Áno! Hedy je open source, čiže každý nám môže pomôcť Hedy zlepšovať.
        Náš kód je na <a href="https://github.com/hedyorg/hedy" target="_blank">GitHube</a>.
        Ak sa ti Hedy páči a chceš prispieť, prijímame (a sme veľmi vďační za) <a href="https://github.com/sponsors/hedyorg" target="_blank">dary</a>!
        Peniaze používame na chod servera, údržbu a vylepšovanie webu Hedy.
-   title: Musím niečo inštalovať?
    text: Nie. Hedy funguje v prehliadači, teda v programe, v ktorom pozeráš túto stránku. Asi v Chrome, Edge alebo Firefoxe. Hedy funguje aj na telefónoch a tabletoch.
-   title: Potrebujem na výučbu s Hedy skúsenosť s programovaním?
    text: |-
        Nie, netreba. Všetky pojmy sú vysvetlené v prezentáciách aj v rozhraní pre žiakov.
        Ak si vytvoríš bezplatný učiteľský účet, dostaneš aj príručku pre učiteľov s tým, ako učiť,
        a s častými chybami.
join-sections:
-   title: Podpora Hedy
    text: '# Hedy sa dá podporiť tromi spôsobmi!'
-   title: Vylepšovanie jazyka
    text: |-
        Postupnosť a viacjazyčnosť Hedy prinášajú veľa zaujímavých technických úloh.
        Nájdeš ich na <a href="https://github.com/hedyorg/hedy/issues?q=is%3Aopen+is%3Aissue+label%3Alanguage" target="_blank">GitHube</a>.
-   title: Prekladanie Hedy
    text: |-
        Nie si programátor? Nevadí! Ďalší spôsob, ako Hedy podporiť, je <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">prekladať kľúčové slová, chybové hlášky, dobrodružstvá a ďalší obsah</a>.
        Toto je aktuálny stav. Pomôž dokončiť nejaký jazyk, alebo pridaj nový!
        <a href="https://hosted.weblate.org/engage/hedy/">
        <img src="https://hosted.weblate.org/widgets/hedy/-/multi-auto.svg" alt="Stav prekladu" /></a>
-   title: Pomoc učiteľom na začiatku
    text: |-
        Hedy má učiteľom pomôcť viesť hodiny programovania v triede. Sú tu učiteľské funkcie, napríklad vytvorenie triedy, jej úprava a prehľad, ako sa žiakom darí.
        Ak sa ti Hedy páči, môžeš osloviť školy, ktoré poznáš, a pomôcť učiteľom začať. Školy alebo učiteľov ti pomôžeme nájsť cez <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord</a>.
learn-more-sections:
