    Команда Hedy понимает, насколько важна конфиденциальность для нашего сообщества, особенно для детей и родителей. Мы составили эту Политику конфиденциальности, чтобы объяснить, какие сведения мы собираем через наш сайт, как используем, обрабатываем и передаём их и что делаем для их защиты.
    В ней также описаны твои права и возможности выбора в отношении твоих данных и способы связаться с нами, если у тебя возникнут вопросы или опасения.

    ## Какие персональные данные обо мне собирает Hedy?
    В этой Политике конфиденциальности «персональные данные» — это любые сведения, относящиеся к человеку, чья личность установлена или может быть установлена, например год рождения или пол.

    ## Данные учётной записи
    Чтобы сохранять программы, присоединяться к классам или делиться программами, нужно создать учётную запись. При её создании мы просим указать имя пользователя, страну, год рождения, пол и адрес электронной почты (или адрес родителя или опекуна, если тебе меньше 16 лет).
    Из этих сведений обязательно указывать только имя пользователя. Мы просим выбирать имя пользователя, которое не раскрывает твоё настоящее имя или другие сведения, по которым тебя можно узнать. Другие пользователи видят твоё имя пользователя и страну, но не возраст, пол или адрес электронной почты.

    ## Пользовательский контент
    Мы собираем все сведения, которые ты предоставляешь нам при создании проектов Hedy (в том числе проектов, которыми ты не делишься).

    ## Обмен данными
    Когда ты используешь Hedy, мы автоматически собираем сведения о тебе и твоём устройстве, например с помощью файлов cookie и журналов веб-сервера. Используя Hedy, ты соглашаешься на размещение файлов cookie и применение аналогичных технологий в твоём браузере в соответствии с этой Политикой конфиденциальности.

    Собираемые таким образом сведения включают используемый браузер и версию операционной системы, языковые настройки и информацию об использовании Hedy, например о выбранных примерах кода и показанных сообщениях об ошибках.
    Если ты не хочешь, чтобы сведения собирались с помощью файлов cookie, большинство браузеров позволяют автоматически отклонять cookie или выбирать, разрешить ли передачу на твой компьютер отдельных файлов cookie с определённого сайта. Также можно обратиться к https://allaboutcookies.org/how-to-manage-cookies. Однако отказ от файлов cookie может вызвать некоторые неудобства при использовании Hedy.

    ## Как команда Hedy использует мои персональные данные?

    ### Внутреннее использование и работа сайта
    Мы используем персональные данные для внутренних целей и работы сайта, в том числе для обеспечения, предоставления и поддержки работы Hedy. Например, мы можем изучить сообщение об ошибке, которое получают многие дети, а затем проверить, реже ли с этой ошибкой сталкиваются дети постарше.
    Мы можем использовать такие сведения для улучшения Hedy в будущем, например в исследованиях, которые помогают лучше понять, как люди учатся с Hedy. Результатами этих исследований мы делимся с преподавателями и исследователями на конференциях, в журналах и других публикациях.

    ### Связь
    Мы можем отправлять письма на предоставленный тобой адрес электронной почты для обслуживания пользователей или технической поддержки, чтобы сообщать о темах или материалах, которые могут тебя заинтересовать, а также о последних изменениях и новых функциях сайта.
    Если ты подпишешься на рассылку, мы также можем отправлять её на предоставленный тобой адрес электронной почты.

    ### Правовые основания
    В соответствии с правилами, действующими в Европейском союзе, мы обрабатываем твои персональные данные только при наличии законного основания, в том числе когда:

    Ты дал согласие на использование персональных данных, например для получения электронных рекламных сообщений;
    Твои персональные данные нужны нам для предоставления услуг, в том числе для регистрации учётной записи, ответа на твои обращения или поддержки пользователей;
    Мы обязаны использовать твои персональные данные по закону; или
    У нас есть законный интерес в использовании твоих персональных данных. В частности, у нас есть законный интерес в использовании персональных данных для персонализации услуг и подбора контента для тебя, проведения анализа, а также повышения безопасности, защищённости и производительности нашего сайта.

    ## Как Hedy передаёт мои персональные данные?
    Мы раскрываем сведения, собранные через сайт, третьим лицам только в том случае, если ты явно разрешил это при создании учётной записи или если мы обязаны сделать это по закону.

    ## Твои права и возможности выбора
    Ты можешь изменить пароль, адрес электронной почты и страну на странице настроек учётной записи. Также можно сбросить пароль на странице восстановления учётной записи. Имя пользователя изменить нельзя, но ты можешь создать новую учётную запись и вручную скопировать в неё свои проекты.
    Чтобы удалить учётную запись, войди в Hedy и нажми на своё имя пользователя в правом верхнем углу. Выбери «Мои личные настройки», затем нажми кнопку «Удалить учётную запись навсегда». Удаление учётной записи скрывает все сведения от публичного просмотра, но не удаляет все твои данные с наших серверов. Если ты хочешь удалить все свои данные с наших серверов, обратись за помощью по адресу hello@hedy.org.

    ## Рассылка
    Если в какой-то момент ты больше не захочешь получать нашу рассылку, следуй инструкциям по отмене подписки в любом из её выпусков.

    ## Твои права на защиту данных (ЕЭЗ)

    В некоторых юрисдикциях ты имеешь право запросить доступ к персональным данным, которые мы храним о тебе, и получить сведения о них; обновить свои персональные данные и исправить неточности; ограничить обработку персональных данных или возразить против неё; потребовать блокировки, обезличивания или удаления данных в зависимости от обстоятельств; а также воспользоваться правом на переносимость данных, чтобы легко передать свои персональные данные другой компании. В некоторых обстоятельствах эти права могут быть ограничены требованиями местного законодательства. Помимо перечисленных прав, ты также имеешь право подать жалобу в компетентный надзорный орган в соответствии с применимым законодательством.
    Когда этого требует закон, мы получаем твоё согласие на обработку определённых персональных данных, собираемых с помощью файлов cookie или аналогичных технологий, а также на другие действия по обработке, для которых может требоваться согласие. Если мы обрабатываем персональные данные на основании твоего согласия, ты имеешь право отозвать его в любое время и бесплатно. Отзыв согласия не влияет на законность обработки, выполненной до его отзыва.
    Чтобы изменить свои предпочтения, попросить удалить твои сведения из наших списков рассылки или направить запрос на осуществление своих прав по применимому законодательству, свяжись с нами способом, указанным ниже в разделе «Связаться с нами».

    ## Хранение данных
    Когда твои персональные данные больше не нужны для целей, ради которых мы их обрабатываем, мы принимаем меры для их удаления или хранения в форме, не позволяющей установить твою личность, если только закон не требует хранить их дольше. Определяя срок хранения, мы учитываем различные критерии: вид услуг, которые ты запросил или которые мы тебе предоставили, характер и продолжительность наших отношений, возможность повторной регистрации в наших сервисах, влияние удаления некоторых сведений от тебя или о тебе на предоставляемые тебе услуги, обязательные сроки хранения по закону и сроки исковой давности.

    ## Как команда Hedy защищает мои персональные данные?
    Команда Hedy применяет административные, физические и технические процедуры для защиты сведений, собираемых на сайте Hedy, от случайного или незаконного уничтожения, случайной утраты, несанкционированного изменения, раскрытия или доступа, неправомерного использования и любых других незаконных способов обработки персональных данных, находящихся в нашем распоряжении. Например, мы используем SSL/TLS для любой передачи данных и строго ограничиваем доступ к серверам Hedy и хранящимся на них данным. Однако, какими бы эффективными ни были эти меры, ни одна система защиты не является непроницаемой. Мы не можем полностью гарантировать безопасность наших баз данных или гарантировать, что предоставляемые тобой сведения не будут перехвачены при передаче нам через Интернет.

    ## Уведомления об изменениях Политики конфиденциальности
    Мы периодически пересматриваем меры безопасности и Политику конфиденциальности и при необходимости можем изменять наши правила. О существенных изменениях мы сообщим через сайт. Рекомендуем регулярно перечитывать нашу Политику конфиденциальности. Дата «Последнее обновление» внизу страницы показывает, когда эта Политика конфиденциальности была пересмотрена в последний раз. Продолжая пользоваться сайтом после внесения изменений, ты принимаешь обновлённую Политику конфиденциальности.

    ## Международная трансграничная передача данных
    Hedy находится в Нидерландах, но пользуется услугами по всему миру. Собранные нами сведения могут передаваться любому из наших поставщиков услуг и храниться у него. Эти поставщики могут находиться как внутри, так и за пределами Европейской экономической зоны, в том числе в США. Предоставляя свои персональные данные, ты соглашаешься на такую передачу.

    ## Как я могу помочь защитить конфиденциальность в Hedy?
    Пожалуйста, не указывай в коде личные контактные данные (например, имя, почтовый адрес, адрес электронной почты или номер телефона).

    ## Связаться с нами
    Stichting Hedy (регистрационный номер в Торговой палате Нидерландов 94013985) — организация, ответственная за обработку твоих персональных данных. Если у тебя есть вопросы об этой Политике конфиденциальности или ты хочешь воспользоваться своими правами в отношении персональных данных, напиши нам по адресу hello@hedy.org.

    Последнее обновление: ноябрь 2024
