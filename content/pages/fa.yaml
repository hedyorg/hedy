        level: ۲
        concepts_and_changes: |-
            در سطح ۱، دانش‌آموزان یاد گرفته‌اند که چگونه از متغیر `{answer}` استفاده کنند. در این سطح، آن‌ها یاد می‌گیرند که چگونه از چند متغیر استفاده کنند.
            این نخستین مفهوم انتزاعی برنامه‌نویسی است که با آن مواجه می‌شوند: نامی که نماینده‌ی مقداری است که می‌تواند تغییر کند.
            از آنجا که دانش‌آموزان می‌توانند از چندین متغیر استفاده کنند، باید نحوه‌ی تعریف آن‌ها را نیز بیاموزند.
            این بدان معناست که دستور `{ask}` تغییر کرده است و باید پیش از آن، متغیری که می‌خواهند پاسخ را در آن ذخیره کنند، قرار گیرد.

            موارد جدید در این سطح:

            *   ذخیره‌ی یک مقدار در متغیر با استفاده از `{is}`
            *   ذخیره‌ی پاسخِ یک پرسش در متغیری به انتخاب خودتان: `{is}` `{ask}` What is your name?
            *   ایجاد وقفه در برنامه با استفاده از `{sleep}`
            *   چرخاندن لاک‌پشتِ ترسیم‌گر به میزان مشخصی درجه: `{turn}` 90
