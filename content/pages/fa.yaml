    intro: شما می‌توانید از اشتباهات خود درس بگیرید، به‌ویژه در برنامه‌نویسی! اشتباه کردن اجتناب‌ناپذیر و فرصتی عالی برای یادگیری است، اما یافتن راه‌حل درست برای یک اشتباه می‌تواند برای معلمان چالش‌برانگیز باشد؛ به‌خصوص که با پیشرفت دانش‌آموزان در سطوح مختلف، برنامه‌ها نیز طولانی‌تر و پیچیده‌تر می‌شوند. به همین دلیل، ما فهرستی از اشتباهات رایج در هر سطح و راه‌حل‌های آن‌ها تهیه کرده‌ایم.
home-sections:
-   title: ساده‌ساز برنامه‌نویسی متنی!
    text: |-
        بسیاری از مدارس و معلمان در سراسر جهان می‌خواهند به دانش‌آموزان خود برنامه‌نویسی آموزش دهند. در ابتدا این کار اغلب با ابزارهای بازیگوشانه، از ربات
         Bee-Bot گرفته تا Scratch Junior یا Scratch انجام می‌شود. پس از استفاده از چنین ابزارهایی، بچه‌ها اغلب می‌خواهند به زبان‌های برنامه‌نویسی متنی قدرتمندتر، مانند پایتون، روی آورند.

        با این حال، پایتون سخت است، زیرا فقط به زبان انگلیسی موجود است و زبان‌آموزان را ملزم می‌کند که مفاهیم پیچیده برنامه‌نویسی و نحو را به طور همزمان یاد بگیرند.
        هدی راه آسان برای شروع کار با زبان‌های برنامه‌نویسی متنی است! استفاده از هدی رایگان، متن‌باز و برخلاف هر زبان برنامه‌نویسی متنی دیگر از سه جهت است.

        1. هدی چندزبانه است، می‌توانید از هدی به زبان خودتان استفاده کنید.
        2. هدی تدریجی است، بنابراین می‌توانید هر بار یک مفهوم و نحو آن را یاد بگیرید.
        3. هدی برای کلاس درس ساخته شده است و به معلمان اجازه می‌دهد تا تجربه دانش‌آموزان خود را به طور کامل سفارشی کنند.
-   title: برنامه‌نویسی چندزبانه
    text: در حالی که تقریباً تمام زبان‌های برنامه‌نویسی متنی دارای کلمات کلیدی انگلیسی (مانند `for` یا `repeat`) هستند، Hedy را می‌توان با هر زبانی به کار برد! ما در حال حاضر از ۴۷ زبان مختلف، از جمله هلندی، اسپانیایی، عربی، ترکی، چینی و هندی پشتیبانی می‌کنیم. اگر زبان مورد نظر شما در دسترس نیست، همیشه می‌توانید ترجمه جدیدی را آغاز کنید.
-   title: یادگیری قدم به قدم
    text: یادگیری یک زبان برنامه‌نویسی می‌تواند دلهره‌آور باشد، زیرا زبان‌آموزان باید مفاهیم (مانند if-else یا حلقه‌ها) و قواعد نگارشی یا دستور زبان(مانند علامت‌های نقل‌قول یا پرانتزها) را به‌طور هم‌زمان بیاموزند. در «هدی» (Hedy)، مفاهیم ابتدا با حداقلِ قواعد نگارشی معرفی و سپس به‌تدریج تکمیل می‌شوند؛ روشی برای یادگیری که کارایی آن از نظر علمی اثبات شده است!
-   title: مخصوص کلاس درس
    text: |-
        Hedy برای کودکان ۱۰ سال به بالا مناسب است و برای استفاده در کلاس درس طراحی شده است.
        معلمان می‌توانند از طرح‌درس‌های رایگان و داخلی ما استفاده کنند، و همچنین قادرند درس‌های اختصاصی خود را تدوین کرده و در رابط کاربری Hedy بارگذاری نمایند.
-   text: «هدی» (Hedy) برنامه‌نویسی را به گسترده‌ترین شکل ممکن ارائه می‌دهد و می‌توان از آن به شیوه‌هایی متنوع و جذاب استفاده کرد. این ابزار امکان خلق داستان‌های دیجیتال و تعاملی و همچنین ترسیم نقاشی‌های رنگارنگی را فراهم می‌آورد که نه‌تنها در صفحه نمایش قابل‌مشاهده‌اند، بلکه می‌توان آن‌ها را با دستگاه پلاتر ترسیم یا روی پیراهن گلدوزی کرد؛ علاوه بر این، می‌توان از آن برای ساخت بازی‌ها یا برنامه‌هایی با دکمه‌ها و عملکردهای صفحه‌کلید بهره برد.
    title: برنامه‌نویسی در بستر کاربردی
-   title: آیا هدی رایگان است؟
    text: |-
        بله! «هدی» (Hedy) یک پروژه «متن‌باز» (Open source) است؛ به این معنا که همه می‌توانند در بهبود آن به ما کمک کنند.
        شما می‌توانید کدهای ما را در <a href="https://github.com/hedyorg/hedy" target="_blank">گیت‌هاب (GitHub)</a> مشاهده کنید.
        اگر هدی را دوست دارید و می‌خواهید در آن مشارکت کنید، ما از <a href="https://github.com/sponsors/hedyorg" target="_blank">کمک مالی</a> شما استقبال می‌کنیم و بابت آن بسیار سپاسگزاریم!
        ما از این مبالغ برای فعال نگه داشتن سرور و همچنین نگهداری و بهبود وب‌سایت هدی استفاده می‌کنیم.
-   title: آیا باید برنامه‌ای را نصب کنم؟
    text: خیر. «هدی» (Hedy) در مرورگر اجرا می‌شود؛ یعنی همان برنامه‌ای که برای مشاهده‌ی این صفحه از آن استفاده می‌کنید. احتمالاً کروم، اج یا فایرفاکس. هدی روی گوشی‌ها و تبلت‌ها نیز کار می‌کند.
-   title: آیا برای تدریس با Hedy به تجربه برنامه‌نویسی نیاز دارم؟
    text: |-
        خیر، نیازی  نیست. تمام مفاهیم در اسلایدها و در رابط کاربریِ مخصوصِ فراگیران توضیح داده شده‌اند.
        اگر یک حساب کاربری معلمی رایگان ایجاد کنید، به راهنمای معلم نیز دسترسی خواهید داشت؛ راهنمایی که حاوی اطلاعاتی درباره نحوه تدریس
         و اشتباهات رایج است.
join-sections:
-   title: حمایت از هدی
    text: '# سه راه برای حمایت از هدی وجود دارد!'
-   title: بهبود زبان
    text: |-
        ماهیت تدریجی و چندزبانهٔ «هدی» (Hedy) چالش‌های فنی جالب‌توجهی را به وجود می‌آورد.
        این موارد را در <a href="https://github.com/hedyorg/hedy/issues?q=is%3Aopen+is%3Aissue+label%3Alanguage" target="_blank">گیت‌هاب</a> (GitHub) مشاهده کنید.
-   title: ترجمه هدی
    text: |-
        برنامه‌نویس نیستید؟ مشکلی نیست! راه دیگر برای حمایت از Hedy، <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">ترجمه کلمات کلیدی، پیام‌های خطا، ماجراجویی‌ها و سایر محتواها</a> است.
        این وضعیت فعلی است؛ به ما کمک کنید تا ترجمه یک زبان را تکمیل کنیم یا زبانی جدید اضافه نماییم!
        <a href="https://hosted.weblate.org/engage/hedy/">
        <img src="https://hosted.weblate.org/widgets/hedy/-/multi-auto.svg" alt="وضعیت ترجمه" /></a>
-   title: به معلمان کمک کنید کار خود را آغاز کنند
    text: |-
        Hedy به‌گونه‌ای طراحی شده است که به معلمان در ارائه درس‌های برنامه‌نویسی در کلاس کمک کند. ما امکانات ویژه‌ای برای معلمان در نظر گرفته‌ایم؛ از جمله قابلیت ایجاد کلاس، شخصی‌سازی آن و مشاهده وضعیت پیشرفت دانش‌آموزان.
        اگر Hedy را می‌پسندید، می‌توانید با مدارسی که می‌شناسید ارتباط برقرار کنید و به معلمان کمک کنید تا کار با آن را آغاز کنند! ما می‌توانیم از طریق <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord</a> در یافتن مدارس یا معلمان به شما کمک کنیم.
learn-more-sections:
-   title: بنیاد هدی
    text: |-
        پشتیبانی و اداره‌ی «هدی» (Hedy) بر عهده‌ی «بنیاد هدی» (Stichting Hedy) است که در نشانی Catharina van Clevelaan 10, 1181BH Amstelveen مستقر بوده و شماره ثبت آن در اتاق بازرگانی هلند ۹۴۰۱۳۹۸۵ می‌باشد.

        اعضای هیئت‌مدیره‌ی این بنیاد عبارت‌اند از:

        * فلی‌ین هرمانز (Felienne Hermans)، رئیس
        * آنلیس فلار (Annelies Vlaar)، مسئول امور مالی
        * رنه مِربیس (Renée Merbis)، دبیر

        اعضای هیئت‌مدیره‌ی بنیاد هدی بابت فعالیت‌های خود هیچ‌گونه دستمزد یا پاداش مالی دریافت نمی‌کنند. ما از هرگونه کمک مالی به هدی استقبال می‌کنیم! این کمک‌ها صرفِ فعال نگه داشتن سرور و همچنین نگهداری و بهبود وب‌سایت هدی می‌شود. برای اهدای کمک به یورو <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">اینجا کلیک کنید</a> و یا برای اهدای کمک به دلار آمریکا <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">اینجا کلیک کنید</a>.
-   title: یک بررسی عمیق و دقیق!
    text: |-
        اگر می‌خواهید درباره فلسفه و طراحی «هدی» (Hedy) بیشتر بدانید، نگاهی به سخنرانی «فلی‌ین» (Felienne) در کنفرانس StrangeLoop سال ۲۰۲۲ بیندازید:

        <iframe width="560" height="315" class="mx-auto mt-4" src="https://www.youtube.com/embed/fmF7HpU_-9k?wmode=opaque" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen=""></iframe>
