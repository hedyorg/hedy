title: مستندات هدی
teacher-guide:
-   title: مقدمه
    key: مقدمه
    subsections:
    -   title: هدی چیست؟
        text: |-
            «هدی» (Hedy) یک زبان برنامه‌نویسی متنی است که به‌طور ویژه برای نوجوانان (و افراد در آستانه نوجوانی، یعنی ۱۰ تا ۱۵ سال) طراحی شده است.
            برخلاف زبان‌های برنامه‌نویسی مخصوص کودکان مانند «اسکرچ» (Scratch)، هدی به‌جای بلوک‌های کد، از کد متنی استفاده می‌کند.
            بنابراین با هدی یاد می‌گیرید که چگونه مانند برنامه‌نویسان واقعی کدنویسی کنید؛ البته این کار در قالب گام‌های کوچک و تمرین‌های سرگرم‌کننده انجام می‌شود.
            به این ترتیب، هدی می‌تواند به شیوه‌ای در دسترس و عمدتاً لذت‌بخش، به عنوان پلی برای ورود به دنیای زبان‌های برنامه‌نویسی واقعی مانند «پایتون» (Python) عمل کند!
            اگر می‌خواهید اطلاعات بیشتری کسب کنید، می‌توانید این <a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">ویدیو</a> را درباره روند توسعه هدی به عنوان یک زبان برنامه‌نویسی تماشا کنید.
    -   title: مخاطب هدف
        text: |-
            هدی (Hedy) با در نظر گرفتن دانش‌آموزان مقطع راهنمایی و متوسطه اول (سنین ۱۰ تا ۱۵ سال) طراحی شده است، اما هر کسی که بخواهد برنامه‌نویسی یاد بگیرد، می‌تواند از آن استفاده کند!
            توانایی خواندنِ مناسب برای دانش‌آموزان حائز اهمیت است. توصیه می‌کنیم تا زمانی که دانش‌آموزان به سطح خواندنِ کلاس سوم دبستان نرسیده‌اند، کار با هدی را آغاز نکنند.
            دانش‌آموزان (و معلمان!) برای شروع کار با هدی، نیازی به هیچ‌گونه تجربه قبلی در زمینه برنامه‌نویسی ندارند.
    -   title: هدی (Hedy) چگونه کار می‌کند؟
        text: |-
            «هدی» (Hedy) به سطوح مختلفی تقسیم شده است که در آن‌ها دستورات و مفاهیم جدید برنامه‌نویسی آموزش داده می‌شود. هر سطح شامل ماجراجویی‌های متنوعی برای تمرین دستوراتِ تازه آموخته‌شده است.
            هدی از سه بخش تشکیل شده است: مقدماتی (Basic)، پیشرفته (Advanced) و تخصصی (Expert). در بخش مقدماتی هدی (سطوح ۱ تا ۸)، می‌توانید مفاهیم ساده و جذاب کدنویسی مانند چاپ کردن (خروجی)، دریافت ورودی، استفاده از متغیرهای ساده و تکرار را کاوش کنید. در بخش پیشرفته هدی (سطوح ۹ تا ۱۲)، دانش‌آموزان گامی فراتر می‌گذارند و با مفاهیم پیچیده‌تری مانند حلقه‌ها، ساختارهای تودرتو و توابع آشنا می‌شوند. بخش تخصصی هدی (سطوح ۱۳ تا ۱۶) به گونه‌ای طراحی شده است که گذاری روان به سینتکس (ساختار دستوری) کامل پایتون ایجاد کند.
            بنابراین، هدی برای هر هدفی که برای دانش‌آموزان خود در نظر دارید، مناسب است؛ چه بخواهید صرفاً لذت کدنویسی را به آن‌ها بچشانید، چه مفاهیم پایه را آموزش دهید و چه آن‌ها را برای کار با سینتکس واقعی پایتون آماده کنید.

            شما به عنوان معلم، نه تنها می‌توانید تعیین کنید که کدام سطوح برای دانش‌آموزان در دسترس باشد، بلکه می‌توانید انتخاب کنید که در هر سطح، چه ماجراجویی‌هایی ارائه شود. آیا آن‌ها قرار است یک رستوران، یک ماشین‌حساب یا یک خانه ارواح بسازند؟ در هر سطح، ماجراجویی‌ها از آسان به دشوار مرتب شده‌اند، اما شما می‌توانید آن‌ها را به هر شکلی که برای دانش‌آموزانتان مناسب‌تر است، ترکیب و تنظیم کنید.
            دانش‌آموزان می‌توانند این ماجراجویی‌ها را به صورت انفرادی انجام دهند، اما ما توصیه می‌کنیم از آن‌ها در قالب روش‌های تدریس کلاسی استفاده کنید.

            این ماجراجویی‌ها شامل نمونه‌کد و پاسخ‌های پیشنهادی نیز هستند تا اطمینان حاصل شود که معلمانی که دانش دیجیتال کمتری دارند هم می‌توانند از هدی استفاده کنند!
            البته هدی برای معلمان خلاقی که دوست دارند طرح درس و ماجراجویی‌های مخصوص خودشان را طراحی کنند نیز مناسب است!

            شما می‌توانید عملکرد و پیشرفت دانش‌آموزان خود را در صفحه کلاس مشاهده و پیگیری کنید.
    -   title: دستگاه‌های تحت پشتیبانی
        text: |-
            Hedy مبتنی بر وب است؛ به این معنا که روی هر دستگاهی که مرورگر داشته باشد (مانند Google Chrome، Firefox، Edge و غیره) اجرا می‌شود. بنابراین لپ‌تاپ‌ها، کروم‌بوک‌ها، تبلت‌ها و حتی گوشی‌های هوشمند برای استفاده از Hedy مناسب هستند.
            برای کار با Hedy نیازی به دانلود هیچ‌گونه نرم‌افزاری نیست؛ کافی است به وب‌سایت آن مراجعه کنید و کارتان را شروع کنید!
            همچنین یک <a href="https://github.com/hedyorg/hedy/wiki/Offline-Hedy " target="_blank">نسخه آفلاین</a> از Hedy نیز در دسترس است.
    -   title: جامعه هدی
        text: |-
            از همه معلمان، برنامه‌نویسان و سایر علاقه‌مندان به Hedy دعوت می‌کنیم تا به <a href="https://discord.gg/8yY7dEme9r" target="_blank">سرور دیسکورد (Discord)</a> ما بپیوندند. اینجا مکانی عالی برای گفتگو درباره Hedy است: ما کانال‌هایی برای نمایش پروژه‌ها و درس‌های جذاب شما، کانال‌هایی برای گزارش باگ‌ها و کانال‌هایی برای گفتگو با سایر معلمان و تیم Hedy داریم.
            در <a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">اینجا</a> می‌توانید ویدیویی درباره نحوه پیوستن به جامعه دیسکورد ما مشاهده کنید.

            همچنین می‌توانید با <a href="https://hedy.org/subscribe" target="_blank">عضویت در خبرنامه</a> ما، از آخرین اخبار Hedy مطلع شوید یا ما را در <a href="https://nl.linkedin.com/company/hedyorg" target="_blank">لینکدین</a> دنبال کنید.
    -   title: هدی و مقررات عمومی حفاظت از داده‌ها (GDPR)
        text: |-
            سازمان‌ها در اتحادیه اروپا هنگام پردازش داده‌های شخصی ملزم به رعایت مقررات عمومی حفاظت از داده‌ها (GDPR) هستند.
            از آنجا که این موضوع برای بسیاری از مدارس پیچیده است، شما می‌توانید بدون به اشتراک‌گذاری داده‌های شخصی، از تمامی قابلیت‌های برنامه‌نویسی Hedy استفاده کنید.
            ساده‌ترین روش برای این کار، استفاده از Hedy بدون ایجاد حساب کاربری برای معلم و دانش‌آموزان است. در این حالت Hedy در دسترس خواهد بود، اما بدون پنل مدیریتی ویژه معلم. بنابراین، امکان پیگیری پیشرفت دانش‌آموزان یا تعیین اینکه کدام «ماجراجویی‌ها» (adventures) و سطوح برای آن‌ها در دسترس باشد، وجود نخواهد داشت. اگرچه این روش محدودیت‌هایی دارد، اما مدارسی هستند که از Hedy به همین شیوه استفاده می‌کنند.

            روش دوم این است که معلم با استفاده از یک آدرس ایمیل که حاوی اطلاعات شخصی نباشد (برای مثال "docent25@email.com")، یک حساب کاربری ایجاد کند. به جز آدرس ایمیل که صرفاً برای بازنشانی رمز عبور مورد نیاز است، هنگام ایجاد حساب کاربری معلم نیازی به ارائه هیچ‌گونه اطلاعات دیگری نیست.
            با داشتن حساب کاربری معلم، می‌توانید حساب‌های ناشناس برای دانش‌آموزان ایجاد کنید؛ برای مثال: rainbow-student1، rainbow-student2 و غیره (برای مشاهده راهنمای دقیق، به بخش «آمادگی‌های تدریس» مراجعه کنید). بدین ترتیب می‌توانید بدون به اشتراک‌گذاری داده‌های شخصی خود یا دانش‌آموزانتان، از تمامی قابلیت‌های Hedy، از جمله ذخیره‌سازی روند پیشرفت، بهره‌مند شوید.

            اگر روش‌های فوق برای شرایط شما کافی نیست، می‌توانیم برای پردازش داده‌های شخصی شما، یک «توافق‌نامه پردازش داده» منعقد کنیم.
    -   title: حمایت از هدی
        text: برای تداوم فعالیت Hedy به کمک شما نیاز داریم. ما از این کمک‌های مالی برای فعال نگه داشتن سرور و همچنین نگهداری و بهبود وب‌سایت Hedy استفاده می‌کنیم. از هرگونه کمک مالی به Hedy سپاسگزاریم! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">برای اهدای کمک به یورو اینجا کلیک کنید</a> یا <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">برای اهدای کمک به دلار آمریکا اینجا کلیک کنید</a>. با تشکر!
-   levels:
    -   sections:
        -   example:
                error_text: برای مثال، آن‌ها جمله‌ای را بدون استفاده از دستور چاپ (print) تایپ می‌کنند.
                error_code: هدی نمی‌تواند این را چاپ کند.
                solution_text: به دانش‌آموزان خود بیاموزید که همیشه خط کد را با یک دستور آغاز کنند.
                solution_code: '{چاپ} هدی می‌تواند این را چاپ کند!'
            title: دانشجویان فراموش می‌کنند دستورات را تایپ کنند.
        -   example:
                error_text: اگر دستورات با حروف بزرگ انگلیسی نوشته شوند، کار نخواهند کرد.
                error_code: |-
                    Ask چرا کدم با خطا مواجه می‌شود؟
                    Print چون از حروف بزرگ استفاده می‌کنم.
                solution_text: حروف بزرگ را حذف کنید.
                solution_code: |-
                    {ask} چرا کدم الان کار می‌کند؟
                    {print} چون حروف بزرگ را حذف کردم!
            title: دانش‌آموزان هنگام تایپ دستورات از حروف بزرگ انگلیسی استفاده می‌کنند.
        -   example:
                error_text: دستور answer برای تکرار پاسخ پس از دستور ask به کار می‌رود؛ بدون دستور ask، دستور answer هیچ کاری انجام نمی‌دهد.
                error_code: '{print} نام شما {answer} است'
                solution_text: برای اینکه کار کند، یک دستور ask اضافه کنید.
                solution_code: |-
                    {ask} نام شما چیست؟
                    {print} نام شما {answer} است.
            title: دانش‌آموزان بدون ask، از answer استفاده می‌کنند.
        -   example:
                error_text: دانش‌آموزان اغلب هنگام کار با «لاک‌پشت» (Turtle) دوست دارند اعداد بزرگ را امتحان کنند؛ کاری که باعث می‌شود نشان‌گر لاک‌پشت از صفحه خارج شود.
                error_code: |-
                    {forward} ۳۰۰
                    {turn} ۹۰
                solution_text: در این مثال، دانش‌آموزان معمولاً تصور می‌کنند که دستور چرخش با شکست مواجه شده است، در حالی که آن دستور دقیقاً همان کاری را انجام داده که قرار بوده انجام دهد. ماجرا این است که لاک‌پشت از محدوده صفحه نمایش عبور کرده است. برای جلوگیری از بروز این مشکل، از اعداد کوچک‌تری استفاده کنید.
                solution_code: |-
                    {forward} ۱۰۰
                    {turn} ۹۰
            title: 'لاک‌پشت: دانش‌آموزان اجازه می‌دهند لاک‌پشت از صفحه خارج شود.'
        -   example:
                error_text: «backward» یک دستور نیست.
                solution_text: 'برای اینکه لاک‌پشت به عقب حرکت کند، از دستور حرکت به جلو و یک عدد منفی استفاده می‌کنید. برای مثال:'
                error_code: backward ۱۰۰
                solution_code: '{forward} -۱۰۰'
            title: 'لاک‌پشت: دانش‌آموزان از دستور backward استفاده می‌کنند، اما چنین دستوری وجود ندارد.'
        level: ۱
        concepts_and_changes: |-
            در سطح ۱، دانش‌آموزان نخستین خطوط کد خود را می‌نویسند و اجرا می‌کنند. در این مرحله نیازی نیست نگران علائم نگارشی باشند: هر خط با یک دستور آغاز می‌شود و بقیه آن شامل متن ساده است. هدف اصلی این درس، انتقال این مفهوم است که رایانه دقیقاً همان کاری را انجام می‌دهد که به آن می‌گویید؛ نه کمتر و نه بیشتر.

            موارد جدید در این سطح:

            *   نمایش متن روی صفحه با استفاده از `{print}`
            *   پرسیدن سؤال با `{ask}` و استفاده از پاسخ دریافتی با `{answer}`
            *   رسم شکل با استفاده از «لاک‌پشت» (turtle) و دستورهای `{forward}` و `{turn}`
            *   پخش نت موسیقی با استفاده از `{play}`
    -   sections:
        -   example:
                error_text: هدی نمی‌تواند دستوری را که غلط املایی دارد، تشخیص دهد.
                error_code: prinnt غلط املایی نداشته باشید.
                solution_text: به دانش‌آموزان خود یاد بدهید که پیام‌های خطا را بخوانند. به این ترتیب، خودشان می‌توانند بفهمند که چه مشکلی پیش آمده است.
                solution_code: غلط املایی نداشته باشید. {print}
            title: دانشجویان در دستورهای خود دچار غلط‌های تایپی می‌شوند.
        -   example:
                error_text: در این سطح، دانش‌آموزان با مفهوم متغیرها آشنا می‌شوند. دستور ask نیز به یک متغیر نیاز دارد، اما دانش‌آموزان این نکته را فراموش می‌کنند.
                error_code: ask چه چیزی دوست دارید بخورید.
                solution_text: در این مرحله باید به «هدی» (Hedy) بگویید که پاسخ شما را کجا ذخیره کند تا بتوان بعداً از آن استفاده کرد. به این کار تعریف «متغیر» می‌گویند.
            title: دانشجویان فراموش می‌کنند که دستور ask تغییر کرده است.
