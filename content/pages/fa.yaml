start-sections:
-   title: آغاز کار با هدی
    text: |-
        به Hedy خوش آمدید؛ خوشحالیم که می‌توانیم در شروع کار با Hedy به شما کمک کنیم.

        [راهنمای معلمان](https://www.hedy.org/for-teachers/manual) ما شامل شرح دقیقی از تمام قابلیت‌های هدی است، اما این صفحه مرور مختصری بر این قابلیت‌ها انجام می‌دهد تا پیش از شروع کار، با کلیات آن آشنا شوید.

        چند نکته کلیدی که دانستن آن‌ها مفید است:
        *   Hedy ابزاری است که برای مدیریت کلاس‌های آموزش برنامه‌نویسی به کودکان طراحی شده است! شما می‌توانید کلاس‌ها و طرح‌درس‌های خود را ایجاد کنید و روند پیشرفت دانش‌آموزان را زیر نظر داشته باشید.
        *   برای شروع کار نیازی به دانش عمیق برنامه‌نویسی ندارید؛ Hedy به‌صورت گام‌به‌گام پیش می‌رود و کار را برای شما هم آسان می‌کند!
        *   می‌توانید از Hedy به زبان مادری خود استفاده کنید، زیرا این ابزار به زبان‌های بسیاری ترجمه شده است!
        *   هر کودکی می‌تواند برنامه‌نویسی کند! Hedy به‌ویژه برای کودکانی که مشکلات بینایی دارند بسیار مفید است، چرا که می‌تواند محتوا را بدون نیاز به استفاده از ماوس، با صدای بلند برای آن‌ها بخواند.
        *   ما برای کمک به شما اینجا هستیم؛ می‌توانید با ما در [Discord](https://discord.gg/8yY7dEme9r) در ارتباط باشید یا به آدرس (hello@hedy.org) [ایمیل بزنید].
-   title: نظر معلم‌ها درباره هدی
    text: |-
        معلمان بسیاری در سراسر جهان اشتیاق خود را نسبت به «هدی» (Hedy) ابراز کرده‌اند؛ در اینجا به برخی از نظرات آن‌ها اشاره می‌کنیم:

        *بسیار الهام‌بخش! روشی فوق‌العاده برای اینکه برنامه‌نویسی را هم برای خودتان و هم برای دانش‌آموزان بسیار ساده‌تر کنید. کار با آن بسیار لذت‌بخش است و پتانسیل بالایی برای استفاده در کلاس درس دارد. به نظرم ابزار بسیار خوبی است! معتقدم این روشی ارزشمند برای شروع یادگیری برنامه‌نویسی توسط کودکان است. پایتون و کدنویسی همیشه هیجان‌انگیز بوده‌اند، اما موانع یادگیری آن‌ها نیز بسیار زیاد بوده است. حالا این موانع تا حدی کاهش یافته و مشخص شده که یادگیری آن در واقع می‌تواند بسیار آسان باشد. از دیدن اینکه «هدی» برنامه‌نویسی را تا حد امکان برای کاربران در دسترس و آسان می‌کند، لذت بردم!*
        هلند: معلمان ریاضی در حال آموزش (مقطع متوسطه)

        *رابط کاربری ساده و مثال‌های خوب.* معلم: پایه‌های سوم تا ششم (ابتدایی)

        *برنامه‌نویسی چندزبانه و تدریجی به معنای دقیق کلمه.* ایالات متحده: مقطع راهنمایی (Middle School)، پایه‌های ششم تا هشتم

        *ماهیت تدریجیِ آموزش برنامه‌نویسی.* استرالیا: دبیرستان

        *ادامه یافتن خودکارِ روند آموزش.* هلند: پایه دوم HAVO-VWO

        *هم امکان ارائه توضیحات به زبان هلندی (در حالی که کدها به زبان انگلیسی هستند) و هم اینکه سطح کار با افزودن امکانات بیشتر، به‌تدریج ارتقا می‌یابد.* هلند: گروه کلاس‌های پیشرفته (Plus class)

        *اما «هدی» و سطوح تدریجی آن... چه ایده فوق‌العاده‌ای؛ می‌خواستم شخصاً بابت خلق این اثر از شما تشکر کنم. نمی‌دانم چگونه سپاسگزاری کنم. همچنین، هرگز چنین سطح بالایی از مشارکت و اشتیاق را که با «هدی» شاهد آن بودم در دانش‌آموزانم ندیده بودم . ما تا سطح ۵ پیش رفته‌ایم و قصد داریم پیش از شروع پایتون، یک هفته دیگر را نیز در کلاس‌ها و آزمایشگاه‌ها به آن اختصاص دهیم.* پاکستان

        *«واقعی بودن» برنامه‌نویسی؛ اینکه شبیه به دنیای واقعیِ کدنویسی است.* هلند: گروه کلاس‌های پیشرفته (Plus class)، پایه‌های ۴ تا ۸

        *فعالیت‌های گام‌به‌گام و سرگرم‌کننده.* هلند: پایه اول (تمام سطوح)، پایه دوم (VWO/HAVO و VWO+)، پایه سوم (HAVO و VWO)

        *من واقعاً «هدی» را دوست دارم؛ ساختار آن نیز بسیار خوب طراحی شده و همین امر استفاده از آن را در مقطع ابتدایی مناسب می‌سازد.* رویکرد تدریجی «هدی» (Hedy) بسیار کارآمد است. توضیحات مختصر در ابتدای هر مرحله و نمونه‌برنامه‌های کوتاه، به کودکان کمک می‌کند تا به‌سرعت با مفاهیم جدیدِ آن مرحله آشنا شوند. تنوع تکالیف و امکان انتخاب آن‌ها توسط کودکان نیز بسیار مؤثر است؛ کودکان تکالیفی را که برایشان جذاب است انتخاب می‌کنند و سپس در طول مراحل مختلف، روی آن‌ها کار می‌کنند. «هدی» برای کودکانی که در برنامه‌نویسی مهارت دارند و می‌خواهند تجربه‌ای از کار با یک زبان برنامه‌نویسی واقعی داشته باشند، بسیار سرگرم‌کننده است. این ابزار، آمادگی مناسبی برای دوران دبیرستان (به‌ویژه با توجه به گسترش آموزش فناوری اطلاعات و ارتباطات در آن مقطع) فراهم می‌کند.* هلند: مدرسه مونته‌سوری اوگست‌گیست (Oegstgeest)

        *ساختار آن بسیار عالی است.* هلند: مدرسه متوسطه (سطح HAVO-VWO)

        *می‌توانم همگام با سرعت کلاس پیش بروم.* هلند: گروه‌های ۷ و ۸

