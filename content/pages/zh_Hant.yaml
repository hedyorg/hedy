                error_text: 縮排是這個等級的新概念，有些學生可能不容易理解。請先讓他們練習幾個簡單範例，再使用縮排編寫完整程式。
                error_code: |-
                    {repeat} 3 {times}
                    {print} '哈囉'
                solution_text: 以下是正確的程式碼：
