                    {repeat} 3 {times}
                        {print} '哈囉'
            title: 學生使用了錯誤的縮排
        -   example:
                error_text: 例如在下方程式碼中，學生想記下 3 個人的飲料訂單，但程式只是問了 3 次，最後只記下一份訂單。
                error_code: |-
                    {repeat} 3 {times}
                        飲料 = {ask} '你想喝什麼？'
                    {print} 飲料
                solution_text: |-
                    在正確的程式碼中，第三行開頭也有縮排。這樣第三行才會屬於 repeat 區塊，並一起重複 3 次。
                    向學生展示這些差異，能幫助他們理解為什麼程式需要縮排才能正常運作。
                solution_code: |-
                    {repeat} 3 {times}
