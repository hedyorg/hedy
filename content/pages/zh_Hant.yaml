start-sections:
-   title: 開始使用 Hedy
    text: |-
        歡迎使用 Hedy，我們很樂意協助你開始！

        我們的[教師手冊](https://www.hedy.org/for-teachers/manual) 詳細介紹所有功能，而這個頁面提供簡短總覽，讓你在深入探索前先了解各項功能。

        以下是幾個重要特色：
        * Hedy 是協助管理兒童程式設計課堂的工具！你可以建立自己的班級和教案，也能查看孩子的學習情況。
        * 開始時不需要具備很多程式設計知識；Hedy 也會帶著教師循序漸進地學習！
        * Hedy 已翻譯成多種語言，因此你可以使用自己的母語。
        * 每個孩子都能寫程式！Hedy 對視覺不便的孩子特別有幫助，因為它能朗讀教材，不必使用滑鼠。
        * 我們隨時願意協助。你可以在 [Discord](https://discord.gg/8yY7dEme9r) 找到我們，也可以[寄電子郵件](hello@hedy.org)給我們。
-   title: 教師談 Hedy
    text: |-
        世界各地有許多教師表達了對 Hedy 的喜愛。以下是部分教師與我們分享的心得：

        *非常有啟發性！這是一個很棒的方法，能讓自己和學生都更容易接觸程式設計。玩起來很有趣，也很有潛力運用在學生身上。我認為這是很好的工具！我相信，這是孩子開始學習程式設計的好方法。Python 和寫程式一直都很吸引人，但入門門檻非常高。現在門檻降低了，也讓人知道寫程式其實可以很容易。我很高興看到 Hedy 努力讓所有使用者都能輕鬆接觸程式設計！*
        荷蘭：受訓中的中學數學教師

        *介面簡單，範例也很好。* 教師：小學三至六年級

        *多語言程式設計，以及漸進式程式設計這個概念本身。* 美國：中學六至八年級

        *以漸進方式介紹程式設計。* 澳洲：高中

        *會自動接續。* 荷蘭：HAVO-VWO 二年級

        *說明可以使用荷蘭文（程式碼則使用英文），而且功能會逐步增加。* 荷蘭：進階班級

        *Hedy 和它的漸進等級……真是了不起的點子。我想親自感謝你們創造了它，真的非常感謝。我也從未看過學生展現出像使用 Hedy 時這麼高的投入和熱情。我們已教到第 5 級，準備在課堂和實驗課再用一週，接著才開始學 Python。* 巴基斯坦

        *它很有「真正寫程式」的感覺，和實際的程式設計很相似。* 荷蘭：四至八年級進階班級

        *循序漸進的活動，而且活動很有趣。* 荷蘭：各程度一年級、VWO/HAVO 二年級、VWO+ 二年級、HAVO 三年級、VWO 三年級

        *我非常喜歡 Hedy，它的設計也很完善，很適合在小學使用。Hedy 的漸進式方法效果很好。每個等級開頭的簡短說明和小範例，能幫助孩子快速了解這個等級的新內容。孩子可以自行選擇不同作業，這點也很有效。你會看到孩子挑選自己感興趣的作業，然後逐級完成。對於擅長程式設計、想體驗真正程式語言的孩子來說，Hedy 非常有趣。等中學提供更多資訊科技教育時，這也會是很好的準備。* 荷蘭：Oegstgeest 蒙特梭利學校

        *整體安排得非常好。* 荷蘭：HAVO-VWO 初中

        *我可以掌握全班的學習進度。* 荷蘭：七、八年級

        ![Felienne 教孩子寫程式](/images/teacherfeedback/Fkids1.JPG) *Felienne 教孩子寫程式*        ![孩子學習 Hedy](/images/teacherfeedback/Fkids2.JPG) *孩子學習 Hedy*
