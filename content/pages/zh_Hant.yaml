        -   example:
                error_text: |-
                    我們發現學生常犯一個錯誤：他們嘗試製作檢查密碼的程式，卻把密碼設成 password。
                    在第 2 行，電腦會檢查變數 password 是否等於變數 password，也就是拿它和自己比較。因此答案永遠都是「是」。
                    所以不論玩家輸入什麼，這段程式碼的結果永遠都是「你可以進來」。
                error_code: |-
                    密碼 {is} {ask} '密碼是什麼？'
                    {if} 密碼 {is} 密碼
                        {print} '你可以進來'
                    {else}
                        {print} '你不能進來'
                solution_text: 加上引號就能修正這個錯誤。這樣電腦才知道 `{if} password {is} 'password'` 中第二個 `password` 是字串值（也就是一般文字），而不是變數名稱。
                solution_code: |-
                    密碼 {is} {ask} '密碼是什麼？'
                    {if} 密碼 {is} 'password'
                        {print} '你可以進來'
                    {else}
                        {print} '你不能進來'
            title: 學生用 `{if}` 指令檢查變數值是否和變數名稱相同
