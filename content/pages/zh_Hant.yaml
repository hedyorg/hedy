                error_text: 縮排對學生來說常常很難。
                error_code: |-
                    回答 = 0
                    {while} 回答 != 25
                    回答 = {ask} '5 乘以 5 是多少？'
                    {print} '答對了'
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    回答 = 0
                    {while} 回答 != 25
                        回答 = {ask} '5 乘以 5 是多少？'
                    {print} '答對了'
            title: 學生忘了在 `while` 迴圈中縮排
        level: '15'
    -   sections:
        -   example:
                error_text: 從這個等級開始，清單必須放在方括號中。
                error_code: |-
                    冰淇淋 = '草莓', '巧克力'
                    {print} '我喜歡' 冰淇淋[{random}] '冰淇淋'
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    冰淇淋 = ['草莓', '巧克力']
                    {print} '我喜歡' 冰淇淋[{random}] '冰淇淋'
            title: 學生忘了使用方括號
        -   example:
                error_text: 從這個等級開始，清單必須放在方括號中。
                error_code: |-
                    icecream = ('草莓', '巧克力')
                    {print} '我喜歡' icecream[{random}] '冰淇淋'
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    冰淇淋 = ['草莓', '巧克力']
                    {print} '我喜歡' 冰淇淋[{random}] '冰淇淋'
            title: 學生使用了錯誤的括號
        -   example:
                error_text: 學生有時太專注於新的語法規則，而忘了加上引號。
                error_code: |-
                    icecream = [草莓, 巧克力]
                    {print} '我喜歡' icecream[{random}] '冰淇淋'
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    冰淇淋 = ['草莓', '巧克力']
                    {print} '我喜歡' 冰淇淋[{random}] '冰淇淋'
            title: 學生專注在括號上，忘了加引號
        -   example:
                error_text: 學生有時會太專注於新的語法，而忘了加上引號。
                error_code: |-
                    icecream = [草莓, 巧克力]
                    {print} '我喜歡' icecream at random '冰淇淋'
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    冰淇淋 = ['草莓', '巧克力']
                    {print} '我喜歡' 冰淇淋[{random}] '冰淇淋'
            title: 學生仍在使用舊的 `at random` 指令
        -   example:
                error_text: 學生有時太專注於新的語法規則，而忘了加上引號。
                error_code: |-
                    冰淇淋 = [草莓, 巧克力]
                    {print} '我喜歡' 冰淇淋[{random}] '冰淇淋'
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    icecream = ['草莓', '巧克力']
                    {print} '我喜歡' icecream[{random}] '冰淇淋'
            title: 學生專注在括號上，忘了加引號
        level: '16'
    -   sections:
        -   example:
                error_text: '`{elif}` 指令後面必須有條件，不能像 `{else}` 一樣在沒有條件時使用。'
                error_code: |-
                    顏色 = ask '你最喜歡什麼顏色？'
                    {if} 顏色 == '綠色':
                        {print} '綠色很漂亮'
                    {elif}:
                        {print} '我喜歡綠色'
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    color = {ask} '你最喜歡什麼顏色？'
                    {if} color == '綠色':
                        {print} '綠色很好看'
                    {elif} color == 黃色:
                        {print} '黃色還不錯'
                    {else}:
                        {print} '我喜歡綠色'
            title: 學生把 `{elif}` 當成沒有條件的 `{else}` 使用
        -   example:
                error_text: 每個需要縮排的指令後面都必須加上冒號。
                error_code: |-
                    回答 = ask '你今天好嗎？'
                    {if} 回答 {is} '很好'
                        {print} '我也是！'
                    {elif} 回答 {is} '不好'
                        {print} '讓我逗你開心！'
                    {else}
                        {print} '我很好！'
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    回答 = {ask} '你今天好嗎？'
                    {if} 回答 {is} '很好':
                        {print} '我也是！'
                    {elif} 回答 {is} '不好':
                        {print} '讓我逗你開心！'
                    {else}:
                        {print} '我很好！'
            title: 學生忘了加上冒號
        level: '17'
    -   sections:
        -   example:
                error_text: 學生會忘記用括號把文字括起來。
                error_code: "{print} '我的名字是 Hedy！'"
                solution_text: 以下是正確的程式碼：
                solution_code: "{print}('我的名字是 Hedy！')"
            title: 學生忘了使用括號
        -   example:
                error_text: 從第 1 級開始一直使用 `ask`，所以學生可能不容易改用 `input`。
                error_code: |-
                    {print}('我的名字是 Hedy！')
                    名字 = ask('你叫什麼名字？')
                    {print}('原來你的名字是', 名字)
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    {print}('我叫 Hedy！')
                    name = {input}('你叫什麼名字？')
                    {print}('所以你叫', name)
            title: 學生仍會使用 `ask` 指令
        -   example:
                error_text: 學生已學過要把變數放在引號外，因此可能也把括號放在外面，但括號不能這樣使用。
                error_code: |-
                    溫度 = 25
                    {print}('現在室外是') 溫度 ('度')
                solution_text: 以下是正確的程式碼：
                solution_code: |-
                    溫度 = 25
                    {print}('現在室外是', 溫度, '度')
            title: 學生可能會把括號當成引號使用
        level: '18'
    title: 常見錯誤
    key: common_mistakes
    intro: 犯錯也是學習的一部分，寫程式時尤其如此！犯錯無可避免，卻也是很好的學習機會。不過對教師來說，要找出正確的修正方式可能很有挑戰，尤其學生逐級學習後，程式會變得越來越長。因此，我們整理了每個等級常見的錯誤和解決方法。
title: Hedy 說明文件
join-sections:
-   title: 支持 Hedy
    text: '# 你可以透過三種方式支持 Hedy！'
-   title: 改進 Hedy 語言
    text: |-
        Hedy 採用漸進式設計並支援多種語言，因此帶來許多有趣的技術挑戰。
        你可以在 <a href="https://github.com/hedyorg/hedy/issues?q=is%3Aopen+is%3Aissue+label%3Alanguage" target="_blank">GitHub</a> 上查看這些問題。
-   title: 翻譯 Hedy
    text: |-
        不會寫程式也沒關係！你還可以<a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">翻譯關鍵字、錯誤訊息、冒險及其他內容</a>，用這種方式支持 Hedy。
        以下是目前的翻譯進度。請協助我們完成一種語言，或加入新的語言！
        <a href="https://hosted.weblate.org/engage/hedy/">
        <img src="https://hosted.weblate.org/widgets/hedy/-/multi-auto.svg" alt="翻譯進度" /></a>
-   title: 協助教師開始使用
    text: |-
        Hedy 的設計目標，是協助教師在課堂中教授程式設計。我們提供教師專用功能，例如建立及自訂班級，並查看學生的學習情況。
        如果你喜歡 Hedy，可以聯絡熟悉的學校，協助教師開始使用！我們也能透過 <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord</a> 幫你尋找學校或教師。
