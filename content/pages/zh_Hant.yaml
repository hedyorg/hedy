        -   example:
                error_text: 這個級別最困難的部分，就是正確使用縮排。學生喜歡把 `{if}` 陳述式一層層巢狀放入，有時甚至會放在另一個巢狀 `{if}` 裡。要掌握每一層的縮排可能很不容易。
                error_code: |-
                    {print} 'Robin 正走在市中心'
                    地點 = {ask} 'Robin 要走進商店，還是回家？'
                    {if} 地點 {is} 商店
                        {print} '她走進商店。'
                        {print} 'Robin 看到一本有趣的書'
                        書 = {ask} 'Robin 會買下這本書嗎？'
                            {if} 書 {is} 會
                    {print} 'Robin 買了書，然後回家'
                    {else}
                        {print} 'Robin 離開商店回家'
                    {else}
                        {print} 'Robin 回家了'
                solution_text: 以下是正確的程式碼。將 `{if}` 陳述式放進其他 `{if}` 陳述式時，請留意每一層不同的程式結構。
                solution_code: |-
                    {print} 'Robin 正走在市中心'
                    地點 = {ask} 'Robin 要走進商店，還是回家？'
                    {if} 地點 {is} 商店
                        {print} '她走進商店。'
                        {print} 'Robin 看到一本有趣的書'
                        書 = {ask} 'Robin 會買下這本書嗎？'
                        {if} 書 {is} 會
                            {print} 'Robin 買了書，然後回家'
                        {else}
                            {print} 'Robin 離開商店回家'
                    {else}
                        {print} 'Robin 回家了'
