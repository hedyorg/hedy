home-sections:
-   title: 讓文字程式設計變簡單！
    text: |-
        世界各地有許多學校和教師想教學生寫程式。一開始通常會使用有趣的工具，例如 Bee-Bot 機器人、Scratch Junior 或 Scratch。使用這些工具一段時間後，孩子常會想學習功能更強大的文字程式語言，例如 Python。

        不過，Python 並不容易，因為它只能使用英文，而且學習者必須同時理解複雜的程式設計概念和語法。Hedy 讓你更容易開始學習文字程式語言！Hedy 可以免費使用、採用開放原始碼，而且具有三項不同於其他文字程式語言的特色。

        1. Hedy 支援多種語言，你可以用自己的語言寫 Hedy 程式
        2. Hedy 採漸進式學習，讓你一次學習一個概念及其語法
        3. Hedy 專為課堂設計，讓教師可以完整調整學生的學習體驗
-   title: 多語言程式設計
    text: 幾乎所有文字程式語言都使用英文關鍵字，例如 `for` 或 `repeat`，但 Hedy 可以使用任何語言！目前支援 47 種語言，包括荷蘭文、西班牙文、阿拉伯文、土耳其文、中文和印地文。如果尚未提供你的語言，隨時都能開始新的翻譯。
-   title: 循序漸進地學習
    text: 學習程式語言可能讓人感到不知所措，因為學習者必須同時理解概念（例如 if-else 或迴圈）和語法（例如引號或小括號）。Hedy 會先用很少的語法介紹概念，再逐步加入更完整的規則。這是經科學研究證實有效的學習方式！
-   title: 專為課堂打造
    text: |-
        Hedy 適合 10 歲以上的孩子，並專為課堂使用而設計。
        教師可以使用我們免費提供的內建教案，也能自行編寫課程，並將內容載入 Hedy 使用者介面。
-   title: 情境中的程式設計
    text: Hedy 以非常多元的方式呈現程式設計，能用來完成各種有趣的作品。你可以用 Hedy 創作數位互動故事、在畫面上顯示彩色圖畫，也能用繪圖機把圖畫在紙上，或將圖案繡在衣服上。你還可以製作含有按鈕和鍵盤操作的遊戲或應用程式。
-   title: Hedy 免費嗎？
    text: |-
        是的！Hedy 是「開放原始碼」軟體，代表每個人都能幫助我們讓 Hedy 變得更好。
        你可以在 <a href="https://github.com/hedyorg/hedy" target="_blank">GitHub</a> 上找到我們的程式碼。
        如果你喜歡 Hedy 並想提供協助，我們非常歡迎也十分感謝你的<a href="https://github.com/sponsors/hedyorg" target="_blank">捐款</a>！
-   title: 我需要安裝任何東西嗎？
    text: 不需要。Hedy 會在瀏覽器中執行，也就是你現在用來查看這個頁面的程式，例如 Chrome、Edge 或 Firefox。Hedy 也能在手機和平板電腦上使用。
-   title: 使用 Hedy 教學需要程式設計經驗嗎？
    text: |-
        不需要。簡報和學習者介面會說明所有概念。
        建立免費的教師帳號後，你也能使用教師手冊，查看教學方法和常見錯誤等資訊。
teacher-guide:
-   title: 簡介
    key: intro
    subsections:
    -   title: Hedy 是什麼？
        text: |-
            Hedy 是一種文字程式語言，專為 10 到 15 歲的兒童與青少年設計。
            Scratch 等兒童程式語言使用程式積木，Hedy 則使用文字程式碼。
            你可以透過遊戲般的練習一步步學習，像真正的程式設計師一樣輸入程式碼。
            Hedy 因此能成為通往 Python 等正式程式語言的踏腳石，讓學習過程容易上手，而且充滿樂趣！
            如果想進一步了解，可以觀看這部介紹 Hedy 程式語言開發過程的<a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">影片</a>。
    -   title: 適用對象
        text: |-
            Hedy 以 10 至 15 歲的國中階段學生為主要設計對象。
            學生必須具備良好的閱讀能力。我們建議至少達到小學三年級的閱讀程度後，再開始使用 Hedy。
            學生（以及教師！）在開始使用 Hedy 前，都不需要任何程式設計經驗。
    -   title: Hedy 如何運作？
        text: |-
            Hedy 分成多個等級，每個等級都會教授新的指令，並提供各種冒險，讓學生練習新學到的指令。
            教師可以決定要向學生開放哪些冒險。這個等級要讓他們製作餐廳、計算機，還是鬼屋呢？每個等級的冒險會按照由易到難的順序排列，讓學生持續接受挑戰。學生可以自行完成冒險，教師也能用它進行全班教學。

            冒險中還包含程式碼範例，讓較不熟悉數位工具的教師也能使用 Hedy！當然，喜歡發揮創意的教師也可以製作自己的教案和冒險。

            完成某個等級的所有冒險後，學生可以透過小測驗檢查自己的學習成果。
            你可以在班級頁面查看學生的作品和學習進度。
    -   title: 裝置
        text: |-
            Hedy 是網頁式工具，只要裝置上有瀏覽器（例如 Google Chrome、Firefox 或 Edge）就能使用，所以筆記型電腦、Chromebook、平板電腦，甚至智慧型手機都適合使用 Hedy。
            使用 Hedy 前不需要下載任何東西，只要前往網站就能開始！
    -   title: Hedy 社群
        text: |-
            歡迎所有 Hedy 老師、程式設計師和支持者加入我們的 <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord 伺服器</a>。這裡很適合交流 Hedy：你可以在不同頻道分享很酷的專案和課程、回報程式問題，或與其他老師及 Hedy 團隊聊天。
            你可以在<a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">這裡</a>觀看如何加入 Discord 社群的影片。
    -   title: Hedy 與 GDPR
        text: |-
            歐盟境內的組織在處理個人資料時，必須遵守 GDPR（《一般資料保護規則》）。
            這對許多學校來說是個複雜的議題，因此 Hedy 允許你在不分享個人資料的情況下使用所有程式設計功能。
            最簡單的方法，是教師和學生都不建立帳號，直接使用 Hedy。沒有帳號時，除了自訂等級、儲存學生程式和查看學習進度之外，其他功能都能使用。雖然會受到一些限制，但確實有學校以這種方式使用 Hedy。

            第二種方法，是教師使用不含個人資料的電子郵件地址建立帳號，例如「docent25@email.com」。建立教師帳號時，除了用來重設密碼的電子郵件地址之外，不需要提供其他資訊。
            有了教師帳號，你可以為學生建立匿名帳號，例如 rainbow-student1、rainbow-student2 等（詳細說明請參閱「教學準備」）。這樣就能使用 Hedy 的所有功能，包括儲存學習進度，又不必分享教師或學生的個人資料。

            如果上述方式仍不符合你的需求，我們也可以簽署個人資料處理協議。
-   levels:
    -   sections:
        -   example:
                error_text: 例如，學生直接輸入一句話，卻沒有使用「輸出」指令。
                error_code: Hedy 無法輸出這段文字
                solution_text: 教導學生每一行程式碼都要以指令開頭。
                solution_code: '{print} Hedy 可以輸出這段文字！'
            title: 學生忘了輸入指令
        -   example:
                error_text: 英文指令使用大寫字母時無法運作。
                error_code: |-
                    Ask 為什麼我的程式碼無法執行？
                    Print 因為我使用了大寫字母。
                solution_text: 移除大寫字母。
                solution_code: |-
                    {ask} 為什麼我的程式碼現在可以執行？
                    {print} 因為我把大寫字母改掉了！
            title: 學生輸入指令時使用大寫字母
        -   example:
                error_text: '`answer` 用來在 `ask` 指令之後重複顯示回答。若沒有先使用 `ask`，`answer` 就不會有任何作用。'
                error_code: '{print} 你的名字是 {answer}'
                solution_text: 加入 ask 指令，程式就能正常運作。
                solution_code: |-
                    {ask} 你叫什麼名字？
                    {print} 你的名字是 {answer}
            title: 學生沒有使用 ask，卻使用 answer
        -   example:
                error_text: 學生使用海龜時，常常喜歡試很大的數字，結果箭頭會跑出畫面。
                error_code: |-
                    {forward} 300
                    {turn} 90
                solution_text: 在這個範例中，學生常以為 `turn` 指令沒有作用，其實它已正確執行，只是海龜走出了畫面範圍。使用較小的數字就能避免這個情況。
                solution_code: |-
                    {forward} 100
                    {turn} 90
            title: 海龜：學生讓海龜走出畫面
        -   example:
                error_text: '`backward` 不是 Hedy 指令。'
                error_code: 後退 100
                solution_text: 若要讓海龜向後走，請使用 `forward` 指令和負數。例如：
                solution_code: '{forward} -100'
            title: 海龜：學生使用 `backward` 指令，但沒有這個指令。
        level: '1'
    -   sections:
        -   example:
                error_text: Hedy 無法辨識拼錯的指令。
                error_code: 輸處 不要拼錯字
                solution_text: 教導學生閱讀錯誤訊息，這樣他們就能自己找出問題。
                solution_code: '{print} 請不要拼錯字'
            title: 學生拼錯指令
        -   example:
                error_text: 學生會在這個等級學習變數。`ask` 指令也需要搭配變數，但學生常會忘記。
                error_code: 問 你想吃什麼
                solution_text: 在這個等級中，你必須告訴 Hedy 要把回答儲存在哪裡，之後才能再次使用。這個儲存位置稱為變數。
                solution_code: 餐點 {is} {ask} 你想吃什麼？
            title: 學生忘了 `ask` 指令已經改變
        -   example:
                error_text: 有些學生發現 `{echo}` 指令不能再使用時，可能會感到挫折。因此，向學生說明使用變數的好處非常重要。例如，一段程式碼中可以使用多個變數，而且能把變數放在句子中想放的任何位置！
                error_code: |-
                    answer {is} {ask} 為什麼 {echo} 不能用了？！
                    {echo}
                solution_text: 請改用變數。
                solution_code: |-
                    answer {is} {ask} 為什麼 {echo} 不能用了？！
                    {print} answer
            title: 學生嘗試使用 `{echo}` 指令
        -   example:
                error_text: 在以下範例中，name 既是變數，也被當成一般文字。這段程式碼會輸出「Hi my Hedy is Hedy」。
                error_code: |-
                    name {is} Hedy
                    {print} 嗨，我的名字是 name
                solution_text: 因此，不要把想在文字中使用的詞當成變數名稱。到了第 4 級，使用引號就能解決這個問題。
                solution_code: |-
                    名字 {is} Hedy
                    {print} 嗨，我是 名字
            title: 學生把變數名稱當成一般文字使用
        -   example:
                error_text: 變數名稱應該只用一個單字。你可以用底線連接兩個單字，這樣仍算一個名稱。
                error_code: chosen door is ask 你要選哪一扇門？
                solution_text: 請加上底線。
                solution_code: chosen_door {is} {ask} 你選哪一扇門
            title: 學生使用包含兩個單字的長變數名稱
        -   example:
                error_text: 在這個範例中，學生用 horse 和 name 代表同一個變數。
                error_code: |-
                    馬名 {is} {ask} 你的馬叫什麼名字？
                    {print} 你的馬叫 名字
                solution_text: 請務必檢查整段程式碼中的變數名稱是否完全相同。細微的差異可能很難發現（例如單數與複數），但仍會讓程式無法正常運作。
                solution_code: |-
                    name {is} {ask} 你的馬叫什麼名字
                    {print} 你的馬叫 name
            title: 學生可能會用兩個不同名稱表示同一個變數
        level: '2'
    -   sections:
        -   example:
                error_text: 清單不能整份輸出。你只能使用 {at} {random}，從清單中輸出一個項目。
                error_code: |-
                    雜貨 {is} 蘋果, 牛奶, 巧克力
                    {print} 雜貨
                solution_text: 若要輸出完整的雜貨清單，只要將所有項目放在 `{print}` 指令後面即可。你也可以使用 {at} {random}，從清單中輸出一個項目。
                solution_code: |-
                    {print} 蘋果, 牛奶, 巧克力

                    # 或

                    雜貨 {is} 蘋果, 牛奶, 巧克力
                    {print} 雜貨 {at} {random}
            title: 學生嘗試輸出整份清單
        -   example:
                error_text: 這個問題可能在第 2 級也發生過，現在清單也可能出現同樣的問題。
                error_code: |-
                    名字 {is} Hedy
                    {print} 嗨，我的名字是 名字

                    # 或

                    動物 {is} 犀牛, 蜜蜂, 天鵝
                    {print} 最棒的動物是…… 動物 {at} {random}
                solution_text: 輸出一般文字時，請避免在句子中直接使用變數或清單的名稱。到了第 4 級，這個問題可以用引號解決。
                solution_code: |-
                    name {is} Hedy
                    {print} 嗨，我是 name

                    # 或者

                    animals {is} 犀牛, 蜜蜂, 天鵝
                    {print} 最棒的動物是…… animals {at} {random}
            title: 學生把變數或清單的名稱當成一般文字
        -   example:
                error_text: 如下例所示
                error_code: |-
                    鳥類 {is} 麻雀, 海鷗, 知更鳥
                    {print} 鳥類 random
                solution_text: 加上 `at` 就能解決這個問題。
                solution_code: |-
                    鳥類 {is} 麻雀, 海鷗, 知更鳥
                    {print} 鳥類 {at} {random}
            title: 學生在 `{at}` `{random}` 中忘了使用 `{at}`
        -   example:
                error_text: 有時學生會把 `{at}` `{random}` 放在一行的開頭。
                error_code: |-
                    水果 {is} 蘋果, 櫻桃, 香蕉
                    水果 {at} {random}
                solution_text: 提醒學生：要輸出文字時，一定要使用「輸出」指令。
                solution_code: |-
                    水果 {is} 蘋果, 櫻桃, 香蕉
                    {print} 水果 {at} {random}
            title: 學生使用 `{at}` `{random}` 時忘了加上 `{print}` 指令
        -   example:
                error_text: 清單中的項目要用逗號分隔。
                error_code: |-
                    披薩 {is} 蘑菇 鮪魚 四季
                    {print} 披薩 {at} {random}
                solution_text: 清單中的每個項目後面都要加上逗號
                solution_code: |-
                    披薩 {is} 蘑菇, 鮪魚, 四季
                    {print} 披薩 {at} {random}
            title: 學生忘了在清單中使用逗號
        -   example:
                error_text: 例如
                error_code: |-
                    clubs {is} 曼徹斯特聯隊
                    {print} clubs {at} {random}
                solution_text: Hedy 無法隨機輸出任何內容，因為沒有可供選擇的清單。
                solution_code: |-
                    clubs {is} 曼徹斯特聯隊, 拜仁慕尼黑足球俱樂部, 巴塞隆納足球俱樂部
                    {print} clubs {at} {random}
            title: 學生在沒有清單時嘗試使用 `{at}` `{random}`
        -   example:
                error_text: 在下方範例中，`names` 不是清單，而是變數，因此不能把任何項目加入其中。
                error_code: |-
                    names {is} Jake
                    your_name {is} {ask} 你是誰？
                    {add} your_name {to} names
                    {print} names {at} {random}
                solution_text: 程式中必須先有清單，所以要加入第二個名字（例如 Amy），把 `names` 變成清單。如果不想讓 Amy 留在清單中，之後可以使用 `remove` 將她移除。
                solution_code: |-
                    names {is} Jake, Amy
                    your_name {is} {ask} 你是誰？
                    {add} your_name {to} names
                    {print} names {at} {random}
            title: 學生在沒有清單時嘗試使用 add/remove
        -   example:
                error_text: '`add`／`remove` 指令少了 `to`／`from` 就無法運作。'
                error_code: |-
                    adventures {is} 故事, 鸚鵡, 骰子
                    choice {is} 你最喜歡哪一個冒險？
                    {add} choice
                    {remove} 骰子
                    {print} 我喜歡 adventures {at} {random}
                solution_text: Hedy 必須知道要將項目加入哪一份清單，或從哪一份清單移除。
                solution_code: |-
                    adventures {is} 故事, 鸚鵡, 骰子
                    choice {is} 你最喜歡哪一個冒險？
                    {add} choice {to_list} adventures
                    {remove} 骰子 {from} adventures
                    {print} 我喜歡 adventures {at} {random}
            title: 學生在 `{add}`／`{remove}` 中忘了使用 `{to}`／`{from}`
        level: '3'
    -   sections:
        -   example:
                error_text: 在這個等級中，「輸出」和 `ask` 使用的文字前後都需要引號。
                error_code: |-
                    {print} 你好
                    心情 {is} {ask} '你今天好嗎？
                solution_text: 請加上正確的引號。
                solution_code: |-
                    {print} '你好'
                    心情 {is} {ask} '你今天好嗎？'
            title: 學生忘了在文字前後都加上引號
        -   example:
                error_text: 開始上課時，請先確認學生知道如何正確輸入引號，這一點很重要。在 Hedy 中，學生可以使用單引號 ('') 和雙引號 ("")，但反引號（``）不是有效的引號。
                error_code: |-
                    {print} `歡迎光臨餐廳`
                    食物 {is} {ask} "你想點什麼？"
                solution_text: 以下才是正確的引號：
                solution_code: |-
                    {print} '歡迎光臨餐廳'
                    食物 {is} {ask} '你想點什麼？'
            title: 學生使用了錯誤的引號
        -   example:
                error_text: 從這個等級開始，不允許在文字中使用單引號。英文縮寫常會用到單引號，例如 `you're`、`don't` 或 `what's`。
                error_code: "{print} '你不可以輸入 '這個內容''"
                solution_text: 你可以暫時使用不完全正確的英文文法，省略單字中的單引號；也可以改用反引號 ` 代替單引號。
                solution_code: |-
                    {print} 'Youre allowed to type this'
                    {print} 'And you`re able to do this'
            title: 學生在文字中使用撇號
        level: '4'
    -   sections:
        -   example:
                error_text: 學生使用 `{if}` 或 `{else}` 後，常會忘記再使用 `{print}` 或 `{ask}` 等第二個指令。
                error_code: |-
