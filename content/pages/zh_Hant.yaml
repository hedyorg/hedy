            title: 學生使用包含兩個以上單字的長變數名稱
        -   example:
                error_text: 例如，這位學生希望 Hedy 告訴所有朋友他們都很有趣，並告訴其他同學他們並不有趣。
                error_code: "{if} name {is} Jesse, David, Souf {print} '你很好笑' {else} {print} '你不好笑'"
                solution_text: |-
                    你可以使用 `{in}` 指令。雖然較高的級別才會說明這個指令，但它在第 5 級已經可以使用。
                    另一種做法是使用多個 `{if}` 指令，不使用 `{else}` 指令。缺點是程式不會告訴其他同學他們不好笑。
                solution_code: |-
                    friends {is} Jesse, David, Souf
                    name {is} {ask} '你是誰？'
                    {if} name {in} friends {print} '你很好笑'
                    {else} {print} '你不好笑'

                    # 或者

                    name {is} {ask} '你是誰？'
                    {if} name {is} Jesse {print} '你很好笑'
                    {if} name {is} David {print} '你很好笑'
                    {if} name {is} Souf {print} '你很好笑'
