                error_code: "superhrdinové = Spiderman, Batman, Iron Man\nsuperhrdina = superhrdinové {at} {random}\n{if} superhrdina = Batman\n    {print} 'JSEM BATMAN!'"
                solution_text: 'Toto je správný kód:'
                solution_code: "superhrdinové = 'Spiderman', 'Batman', 'Iron Man'\nsuperhrdina = superhrdinové {at} {random}\n{if} superhrdina {is} 'Batman'\n    {print} 'JSEM BATMAN!'"
        concepts_and_changes: |-
            V této poslední úrovni Hedy Advanced se žáci naučí používat základní funkce.

