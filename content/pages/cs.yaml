                solution_text: 'Uvnitř funkce použijte správné odsazení'
                solution_code: "{define} funkce\n    {print} 'Uvnitř funkce použij odsazení.'\n    {if} použij_také_if {is} 'ano'\n        {print} 'Nezapomeň na odsazení ani u cyklů'"
