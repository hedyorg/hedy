    -   level: '13'
        sections:
        -   title: Žáci zapomínají používat novou syntaxi
            example:
                error_text: Tato úroveň přináší mnoho nových syntaktických pravidel.
                error_code: "nálada {is} {ask} 'Jak se máš, ' jméno '?'\n{if} nálada {is} dobře\n    {print} 'Skvělé!'"
                solution_text: Použijte správnou syntaxi.
                solution_code: "nálada = input('Jak se máš, ', jméno, '?')\n{if} nálada == 'dobře':\n    {print}('Skvělé!')"
        -   title: Žáci si pletou znaménka < a >
            example:
                error_text: Žáci tato znaménka často už znají z matematiky. Pokud je ale ještě neznají, mohou s nimi mít potíže.
                error_code: |-
                    věk = {ask} 'Kolik je ti let?'
                    {if} věk < 12
                        {print} 'Jsi starší než já!'
                solution_text: 'Toto je správný kód:'
                solution_code: |-
                    věk = {ask} 'Kolik je ti let?'
                    {if} věk > 12
                        {print} 'Jsi starší než já!'
        -   title: Žáci používají nesprávné zápisy `!=`, `<=` a `>=`
            example:
                error_text: Tyto zápisy jsou pro většinu žáků nejspíš nové. Nezapomeňte jim je vysvětlit.
                error_code: |-
                    jméno = {ask} 'Jak se jmenuješ?'
                    {if} jméno =  'Hedy'
                        {print} 'Nejsi Hedy'
                solution_text: 'Toto je správný kód:'
                solution_code: |-
                    jméno = {ask} 'Jak se jmenuješ?'
                    {if} jméno != 'Hedy'
                        {print} 'Nejsi Hedy'
        -   title: Žáci zapomínají používat znak ==
            example:
                error_text: V této úrovni mohou žáci stále používat = nebo is. V jiných úrovních nebo v Pythonu by jim to ale mohlo způsobit potíže. Proto je vhodné je naučit používat ==.
                error_code: |-
                    jméno = {ask} 'Jak se jmenuješ?'
                    {if} jméno = 'Hedy'
                        {print} 'Jsi super!'
                solution_text: 'Toto je správný kód:'
                solution_code: |-
                    jméno = {ask} 'Jak se jmenuješ?'
                    {if} jméno == 'Hedy'
                        {print} 'Jsi super!'
        -   title: Žáci zkoušejí možnosti z předchozích úrovní, které mají jiný zápis než v Pythonu.
            example:
                error_text: Žáci se například snaží použít opakování, funkce nebo seznamy.
                error_code: |-
                    {define} vyber_zvíře
                        zvířata = pes, kočka, křeček
                        {repeat} 3 {times}
                        {print} zvířata {at} {random}

                    {call} vyber_zvíře
                solution_text: Naučí se to v dalších úrovních.
                solution_code: '# Až budeš chtít pokračovat, podívej se do dalších úrovní. Nebo si v této úrovni nejprve dál procvičuj základy.'
        concepts_and_changes: |-
            V této první úrovni Hedy Expert se žáci více ponoří do pojmů a syntaxe skutečných programovacích jazyků.
            Doporučujeme s nimi úrovně Hedy Expert probírat, jen pokud je chcete později připravit na jiné „skutečné“ programovací jazyky, například Python.
            Pokud tento cíl vašim žákům nevyhovuje, doporučujeme zůstat u Hedy Basic a Hedy Advanced. Tam se naučí základní principy programování bez starostí s konkrétními syntaktickými pravidly.

            **Upozornění:** Od této úrovně je syntaxe Hedy téměř stejná jako v Pythonu. Dříve naučené zápisy Hedy zde tedy nemusí fungovat. Novou syntaxi Pythonu vysvětlíme v dalších úrovních. Aby toho na žáky nebylo příliš, rozdělili jsme ji do několika úrovní.
            Některé možnosti, například funkce a seznamy, tak nelze používat dosavadním způsobem Hedy, ale nový zápis v Pythonu zatím nebyl vysvětlen. Žáci proto potřebují trochu trpělivosti. Nejprve se vrátíme o krok zpět a osvojíme si novou syntaxi. Pak se naučíme všechny možnosti používat způsobem Pythonu.

            V této úrovni se žáci naučí také používat operátory, které rozšíří jejich možnosti výpočtů.


            Novinky v této úrovni:
            * Vypsání textu se syntaxí Pythonu: `{print}('Ahoj světe!')
            * Vypsání textových řetězců a proměnných společně, například: `{print}('Ahoj, ', jméno, '!')
            * Pokládání otázek pomocí `{input}`
            * Dvojtečky za příkazy {if}
            * Použití operátorů: < > == != <= >=
    -   level: '14'
        sections:
        -   title: Žáci zapomínají na závorky
            example:
                error_text: Od této úrovně musí být seznamy v hranatých závorkách.
                error_code: "zmrzlina = 'jahodová', 'čokoládová'\n{print} 'Mám rád ' zmrzlina[{random}] ' zmrzlinu'"
                solution_text: 'Toto je správný kód:'
                solution_code: "zmrzlina = ['jahodová', 'čokoládová']\n{print} 'Mám rád ' zmrzlina[{random}] ' zmrzlinu'"
        -   title: Žáci používají nesprávné závorky
            example:
                error_text: Od této úrovně musí být seznamy v hranatých závorkách.
                error_code: "zmrzlina = ('jahodová', 'čokoládová')\n{print} 'Mám rád ' zmrzlina[{random}] ' zmrzlinu'"
                solution_text: 'Toto je správný kód:'
                solution_code: "zmrzlina = ['jahodová', 'čokoládová']\n{print} ('Mám rád ' zmrzlina[{random}] ' zmrzlinu')"
        -   title: Žáci se soustředí na závorky a zapomínají na uvozovky
            example:
                error_text: Žáci se někdy natolik soustředí na novou syntaxi, že zapomenou na uvozovky.
                error_code: "zmrzlina = [jahodová, čokoládová]\n{print} 'Mám rád ' zmrzlina[{random}] ' zmrzlinu'"
                solution_text: 'Toto je správný kód:'
                solution_code: "zmrzlina = ['jahodová', 'čokoládová']\n{print}('Mám rád ' zmrzlina[{random}] ' zmrzlinu')"
        -   title: Žáci stále používají starý příkaz at random
            example:
                error_text: V této úrovni se mění zápis {random}
                error_code: |-
                    zmrzlina = [jahodová, čokoládová]
                    {print} 'Mám rád ' zmrzlina at random ' zmrzlinu'
                solution_text: 'Toto je správný kód:'
                solution_code: |-
                    zmrzlina = ['jahodová', 'čokoládová']
                    {print} 'Mám rád ' zmrzlina[{random}] ' zmrzlinu'
        concepts_and_changes: |-
            Tato úroveň se zaměřuje na práci se seznamy. Žáci se také naučí používat opakování způsobem Pythonu.

            Novinky v této úrovni:
            * Práce se seznamy
            * Kombinování seznamů s {for}, {if} a {random}
            * Opakování pomocí {for} i {range}(1,10)
    -   level: '15'
        sections:
        -   title: Žáci mají potíže se správnou syntaxí a odsazením funkce
            example:
                error_text: Žáci mají potíže se správnou syntaxí a odsazením funkce
                error_code: "{def} pozdrav_zákazníka(jméno\n{print}('Dobrý den, ', jméno, '!')\n\nzákazník = 'Hedy\npozdrav_zákazníka()zákazník"
                solution_text: 'Pečlivě zkontrolujte syntaxi a odsazení.'
                solution_code: "{def} pozdrav_zákazníka(jméno):\n    {print}('Dobrý den, ', jméno, '!')\n\nzákazník = 'Hedy'\npozdrav_zákazníka(zákazník)"
        -   title: Žáci zapomínají použít {return} ve funkci
            example:
                error_text: Žáci zapomínají použít return ve funkci
                error_code: |-
                    {def} přiděl_pokoj(číslo):
                        číslo_pokoje = 1000 + číslo

                    oblíbené_číslo = 7
                    číslo_pokoje = {return} přiděl_pokoj(oblíbené_číslo)
                    print('Číslo tvého pokoje je ', číslo_pokoje)
                solution_text: 'Toto je správný kód:'
                solution_code: |-
                    def přiděl_pokoj(číslo):
                        číslo_pokoje = 1000 + číslo
                        return číslo_pokoje

                    oblíbené_číslo = 7
                    číslo_pokoje = přiděl_pokoj(oblíbené_číslo)
                    print('Číslo tvého pokoje je ', číslo_pokoje)
        concepts_and_changes: |-
            Tato úroveň se zaměřuje na funkce. V Hedy Advanced se žáci naučili používat základní funkci. Teď se naučí nejen syntaxi funkcí v Pythonu, ale také jejich argumenty a {return} {value}.

            Novinky v této úrovni:
            * Použití funkce způsobem Pythonu
            * Použití argumentů ve funkci
            * Použití {return} {value}
    -   level: '16'
        sections:
        -   title: Žáci zapomínají na odsazení v cyklu while
            example:
                error_text: Odsazení bývá pro žáky obtížné.
                error_code: "odpověď = 0\n{while} odpověď != 25\nodpověď = {ask} 'Kolik je 5 krát 5?'\n{print} 'Byla zadána správná odpověď'"
                solution_text: 'Toto je správný kód:'
                solution_code: "odpověď = 0\n{while} odpověď != 25\n    odpověď = {ask} 'Kolik je 5 krát 5?'\n{print} 'Byla zadána správná odpověď'"
        -   title: Žáci (omylem) vytvoří nekonečný cyklus
            example:
