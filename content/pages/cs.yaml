        concepts_and_changes: |-
            V této poslední úrovni Hedy se žáci naučí používat cyklus {while} a dál si procvičí novou syntaxi.
            Po této úrovni jsou připraveni pokračovat v programování ve „skutečných“ překladačích Pythonu.

            Novinky v této úrovni:
