title: Dokumentace Hedy
home-sections:
-   title: Textové programování snadno!
    text: |-
        Mnoho škol a učitelů po celém světě chce naučit žáky programovat. Často začínají s hravými nástroji, jako je robot Bee-Bot,
        Scratch Junior nebo Scratch. Děti pak často chtějí přejít k výkonnějším textovým programovacím jazykům, například k Pythonu.

        Python je ale náročný, protože je dostupný pouze v angličtině a žáci se musí současně učit složité programovací koncepty i syntaxi.
        Hedy je snadná cesta, jak začít s textovými programovacími jazyky! Je zdarma, má otevřený zdrojový kód a od ostatních textových programovacích jazyků se liší ve třech ohledech.

        1. Hedy je vícejazyčná, takže ji můžeš používat ve svém jazyce.
        2. Hedy je stupňovitá, takže se můžeš učit vždy jeden koncept a jeho syntaxi.
        3. Hedy je určená do tříd a umožňuje učitelům plně přizpůsobit výuku svým žákům.
-   title: Vícejazyčné programování
    text: Téměř všechny textové programovací jazyky mají klíčová slova v angličtině, například `for` nebo `repeat`. Hedy ale můžeš používat v jakémkoli jazyce! V současnosti podporujeme 47 jazyků, například nizozemštinu, španělštinu, arabštinu, turečtinu, čínštinu a hindštinu. Pokud tvůj jazyk chybí, můžeš začít s novým překladem.
-   title: Učení krok za krokem
    text: 'Učit se programovací jazyk může být náročné: žáci se musí zároveň učit koncepty (například if-else nebo cykly) i syntaxi (například uvozovky nebo kulaté závorky). Hedy nejprve představuje koncepty s jednoduchou syntaxí, kterou postupně rozvíjí. Jde o vědecky ověřený způsob učení!'
-   title: Určená do tříd
    text: |-
        Hedy je vhodná pro děti od 10 let a je určená pro výuku ve třídě.
        Učitelé mohou využívat naše bezplatné připravené plány výuky, ale také vytvářet vlastní lekce a nahrávat je do rozhraní Hedy.
-   title: Programování v souvislostech
    text: Hedy ukazuje programování v co nejširším pojetí a dá se využít mnoha zajímavými způsoby. Můžeš s ní vytvářet digitální a interaktivní příběhy nebo barevné kresby, které lze zobrazit na obrazovce, nakreslit perovým plotrem či vyšít na tričko. Můžeš také tvořit hry a aplikace s tlačítky a ovládáním klávesnicí.
-   title: Je Hedy zdarma?
    text: |-
        Ano! Hedy má otevřený zdrojový kód, takže nám každý může pomoci ji zlepšovat.
        Náš kód najdeš na <a href="https://github.com/hedyorg/hedy" target="_blank">GitHubu</a>.
        Pokud se ti Hedy líbí a chceš přispět, přijímáme <a href="https://github.com/sponsors/hedyorg" target="_blank">dary</a> a jsme za ně moc vděční!
        Peníze používáme na provoz serveru, údržbu a zlepšování webu Hedy.
-   title: Potřebuji něco instalovat?
    text: Ne. Hedy běží v prohlížeči, což je program, ve kterém se díváš na tuto stránku, pravděpodobně Chrome, Edge nebo Firefox. Hedy také funguje na telefonech a tabletech.
-   title: Potřebuji k výuce s Hedy zkušenosti s programováním?
    text: "Ne, zkušenosti nejsou potřeba. Všechny koncepty jsou vysvětlené ve snímcích i v rozhraní pro žáky.\nKdyž si vytvoříte bezplatný učitelský účet, získáte také přístup k příručce učitele s informacemi o výuce\na častých chybách."
join-sections:
-   title: Podpora Hedy
    text: '# Hedy můžeš podpořit třemi způsoby!'
-   title: Zlepšování jazyka
    text: "Postupná a vícejazyčná povaha Hedy přináší mnoho zajímavých technických výzev.\nNajdeš je na <a href=\"https://github.com/hedyorg/hedy/issues?q=is%3Aopen+is%3Aissue+label%3Alanguage\" target=\"_blank\">GitHubu</a>."
-   title: Překládání Hedy
    text: "Nejsi programátor? To nevadí! Hedy můžeš podpořit také <a href=\"https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial\" target=\"_blank\">překládáním klíčových slov, chybových zpráv, dobrodružství a dalšího obsahu</a>.\nTady je současný stav. Pomoz nám doplnit překlad jazyka nebo přidat nový!\n<a href=\"https://hosted.weblate.org/engage/hedy/\">\n<img src=\"https://hosted.weblate.org/widgets/hedy/-/multi-auto.svg\" alt=\"Stav překladu\" /></a>"
-   title: Pomoz učitelům začít
    text: "Hedy podporuje učitele při výuce programování ve třídě. Nabízí funkce pro učitele, například vytvoření třídy, její přizpůsobení a sledování toho, jak se žákům daří.\nPokud se ti Hedy líbí, můžeš oslovit školy, které znáš, a pomoci učitelům začít! Přes <a href=\"https://discord.gg/8yY7dEme9r\" target=\"_blank\">Discord</a> ti můžeme pomoci najít školy nebo učitele."
learn-more-sections:
-   title: Nadace Hedy
    text: "Hedy spravuje Nadace Hedy (Stichting Hedy), Catharina van Clevelaan 10, 1181BH Amstelveen, číslo nizozemské obchodní komory 94013985.\n\nSprávní radu nadace tvoří:\n\n  * Felienne Hermans, předsedkyně\n  * Annelies Vlaar, finance\n  * Renée Merbis, tajemnice\n\nČlenové správní rady Stichting Hedy za svou práci nedostávají žádnou finanční odměnu. Vážíme si všech darů pro Hedy! Peníze používáme na provoz serveru, údržbu a zlepšování webu Hedy. <a href=\"https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00\" target=\"_blank\">Klikni sem a přispěj v eurech </a> nebo <a href=\"https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02\" target=\"_blank\">klikni sem a přispěj v amerických dolarech</a>."
-   title: Podívej se pod povrch!
    text: "Chceš se dozvědět více o filozofii a návrhu Hedy? Podívej se na přednášku, kterou Felienne přednesla na konferenci StrangeLoop v roce 2022:\n\n<iframe width=\"560\" height=\"315\" class=\"mx-auto mt-4\" src=\"https://www.youtube.com/embed/fmF7HpU_-9k?wmode=opaque\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"\"></iframe>"
