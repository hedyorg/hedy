start-sections:
-   title: Začínáme s Hedy
    text: |-
        Vítejte v Hedy! Rádi vám pomůžeme začít.

        Naše [příručka učitele](https://www.hedy.org/for-teachers/manual) podrobně představuje všechny funkce. Tato stránka nabízí stručný přehled, abyste se zorientovali, než se do Hedy pustíte.

        Několik důležitých věcí:
        * Hedy pomáhá s vedením třídy dětí, které programují. Můžete vytvářet vlastní třídy a plány výuky a sledovat, jak se dětem daří.
        * Na začátku nemusíte o programování mnoho vědět. Hedy postupuje krok za krokem, i s vámi!
        * Hedy můžete používat ve svém mateřském jazyce, protože je přeložena do mnoha jazyků!
        * Programovat může každé dítě! Hedy je zvlášť užitečná pro děti se zrakovými obtížemi, protože dokáže číst materiály nahlas bez nutnosti používat myš.
        * Jsme tu pro vás. Najdete nás například na [Discordu](https://discord.gg/8yY7dEme9r) nebo nám můžete [napsat e-mail](hello@hedy.org).
-   title: Učitelé o Hedy
    text: |-
        Učitelé z celého světa nám dali najevo své nadšení pro Hedy. Někteří se s námi podělili o tato hodnocení:

        *Neuvěřitelně inspirativní! Skvělý způsob, jak programování mnohem více zpřístupnit sobě i žákům. Zkoušet si ho je velká zábava a má mnoho možností využití se žáky. Myslím, že je to velmi povedený nástroj! Věřím, že je to cenný způsob, jak mohou děti začít s programováním. Python a programování byly vždy velmi zajímavé, protože vstupní nároky na jejich učení jsou velmi vysoké. Teď jsou tyto nároky o něco nižší a bylo nám vysvětleno, že to vlastně může být velmi snadné. Bavilo mě vidět, jak se Hedy snaží programování co nejvíce zpřístupnit všem uživatelům!*
        Nizozemsko: budoucí učitelé matematiky pro nizozemské sekundární školy

        *Jednoduché rozhraní a dobré příklady.* Učitel: 3.–6. ročník základní školy

        *Programování ve více jazycích a samotná myšlenka postupného programování.* USA: middle school, 6.–8. ročník

        *Postupné seznamování s programováním.* Austrálie: střední škola

        *Automaticky pokračuje.* Nizozemsko: 2. ročník HAVO-VWO

        *Vysvětlení může být v nizozemštině (a kód v angličtině) a postupně přibývají další a další možnosti.* Nizozemsko: rozšiřující výuka

        *Hedy a její postupné úrovně… to je nápad! Chci vám osobně poděkovat, že jste ji vytvořili. Ani nedokážu vyjádřit, jak moc si toho vážím. Vidět u svých žáků takové zaujetí a nadšení jako s Hedy pro mě bylo úplně nové. Prošli jsme úrovně až do páté a plánujeme jí věnovat ještě týden ve výuce i při praktických cvičeních, než začneme s Pythonem.* Pákistán

        *Opravdovost programování — připomíná to, jak to vypadá ve skutečnosti.* Nizozemsko: rozšiřující výuka, skupiny 4–8

        *Činnosti krok za krokem. Zábavné činnosti.* Nizozemsko: 1. ročník všech typů, 2. ročník VWO/HAVO a VWO+, 3. ročník HAVO a VWO

        *Hedy se mi opravdu moc líbí. Je také dobře navržená, takže se hodí pro základní školu. Její postupný přístup funguje velmi dobře. Krátké vysvětlení na začátku každé úrovně a krátké ukázkové programy pomáhají dětem rychle pochopit, co je v dané úrovni nového. Velmi dobře funguje i možnost vybrat si z různých úloh. Vidíte, jak si děti vybírají úlohy, které je zaujmou, a pak na nich pracují napříč úrovněmi. Hedy velmi baví děti, kterým programování jde a chtějí si vyzkoušet skutečný programovací jazyk. Je dobrou přípravou na navazující sekundární školu, jakmile se tam začne více vyučovat informatika.* Nizozemsko: Montessori škola Oegstgeest

        *Je to skvěle vystavěné.* Nizozemsko: nižší stupeň nizozemské sekundární školy HAVO-VWO

        *Můžu držet tempo třídy.* Nizozemsko: skupiny 7 a 8

        ![Felienne učí děti](/images/teacherfeedback/Fkids1.JPG) *Felienne učí děti*        ![Děti se seznamují s Hedy](/images/teacherfeedback/Fkids2.JPG) *Děti se seznamují s Hedy*
teacher-guide:
-   title: Úvod
    key: úvod
    subsections:
    -   title: Co je to Hedy?
        text: "Hedy je textový programovací jazyk vyvinutý speciálně pro děti a dospívající ve věku 10 až 15 let.\nNa rozdíl od programovacích jazyků pro děti, jako je Scratch, nepoužívá bloky kódu, ale textový kód.\nS Hedy se tedy naučíte psát kód jako skuteční programátoři, ale po malých krocích a pomocí hravých cvičení.\nHedy tak může být přístupným a především zábavným odrazovým můstkem ke skutečným programovacím jazykům, jako je Python!\nPokud se chcete dozvědět více, podívejte se na toto <a href=\"https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s\" target=\"_blank\">video</a> o vývoji Hedy jako programovacího jazyka."
    -   title: Cílová skupina
        text: "Hedy je vyvíjena s ohledem na žáky vyšších ročníků základních škol (ve věku 10 až 15 let), ale používat ji může každý, kdo se chce naučit programovat!\nJe důležité, aby žáci uměli dobře číst. Doporučujeme s Hedy nezačínat, dokud nedosáhnou alespoň úrovně čtení odpovídající 3. třídě.\nŽáci (ani učitelé!) před začátkem práce s Hedy nepotřebují žádné zkušenosti s programováním."
    -   title: Jak Hedy funguje?
        text: "Hedy je rozdělena do úrovní, ve kterých se žáci učí nové programovací příkazy a koncepty. Každá úroveň obsahuje různá dobrodružství k procvičování nově naučených příkazů.\nHedy má tři části: Základní, Pokročilou a Expertní. V Základní části (úrovně 1–8) si můžete vyzkoušet zábavné a jednoduché programovací koncepty, například výpis textu, dotazy na vstup, jednoduché proměnné a opakování. V Pokročilé části (úrovně 9–12) se žáci pustí dál a naučí se pracovat s náročnějšími koncepty, jako jsou cykly, vnoření a funkce. Expertní část (úrovně 13–16) je určená k plynulému přechodu na úplnou syntaxi Pythonu.\nHedy se tedy hodí pro různé cíle vaší výuky: můžete žákům zprostředkovat radost z programování, naučit je základní koncepty nebo je připravit na skutečnou syntaxi Pythonu.\n\nJako učitel můžete rozhodovat nejen o tom, které úrovně budou žákům dostupné, ale i o dobrodružstvích v každé úrovni. Budou tvořit restauraci, kalkulačku, nebo strašidelný dům? Dobrodružství jsou v každé úrovni seřazená od nejlehčího po nejtěžší, ale můžete je libovolně kombinovat podle potřeb svých žáků.\nŽáci mohou dobrodružství absolvovat samostatně, doporučujeme je ale využívat při společné výuce.\n\nDobrodružství obsahují také ukázku kódu a řešení, aby s Hedy mohli pracovat i méně digitálně zdatní učitelé!\nHedy samozřejmě vychází vstříc také kreativním učitelům, kteří si rádi vytvářejí vlastní plány výuky a dobrodružství!\n\nPráci žáků a jejich pokrok můžete sledovat na stránce třídy."
    -   title: Zařízení
        text: "Hedy funguje na webu, tedy na jakémkoli zařízení s prohlížečem (Google Chrome, Firefox, Edge a dalšími). Můžete ji tak používat na noteboocích, Chromeboocích, tabletech i chytrých telefonech.\nPřed prací s Hedy nemusíte nic stahovat. Stačí přejít na web a můžete začít!\nK dispozici je také <a href=\"https://github.com/hedyorg/hedy/wiki/Offline-Hedy \" target=\"_blank\">offline verze</a> Hedy."
    -   title: Komunita Hedy
        text: "Všichni učitelé, programátoři a další příznivci Hedy jsou vítáni na našem <a href=\"https://discord.gg/8yY7dEme9r\" target=\"_blank\">serveru Discord</a>. Je to ideální místo k povídání o Hedy: máme kanály, kde můžete ukázat své zajímavé projekty a lekce, kanály pro hlášení chyb i kanály pro rozhovory s dalšími učiteli a týmem Hedy.\n<a href=\"https://www.youtube.com/watch?v=Lyz_Lnd-_aI\" target=\"_blank\">Zde</a> najdete video o tom, jak se připojit ke komunitě na Discordu.\n\nNovinky o Hedy můžete sledovat také <a href=\"https://hedy.org/subscribe\" target=\"_blank\">odběrem našeho zpravodaje</a> nebo nás sledovat na <a href=\"https://nl.linkedin.com/company/hedyorg\" target=\"_blank\">LinkedInu</a>."
    -   title: Hedy a GDPR
        text: "Organizace v EU musí při zpracování osobních údajů dodržovat GDPR (obecné nařízení o ochraně osobních údajů).\nProtože je tato problematika pro mnoho škol složitá, můžete všechny programovací funkce Hedy používat bez sdílení osobních údajů.\nNejjednodušší je používat Hedy bez vytváření účtů pro učitele a žáky. Bez účtů je Hedy dostupná, ale bez učitelského rozhraní. Nemůžete sledovat pokrok žáků ani rozhodovat, která dobrodružství a úrovně jim budou dostupné. Je to omezení, některé školy ale Hedy tímto způsobem používají.\n\nDruhou možností je vytvořit učitelský účet s e-mailovou adresou bez osobních údajů, například „docent25@email.com“. Kromě e-mailové adresy, která je potřebná jen pro obnovení hesla, nemusíte při vytváření učitelského účtu sdílet žádné informace.\nS učitelským účtem můžete vytvářet anonymní účty pro žáky, například rainbow-student1, rainbow-student2 atd. (podrobný návod najdete v části „Přípravy na výuku“). Tak můžete používat všechny funkce Hedy včetně ukládání pokroku, aniž byste sdíleli své osobní údaje nebo osobní údaje žáků.\n\nPokud tento postup ve vaší situaci nestačí, můžeme uzavřít smlouvu o zpracování vašich osobních údajů."
    -   title: Podpořte Hedy
        text: Pomozte nám udržet Hedy v chodu. Příspěvky používáme na provoz serveru, údržbu a vylepšování webu Hedy. Vážíme si každého daru! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Zde můžete přispět v eurech </a> nebo <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">zde v amerických dolarech</a>. Děkujeme!
-   title: Časté chyby
    key: běžné_chyby
    intro: Z chyb se můžete poučit, zvlášť při programování! Chybám se nevyhnete a nabízejí skvělou příležitost k učení. Pro učitele ale může být náročné najít správný způsob opravy, zejména když se programy s postupem žáků do dalších úrovní prodlužují. Proto jsme připravili seznam častých chyb v jednotlivých úrovních a jejich řešení.
    levels:
    -   level: '1'
        sections:
        -   title: Žáci zapomínají napsat příkazy
            example:
                error_text: Například napíšou větu bez použití příkazu print.
                error_code: Hedy to nemůže vypsat
                solution_text: Naučte žáky začínat každý řádek kódu příkazem.
                solution_code: '{print} Hedy to může vypsat!'
        -   title: Žáci používají při psaní příkazů velká písmena
            example:
                error_text: Příkazy nebudou fungovat, pokud budou napsány velkými písmeny.
                error_code: "Ask Proč můj kód nefunguje?\nPrint Protože používám velká písmena."
                solution_text: Změňte velká písmena na malá.
                solution_code: "{ask} Proč můj kód teď funguje?\n{print} Protože už nepoužívám velká písmena!"
        -   title: 'Žáci používají answer bez ask'
            example:
                error_text: answer slouží k zopakování odpovědi po příkazu ask. Bez ask nic nezopakuje.
                error_code: "{print} Tvoje jméno je {answer}"
                solution_text: Aby kód fungoval, doplňte příkaz ask.
                solution_code: "{ask} Jak se jmenuješ?\n{print} Tvoje jméno je {answer}"
        -   title: 'Želva: Žáci nechají želvu odejít z obrazovky'
            example:
                error_text: Žáci často rádi zkoušejí při práci se želvou velká čísla. Šipka pak odejde mimo obrazovku.
                error_code: |-
                    {forward} 300
                    {turn} 90
                solution_text: 'V tomto příkladu si žáci často myslí, že příkaz turn nefungoval, i když udělal přesně to, co měl. Želva totiž překročila hranice obrazovky. Předejděte tomu použitím menších čísel.'
                solution_code: '{forward} 100

                    {turn} 90'
        -   title: 'Želva: Žáci používají backward, ale takový příkaz neexistuje.'
            example:
                error_text: Backward není příkaz.
                error_code: backward 100
                solution_text: 'Pro pohyb želvy dozadu použijte příkaz forward a záporné číslo. Například:'
                solution_code: '{forward} -100'
        concepts_and_changes: |-
            V úrovni 1 žáci píšou a spouštějí své úplně první řádky kódu. Zatím si nemusí
            dělat starosti s interpunkcí: každý řádek začíná příkazem a zbytek je obyčejný
            text. Hlavní myšlenkou lekce je, že počítač udělá přesně to, co mu řeknete — nic
            víc a nic míň.

            Novinky v této úrovni:

            * Vypsání textu na obrazovku pomocí `{print}`
            * Položení otázky pomocí `{ask}` a použití odpovědi pomocí `{answer}`
            * Kreslení se želvou pomocí `{forward}` a `{turn}`
            * Zahrání tónu pomocí `{play}`
    -   level: '2'
        sections:
        -   title: Žáci dělají v příkazech překlepy
            example:
                error_text: Hedy nedokáže rozpoznat příkaz s překlepem.
                error_code: prinnt Nedělej překlepy
                solution_text: Naučte žáky číst chybové zprávy. Sami tak zjistí, co se pokazilo.
                solution_code: '{print} Nedělej překlepy'
        -   title: Žáci zapomínají, že se příkaz ask změnil
            example:
                error_text: V této úrovni se žáci učí o proměnných. Příkaz ask také vyžaduje proměnnou, ale žáci na to zapomínají.
                error_code: ask co si přeješ k jídlu
                solution_text: V této úrovni musíte Hedy říct, kam má uložit odpověď, aby se dala později použít. Tomu se říká proměnná.
                solution_code: objednávka {is} {ask} Co si přeješ k jídlu
        -   title: Žáci se snaží použít `{answer}` pro více otázek
            example:
                error_text: Proměnná `{answer}` stále funguje, ale ukládá vždy jen jednu odpověď. Žáci se někdy snaží uložit do jedné proměnné více odpovědí.
                error_code: "odpověď {is} {ask} Jak se jmenuješ?\nodpověď {is} {ask} Kolik je ti let?\n{print} Ahoj {answer}.\n{print} Je ti {answer} let."
                solution_text: Vysvětlete žákům, proč je důležité dávat proměnným výstižné názvy.
                solution_code: "jmeno {is} {ask} Jak se jmenuješ?\nvek {is} {ask} Kolik je ti let?\n{print} Ahoj {name}.\n{print} Je ti {age} let."
        -   title: Žáci používají název proměnné také jako běžné slovo
            example:
                error_text: V následujícím příkladu je slovo „jméno“ použité jako proměnná i jako běžný text. Tento kód vypíše „Ahoj, mé Hedy je Hedy“.
                error_code: "jméno {is} Hedy\n{print} Ahoj, mé jméno je jméno"
                solution_text: Nepoužívejte tedy slovo, které chcete použít v textu, jako název proměnné. Ve 4. úrovni se to řeší uvozovkami.
                solution_code: "jméno {is} Hedy\n{print} Ahoj, já jsem jméno"
        -   title: Žáci používají dlouhé názvy proměnných ze dvou slov.
            example:
                error_text: Název proměnné má tvořit jedno slovo. Dvě slova můžete spojit podtržítkem. Pak se počítají jako jedno.
                error_code: vybrané dveře is ask Které dveře si vybereš
                solution_text: Přidejte podtržítko.
                solution_code: vybrané_dveře {is} {ask} Které dveře si vybereš
        -   title: Žáci používají dva různé názvy pro tutéž proměnnou
            example:
                error_text: V tomto příkladu žák použil pro tutéž proměnnou názvy „kůň“ a „jméno“.
                error_code: "kůň {is} {ask} Jak se jmenuje tvůj kůň\n{print} Tvůj kůň se jmenuje jméno"
                solution_text: Vždy zkontrolujte, zda má proměnná v celém kódu stejný název. Drobné rozdíly (například množné číslo) se snadno přehlédnou, ale ovlivní fungování kódu.
                solution_code: "jméno {is} {ask} Jak se jmenuje tvůj kůň\n{print} Tvůj kůň se jmenuje jméno"
        concepts_and_changes: |-
            V úrovni 1 se žáci naučili používat proměnnou `{answer}`. V této úrovni se naučí používat více proměnných.
            Setkají se tak s prvním abstraktním pojmem programování: názvem, který zastupuje hodnotu, jež se může měnit.
            Aby mohli používat více proměnných, musí se je naučit také definovat.
            Proto se mění příkaz `{ask}`: před ním musí být proměnná, do které chtějí odpověď uložit.

            Novinky v této úrovni:

            * Uložení hodnoty do proměnné pomocí `{is}`
            * Uložení odpovědi do zvolené proměnné: `{is}` `{ask}` Jak se jmenuješ?
            * Pozastavení programu pomocí `{sleep}`
            * Otočení kreslicí želvy o zadaný počet stupňů: `{turn}` 90
    -   level: '3'
        sections:
        -   title: Žáci se snaží vypsat celé seznamy
            example:
                error_text: Seznam nelze vypsat. Pomocí {at} {random} můžete vypsat jen jednu položku ze seznamu.
                error_code: "potraviny {is} jablka, mléko, čokoláda\n{print} potraviny"
                solution_text: Chcete-li vypsat všechny potraviny, stačí je napsat za příkaz `{print}`. Nebo můžete ze seznamu vypsat jednu položku pomocí `{at}` `{random}`.
                solution_code: "{print} jablka, mléko, čokoláda\n\n# nebo\n\npotraviny {is} jablka, mléko, čokoláda\n{print} potraviny {at} {random}"
        -   title: Žáci používají název proměnné nebo seznamu jako běžný text
            example:
                error_text: Tento problém se pravděpodobně objevil už v úrovni 2. Teď může nastat i u seznamů.
                error_code: "jméno {is} Hedy\n{print} Ahoj, mé jméno je jméno\n\n# nebo\n\nzvíře {is} nosorožec, včela, labuť\n{print} Nejlepší zvíře je... zvíře {at} {random}"
                solution_text: Nepoužívejte názvy proměnných ani seznamů také jako běžný text, který chcete vypsat. V úrovni 4 tento problém vyřeší uvozovky.
                solution_code: "jméno {is} Hedy\n{print} Ahoj, já jsem jméno\n\n# nebo\n\nzvířata {is} nosorožec, včela, labuť\n{print} Nejlepší zvíře je... zvířata {at} {random}"
        -   title: Žáci zapomínají na `{at}` v `{at}` `{random}`
            example:
                error_text: Stejně jako v příkladu
                error_code: "ptáci {is} vrabec, racek, červenka\n{print} ptáci random"
                solution_text: Problém vyřeší doplnění slova at.
                solution_code: "ptáci {is} vrabec, racek, červenka\n{print} ptáci {at} {random}"
        -   title: Žáci zapomínají použít příkaz `{print}` spolu s `{at}` `{random}`
            example:
                error_text: Někdy také napíšou `{at}` `{random}` na začátek řádku.
                error_code: "ovoce {is} jablko, třešeň, banán\novoce {at} {random}"
                solution_text: Zdůrazněte žákům, že k vypsání textu vždy potřebují příkaz print.
                solution_code: "ovoce {is} jablko, třešeň, banán\n{print} ovoce {at} {random}"
        -   title: Žáci zapomínají používat čárky v seznamech
            example:
                error_text: V seznamu se položky oddělují čárkou.
                error_code: "pizzy {is} funghi tonno quattro stagioni\n{print} pizzy {at} {random}"
                solution_text: Za každou položkou seznamu by měla být čárka
                solution_code: "pizzy {is} funghi, tonno, quattro stagioni\n{print} pizzy {at} {random}"
        -   title: Žáci se snaží použít `{at}` `{random}` bez seznamu
            example:
                error_text: Například
                error_code: "kluby {is} Manchester United\n{print} kluby {at} {random}"
                solution_text: Hedy nemůže nic vypsat náhodně, protože nemá seznam, ze kterého by mohla vybírat.
                solution_code: "kluby {is} Manchester United, FC Bayern Munich, FC Barcelona\n{print} kluby {at} {random}"
        -   title: Žáci se snaží použít add/remove bez seznamu
            example:
                error_text: V příkladu níže není „jména“ seznam, ale proměnná. Nelze do ní nic přidat.
                error_code: "jména {is} Jake\ntvoje_jméno {is} {ask} Kdo jsi?\n{add} tvoje_jméno {to} jména\n{print} jména {at} {random}"
                solution_text: Nejprve musí existovat seznam. Přidejte proto druhé jméno, například Amy, aby se z proměnné jména stal seznam. Pokud Amy v seznamu nechcete, můžete ji pak odstranit pomocí remove.
                solution_code: "jména {is} Jake, Amy\ntvoje_jméno {is} {ask} Kdo jsi?\n{add} tvoje_jméno {to} jména\n{print} jména {at} {random}"
        -   title: Žáci zapomínají používat `{to}`/`{from}` v `{add}`/`{remove}`
            example:
                error_text: Bez to/from příkaz add/remove nefunguje.
                error_code: "dobrodružství {is} příběh, papoušek, kostky\nvolba {is} Které dobrodružství máš nejraději?\n{add} volba\n{remove} kostky\n{print} Mám rád dobrodružství {at} {random}"
                solution_text: Hedy musí vědět, do kterého seznamu má položku přidat nebo ze kterého ji má odebrat.
                solution_code: "dobrodružství {is} příběh, papoušek, kostky\nvolba {is} Které dobrodružství máš nejraději?\n{add} volba {to_list} dobrodružství\n{remove} kostky {from} dobrodružství\n{print} Mám rád dobrodružství {at} {random}"
        concepts_and_changes: |-
            Úroveň 3 přidává seznamy a náhodný výběr. Poprvé se může stát, že tentýž
            program při dvou spuštěních dá různý výsledek. To může překvapit žáky,
            kteří program považují za pevně daný postup. Je vhodná chvíle nechat je kód
            několikrát spustit, než rozhodnou, zda funguje.

            Novinky v této úrovni:

            * Vytvoření seznamu pomocí `{is}` a náhodný výběr položky pomocí `{at} {random}`
            * Přidání položky do seznamu pomocí `{add} {to}`
            * Odebrání položky ze seznamu pomocí `{remove} {from}`
    -   level: '4'
        sections:
        -   title: Žáci zapomínají na uvozovky před textem nebo za ním
            example:
                error_text: 'V této úrovni vyžadují print a ask dvojici uvozovek: jednu před textem a druhou za ním.'
                error_code: "{print} Ahoj\nnálada {is} {ask} 'Jak se máš?"
                solution_text: Doplňte správné uvozovky.
                solution_code: "{print} 'Ahoj'\nnálada {is} {ask} 'Jak se máš?'"
        -   title: Žáci používají nesprávné uvozovky
            example:
                error_text: Na začátku hodiny ověřte, zda žáci umějí správně napsat uvozovky. V Hedy mohou používat jednoduché uvozovky ('') i dvojité uvozovky (""). Zpětné apostrofy však jako uvozovky neplatí (``).
                error_code: "{print} `Vítejte v restauraci`\njídlo {is} {ask} ,Co si přejete objednat?,"
                solution_text: 'Toto jsou správné uvozovky:'
                solution_code: "{print} 'Vítejte v restauraci'\njídlo {is} {ask} 'Co si přejete objednat?'"
        -   title: Žáci používají apostrof uvnitř textu ohraničeného jednoduchými uvozovkami
            example:
                error_text: Apostrofy můžete používat jen tehdy, když text uzavřete do dvojitých uvozovek. V angličtině se často používají ve zkrácených tvarech jako you're, don't nebo what's.
                error_code: "{print} 'Apostrof ' ti teď způsobí chybu'"
                solution_text: Problém vyřešíte použitím dvojitých uvozovek.
                solution_code: "{print} \"Apostrof ' ti už nezpůsobí chybu!\""
        concepts_and_changes: |-
            V úrovni 4 žáci poprvé poznávají, jak důležitá je v programování syntaxe. Text u příkazů `{print}` a `{ask}` se nově píše do uvozovek. Možná to není nejzábavnější úroveň, ale jde o velmi důležitou dovednost pro další postup. Žáci s ní mohou mít potíže, zvlášť když se v textu objevují proměnné. Doporučujeme pravidla názorně vysvětlit a procvičovat je společně se žáky.

            Novinky v této úrovni:

            * Uvozovky kolem všech textových řetězců za `{print}` a `{ask}`
            * Ponechání proměnných mimo uvozovky
            * Dvojité uvozovky pro řetězec, který obsahuje apostrof
            * Vymazání obrazovky pomocí `{clear}`
            * Použití barev při kreslení se želvou pomocí `{color}`
    -   level: '5'
        sections:
        -   title: Žáci zapomínají použít `{print}` v příkazu `{if}`
            example:
                error_text: Po `{if}` nebo `{else}` žáci zapomínají použít další příkaz, například `{print}` nebo `{ask}`.
                error_code: "{if} jméno {is} Hedy 'Skvělé!'\n{else}  Hedy {is} lepší!"
                solution_text: Opravte kód doplněním příkazu print.
                solution_code: "{if} jméno {is} Hedy {print} 'Skvělé!'\n{else} {print} 'Hedy je lepší!'"
        -   title: Žáci používají dva různé názvy pro tutéž proměnnou
            example:
                error_text: V tomto příkladu žák použil pro tutéž proměnnou názvy „kůň“ a „jméno“.
                error_code: "kůň {is} {ask} 'Jak se jmenuje tvůj kůň?'\n{if} jméno {is} Bonfire {print} 'super'\n{else} {print} 'méně super!'"
                solution_text: Vždy zkontrolujte, zda má proměnná v celém kódu stejný název. Drobné rozdíly (například množné číslo) se snadno přehlédnou, ale ovlivní fungování kódu.
                solution_code: "kůň {is} {ask} 'Jak se jmenuje tvůj kůň'\n{if} kůň {is} Bonfire {print} 'super!'\n{else} {print} 'méně super!'"
        -   title: Žáci stále zapomínají na uvozovky před textem nebo za ním
            example:
                error_text: S příkazem `{if}` mohou být řádky kódu velmi dlouhé a žáci pak často zapomínají na uvozovky.
                error_code: "{if} jméno {is} Hedy {print} zábava\n{else} {print} 'nic moc!"
                solution_text: V příkazu print vždy použijte dvě uvozovky.
                solution_code: "{if} jméno {is} Hedy {print} 'zábava'\n{else} {print} 'nic moc!'"
        -   title: Žáci píšou uvozovky kolem názvů proměnných
            example:
                error_text: V této úrovni se kolem názvů proměnných nepíšou uvozovky.
                error_code: "{if}  jméno  {is} 'Hedy' {print} 'zábava'\n{else} {print} 'nic moc!'"
                solution_text: Odstraňte uvozovky, aby kód fungoval.
                solution_code: "{if} jméno {is} Hedy {print} 'zábava'\n{else} {print} 'nic moc!"
        -   title: Žáci používají dlouhé názvy proměnných se dvěma nebo více slovy
            example:
                error_text: Názvy proměnných v Hedy nemohou obsahovat mezery. Když žáci chtějí spojit několik slov, musí použít podtržítka (_).
                error_code: vybrané dveře {is} {ask}  'Které dveře si vybereš?'
                solution_text: Přidejte podtržítko.
                solution_code: vybrané_dveře {is} {ask} 'Které dveře si vybereš?'
        -   title: Žáci chtějí uznat více správných odpovědí
            example:
                error_text: Například tento žák chce, aby Hedy všem jeho kamarádům řekla, že jsou vtipní, a ostatním spolužákům, že nejsou.
                error_code: "{if} jméno {is} Jesse, David, Souf {print} 'Jsi vtipný' {else} {print} 'Nejsi vtipný'"
                solution_text: "Můžete k tomu použít příkaz `{in}`. Přestože je vysvětlený až ve vyšší úrovni, funguje už v úrovni 5.\nDalší možností je použít více příkazů `{if}` a žádný `{else}`. Nevýhodou je, že program ostatním spolužákům neřekne, že nejsou vtipní."
                solution_code: "kamarádi {is} Jesse, David, Souf\njméno {is} {ask} 'Kdo jsi?'\n{if} jméno {in} kamarádi {print} 'Jsi vtipný*á'\n{else} {print} 'Nejsi vtipný*á'\n\n# nebo\n\njméno {is} {ask} 'Kdo jsi?'\n{if} jméno {is} Jesse {print} 'Jsi vtipný*á'\n{if} jméno {is} David {print} 'Jsi vtipný*á'\n{if} jméno {is} Souf {print} 'Jsi vtipný*á'"
        -   title: Žáci dávají proměnné stejný název jako hodnotě v příkazu `{if}`
            example:
                error_text: V příkladu níže je heslem slovo „heslo“. Program proto každé zadané heslo vyhodnotí jako správné.
                error_code: "heslo {is} {ask} 'Jaké je heslo?'\n{if} heslo {is} heslo {print} 'Přístup povolen'\n{else} {print} 'Přístup zamítnut!'"
                solution_text: Zvolte jiný název proměnné.
                solution_code: "tajné_heslo {is} {ask} 'Jaké je heslo'\n{if} tajné_heslo {is} heslo {print} 'Přístup povolen!'\n{else} {print} 'Přístup zamítnut!'"
        concepts_and_changes: |-
            V této úrovni přibývají příkazy `{if}` a `{else}`.

            Novinky v této úrovni:
            * Rozhodování pomocí `{if}` a `{else}`
    -   level: '6'
        sections:
        -   title: Žáci píšou příkaz {if} na jeden řádek
            example:
                error_text: Žáci se někdy snaží napsat všechno na jeden řádek. To už v této úrovni není dovoleno.
                error_code: "zvíře {is} {ask} 'Jaké je tvoje oblíbené zvíře?'\n{if} zvíře {is} pes {print} 'Taky mám rád psy!'\n{elif} zvíře {is} kočka {print} 'Kočky jsou fajn'\n{else} {print} 'To je super zvíře'"
                solution_text: 'Od této úrovně nestačí jen psát {if} a {else} na samostatné řádky. Také podmínka a příkaz, který se při jejím splnění provede, musí být na různých řádcích. Takto: '
                solution_code: 'zvíře {is} {ask} ''Jaké je tvoje oblíbené zvíře?'' {if} zvíře {is} pes {print} ''Taky miluju psy!'' {elif} zvíře {is} kočka {print} ''Kočky jsou fajn'' {else} {print} ''Super zvíře'''
        -   title: Žáci používají `{elif}` stejně jako `{else}`, tedy bez podmínky
            example:
                error_text: 'Žáci zapomínají, že musí uvést podmínku'
                error_code: "barva {is} {ask} 'Jaká je tvoje oblíbená barva?\n{if} barva {is} zelená\n{print} 'Taky mám rád zelenou!'\n{elif}\n{print} 'Mám rád zelenou'"
                solution_text: Doplňte podmínku
                solution_code: "barva {is} {ask} 'Jaká je tvoje oblíbená barva?\n{if} barva {is} zelená\n{print} 'Taky mám rád zelenou!'\n{elif} barva {is} modrá\n{print} 'Modrá je fajn'\n{else}\n{print} 'Mám rád zelenou'"
        -   title: Žáci používají {in} bez seznamu
            example:
                error_text: Žáci zapomínají, že potřebují seznam
                error_code: |-
                    {if} vybraná_barva {in} hezké_barvy
                    {print} 'Skvělá volba!'
                solution_text: Přidejte seznam
                solution_code: |-
                    hezké_barvy {is} modrá, zelená, fialová
                    {if} vybraná_barva {in} hezké_barvy
                    {print} 'Skvělá volba!'
        concepts_and_changes: |-
            Tato úroveň navazuje na nové příkazy `{if}` a `{else}` z předchozí úrovně. Pomocí `{if}` a `{else}` může program volit mezi dvěma možnostmi. Teď se žáci naučí přidávat další možnosti pomocí `{elif}`. Je důležité, aby se naučili psát `{if}`, `{elif}` a `{else}` na samostatné řádky. Také se naučí pomocí `{in}` ověřit, zda je odpověď v seznamu.

            Novinky v této úrovni:

            * Přidání dalších možností pomocí `{elif}`
            * Ověření, zda je něco v seznamu, pomocí `{in}`
    -   level: '7'
        sections:
        -   title: Žáci mají potíže s uvozovkami
            example:
                error_text: Někteří žáci mají potíže s tím, kdy mají přidat uvozovky a kdy ne. Když uvozovky přidáte, na obrazovce se doslova zobrazí „5+5“.
                error_code: "{print} '5 + 5'"
                solution_text: 'Tento kód vypíše na obrazovku „10“.'
                solution_code: "{print} 5 + 5"
        -   title: Žáci mají potíže s počítáním pomocí proměnné
            example:
                error_text: 'Pro některé žáky je počítání s proměnnými obtížné. Ukažte jim velmi jednoduché příklady, například:'
                error_code: "věk = {ask} 'Kolik je ti let?'\n{print} 'Příští rok ti bude ' věk + 1"
                solution_text: Nebo zkuste o něco složitější příklad.
                solution_code: "cena = 0\n{print} 'Vítejte v naší hamburgerové restauraci'\nburger = {ask} 'Dáte si burger?'\n{if} burger = ano\ncena = cena + 10\nnápoj = {ask} 'Dáte si nápoj?'\n{if} nápoj = ano\ncena = cena + 4\n{print} 'Bude to ' cena ' eur, prosím'"
        -   title: Žáci zapomínají na znak =
            example:
                error_text: Hedy vždy dovoluje používat {is} místo =, takže to není chyba. Pokud chcete žáky připravit na Python nebo jiné programovací jazyky, doporučujeme je naučit používat =. Jestli jim chcete programování jen představit, nemusíte řešit, zda používají = nebo {is}.
                error_code: "jméno {is} Hedy"
                solution_text: znak =
                solution_code: "jméno = Hedy"
        -   title: Žáci používají v desetinných číslech čárku místo tečky
            example:
                error_text: V některých jazycích je zvykem oddělovat desetinná místa čárkou. V programovacích jazycích, a tedy i v Hedy, se používá tečka.
                error_code: '{print} 2,5 + 2,5'
                solution_text: V desetinných číslech použijte tečky
                solution_code: '{print} 2.5 + 2.5'
        concepts_and_changes: |-
            V této úrovni se žáci naučí ve svých programech počítat. Odteď mohou počítat s proměnnými i desetinnými čísly.

            Novinky v této úrovni:
            * Použití matematických znamének: + - * a /
            * Desetinná čísla s tečkou
            * Použití proměnných při výpočtech
            * Použití znaku = místo `{is}`
    -   level: '8'
        sections:
        -   title: Žáci zapomínají na některé slovo příkazu repeat nebo na příkaz print
            example:
                error_text: Ověřte, že žáci umějí používat úplný příkaz repeat i příkaz print.
                error_code: "{repeat} 3 {times}  \"Vždyť je to veselý dobrák\"\n{repeat} 3 {print} 'To nikdo nemůže popřít!'"
                solution_text: 'Toto je správný kód:'
                solution_code: "{repeat} 3 {times} {print} \"Vždyť je to veselý dobrák\"\n{repeat} 3 {times} {print} 'To nikdo nemůže popřít!'"
        -   title: Žáci se snaží opakovat více řádků
            example:
                error_text: V této úrovni můžete opakovat jen jeden řádek kódu. V příkladu chtěl žák vypsat tři různé nápoje, ale program to neudělá. Třikrát položí otázku a pak vypíše jen poslední odpověď.
                error_code: "{repeat} 3 {times} nápoj = {ask} 'Co si přejete k pití?'\n{print} nápoj"
                solution_text: "Více řádků můžete opakovat až v další úrovni. V této úrovni tedy musíte každý nápoj vypsat zvlášť."
                solution_code: "nápoj = {ask} 'Co si přejete k pití?'\n{print} nápoj\nnápoj = {ask} 'Co si přejete k pití?'\n{print} nápoj\nnápoj = {ask} 'Co si přejete k pití?'\n{print} nápoj"
        -   title: Žáci vytvářejí programy, které běží příliš dlouho
            example:
                error_text: "V této úrovni lze snadno vytvořit program, jehož dokončení trvá dlouho. Pokud program běží příliš dlouho, zastaví se, aby zbytečně nezatěžoval žákův počítač."
                error_code: "{repeat} 100 {times} {print} 'Kolikrát to můžu zopakovat?'"
                solution_text: 'Ověřte, že spuštění kódu netrvá příliš dlouho'
                solution_code: "{repeat} 20 {times} {print} 'To stačí'"
        concepts_and_changes: |-
            V této poslední úrovni Hedy Basic se vaši žáci naučí používat opakování! Zatím mohou opakovat jen jeden řádek. Opakování více řádků se naučí v dalších úrovních.

            Novinky v této úrovni:
            * Opakování řádku pomocí `{repeat} 3 {times}`
            * Opakování řádku tolikrát, kolik určuje hodnota proměnné
    -   level: '9'
        sections:
        -   title: Žáci používají odsazení nesprávně
            example:
                error_text: Odsazení je v této úrovni nové a pro některé žáky může být obtížné. Než s ním napíšou celý program, nechte je procvičit několik jednoduchých příkladů.
                error_code: "{repeat} 3 {times}\n{print} 'ahoj'"
                solution_text: 'Toto je správný kód:'
                solution_code: "{repeat} 3 {times}\n    {print} 'ahoj'"
        -   title: Žáci opakují jen jeden řádek, přestože chtěli opakovat více řádků
            example:
                error_text: Například v kódu níže chtěl žák přijmout objednávku nápojů od tří lidí. Program se ale třikrát zeptal a pak zapsal jen jednu objednávku.
                error_code: |-
                    {repeat} 3 {times}
                        nápoj = {ask} 'Co si přejete k pití?'
                    {print} nápoj
                solution_text: |-
                    Ve správném kódu je odsazený i třetí řádek. Patří tak do bloku repeat, a proto se třikrát zopakuje.
                    Ukažte žákům tento rozdíl. Pomůže jim pochopit, proč potřebujeme odsazení, aby programy fungovaly.
                solution_code: |-
                    {repeat} 3 {times}
                        nápoj = {ask} 'Co si přejete k pití?'
                        {print} nápoj
        -   title: Žáci chtějí vnořovat příkazy `{if}` nebo vkládat příkazy `{if}` do cyklu
            example:
                error_text: |-
                    V této úrovni žáci ještě nemohou vkládat příkazy `{if}` do jiných příkazů `{if}` ani do cyklů repeat.
                    V další úrovni už to možné je.
                error_code: |-
                    narozeniny = {ask} 'Máš narozeniny?'
                    {if} narozeniny = ano
                        {repeat} 3 {times}
                            {print} 'Hip hip hurá!'
                solution_text: 'Toto je správný kód pro tuto úroveň:'
                solution_code: |-
                    narozeniny = {ask} 'Máš narozeniny?'
                    {if} narozeniny = ano
                        {print} 'Hip hip hurá!'
                        {print} 'Hip hip hurá!'
                        {print} 'Hip hip hurá!'
        -   title: Žáci vytvářejí programy, které běží příliš dlouho
            example:
                error_text: V této úrovni lze snadno vytvořit program, jehož dokončení trvá dlouho. Pokud program běží příliš dlouho, zastaví se, aby zbytečně nezatěžoval žákův počítač.
                error_code: |-
                    {repeat} 100 {times}
                        {print} 'Kolikrát to můžu zopakovat?'
                solution_text: Ověřte, že spuštění kódu netrvá příliš dlouho
                solution_code: |-
                    {repeat} 20 {times}
                        {print} 'To stačí'
        concepts_and_changes: |-
            V této první úrovni Hedy Advanced se žáci učí používat odsazení. Díky tomu mohou za podmínkou provést více řádků nebo více řádků opakovat. Tato úroveň je často baví, protože jim umožní psát složitější programy.
            Někteří žáci ale mohou mít potíže s pochopením, kdy a jak odsazení použít.

            Novinky v této úrovni:
            * Více řádků za `{if}`, `{elif}` nebo `{else}` pomocí odsazení
            * Více řádků za `{repeat}` pomocí odsazení
    -   level: '10'
        sections:
        -   title: Žáci dělají chyby v odsazení
            example:
                error_text: Nejtěžší v této úrovni je správné odsazení. Žáci rádi vnořují příkazy `{if}`, někdy dokonce do jiných vnořených příkazů `{if}`. Uhlídat všechna odsazení pak může být náročné.
                error_code: "{print} 'Robin jde do centra'\nmísto = {ask} 'Jde Robin do obchodu, nebo domů?'\n{if} místo {is} obchod\n    {print} 'Vchází do obchodu.'\n    {print} 'Robin vidí zajímavou knihu'\n    kniha = {ask} 'Koupí si Robin knihu?'\n        {if} kniha {is} ano\n{print} 'Robin si koupí knihu a jde domů'\n{else}\n    {print} 'Robin odchází z obchodu a jde domů'\n{else}\n    {print} 'Robin jde domů'"
                solution_text: Toto je správný kód. Při vkládání příkazů `{if}` do jiných příkazů `{if}` sledujte, které části patří do jednotlivých bloků.
                solution_code: "{print} 'Robin jde do centra'\nmísto = {ask} 'Jde Robin do obchodu, nebo domů?'\n{if} místo {is} obchod\n    {print} 'Vchází do obchodu.'\n    {print} 'Robin vidí zajímavou knihu'\n    kniha = {ask} 'Koupí si Robin knihu?'\n    {if} kniha {is} ano\n        {print} 'Robin si koupí knihu a jde domů'\n    {else}\n        {print} 'Robin odchází z obchodu a jde domů'\n{else}\n    {print} 'Robin jde domů'"
        -   title: Žáci si pletou `{and}` a `{or}`
            example:
                error_text: Oba příkazy mohou vypadat podobně, ale mají velmi odlišnou funkci.
                error_code: "hra = {ask} 'Chceš si zahrát hru?'\nčas = {ask} 'Máš čas si hrát?'\n{if} hra {is} 'ano' {or} čas {is} 'ano'\n    {print} 'Pojďme si zahrát!'"
                solution_text: V tomto případě má člověk odpovědět ano na obě otázky, proto použijte `and`.
                solution_code: "hra = {ask} 'Chceš si zahrát hru?'\nčas = {ask} 'Máš čas si hrát?'\n{if} hra {is} 'ano' {and} čas {is} 'ano'\n    {print} 'Pojďme si zahrát!'"
        -   title: Žáci píšou neúplné řádky s `{or}`
            example:
                error_text: Za {or} musí být úplná podmínka.
                error_code: |-
                    barva = {ask} 'Jakou barvu máš rád?'
                    {if} barva {is} modrá {or} zelená
                        {print} 'Krásná!'
                solution_text: 'Doplňte řádek takto:'
                solution_code: |-
                    barva = {ask} 'Jakou barvu máš rád?'
                    {if} barva {is} modrá {or} barva {is} zelená
                        {print} 'Krásná!'
        concepts_and_changes: |-
            V této úrovni znovu rozšiřujeme možnosti {if} a {repeat}. V předchozí úrovni se žáci naučili používat více řádků za {repeat, {if}, {elif} nebo {else}.
            Teď se naučí také *vnoření*: vložit {if} nebo {repeat} dovnitř jiného {if} nebo {repeat}. Naučí se i dva nové příkazy: {and} a {or}.
            Díky tomu budou mít více možností, jak psát rozmanité programy.

            Novinky v této úrovni:
            * Vnoření {if} a {repeat}
            * Použití {and} a {or} za {if}
    -   level: '11'
        sections:
