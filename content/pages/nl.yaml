start-sections:
-   title: Beginnen met Hedy
    text: |-
        Welkom bij Hedy, wij zijn blij jouw te helpen met het starten met Hedy.

        Onze [Leraren Handleiding](https://www.hedy.org/for-teachers/manual) heeft een overzicht van alle mogelijkheden in detail, echter deze pagina heeft een beknopte versie zodat je dat weet wat het is voordat je er in duikt. 

        Een paar hoogtepunten die belangrijk zijn om te weten: 
        * Hedy is een instrument ontworpen om het managen van een klas met kinderen die programmeren! Jij kan je eigen lessen creëren, lesplannen en volgen hoe kinderen het doen. 
        * Jij hoeft niet veel te weten over programmeren als je er mee begint, Heby werkt voor stap voor stap, ook voor jou!
        * Jij kunt Hedy in jouw eigen moedertaal gebruiken, omdat het vertaald is in heel veel talen.
        * Ieder kind kan programmeren!! Hedy is speciaal behulpzaam voor kinderen met visuele beperkingen omdat het allemaal hardop kan oplezen, zonder de noodzaak van het gebruik van een muis..
        * Wij zijn hier om te helpen, je kunt ons vinden bijvoorbeeld op [Discord](https://discord.gg/8yY7dEme9r) of je kan [mail-ons](hello@hedy.org).
-   title: Leraren over Hedy
    text: |-
        Een tijdje geleden hebben we een enquête onder leraren gehouden.
        We vroegen naar ideeën voor verbetering en Hedy's beste eigenschappen.
        Hieronder een aantal van de antwoorden:

        Simpele interface en goede voorbeelden. *(NL): groep 6-8*

        Meertalig programmeren en het hele graduele programmeren zelf. *(US) middelbare school*

        Het graduele introduceren van programmeren. *(Australië) middelbare school*

        De constructie is zo goed! *(NL) onderbouw HAVO-VWO*

        Ik kan de klas goed volgen. *(NL) groep 7-8*

        Gaat automatisch verder. *(NL) 2 HAVO-VWO*

        Zowel dat de uitleg in het NL kan (en code in EN) en dat het opbouwt in mogelijkheden.
        *(NL) plus klas groep 7*

        De 'echtheid' van programmeren, het lijkt op de realiteit. *(NL) plus klas groep 4-8*

        Stap voor stap activiteiten. Leuke activiteiten. *(NL) 1-3 HAVO-VWO*

        Hedy en haar graduele levels.... wat een idee!
        Ik wil jullie persoonlijk bedanken voor het maken hiervan. Ik kan jullie niet genoeg danken. Ik heb nog nooit zoveel enthousiasme in mijn klas gezien,
        als met Hedy. We zijn tot level 5 gegaan en zijn van plan nog een extra week in de klas en labs door te gaan voordat we overstappen op Python.
        *Pakistan*

        Ik vind Hedy echt heel gaaf en het is mooi qua opzet, wat het geschikt maakt voor basisonderwijs.
        Hedy's graduele concept werkt heel goed.
        De korte uitleg aan het begin van ieder level en de korte voorbeeldjes helpen de kinderen snel op weg met de nieuwigheden in het level.
        De verschillende avonturen die ze kunnen kiezen werken erg goed.
        Je ziet de kinderen de avonturen kiezen die ze aanspreekt en ze werken daarmee door de levels.
        Hedy is erg leuk voor kinderen die al goed zijn in programmeren en die een voorproefje willen van echt programmeren.
        Het is een goede voorbereiding op voortgezet onderwijs als daar meer ICT wordt onderwezen.
        *(NL) Montessori school*

        <img width="500px" src="static/images/teacherfeedback/Fkids1.JPG"></img>
teacher-guide:
-   title: Introductie Hedy
    key: intro
    subsections:
    -   title: Wat is Hedy?
        text: |-
            Hedy is een tekstuele programmeertaal speciaal ontwikkeld voor jongeren.
            In tegenstelling tot andere programmeertalen voor kinderen zoals Scratch, maakt Hedy geen gebruik van codeblokken, maar is het een tekstuele programmeertaal.
            Met Hedy leer je dus codes typen zoals de echte programmeurs dat doen, maar in kleine stapjes en met speelse opdrachten.
            Daarnaast kun je met Hedy programmeren in je eigen voorkeurstaal. Je kunt dus kiezen voor Nederlandse commando's!
            Zo functioneert Hedy als opstapje naar de talen zoals Python op een laagdrempelige en vooral leuke manier!
            Hier vind je een (Engelstalige) <a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">video</a> over hoe Hedy tot stand is gekomen.
    -   title: Doelgroep
        text: |-
            Hedy is ontwikkeld met het oog op kinderen in de bovenbouw van de basisschool en de onderbouw van het voortgezet onderwijs, maar kan gebruikt worden voor iedereen die wil leren programmeren.
            Het is belangrijk dat de leerlingen goed kunnen lezen, dus AVI-M5 is wel een vereiste.
            De leerlingen (en leraren!) hoeven geen programmeerervaring te hebben om met Hedy aan de slag te kunnen.
    -   title: Hoe werkt Hedy?
        text: |-
            Hedy is verdeeld in levels, waarin nieuwe programmeercommando's en -concepten worden aangeleerd. Elk level bevat verschillende avonturen om de nieuw geleerde lesstof te oefenen.
            Hedy is verdeeld in drie leerroutes: Basis, Gevorderd en Expert. In Hedy Basis (level 1–8) kun je leuke en eenvoudige programmeerconcepten ontdekken, zoals tekst afdrukken, om invoer vragen, eenvoudige variabelen gebruiken en herhaling. In Hedy Gevorderd (level 9–12) gaan je leerlingen een stap verder en leren ze complexere ideeën aan te pakken, zoals lussen, nesten en functies. Hedy Expert (niveaus 13–16) is ontworpen om soepel over te stappen naar de volledige Python-syntax.
            Dus wat je ook met je leerlingen wilt bereiken, Hedy heeft een passende route. Of het nu gaat om hen simpelweg programmeerplezier te laten ervaren, hen basisconcepten te leren of hen voor te bereiden op de echte Python-syntax.

            Niet alleen kun je als docent bepalen welke levels beschikbaar zijn voor je leerlingen, je kunt ook bepalen welke avonturen per level beschikbaar zijn. Gaan ze een restaurant, een rekenmachine of een spookhuis maken? Binnen elk level zijn de avonturen gerangschikt van makkelijk naar moeilijk, maar je kunt ze op elke manier combineren die het beste bij je leerlingen past.
            Leerlingen kunnen zelfstandig met Hedy aan de slag, maar we raden aan om ze te gebruiken tijdens klassikale instructie.

            De avonturen bevatten ook een codevoorbeeld en oplossingen, zodat ook docenten die minder digitaalvaardig zijn Hedy kunnen gebruiken!
            Natuurlijk biedt Hedy ook mogelijkheden voor creatieve docenten die graag hun eigen lesplannen en avonturen maken!

            Je kunt het werk en de voortgang van je leerlingen volgen via de klassenpagina.

    -   title: Apparaten
        text: |-
            Hedy werkt via internet en werkt op alle apparaten waar een browser (Google Chrome, Firefox, Edge etc) op staat, dus laptops, Chromebooks, tablets en telefoons zijn allemaal geschikt.
            Je hoeft niets te downloaden om met Hedy te kunnen werken, ga gewoon naar de website en dan ben je er al helemaal klaar voor!
            Er is ook een <a href="https://github.com/hedyorg/hedy/wiki/Offline-Hedy " target="_blank">offline versie</a> van Hedy beschikbaar.
    -   title: De Hedy Community
        text: |-
            Alle Hedy leerkrachten, programmeurs en andere fans zijn welkom op onze <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord server</a>. Dit is een goede plek om te praten over Hedy: We hebben kanalen waar je gave projecten en lesideeën kunt laten zien, kanalen om fouten (bugs) te melden en kanalen om te kletsen met andere leerkrachten en het Hedy team.
            <a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">Hier</a> vind je een (Engelstalige) video over hoe jij je kunt aansluiten bij onze community.

            Of blijf op de hoogte via onze <a href="https://hedy.org/subscribe" target="_blank">nieuwsbrief</a>. Of volg ons op <a href="https://nl.linkedin.com/company/hedyorg" target="_blank">LinkedIn</a>.
    -   title: Hedy en de AVG
        text: |-
            Organisaties in de EU zijn verplicht zich te houden aan de AVG (Algemene Verordening Gegevensbescherming) indien persoonsgegevens verwerkt worden.

            Omdat dat voor veel scholen een complex vraagstuk is, kun je alle programmeer-functionaliteiten van Hedy gebruiken zonder persoonsgegevens te delen.
            De allereenvoudigste manier hiervoor is Hedy gebruiken zonder het aanmaken van accounts voor leerkracht en leerlingen. Hedy zelf is dan beschikbaar, maar de leerkrachtenomgeving niet. Je kunt zo de voortgang van je leerlingen niet inzien, of bepalen welke levels en avonturen beschikbaar zijn voor hen. Dat is beperkend, maar er zijn scholen die Hedy op die manier inzetten.

            Een tweede manier is om als leerkracht een account aan te maken met een mailadres zonder persoonsgegevens, bijv "leraar25@email.com". Behalve een mailadres, alleen nodig voor het resetten van je wachtwoord, hoef je geen persoonsgegevens te delen als je een lerarenaccount aanmaakt.
            Vervolgens kan je met je leerkrachtenaccount ook anonieme accounts aanmaken voor leerlingen, bijv regenboog-leerling1, regenboog-leerling2 etc (zie verder: Onderwijsvoorbereidingen). Op die manier kan je alle functionaliteit van Hedy gebruiken zonder het delen van persoonsgegevens van jezelf of je leerlingen.

            Mocht dit voor jouw context niet voldoen, dan kunnen we een dan kunnen we een verwerkersovereenkomst tekenen voor het verwerken van jullie persoonsgegevens.
    -   title: Steun Hedy
        text: |-
             Om Hedy in de lucht te houden is er geld nodig. Doneren kan geheel vrijblijvend en eenmalig. We waarderen elke bijdrage enorm! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Klik hier om een bijdrage te leveren </a>. We gebruiken het geld om de server in de lucht te houden en om de website te onderhouden en te verberteren.
-   title: Veelgemaakte fouten
    key: common_mistakes
    intro: |-
        Van fouten kun je leren en dat geldt al helemaal bij programmeren! Fouten maken is onvermijdelijk en helemaal niet erg, maar het kan als leerkrachten soms nog knap lastig zijn om foutjes van leerlingen op te sporen en op te lossen. Vooral als de programma's almaar langer worden, wanneer de leerlingen hogere levels bereiken. Daarom hebben wij hier per level een lijst gemaakt van de meest gemaakte fouten en de oplossingen.
    levels:
    -   level: "1"
        concepts_and_changes: |-
            Level 1 is waar leerlingen hun allereerste regels code schrijven en uitvoeren.
            Er is nog geen interpunctie om je zorgen over te maken: elke regel begint met een commando en de rest van de regel is gewone tekst.
            De les draait eigenlijk om één concept: een computer doet precies wat je hem opdraagt, niet meer en niet minder.

            Nieuw in dit level:

            * Tekst tonen met `{print}`
            * Vragen stellen met `{ask}` en het antwoord gebruiken met `{antwoord}`
            * Tekenen met de tekenschildpad met `{forward}` en `{turn}`
            * Muzieknoten spelen met `{play}`
        sections:
        -   title: Leerlingen vergeten de commando's te typen
            example:
                error_text: Zo vergeten leerlingen het print commando vaak.
                error_code: Hedy kan dit niet printen
                solution_text: Leer de leerlingen aan om altijd te beginnen met een commando.
                solution_code: "{print} Hedy kan dit wel printen!"
        -   title: Leerlingen typen commando's met hoofdletters
            example:
                error_text: Commando's werken niet als zij getypt worden met een hoofdletter.
                error_code: |-
                    Ask Waarom werkt mijn code niet?
                    Print Er moeten geen hoofdletters bij de commando's.
                solution_text: Haal de hoofdletters weg.
                solution_code: |-
                    {ask} Waarom werkt mijn code nu wel?
                    {print} Omdat ik de hoofdletters weggehaald heb!
        -   title: Leerlingen gebruiken {answer} zonder ask
            example:
                error_text: Het commando antwoord herhaalt het antwoord van een ask commando. Zonder ask werkt antwoord dus niet.
                error_code: "{print} Jouw naam is {answer}"
                solution_text: Voeg een vraag toe met een ask commando.
                solution_code: |-
                    {ask} Hoe heet jij?
                    {print} Jouw naam is {answer}
        -   title: "Tekenschildpad: Leerlingen laten het pijltje uit beeld lopen"
            example:
                error_text: Vaak vinden leerlingen het leuk om hoge getallen uit te testen in de turtle, waardoor het pijltje uit beeld loopt.
                error_code: |-
                    {forward} 300
                    {turn} 90
                solution_text: Leerlingen denken dat het turn commando niet werkt, ondanks dat het doet wat het moest doen. Wat er gebeurde is dat het pijltje al buiten het beeld is gekomen. Gebruik kleinere getallen om dat te voorkomen.
                solution_code: |-
                    {forward} 100
                    {turn} 90
        -   title: "Tekenschildpad: Leerlingen gebruiken het commando \"backward\", maar er is helemaal niet zo'n commando."
            example:
                error_text: Achteruit lopen doet de turtle met mingetallen. Dit kan verwarrend zijn voor leerlingen.
                error_code: backward 100
                solution_text: "Om de schildpad terug te laten gaan, gebruik het forward commando en een min-getal. Bijvoorbeeld:"
                solution_code: "{forward} -100"
    -   level: "2"
        concepts_and_changes: |-
            In level 1 hebben de leerlingen geleerd hoe ze de variabele `{answer}` kunnen gebruiken. In dit level leren ze meerdere variabelen te gebruiken.
            Dit is het eerste abstracte concept van programmeren waarmee ze te maken krijgen: een naam die staat voor een waarde die kan veranderen.
            Omdat de leerlingen meerdere variabelen kunnen gebruiken, moeten ze ook leren hoe ze deze definiëren. Dit betekent dat `{ask}` is veranderd en voorafgegaan moet worden door de variabele waarin ze het antwoord willen opslaan.

            Nieuw in dit level:
            * Een waarde opslaan in een variabele met `{is}`
            * Het antwoord op een vraag opslaan in een variabele die je zelf kiest: naam `{is}` `{ask}` Wat is je naam?
            * Het programma pauzeren met `{sleep}`
            * De tekenschildpad draaien met een aantal graden: `{turn}` 90
        sections:
        -   title: Leerlingen maken spelfouten in de commando's
            example:
                error_text: Als een leerling een spelfout maakt in een commando, kan Hedy het commando niet herkennen.
                error_code: prinnt Maak geen spelfouten
                solution_text: Leer de leerlingen aan om de foutmeldingen te lezen. Deze geven namelijk aan welk woord fout gespeld is.
                solution_code: "{print} Maak geen spelfouten"
        -   title: Leerlingen vergeten dat het `{ask}` commando is veranderd
            example:
                error_text: In dit level leren de leerlingen werken met variabelen. Ook het ask commando gebruikt variabelen in dit level, wat nogal eens wordt vergeten door leerlingen.
                error_code: ask Wat wil je bestellen
                solution_text: In dit level moet je altijd aangeven waarin Hedy jouw antwoord moet opslaan, zodat je het later kunt gebruiken. Dat waarin noemt men dus een variabele.
                solution_code: bestelling {is} {ask} Wat wil je bestellen
        -   title: Leerlingen gebruiken `{answer}` voor meerdere vragen
            example:
                error_text: De variabele {answer} werkt nog steeds, maar deze slaat steeds maar één antwoord tegelijk op. Leerlingen zullen soms proberen om meerdere antwoorden in één variabele op te slaan.
                error_code: |-
                    antwoord {is} {ask} Wat is je naam?
                    antwoord {is} {ask} Hoe oud ben je?
                    {print} Hoi {answer}.
                    {print} Je bent {answer} jaar oud.
                solution_text: Leer de leerlingen aan om goede namen te kiezen voor hun variabelen.
                solution_code: |-
                    naam {is} {ask} Wat is je naam?
                    leeftijd {is} {ask} Hoe oud ben je?
                    {print} Hoi naam.
                    {print} Je bent leeftijd jaar oud.
        -   title: Leerlingen gebruiken de naam van een variabele in een printcommando als woord
            example:
                error_text: In het voorbeeld hieronder wordt 'naam' gebruikt als variabele, maar ook als gewone tekst. De uitvoer van deze code wordt 'hoi mijn Hedy is Hedy', wat natuurlijk niet de bedoeling is.
                error_code: |-
                    naam {is} Hedy
                    {print} hoi mijn naam is naam
                solution_text: Gebruik daarom andere variabelenamen dan de tekst die je wil printen. In level 4 wordt dit probleem opgelost met aanhalingstekens.
                solution_code: |-
                    naam {is} Hedy
                    {print} hoi ik heet naam
        -   title: Leerlingen geven variabelen namen met meerdere woorden.
            example:
                error_text: |-
                    Je mag variabelen geen naam geven met twee woorden. Het moet altijd één woord zijn.
                    In het voorbeeld hieronder heeft een leerling de variabele bijvoorbeeld 'gekozen deur' genoemd. Dit is fout.
                error_code: gekozen deur is ask Welke deur kies jij
                solution_text: Voeg een laag streepje toe aan de variabelenaam. Zo wordt het gerekend als één woord.
                solution_code: gekozen_deur {is} {ask} Welke deur kies jij
        -   title: Leerlingen gebruiken twee verschillende namen voor dezelfde variabele
            example:
                error_text: In dit voorbeeld gebruikt een leerling bijvoorbeeld de namen 'paard' en 'naam' voor dezelfde variabele.
                error_code: |-
                    paard {is} {ask} Hoe heet jouw paard
                    {print} Jouw paard heet naam
                solution_text: Gebruik altijd dezelfde naam voor een variabele. Controleer ook of de variabelenaam enkelvoud of meervoud is, daar lees je gemakkelijk overheen (antwoord/antwoorden).
                solution_code: |-
                    naam {is} {ask} Hoe heet jouw paard
                    {print} Jouw paard heet naam
    -   level: "3"
        concepts_and_changes: |-
            In level 3 maken de leerlingen kennis met lijsten en willekeurige keuzes. Dit is het eerste level waarin het uitvoeren van hetzelfde programma twee keer een verschillend resultaat kan opleveren. Dat kan verrassend zijn voor leerlingen die ervan uitgaan dat een programma een vast recept is. Het is een goed moment om ze hun code meerdere keren te laten uitvoeren voordat ze bepalen of deze werkt.

            Nieuw in dit level:

            * Een lijst maken met `{is}` en een willekeurige keuze maken met `{at} {random}`
            * Een item aan een lijst toevoegen met `{add} {to}`
            * Een item van een lijst verwijderen met `{remove} {from}`
        sections:
        -   title: Leerlingen proberen lijstjes te printen
            example:
                error_text: Een lijstje kan niet geprint worden. Je kunt wel een item uit een lijst printen met at random.
                error_code: |-
                    boodschappen {is} appels, melk, chocolade
                    {print} boodschappen
                solution_text: Om alle boodschappen te printen kun je ze gewoon achter een print commando zetten. Anders kun je het lijstje gebruiken met at random om een willekeurig item van het lijstje te printen.
                solution_code: |-
                    {print} appels, melk, chocolade

                    of

                    boodschappen {is} appels, melk, chocolade
                    {print} boodschappen {at} {random}
        -   title: Leerlingen gebruiken de naam van een variabele of lijstje in een printcommando als woord
            example:
                error_text: In het voorbeeld hieronder wordt 'naam' gebruikt als variabele, maar ook als gewone tekst. De uitvoer van deze code wordt 'hoi mijn Hedy is Hedy', wat natuurlijk niet de bedoeling is.
                error_code: |-
                    naam {is} Hedy
                    {print} hoi mijn naam is naam

                    of

                    dier {is} nijlpaard, bij, zwaan
                    {print} het leukste dier is... dier {at} {random}
                solution_text: Gebruik daarom andere variabelenamen dan de tekst die je wil printen. In level 4 wordt dit probleem opgelost met aanhalingstekens.
                solution_code: |-
                    naam {is} Hedy
                    {print} hoi ik heet naam

                    of

                    dieren {is} nijlpaard, bij, zwaan
                    {print} het leukste dier is... dieren {at} {random}
        -   title: Leerlingen maken spelfouten in at random of vergeten een van de twee woorden
            example:
                error_text: Zo worden add en at soms verward. Of wordt at vergeten
                error_code: |-
                    dieren {is} hond, koe, meeuw
                    {print} dieren add random
                solution_text: Dit probleem wordt opgelost door de correcte spelling te gebruiken.
                solution_code: |-
                    dieren {is} hond, koe, meeuw
                    {print} dieren {at} {random}
        -   title: Leerlingen vergeten het print commando te gebruiken bij een at random
            example:
                error_text: Soms zetten leerlingen at random aan het begin van de zin, of ze vergeten het print commando.
                error_code: |-
                    fruit {is} appel, kers, banaan
                    fruit at random
                solution_text: Benadruk dat je Hedy iets wil laten printen, dus dat het printcommando nodig is.
                solution_code: |-
                    fruit {is} appel, kers, banaan
                    {print} fruit {at} {random}
        -   title: Leerlingen vergeten komma's in hun lijstjes
            example:
                error_text: In een lijst scheidt je de items met een komma. Als je de komma's vergeet herkent Hedy het lijstje niet.
                error_code: |-
                    pizzas {is} funghi tonno quattro stagioni
                    {print} pizzas {at} {random}
                solution_text: Na elk item in een lijst, komt er een komma
                solution_code: |-
                    pizzas {is} funghi, tonno, quattro stagioni
                    {print} pizzas {at} {random}
        -   title: Leerlingen proberen het `{at}` `{random}` commando te gebruiken zonder een lijst
            example:
                error_text: Zoals in het voorbeeld hieronder
                error_code: |-
                    voetbalclubs {is} Ajax
                    {print} voetbalclubs {at} {random}
                solution_text: In het voorbeeld hierboven valt er voor Hedy natuurlijk niets at random te kiezen, want er is geen lijstje gemaakt om uit te kiezen. Om at random te kunnen gebruiken is er dus echt een lijstje nodig.
                solution_code: |-
                    voetbalclubs {is} Ajax, PSV, Feyenoord
                    {print} voetbalclubs {at} {random}
        -   title: Leerlingen proberen add/remove te gebruiken zonder lijst
            example:
                error_text: In het voorbeeld hieronder is namen een variabele, maar geen lijstje. Je kunt hier dus niets aan toevoegen.
                error_code: |-
                    namen {is} Jake
                    jouw_naam {is} {ask} Hoe heet jij?
                    {add} jouw_naam {to_list} namen
                    {print} namen {at} {random}
                solution_text: Je moet dus eerst een lijstje hebben, dus moet je een tweede naam toevoegen (Amy) aan namen om het een lijstje te maken. Als je Amy niet wil gebruiken, kun je Amy wel weer verwijderen uit het lijstje met remove.
                solution_code: |-
                    namen {is} Jake, Amy
                    jouw_naam {is} {ask} Hoe heet jij?
                    {add} jouw_naam {to_list} namen
                    {print} namen {at} {random}
        -   title: Leerlingen vergeten het `{to}` of `{from}` gedeelte van `{add}` of `{remove}`
            example:
                error_text: Bij add hoort to en bij remove hoort from.
                error_code: |-
                    avonturen {is} verhaal, papegaai, dobbelsteen
                    keuze {is} {ask} Wat vind jij het leukste Hedy avontuur?
                    add keuze
                    remove dobbelsteen
                    {print} Ik hou van avonturen {at} {random}
                solution_text: Hedy moeten weten aan welk lijstje het nieuwe item moet worden toegevoegd of van welk lijstje het verwijderd moet worden.
                solution_code: |-
                    avonturen {is} verhaal, papegaai, dobbelsteen
                    keuze {is} {ask} Wat vind jij het leukste Hedy avontuur?
                    {add} keuze {to_list} avonturen
                    {remove} dobbelsteen {from} avonturen
                    {print} Ik hou van avonturen {at} {random}
    -   level: "4"
        concepts_and_changes: |-
            In level 4 maken de leerlingen voor het eerst kennis met het belang van syntax in het programmeren. Aanhalingstekens worden dit level geïntroduceerd rond tekst een `{print}` en `{ask}`.
            Niet het meest spannende level, maar wel een heel belangrijke vaardigheid om goed in de vingers te krijgen voordat ze doorgaan naar de volgende levels.
            Leerlingen kunnen dit level als lastig ervaren, vooral als er variabelen in de tekst voorkomen. We raden aan expliciete instructie te geven en samen met de leerlingen te oefenen.

            Nieuw in dit level:

            * Aanhalingstekens gebruiken om tekst na `{print}` en `{ask}`
            * Variabelen buiten de aanhalingstekens houden
            * Dubbele aanhalingstekens gebruiken bij het gebruik van hoge komma's in de tekst
            * Het scherm wissen met `{clear}`
            * Kleuren gebruiken bij de tekenschildpad met `{color}`

        sections:
        -   title: Leerlingen vergeten de aanhalingstekens aan beide kanten te zetten
            example:
                error_text: In dit level moeten er aanhalingstekens gezet worden bij print en ask commando's. Er moet een aanhalingsteken voor en een aanhalingsteken achter de tekst.
                error_code: |-
                    {print} Hallo
                    naam {is} {ask} 'Hoe heet jij?
                solution_text: Voeg de correcte aanhalingstekens toe.
                solution_code: |-
                    {print} 'Hallo'
                    naam {is} {ask} 'Hoe heet jij?'
        -   title: Leerlingen gebruiken de verkeerde aanhalingstekens
            example:
                error_text: Het is van belang om aan het begin van de les te demonstreren hoe je het correcte aanhalingsteken typt. Veel leerlingen weten dit teken namelijk nog niet te vinden op hun toetsenbord en kiezen dan een enkele aanhalingsteken ('') of de dubbele aanhalingstekens (""). Enkele schuine aanhalingstekens (``) zijn geen geldige aanhalingstekens op Hedy.
                error_code: |-
                    {print} `Welkom in het restaurant`
                    eten {is} {ask} ,Wat wil je bestellen?,
                solution_text: "Zo gebruik je de aanhalingstekens correct:"
                solution_code: |-
                    {print} 'Welkom in het restaurant'
                    eten {is} {ask} 'Wat wil je bestellen?'
        -   title: Leerlingen gebruiken hoge komma's na een print commando
            example:
                error_text: Een hoge komma kan je niet gebruiken in een print commando. Je ziet het al aan de verkeerde verkleuring in de tekst.
                error_code: "{print} 'Er lopen twee oma's door het park'"
                solution_text: Je kunt ervoor kiezen om het woord fout te spellen door geen hoge komma te gebruiken, of je kunt de schuine komma gebruiken. Die zit linksboven naast de 1 toets op je toetsenbord.
                solution_code: |-
                    {print} 'Er lopen twee omas door het park'
                    {print} 'Er lopen twee oma`s door het park'
    -   level: "5"
        concepts_and_changes: |-
            In dit level leren de leerlingen `{if}` en `{else}` te gebruiken in hun programma's.

            Nieuw in dit level:
            * Make a choice with `{if}` en `{else}`
        sections:
        -   title: Leerlingen vergeten het print commando in een if commando
            example:
                error_text: Nadat de leerlingen een if of else hebben gebruikt, vergeten ze vaak dat print nog steeds nodig is.
                error_code: |-
                    {if} naam {is} Hedy 'Mooi!'
                    {else}  Hedy {is} Lelijk!
                solution_text: Voeg print toe om de code kloppend te maken.
                solution_code: |-
                    {if} naam {is} Hedy {print} 'Mooi!'
                    {else} {print} 'Lelijk!'
        -   title: Leerlingen gebruiken twee verschillende namen voor dezelfde variabele
            example:
                error_text: In dit voorbeeld gebruikt een leerling bijvoorbeeld de namen 'paard' en 'naam' voor dezelfde variabele.
                error_code: |-
                    paard {is} {ask} 'Hoe heet jouw paard?'
                    {if} naam {is} Bonfire {print} 'leuk'
                    {else} {print} 'minder leuk!'
                solution_text: Gebruik altijd dezelfde naam voor een variabele. Controleer ook of de variabelenaam enkelvoud of meervoud is, daar lees je gemakkelijk overheen (antwoord/antwoorden).
                solution_code: |-
                    paard {is} {ask} 'Hoe heet jouw paard?'
                    {if} paard {is} Bonfire {print} 'leuk'
                    {else} {print} 'minder leuk!'
        -   title: Leerlingen vergeten beide aanhalingstekens bij een print commando
            example:
                error_text: Leerlingen vergeten vaak een aanhalingsteken aan het einde van hun tekst bij een print commando, vooral als dat print commando in een if commando staat.
                error_code: |-
                    {if} naam {is} Hedy {print} leuk
                    {else} {print} 'minder leuk!
                solution_text: Gebruik altijd twee aanhalingstekens per print commando, een vooraan en een achteraan.
                solution_code: |-
                    {if} naam {is} Hedy {print} 'leuk'
                    {else} {print} 'minder leuk!'
        -   title: Leerlingen gebruiken aanhalingstekens rond de naam van de variabele
            example:
                error_text: Er moeten (in dit level) geen aanhalingstekens om een variabele.
                error_code: |-
                    {if}  naam  {is} 'Hedy' {print} 'leuk'
                    {else} {print} 'minder leuk!'
                solution_text: Haal de aanhalingstekens weg, zodat de code werkt.
                solution_code: |-
                    {if} naam {is} Hedy {print} 'leuk'
                    {else} {print} 'minder leuk!
        -   title: Leerlingen geven variabelen namen bestaande uit meerdere woorden
            example:
                error_text: |-
                    In Hedy mag variabelen geen naam geven met spaties er in, of uit meerdere woorden. Een variabele moet altijd uit één woord bestaan. Leerlingen kunnen wel meerdere woorden verbinden met een liggend streepje (_), het underscore teken. Bijvoorbeeld 'gekozen_deur' (_)
                error_code: gekozen deur is ask  Welke deur kies jij?
                solution_text: Voeg een laag streepje toe aan de variabelenaam. Zo wordt het gerekend als één woord.
                solution_code: gekozen_deur {is} {ask} 'Welke deur kies jij?'
        -   title: Leerlingen willen dat bij de if meerdere antwoorden goed zijn
            example:
                error_text: Leerlingen willen vaak graag dat er meerdere antwoorden 'goed' zijn. In het voorbeeld hieronder wil de leerling bijvoorbeeld dat Hedy tegen hem en zijn vrienden zegt dat ze grappig zijn en tegen alle andere leerlingen dat ze niet grappig zijn.
                error_code: "{if} naam {is} Jesse, David, Souf {print} 'jij bent grappig' {else} {print} 'jij bent niet grappig'"
                solution_text: |-
                    Je kunt hierbij het `{in}` commando uitleggen. Dit wordt pas in latere hogere levels aangeleerd, maar werkt op level 5 wel al.
                    Een andere oplossing is om alleen `{if}` commando's te gebruiken, zonder een `{else}` commando. Het nadeel is dat Hedy zonder else commando natuurlijk geen antwoord geeft als je een andere naam hebt dan Jesse, David of Souf.
                solution_code: |-
                    vrienden {is} Jesse, David, Souf
                    naam {is} {ask} 'Wie ben jij?'
                    {if} naam {in} vrienden {print} 'leuk'
                    {else} {print} 'minder leuk'

                    of

                    naam {is} {ask} 'hoe heet jij?'
                    {if} naam {is} Jesse {print} 'leuk'
                    {if} naam {is} David {print} 'leuk'
                    {if} naam {is} Souf {print} 'leuk'
        -   title: De leerlingen vullen bij ask hetzelfde in als bij de variabelenaam, dus de variabele wordt de zelfde waarde als de variabelenaam
            example:
                error_text: "In het voorbeeld hieronder was bijvoorbeeld het wachtwoord: 'wachtwoord'. Hedy zal hierbij altijd 'Je mag computeren!' printen."
                error_code: |-
                    wachtwoord {is} {ask} 'Wat is het wachtwoord?'
                    {if} wachtwoord {is} wachtwoord {print} 'Je mag computeren!'
                    {else} {print} 'Verboden toegang!'
                solution_text: Kies dus een andere naam voor je variabele dan de waarde die je wil invullen.
                solution_code: |-
                    geheim_wachtwoord {is} {ask} 'Wat is het wachtwoord?'
                    {if} geheim_wachtwoord {is} wachtwoord {print} 'Je mag er door!'
                    {else} {print} 'Verboden toegang!'
    -   level: "6"
        concepts_and_changes: |-
            Dit level bouwt verder op de nieuwe commando's `{if}` en `{else}` van het vorige level. Met `{if}` en `{else}` voeg je twee keuzeopties toe aan je code.
            In dit level leren de leerlingen meer opties toe te voegen met `{elif}`. Het is hierbij belangrijk dat de leerlingen de {if}, {elif} en {else} op verschillende regels leren plaatsen.
            Daarnaast leren de leerlingen `{in}` gebruiken om te checken of een antwoord in een lijst staat.

            Nieuw in dit level:

            * Meerdere keuzes toevoegen met {elif}
            * Checken of iets in een lijst staat met {in}
        sections:
        -   title: Leerlingen gebruiken 1 regel voor een `{if}`-statement
            example:
                error_text: Leerlingen proberen soms alles op één regel te proppen. Dit is niet langer toegestaan.
                error_code: |-
                    dieren {is} {ask} 'Wat is je lievelingsdier?'
                    {if} dieren {is} hond {print} 'Ik houd ook van katten!'
                    {elif} dieren {is} kat {print} 'Katten zijn oke'
                    {else} {print} 'Cool dier'
                solution_text: "Vanaf dit level moet je niet alleen `{if}` en `{else}` op afzonderlijke regels zetten. Je moet ook de voorwaarde en het commando op afzonderlijke regels zetten. Zo:"
                solution_code:
                    dieren {is} {ask} 'Wat is je lievelingsdier?'
                    {if} dieren {is} hond
                    {print} 'Ik houd ook van honden!'
                    {elif} dieren {is} kat
                    {print} 'Katten zijn oke'
                    {else}
                    {print} 'Cool dier'
        -   title: Studenten gebruiken `{elif}` net als `{else}`, dus zonder voorwaarde
            example:
                error_text: Studenten vergeten dat ze een voorwaarde nodig hebben
                error_code: |-
                    kleur {is} {ask} 'Wat is je lievelingskleur?
                    {if} kleur {is} groen
                    {print} 'Ik houd ook van groen!'
                    {elif}
                    {print} 'Ik heb liever groen'
                solution_text: Voeg een voorwaarde toe
                solution_code: |-
                    kleur {is} {ask} 'Wat is je lievelingskleur?
                    {if} kleur {is} groen
                    {print} 'Ik houd ook van groen!'
                    {elif} kleur {is} blue
                    {print} 'Blauw is oke'
                    {else}
                    {print} 'Ik houd van groen'
        -   title: Leerlingen gebruiken `{in}` zonder een lijst
            example:
                error_text: Leerlingen vergeten dat ze een lijst nodig hebben
                error_code: |-
                    {if} gekozen_kleur {in} mooie_kleuren
                    {print} 'Goede keuze!'
                solution_text: Voeg een lijst toe
                solution_code: |-
                    mooie_kleuren {is} blauw, groen, paars
                    {if} gekozen_kleur {in} mooie_kleuren
                    {print} 'Goede keuze!'
    -   level: "7"
        concepts_and_changes: |-
            In dit level leren de leerlingen rekenen in hun programma's. Ze leren rekenen met variablen en kunnen vanaf nu ook kommagetallen gebruiken.

            Nieuw in dit level:
            * Rekensymbolen gebruiken:  + - * en /
            * Kommagetallen gebruiken
            * Rekenen met variabelen
            * Het = symbool gebruiken in plaats van `{is}`
        sections:
        -   title: Leerlingen hebben moeite met de aanhalingstekens
            example:
                error_text: Leerlingen kunnen het lastig blijven vinden om de aanhalingstekens correct te gebruiken. Voeg je in dit geval aanhalingstekens toe aan de som, dan print de computer letterlijk '5+5'.
                error_code: "{print} '5 + 5'"
                solution_text: In deze code print het programma '10'.
                solution_code: '{print} 5 + 5'
        -   title: Leerlingen hebben moeite met rekenen met variabelen
            example:
                error_text: 'Sommige leerlingen vinden het lastig om te rekenen met een variabele. Laat ze simpele voorbeelden zien, zoals deze, om aan het concept te wennen:'
                error_code: |-
                    leeftijd = {ask} 'Hoe oud ben je?'
                    {print} 'Volgend jaar ben je dan ' age + 1
                solution_text: 'Of ga een stapje verder, zoals:'
                solution_code: |-
                    ```
                    prijs = 0
                    {print} 'Welkom bij ons hamburgerrestaurant'
                    hamburger = {ask} 'Wilt u een hamburger?'
                    {if} hamburger = ja
                    prijs = prijs + 10
                    drankje = {ask} 'Wilt u een drankje?'
                    {if} drankje = ja
                    prijs = prijs + 4
                    {print} 'Dat is dan ' prijs ' euro alstublieft'
                    ```
        -   title: Leerlinge vergeten het = symbool
            example:
                error_text: Het kan dat leerlingen {is} blijven gebruiken in plaats van =. Ga bij jezelf na wat je met je leerlingen wil bereiken. Wil je de de leerlingen laagdrempelig kennismaken met programmeren? Laat ze dan lekker verder werken met {is}. Wil je dat ze later overstappen op Python of een andere programmeertaal, moedig ze dan aan om het =-teken te gebruiken.
                error_code:
                    naam {is} Hedy
                solution_text: Het = teken
                solution_code:
                    naam = Hedy
        -   title: Leerlingen gebruiken een komma in plaats van een punt bij kommagetallen
            example:
                error_text: In het Nederlands gebruiken we een komma in decimale getallen, helaas gebruiken programmeertalen een punt en zal dat in Hedy dus ook moeten.
                error_code: |-
                    {print} 2,5 + 2,5
                solution_text: Gebruik een punt
                solution_code: |-
                    {print} 2.5 + 2.5
    -   level: '8'
        concepts_and_changes: ''|-
            In dit laatste level van Hedy Basis leren je leerlingen hoe ze herhaling in hun programma's kunnen gebruiken! Ze kunnen slechts één regel meerdere keren herhalen. Het herhalen van meerdere regels wordt in de volgende levels behandeld.

            Nieuw in dit level:

            * Een regel herhalen met `{repeat} 3 {times}`
            * Een regel een 'variabele' keer herhalen
        sections:
        -   title: Leerlingen vergeten delen van het {repeat} commando, of de {print} die erop volgt
            example:
                error_text: Zorg dat leerlingen alle stukjes van het commando gebruiken.
                error_code: |-
                    {repeat} 3 {times}  "For he's a jolly good fellow"
                    {repeat} 3 {print} 'Which nobody can deny!'
                solution_text: 'Zo klopt het:'
                solution_code: |-
                    {repeat} 3 {times} {print} "For he's a jolly good fellow"
                    {repeat} 3 {times} {print} 'Which nobody can deny!'
        -   title: Leerlingen proberen meerdere regels te herhalen
            example:
                error_text: In dit level kun je slechts een regel code herhalen. In dit voorbeeldprogramma wilde de leerlingen 3 verschillende drankjes printen, maar dan kan nog niet. Dit programma stelt 3x de vraag en print vervolgens maar één antwoord.
                error_code: |-
                    {repeat} 3 {times} drinken = {ask} 'Wat wil je drinken?'
                    {print} drinken
                solution_text: In het volgende level leer je meerdere regels herhalen. Voor nu moet het og even zo.
                solution_code: |-
                    {repeat} 3 {times} drinken = {ask} 'Wat wil je drinken?'
                    {print} drinken
                    {repeat} 3 {times} drinken = {ask} 'Wat wil je drinken?'
                    {print} drinken
                    {repeat} 3 {times} drinken = {ask} 'Wat wil je drinken?'
                    {print} drinken
        -   title: Leerlingen maken programma's die te lang duren om uit te voeren
            example:
                error_text: Om te voorkomen dat het device van de leerling vastloopt, of onze server ermee ophoudt, hebben wij een rem op te lange programma's gezet. De leerling krijgt een waarschuwing als het programma te lang duurt om uit te voeren.
                error_code: "{repeat} 100 {times} {print} 'Hoe vaak mag ik herhalen?'"
                solution_text: Zorg dat de code niet te lang duurt om uit te voeren
                solution_code: "{repeat} 20 {times} {print} 'Dit is voldoende'"
    -   level: '9'
        concepts_and_changes: ''|-
            In dit eerste level van Hedy Advanced leren leerlingen inspringen. Hierdoor kunnen ze meerdere regels gebruiken in een if-statement of meerdere regels herhalen. Leerlingen vinden dit level vaak erg leuk, omdat ze hiermee ingewikkeldere programma's kunnen maken.
            Aan de andere kant zullen sommige leerlingen moeite hebben met begrijpen wanneer ze moeten inspringen en hoe ze dit moeten doen.

            Nieuw in dit level:
            * Meerdere regels na een `{if}`, `{elif}` of `{else}` door inspringing te gebruiken
            * Meerdere regels na een `{repeat}` door inspringing te gebruiken
        sections:
        -   title: Leerlingen springen verkeerd in
            example:
                error_text: Inspringen is een nieuw concept in dit level en voor sommige leerlingen kan het lastig zijn om dit te leren. Zorg ervoor dat ze eerst enkele eenvoudige voorbeelden oefenen voordat ze er een heel programma mee maken.
                error_code: |-
                    {repeat} 3 {times}
                    {print} 'hallo'
                solution_text: 'Dit klopt:'
                solution_code: |-
                    {repeat} 3 {times}
                        {print} 'hallo'
        -   title: Leerlingen herhalen per ongeluk maar één regel, in plaats van meerdere.
            example:
                error_text: Bijvoorbeeld, in de onderstaande code wilde de leerling de bestelling van 3 mensen opnemen. In plaats daarvan vroeg het programma het 3 keer, maar werd er maar één bestelling opgeslagen.
                error_code: |-
                    {repeat} 3 {times}
                        drinken = {ask} 'Wat wil je drinken?'
                    {print} drinken
                solution_text: |-
                    In de juiste code begint de derde regel ook met inspringen. Op deze manier hoort deze bij het repeat-blok en wordt de regel daarom 3 keer herhaald.
                    Door je leerlingen deze verschillen te laten zien, kun je ze helpen begrijpen waarom we inspringing nodig hebben om onze programma's goed te laten werken.
                solution_code: |-
                    {repeat} 3 {times}
                        drinken = {ask} 'Wat wil je drinken?'
                        {print} drinken
        -   title: Leerlingen willen {if}-statements al nesten
            example:
                error_text: |-
                    In dit level mogen leerlingen nog geen `{if}`-statements in andere `{if}`-statements of in repeat-lussen plaatsen.
                    In het volgende level is dit wel toegestaan.
                error_code: |-
                    verjaardag = {ask} 'Is het je verjaardag?'
                    {if} verjaardag {is} ja
                        {repeat} 3 {times}
                            {print} 'Hiep Hiep Hoera!'
                solution_text: 'Dit klopt:'
                solution_code: |-
                    verjaardag = {ask} 'Is het je verjaardag?'
                    {if} verjaardag {is} ja
                        {print} 'Hiep Hiep Hoera!'
                        {print} 'Hiep Hiep Hoera!'
                        {print} 'Hiep Hiep Hoera!'
        -   title: Leerlingen maken programma's die te lang duren om uit te voeren
            example:
                error_text: Om te voorkomen dat het device van de leerling vastloopt, of onze server ermee ophoudt, hebben wij een rem op te lange programma's gezet. De leerling krijgt een waarschuwing als het programma te lang duurt om uit te voeren.
                error_code: "{repeat} 100 {times} {print} 'Hoe vaak mag ik herhalen?'"
                solution_text: Zorg dat de code niet te lang duurt om uit te voeren
                solution_code: "{repeat} 20 {times} {print} 'Dit is voldoende'"
    -   level: '10'
        concepts_and_changes: ''|-
            In dit level bouwen we opnieuw verder op `{if}` en `{repeat}`. In het vorige level hebben de leerlingen geleerd hoe ze meerdere regels kunnen gebruiken na `{repeat}`, `{if}`, `{elif}` of `{else}`.
            Nu leren de leerlingen ook over *nesting*: het plaatsen van een `{if}` of `{repeat}` binnen een `{if}` of `{repeat}`. Ze leren ook twee nieuwe commando's: `{and}` en `{or}`.
            Hierdoor krijgen de leerlingen veel meer mogelijkheden om veelzijdigere programma's te maken.

            Nieuw in dit level:
            * `{if}` en `{repeat}` nesten
            * `{and}` en `{or}` gebruiken na een `{if}`

        sections:
        -   title: Students make mistakes with indentation
            example:
                error_text: Het lastigste aan dit level is om de inspringing goed te krijgen. Leerlingen vinden het leuk om `{if}`-statements te nesten, soms zelfs binnen andere geneste `{if}`-statements. Het bijhouden van de juiste inspringing kan daardoor behoorlijk lastig worden.
                error_code: |-
                    {print} 'Robin loopt door het centrum'
                    locatie = {ask} 'Gaat Robin een winkel binnen, of gaat ze naar huis?'
                    {if} locatie {is} winkel
                        {print} 'Ze gaat de winkel binnen.'
                        {print} 'Robin ziet een interessant uitziend boek'
                        boek = {ask} 'Koopt Robin het boek?'
                            {if} boek {is} ja
                    {print} 'Robin koopt het boek en gaat naar huis'
                    {else}
                        {print} 'Robin verlaat de winkel en gaat naar huis'
                    {else}
                        {print} 'Robin gaat naar huis'
                solution_text: This is the correct code. Try to keep track of all the different constructions when putting `{if}` statements inside other `{if}` statements.
                solution_code: |-
                    {print} 'Robin loopt door het centrum'
                    locatie = {ask} 'Gaat Robin een winkel binnen, of gaat ze naar huis?'
                    {if} locatie {is} winkel
                        {print} 'Ze gaat de winkel binnen.'
                        {print} 'Robin ziet een interessant uitziend boek'
                        boek = {ask} 'Koopt Robin het boek?'
                        {if} boek {is} ja
                            {print} 'Robin koopt het boek en gaat naar huis'
                        {else}
                            {print} 'Robin verlaat de winkel en gaat naar huis'
                    {else}
                        {print} 'Robin gaat naar huis'
        -   title: Leerlingen verwarren `{and}` met `{or}`
            example:
                error_text: Hoewel de commando's misschien op elkaar lijken, werken ze heel verschillend.
                error_code: |-
                    spel = {ask} 'Wil je een spel spelen?'
                    tijd = {ask} 'Heb je tijd om te spelen?'
                    {if} spel {is} 'ja' {or} tijd {is} 'ja'
                        {print} 'Laten we spelen!'
                solution_text: In dit geval wil je dat de persoon twee keer 'ja' antwoordt dus moet je een `{and}` gebruiken.
                solution_code: |-
                    spel = {ask} 'Wil je een spel spelen?'
                    tijd = {ask} 'Heb je tijd om te spelen?'
                    {if} spel {is} 'ja' {and} tijd {is} 'ja'
                        {print} 'Laten we spelen!'
        -   title: Leerlingen maken hun regels met `{or}` niet af
            example:
                error_text: Na {or} zou een complete conditie moeten volgen.
                error_code: |-
                    kleur = {ask} 'Welke kleur vind je leuk?'
                    {if} kleur {is} blauw {or} groen
                        {print} 'Mooi!'
                solution_text: 'Maak de regel zo af:'
                solution_code: |-
                    kleur = {ask} 'Welke kleur vind je leuk?'
                    {if} kleur {is} blauw {or} kleur {is} groen
                        {print} 'Mooi!'
    -   level: '11'
        concepts_and_changes: ''|-
            In dit level maken de leerlingen kennis met {for} loops.

            Nieuw in dit level:
            * Loops met {for}
        sections:
        -   title: Leerlingen gebruiken `{for}` verkeerd
            example:
                error_text: We zien vaak leerlingen die een hele lijst proberen te printen (in dit geval de lijst dieren) in plaats van de items van de lijst.
                error_code: |-
                    dieren {is} hond, kat, blobvis
                    {for} dier {in} dieren
                      {print} 'I love ' dieren
                solution_text: The word animals in the last line should be changed into animal.
                solution_code: |-
                    dieren {is} hond, kat, blobvis
                    {for} dier {in} dieren
                      {print} 'I love ' dier
        -   title: Leerlingen vergeten in te springen
            example:
                error_text: Leerlingen vergeten wel eens in te springen na {for}.
                error_code: |-
                    dieren {is} hond, kat, blobvis
                    {for} dier {in} dieren
                    {print} 'I love ' dier
                solution_text: Spring in na een {for}.
                solution_code: |-
                    dieren {is} hond, kat, blobvis
                    {for} dier {in} dieren
                        {print} 'I love ' dier
    -   level: '12'
        concepts_and_changes: ''|-
            In dit laatste level van Hedy Gevorderd maken de leerlingen kennis met simpele functies.

            Nieuw in dit level:
            * Functies maken met {define} en {call}
        sections:
        -   title: Leelringen maken een functie, maar vergeten die op te roepen met {call}.
            example:
                error_text: Een functie doet niets zonder die aan te roepen.
                error_code: |-
                    {define} groet_klant
                        {print} 'Hallo'
                        {print} 'Hoe gaat het met u?'
                solution_text: Roep de functie aan met {call}
                solution_code: |-
                    {define} groet_klant
                        {print} 'Hallo'
                        {print} 'Hoe gaat het met u?'

                    {call} greet_costumer
        -   title: Leerlingen hebben moeite met inspringen.
            example:
                error_text: Inspringen blijft lastig
                error_code: |-
                    {define} functie
                    {print} 'Sping in bij een functie.'
                    {if} gebruik_if_statement {is} 'ja'
                    {print} 'en vergeet niet in te springen bij loops'
                solution_text: Ook bij een functie is inspringen belangrijk
                solution_code: |-
                    {define} functie
                        {print} 'Sping in bij een functie.'
                        {if} gebruik_if_statement {is} 'ja'
                            {print} 'en vergeet niet in te springen bij loops'
        -   title: Leerlingen vergeten aanhalingstekens
            example:
                error_text: In dit level zijn meer aanhalingstekens nodig dan in de vorige levels.
                error_code: |-
                    superhelden = Spiderman, Batman, Iron Man
                    superheld = superhelden {at} {random}
                    {if} superheld = Batman
                        {print} 'IK BEN BATMAN!'
                solution_text: 'Zo klopt het:'
                solution_code: |-
                    superhelden = 'Spiderman', 'Batman', 'Iron Man'
                    superheld = superhelden {at} {random}
                    {if} superheld {is} 'Batman'
                        {print} 'IK BEN BATMAN!'
    -   level: '13'
        concepts_and_changes: |-
            In dit eerste level van Hedy Expert gaan de leerlingen zich steeds meer verdiepen in de concepten en syntax van echte programmeertalen.
            We raden aan om alleen met de Hedy Expert-levels te werken als het je doel is om je leerlingen later met andere 'echte' programmeertalen (zoals Python) te laten werken.
            Als dit leerdoel niet bij je leerlingen past, raden we aan om alleen met Hedy Basis en Hedy Gevorderd te werken. Daar leren de leerlingen de basisprincipes van programmeren, zonder dat ze gehinderd worden door specifieke syntaxregels.

            **Let op**: vanaf dit level komt de syntax van Hedy (bijna) overeen met Python-syntax. Dit betekent dat eerder geleerde Hedy-syntax hier mogelijk niet werkt. We leggen alle nieuwe Python-syntax in de komende levels uit, maar om de leerlingen niet te overweldigen, hebben we dit verspreid over meerdere levels.
            Dit betekent dat sommige functionaliteiten, zoals functies en lijsten, niet op de Hedy-manier zullen werken, terwijl de nieuwe Python-manier nog niet is uitgelegd. Daarom is een beetje geduld van de leerlingen nodig. We doen een stap terug ten opzichte van de vorige levels om de syntax goed onder de knie te krijgen, en daarna gaan we verder met het leren van alle functionaliteiten op de Python-manier.

            In dit level leren de leerlingen ook werken met operatoren, waardoor ze meer mogelijkheden krijgen om wiskunde in hun programma's te gebruiken.


            Nieuw in dit level:
            * Printen met Python syntax: `{print}('Hallo wereld!')
            * Printen met variabelen, string tekst en variabelen samen, op deze manier: `{print}('Hallo, ', naam, '!')
            * Vragen stellen met `{input}`
            * Een dubbele punt gebruiken na {if}-statements
            * Deze operatoren gebruiken: < > == != <= >=
        sections:
        -   title: Leerlingen vergeten de nieuwe syntax regels toe te passen
            example:
                error_text: Dit level bevat veel nieuwe syntax
                error_code: |-
                    stemming {is} {ask} 'Hoe gaat het met je ' naam '?'
                    {if} stemming {is} goed
                        {print} 'Geweldig!'
                solution_text: Gebruik de juiste syntax
                solution_code: |-
                    stemming = input('Hoe gaat het met je?', naam, '?')
                    {if} stemming == 'goed':
                        {print}('Geweldig!')
        -   title: Leerlingen verwarren < met >
            example:
                error_text: Vaak herkennen de leerlingen deze symbolen wel van wiskunde, maar de leerlingen die nog onbekend zijn met deze tekens kunnen er moeite mee hebben.
                error_code: |-
                    leeftijd = {ask} 'Hoe oud ben je?'
                    {if} leeftijd < 12
                        {print} 'Je bent ouder dan ik!'
                solution_text: 'Dit klopt:'
                solution_code: |-
                    leeftijd = {ask} 'Hoe oud ben je?'
                    {if} leeftijd > 12
                        {print} 'Je bent ouder dan ik!'
        -   title: Leerlingen gebruiken `!=` `<=` en `>=` verkeerd
            example:
                error_text: Deze tekens zijn waarschijnlijk nieuw voor de leerlingen.
                error_code: |-
                    naam = {ask} 'Wat is je naam?'
                    {if} naam = 'Hedy'
                        {print} 'Je bent niet Hedy'
                solution_text: 'Leg de tekens goed uit en oefen er veel mee'
                solution_code: |-
                    naam = {ask} 'Wat is je naam?'
                    {if} naam != 'Hedy'
                        {print} 'Je bent niet Hedy'
        -   title: Leerlingen vergeten het == teken te gebruiken
            example:
                error_text: In Hedy mogen de leerlingen ook = of {is} gebruiken, maar als ze over willen stappen naar Python wordt je er op afgerekend. Daarom is het belangrijk om deze nieuwe tekens jezelf al eigen te maken.
                error_code: |-
                    naam = {ask} 'Wat is je naam?'
                    {if} naam = 'Hedy'
                        {print} 'Jij bent cool!'
                solution_text: 'Dit klopt:'
                solution_code: |-
                    naam = {ask} 'Wat is je naam?'
                    {if} naam == 'Hedy'
                        {print} 'Je bent cool!'
        -   title: Leerlingen proberen functionaliteiten te gebruiken die ze eerder in Hedy hebben geleerd, maar die geen Python syntax hebben.
            example:
                error_text: Leelringen gebruiken bijvoorbeeld herhaling, functies of lijstjes. In dit level werkt de Hedy syntax niet.
                error_code: |-
                    {define} kies_een_dier
                        dieren = hond, kat, hamster
                        {repeat} 3 {times}
                        {print} dieren {at} {random}

                    {call} kies_een_dier
                solution_text: In de komende levels wordt de nieuwe syntax uitgelegd.
                solution_code: |-
                    #Als je er klaar voor bent, ga dan naar het volgende level om weer nieuwe syntax bij te leren.
                    # Of oefen nog even lekker door in dit level.
    -   level: '14'
        concepts_and_changes: ''|-
            In dit level ligt de focus op werken met lijstjes. De leerlingen leren ook om herhaling te gebruiken op de Python manier.

            Nieuw in dit level:
            * Werken met lijstjes
            * Lijsten combineren met {for} {if} en {random}
            * Herhaling met {for} i {range}(1,10)
        sections:
        -   title: Leerlingen vergeten de rechte haken
            example:
                error_text: Lijsten moeten vanaf dit level in rechte haken.
                error_code: |-
                    smaken = 'aardbei', 'chocolade'
                    {print} 'Ik vind ' smaken[{random}] 'ijsjes heerlijk'
                solution_text: 'Dit klopt:'
                solution_code: |-
                    smaken = ['aardbei', 'chocolade']
                    {print} ('Ik vind ' smaken[{random}] 'ijsjes heerlijk')
        -   title: Leerlingen gebruiken de verkeerde haakjes
            example:
                error_text: Lijsten horen in rechte haken
                error_code: |-
                    smaken = ('aardbei', 'chocolade')
                    {print} ('Ik vind ' smaken[{random}] 'ijsjes heerlijk')
                solution_text: 'Zo klopt het:'
                solution_code: |-
                    smaken = ['aardbei', 'chocolade']
                    {print} ('Ik vind ' smaken[{random}] 'ijsjes heerlijk')
        -   title: Leerlingen vergeten de aanhalingstekens, nu ze focussen op de haakjes
            example:
                error_text: Doordat de leerlingen druk bezig zijn met de juiste haken, vergeten ze soms de aanhalingstekens
                error_code: |-
                    smaken = [aardbei, chocolade]
                    {print} ('Ik vind ' smaken[{random}] 'ijsjes heerlijk')
                solution_text: 'This is the correct code:'
                solution_code: |-
                    smaken = ['aardbei', 'chocolade']
                    {print} ('Ik vind ' smaken[{random}] 'ijsjes heerlijk')
        -   title: Leerlingen gebruiken de oude Hedy syntax bij {random}
            example:
                error_text: '{random} is veranderd in dit level'.
                error_code: |-
                    icecream = [strawberry, chocolate]
                    {print} 'I love ' icecream {at} {random} ' icecream'
                solution_text: 'Dit klopt:'
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print} 'I love ' icecream[{random}] ' icecream'
    -   level: '15'
        concepts_and_changes: ''|-
            Dit level gaat over functies. In Hedy Gevorderd hebben de leerlingen geleerd om simpele functies te gebruiken. In dit level leren ze niet alleen de Python syntax van een functie, maar ook leren ze argumenten en {return} {value} te gebruiken.

            Nieuw in dit level:
            * Functies gebruiken op de Python manier
            * Argumenten gebruiken in een functie
            * {return} {value} gebruiken in een functie
        sections:
        -   title:
            example: Leerlingen gebruiken verkeerde syntax en vergeten in te springen
                error_text: Inspringen en juiste syntax blijven struikelblokken
                error_code: |-
                    {def} begroet_de_klant(naam
                    {print}('Hallo ', naam, '!')

                    klant = 'Hedy
                    begroet_de_klant()klant
                solution_text: Kijk goed naar de syntax en inspringing
                solution_code: |-
                    {def} begroet_de_klant(naam):
                        {print}('Hallo ', naam, '!')

                    klant = 'Hedy'
                    begroet_de_klant(klant)
        -   title: Leerlingen vergeten {return} te gebruiken
            example:
                error_text: Leerlingen vergeten {return} te gebruiken in de functie.
                error_code: |-
                    {def} krijg_een_kamer(getal):
                        kamernummer = 1000 + getal

                    favoriet_getal = 7
                    kamernummer = krijg_een_kamer(favoriet_getal)
                    print('Je kamernummer is ', kamernummer)
                solution_text: 'Dit klopt:'
                solution_code: |-
                    {def} krijg_een_kamer(getal):
                        kamernummer = 1000 + getal
                        {return} kamernummer

                    favoriet_getal = 7
                    kamernummer = krijg_een_kamer(favoriet_getal)
                    print('Je kamernummer is ', kamernummer)
    -   level: '16'
        concepts_and_changes: ''|-
                In dit laatste level van Hedy leren de leerlingen de {while} loop gebruiken en oefenen met nieuwe syntax.
                Na dit level kunnen leerlingen verder programmeren in 'echte' Python compilers.

                Nieuw in dit level:
                * De {while} loop
        -   title: Leerlingen vergeten in te springen bij de {while} loop
            example:
                error_text: Inspringen kan lastig zijn
                error_code: |-
                    antwoord = 0
                    {while} antwoord != 25
                    antwoord = {ask} 'Wat is 5 keer 5?'
                    {print} 'Er is een correct antwoord gegeven'
                solution_text: 'Dit klopt:'
                solution_code: |-
                    antwoord = 0
                    {while} antwoord != 25
                        antwoord = {ask} 'Wat is 5 keer 5?'
                        {print} 'Er is een correct antwoord gegeven'
        -   title: Leerlingen maken (per ongeluk) een oneindige loop
            example:
                error_text: Leerlingen maken een {while} loop, maar maken geen condities om de loop te stoppen.
                error_code: |-
                    alarm = 'aan'
                    {while} alarm = 'aan'
                        {play} C
                        {play} D
                solution_text: 'Zorg dat er een einde aan komt'
                solution_code: |-
                    # klik op de rode 'Stop programma' knop om het programma te stoppen
