title: Документация Hedy
home-sections:
-   title: Текстовое программирование стало проще!
    text: |-
        Многие школы и учителя по всему миру хотят научить своих учеников программированию. Вначале это часто делается с помощью игровых инструментов, таких как робот Bee-bot,
        Scratch Junior или Scratch. После использования таких инструментов дети часто хотят перейти к более мощным текстовым языкам программирования, таким как Python.

        Однако Python сложен, потому что он доступен только на английском языке и требует от учеников одновременного изучения сложных концепций программирования и синтаксиса.
        Hedy — это простой способ начать изучать текстовые языки программирования! Hedy бесплатен в использовании, имеет открытый исходный код и не похож ни на один другой язык текстового программирования по трём параметрам.

        1. Hedy является мультиязычным, вы можете использовать Hedy на своем родном языке
        2. Hedy — это постепенный процесс, поэтому вы можете изучать одну концепцию и ее синтаксис за раз
        3. Hedy создан для работы в классе, что позволяет учителям полностью адаптировать опыт своих учеников
-   title: Многоязычное программирование
    text: В то время как почти все текстовые языки программирования имеют ключевые слова на английском языке, такие как `for` или `repeat`, Hedy можно использовать на любом языке! В настоящее время мы поддерживаем 47 различных языков, включая голландский, испанский, арабский, турецкий, упрощенный китайский и хинди. Если ваш язык недоступен, вы всегда можете начать новый перевод.
-   title: Пошаговое обучение
    text: Изучение языка программирования может оказаться непосильной задачей, поскольку учащимся приходится одновременно изучать концепции (например, if-else или циклы) и синтаксис (например, кавычки или круглые скобки). В Hedy понятия сначала вводятся с небольшим количеством синтаксиса, а затем совершенствуются. Научно доказанный способ обучения!
-   title: Создан для работы в классе
    text: |-
        Hedy предназначен для детей в возрасте от 10 лет и старше и разработан для использования в классе.
        Учителя могут использовать наши бесплатные встроенные планы уроков, а также создавать собственные уроки и загружать их в пользовательский интерфейс Hedy.
-   title: Программирование в контексте
    text: Hedy демонстрирует программирование в самом широком смысле и может быть использован различными увлекательными способами. Hedy позволяет создавать цифровые и интерактивные истории, красочные рисунки, которые можно не только показывать на экране, но и рисовать пером или вышивать на рубашке, а также использовать для создания игр или приложений с кнопками и действиями на клавиатуре.
-   title: Бесплатен ли Hedy?
    text: |-
        Да! Hedy имеет «открытый исходный код», что означает, что каждый может помочь нам сделать Hedy лучше.
        Вы можете найти наш код на <a href="https://github.com/hedyorg/hedy" target="_blank">Github</a>.
        Если вам нравится Hedy и вы хотите внести свой вклад, мы принимаем (и очень благодарны за это) <a href="https://github.com/sponsors/hedyorg" target="_blank">пожертвования</a>!
        Мы используем эти деньги, чтобы поддерживать работу сервера, обслуживать и улучшать сайт Hedy.
-   title: Нужно ли что-то устанавливать?
    text: |-
        Нет. Hedy работает в браузере — в той же программе, в которой вы сейчас видите эту страницу. Вероятно, это Chrome, Edge или Firefox. Hedy также работает на телефонах и планшетах.
-   title: Нужен ли опыт программирования, чтобы преподавать с Хеди?
    text: "Нет, это не обязательно. Все концепты объясняются через слайды и интерфейс для учеников.\nЕсли вы создадите бесплатный учительский аккаунт, вы также получите доступ к руководству по преподаванию, которое ещё содержит\nинформацию о часто допускаемых ошибках."
join-sections:
-   title: Поддержка Hedy
    text: "# Есть три способа поддержать Hedy!"
-   title: Улучшение языка
    text: |-
        Постепенная и многоязычная природа Hedy создает множество интересных технических задач.
        Их можно найти на [Github](https://github.com/hedyorg/hedy/issues?q=is%3Aopen+is%3Aissue+label%3Alanguage).
-   title: Перевод Hedy
    text: |-
        Не программист? Без проблем! Еще один способ поддержать Хеди — это <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">перевод ключевых слов, сообщений об ошибках, приключений и другого контента </a>. 
        Это текущий статус. Помогите нам дополнить язык или добавить новый! 
        <a href="https://hosted.weblate.org/engage/hedy/">
        <img src="https://hosted.weblate.org/widgets/hedy/-/multi-auto.svg" alt="Translation status" /></a>
-   title: Помочь учителям начать работу
    text: |-
        Hedy предназначен для поддержки учителей при проведении уроков программирования в классе. У нас есть специальные функции для учителей, например, возможность создать класс, настроить его и посмотреть, что делают ваши ученики.
        Если вам нравится Hedy, вы можете обратиться в школы, которые вы знаете, чтобы помочь учителям начать работу! Мы можем помочь вам найти школы или учителей через [Discord](https://discord.gg/8yY7dEme9r).
