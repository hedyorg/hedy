title: Документация Hedy
home-sections:
-   title: Текстовое программирование стало проще!
    text: |-
        Многие школы и учителя по всему миру хотят научить своих учеников программированию. Вначале это часто делается с помощью игровых инструментов, таких как робот Bee-Bot,
        Scratch Junior или Scratch. После использования таких инструментов дети часто хотят перейти к более мощным текстовым языкам программирования, таким как Python.

        Однако Python сложен, потому что он доступен только на английском языке и требует от учеников одновременного изучения сложных концепций программирования и синтаксиса.
        Hedy — это простой способ начать изучать текстовые языки программирования! Hedy можно пользоваться бесплатно, у него открытый исходный код, и он отличается от других текстовых языков программирования тремя особенностями.

        1. Hedy многоязычен: ты можешь использовать Hedy на своём родном языке
        2. Hedy позволяет учиться постепенно: ты можешь изучать по одной концепции вместе с её синтаксисом
        3. Hedy создан для работы в классе, что позволяет учителям полностью адаптировать обучение к потребностям своих учеников
-   title: Многоязычное программирование
    text: В то время как почти все текстовые языки программирования имеют ключевые слова на английском языке, такие как `for` или `repeat`, Hedy можно использовать на любом языке! В настоящее время мы поддерживаем 47 различных языков, включая нидерландский, испанский, арабский, турецкий, китайский и хинди. Если твоего языка ещё нет, ты всегда можешь начать новый перевод.
-   title: Пошаговое обучение
    text: Изучение языка программирования может оказаться непростой задачей, поскольку учащимся приходится одновременно изучать концепции (например, if-else или циклы) и синтаксис (например, кавычки или круглые скобки). В Hedy понятия сначала вводятся с минимумом синтаксиса, а затем уточняются. Научно доказанный способ обучения!
-   title: Создан для работы в классе
    text: |-
        Hedy предназначен для детей в возрасте от 10 лет и разработан для использования в классе.
        Учителя могут использовать наши бесплатные встроенные планы уроков, а также создавать собственные уроки и загружать их в пользовательский интерфейс Hedy.
-   title: Программирование в контексте
    text: Hedy демонстрирует программирование в самом широком смысле и может использоваться самыми разными увлекательными способами. Hedy позволяет создавать цифровые и интерактивные истории, красочные рисунки, которые можно не только показывать на экране, но и рисовать с помощью перьевого плоттера или вышивать на рубашке, а также создавать игры или приложения с кнопками и управлением с клавиатуры.
-   title: Бесплатен ли Hedy?
    text: |-
        Да! Hedy имеет открытый исходный код, а значит, каждый может помочь нам сделать Hedy лучше.
        Наш код можно найти на <a href="https://github.com/hedyorg/hedy" target="_blank">Github</a>.
        Если тебе нравится Hedy и ты хочешь помочь, мы принимаем (и очень благодарны за это) <a href="https://github.com/sponsors/hedyorg" target="_blank">пожертвования</a>!
        Мы используем эти деньги для работы сервера, поддержки и улучшения сайта Hedy.
-   title: Нужно ли что-то устанавливать?
    text: Нет. Hedy работает в браузере — в той же программе, в которой ты сейчас видишь эту страницу. Вероятно, это Chrome, Edge или Firefox. Hedy также работает на телефонах и планшетах.
-   title: Обязательно ли уметь программировать, чтобы учить с помощью Hedy?
    text: |-
        Нет, это не обязательно. Все понятия объясняются в слайдах и в интерфейсе для учеников.
        Если вы создадите бесплатную учётную запись учителя, то также получите доступ к руководству для учителей с информацией о преподавании
        и часто допускаемых ошибках.
join-sections:
-   title: Поддержка Hedy
    text: '# Есть три способа поддержать Hedy!'
-   title: Улучшение языка
    text: |-
        Постепенная и многоязычная природа Hedy создаёт множество интересных технических задач.
        Их можно найти на <a href="https://github.com/hedyorg/hedy/issues?q=is%3Aopen+is%3Aissue+label%3Alanguage" target="_blank">Github</a>.
-   title: Перевод Hedy
    text: |-
        Не программист? Без проблем! Ещё один способ поддержать Hedy — это <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">перевод ключевых слов, сообщений об ошибках, приключений и другого контента</a>.
        Вот текущее состояние перевода. Помоги нам завершить перевод на один из языков или добавить новый!
        <a href="https://hosted.weblate.org/engage/hedy/">
        <img src="https://hosted.weblate.org/widgets/hedy/-/multi-auto.svg" alt="Состояние перевода" /></a>
-   title: Помочь учителям начать работу
    text: |-
        Hedy предназначен для поддержки учителей при проведении уроков программирования в классе. У нас есть специальные функции для учителей, например возможность создать класс, настроить его и следить за успехами учеников.
        Если тебе нравится Hedy, ты можешь обратиться в знакомые школы, чтобы помочь учителям начать работу! Мы можем помочь тебе найти школы или учителей через <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord</a>.
