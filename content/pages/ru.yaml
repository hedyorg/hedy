start-sections:
-   title: Начать с Hedy
    text: |-
        Добро пожаловать в Hedy! Мы рады помочь вам начать работу с Hedy.

        Наше [руководство для учителей](https://www.hedy.org/for-teachers/manual) содержит подробный обзор всех функций, а эта страница предлагает краткий обзор, чтобы вы знали, что к чему, прежде чем углубиться в изучение.

        Несколько важных моментов, которые стоит знать:
        * Hedy — это инструмент, созданный для управления классом детей, занимающихся программированием! Вы можете создавать собственные классы, планы уроков и следить за успехами детей.
        * Вам не нужно много знать о программировании, чтобы начать: Hedy работает шаг за шагом, в том числе и для вас!
        * Вы можете использовать Hedy на своём родном языке, потому что он переведён на множество языков!
        * Программировать может каждый ребёнок!! Hedy особенно полезен для детей с нарушениями зрения, потому что может читать материалы вслух без необходимости использовать мышь.
        * Мы готовы вам помочь: вы можете найти нас, например, в [Discord](https://discord.gg/8yY7dEme9r) или [написать нам](hello@hedy.org).
-   title: Учителя о Hedy
    text: |-
        Учителя со всего мира с увлечением отзываются о Hedy. Вот чем некоторые из них поделились с нами:

        *Невероятно вдохновляет! Отличный способ сделать программирование гораздо доступнее как для себя, так и для учеников. Очень интересно пробовать, и столько возможностей для работы с учениками. Думаю, это очень хороший инструмент! По-моему, это ценный способ начать обучение детей программированию. Python и программирование всегда очень волновали меня, ведь порог входа так высок. Теперь он стал ниже, и оказалось, что всё может быть очень просто. Мне понравилось видеть, как Hedy старается сделать программирование максимально доступным для пользователей!*
        Нидерланды: будущие учителя математики (средняя школа)

        *Простой интерфейс и хорошие примеры.* Учитель: 3–6-е классы (начальная школа)

        *Многоязычное программирование и сама концепция постепенного обучения программированию.* США: средняя школа, 6–8-е классы

        *Постепенное введение в программирование.* Австралия: старшая школа

        *Не хочется останавливаться.* Нидерланды: 2-й год HAVO-VWO

        *И то, что объяснение может быть на нидерландском языке (а код на английском), и то, что постепенно появляется всё больше возможностей.* Нидерланды: группа углублённого обучения

        *Но Hedy и его постепенные уровни... какая идея! Я хотел бы лично поблагодарить вас за создание этого инструмента. Не могу выразить свою благодарность в полной мере. Я никогда не видел такого интереса и энтузиазма у своих учеников, как при работе с Hedy. Мы дошли до 5-го уровня и планируем посвятить ему ещё неделю на уроках и практических занятиях, прежде чем приступить к Python.* Пакистан

        *«Настоящее» программирование — всё похоже на то, как это происходит в действительности.* Нидерланды: группа углублённого обучения, 4–8-е группы

        *Пошаговые задания. Весёлые занятия.* Нидерланды: 1-й год — все направления, 2-й год VWO/HAVO, 2-й год VWO +, 3-й год HAVO, 3-й год VWO

        *Мне очень нравится Hedy. Он хорошо устроен, и им удобно пользоваться в начальной школе. Постепенный подход Hedy работает прекрасно. Короткое объяснение в начале каждого уровня и небольшие примеры программ помогают детям быстро понять, что нового на выбранном уровне. Возможность выбирать разные задания тоже работает очень хорошо. Видно, как дети выбирают интересные им задания и затем работают над ними, проходя уровни. Hedy очень нравится детям, которые хорошо разбираются в программировании и хотят попробовать настоящий язык программирования. Это хорошая подготовка к средней школе, когда там начнут больше внимания уделять ИКТ-образованию.* Нидерланды: школа Монтессори в Угстгесте

        *Отличная структура.* Нидерланды: младшие классы средней школы HAVO-VWO

        *Я могу поддерживать темп класса.* Нидерланды: 7-я и 8-я группы

        ![Фелиен обучает детей](/images/teacherfeedback/Fkids1.JPG) *Фелиен обучает детей*        ![Дети узнают о Hedy](/images/teacherfeedback/Fkids2.JPG) *Дети узнают о Hedy*
teacher-guide:
-   title: Общая информация
    key: intro
    subsections:
    -   title: Что такое Hedy?
        text: |-
            Hedy — это текстовый язык программирования, специально разработанный для детей и подростков от 10 до 15 лет.
            В отличие от языков программирования для детей, таких как Scratch, Hedy использует не блоки кода, а текстовый код.
            С Hedy ты научишься писать код как настоящие программисты, но маленькими шагами и с игровыми упражнениями.
            Таким образом, Hedy может стать ступенькой к настоящим языкам программирования, таким как Python, в доступной и увлекательной форме!
            Если хочешь узнать больше, посмотри это <a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">видео</a> о развитии Hedy как языка программирования.
    -   title: Целевая аудитория
        text: |-
            Hedy разработан для учащихся средних и младших классов средней школы (10–15 лет), но подходит всем, кто хочет научиться программировать!
            Важно, чтобы ученики умели хорошо читать. Мы рекомендуем начинать работу с Hedy, когда ученики достигнут уровня чтения хотя бы 3-го класса.
            Ученикам (и учителям!) не нужен опыт программирования перед началом работы с Hedy.
    -   title: Как работает Hedy?
        text: |-
            Hedy разделён на уровни, в которых изучаются новые команды и понятия программирования. Каждый уровень содержит множество приключений для отработки только что изученных команд.
            В Hedy три раздела: Basic, Advanced и Expert. В Hedy Basic (уровни 1–8) можно познакомиться с увлекательными и простыми понятиями программирования: выводом текста, запросом ввода, простыми переменными и повторением. В Hedy Advanced (уровни 9–12) ваши ученики пойдут дальше и освоят более сложные идеи: циклы, вложенность и функции. Hedy Expert (уровни 13–16) предназначен для плавного перехода к полному синтаксису Python.
            Поэтому Hedy подойдёт для любых ваших учебных целей: познакомить учеников с радостью программирования, научить основным понятиям или подготовить к настоящему синтаксису Python.

            Как учитель, вы решаете не только, какие уровни доступны ученикам, но и какие приключения доступны на каждом уровне. Будут ли они создавать ресторан, калькулятор или дом с привидениями? Внутри каждого уровня приключения расположены от самого простого к самому сложному, но вы можете сочетать их так, как лучше подходит вашим ученикам.
            Ученики могут проходить приключения самостоятельно, но мы рекомендуем разбирать их вместе с классом.

            Приключения также включают примеры кода и решения, чтобы даже учителя с небольшим опытом работы с цифровыми технологиями могли использовать Hedy!
            Конечно, Hedy подходит и творческим учителям, которые любят создавать собственные планы уроков и приключения!

            Вы можете отслеживать работу учеников и их прогресс на странице класса.
    -   title: Устройства
        text: |-
            Hedy работает в браузере, а значит, подходит любое устройство с браузером (Google Chrome, Firefox, Edge и т. д.): ноутбук, Chromebook, планшет и даже смартфон.
            Перед работой с Hedy не нужно ничего скачивать: просто зайдите на сайт, и всё готово!
            Также доступна <a href="https://github.com/hedyorg/hedy/wiki/Offline-Hedy " target="_blank">офлайн-версия</a> Hedy.
    -   title: Сообщество Hedy
        text: |-
            Приглашаем всех учителей, программистов и других поклонников Hedy присоединиться к нашему <a href="https://discord.gg/8yY7dEme9r" target="_blank">серверу Discord</a>. Это идеальное место для общения о Hedy: у нас есть каналы, где можно показать свои классные проекты и уроки, сообщить об ошибках, пообщаться с другими учителями и командой Hedy.
            <a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">Здесь</a> вы найдёте видео о том, как присоединиться к сообществу Discord.

            Вы также можете следить за новостями Hedy, <a href="https://hedy.org/subscribe" target="_blank">подписавшись на нашу рассылку</a>. Или подпишитесь на нас в <a href="https://nl.linkedin.com/company/hedyorg" target="_blank">LinkedIn</a>.
    -   title: Hedy и GDPR
        text: |-
            Организации в ЕС должны соблюдать GDPR (Общий регламент по защите данных) при обработке персональных данных.
            Поскольку для многих школ это сложный вопрос, все возможности программирования в Hedy доступны без предоставления персональных данных.
            Самый простой способ — использовать Hedy без создания учётных записей для учителя и учеников. Без учётных записей Hedy доступен, но без раздела для учителя. Вы не сможете отслеживать прогресс учеников или выбирать, какие приключения и уровни им доступны. Это ограничение, но некоторые школы используют Hedy именно так.

            Второй способ — создать учётную запись учителя с адресом электронной почты без персональных данных, например «docent25@email.com». Кроме адреса электронной почты, который нужен только для сброса пароля, при создании учётной записи учителя не требуется сообщать никаких сведений.
            С учётной записью учителя вы можете создавать анонимные учётные записи для учеников, например rainbow-student1, rainbow-student2 и т. д. (подробное руководство см. в разделе «Подготовка к преподаванию»). Так вы сможете пользоваться всеми функциями Hedy, включая сохранение прогресса, не сообщая персональных данных о себе или своих учениках.

            Если этого недостаточно для вашей ситуации, мы можем подписать соглашение об обработке ваших персональных данных.
    -   title: Пожертвовать Hedy
        text: |-
            Нам пригодится ваша помощь, чтобы Hedy продолжал работать. Мы используем эти деньги для работы сервера, поддержки и улучшения сайта Hedy. Мы благодарны за любые пожертвования в пользу Hedy! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Нажмите здесь, чтобы пожертвовать в евро </a> или <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">нажмите здесь, чтобы пожертвовать в долларах США</a>. Спасибо!
-   title: Распространённые ошибки
    key: common_mistakes
    intro: |-
        На ошибках можно учиться, особенно в программировании! Ошибки неизбежны и дают прекрасную возможность научиться новому, но учителю бывает непросто найти верное исправление! Особенно когда по мере продвижения учеников по уровням программы становятся всё длиннее. Поэтому мы составили список часто допускаемых ошибок на каждом уровне и способов их исправления.
    levels:
    -   level: '1'
        concepts_and_changes: |-
            На уровне 1 ученики пишут и запускают свои самые первые строки кода. Пока не нужно
            беспокоиться о знаках препинания: каждая строка начинается с команды, а остальная
            часть строки — обычный текст. Главная идея урока в том, что компьютер делает именно
            то, что ему говорят, — не больше и не меньше.

            Новое на этом уровне:

            * Вывод текста на экран с помощью `{print}`
            * Вопросы с помощью `{ask}` и использование ответа с помощью `{answer}`
            * Рисование черепахой с помощью `{forward}` и `{turn}`
            * Воспроизведение музыкальной ноты с помощью `{play}`
        sections:
        -   title: Ученики забывают вводить команды
            example:
                error_text: Например, они вводят предложение без команды print.
                error_code: Hedy не может это напечатать
                solution_text: Научите своих учеников всегда начинать строку кода с команды.
                solution_code: '{print} Hedy может это напечатать!'
        -   title: Ученики используют заглавные буквы при вводе команд
            example:
                error_text: Команды не будут работать, если они написаны с заглавных букв.
                error_code: |-
                    Ask Почему мой код не работает?
                    Print Потому что я использую заглавные буквы.
                solution_text: Замените заглавные буквы строчными.
                solution_code: |-
                    {ask} Почему мой код теперь работает?
                    {print} Потому что я заменил заглавные буквы строчными!
        -   title: Ученики используют answer без ask
            example:
                error_text: answer нужен, чтобы повторить ответ после команды ask. Без ask answer ничего не делает.
                error_code: '{print} Тебя зовут {answer}'
                solution_text: Добавьте команду ask, чтобы код заработал.
                solution_code: |-
                    {ask} Как тебя зовут?
                    {print} Тебя зовут {answer}
        -   title: 'Черепаха: ученики позволяют черепахе уйти за пределы экрана'
            example:
                error_text: Ученики часто любят пробовать большие числа при работе с черепахой, из-за чего стрелка уходит за пределы экрана.
                error_code: |-
                    {forward} 300
                    {turn} 90
                solution_text: В этом примере ученики часто думают, что команда turn не сработала, хотя она выполнила именно то, что должна была. Просто черепаха вышла за пределы экрана. Используйте меньшие числа, чтобы этого избежать.
                solution_code: |-
                    {forward} 100
                    {turn} 90
        -   title: "Черепаха: ученики используют команду backward, но такой команды нет."
            example:
                error_text: Backward — это не команда.
                error_code: backward 100
                solution_text: 'Чтобы черепаха двигалась назад, используйте команду forward и отрицательное число. Например:'
                solution_code: '{forward} -100'
    -   level: '2'
        concepts_and_changes: |-
            На уровне 1 ученики научились использовать переменную `{answer}`. На этом уровне они научатся работать с несколькими переменными.
            Это первое абстрактное понятие программирования, с которым они встретятся: имя, обозначающее значение, которое может меняться.
            Чтобы пользоваться несколькими переменными, ученикам нужно научиться их определять.
            Поэтому команда `{ask}` изменилась: теперь перед ней нужно указывать переменную, в которой будет сохранён ответ.

            Новое на этом уровне:

            * Сохранение значения в переменной с помощью `{is}`
            * Сохранение ответа на вопрос в переменной по своему выбору: `{is}` `{ask}` Как тебя зовут?
            * Приостановка программы с помощью `{sleep}`
            * Поворот рисующей черепахи на заданное число градусов: `{turn}` 90
        sections:
        -   title: Ученики допускают опечатки в командах
            example:
                error_text: Hedy не может распознать команду с опечаткой.
                error_code: prinnt Не допускай опечаток
                solution_text: Научите своих учеников читать сообщения об ошибках. Так они смогут сами понять, что пошло не так.
                solution_code: "{print} Не допускай опечаток"
        -   title: Ученики забывают, что команда ask изменилась
            example:
                error_text: На этом уровне ученики знакомятся с переменными. Команде ask тоже нужна переменная, но ученики об этом забывают.
                error_code: ask что бы ты хотел съесть
                solution_text: На этом уровне нужно указать Hedy, где сохранить ответ, чтобы его можно было использовать позже. Это называется переменной.
                solution_code: order {is} {ask} Что бы ты хотел съесть
        -   title: Ученики пытаются использовать `{answer}` для нескольких вопросов
            example:
                error_text: Переменная `{answer}` по-прежнему работает, но хранит только один ответ за раз. Иногда ученики пытаются сохранить несколько ответов в одной переменной.
                error_code: |-
                    answer {is} {ask} Как тебя зовут?
                    answer {is} {ask} Сколько тебе лет?
                    {print} Привет, {answer}.
                    {print} Тебе {answer} лет.
                solution_text: Объясните ученикам, почему важно точно выбирать имена переменных.
                solution_code: |-
                    name {is} {ask} Как тебя зовут?
                    age {is} {ask} Сколько тебе лет?
                    {print} Привет, {name}.
                    {print} Тебе {age} лет.
        -   title: Ученики используют имя переменной как обычное слово
            example:
                error_text: В примере ниже слово 'name' используется и как переменная, и как обычный текст. Результатом выполнения кода будет «Привет, моё Hedy — Hedy».
                error_code: |-
                    name {is} Hedy
                    {print} Привет, моё name — name
                solution_text: Не используйте в качестве имени переменной слово, которое хотите вывести как текст. На уровне 4 эта проблема решается кавычками.
                solution_code: |-
                    name {is} Hedy
                    {print} Привет, я name
        -   title: Ученики используют длинные имена переменных из двух слов.
            example:
                error_text: Имя переменной должно состоять из одного слова. Чтобы соединить два слова, можно использовать знак подчёркивания. Тогда они считаются одним словом.
                error_code: chosen door is ask Какую дверь ты выбираешь
                solution_text: Добавьте знак подчёркивания.
                solution_code: chosen_door {is} {ask} какую дверь ты выбираешь
        -   title: Ученики могут использовать два разных имени для одной и той же переменной
            example:
                error_text: В этом примере ученик использовал 'horse' и 'name' для одной и той же переменной.
                error_code: |-
                    horse {is} {ask} Как зовут твою лошадь
                    {print} Твою лошадь зовут name
                solution_text: Всегда проверяйте, что переменная имеет одно и то же имя во всём коде. Небольшие различия (например, множественное число) бывает трудно заметить, но они мешают работе кода.
                solution_code: |-
                    name {is} {ask} Как зовут твою лошадь
                    {print} Твою лошадь зовут name
    -   level: '3'
        concepts_and_changes: |-
            На уровне 3 появляются списки и случайный выбор. На этом уровне запуск одной и той же
            программы дважды впервые может дать разные результаты. Это удивляет учеников, которые
            считают программу неизменным рецептом. Подходящий момент, чтобы предложить им запустить
            код несколько раз, прежде чем решать, правильно ли он работает.

            Новое на этом уровне:

            * Создание списка с помощью `{is}` и выбор элемента с помощью `{at} {random}`
            * Добавление элемента в список с помощью `{add} {to}`
            * Удаление элемента из списка с помощью `{remove} {from}`
        sections:
        -   title: Ученики пытаются вывести списки целиком
            example:
                error_text: Список нельзя вывести целиком. С помощью {at} {random} можно вывести только один его элемент.
                error_code: |-
                    groceries {is} яблоки, молоко, шоколад
                    {print} groceries
                solution_text: Чтобы вывести перечень всех покупок, достаточно написать их после команды `{print}`. Или можно использовать список, чтобы вывести один элемент с помощью `{at}` `{random}`.
                solution_code: |-
                    {print} яблоки, молоко, шоколад

                    # или

                    groceries {is} яблоки, молоко, шоколад
                    {print} groceries {at} {random}
        -   title: Ученики используют имя переменной или списка как обычный текст
            example:
                error_text: Вероятно, эта проблема возникала и на уровне 2. Теперь она может возникнуть и со списками.
                error_code: |-
                    name {is} Hedy
                    {print} Привет, моё name — name

                    # или

                    animal {is} носорог, пчела, лебедь
                    {print} Лучшее животное — это... animal {at} {random}
                solution_text: Не используйте имена переменных или списков как обычный текст для вывода. На уровне 4 эта проблема решается кавычками.
                solution_code: |-
                    name {is} Hedy
                    {print} Привет, я name

                    # или

                    animals {is} носорог, пчела, лебедь
                    {print} Лучшее животное — это... animals {at} {random}
        -   title: Ученики забывают `{at}` в `{at}` `{random}`
            example:
                error_text: Как в примере
                error_code: |-
                    birds {is} воробей, чайка, малиновка
                    {print} birds random
                solution_text: Эта проблема решается добавлением слова at.
                solution_code: |-
                    birds {is} воробей, чайка, малиновка
                    {print} birds {at} {random}
        -   title: Ученики забывают использовать команду `{print}` вместе с командой `{at}` `{random}`
            example:
                error_text: Иногда они также ставят `{at}` `{random}` в начале строки.
                error_code: |-
                    fruit {is} яблоко, вишня, банан
                    fruit {at} {random}
                solution_text: Подчеркните, что для вывода текста всегда нужна команда print.
                solution_code: |-
                    fruit {is} яблоко, вишня, банан
                    {print} fruit {at} {random}
        -   title: Ученики забывают ставить запятые в списках
            example:
                error_text: В списке элементы разделяются запятыми.
                error_code: |-
                    pizzas {is} грибная с тунцом четыре сезона
                    {print} pizzas {at} {random}
                solution_text: После каждого элемента списка должна стоять запятая
                solution_code: |-
                    pizzas {is} грибная, с тунцом, четыре сезона
                    {print} pizzas {at} {random}
        -   title: Ученики пытаются использовать `{at}` `{random}` без списка
            example:
                error_text: Например
                error_code: |-
                    clubs {is} Manchester United
                    {print} clubs {at} {random}
                solution_text: Hedy не может вывести случайный элемент, потому что нет списка, из которого его можно выбрать.
                solution_code: |-
                    clubs {is} Manchester United, FC Bayern Munich, FC Barcelona
                    {print} clubs {at} {random}
        -   title: Ученики пытаются использовать add/remove без списка
            example:
                error_text: В примере ниже 'names' — не список, а переменная. В неё нельзя ничего добавить.
                error_code: |-
                    names {is} Jake
                    your_name {is} {ask} Кто ты?
                    {add} your_name {to} names
                    {print} names {at} {random}
                solution_text: Сначала нужен список, поэтому добавьте второе имя, например Amy, чтобы превратить names в список. Если вы не хотите, чтобы Amy оставалась в списке, её можно затем удалить с помощью remove.
                solution_code: |-
                    names {is} Jake, Amy
                    your_name {is} {ask} Кто ты?
                    {add} your_name {to} names
                    {print} names {at} {random}
        -   title: Ученики забывают использовать `{to}`/`{from}` в `{add}`/`{remove}`
            example:
                error_text: Без to/from команда add/remove не работает.
                error_code: |-
                    adventures {is} история, попугай, кубик
                    choice {is} Какое приключение тебе нравится больше всего?
                    {add} choice
                    {remove} кубик
                    {print} Я люблю приключения {at} {random}
                solution_text: Hedy должен знать, в какой список добавить элемент или из какого списка его удалить.
                solution_code: |-
                    adventures {is} история, попугай, кубик
                    choice {is} Какое приключение тебе нравится больше всего?
                    {add} choice {to_list} adventures
                    {remove} кубик {from} adventures
                    {print} Я люблю приключения {at} {random}
    -   level: '4'
        concepts_and_changes: |-
            На уровне 4 ученики впервые знакомятся с важностью синтаксиса в программировании. На этом уровне текст в `{print}` и `{ask}` заключается в кавычки. Возможно, это не самый увлекательный уровень, но этот навык очень важно освоить перед переходом к следующим уровням. Уровень может показаться ученикам сложным, особенно когда в тексте встречаются переменные. Мы рекомендуем подробно объяснять материал и практиковаться вместе с учениками.

            Новое на этом уровне:

            * Использование кавычек вокруг любого строкового текста после `{print}` и `{ask}`
            * Переменные остаются вне кавычек
            * Использование двойных кавычек, если в строке есть апострофы
            * Очистка экрана с помощью `{clear}`
            * Использование цветов при рисовании черепахой с помощью `{color}`
        sections:
        -   title: Ученики забывают ставить кавычки с обеих сторон текста
            example:
                error_text: На этом уровне командам print и ask нужна пара кавычек. Одна перед текстом и одна после.
                error_code: |-
                    {print} Привет
                    mood {is} {ask} 'Как дела?
                solution_text: Добавьте правильные кавычки.
                solution_code: |-
                    {print} 'Привет'
                    mood {is} {ask} 'Как дела?'
        -   title: Ученики используют неправильные кавычки
            example:
                error_text: В начале урока важно проверить, умеют ли ученики правильно вводить кавычки. В русском тексте используются «ёлочки», а в примерах кода — прямые одинарные (') или двойные (") кавычки, как в Python. Обратные кавычки не подходят.
                error_code: |-
                    {print} `Добро пожаловать в ресторан`
                    food {is} {ask} ,Что бы ты хотел заказать?,
                solution_text: 'Вот правильные кавычки:'
                solution_code: |-
                    {print} 'Добро пожаловать в ресторан'
                    food {is} {ask} 'Что бы ты хотел заказать?'
        -   title: Ученики используют апостроф в тексте и одинарные кавычки
            example:
                error_text: Апостроф внутри текста можно спутать с закрывающей одинарной кавычкой. Например, он есть в названии Кот-д'Ивуар.
                error_code: "{print} 'Я хочу посетить Кот-д'Ивуар'"
                solution_text: Используйте двойные кавычки, чтобы решить проблему.
                solution_code: |-
                    {print} "Я хочу посетить Кот-д'Ивуар"
    -   level: '5'
        concepts_and_changes: |-
            На этом уровне появляются `{if}` и `{else}`.

            Новое на этом уровне:
            * Выбор с помощью `{if}` и `{else}`
        sections:
        -   title: Ученики забывают использовать `{print}` в команде `{if}`
            example:
                error_text: После `{if}` или `{else}` ученики забывают использовать ещё одну команду, например `{print}` или `{ask}`.
                error_code: |-
                    {if} name {is} Hedy 'Отлично!'
                    {else}  Hedy {is} лучше!
                solution_text: Добавьте команду print, чтобы исправить ошибку.
                solution_code: |-
                    {if} name {is} Hedy {print} 'Отлично!'
                    {else} {print} 'Hedy лучше!'
        -   title: Ученики могут использовать два разных имени для одной и той же переменной
            example:
                error_text: В этом примере ученик использовал 'horse' и 'name' для одной и той же переменной.
                error_code: |-
                    horse {is} {ask} 'Как зовут твою лошадь?'
                    {if} name {is} Bonfire {print} 'круто'
                    {else} {print} 'не так круто!'
                solution_text: Всегда проверяйте, что переменная имеет одно и то же имя во всём коде. Небольшие различия (например, множественное число) бывает трудно заметить, но они мешают работе кода.
                solution_code: |-
                    horse {is} {ask} 'Как зовут твою лошадь'
                    {if} horse {is} Bonfire {print} 'круто!'
                    {else} {print} 'не так круто!'
        -   title: Ученики всё ещё забывают кавычки с обеих сторон
            example:
                error_text: При использовании команды `{if}` строки кода могут стать очень длинными, и ученики часто забывают о кавычках.
                error_code: |-
                    {if} name {is} Hedy {print} весело
                    {else} {print} 'так себе!
                solution_text: Всегда используйте две кавычки в команде print.
                solution_code: |-
                    {if} name {is} Hedy {print} 'весело'
                    {else} {print} 'так себе!'
        -   title: Ученики заключают имена переменных в кавычки
            example:
                error_text: На этом уровне имена переменных не заключаются в кавычки.
                error_code: |-
                    {if}  name  {is} 'Hedy' {print} 'весело'
                    {else} {print} 'так себе!'
                solution_text: Удалите кавычки, чтобы код заработал.
                solution_code: |-
                    {if} name {is} Hedy {print} 'весело'
                    {else} {print} 'так себе!
        -   title: Ученики используют длинные имена переменных из двух или более слов
            example:
                error_text: Переменные в Hedy не могут содержать пробелы, поэтому для объединения нескольких слов ученикам нужно соединять их знаками подчёркивания (_)
                error_code: chosen door {is} {ask}  'Какую дверь ты выбираешь?'
                solution_text: Добавьте знак подчёркивания.
                solution_code: chosen_door {is} {ask} 'Какую дверь ты выбираешь?'
        -   title: Ученики хотят, чтобы несколько ответов были правильными
            example:
                error_text: Например, этот ученик хочет, чтобы Hedy говорил всем его друзьям, что они смешные, а остальным одноклассникам — что они не смешные.
                error_code: "{if} name {is} Jesse, David, Souf {print} 'Ты смешной' {else} {print} 'Ты не смешной'"
                solution_text: |-
                    Для этого можно использовать команду `{in}`. Хотя она объясняется на более высоком уровне, она уже работает на уровне 5.
                    Другое решение — использовать несколько команд `{if}` без команды `{else}`. Недостаток в том, что программа не скажет остальным одноклассникам, что они не смешные.
                solution_code: |-
                    friends {is} Jesse, David, Souf
                    name {is} {ask} 'Кто ты?'
                    {if} name {in} friends {print} 'Ты смешной'
                    {else} {print} 'Ты не смешной'

                    # или

                    name {is} {ask} 'Кто ты?'
                    {if} name {is} Jesse {print} 'Ты смешной'
                    {if} name {is} David {print} 'Ты смешной'
                    {if} name {is} Souf {print} 'Ты смешной'
        -   title: Ученики задают имя переменной, совпадающее со значением в условии `{if}`
            example:
                error_text: В примере ниже пароль — 'password'. В результате он всегда будет считаться правильным.
                error_code: |-
                    password {is} {ask} 'Какой пароль?'
                    {if} password {is} password {print} 'Доступ разрешён'
                    {else} {print} 'Доступ запрещён!'
                solution_text: Выберите другое имя для переменной.
                solution_code: |-
                    secret_password {is} {ask} 'Какой пароль'
                    {if} secret_password {is} password {print} 'Доступ разрешён!'
                    {else} {print} 'Доступ запрещён!'
    -   level: '6'
        concepts_and_changes: |-
            Этот уровень развивает работу с новыми командами `{if}` и `{else}` из предыдущего уровня. С помощью `{if}` и `{else}` в код можно добавить два варианта. На этом уровне ученики учатся добавлять больше вариантов с помощью `{elif}`. Важно научиться размещать `{if}`, `{elif}` и `{else}` на отдельных строках. Кроме того, ученики учатся проверять, есть ли ответ в списке, с помощью `{in}`.

            Новое на этом уровне:

            * Добавление нескольких вариантов с помощью `{elif}`
            * Проверка наличия элемента в списке с помощью `{in}`

        sections:
        -   title: Ученики записывают условие {if} в одну строку
            example:
                error_text: Иногда ученики пытаются уместить всё в одной строке. Теперь так делать нельзя.
                error_code: |-
                    animal {is} {ask} 'Какое твоё любимое животное?'
                    {if} animal {is} собака {print} 'Я тоже люблю собак!'
                    {elif} animal {is} кошка {print} 'Кошки неплохие'
                    {else} {print} 'Классное животное'
                solution_text: "Начиная с этого уровня нужно не только размещать {if} и {else} на отдельных строках, но и разделять условие и команду по разным строкам. Вот так: "
                solution_code: animal {is} {ask} 'Какое твоё любимое животное?' {if} animal {is} собака {print} 'Я тоже люблю собак!' {elif} animal {is} кошка {print} 'Кошки неплохие' {else} {print} 'Классное животное'
        -   title: Ученики используют `{elif}` как `{else}`, то есть без условия
            example:
                error_text: Ученики забывают, что нужно условие
                error_code: |-
                    color {is} {ask} 'Какой твой любимый цвет?
                    {if} color {is} зелёный
                    {print} 'Я тоже люблю зелёный!'
                    {elif}
                    {print} 'Мне нравится зелёный'
                solution_text: Добавьте условие
                solution_code: |-
                    color {is} {ask} 'Какой твой любимый цвет?
                    {if} color {is} зелёный
                    {print} 'Я тоже люблю зелёный!'
                    {elif} color {is} синий
                    {print} 'Синий неплохой'
                    {else}
                    {print} 'Мне нравится зелёный'
        -   title: Ученики используют {in} без списка
            example:
                error_text: Ученики забывают, что нужен список
                error_code: |-
                    {if} chosen_color {in} pretty_colors
                    {print} 'Отличный выбор!'
                solution_text: Добавьте список
                solution_code: |-
                    pretty_colors {is} синий, зелёный, фиолетовый
                    {if} chosen_color {in} pretty_colors
                    {print} 'Отличный выбор!'
    -   level: '7'
        concepts_and_changes: |-
            На этом уровне ученики учатся добавлять вычисления в свои программы. Теперь они смогут выполнять вычисления с переменными и десятичными дробями.

            Новое на этом уровне:
            * Использование математических знаков: + - * и /
            * Использование десятичных дробей с точкой
            * Использование переменных в вычислениях
            * Использование знака = вместо `{is}`
        sections:
        -   title: Ученики испытывают трудности с кавычками
            example:
                error_text: Некоторым ученикам трудно понять, когда нужны кавычки. Если добавить кавычки, на экране вывода появится буквально '5+5'.
                error_code: "{print} '5 + 5'"
                solution_text: Этот код выведет на экран '10'.
                solution_code: '{print} 5 + 5'
        -   title: Ученики испытывают трудности с вычислениями с переменными
            example:
                error_text: 'Некоторым ученикам трудно выполнять вычисления с переменными. Попробуйте показать им очень простые примеры, например:'
                error_code: |-
                    age = {ask} 'Сколько тебе лет?'
                    {print} 'В следующем году тебе будет ' age + 1
                solution_text: Или сделайте следующий шаг — вот так.
                solution_code: |-
                    price = 0
                    {print} 'Добро пожаловать в наш бургерный ресторан'
                    burger = {ask} 'Хочешь бургер?'
                    {if} burger = да
                    price = price + 10
                    drink = {ask} 'Хочешь напиток?'
                    {if} drink = да
                    price = price + 4
                    {print} 'С тебя ' price ' евро, пожалуйста'
        -   title: Ученики забывают знак =
            example:
                error_text: В Hedy всегда будет разрешено использовать {is} вместо =, так что это не проблема. Если ваша цель — подготовить учеников к настоящему Python или другим языкам программирования, рекомендуем учить их использовать =. Если вы просто хотите познакомить учеников с программированием, не беспокойтесь о том, используют они = или {is}.
                error_code: name {is} Hedy
                solution_text: знак =
                solution_code: name = Hedy
        -   title: Ученики используют запятую вместо точки в десятичных дробях
            example:
                error_text: В некоторых языках принято использовать запятую в десятичных дробях. В языках программирования используется точка, в том числе и в Hedy.
                error_code: |-
                    {print} 2,5 + 2,5
                solution_text: Используйте точки в десятичных дробях
                solution_code: |-
                    {print} 2.5 + 2.5
    -   level: '8'
        concepts_and_changes: |-
            На этом последнем уровне Hedy Basic ваши ученики научатся использовать повторение в программах! Пока они могут повторять только одну строку несколько раз. Повторение нескольких строк будет рассмотрено на следующих уровнях.

            Новое на этом уровне:
            * Повторение строки с помощью `{repeat} 3 {times}`
            * Повторение строки столько раз, сколько задано переменной

        sections:
        -   title: Ученики забывают одно из слов команды repeat или команду print
            example:
                error_text: Убедитесь, что ученики знают, как использовать и полную команду repeat, и команду print.
                error_code: |-
                    {repeat} 3 {times}  "Ведь он отличный парень"
                    {repeat} 3 {print} 'И никто не станет спорить!'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    {repeat} 3 {times} {print} "Ведь он отличный парень"
                    {repeat} 3 {times} {print} 'И никто не станет спорить!'
        -   title: Ученики пытаются повторить несколько строк
            example:
                error_text: На этом уровне можно повторять только одну строку кода. В этом коде ученик хотел вывести три разных напитка, но это не сработает. Программа задаст вопрос три раза и выведет только последний ответ.
                error_code: |-
                    {repeat} 3 {times} drink = {ask} 'Что бы ты хотел выпить?'
                    {print} drink
                solution_text: Чтобы повторять несколько строк, нужно перейти на следующий уровень. Поэтому на этом уровне придётся выводить всё по отдельности.
                solution_code: |-
                    drink = {ask} 'Что бы ты хотел выпить?'
                    {print} drink
                    drink = {ask} 'Что бы ты хотел выпить?'
                    {print} drink
                    drink = {ask} 'Что бы ты хотел выпить?'
                    {print} drink
        -   title: Ученики создают программы, выполнение которых занимает слишком много времени
            example:
                error_text: На этом уровне очень легко создавать программы, выполнение которых занимает много времени. Если программа выполняется слишком долго, она останавливается, чтобы не перегружать компьютер ученика.
                error_code: "{repeat} 100 {times} {print} 'Сколько раз я могу это повторить?'"
                solution_text: Убедитесь, что код не выполняется слишком долго
                solution_code: "{repeat} 20 {times} {print} 'Этого достаточно'"
    -   level: '9'
        concepts_and_changes: |-
            На этом первом уровне Hedy Advanced ученики учатся использовать отступы. Это позволяет размещать несколько строк в условии if или повторять несколько строк. Ученикам часто очень нравится этот уровень, потому что он позволяет создавать более сложные программы.
            С другой стороны, некоторым ученикам будет трудно понять, когда нужны отступы и как их делать.

            Новое на этом уровне:
            * Несколько строк после `{if}`, `{elif}` или `{else}` с помощью отступов
            * Несколько строк после `{repeat}` с помощью отступов
        sections:
        -   title: Ученики неправильно используют отступы
            example:
                error_text: Отступы — новое понятие на этом уровне, и некоторым ученикам может быть трудно его освоить. Убедитесь, что они потренировались на простых примерах, прежде чем писать целую программу с отступами.
                error_code: |-
                    {repeat} 3 {times}
                    {print} 'привет'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    {repeat} 3 {times}
                        {print} 'привет'
        -   title: Ученики повторяют только одну строку, хотя хотели повторить несколько
            example:
                error_text: Например, в коде ниже ученик хотел принять заказы на напитки у трёх человек. Но программа задала вопрос три раза, а записала только один заказ.
                error_code: |-
                    {repeat} 3 {times}
                        drink = {ask} 'Что бы ты хотел выпить?'
                    {print} drink
                solution_text: |-
                    В правильном коде третья строка тоже начинается с отступа. Так она относится к блоку repeat и поэтому повторяется три раза.
                    Показывая ученикам эти различия, вы поможете им понять, зачем нужны отступы, чтобы программы работали.
                solution_code: |-
                    {repeat} 3 {times}
                        drink = {ask} 'Что бы ты хотел выпить?'
                        {print} drink
        -   title: Ученики хотят вкладывать условия `{if}` друг в друга или помещать условия `{if}` внутрь цикла
            example:
                error_text: |-
                    На этом уровне ещё нельзя помещать условия `{if}` внутрь других условий `{if}` или циклов repeat.
                    На следующем уровне это будет разрешено.
                error_code: |-
                    birthday = {ask} 'У тебя день рождения?'
                    {if} birthday = да
                        {repeat} 3 {times}
                            {print} 'Гип-гип, ура!'
                solution_text: 'Это правильный код для этого уровня:'
                solution_code: |-
                    birthday = {ask} 'У тебя день рождения?'
                    {if} birthday = да
                        {print} 'Гип-гип, ура!'
                        {print} 'Гип-гип, ура!'
                        {print} 'Гип-гип, ура!'
        -   title: Ученики создают программы, выполнение которых занимает слишком много времени
            example:
                error_text: На этом уровне очень легко создавать программы, выполнение которых занимает много времени. Если программа выполняется слишком долго, она останавливается, чтобы не перегружать компьютер ученика.
                error_code: |-
                    {repeat} 100 {times}
                        {print} 'Сколько раз я могу это повторить?'
                solution_text: Убедитесь, что код не выполняется слишком долго
                solution_code: |-
                    {repeat} 20 {times}
                        {print} 'Этого достаточно'
    -   level: '10'
        concepts_and_changes: |-
            На этом уровне мы снова расширяем возможности {if} и {repeat}. На предыдущем уровне ученики научились использовать несколько строк после {repeat, {if}, {elif} или {else}.
            Теперь они узнают о *вложенности* — размещении {if} или {repeat} внутри другого {if} или {repeat}. Также они изучат две новые команды: {and} и {or}.
            Это даст ученикам гораздо больше возможностей для создания разнообразных программ.

            Новое на этом уровне:
            * Вложенные {if} и {repeat}
            * Использование {and} и {or} после {if}
        sections:
        -   title: Ученики допускают ошибки в отступах
            example:
                error_text: Самое сложное на этом уровне — правильно расставить отступы. Ученики любят вкладывать условия `{if}` друг в друга, иногда даже внутрь уже вложенных условий `{if}`. Следить за отступами бывает очень непросто.
                error_code: |-
                    {print} 'Робин идёт по центру города'
                    location = {ask} 'Робин зайдёт в магазин или пойдёт домой?'
                    {if} location {is} магазин
                        {print} 'Она заходит в магазин.'
                        {print} 'Робин видит интересную книгу'
                        book = {ask} 'Робин покупает книгу?'
                            {if} book {is} да
                    {print} 'Робин покупает книгу и идёт домой'
                    {else}
                        {print} 'Робин выходит из магазина и идёт домой'
                    {else}
                        {print} 'Робин идёт домой'
                solution_text: Это правильный код. Старайтесь следить за всеми конструкциями, когда помещаете условия `{if}` внутрь других условий `{if}`.
                solution_code: |-
                    {print} 'Робин идёт по центру города'
                    location = {ask} 'Робин зайдёт в магазин или пойдёт домой?'
                    {if} location {is} магазин
                        {print} 'Она заходит в магазин.'
                        {print} 'Робин видит интересную книгу'
                        book = {ask} 'Робин покупает книгу?'
                        {if} book {is} да
                            {print} 'Робин покупает книгу и идёт домой'
                        {else}
                            {print} 'Робин выходит из магазина и идёт домой'
                    {else}
                        {print} 'Робин идёт домой'
        -   title: Ученики путают `{and}` с `{or}`
            example:
                error_text: Обе команды могут показаться похожими, но их функции сильно различаются.
                error_code: |-
                    game = {ask} 'Хочешь поиграть в игру?'
                    time = {ask} 'У тебя есть время поиграть?'
                    {if} game {is} 'да' {or} time {is} 'да'
                        {print} 'Давай поиграем!'
                solution_text: В этом случае человек должен ответить «да» на оба вопроса, поэтому следует использовать `and`.
                solution_code: |-
                    game = {ask} 'Хочешь поиграть в игру?'
                    time = {ask} 'У тебя есть время поиграть?'
                    {if} game {is} 'да' {and} time {is} 'да'
                        {print} 'Давай поиграем!'
        -   title: Ученики пишут неполные строки с `{or}`
            example:
                error_text: После {or} нужно указывать полное условие.
                error_code: |-
                    color = {ask} 'Какой цвет тебе нравится?'
                    {if} color {is} синий {or} зелёный
                        {print} 'Красиво!'
                solution_text: 'Дополните строку вот так:'
                solution_code: |-
                    color = {ask} 'Какой цвет тебе нравится?'
                    {if} color {is} синий {or} color {is} зелёный
                        {print} 'Красиво!'
    -   level: '11'
        concepts_and_changes: |-
            На этом уровне ученики познакомятся с циклами {for}.

            Новое на этом уровне:
            * Циклы с {for}
        sections:
        -   title: Ученики неправильно используют команду `{for}`
            example:
                error_text: Мы часто видим, что ученики пытаются вывести список (в примере animals), а не его элементы.
                error_code: |-
                    animals {is} собака, кошка, рыба-капля
                    {for} animal {in} animals
                      {print} 'Я люблю ' animals
                solution_text: Слово animals в последней строке нужно заменить на animal.
                solution_code: |-
                    animals {is} собака, кошка, рыба-капля
                    {for} animal {in} animals
                      {print} 'Я люблю ' animal
        -   title: Ученики забывают об отступах
            example:
                error_text: Ученики часто забывают делать отступ после команды for.
                error_code: |-
                    animals {is} собака, кошка, рыба-капля
                    {for} animal {in} animals
                    {print} 'Я люблю ' animals
                solution_text: После команды for нужен отступ.
                solution_code: |-
                    animals {is} собака, кошка, рыба-капля
                    {for} animal {in} animals
                      {print} 'Я люблю ' animal
    -   level: '12'
        concepts_and_changes: |-
            На этом последнем уровне Hedy Advanced ученики научатся использовать простые функции.

            Новое на этом уровне:
            * Использование простых функций с {define} и {call}
        sections:
        -   title: Ученики создают функцию, но забывают её вызвать.
            example:
                error_text: Функция работает только тогда, когда её вызывают.
                error_code: |-
                    {define} greet_costumer
                        {print} 'Привет'
                        {print} 'Как у тебя дела?'
                solution_text: Вызовите функцию
                solution_code: |-
                    {define} greet_costumer
                        {print} 'Привет'
                        {print} 'Как у тебя дела?'

                    {call} greet_costumer
        -   title: Ученики испытывают трудности с отступами.
            example:
                error_text: Для многих учеников отступы по-прежнему будут непростыми
                error_code: |-
                    {define} function
                    {print} 'Используй отступы в функции.'
                    {if} use_if_statement {is} 'да'
                    {print} 'И не забудь об отступах в циклах'
                solution_text: Используйте правильные отступы при работе с функцией
                solution_code: |-
                    {define} function
                        {print} 'Используй отступы в функции.'
                        {if} use_if_statement_too {is} 'да'
                            {print} 'И не забудь об отступах в циклах'
        -   title: Ученики забывают о кавычках
            example:
                error_text: Теперь ученикам нужно больше кавычек, чем на предыдущих уровнях. В этом примере кавычки забыты в списке и в команде `{if}`.
                error_code: |-
                    superheroes = Spiderman, Batman, Iron Man
                    superhero = superheroes {at} {random}
                    {if} superhero = Batman
                        {print} 'Я БЭТМЕН!'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    superheroes = 'Spiderman', 'Batman', 'Iron Man'
                    superhero = superheroes {at} {random}
                    {if} superhero {is} 'Batman'
                        {print} 'Я БЭТМЕН!'

    -   level: '13'
        concepts_and_changes: |-
            На этом первом уровне Hedy Expert ученики будут всё глубже знакомиться с понятиями и синтаксисом настоящих языков программирования.
            Мы рекомендуем проходить уровни Hedy Expert с учениками только в том случае, если ваша цель — подготовить их к работе с другими «настоящими» языками программирования (например, Python).
            Если такая учебная цель не подходит вашим ученикам, рекомендуем ограничиться Hedy Basic и Hedy Advanced: там они изучат основные принципы программирования, не отвлекаясь на особые правила синтаксиса.

            **Обратите внимание:** начиная с этого уровня синтаксис Hedy почти совпадает с синтаксисом Python. Это означает, что изученный ранее синтаксис Hedy здесь может не работать. На следующих уровнях мы объясним весь новый синтаксис Python, но, чтобы не перегружать учеников, мы распределили материал по нескольким уровням.
            Поэтому некоторые возможности, например функции и списки, уже не будут работать по правилам Hedy, а новый способ работы с ними по правилам Python ещё не будет объяснён. Ученикам понадобится немного терпения: мы делаем шаг назад по сравнению с предыдущими уровнями, чтобы освоить синтаксис, а затем продолжим изучать все возможности уже по правилам Python.

            На этом уровне ученики также научатся работать с операторами, что даст им больше возможностей для вычислений в программах.


            Новое на этом уровне:
            * Вывод с синтаксисом Python: `{print}('Привет, мир!')
            * Совместный вывод строкового текста и переменных: `{print}('Привет, ', name, '!')
            * Вопросы с помощью `{input}`
            * Использование двоеточий после условий {if}
            * Использование операторов: < > == != <= >=
        sections:
        -   title: Ученики забывают использовать новый синтаксис
            example:
                error_text: На этом уровне много новых правил синтаксиса.
                error_code: |-
                    mood {is} {ask} 'Как у тебя дела, ' name '?'
                    {if} mood {is} хорошо
                        {print} 'Отлично!'
                solution_text: Используйте правильный синтаксис.
                solution_code: |-
                    mood = input('Как у тебя дела?', name, '?')
                    {if} mood == 'хорошо':
                        {print}('Отлично!')
        -   title: Ученики путают знаки < и >
            example:
                error_text: Часто ученики уже знакомы с этими знаками по урокам математики. Но если ваши ученики ещё их не знают, у них могут возникнуть трудности.
                error_code: |-
                    age = {ask} 'Сколько тебе лет?'
                    {if} age < 12
                        {print} 'Ты старше меня!'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    age = {ask} 'Сколько тебе лет?'
                    {if} age > 12
                        {print} 'Ты старше меня!'
        -   title: Ученики используют неправильные знаки для `!=` `<=` и `>=`
            example:
                error_text: Эти знаки, вероятно, новы для большинства учеников. Обязательно объясните их ученикам.
                error_code: |-
                    name = {ask} 'Как тебя зовут?'
                    {if} name =  'Hedy'
                        {print} 'Ты не Hedy'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    name = {ask} 'Как тебя зовут?'
                    {if} name != 'Hedy'
                        {print} 'Ты не Hedy'
        -   title: Ученики забывают использовать знак ==
            example:
                error_text: На этом уровне ученикам всё ещё разрешено использовать = или is. Но на других уровнях или в Python из-за этого могут возникнуть проблемы. Поэтому лучше приучать их использовать ==.
                error_code: |-
                    name = {ask} 'Как тебя зовут?'
                    {if} name = 'Hedy'
                        {print} 'Ты классный!'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    name = {ask} 'Как тебя зовут?'
                    {if} name == 'Hedy'
                        {print} 'Ты классный!'
        -   title: Ученики пробуют возможности, изученные на предыдущих уровнях, но не используют синтаксис Python.
            example:
                error_text: Например, ученики пробуют использовать повторение, функции или списки.
                error_code: |-
                    {define} pick_an_animal
                        animals = собака, кошка, хомяк
                        {repeat} 3 {times}
                        {print} animals {at} {random}

                    {call} pick_an_animal
                solution_text: Они научатся делать это на следующих уровнях.
                solution_code: |-
                    #Когда будешь готов, загляни на следующие уровни. Или сначала продолжи отрабатывать основы на этом уровне.
    -   level: '14'
        concepts_and_changes: |-
            Этот уровень посвящён работе со списками. Ученики также научатся использовать повторение по правилам Python.

            Новое на этом уровне:
            * Работа со списками
            * Сочетание списков с {for}, {if} и {random}
            * Повторение с помощью {for} i {range}(1,10)

        sections:
        -   title: Ученики забывают о скобках
            example:
                error_text: Начиная с этого уровня списки нужно заключать в квадратные скобки.
                error_code: |-
                    icecream = 'клубника', 'шоколад'
                    {print} 'Я люблю ' icecream[{random}] ' мороженое'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    icecream = ['клубника', 'шоколад']
                    {print} 'Я люблю ' icecream[{random}] ' мороженое'
        -   title: Ученики используют неправильные скобки
            example:
                error_text: Начиная с этого уровня списки нужно заключать в квадратные скобки.
                error_code: |-
                    icecream = ('клубника', 'шоколад')
                    {print} 'Я люблю ' icecream[{random}] ' мороженое'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    icecream = ['клубника', 'шоколад']
                    {print} ('Я люблю ' icecream[{random}] ' мороженое')
        -   title: Ученики забывают о кавычках, сосредоточившись на скобках
            example:
                error_text: Иногда ученики так сосредоточены на новой особенности синтаксиса, что забывают о кавычках.
                error_code: |-
                    icecream = [клубника, шоколад]
                    {print} 'Я люблю ' icecream[{random}] ' мороженое'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    icecream = ['клубника', 'шоколад']
                    {print}('Я люблю ' icecream[{random}] ' мороженое')
        -   title: Ученики всё ещё используют старую команду at random
            example:
                error_text: 'На этом уровне {random} изменился'
                error_code: |-
                    icecream = [клубника, шоколад]
                    {print} 'Я люблю ' icecream at random ' мороженое'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    icecream = ['клубника', 'шоколад']
                    {print} 'Я люблю ' icecream[{random}] ' мороженое'
    -   level: '15'
        concepts_and_changes: |-
            Этот уровень посвящён функциям. В Hedy Advanced ученики научились использовать простую функцию. На этом уровне они не только изучат синтаксис функций в Python, но и научатся использовать аргументы функций и {return} {value}.

            Новое на этом уровне:
            * Использование функций по правилам Python
            * Использование аргументов в функции
            * Использование {return} {value}
        sections:
        -   title: 'Ученики испытывают трудности с правильным синтаксисом и отступами в функции'
            example:
                error_text: Ученики испытывают трудности с правильным синтаксисом и отступами в функции
                error_code: |-
                    {def} greet_the_costumer(name
                    {print}('Привет, ', name, '!')

                    customer = 'Hedy
                    greet_the_costumer()customer
                solution_text: Внимательно проверьте синтаксис и отступы.
                solution_code: |-
                    {def} greet_the_costumer(name):
                        {print}('Привет, ', name, '!')

                    customer = 'Hedy'
                    greet_the_costumer(customer)
        -   title: Ученики забывают использовать {return} в функции
            example:
                error_text: Ученики забывают использовать return в функции
                error_code: |-
                    {def} get_a_room(number):
                        room_number = 1000 + number

                    favorite_number = 7
                    room_number = {return} get_a_room(favorite_number)
                    print('Номер твоей комнаты — ', room_number)
                solution_text: 'Это правильный код:'
                solution_code: |-
                    def get_a_room(number):
                        room_number = 1000 + number
                        return room_number

                    favorite_number = 7
                    room_number = get_a_room(favorite_number)
                    print('Номер твоей комнаты — ', room_number)
    -   level: '16'
        concepts_and_changes: |-
            На этом последнем уровне Hedy ученики научатся использовать цикл {while} и ещё потренируются с новым синтаксисом.
            После этого уровня ученики готовы продолжить программирование в «настоящих» компиляторах Python.

            Новое на этом уровне:
            * Цикл {while}
        sections:
        -   title: Ученики забывают об отступах в цикле while
            example:
                error_text: Отступы часто вызывают затруднения у учеников.
                error_code: |-
                    answer = 0
                    {while} answer != 25
                    answer = {ask} 'Сколько будет 5 умножить на 5?'
                    {print} 'Получен правильный ответ'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    answer = 0
                    {while} answer != 25
                        answer = {ask} 'Сколько будет 5 умножить на 5?'
                    {print} 'Получен правильный ответ'

        -   title: Ученики случайно создают бесконечный цикл
            example:
                error_text: Ученики создают цикл {while}, но не предусматривают способ его остановить.
                error_code: |-
                    alarm = on
                    {while} alarm = on
                        {play} C
                        {play} D
                solution_text: 'Это правильный код:'
                solution_code: |-
                    # Нажми красную кнопку 'Остановить программу', чтобы принудительно остановить программу
-   title: Как...
    key: manual
    subsections:
    -   title: Как создать класс
        text: |-
            Создайте класс, нажав <a href="https://hedy.org/for-teachers/class/new" target="_blank">Создать новый класс</a> на странице для учителей.
            Есть три варианта:
            * Создать стандартный класс. Все настройки будут стандартными, то есть ученикам будут доступны все уровни и приключения. Позже это всегда можно изменить.
            * Скопировать существующий класс. Создать новый класс с настройками и приключениями из существующего класса. Ученики при этом не переносятся.
            * Класс без приключений. Создать класс, в котором пока нет приключений.
    -   title: Как создать учётные записи учеников и добавить их в класс
        text: |-
            Перейдите на <a href="https://hedy.org/for-teachers/class/all" target="_blank">страницу классов</a> и нажмите на класс, в который хотите добавить учеников.
            Нажмите «Управление учениками». Если у учеников уже есть учётные записи, выберите «Пригласить по имени пользователя» и пригласите их в класс.
            Если учётных записей ещё нет, выберите «Создать учётные записи».
            Пароли для учеников можно сгенерировать автоматически или задать самостоятельно. После первого входа ученики смогут установить собственные пароли.
            Введите желаемые имена учётных записей или просто вставьте список из готовой электронной таблицы и нажмите «Создать учётные записи».
            Появится список паролей учеников. Вы можете распечатать его и раздать ученикам имена пользователей и пароли или скопировать список в буфер обмена и сохранить данные в другом месте.
    -   title: Как следить за успехами учеников с помощью графика успеваемости
        text: |-
            График успеваемости помогает понять, как идут дела у учеников в вашем классе. Он находится на странице класса.
            Выберите уровень, над которым сейчас работают ученики. Появится график, где каждый ученик обозначен точкой. По оси x показано, над сколькими приключениями они работали: чем правее точка, тем больше приключений.
            По оси y показано количество ошибок. Чем выше точка, тем больше программ с ошибками запустил ученик.
            Наведите указатель на точку, чтобы увидеть подробности: имя пользователя, количество приключений, ошибок и успешных запусков на этом уровне.
    -   title: Как проверять работы учеников
        text: |-
            Перейдите на страницу класса и откройте раздел «Проверка работ». Здесь вы найдёте таблицу со всеми программами, отправленными учениками.
            С помощью фильтров выберите уровень, ученика или приключение для проверки. Обратите внимание: чтобы применить фильтр, нужно нажать кнопку «Фильтровать».
            Готовы начать проверку? Нажмите на приключение в таблице, чтобы посмотреть работу ученика. Довольны работой? Поставьте галочку в столбце «Принято».
            У ученика тоже появится галочка в меню приключений, чтобы он знал, что работа принята.
            Хотите рассмотреть программу подробнее или запустить её? Нажмите «Посмотреть программу», и она откроется в новой вкладке.
            Если вас устраивает работа ученика, примите программу. Если нет, верните её ученику, нажав «Разрешить повторную отправку».
            Закончив проверку программы, нажмите «Следующее приключение», чтобы перейти к следующей программе в таблице.
    -   title: Как дать ученику обратную связь
        text: |-
            В Hedy можно принять отправленную учеником программу или вернуть её на доработку. Отправлять ученикам сообщения или отзывы нельзя.
            Для этого воспользуйтесь школьной системой связи или, конечно, дайте обратную связь устно!
    -   title: Как изменить доступные ученикам уровни
        text: |-
            Перейдите на страницу класса и нажмите «Настроить». В верхней части страницы находятся переключатели, с помощью которых можно открывать и закрывать уровни для учеников.
    -   title: Как изменить доступные ученикам приключения
        text: |-
            Перейдите на страницу класса и нажмите «Настроить». Найдите заголовок «Настройка уровней» и выберите уровень, который хотите настроить.
            Здесь вы увидите список приключений, доступных ученикам на этом уровне. Вы можете добавлять приключения (в том числе собственные!), убирать их из доступа учеников или менять порядок.
            Недовольны изменениями? Вы всегда можете нажать «Восстановить стандартные приключения», чтобы вернуться к исходным настройкам.
            Хотите увидеть, как изменения выглядят для учеников? Нажмите «Предпросмотр от лица ученика», чтобы увидеть уровень их глазами.
    -   title: Как добавить или удалить дополнительных учителей в классе
        text: |-
            Перейдите на страницу класса и нажмите «Настроить». В разделе «Дополнительные учителя» можно добавлять или удалять дополнительных учителей класса.
    -   title: Как архивировать или удалить класс
        text: |-
            Перейдите на страницу класса, прокрутите вниз до опасной зоны и архивируйте или удалите класс.
    -   title: Как подготовиться к уроку
        text: |-
            Перейдите на страницу «Для учителей» и нажмите «Учебные материалы». Найдите заголовок «Подготовка к уровню» и выберите уровень, который будете преподавать.
            Здесь вы найдёте обзор учебных целей уровня, ссылки на слайды и рабочие тетради, а также список распространённых ошибок на этом уровне.
    -   title: Как использовать слайды
        text: |-
            Перейдите на страницу «Для учителей» и нажмите «Учебные материалы». Здесь находятся слайды. Для каждого уровня Hedy мы подготовили слайды в помощь преподавателям. Они содержат объяснения к уровню и примеры кода Hedy, которые можно запускать прямо в слайдах. Вводные слайды дают общее представление о Hedy. Просто нажмите «Показать презентацию» и начните! Во время показа можно нажать 'S', чтобы открыть заметки докладчика. Они помогут провести урок и предложат советы по преподаванию.
    -   title: Как создать собственные приключения
        text: |-
            Перейдите на страницу «Для учителей» и нажмите «Приключения». Нажмите «Создать приключение», чтобы сделать собственное приключение.
    -   title: Как включить собственные приключения в классе
        text: |-
            Созданное приключение нужно включить, чтобы ученики могли его использовать. Перейдите в «Для учителей > Страница класса > Настроить > Настройка уровней», чтобы добавить приключение на нужный уровень для учеников.
    -   title: Как поделиться своим приключением с другими учителями
        text: |-
            Откройте приключение, которым хотите поделиться, перейдите в настройки и включите «Сделать общедоступным», чтобы другие учителя могли использовать ваше приключение.
    -   title: Как использовать приключение другого учителя
        text: |-
            Перейдите на страницу «Для учителей», нажмите «Приключения», затем «Обзор общедоступных приключений». Здесь находятся все общедоступные приключения. Хотите использовать одно из них со своими учениками?
            Нажмите «Клонировать», и копия приключения появится среди ваших собственных. Её можно использовать так же, как любое созданное вами приключение.
    -   title: Как пожертвовать деньги Hedy
        text: |-
            Нам пригодится ваша помощь, чтобы Hedy продолжал работать. Мы используем эти деньги для работы сервера, поддержки и улучшения сайта Hedy. Мы благодарны за любые пожертвования в пользу Hedy! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Нажмите здесь, чтобы пожертвовать в евро </a> или <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">нажмите здесь, чтобы пожертвовать в долларах США</a>. Спасибо!
    -   title: Как сообщить об ошибке или предложить идею команде Hedy
        text: |-
            Мы всегда рады предложениям и сообщениям об ошибках. Напишите нам на [hello@hedy.org](mailto:hello@hedy.org) или присоединяйтесь к нашему <a href="https://discord.gg/8yY7dEme9r" target="_blank">серверу Discord</a>.
    -   title: Как помочь с переводом Hedy
        text: |-
            Отличный способ помочь Hedy — <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">переводить ключевые слова, сообщения об ошибках, приключения и другой контент</a>.
    -   title: Как следить за новостями Hedy
        text: |-
            Следите за новостями Hedy, <a href="https://hedy.org/subscribe" target="_blank">подписавшись на нашу рассылку</a> или присоединившись к нашему <a href="https://discord.gg/8yY7dEme9r" target="_blank">серверу Discord</a>.
    -   title: Как связаться с другими учителями Hedy
        text: |-
            На нашем <a href="https://discord.gg/8yY7dEme9r" target="_blank">сервере Discord</a> много учителей, работающих с Hedy. Они готовы поделиться советами и приёмами преподавания и ответить на ваши вопросы.
