start-sections:
-   title: Начать с Hedy
    text: "Добро пожаловать в Hedy, мы рады помочь вам начать работу с Hedy.\n\nНаш [Учительский справочник](https://www.hedy.org/for-teachers/manual) содержит подробный обзор всех функций, а эта страница предлагает краткий обзор, чтобы вы знали, что к чему, прежде чем углубиться в изучение.\n\nНесколько важных моментов, которые стоит знать:\n* Hedy — это инструмент, созданный для управления классом детей, занимающихся программированием! Вы можете создавать свои собственные классы, планы уроков и следить за успехами детей. Вам не нужно знать много программирования, если вы только начинаете, Хеди работает шаг за шагом, так же как и для вас!\n* Вы можете использовать Hedy на своем родном языке, потому что он был переведен на многие другие языки!\n* Программировать может каждый ребёнок!! Hedy особенно полезна для детей с проблемами зрения, потому что Hedy может читать материалы вслух, без неободимости использовать мышь.\n* Мы готовы вам помочь, и вы можете найти нас, например, на [Discord](https://discord.gg/8yY7dEme9r) или написать нам на [email](hello@hedy.org)."
-   title: Учителя о Hedy
    text: |-
        Разные учителя по всему миру выразили свою страсть к Hedy, как некоторые из них поделились с нами:

        *Невероятно вдохновляюще! Отличный способ сделать программирование гораздо более доступным как для себя, так и для студентов. Очень весело играть и много потенциала для использования с учениками. Я думаю, что это очень хороший инструмент! Я считаю, что это ценный способ для детей начать изучать программирование. Программирование и Python всегда были очень увлекательными, потому что барьер для обучения очень высок. Теперь всё немного проще - Hedy показала, что на самом деле это может быть совсем не сложно. Мне понравилось видеть, как Hedy делает программирование максимально доступным для пользователей!*
        Нидерланды: Учителя математики на подготовке (secondary school)

        *Простой интерфейс и хорошие примеры.* Учитель: 3-6 классы (elementary)

        *Многоязычное программирование и сам концепт постепенного программирования.* США: средняя школа, 6-8 классы

        *Постепенное введение в программирование.* Австралия: старшая школа

        *Не хочется останавливаться.* Нидерланды: 2 HAVO-VWO

        *И то, что объяснение может быть на голландском языке (а код на английском), и то, что появляется все больше и больше возможностей.* Нидерланды: группа класса Plus

        *Но Hedy и его уровни... какая идея! Я хотел бы лично поблагодарить вас за создание этого, даже трудно выразить благодарность в полной мере. Я никогда не видел такого интереса и энтузиазма у своих студентов, как при работе с Hedy. Мы прошли до пятого уровня и планируем заниматься так еще одну неделю, прежде чем начать изучение Python.* Пакистан

        *«Реальность» программирования напоминает то, как это происходит на самом деле.* Нидерланды: Плюс-класс группы 4-8

        *Пошаговые действия. Весёлые занятия.* Нидерланды: Все уровни, 2e VWO/HAVO 2e VWO  , 3e HAVO 3e VWO

        *Мне очень нравится Hedy, и она также хорошо организована, так что её удобно использовать в начальной школе. Плавное сложение уровней в Hedy работает прекрасно. Лаконичное объяснение в начале каждого уровня и маленькие программы в качестве примера помогают детям быстро понять, что нового в выбранном уровне. Разнообразные заданий, которые дети могут выбирать - тоже хорошая идея. Дети сами выбирают задания, которые им интересны, и затем начинают с ними работать, проходя уровни. Hedy — это отличное развлечение для детей, которые хорошо разбираются в программировании и хотят попробовать себя в настоящем языке программирования. Это хорошая подготовка к средней школе, как только там начнут больше уделять внимания ИКТ-образованию. Нидерланды: Монтессори школа в Оегстгейсте

        *Отличная структура.* Нидерланды: Младшая средняя школа HAVO-VWO

        *Я могу удерживать темп занятия.* Нидерланды: группа 7 и 8

        ![Фелиен обучает детей](/images/teacherfeedback/Fkids1.JPG) *Фелиен обучает детей*        ![Дети узнают о Hedy](/images/teacherfeedback/Fkids2.JPG) *Дети узнают о Hedy*
teacher-guide:
-   title: Справочная информация
    key: интро
    subsections:
    -   title: Что такое Hedy?
        text: |-
            Hedy — это текстовый язык программирования, специально разработанный для детей и подростков. (10 to 15 years old).
            В отличие от языков программирования для детей, таких как Scratch, Hedy использует не блоки кода, а текстовый код.
            С Hedy вы научитесь писать код как настоящие программисты, но маленькими шагами с игровыми упражнениями.
            Таким образом, Hedy может служить трамплином к настоящим языкам программирования, таким как Python, в доступной и в основном увлекательной форме!
            Если вы хотите узнать больше, вы можете посмотреть это <a href="https://www.youtube.com/watch?v=EdqT313rM40&amp;t=2s" target="_blank">видео</a> о развитии Hedy как языка программирования.
    -   title: Целевая аудитория
        text: |-
            Hedy разработана для учащихся средних и младших классов (10 - 15 лет), но может использоваться всеми, кто хочет научиться программировать!
            Важно, чтобы ученики умели хорошо читать. Мы не рекомендуем начинать работу с Hedy, пока ученики не достигнут уровня чтения хотя бы 3-го класса.
            Ученикам (и учителям!) не нужен опыт программирования перед началом работы с Hedy.
    -   title: Как работает Hedy?
        text: |-
            Hedy разделена на уровни, в которых изучаются новые команды и концепции программирования. Каждый уровень содержит множество приключений для отработки только что выученных команд.
            Hedy делится на три раздела: Basic, Advanced и Expert. В Hedy Basic (уровни 1–8) можно освоить увлекательные и простые концепции программирования, такие как вывод текста, запрос ввода, использование простых переменных и повторение. В Hedy Advanced (уровни 9–12) ученики продвинутся немного дальше и научатся справляться с более сложными идеями, такими как циклы, вложенность и функции. Hedy Expert (уровни 13–16) создан для плавного перехода к полному синтаксису Python.
            Так что какие бы цели вы ни ставили для своих учеников, Hedy подходит для их достижения. Будь то просто знакомство с радостью программирования, изучение базовых концепций или подготовка к синтаксису Python в реальной жизни.

            Вы, как учитель, можете не только решать, какие уровни будут доступны вашим ученикам, но и выбирать, какие приключения будут доступны на каждом уровне. Будут ли они делать ресторан, калькулятор или дом с привидениями? Внутри каждого уровня приключения расположены от самого простого к самому сложному, но вы можете комбинировать их любым способом, который лучше всего подходит вашим ученикам.
            Приключения могут выполняться учениками индивидуально, но мы рекомендуем использовать их в рамках классического обучения.

            Приключения также включают пример кода и решения, чтобы менее осведомлённые в цифровых технологиях учителя тоже могли использовать Hedy!
            Конечно же, Hedy также предназначена для творческих учителей, которые любят создавать свои собственные планы уроков и приключения!

            Вы можете отслеживать работу учеников и их прогресс на странице класса.
    -   title: Устройства
        text: |-
            Hedy работает через Интернет, что означает, что она работает на любом устройстве с браузером (Google Chrome, Firefox, Edge и т.д.), поэтому ноутбуки, хромбуки, планшеты и даже смартфоны подходят для использования Hedy.
            Перед работой с Hedy не нужно ничего скачивать, просто зайдите на сайт, и всё готово!
            Также доступна <a href="https://github.com/hedyorg/hedy/wiki/Offline-Hedy" target="_blank">офлайн-версия</a> Hedy.
    -   title: Сообщество Hedy
        text: |-
            Приглашаем всех учителей, программистов и других поклонников Hedy присоединиться к нашему <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord-серверу</a>. Это идеальное место для общения о Hedy: у нас есть каналы, где вы можете показать свои классные проекты и уроки, каналы для сообщения об ошибках и каналы для общения с другими учителями и командой Hedy.
            <a href="https://www.youtube.com/watch?v=Lyz_Lnd-_aI" target="_blank">Здесь</a> вы можете найти видео о том, как присоединиться к сообществу Discord.

            Вы также можете следить за новостями Hedy, <a href="https://hedy.org/subscribe" target="_blank">подписавшись на нашу рассылку</a>. Или следите за нами в <a href="https://nl.linkedin.com/company/hedyorg" target="_blank">LinkedIn</a>.
    -   title: Hedy и GDPR
        text: |-
            Организации в ЕС должны соблюдать GDPR (Общий регламент по защите данных) при обработке персональных данных.
            Поскольку этот вопрос является сложным для многих школ, вы можете использовать все функциональные возможности программирования Hedy без предоставления персональных данных.
            Самый простой способ сделать это — использовать Hedy без создания учётных записей для учителя и учеников. Без учётных записей Hedy доступна, но без учительской части. Вы не сможете отслеживать прогресс учеников или решать, какие приключения и уровни доступны для них. Это ограничение, но есть школы, которые используют Hedy именно таким образом.

            Второй способ — создание учителем учётной записи с адресом электронной почты без персональных данных, например «docent25@email.com». Помимо адреса электронной почты, который требуется только для сброса пароля, при создании учётной записи учителя вам не нужно сообщать никакой информации.
            С помощью учётной записи учителя вы можете создавать анонимные учётные записи для учеников, например rainbow-student1, rainbow-student2 и т. д. (подробное руководство см. в разделе «Подготовка к обучению»). Таким образом, вы сможете пользоваться всеми функциями Hedy, включая сохранение прогресса, не сообщая личных данных о себе и своих учениках.

            Если вышеуказанного недостаточно для вашего контекста, мы можем подписать соглашение об обработке ваших персональных данных.
    -   title: Пожертвовать Hedy
        text: Нам пригодится ваша помощь, чтобы Hedy продолжала работать. Мы используем эти деньги, чтобы поддерживать работу сервера, обслуживать и улучшать сайт Hedy. Мы благодарны за любые пожертвования в пользу Hedy! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Нажмите здесь, чтобы пожертвовать в евро</a>, или <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">нажмите здесь, чтобы пожертвовать в долларах США</a>. Спасибо!
-   title: Распространенные ошибки
    key: common_mistakes
    intro: Вы можете учиться на своих ошибках, особенно в программировании! Ошибки неизбежны, и это прекрасная возможность научиться, но для учителя , найти правильное исправление ошибки может быть непросто! Тем более, что программы становятся все длиннее и длиннее по мере того, как ученики продвигаются по уровням. Поэтому мы составили список часто допускаемых ошибок в каждом уровень , и их решения.
    levels:
    -   level: "1"
        sections:
        -   title: Студенты забывают печатать команды
            example:
                error_text: Например, они печатают предложение, не используя печатать.
                error_code: Hedy не может напечатать это
                solution_text: Научите своих учеников всегда начинать строку кода с команды.
                solution_code: '{print} Hedy может это напечатать!'
        -   title: Студенты используют заглавные буквы при наборе команд
            example:
                error_text: Команды не будут работать, если они написаны заглавными буквами.
                error_code: |-
                    Спросите, почему мой код не работает? 
                    Печатать Потому что я использую заглавные буквы.
                solution_text: Уберите заглавные буквы.
                solution_code: |-
                    {вопрос} Почему мой код теперь работает? 
                    {печатать} Потому что я удалил заглавные буквы!
        -   title: 'Черепаха: Учащиеся позволяют черепахе уйти за пределы экрана'
            example:
                error_text: Часто учащиеся любят пробовать большие числа, используя черепаху, из-за которой стрелка ускользает за пределы экрана.
                error_code: |-
                    {вперед} 300 
                    {поворот} 90
                solution_text: В этом примере ученики часто думают, что команда поворота не сработала, хотя на самом деле она выполнила то, что должна была. Что произошло, так это то, что черепаха вышла за пределы экрана. Используйте меньшие числа, чтобы это избежать.
                solution_code: |-
                    {вперед} 100 
                    {поворот} 90
        -   title: 'Черепаха: Учащиеся используют команду задом наперед, но такой команды нет.'
            example:
                error_text: Назад - это не команда.
                error_code: назад 100
                solution_text: 'Чтобы заставить черепаху двигаться назад, вы используете команду вперед и отрицательное число. Например:'
                solution_code: вперед -100
        -   title: 'Черепашка: ученики используют команду backward, но такой команды нет.'
            example:
                error_text: Backward не является командой.
                error_code: backward 100
                solution_text: 'Чтобы заставить черепашку двигаться назад, используйте команду forward с отрицательным числом. Например:'
                solution_code: '{forward} -100'
        concepts_and_changes: |-
            На уровне 1 ученики пишут и запускают свои самые первые строки кода. Пока не нужно
            заботиться о знаках препинания: каждая строка начинается с команды, а остальная
            часть строки — обычный текст. Урок на самом деле об одной идее: компьютер делает именно
            то, что вы ему говорите, не больше и не меньше.

            Новое на этом уровне:

            * Показ текста на экране с помощью `{print}`
            * Запрос вопроса с помощью `{ask}` и использование ответа с помощью `{answer}`
            * Рисование черепашкой с помощью `{forward}` и `{turn}`
            * Воспроизведение музыкальной ноты с помощью `{play}`
    -   level: "2"
        sections:
        -   title: Студенты допускают опечатки в своих командах
            example:
                error_text: Хеди не может распознать команду с опечаткой.
                error_code: наппечатать Не делайте опечаток
                solution_text: Научите своих учеников читать сообщения об ошибках. Таким образом, они смогут сами узнать, что пошло не так.
                solution_code: напечатать Не делайте опечаток
        -   title: Учащиеся забывают, что команда вопрос изменилась
            example:
                error_text: В этом уровень студенты узнают о переменных. Для команды вопрос также требуется переменная, но студенты об этом забывают.
                error_code: спросить что бы вы хотели съесть
                solution_text: В этом уровень вы должны сказать Hedy, где сохранить свой ответ, чтобы его можно было использовать позже. Это называется переменной.
                solution_code: заказать {это} {вопрос} Что бы ты хотел съесть
        -   title: Ученики пытаются использовать `{answer}` для нескольких вопросов
            example:
                error_text: Переменная `{answer}` по-прежнему работает, но хранит только один ответ за раз. Иногда ученики пытаются сохранить несколько ответов в одной переменной.
                error_code: |-
                    answer {is} {ask} What is your name?
                    answer {is} {ask} How old are you?
                    {print} Hi {answer}.
                    {print} You are {answer} years old.
                solution_text: Объясните ученикам важность точного именования переменных.
                solution_code: |-
                    name {is} {ask} What is your name?
                    age {is} {ask} How old are you?
                    {print} Hi {name}.
                    {print} You are {age} years old.
        -   title: Учащиеся используют имя переменной или обычное слово
            example:
                error_text: В приведенном ниже примере слово 'имя' iиспользуется как переменная, а также как обычный текст. Результатом выполнения этого кода будет 'Привет, моя Hedy — это Hedy'.
                error_code: |-
                    имя {это} Hedy
                    {печатать} Привет, меня зовут имя
                solution_text: Поэтому не используйте в качестве имени переменной слово, которое хотите использовать в тексте. В уровень 4 это решается кавычками.
                solution_code: |-
                    имя Хеди
                    напечатать Привет я имя
        -   title: Учащиеся используют длинные имена переменных, содержащие два слова.
            example:
                error_text: Переменную следует называть одним словом. Вы можете использовать подчеркивание, чтобы соединить два слова. Это считается за единицу.
                error_code: выбранная дверь - спросить, какую дверь ты выбираешь
                solution_text: Добавьте знак подчеркивания.
                solution_code: выбранная_дверь {это} {вопрос}, какую дверь ты выбираешь
        -   title: Учащиеся могут использовать два разных имени для одной и той же переменной
            example:
                error_text: В этом примере ученик использовал слова 'лошадь' и 'имя' для одних и тех же переменных.
                error_code: |-
                    лошадь {это} {вопрос} Как зовут твою лошадь 
                    {печатать} Вашу лошадь зовут по имени
                solution_text: Всегда проверяйте, имеет ли переменная одно и то же имя во всем коде. Небольшие различия может быть трудно обнаружить (например, множественное число), но они будут мешать коду.
                solution_code: |-
                    имя {это} {вопрос} Как зовут твою лошадь 
                    {печатать} Вашу лошадь зовут имя
        concepts_and_changes: |-
            На уровне 1 ученики научились использовать переменную `{answer}`. На этом уровне они научатся использовать несколько переменных.
            Это первая абстрактная концепция программирования, с которой они столкнутся: имя, обозначающее значение, которое может меняться.
            Поскольку ученики могут использовать несколько переменных, им нужно научиться их определять.
            Это означает, что команда `{ask}` изменилась и должна предваряться переменной, в которую нужно сохранить ответ.

            Новое на этом уровне:

            * Сохранение значения в переменной с помощью `{is}`
            * Сохранение ответа на вопрос в переменной по вашему выбору: `{is}` `{ask}` What is your name?
            * Приостановка программы с помощью `{sleep}`
            * Поворот черепашки на заданное число градусов: `{turn}` 90
    -   level: "3"
        sections:
        -   title: Студенты пытаются распечатать целые списки
            example:
                error_text: Список невозможно печатать. Вы можете печатать только один элемент из списка с помощью {в} {случайный}.
                error_code: |-
                    продукты яблоки, молоко, шоколад
                    напечатать продукты
                solution_text: Чтобы печатать список всех продуктов, вам просто нужно поместить их после команды `{печатать}`. В противном случае вы можете использовать список для печати одного элемента с помощью `{в}` `{случайный}`.
                solution_code: |-
                    {печатать} яблоки, молоко, шоколад 

                    # или 

                    бакалея {это} яблоки, молоко, шоколад 
                    {печатать} продукты {в} {случайный}
        -   title: Учащиеся используют имя переменной или списка как обычный текст
            example:
                error_text: Вероятно, эта проблема возникла в уровень 2 тоже. Теперь это может случиться и со списками.
                error_code: |-
                    имя {это} Hedy
                    {печатать} Привет, я имя

                    # или 

                    животное {это} носорог, пчела, лебедь 
                    {печатать} Лучшее животное - это... животное {в} {случайный}
                solution_text: Не используйте имена переменных или списков в обычном тексте для печати. В уровень 4 эта проблема решена кавычками.
                solution_code: |-
                    имя {это} Hedy
                    {печатать} Привет, я имя

                    # или 

                    животные {это} носорог, пчела, лебедь 
                    {печатать} Лучшее животное - это... животные {в} {случайный}
        -   title: Студенты забывают `{at}` в `{at}` `{random}`
            example:
                error_text: Как в примере
                error_code: |-
                    птицы {это} воробей, чайка, малиновка 
                    {печатать} птицы случайный
                solution_text: Эта проблема решается добавлением слова в.
                solution_code: |-
                    птицы {это} воробей, чайка, малиновка 
                    {печатать} птицы {в} {случайный}
        -   title: Учащиеся забывают использовать команду `{печатать}`, когда также используют команду `{в}` `{случайный}`
            example:
                error_text: Или они иногда помещают `{в}` `{случайный}` в начале строки.
                error_code: |-
                    фрукт {это} яблоко, вишня, банан 
                    фрукты {в} {случайный}
                solution_text: Подчеркните своим ученикам, что для печати текста вам всегда нужно печатать.
                solution_code: |-
                    фрукт {это} яблоко, вишня, банан 
                    {печатать} фрукты {в} {случайный}
        -   title: Студенты забывают использовать запятые в своих списках
            example:
                error_text: В списке элементы разделяются запятой.
                error_code: |-
                    пицца {это} грибы тунец четыре сезона 
                    {печатать} пицца {в} {случайный}
                solution_text: После каждого пункта в вашем списке должна стоять запятая
                solution_code: |-
                    пицца {это} грибы, тунец, четыре сезона 
                    {печатать} пицца {в} {случайный}
        -   title: Учащиеся пытаются использовать `{в}` `{случайный}` без списка
            example:
                error_text: Например
                error_code: |-
                    клубы {это} Манчестер Юнайтед 
                    {печатать} клубы {в} {случайный}
                solution_text: Hedy не может напечатать что-либо в случайном порядке, потому что нет списка, из которого можно было бы выбрать.
                solution_code: |-
                    клубы {в} Манчестер Юнайтед, ФК Бавария Мюнхен, ФК Барселона 
                    {печатать} клубы {в} {случайный}
        -   title: Учащиеся пытаются использовать функцию добавить/удалить без списка
            example:
                error_text: В приведенном ниже примере «имена» — это не список, а переменная. Вы не можете ничего к нему добавить.
                error_code: |-
                    имена {это} Петя
                    твоё_имя {это} {вопрос} Кто ты? 
                    {добавить} твоё_имя {к} имена
                    {печатать} имена {в} {случайный}
                solution_text: Сначала должен быть список, поэтому нужно добавить второе имя, чтобы превратить имена в список, например, Эми. Если вы не хотите, чтобы Эми была в списке, вы можете использовать убрать, чтобы удалить ее после.
                solution_code: |-
                    имена {это} Петя, Аня
                    твоё_имя {это} {вопрос} Кто ты? 
                    {добавить} твоё_имя {к} имена
                    {печатать} имена {в} {случайный}
        -   title: Учащиеся забывают использовать `{к}`/`{из}` в `{добавить}`/`{удалить}`
            example:
                error_text: Без команды добавить/удалить работать не будет.
                error_code: |-
                    приключения {это} история, попугай, игральные кости 
                    выбор {это} Какое приключение вам нравится больше всего? 
                    {добавить} выбор 
                    {удалить} кубик 
                    {печатать} Я люблю приключения {в} {случайный}
                solution_text: Hedy должна знать, в какой список следует добавить/удалить элемент.
                solution_code: |-
                    приключения {это} история, попугай, игральные кости 
                    выбор {это} Какое приключение вам нравится больше всего? 
                    {добавить} выбор приключений {в_список} 
                    {удалить} кости {из} приключений 
                    {печатать} Я люблю приключения {в} {случайный}
        concepts_and_changes: |-
            Уровень 3 добавляет списки и случайность. Это первый уровень, на котором запуск одной и той же
            программы дважды может дать разный результат, что удивляет учеников, которые считают,
            что программа — это фиксированный рецепт. Это хороший момент, чтобы предложить им запустить код несколько
            раз, прежде чем решать, работает ли он.

            Новое на этом уровне:

            * Создание списка с помощью `{is}` и выбор из него с помощью `{at} {random}`
            * Добавление элемента в список с помощью `{add} {to}`
            * Удаление элемента из списка с помощью `{remove} {from}`
    -   level: "4"
        sections:
        -   title: Учащиеся забывают использовать кавычки с обеих сторон текста
            example:
                error_text: В этом уровень распечатай и спроси нужен набор кавычек. Один до текста и один после.
                error_code: |-
                    {печать} Здравствуйте 
                    настроение {это} {вопрос} 'Как дела?
                solution_text: Добавьте правильные кавычки.
                solution_code: |-
                    {печать} 'Привет' 
                    настроение {это} {вопрос} 'Как дела?'
        -   title: Студенты используют неправильные кавычки
            example:
                error_text: Важно начать урок с проверки того, умеют ли учащиеся правильно печатать кавычки. В Hedy учащиеся могут использовать одинарные (") и двойные кавычки (""). С другой стороны, обратные кавычки не считаются действительными кавычками (``).
                error_code: |-
                    {print} `Welcome to the restaurant`
                    food {is} {ask} ,What would you like to order?,
                solution_text: "Это правильные кавычки:"
                solution_code: |-
                    {печатать} 'Добро пожаловать в ресторан'
                    еда {это} {вопрос} 'Что бы вы хотели заказать?'
        -   title: Ученики используют апостроф в своём тексте и используют одинарные кавычки
            example:
                error_text: Апострофы можно использовать только внутри двойных кавычек. Они часто используются в английском языке при наборе сокращений, таких как you're, don't или what's.
                error_code: "{print} 'You're getting an error'"
                solution_text: Чтобы решить проблему, используйте двойные кавычки.
                solution_code: |-
                    {print} "You're not getting an error now!"
        concepts_and_changes: |-
            На уровне 4 ученики впервые знакомятся с важностью синтаксиса в программировании. На этом уровне вводятся кавычки вокруг текста в `{print}` и `{ask}`. Это, возможно, не самый увлекательный уровень, но очень важный навык, который нужно освоить, прежде чем переходить к следующим уровням. Ученикам этот уровень может показаться сложным, особенно когда в тексте появляются переменные. Мы рекомендуем давать чёткие объяснения и практиковаться вместе с учениками.

            Новое на этом уровне:

            * Использование кавычек вокруг всех типов строкового текста после `{print}` и `{ask}`
            * Оставление переменных вне кавычек
            * Использование двойных кавычек при использовании апострофов в строке
            * Очистка экрана с помощью `{clear}`
            * Использование цветов в рисующей черепашке с помощью `{color}`
    -   level: "5"
        sections:
        -   title: Учащиеся забывают использовать `{печатать}` в команде `{если}`
            example:
                error_text: После того, как учащиеся используют `{если}` или `{иначе}`, они забывают использовать вторую команду, например `{печатать}` или `{вопрос}`.
                error_code: |-
                    {если} зовут {это} Hedy 'Отличный!' 
                    {иначе} Hedy {это} лучший!
                solution_text: Добавьте команда печати чтобы это исправить.
                solution_code: |-
                    {если} name {это} Hedy {печатать} 'Отличный!' 
                    {иначе} {печатать} 'Hedy лучший!'
        -   title: Учащиеся могут использовать два разных имени для одной и той же переменной
            example:
                error_text: В этом примере студент использовал слова 'лошадь' и 'имя' для одних и тех же переменных.
                error_code: |-
                    лошадь {это} {вопрос} 'Как зовут твою лошадь?' 
                    {если} имя {это} Огонёк {печатать} 'круто' 
                    {иначе} {печатать} 'менее круто!'
                solution_text: Всегда проверяйте, имеет ли переменная одно и то же имя во всем коде. Небольшие различия может быть трудно обнаружить (например, множественное число), но они будут мешать коду.
                solution_code: |-
                    лошадь {это} {вопрос} 'Как зовут твою лошадь?' 
                    {если} имя {это} Огонёк {печатать} 'круто' 
                    {иначе} {печатать} 'менее круто!'
        -   title: Ученики все еще забывают кавычки с обеих сторон
            example:
                error_text: Использование команды `{if}` может сделать строки кода очень длинными, и учащиеся склонны забывать использовать кавычки.
                error_code: |-
                    {если} имя {это} Hedy {печатать} здорово
                    {иначе} {печатать} ага!
                solution_text: Всегда используйте две кавычки в команда печати.
                solution_code: |-
                    {если} имя {это} Hedy {печатать} 'здорово'
                    {иначе} {печатать} 'ага!'
        -   title: Студенты используют кавычки вокруг имен переменных
            example:
                error_text: В этом уровень имена переменных не заключаются в кавычки.
                error_code: |-
                    {если}  имя  {это} 'Hedy' {печатать} 'здорово'
                    {иначе} {печатать} 'ага!'
                solution_text: Удалите кавычки, чтобы код заработал.
                solution_code: |-
                    {если} имя {это} Hedy {печатать} здорово
                    {иначе} {печатать} ага!
        -   title: Учащиеся используют длинные имена переменных, содержащие два или более слов
            example:
                error_text: Переменные в Hedy не могут содержать пробелы, поэтому, чтобы использовать вместе несколько слов, учащимся необходимо соединить их с помощью подчеркивания (_)
                error_code: chosen door {is} {ask}  'Which door do you pick?'
                solution_text: Добавьте знак подчеркивания.
                solution_code: chosen_door {is} {ask} 'Which door do you pick?'
        -   title: Студенты хотят, чтобы несколько ответов были правильными
            example:
                error_text: Например, этот ученик хочет, чтобы Hedy сказала всем его друзьям, что они смешные, а другим одноклассникам нужно сказать, что они не смешные.
                error_code: "{если} имя {это} Джесси, Дэвид, Соуф {печатать} 'Ты смешной' {иначе} {печатать} 'Ты не смешной'"
                solution_text: |-
                    Для этого можно использовать команду `{в}`. Хотя она описана на более высоком уровне , она уже работает на уровне 5.
                    Другое решение — использовать несколько команд `{если}` и не использовать команду `{иначе}`. Недостаток в том, что одноклассники не поймут, что они не смешные.
                solution_code: |-
                    друзья {это} Джесси, Дэвид, Соф
                    имя {это} {вопрос} 'Кто ты?'
                    {если} назовите {в} друзей {печатать} 'Ты смешной'
                    {иначе} {печатать} 'Ты не смешной'

                    # или

                    name {это} {ask} 'Кто ты?'
                    {если} имя {это} Джесси {печатать} 'Ты смешной'
                    {если} имя {это} Дэвид {печатать} 'Ты смешной'
                    {если} имя {это} Суф {печатать} 'Ты смешной'
        -   title: Учащиеся задают имя переменной, совпадающее со значением в операторе `{если}`
            example:
                error_text: В приведенном ниже примере пароль - 'пароль'. В результате всегда будет правильным.
                error_code: |-
                    пароль {это} {вопрос} 'Какой пароль?'
                    {если} пароль {это} пароль {печатать} 'Доступ предоставлен'
                    {иначе} {печатать}'Доступ запрещен!'
                solution_text: Выберите другое имя для вашей переменной.
                solution_code: |-
                    секретный_пароль {is} {ask} 'Какой пароль?'
                    {if} секретный_пароль {is} пароль{print} 'Доступ предоставлен!'
                    {else} {print} 'Доступ запрещен!'
        concepts_and_changes: |-
            На этом уровне вводятся `{if}` и `{else}`.

            Новое на этом уровне:
            * Сделать выбор с помощью `{if}` и `{else}`
    -   level: "6"
        sections:
        -   title: Ученики используют 1 строку для оператора {if}
            example:
                error_text: Иногда ученики пытаются поместить всё в одну строку. Это больше не разрешено.
                error_code: "animal {is} {ask} 'What is your favorite animal?'\n{if} animal {is} dog {print} 'I love dogs too!'\n{elif} animal {is} cat {print} 'Cats are okay'\n{else} {print} 'Cool animal'"
                solution_text: 'Начиная с этого уровня, нужно не только размещать {if} и {else} на отдельных строках. Также нужно разделять условие и команду на отдельные строки. Вот так: '
                solution_code: |-
                    animal {is} {ask} 'What is your favorite animal?'
                    {if} animal {is} dog
                        {print} 'I love dogs too!'
                    {elif} animal {is} cat
                        {print} 'Cats are okay'
                    {else}
                        {print} 'Cool animal'
        -   title: Ученики используют `{elif}` как `{else}`, то есть без условия
            example:
                error_text: 'Ученики забывают, что нужно условие'
                error_code: |-
                    color {is} {ask} 'What is your favorite color?
                    {if} color {is} green
                        {print} 'I love green too!'
                    {elif}
                        {print} 'I like green'
                solution_text: Добавьте условие
                solution_code: |-
                    color {is} {ask} 'What is your favorite color?'
                    {if} color {is} green
                        {print} 'I love green too!'
                    {elif} color {is} blue
                        {print} 'Blue is okay'
                    {else}
                        {print} 'I like green'
        -   title: Ученики используют {in} без списка
            example:
                error_text: Ученики забывают, что нужен список
                error_code: |-
                    {if} chosen_color {in} pretty_colors
                        {print} 'Great choice!'
                solution_text: Добавьте список
                solution_code: |-
                    pretty_colors {is} blue, green, purple
                    {if} chosen_color {in} pretty_colors
                        {print} 'Great choice!'
        concepts_and_changes: |-
            Этот уровень опирается на новые команды `{if}` и `{else}` из предыдущего уровня. С помощью `{if}` и `{else}` вы добавляете в код два варианта выбора. На этом уровне ученики учатся добавлять больше вариантов с помощью `{elif}`. Важно, чтобы ученики научились размещать `{if}`, `{elif}` и `{else}` на отдельных строках. Кроме того, ученики учатся использовать `{in}`, чтобы проверить, есть ли ответ в списке.

            Новое на этом уровне:

            * Добавление нескольких вариантов выбора с помощью `{elif}`
            * Проверка, есть ли что-то в списке, с помощью `{in}`
    -   level: "7"
        sections:
        -   title: Ученики испытывают трудности с кавычками
            example:
                error_text: Некоторые ученики затрудняются с добавлением или недобавлением кавычек. Если вы добавите кавычки, на экране вывода буквально отобразится '5+5'.
                error_code: |-
                    {print} '5 + 5'
                solution_text: "В этом коде на экране вывода будет напечатано '10'."
                solution_code: |-
                    {print} 5 + 5
        -   title: Ученики испытывают трудности с концепцией математических вычислений с переменной
            example:
                error_text: 'Некоторым ученикам будет трудно выполнять математические действия с переменными. Попробуйте показать им очень простые примеры, например:'
                error_code: |-
                    age = {ask} 'How old are you?'
                    {print} 'Next year you will be ' age + 1
                solution_text: Или сделайте шаг дальше вот так.
                solution_code: |-
                    price = 0
                    {print} 'Welcome to our burger restaurant'
                    burger = {ask} 'Would you like a burger?'
                    {if} burger = yes
                        price = price + 10
                    drink = {ask} 'Would you like a drink?'
                    {if} drink = yes
                        price = price + 4
                    {print} 'That will be ' price ' euros please'
        -   title: Ученики забывают символ =
            example:
                error_text: Забывание использовать = вместо {is} всегда будет разрешено в Hedy, так что это не проблема. Если ваша цель — подготовить учеников к работе с настоящим Python или другими языками программирования, рекомендуется научить их использовать =. Если ваша цель — просто дать ученикам попробовать программирование, не беспокойтесь о том, используют ли они = или {is}.
                error_code: "name {is} Hedy"
                solution_text: символ =
                solution_code: "name = Hedy"
        -   title: Ученики используют запятую вместо точки в десятичных числах
            example:
                error_text: В некоторых языках принято использовать запятую для десятичных чисел. В языках программирования используется точка, поэтому и в Hedy тоже.
                error_code: '{print} 2,5 + 2,5'
                solution_text: Используйте точки в десятичных числах
                solution_code: '{print} 2.5 + 2.5'
        concepts_and_changes: |-
            На этом уровне ученики учатся включать математику в свои программы. С этого момента они смогут вычислять с переменными и десятичными дробями.

            Новое на этом уровне:
            * Использование математических символов: + - * и /
            * Использование десятичных дробей с точкой
            * Использование переменных в математике
            * Использование символа = вместо `{is}`
    -   level: "8"
        sections:
        -   title: Ученики забывают одно из слов команды repeat или забывают команду print
            example:
                error_text: Убедитесь, что ученики умеют использовать как полную команду repeat, так и команду print.
                error_code: |-
                    {repeat} 3 {times}  "For he's a jolly good fellow"
                    {repeat} 3 {print} 'Which nobody can deny!'
                solution_text: "Это правильный код:"
                solution_code: |-
                    {repeat} 3 {times} {print} "For he's a jolly good fellow"
                    {repeat} 3 {times} {print} 'Which nobody can deny!'
        -   title: Ученики пытаются повторить несколько строк
            example:
                error_text: На этом уровне можно повторять только одну строку кода несколько раз. В этом коде ученик хотел вывести 3 разных напитка, но это не сработает. Программа задаст вопрос 3 раза и выведет только последний ответ.
                error_code: |-
                    {repeat} 3 {times} drink = {ask} 'What would you like to drink?'
                    {print} drink
                solution_text: |-
                    Чтобы иметь возможность повторять несколько строк, нужно перейти на следующий уровень. Поэтому на этом уровне придётся выводить всё отдельно.
                solution_code: |-
                    drink = {ask} 'What would you like to drink?'
                    {print} drink
                    drink = {ask} 'What would you like to drink?'
                    {print} drink
                    drink = {ask} 'What would you like to drink?'
                    {print} drink
        -   title: Ученики создают программы, выполнение которых занимает слишком много времени
            example:
                error_text: |-
                    На этом уровне очень легко создать программы, выполнение которых занимает много времени. Если программа выполняется слишком долго, она останавливается, чтобы не перегружать компьютер ученика.
                error_code: |-
                    {repeat} 100 {times} {print} 'How many times can I repeat this?'
                solution_text: 'Убедитесь, что выполнение кода не занимает слишком много времени'
                solution_code: |-
                    {repeat} 20 {times} {print} 'This is enough'
        concepts_and_changes: |-
            На этом последнем уровне Hedy Basic ваши ученики научатся использовать повторение в своих программах! Они смогут повторять только одну строку несколько раз. Повторение нескольких строк будет изучено на следующих уровнях.

            Новое на этом уровне:
            * Повторение строки с помощью `{repeat} 3 {times}`
            * Повторение строки «переменное» количество раз
    -   level: "9"
        sections:
        -   title: Ученики допускают ошибки с отступами
            example:
                error_text: Отступы — новая концепция на этом уровне, и некоторым ученикам может быть сложно её освоить. Убедитесь, что они попрактиковались на нескольких простых примерах, прежде чем создавать целую программу с отступами.
                error_code: |-
                    {repeat} 3 {times}
                    {print} 'hello'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    {repeat} 3 {times}
                        {print} 'hello'
        -   title: Ученики повторяют только 1 строку, когда хотели повторить несколько строк
            example:
                error_text: Например, в приведённом ниже коде ученик хотел принять заказ на напитки для трёх человек. Но вместо этого программа сделала три запроса, но записала только один заказ.
                error_code: |-
                    {repeat} 3 {times}
                        drink = {ask} 'What would you like to drink?'
                    {print} drink
                solution_text: |-
                    В правильном коде третья строка тоже начинается с отступа. Таким образом, она относится к блоку repeat и поэтому будет повторена 3 раза.
                    Демонстрация этих различий может помочь вашим ученикам понять, почему нам нужны отступы, чтобы наши программы работали.
                solution_code: |-
                    {repeat} 3 {times}
                        drink = {ask} 'What would you like to drink?'
                        {print} drink
        -   title: Ученики хотят вкладывать операторы `{if}` или помещать операторы `{if}` внутрь цикла
            example:
                error_text: |-
                    На этом уровне ученикам пока не разрешается помещать операторы `{if}` внутрь других операторов `{if}` или внутрь циклов repeat.
                    На следующем уровне это разрешено.
                error_code: |-
                    birthday = {ask} 'Is it you birthday?'
                    {if} birthday = yes
                        {repeat} 3 {times}
                            {print} 'Hip Hip Hooray!'
                solution_text: 'Это правильный код для этого уровня:'
                solution_code: |-
                    birthday = {ask} 'Is it you birthday?'
                    {if} birthday = yes
                        {print} 'Hip Hip Hooray!'
                        {print} 'Hip Hip Hooray!'
                        {print} 'Hip Hip Hooray!'
        -   title: Ученики создают программы, выполнение которых занимает слишком много времени
            example:
                error_text: На этом уровне очень легко создать программы, выполнение которых занимает много времени. Если программа выполняется слишком долго, она останавливается, чтобы не перегружать компьютер ученика.
                error_code: |-
                    {repeat} 100 {times}
                        {print} 'How many times can I repeat this?'
                solution_text: Убедитесь, что выполнение кода не занимает слишком много времени
                solution_code: |-
                    {repeat} 20 {times}
                        {print} 'This is enough'
        concepts_and_changes: |-
            На этом первом уровне Hedy Advanced ученики учатся использовать отступы. Это позволяет им использовать несколько строк в операторе if или повторять несколько строк. Ученикам этот уровень часто очень нравится, потому что он позволяет создавать более сложные программы.
            С другой стороны, некоторым ученикам будет трудно понять, когда использовать отступы и как это делать.

            Новое на этом уровне:
            * Несколько строк после `{if}`, `{elif}` или `{else}` с использованием отступов
            * Несколько строк после `{repeat}` с использованием отступов
    -   level: "10"
        sections:
        -   title: Ученики допускают ошибки с отступами
            example:
                error_text: Самое сложное на этом уровне — правильно расставить отступы. Ученики обожают вкладывать операторы `{if}`, иногда даже внутрь других вложенных операторов `{if}`. Следить за отступами может быть довольно сложно.
                error_code: |-
                    {print} 'Robin is walking downtown'
                    location = {ask} 'Is Robin going into a shop, or does she go home?'
                    {if} location {is} shop
                        {print} 'She enters the shop.'
                        {print} 'Robin sees an interesting looking book'
                        book = {ask} 'Does Robin buy the book?'
                            {if} book {is} yes
                    {print} 'Robin buys the book and goes home'
                    {else}
                        {print} 'Robin leaves the shop and goes home'
                    {else}
                        {print} 'Robin goes home'
                solution_text: Это правильный код. Постарайтесь учитывать все различные конструкции при размещении операторов `{if}` внутри других операторов `{if}`.
                solution_code: |-
                    {print} 'Robin is walking downtown'
                    location = {ask} 'Is Robin going into a shop, or does she go home?'
                    {if} location {is} shop
                        {print} 'She enters the shop.'
                        {print} 'Robin sees an interesting looking book'
                        book = {ask} 'Does Robin buy the book?'
                        {if} book {is} yes
                            {print} 'Robin buys the book and goes home'
                        {else}
                            {print} 'Robin leaves the shop and goes home'
                    {else}
                        {print} 'Robin goes home'
        -   title: Ученики путают `{and}` с `{or}`
            example:
                error_text: Обе команды могут показаться похожими, но их функции сильно различаются.
                error_code: |-
                    game = {ask} 'Do you want to play a game?'
                    time = {ask} 'Do you have time to play?'
                    {if} game {is} 'yes' {or} time {is} 'yes'
                        {print} 'Lets play!'
                solution_text: В этом случае человек должен ответить «да» на оба вопроса, поэтому следует использовать `and`.
                solution_code: |-
                    game = {ask} 'Do you want to play a game?'
                    time = {ask} 'Do you have time to play?'
                    {if} game {is} 'yes' {and} time {is} 'yes'
                        {print} 'Lets play!'
        -   title: Ученики составляют неполные строки с `{or}`
            example:
                error_text: После {or} условие должно быть полным.
                error_code: |-
                    color = {ask} 'What color do you like?'
                    {if} color {is} blue {or} green
                        {print} 'Beautiful!'
                solution_text: 'Дополните строку так:'
                solution_code: |-
                    color = {ask} 'What color do you like?'
                    {if} color {is} blue {or} color {is} green
                        {print} 'Beautiful!'
        concepts_and_changes: |-
            На этом уровне мы снова расширяем возможности {if} и {repeat}. На предыдущем уровне ученики научились использовать несколько строк после {repeat}, {if}, {elif} или {else}.
            Теперь ученики также узнают о *вложенности* — помещении {if} или {repeat} внутрь {if} или {repeat}. Они также изучат две новые команды: {and} и {or}.
            Это даст ученикам гораздо больше возможностей для создания более универсальных программ.

            Новое на этом уровне:
            * Вложенность {if} и {repeat}
            * Использование {and} и {or} после {if}
    -   level: "11"
        sections:
        -   title: Ученики неправильно используют команду `{for}`
            example:
                error_text: Мы часто видим, что ученики пытаются напечатать список (в примере animals) вместо элементов списка.
                error_code: |-
                    animals {is} dog, cat, blobfish
                    {for} animal {in} animals
                      {print} 'I love ' animals
                solution_text: "Слово animals в последней строке следует заменить на animal."
                solution_code: |-
                    animals {is} dog, cat, blobfish
                    {for} animal {in} animals
                      {print} 'I love ' animal
        -   title: Ученики забывают об отступах
            example:
                error_text: |-
                    Ученики склонны забывать использовать отступы после команды for.
                error_code: |-
                    animals {is} dog, cat, blobfish
                    {for} animal {in} animals
                    {print} 'I love ' animals
                solution_text: После команды for следует использовать отступы.
                solution_code: |-
                    animals {is} dog, cat, blobfish
                    {for} animal {in} animals
                      {print} 'I love ' animal
        concepts_and_changes: |-
            На этом уровне ученики познакомятся с циклами с помощью {for}.

            Новое на этом уровне:
            * Циклы с {for}
    -   level: "12"
        sections:
        -   title: Ученики создают функцию, но забывают её вызвать.
            example:
                error_text: Функция работает только тогда, когда вы её вызываете.
                error_code: |-
                    {define} greet_costumer
                        {print} 'Hello'
                        {print} 'How are you doing?'
                solution_text: "Вызовите функцию"
                solution_code: |-
                    {define} greet_costumer
                        {print} 'Hello'
                        {print} 'How are you doing?'

                    {call} greet_costumer
        -   title: У учеников проблемы с отступами.
            example:
                error_text: |-
                    Отступы останутся сложной темой для многих учеников
                error_code: |-
                    {define} function
                    {print} 'Use indentation in a function.'
                    {if} use_if_statement {is} 'yes'
                    {print} 'And don't forget to use indentation for the loops as well'
                solution_text: "Используйте правильные отступы при работе с функцией"
                solution_code: |-
                    {define} function
                        {print} 'Use indentation in a function.'
                        {if} use_if_statement_too {is} 'yes'
                            {print} 'And don't forget to use indentation for the loops as well'
        -   title: Ученики забывают кавычки
            example:
                error_text: Сейчас ученикам нужно больше кавычек, чем на предыдущих уровнях. В этом примере кавычки были забыты в списке и в команде `{if}`.
                error_code: "superheroes = Spiderman, Batman, Iron Man\nsuperhero = superheroes {at} {random}\n{if} superhero = Batman\n    {print} 'IM BATMAN!'"
                solution_text: "Это правильный код:"
                solution_code: "superheroes = 'Spiderman', 'Batman', 'Iron Man'\nsuperhero = superheroes {at} {random}\n{if} superhero {is} 'Batman'\n    {print} 'IM BATMAN!'"
        concepts_and_changes: |-
            На этом последнем уровне Hedy Advanced ученики научатся использовать базовые функции.

            Новое на этом уровне:
            * Использование базовых функций с помощью {define} и {call}
    -   level: "13"
        sections:
        -   title: Ученики забывают использовать новый синтаксис
            example:
                error_text: Этот уровень содержит много новых правил синтаксиса.
                error_code: |-
                    mood {is} {ask} 'How are you doing ' name '?'
                    {if} mood {is} good
                        {print} 'Great!'
                solution_text: Используйте правильный синтаксис.
                solution_code: |-
                    mood = input('How are you doing?', name, '?')
                    {if} mood == 'good':
                        {print}('Great!')
        -   title: Ученики путают знаки < и >
            example:
                error_text: Часто ученики уже знакомы с этими знаками с уроков математики. Но если ваши ученики ещё не знают этих знаков, у них могут возникнуть с этим трудности.
                error_code: |-
                    age = {ask} 'How old are you?'
                    {if} age < 12
                        {print} 'You are older than I am!'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    age = {ask} 'How old are you?'
                    {if} age > 12
                        {print} 'You are older than I am!'
        -   title: Ученики используют неправильные знаки для `!=` `<=` и `>=`
            example:
                error_text: Эти знаки, вероятно, являются новыми для большинства учеников. Обязательно объясните эти знаки своим ученикам.
                error_code: |-
                    name = {ask} 'What is your name?'
                    {if} name =  'Hedy'
                        {print} 'You are not Hedy'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    name = {ask} 'What is your name?'
                    {if} name != 'Hedy'
                        {print} 'You are not Hedy'
        -   title: Ученики забывают использовать знак ==
            example:
                error_text: На этом уровне ученикам всё ещё разрешено использовать = или is. Но на других уровнях или в Python у них могут возникнуть из-за этого проблемы. Поэтому лучше всего научить их использовать ==.
                error_code: |-
                    name = {ask} 'What is your name?'
                    {if} name = 'Hedy'
                        {print} 'You are cool!'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    name = {ask} 'What is your name?'
                    {if} name == 'Hedy'
                        {print} 'You are cool!'
        -   title: Ученики будут пробовать функции, которые они изучили на предыдущих уровнях и которых нет в синтаксисе Python.
            example:
                error_text: Ученики будут пытаться использовать, например, повторение, функции или списки.
                error_code: |-
                    {define} pick_an_animal
                        animals = dog, cat, hamster
                        {repeat} 3 {times}
                        {print} animals {at} {random}

                    {call} pick_an_animal
                solution_text: Они узнают, как это делать, на следующих уровнях.
                solution_code: "#When you're ready for it, take a look in the upcoming levels. Or keep practising the basics first in this level."
        concepts_and_changes: |-
            На этом первом уровне Hedy Expert ученики всё глубже погружаются в концепции и синтаксис настоящих языков программирования.
            Мы рекомендуем работать с уровнями Hedy Expert только в том случае, если ваша цель — подготовить учеников к работе с другими «настоящими» языками программирования (например, Python) в дальнейшем.
            Если эта учебная цель не подходит вашим ученикам, мы рекомендуем работать только с Hedy Basic и Hedy Advanced, где ученики изучают основные принципы программирования, но не обременены специфическими правилами синтаксиса.

            **Обратите внимание**, что начиная с этого уровня синтаксис Hedy (почти) совпадает с синтаксисом Python. Это означает, что ранее изученный синтаксис Hedy может здесь не работать. Мы объясним весь новый питоновский синтаксис на следующих уровнях, но чтобы не перегружать учеников, мы распределили это по нескольким уровням.
            Это приводит к тому, что некоторые возможности, например функции и списки, не будут работать по-хедивски, но ещё не будут объяснены по-новому, питоновски. Поэтому от учеников требуется немного терпения; мы делаем шаг назад от предыдущих уровней, чтобы освоить синтаксис, а затем перейдём к изучению всех возможностей по-питоновски.

            На этом уровне ученики также научатся работать с операторами, что даст им больше возможностей использовать математику в своих программах.


            Новое на этом уровне:
            * Вывод с помощью синтаксиса Python: `{print}('Hello world!')
            * Вывод строкового текста и переменных вместе, например: `{print}('Hello, ', name, '!')
            * Запрос вопросов с помощью `{input}`
            * Использование двоеточий после операторов {if}
            * Использование этих операторов: < > == != <= >=
    -   level: "14"
        sections:
        -   title: Ученики забывают скобки
            example:
                error_text: Начиная с этого уровня списки должны быть в скобках.
                error_code: |-
                    icecream = 'strawberry', 'chocolate'
                    {print} 'I love ' icecream[{random}] ' icecream'
                solution_text: "Это правильный код:"
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print} 'I love ' icecream[{random}] ' icecream'
        -   title: Ученики используют неправильные скобки
            example:
                error_text: Начиная с этого уровня списки должны быть в квадратных скобках.
                error_code: |-
                    icecream = ('strawberry', 'chocolate')
                    {print} 'I love ' icecream[{random}] ' icecream'
                solution_text: "Это правильный код:"
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print} ('I love ' icecream[{random}] ' icecream')
        -   title: Ученики забывают кавычки, сосредоточившись на скобках
            example:
                error_text: Иногда ученики настолько сосредоточены на новом аспекте синтаксиса, что забывают кавычки.
                error_code: |-
                    icecream = [strawberry, chocolate]
                    {print} 'I love ' icecream[{random}] ' icecream'
                solution_text: "Это правильный код:"
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print}('I love ' icecream[{random}] ' icecream')
        -   title: Ученики всё ещё используют старую команду at random
            example:
                error_text: '{random} изменилась на этом уровне'
                error_code: |-
                    icecream = [strawberry, chocolate]
                    {print} 'I love ' icecream at random ' icecream'
                solution_text: 'Это правильный код:'
                solution_code: |-
                    icecream = ['strawberry', 'chocolate']
                    {print} 'I love ' icecream[{random}] ' icecream'
        concepts_and_changes: |-
            Этот уровень посвящён работе со списками. Ученики также научатся использовать повторение по-питоновски.

            Новое на этом уровне:
            * Работа со списками
            * Комбинирование списков с {for} {if} и {random}
            * Повторение с помощью {for} i {range}(1,10)
    -   level: "15"
        sections:
        -   title: У учеников проблемы с правильным синтаксисом и отступами в функции
            example:
                error_text: У учеников проблемы с правильным синтаксисом и отступами в функции
                error_code: |-
                    {def} greet_the_costumer(name
                    {print}('Hello ', name, '!')

                    customer = 'Hedy
                    greet_the_costumer()customer
                solution_text: "Внимательно посмотрите на синтаксис и отступы."
                solution_code: |-
                    {def} greet_the_costumer(name):
                        {print}('Hello ', name, '!')

                    customer = 'Hedy'
                    greet_the_costumer(customer)
        -   title: Ученики забывают использовать {return} в функции
            example:
                error_text: Ученики забывают использовать return в функции
                error_code: |-
                    {def} get_a_room(number):
                        room_number = 1000 + number

                    favorite_number = 7
                    room_number = {return} get_a_room(favorite_number)
                    print('Your room number is ', room_number)
                solution_text: 'Это правильный код:'
                solution_code: |-
                    def get_a_room(number):
                        room_number = 1000 + number
                        return room_number

                    favorite_number = 7
                    room_number = get_a_room(favorite_number)
                    print('Your room number is ', room_number)
        concepts_and_changes: |-
            Этот уровень посвящён функциям. В Hedy Advanced ученики научились использовать базовую функцию. На этом уровне они не только изучат питоновский синтаксис использования функции, но и научатся использовать аргументы в функциях и {return} {value}.

            Новое на этом уровне:
            * Использование функции по-питоновски
            * Использование аргументов в функции
            * Использование {return} {value}
    -   level: "16"
        sections:
        -   title: Ученики забывают об отступах в цикле while
            example:
                error_text: Отступы часто вызывают затруднения у учеников.
                error_code: |-
                    answer = 0
                    {while} answer != 25
                    answer = {ask} 'What is 5 times 5?'
                    {print} 'A correct answer has been given'
                solution_text: "Это правильный код:"
                solution_code: |-
                    answer = 0
                    {while} answer != 25
                        answer = {ask} 'What is 5 times 5?'
                    {print} 'A correct answer has been given'
        -   title: Ученики (случайно) создают бесконечный цикл
            example:
                error_text: Ученики создают цикл {while}, но без способа остановить цикл.
                error_code: |-
                    alarm = on
                    {while} alarm = on
                        {play} C
                        {play} D
                solution_text: "Это правильный код:"
                solution_code: |-
                    # Нажмите красную кнопку «остановить программу», чтобы принудительно остановить программу
        concepts_and_changes: |-
            На этом последнем уровне Hedy ученики научатся использовать цикл {while} и больше попрактикуются с новым синтаксисом.
            После этого уровня ученики готовы продолжить программировать в «настоящих» компиляторах Python.

            Новое на этом уровне:
            * Цикл {while}
-   title: Как...
    key: руководство
    subsections:
    -   title: Как создать класс
        text: |-
            Создайте класс, нажав <a href="https://hedy.org/for-teachers/class/new" target="_blank">Создать новый класс</a> на странице для учителей.
            У вас есть три варианта:
            * Создать стандартный класс. Все настройки класса будут стандартными, то есть все уровни и все приключения будут доступны ученикам. Вы всегда можете настроить это позже.
            * Скопировать существующий класс. Создать новый класс, включая настройки и приключения из существующего класса. Ученики при этом не переносятся.
            * Класс без приключений. Создать класс без включённых приключений.
    -   title: Как создать учётные записи учеников и добавить их в свой класс
        text: |-
            Перейдите на <a href="https://hedy.org/for-teachers/class/all" target="_blank">страницу классов</a> и нажмите на класс, в который хотите добавить учеников.
            Нажмите «Управление учениками». Если ученики уже создали учётную запись, выберите «пригласить по имени пользователя» и пригласите учеников в свой класс.
            Если у них ещё нет учётной записи, выберите «создать учётные записи».
            Вы можете выбрать автоматическую генерацию паролей для учеников или задать пароли самостоятельно. Ученики смогут создать собственный пароль после первого входа в систему.
            Введите имена учётных записей, которые хотите дать ученикам, или просто вставьте список из уже имеющейся у вас электронной таблицы и нажмите «создать учётные записи».
            Вы получите список паролей учеников. Вы можете распечатать этот список и раздать ученикам имена пользователей и пароли или скопировать список в буфер обмена и сохранить данные в другом месте.
    -   title: Как следить за успеваемостью учеников с помощью графика успеваемости
        text: |-
            График успеваемости может дать вам представление о том, как ученики справляются в вашем классе. График успеваемости находится на странице класса.
            Выберите уровень, над которым сейчас работают ученики. Теперь вы увидите график, где каждый ученик — это точка. По оси X видно, над сколькими приключениями они работали, поэтому чем дальше вправо, тем больше приключений они прошли.
            По оси Y видно количество ошибок, которые они допустили. Чем выше, тем больше программ они запустили с ошибкой.
            При наведении на точку вы получите больше информации: отображается имя пользователя, а также количество приключений, количество ошибок и количество успешных запусков на этом уровне.
    -   title: Как оценивать работу учеников
        text: |-
            Перейдите на страницу класса и откройте «Оценивание». Здесь вы найдёте таблицу со всеми отправленными программами учеников.
            Используйте фильтры, чтобы выбрать уровень, ученика или приключение, которые хотите оценить. Обратите внимание, что для применения фильтра нужно нажать кнопку «Фильтр».
            Готовы начать оценивание? Нажмите на приключение в таблице, чтобы проверить работу ученика. Довольны ли вы работой ученика? Поставьте галочку в столбце «Принято».
            Ученик также получит галочку в меню приключений, чтобы знать, что его работа принята.
            Хотите получше рассмотреть программу или запустить её? Нажмите «Просмотреть программу», и откроется новая вкладка с программой.
            Если вы довольны работой ученика, можете принять программу. Если нет, можете вернуть её ученику, нажав «разрешить повторную отправку».
            Закончив оценивание программы, нажмите «Следующее приключение», чтобы перейти к следующей программе в таблице.
    -   title: Как отправить отзыв ученику
        text: |-
            В Hedy вы можете принять отправленную учеником программу или вернуть её ему. Возможности отправлять сообщения или отзывы ученикам нет.
            Для этого вам придётся использовать систему связи вашей школы или, конечно, дать отзыв устно!
    -   title: Как изменить, какие уровни доступны моим ученикам
        text: Перейдите на страницу класса и нажмите «Настроить». В верхней части страницы вы увидите переключатели, с помощью которых можно открывать или закрывать уровни для учеников.
    -   title: Как изменить, какие приключения доступны моим ученикам
        text: |-
            Перейдите на страницу класса и нажмите «Настроить». Откройте заголовок «Настроить уровни» и выберите уровень, который хотите настроить.
            Здесь вы увидите список приключений, которые сейчас доступны вашим ученикам на этом уровне. Здесь можно добавлять приключения (в том числе свои собственные!), убирать их у учеников или менять порядок.
            Не довольны внесёнными изменениями? Вы всегда можете нажать «сбросить к стандартным приключениям», чтобы вернуться к стандартным настройкам.
            Хотите посмотреть, как изменения выглядят для учеников? Нажмите «предпросмотр как ученик», и вы увидите, как уровень выглядит для ваших учеников.
    -   title: Как добавить или удалить дополнительных учителей в моём классе
        text: Перейдите на страницу класса и нажмите «Настроить». В разделе «дополнительные учителя» можно добавлять или удалять дополнительных учителей для вашего класса.
    -   title: Как архивировать или удалить класс
        text: Перейдите на страницу класса, прокрутите вниз до опасной зоны и архивируйте или удалите класс.
    -   title: Как подготовиться к уроку
        text: |-
            Перейдите на страницу «Для учителей» и нажмите «Учебные материалы». Откройте раздел «Подготовить уровень» и выберите уровень, который будете преподавать.
            Здесь вы найдёте обзор учебных целей этого уровня, доступ к слайдам и рабочим тетрадям, а также список типичных ошибок для этого уровня.
    -   title: Как использовать слайды
        text: Перейдите на страницу «Для учителей» и нажмите «Учебные материалы». Здесь вы найдёте слайды. Для каждого уровня Hedy мы создали слайды, помогающие вам преподавать. Слайды содержат объяснения каждого уровня и примеры кода Hedy, которые можно запускать прямо в слайдах. Вводные слайды — это общее объяснение Hedy. Просто нажмите «Презентовать» и начинайте! Во время презентации можно нажать 'S', чтобы открыть заметки докладчика. Эти заметки проведут вас через урок и предложат методические советы.
    -   title: Как создать свои собственные приключения
        text: Перейдите на страницу «Для учителей» и нажмите «Приключения». Если нажать «создать приключение», можно создать своё собственное приключение.
    -   title: Как активировать свои приключения в своём классе
        text: Создав приключение, его нужно активировать, чтобы ученики могли им пользоваться. Перейдите в раздел «Для учителей > Страница класса > Настроить > Настроить уровни», чтобы добавить приключение на уровень для своих учеников.
    -   title: Как поделиться своим приключением с другими учителями
        text: Перейдите к приключению, которым хотите поделиться, откройте настройки и включите «сделать публичным», чтобы другие учителя могли использовать ваше приключение.
    -   title: Как использовать приключение, созданное другим учителем
        text: |-
            Перейдите на страницу «Для учителей», нажмите «Приключения» и выберите «Просмотреть публичные приключения». Здесь вы найдёте все публичные приключения. Хотите использовать одно из них для своих учеников?
            Нажмите «Клонировать», и копия приключения будет добавлена к вашим собственным приключениям. Эту копию можно использовать так же, как любое приключение, созданное вами.
    -   title: Как пожертвовать деньги Hedy
        text: Нам пригодится ваша помощь, чтобы Hedy продолжала работать. Мы используем эти деньги, чтобы поддерживать работу сервера, обслуживать и улучшать сайт Hedy. Мы благодарны за любые пожертвования в пользу Hedy! <a href="https://donate.stripe.com/28EcMZ1xJ5O747V8gR1Jm00" target="_blank">Нажмите здесь, чтобы пожертвовать в евро</a>, или <a href="https://donate.stripe.com/00w7sF2BNgsLawjfJj1Jm02" target="_blank">нажмите здесь, чтобы пожертвовать в долларах США</a>. Спасибо!
    -   title: Как сообщить об ошибке или предложить идею команде Hedy
        text: Мы всегда рады предложениям и сообщениям об ошибках. Пожалуйста, свяжитесь с нами по адресу [hello@hedy.org](mailto:hello@hedy.org) или присоединяйтесь к нашему <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord-серверу</a>.
    -   title: Как помочь с переводом Hedy
        text: Отличный способ помочь Hedy — <a href="https://github.com/hedyorg/hedy/wiki/Hedy-Translation-Tutorial" target="_blank">перевод ключевых слов, сообщений об ошибках, приключений и другого содержимого</a>.
    -   title: Как быть в курсе новостей Hedy
        text: Вы можете следить за новостями Hedy, <a href="https://hedy.org/subscribe" target="_blank">подписавшись на нашу рассылку</a>, или присоединиться к нашему <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord-серверу</a>.
    -   title: Как связаться с другими учителями Hedy
        text: На нашем <a href="https://discord.gg/8yY7dEme9r" target="_blank">Discord-сервере</a> много учителей, работающих с Hedy, готовых поделиться методическими советами и приёмами и ответить на ваши вопросы.
