    4:
        1:
            header: Добро пожаловать на уровень 4
            text: |-
                К концу этого урока ты сможешь:
                * Понимать, зачем в программировании нужны кавычки.
                * Ставить кавычки в нужных местах.
                * Понимать сообщения об ошибках, связанных с неправильным использованием кавычек.
            code: |-
                {print} 'Используй кавычки!'
        2:
            header: Проблема
            text: 'На предыдущих уровнях ты мог столкнуться с такой проблемой:'
            code: |-
                имя {is} София
                {print} Моё имя — имя
            debug: 'True'
            notes: |-
                На этом уровне этот код не работает!
                Попросите учеников предположить результат. Проблема в том, что если использовать переменную имя, слово «имя» уже нельзя просто так написать в тексте.
                Этот код выведет «Моё София — София».
        3:
            header: Решаем проблему с помощью кавычек
            text: |-
                На этом уровне мы решим эту проблему с помощью кавычек.

                Заодно наш код станет больше похож на «настоящий» код Python.
            code: |-
                имя {is} София
                {print} 'Моё имя — ' имя
            notes: |-
                Теперь компьютер различает текст «имя» и переменную `имя`.
                Покажите ученикам, что теперь компьютер выводит «Моё имя — София».
                Ученик может заметить, что проблему легко решить, выбрав другое имя переменной. Это верно, но важно уметь указывать компьютеру разные типы данных и самому понимать разницу между обычным текстом и переменными.
                В русском тексте используются «ёлочки», а в примерах кода — прямые одинарные (') или двойные (") кавычки, как в Python. Обратные кавычки не подойдут!
        4:
            header: Кавычки с print
            text: Каждый раз, когда используешь `{print}`, заключай текст для вывода на экран в кавычки.
            code: |-
                {print} 'Используй кавычки!'
        5:
            header: Кавычки с ask
            text: То же самое относится к ключевому слову `{ask}`.
            code: имя {is} {ask} 'Как тебя зовут?'
        6:
            header: Кавычки и переменные
            text: |-
                Нам не нужно выводить на экран имена переменных.
                Поэтому переменные должны оставаться вне кавычек, вот так:
            code: |-
                имя {is} Гарри
                {print} 'Привет, ' имя
        7:
            header: Кавычки и переменные
            text: |-
                Если переменная стоит в середине предложения, её всё равно нужно оставить вне кавычек.
                Остальной текст предложения надо заключить в кавычки. Вот так:
            code: |-
                имя {is} Гарри
                {print} 'Привет, ' имя ', как дела?'
        8:
            header: Кавычки и апострофы
            text: |-
                Осторожно! Апостроф внутри текста выглядит так же, как одинарная кавычка, и может вызвать ошибку.

                Например, апостроф есть в названии Кот-д'Ивуар. Попробуй запустить код и посмотри, что произойдёт…
            code: |-
                {print} 'Я хочу посетить Кот-д'Ивуар'
            debug: 'True'
        9:
            header: Исправь!
            text: |-
                Если в тексте нужен апостроф, используй двойные кавычки, чтобы решить проблему.
            code: |-
                {print} "Я хочу посетить Кот-д'Ивуар"
                {print} "Кот-д'Ивуар находится в Африке"
            notes: |-
                Важно открывать и закрывать строку кавычками одного типа. Например, нельзя начать строку с ' и закончить её знаком ".
        10:
            header: Очистка экрана
            text: |-
                На этом уровне ты также познакомишься с ключевым словом {clear}.
                Оно стирает весь текст из области вывода.

                Не забывай добавлять паузу с помощью sleep. Иначе компьютер сотрёт текст раньше, чем ты успеешь его прочитать!
            code: |-
                {print} '3'
                {clear}
                {print} '2'
                {clear}
                {print} '1'
                {clear}
                {print} 'СЮРПРИЗ!'
            notes: |-
                Запустите код и покажите ученикам программу. Вы заметите, что не успеваете прочитать 3, 2, 1. Добавьте команды sleep перед командами clear, чтобы исправить программу.
        11:
            header: Рисуем с `{color}`
            text: |-
                И наконец, ты можешь использовать `{color}`, чтобы сделать рисунки ещё лучше!
            code: |-
                {color} blue
                {forward} 30
                {color} red
                {forward} 30
                {color} pink
                {forward} 30
                {color} yellow
                {forward} 30
        12:
            header: Отладка
            text: Давай отладим этот код!
            code: |-
                {clear}
                {print} Какой прекрасный день для пляжа!
                {ask} 'Хочешь построить замок из песка или поплавать в море?'
                {print} 'Ты хочешь занятие '
                {print} 'Мне тоже хочется это сделать'
                {print} 'Посмотри на эти красивые ракушки!'
                цвета {is} 'оранжевый, серебряный, белый, коричневый'
                {print} 'Мне нравится цвета {at} {random} ракушка!'
                выбор {is} {ask} Какая тебе нравится?
            debug: 'True'
            notes: |-
                Покажите, как пользоваться отладчиком и значком глаза.
        13:
            header: На старт, внимание, марш!
            text: Увлекательных приключений на уровне 4!
        14:
            header: Повторим!
            text: Что нового ты узнал сегодня?
            notes: |-
