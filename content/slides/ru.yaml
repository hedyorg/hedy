            notes: |-
                На этом уровне ученики познакомятся с функциями. Детям может быть трудно понять это понятие.
                Чем больше они практикуются в приключениях, тем лучше разбираются в функциях.
                Поэтому не стоит тратить слишком много времени на попытки всё понять заранее: пусть ученики больше пробуют сами и разбираются на практике!
        2:
            header: Функции!
            text: |-
                На этом уровне ты научишься использовать функции. Функция — это блок кода, который легко использовать несколько раз.

                Задание:
                * Прочитай припев песни «Калинка»: «Калинка, калинка, калинка моя! В саду ягода малинка, малинка моя!»
                * Представь, что поёшь припев до и после куплета. Какие строки повторятся?
            notes: |-
                Чтобы показать ученикам, для чего нужна функция, используем песню «Калинка».
                Припев повторяется, поэтому его удобно вынести в функцию. Слова приведены на слайде: знать песню заранее не обязательно.
        3:
            header: «Калинка»
            text: |-
                В этой программе показан пример функции.
                Вместо многоточия добавь вторую строку припева!
            code: |-
                {define} припев
                    {print} 'Калинка, калинка, калинка моя!'
                    {print} '...'
            notes: |-
                Добавьте вторую строку: «В саду ягода малинка, малинка моя!».
                Объясните ученикам, что этот блок кода — функция с именем `припев`.
                На следующем слайде мы дважды вызовем функцию: до и после куплета.
        4:
            header: Функции
            text: Как видно из примера, функция — это блок кода, который можно вызвать в любой момент. Используй `{define}`, чтобы определить функцию, и `{call}`, чтобы вызвать её.
            code: |-
                {define} припев
                    {print} 'Калинка, калинка, калинка моя!'
                    {print} 'В саду ягода малинка, малинка моя!'

                {call} припев
                {print} 'Ах, под сосною, под зеленою'
                {print} 'Спать положите вы меня!'
                {call} припев
        5:
