levels:
    0:
        1:
            header: Добро пожаловать в Hedy!
            text: |-
                Добро пожаловать в язык программирования Hedy!

                Учителя, нажмите S на клавиатуре, чтобы увидеть заметки докладчика.
            notes: |-
                Попросите учеников записать несколько слов, которые у них ассоциируются с программированием. Быстро опросите класс, чтобы услышать ответы.
        2:
            header: Программирование
            text: |-
                Программировать — значит давать компьютеру инструкции на понятном ему языке.

                Такой язык называется «языком программирования».
            notes: |-
                К сожалению, компьютеры не понимают обычную человеческую речь, например английскую, а говорят на своём языке.
                Не пугайтесь: набирать цепочки нулей и единиц не придётся. Мы научимся давать компьютеру инструкции на языке программирования.
        3:
            header: Язык программирования
            text: |-
                Может быть, ты уже знаешь какие-нибудь языки программирования?
                Вот несколько примеров:
                * Scratch
                * Python
                * HTML
            notes: |-
                Спросите учеников об их опыте программирования. Возможно, они знают кого-то, кто работает в ИТ.
        4:
            header: Программирование
            text: |-
                Если ты умеешь программировать, то можешь делать много интересного:
                * Создавать интерактивные истории
                * Создавать компьютерные рисунки и переносить их на бумагу или ткань
                * Создавать собственные приложения для телефона
            notes: |-
                Это может показаться очень сложным, но мы будем учиться программировать шаг за шагом.
        5:
            header: Программирование в Hedy
            text: В Hedy мы используем особые «ключевые слова», например `{print}`.
            code: '{print} Добро пожаловать в Hedy!'
            notes: |-
                Давайте посмотрим на Hedy. В Hedy мы используем специальные слова (ключевые слова), чтобы дать компьютеру инструкцию.
                Мы вводим эти инструкции в левой части экрана. Это и называется кодом, или программой.
        6:
            header: Программирование в Hedy
            text: Ключевые слова выделяются розовым цветом.
            code: '{print} Добро пожаловать в Hedy!'
            notes: |-
                Как видите, специальные слова (или ключевые слова) становятся розовыми, если использовать их правильно.
        7:
            header: Программирование в Hedy
            text: Чтобы запустить код, нажми кнопку «Запустить код» под ним.
            code: '{print} Добро пожаловать в Hedy!'
            notes: |-
                Чтобы компьютер выполнил инструкции, нужно «запустить» код. Нажмите кнопку и покажите ученикам, что произойдёт.
        8:
            header: Программирование в Hedy
            text: Результат появляется справа.
            code: '{print} Добро пожаловать в Hedy!'
            notes: |-
                Когда мы запускаем код, появляется результат. Это результат выполнения нашей программы. Правая часть экрана, где он появляется, называется областью вывода.
        9:
            header: Программирование в Hedy
            text: Результатом может быть и рисунок.
            code: |-
                {forward} 100
                {turn} {left}
            notes: |-
                В Hedy мы можем не только выводить текст: результатом может быть рисунок или…
        10:
            header: Программирование в Hedy
            text: А ещё результатом может быть музыка!
            code: |-
                {play} C4
                {play} D4
                {play} E4
            notes: |-
                Перейдём на первый уровень и начнём!
        11:
            header: Переходи к следующему приключению через меню
            text: |-
                Используй меню, чтобы перейти к следующему приключению или уровню.
            editor: /hedy/1
            notes: |-
                Иногда ученики не знают, как перейти к следующему приключению. Покажите им, как это сделать в Hedy.
        12:
            header: Программирование в Hedy
            text: |-
                Иногда в коде бывают ошибки. Ты можешь воспользоваться отладчиком, чтобы найти ошибку (баг) и исправить её.
            code: |-
                {print} Отладка — это поиск ошибки
                {print} Ты можешь выполнять код построчно
                {print} Так легко найти ошибку
                {print} И исправить её!
                {print} Или нажми значок глаза, чтобы отключить строку кода
            debug: 'True'
            notes: |-
                **Как отлаживать код**
                Посмотри это <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">видео</a>, чтобы узнать, как работает отладчик, или прочитай инструкции.
                Конечно, ты можешь просто просмотреть код и найти ошибки самостоятельно, но у нас есть и инструменты, которые помогут тебе.
                Нажми кнопку с божьей коровкой 🐞 под полем ввода. Запустится **отладчик**. С его помощью можно выполнять программу построчно.
                Если в коде есть серьёзная ошибка (как в приключениях на отладку), отладчик предложит сначала исправить такие ошибки. Прочитай сообщения об ошибках, чтобы узнать, как их исправить.
                Когда серьёзные ошибки исправлены, отладчик начнёт выполнять программу строка за строкой.
                Чтобы выполнить следующую строку, нажми кнопку ⏭️ справа. Строка делает то, что нужно? Отлично! Нажимай кнопку снова, чтобы выполнять следующие строки, пока программа не заработает как надо.
                Чтобы остановить отладчик, нажми кнопку 🛑 посередине.
                Чтобы начать выполнение кода сначала, нажми кнопку 🔁 слева.
                Застрял на какой-то строке кода и хочешь попробовать запустить программу без неё?
                Ты можешь отключить строку кода, нажав значок глаза перед номером строки. Строка будет зачёркнута.
                Теперь при выполнении кода эта строка будет пропускаться. Чтобы снова включить её, просто нажми значок глаза ещё раз.
    1:
        1:
            header: Добро пожаловать на уровень 1!
            text: |-
                К концу этого урока ты сможешь:
                * Написать код, который выводит текст
                * Создать интерактивную историю
        2:
            header: '{print}'
            text: |-
                Первая команда, которую ты можешь использовать на уровне 1, — `{print}`.

                `{print}` выводит текст на экран.
            code: '{print} Покажи этот текст на экране'
            notes: |-
                Сначала предложите ученикам предположить, что появится на экране. Затем запустите код и покажите, что происходит при выполнении команды `print`.
        3:
            header: Ключевое слово {print}
            text: |-
                Ты можешь заменить текст после ключевого слова print на любой другой.

                Можно вывести и несколько строк: добавь ещё одну строку кода, которая тоже начинается с `{print}`.
            code: |-
                {print} Добро пожаловать в Hedy!
                {print} Начни программировать прямо сейчас!
            notes: |-
                Запустите код, а затем сами измените его. Покажите, что можно вывести любой текст.
        4:
            header: '{ask}'
            text: |-
                Вторая команда, которую ты можешь использовать на уровне 1, — `{ask}`.

                `{ask}` задаёт вопрос, на который можно ответить.
            code: |-
                {print} Добро пожаловать в твою игру «Камень, ножницы, бумага»!
                {ask} Что ты выберешь?
            notes: |-
                Покажите, что теперь компьютер задаёт вопрос. Введите ответ и покажите, что после этого ничего не происходит.
                Объясните ученикам, что компьютер только выполняет инструкции и ничего не делает сам по себе. Чтобы компьютер вывел ответ, ему нужно дать такую инструкцию.
        5:
            header: '{answer}'
            text: |-
                Чтобы показать ответ в области вывода, используй `{answer}`.
                `{answer}` никогда не используется само по себе — только вместе с `{ask}`.
            code: |-
                {print} Привет!
                {ask} Как тебя зовут?
                {print} Привет, {answer}
            notes: |-
                Чтобы компьютер повторил ответ, используйте ключевое слово `answer`.
        6:
            header: Программируем!
            text: Здесь ты найдёшь список приключений.
            editor: /hedy/1
            notes: |-
                Прежде чем начать, покажите ученикам приключения. Не забудьте обратить их внимание на задания. В них ученики прочитают, что именно нужно сделать в приключении.
        7:
            header: Программируем!
            text: Кнопки с жёлтыми стрелками позволяют копировать примеры.
            editor: /hedy#print_command
            notes: |-
                В завершение покажите ученикам, что можно скопировать пример кода в поле для программирования, нажав жёлтую кнопку.
        8:
            header: Начнём!
            text: |-
                Пора попробовать первые приключения.
                Используй меню для перехода к следующему приключению. Если хочешь ещё раз прочитать объяснение ключевого слова, вернись к приключению со значком лампочки.
            editor: /hedy/1
            notes: |-
                За дело!
        9:
            header: Отладка
            text: Отладка кода — это исправление ошибок в нём. Давай вместе отладим этот код. Нажми кнопку с божьей коровкой, чтобы запустить отладчик.
            code: |-
                Я диджей Hedy
                {print} Какую песню ты хочешь послушать?
                {ask} Мне тоже нравится эта песня!
                {print} А теперь... {answer}
            debug: 'True'
            notes: |-
                **Как отлаживать код**
                Посмотри это <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">видео</a>, чтобы узнать, как работает отладчик, или прочитай инструкции.
                Конечно, ты можешь просто просмотреть код и найти ошибки самостоятельно, но у нас есть и инструменты, которые помогут тебе.
                Нажми кнопку с божьей коровкой 🐞 под полем ввода. Запустится **отладчик**. С его помощью можно выполнять программу построчно.
                Если в коде есть серьёзная ошибка (как в приключениях на отладку), отладчик предложит сначала исправить такие ошибки. Прочитай сообщения об ошибках, чтобы узнать, как их исправить.
                Когда серьёзные ошибки исправлены, отладчик начнёт выполнять программу строка за строкой.
                Чтобы выполнить следующую строку, нажми кнопку ⏭️ справа. Строка делает то, что нужно? Отлично! Нажимай кнопку снова, чтобы выполнять следующие строки, пока программа не заработает как надо.
                Чтобы остановить отладчик, нажми кнопку 🛑 посередине.
                Чтобы начать выполнение кода сначала, нажми кнопку 🔁 слева.
                Застрял на какой-то строке кода и хочешь попробовать запустить программу без неё?
                Ты можешь отключить строку кода, нажав значок глаза перед номером строки. Строка будет зачёркнута.
                Теперь при выполнении кода эта строка будет пропускаться. Чтобы снова включить её, просто нажми значок глаза ещё раз.
        10:
            header: Играем музыку
            text: |-
                Играй ноты с помощью `{play}`.
                Ноты обозначаются так: C - D - E - F - G - A - B.
                Добавь число после ноты, чтобы выбрать октаву: от 1 до 10.
            code: |+
                {play} C4
                {play} D4
                {play} E4
                {play} F4
                {play} G4
                {play} A4
                {play} B4
                {play} C5

            notes: |-
                Покажите ученикам, как использовать ключевое слово `{play}` в Hedy. Заодно напомните правила использования наушников в классе.
        11:
            header: 'Рисуем с черепашкой: {forward}'
            text: '`{forward}` перемещает черепашку вперёд.'
            code: '{forward} 50'
            notes: |-
                Мы познакомились с командами для текста, а теперь посмотрим на команды для рисования. Покажите ученикам, как использовать ключевое слово forward.
        12:
            header: 'Рисуем с черепашкой: {forward}'
            text: 'Как двигаться назад?'
            code: '{forward} -50'
            notes: |-
                Спросите учеников, как, по их мнению, можно двигаться назад. Ответ: использовать отрицательное число, например -50.
        13:
            header: 'Рисуем с черепашкой: {turn}'
            text: '`{turn}` поворачивает черепашку влево или вправо.'
            code: |-
                {forward} 50
                {turn} {left}
        14:
            header: Отладка
            text: Используем отладчик при рисовании
            code: |-
                {forward} 50
                {turn} {left}
                {forward} 100
                {turn} {left}
                {forward} 50
                {turn} {left}
            debug: 'True'
            notes: |-
                Отладчик может пригодиться и при создании рисунка.
        15:
            header: Повторим!
            text: Что нового ты узнал сегодня?
            notes: |-
                Попросите учеников перечислить, чему они сегодня научились.
        16:
            header: Повторим!
            text: |-
                Какое приключение тебе понравилось больше всего? Почему?

                Какое приключение тебе понравилось меньше всего? Почему?

            notes: |-
                Спросите мнение учеников.
        17:
            header: Покажи и расскажи!
            text: Хочешь показать классу свою программу?
            notes: |-
                Предложите нескольким ученикам показать свои работы классу. Для этого можно перейти на страницу класса и открыть приключения учеников.
        18:
            header: Заглянем на следующий уровень…
            text: |-
                На следующем уровне ты научишься использовать переменные, чтобы сделать программы ещё более интерактивными!
                А ещё научишься приостанавливать выполнение кода с помощью ключевого слова `{sleep}`!
    2:
        1:
            header: Добро пожаловать на уровень 2
            text: |-
                К концу этого урока ты сможешь:
                * Сохранить значение в переменной
                * Создать историю или рисунок с помощью переменных
            notes: |-
                Ученикам может быть трудно понять, что такое переменная. По нашему опыту, несколько разных примеров помогают лучше разобраться в этом понятии.
        2:
            header: Проблема
            text: |-
                На предыдущем уровне ты мог столкнуться с такой проблемой…
            code: |-
                {print} Добро пожаловать в ресторан!
                {ask} Что ты хочешь поесть?
                {print} Ты хочешь поесть... {answer}
                {ask} Что ты хочешь выпить?
                {print} Ты хочешь выпить... {answer}
                {print} Спасибо за заказ!
                {print} Приятного аппетита! Твой заказ: {answer}
            notes: |-
                Внимание: на этом уровне этот код не работает. Не запускайте программу, а просто обсудите её.
                Предложите ученикам рассмотреть программу и предположить, что она выведет.
                Надеемся, они заметят, что последняя строка пожелает насладиться только заказанным напитком, а о еде компьютер уже забудет.
                С помощью 'ask' компьютер может запомнить только одно значение. На этом уровне вы научитесь решать эту проблему с помощью переменных.
        3:
            header: Что такое переменная?
            text: |-
                Переменная — это место в памяти компьютера, где он хранит ответ на вопрос.
                Звучит сложно? Посмотри на пример.
            code: |-
                ответ {is} {ask} Как тебя зовут?
                {print} Привет, ответ
            notes: |-
                В программировании переменной называют место в памяти компьютера, где хранится информация, которая может меняться.
                Переменная похожа на коробку или контейнер: сама коробка остаётся прежней, а её содержимое может изменяться.
                Покажите ученикам, как работают переменные. Обратите внимание, что имя переменной `ответ` в последней строке заменяется её значением.
                В синем блоке в области вывода показаны использованные переменные и их значения.
        4:
            header: Команда `{is}`
            text: |-
                Чтобы создать переменную или присвоить ей значение, мы используем команду `{is}`. Имя переменной пишется перед `{is}`, а команда `{ask}` — после. Имя переменной можно выбрать самостоятельно и использовать что-то другое вместо `ответ`.
            code: |-
                имя {is} {ask} Как тебя зовут?
                {print} Привет, имя
            notes: |-
                Попросите учеников придумать собственные примеры.
        5:
            header: Переменные
            text: |-
                Можно задать переменную, не задавая вопроса. Имя переменной пишется перед `{is}`, а её значение — после.
            code: |-
                еда {is} гамбургер
                напиток {is} вода
                {print} Мой выбор еды: еда.
                {print} Мой выбор напитка: напиток.
            notes: |-
                Попросите учеников придумать другие переменные (рост, размер обуви, цвет волос и т. д.) и добавьте свои примеры в код.
        6:
            header: Несколько переменных
            text: Теперь мы можем использовать несколько переменных вместо одного `ответ`.
            code: |-
                имя {is} Hedy
                возраст {is} 15
                {print} имя — возраст лет
            notes: |
        7:
            header: Пауза
            text: С помощью ключевого слова `{sleep}` ты можешь ненадолго приостановить выполнение кода.
            code: |-
                {print} Мой любимый цвет...
                {sleep} 2
                {print} зелёный!
            notes: |-
                Покажите ученикам ключевое слово '{sleep}'. Спросите, что, по их мнению, означает число 2.
                Замените 2 другим числом и покажите, что можно выбрать, на сколько секунд приостановить выполнение кода.
        8:
            header: Пауза на 5 секунд
            text: |-
                Если хочешь сделать паузу длиннее, добавь число после ключевого слова `{sleep}`.

                Вместо числа можно даже использовать переменную, задающую длительность паузы.
            code: |-
                пауза {is} 10
                {print} Мой любимый цвет...
                {sleep} пауза
                {print} зелёный!
            notes: |-
                Покажите код. При желании можно даже заменить 10 командой {ask}.
        9:
            header: Рисуем с переменными
            text: |-
                На уровне 1 ты научился использовать {forward} 100.
                Теперь можно использовать и переменную.
            code: |-
                расстояние {is} {ask} Как далеко мне идти?
                {forward} расстояние
            notes: |-
                Покажите ученикам, что теперь можно использовать переменные и при рисовании с черепашкой!
