    15:
        1:
            header: Добро пожаловать на уровень 15!
            text: |-
                К концу этого урока ты сможешь:
                * Сделать код короче и эффективнее с помощью функций.
                * Использовать функции с аргументами
                * Использовать `{return} {value}` в функциях
            notes: |-
                Попросите учеников рассказать, что они помнят о функциях и для чего те нужны.
        2:
            header: Помнишь функции?
            text: |-
                Функции помогают сделать код аккуратнее, позволяя повторно использовать его фрагменты.
                В настоящем Python функции определяют с помощью `{def}`, затем пишут имя функции и ():
                Для вызова больше не нужен `{call}`: достаточно написать имя функции с ().
            code: |-
                def квадрат():
                    {for} i {in} {range} (1,4):
                        {turn} 90
                        {forward} 10

                квадрат()
                {forward} 50
                квадрат()
                {forward} 50
                квадрат()
                {forward} 50
            notes: |-
                Покажите ученикам, как теперь выглядят функции. Объясните, что круглые скобки пригодятся позже.
        3:
            header: Слишком много кода?
            text: В коде ниже много повторений.
            code: |-
                {print} ('Этот код вычислит квадраты первых 5 чисел и выведет результат.')

                квадрат1 = 1*1
                {print} ('Квадрат 1 =', квадрат1)
                квадрат2 = 2*2
                {print} ('Квадрат 2 = ', квадрат2)
                квадрат3 = 3*3
                {print} ('Квадрат 3 = ', квадрат3)
                квадрат4 = 4*4
                {print} ('Квадрат 4 = ', квадрат4)
                квадрат5 = 5*5
                {print} ('Квадрат 5 = ', квадрат5)
            notes: |-
                Покажите код ученикам. Замечают ли они повторения?
                Спросите, могут ли они придумать, как записать этот код меньшим числом строк.
                Скорее всего, пока не смогут, поэтому покажите следующий слайд!
        4:
            header: Используй функцию!
            text: |-
                Теперь попробуем получить тот же результат с меньшим числом строк кода.
                Для этого напишем функцию: фрагмент кода, который можно выполнять несколько раз с разными входными данными.
            code: |-
                {def} вычислить_квадрат(число):
                    квадрат = число*число
                    {print} ('Квадрат', число, '=', квадрат)

                {print} ('Этот код вычислит квадраты первых 5 чисел и выведет результат.')

                вычислить_квадрат(1)
                вычислить_квадрат(2)
                вычислить_квадрат(3)
                вычислить_квадрат(4)
                вычислить_квадрат(5)
            notes: |-
                Запустите код. Убедитесь, что ученики понимают, как код даёт этот результат.
                Пока у нас всего на две строки меньше, чем на предыдущем слайде.

                Объясните, что чем больше повторений, тем полезнее функции.
                Вот несколько преимуществ: меньше кода, он аккуратнее, и писать его быстрее.
                Меньше шансов ошибиться, а ошибки проще найти.

                Покажите, что изменение внутри функции меняет весь её вывод.
        5:
            header: Функции с несколькими аргументами
            text: |-
                Входные данные, указанные в скобках функции, называются аргументами.
                У одной функции может быть несколько аргументов:
            code: |-
                {def} сказка(принцесса, принц, что_то_ядовитое, знак_любви)
                ответ = {input}('Хочешь, я расскажу тебе сказку?')
                {if} ответ == да:
                    {print} ('Жила-была девушка по имени ', принцесса)
                    {print} ('Она попробовала ', что_то_ядовитое, ' и чуть не умерла...')
                    {print} ('Но принц ', принц, ' пришёл к ней, и его подарок — ', знак_любви )
                    {print} ('Этот подарок спас ', принцесса ' и подарил ей любовь к ', принц)
                    {print} (принцесса, ' и ', принц, ' жили долго и счастливо.')
                {else}:
                    {print} ('Ничего страшного. Может быть, в другой раз.')

                сказка('Белоснежка', 'Каспер', 'яд', 'поцелуй')
            notes: Запустите код и покажите, что можно изменить все четыре аргумента и получить другую историю.
        6:
            header: Возвращаемое значение
            text: |-
                Иногда нужно использовать число, вычисленное внутри функции, за её пределами.
                Команда `{return}` позволяет вернуть значение и использовать его вне функции.
            code: |-
                {def} вычислить_новую_цену(цена, процент):
                    процент = процент / 100
                    сумма_скидки = цена * процент
                    {return} цена - сумма_скидки

                старая_цена = input ('Какая сумма указана на ценнике?')
                скидка = input ('Какой процент скидки?')

                новая_цена = _ вычислить_новую_цену(старая_цена, скидка)
                print('Новая цена — ', новая_цена, ' долларов')
            notes: |-
                Могут ли ученики придумать другие ситуации, в которых удобно возвращать значение из функции?
