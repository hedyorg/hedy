            code: |-
                {forward} 100
                {turn} 45
                {forward} 100
            notes: |-
                Покажите ученикам код. На следующем слайде мы покажем разные углы.
        11:
            header: Градусы
            text: |-
                Полный круг — 360 градусов.
                Половина круга — 180 градусов.
                Поворот направо — 90 градусов.
                Поворот налево — 270 градусов.

                Ты можешь ввести любое число.
            code: |-
                {turn} 90
                {forward} 100
            notes: |-
                Убедитесь, что ученики понимают, что такое градусы. Возможно, они уже изучали это на математике, а возможно, это совсем новая для них тема.
                Если ученики ещё не слышали о градусах, полезно показать им круг с делениями. Можно даже распечатать его для них.
                Используйте примеры кода на слайдах, чтобы показать разные углы.
        12:
            header: Градусы и переменные
            text: |-
                Количество градусов тоже можно задать переменной!
            code: |-
