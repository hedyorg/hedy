        15:
            header: Повторим!
            text: |-
                Какое приключение тебе понравилось больше всего? Почему?

                Какое приключение тебе понравилось меньше всего? Почему?

            notes: |-
                Спросите мнение учеников.
        16:
            header: Покажи и расскажи!
            text: Хочешь показать классу свою программу?
            notes: |-
                Предложите нескольким ученикам показать свои работы классу.
        17:
            header: Заглянем на следующий уровень…
            text: |-
                На следующем уровне ты научишься делать так, чтобы компьютер по-разному реагировал на разные введённые данные!
    5:
        1:
            header: Добро пожаловать на уровень 5
            text: |-
                К концу этого урока ты сможешь:
                * Задавать разную реакцию компьютера на разные введённые данные.
                * Использовать ключевые слова {if} и {else}
        2:
            header: Условие if
            text: |-
                Ключевое слово `{if}` позволяет выбрать один из двух вариантов.
            code: |-
                имя {is} {ask} 'Как тебя зовут?'
                {if} имя {is} Hedy {print} 'здорово'
            notes: |-
                Покажите, что в этом примере компьютер выводит «здорово», если ответ — Hedy.
                Если ответ другой, компьютер ничего не делает.
        3:
            header: Не забудь про print
            text: |-
                Используя `{if}`, не забывай про ключевое слово `{print}`.
                Этот код не сработает!
            code: |-
                {if} имя {is} Hedy 'здорово'
            debug: 'True'
            notes: |-
                Запустите код и исправьте ошибку, как показано на следующем слайде.
        4:
            header: Условные действия
            text: |-
                Код, который выполняется после условия if, называется условным действием.
            code: |-
                {if} имя {is} Hedy {print} 'здорово'
            notes: |-
                Спросите учеников, что здесь является условным действием. Ответ: `{print} 'здорово'`.
        5:
            header: 'Иначе: else'
            text: |-
                Вместе с ключевым словом `{if}` можно добавить и `{else}`.
            code: '{if} имя {is} Hedy {print} ''здорово'' {else} {print} ''бу!'''
            notes: |-
                Покажите ученикам, что код даёт разные результаты для разных ответов:
                Если ответ — Hedy, компьютер выводит «здорово».
                Если ответ другой, компьютер выводит «бу!».
        6:
            header: Длинные строки
            text: |-
                Ты мог заметить, что строки становятся очень длинными, если в них есть и `{if}`, и `{else}`.
                Можно разделить команды и записать их в две строки, вот так:
            code: |-
                {if} имя {is} Hedy {print} 'здорово'
                {else} {print} 'бу!'
            notes: |-
                Если ученикам удобно использовать две строки, рекомендуем сразу перейти к этому способу.
                Так программа выглядит аккуратнее, и это пригодится на следующих уровнях.
        7:
            header: Отладка
            text: Давай отладим этот код!
            code: |-
                {print} Добро пожаловать в службу безопасности HedyAir!
                посадочный_талон {is} {ask} 'У тебя есть посадочный талон?'
                {if} посадочны_талон да {print} Отлично!
                {else} Приготовь посадочный талон.
                паспорт {is} 'Можно посмотреть твой паспорт?'
                {if} паспорт {is} да 'спасибо'
                {else} 'Без паспорта лететь нельзя'
                декларация {is} {ask} Тебе есть что задекларировать?
                {if} декларация {is} да
                предмет_декларации {is} {ask} 'Что ты хочешь задекларировать?'
                {else} Хорошо
                {print} Спасибо. Пройди к выходу A22.'
            debug: 'True'
        8:
            header: Поехали!
            text: Увлекательных приключений на уровне 5!
        9:
            header: Повторим!
            text: Что нового ты узнал сегодня?
            notes: |-
