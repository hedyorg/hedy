                Покажите на следующем слайде, что код гораздо легче читать с ключевым словом and.
        7:
            header: Ключевое слово {and}
            text: |-
                В этом случае пригодится ключевое слово `{and}`.

                Так код гораздо легче читать, и о вложенности можно не беспокоиться так сильно!
            code: |-
                {print} 'Позволь угадать, кто ты'
                цвет_волос = {ask} 'Какого цвета у тебя волосы?'
                очки = {ask} 'Ты носишь очки?'
                {if} цвет_волос {is} чёрный {and} очки {is} да
                    {print} 'Ты, должно быть, Джейд!'
                {elif} цвет_волос {is} чёрный {and} очки {is} нет
                    {print} 'Ты, должно быть, Ахмед!'
                {elif} цвет_волос {is} светлый {and} очки {is} да
                    {print} 'Ты, должно быть, Патрик!'
                {elif} цвет_волос {is} светлый {and} очки {is} нет
                    {print} 'Ты, должно быть, Миранда!'
                {else}
                    {print} 'Ты, должно быть, Джеки!'
            notes: |-
                Если теперь спросить учеников, у кого светлые волосы и нет очков, они смогут ответить гораздо быстрее.
                Умение делать код читаемым — важный навык, и ключевое слово and, скорее всего, покажется ученикам очень естественным.
