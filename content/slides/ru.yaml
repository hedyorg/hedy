    3:
        1:
            header: Добро пожаловать на уровень 3
            text: |-
                К концу этого урока ты сможешь:
                * Сохранить несколько значений в переменной — это называется списком.
                * Создать историю со случайными событиями.
                * Создать рисунок со случайными элементами.
        2:
            header: Создаём список
            text: |-
                Список создаётся с помощью `{is}`.

                Разделяй элементы списка запятыми.
            code: животные {is} собаки, кошки, кенгуру
            notes: |-
                Попросите учеников записать собственный пример списка.
        3:
            header: Случайный выбор
            text: |-
                Используй список с ключевыми словами `{at}` `{random}`.
                Компьютер случайным образом выберет один элемент списка.
                При каждом запуске результат будет меняться.
            code: |-
                животные {is} собаки, кошки, кенгуру
                {print} животные {at} {random}
            notes: |-
                Запустите код несколько раз и покажите ученикам, что результат каждый раз отличается.
        4:
            header: Случайный выбор в предложении
            text: Ключевые слова `{at}` `{random}` можно использовать и в предложении.
            code: |-
                животные {is} собаки, кошки, кенгуру
                {print} Моё любимое животное — животные {at} {random}
            notes: |-
                Снова покажите ученикам, что при нескольких запусках кода результат меняется.
                Можно изменить порядок слов и показать, что так тоже допустимо: `{print} животные {at} {random} — моё любимое животное`.
                Теперь попросите учеников добавить под своим списком команду print с at random и обменяться кодом с соседом.
                Пусть сосед предположит, какой результат может вывести программа.
                Кратко обсудите несколько ответов всем классом.
        5:
            header: Начнём!
            text: |-
                Приступим к приключениям!
            notes: |-
                Начнём с первых приключений!
        6:
            header: Добавляем в список
            text: |-
                Ты можешь добавлять элементы в список с помощью ключевых слов `{add}` `{to_list}`.
            code: |-
                животные {is} собака, кошка, кенгуру
                {add} овца {to_list} животные
                {print} Мой выбор — животные {at} {random}
            notes: |-
                Надеемся, ученики заметят, что здесь команда add to не очень нужна: овцу можно было сразу включить в список.
                На следующем слайде показано, как использовать add to вместе с ask и переменной, чтобы сделать программу интерактивной.
        7:
            header: Добавляем в список
            text: |-
                Ты можешь сам выбрать, что добавить в список, или использовать `{add}` `{to}` вместе с `{ask}`.
                Так игрок сможет сам решить, что добавить в список, и программа станет интерактивной.
            code: |-
                животные {is} собака, кошка, кенгуру
                любимое_животное {is} {ask} Какое твоё любимое животное?
                {add} любимое_животное {to_list} животные
                {print} Мой выбор — животные {at} {random}
            notes: |-
                Запустите программу несколько раз и покажите, что выбранное животное добавляется в список.
                В синем блоке в области вывода показаны использованные переменные и их значения.
        8:
            header: Удаляем из списка
            text: |-
                Противоположность `{add}` `{to}` — это `{remove}` `{from}`.
                Эта команда удаляет элемент из списка.
            code: |-
                животные {is} собака, кошка, кенгуру
                нелюбимое_животное {is} {ask} Какое животное тебе не нравится?
                {remove} нелюбимое_животное {from} животные
                {print} Мой выбор — животные {at} {random}
            notes: |-
                Когда ученики разберутся с add to, им, скорее всего, будет легко понять remove from.
                Выполните задания 4 и 5.
        9:
            header: Отладка
            text: Давай отладим этот код!
            code: |-
                жанры_музыки {is} рок, поп, метал, инди, джаз
                выбранный_жанр {is} музыка {at} {random}
                {print} Послушаем выбранный жанр
                нравится {ask} Тебе нравится этот жанр?
                {remove} выбранный_жанр {from} выбранный_жанр
                второй_выбор {is} жанры_музыки
                {print} Или тебе больше нравится... второй_выбор {at} {random}
                {remove} второй_выбор {to} жанры_музыки
                {print} Мне больше всего нравится жанр_музыки {random}!
            debug: 'True'
            notes: |-
                Покажите, как пользоваться отладчиком и значком глаза.
        10:
            header: За работу!
            text: Увлекательных приключений на уровне 3!
        11:
