            header: Добро пожаловать на уровень 15!
            text: |-
                К концу этого урока вы сможете:
                * делать код короче и эффективнее с помощью функций
                * использовать функции с аргументами
                * использовать `{return} {value}` в функциях
            notes: Пусть ученики расскажут, что они помнят о функциях и для чего они нужны.
        2:
            header: Помните функции?
            text: |-
                Функции делают код более организованным и аккуратным, позволяя повторять фрагмент кода в функции.
                В настоящем коде Python функции определяются с помощью `{def}`, затем идёт имя функции и ():
                Для вызова функции не нужно использовать `{call}`, достаточно написать имя с ().
            code: |-
                def квадрат():
                    {for} i {in} {range} (1,4):
                        {turn} 90
                        {forward} 10

                квадрат()
                {forward} 50
                квадрат()
                {forward} 50
                квадрат()
                {forward} 50
            notes: Покажите ученикам, как теперь выглядят функции. Скажите, что скобки будут использоваться позже.
        3:
            header: Слишком много кода?
            text: В коде ниже много повторений.
            code: |-
                {print} ('Этот код вычислит первые 5 квадратов и выведет результат.')

                квадрат1 = 1*1
                {print} ('квадрат 1 =', квадрат1)
                квадрат2 = 2*2
                {print} ('квадрат 2 = ', квадрат2)
                квадрат3 = 3*3
                {print} ('квадрат 3 = ', квадрат3)
                квадрат4 = 4*4
                {print} ('квадрат 4 = ', квадрат4)
                квадрат5 = 5*5
                {print} ('квадрат 5 = ', квадрат5)
            notes: |-
                Покажите код ученикам. Видят ли они все повторения?
                Спросите, могут ли они придумать способ записать этот код меньшим числом строк.
                Скорее всего, они не смогут это придумать, поэтому покажите следующий слайд!
        4:
            header: Используйте функцию!
            text: |-
                Теперь попробуем получить тот же вывод меньшим числом строк кода.
                Для этого напишем функцию: фрагмент кода, который можно повторять несколько раз с разными входными данными.
            code: |-
                {def} вычислить_квадрат(число):
                    квадрат = число*число
                    {print} ('квадрат', число, '=', квадрат)

                {print} ('Этот код вычислит первые 5 квадратов и выведет результат.')

                вычислить_квадрат(1)
                вычислить_квадрат(2)
                вычислить_квадрат(3)
                вычислить_квадрат(4)
                вычислить_квадрат(5)
            notes: |-
                Запустите код. Убедитесь, что ученики видят, откуда берётся этот вывод.
                Теперь у нас всего на две строки меньше, чем на прошлом слайде.

                Объясните ученикам: чем больше повторений, тем полезнее использовать функции.
                Преимущества: меньше кода, а значит, более организованный код, и писать его быстрее.
                Меньше возможностей ошибиться, а если ошибка есть — её легче найти.

                Покажите, что можно изменить что-то в функции, и весь вывод изменится.
        5:
            header: Функции с несколькими аргументами
            text: |-
                Входные данные в скобках функции называются аргументами.
                Для одной функции можно использовать несколько аргументов:
            code: |-
                {def} сказка(принцесса, принц, что_то_ядовитое, выражение_любви)
                ответ = {input}('Хочешь, я расскажу тебе сказку?')
                {if} ответ == да:
                    {print} ('Жила-была девочка по имени ', принцесса)
                    {print} ('Она съела немного ', что_то_ядовитое, ' и почти умерла...')
                    {print} ('Но принц ', принц, ' пришёл навестить её и подарил ей ', выражение_любви )
                    {print} ('Это исцелило ', принцесса ' и она влюбилась в ', принц)
                    {print} (принцесса, ' и ', принц, ' жили долго и счастливо.')
                {else}:
                    {print} ('Не проблема. Может быть, в следующий раз.')

                сказка('Белоснежка', 'Каспер', 'яд', 'поцелуй')
            notes: Запустите код и покажите, что можно изменить все четыре аргумента и получить другую историю.
        6:
            header: Возвращаемое значение
            text: |-
                Иногда нужно использовать число, вычисленное в функции, вне функции.
                С помощью команды `{return}` можно использовать значение вне кода функции.
            code: |-
                {def} вычислить_новую_цену(сумма, процент):
