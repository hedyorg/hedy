            notes: Запустите программу. Один раз ответьте 'пицца', а также дайте другие ответы.
        3:
            header: Отступы важны!
            text: 'Отступы очень важны: они сообщают компьютеру, какие строки нужно повторять, а какие выполнять только один раз.'
            code: |-
                {repeat} 3 {times}
                    {print} 'Эта строка будет повторена...'
                    {print} 'Эта тоже...'
                {print} 'а эта — нет!'
            notes: Ещё раз объясните ученикам важность правильных отступов. Запустите программу и спросите, что произойдёт, если последняя строка тоже будет начинаться с отступа.
