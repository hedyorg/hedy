            header: Покажи и расскажи!
            text: Кто-нибудь хочет показать классу программу, которую сделал?
            notes: Дайте нескольким ученикам показать классу свою работу.
        17:
            header: Заглянем в следующий уровень...
            text: На следующем уровне вы узнаете, как составить список и позволить компьютеру выбрать из него случайный элемент!
    3:
        1:
            header: Добро пожаловать на уровень 3
            text: |-
                К концу этого урока вы сможете:
                * сохранять несколько элементов в переменной — это называется списком.
                * создавать историю, в которой будут происходить случайные события.
                * создавать рисунок, в котором будет нарисовано что-то случайное.
        2:
            header: Составление списка
            text: |-
                Список создаётся с помощью `{is}`.

                Элементы списка разделяются запятой.
            code: животные {is} собаки, кошки, кенгуру
            notes: Попросите учеников записать пример своего собственного списка.
        3:
            header: Случайный выбор
            text: |-
                Список можно использовать с ключевым словом `{at}` `{random}`.
                Компьютер случайным образом выберет один элемент из списка.
                При каждом запуске этого кода вывод будет разным.
            code: |-
                животные {is} собаки, кошки, кенгуру
                {print} животные {at} {random}
            notes: Запустите код несколько раз и покажите ученикам, что вывод каждый раз разный.
        4:
            header: Случайный выбор в предложении
            text: Ключевое слово `{at}` `{random}` можно использовать и внутри предложения.
            code: |-
                животные {is} собаки, кошки, кенгуру
                {print} Моё любимое животное — животные {at} {random}
            notes: |-
                Снова покажите ученикам, что вывод меняется при нескольких запусках кода.
                Можно также изменить порядок слов, чтобы показать, что `{print} животные {at} {random} — моё любимое животное` тоже допустимо.
                Теперь попросите учеников написать ключевые слова print и at random под составленным списком и обменяться кодом с другим учеником.
                Пусть другой ученик предскажет возможный вывод программы.
                Коротко обсудите несколько ответов в классе.
        5:
            header: Начнём!
            text: Приступим к приключениям!
            notes: Давайте поработаем над первыми приключениями!
        6:
            header: Добавить в
            text: Элементы можно добавлять в список с помощью ключевого слова `{add}` `{to_list}`.
            code: |-
                животные {is} собака, кошка, кенгуру
                {add} овца {to_list} животные
                {print} Я выбираю животные {at} {random}
            notes: |-
                Надеемся, ученики заметят, что использовать ключевое слово add to так не имеет особого смысла, ведь овцу можно было сразу поместить в список.
                На следующем слайде будет показано, как использовать add to вместе с ask и переменной, чтобы сделать программу интерактивной.
        7:
            header: Добавить в
            text: |-
                Можно выбрать, что добавить в список, или использовать ключевое слово `{add}` `{to}` вместе с `{ask}`.
                Так игрок сам решает, что добавить в список, и программа становится интерактивной.
            code: |-
                животные {is} собака, кошка, кенгуру
                любимое {is} {ask} Какое твоё любимое животное?
                {add} любимое {to_list} животные
                {print} Я выбираю животные {at} {random}
            notes: |-
                Запустите программу несколько раз, чтобы показать, что выбранное животное теперь добавлено в список.
                Синяя рамка на экране вывода показывает использованные переменные и их значения.
        8:
            header: Удалить из
            text: |-
                Противоположность ключевому слову `{add}` `{to}` — ключевое слово `{remove}` `{from}`.
                Оно удаляет элемент из списка.
            code: |-
                животные {is} собака, кошка, кенгуру
                нелюбимое {is} {ask} Какое животное тебе не нравится?
                {remove} нелюбимое {from} животные
                {print} Я выбираю животные {at} {random}
            notes: |-
                Как только ученики поймут add to, они, скорее всего, легко освоят и remove from.
                Сделайте упражнения 4 и 5.
        9:
            header: Отладка
            text: Давайте отладим этот код!
            code: |-
                музыкальные_жанры {is} рок, поп, метал, инди, джаз
                выбранный_жанр {is} музыка {at} {random}
                {print} Давайте послушаем выбранный жанр
                нравится {ask} Тебе нравится этот жанр?
                {remove} выбранный_жанр {from} выбранный_жанр
                второй_выбор {is} музыкальные_жанры
                {print} или ты предпочитаешь... второй_выбор {at} {random}
                {remove} второй_выбор {to} музыкальные_жанры
                {print} Мне больше всего нравится музыкальный_жанр {random}!
            debug: 'True'
            notes: Покажите, как использовать отладчик и значок глаза.
        10:
            header: Приступим к работе!
            text: Наслаждайтесь приключениями на уровне 3!
        11:
            header: Повторим!
            text: Что вы узнали сегодня?
            notes: Попросите учеников перечислить, что они узнали сегодня.
        12:
            header: Повторим!
            text: |-
                Какое приключение понравилось больше всего? Почему?

                Какое приключение понравилось меньше всего? Почему?
            notes: Спросите мнение учеников.
        13:
            header: Покажи и расскажи!
            text: Кто-нибудь хочет показать классу программу, которую сделал?
            notes: Дайте нескольким ученикам показать классу свою работу.
        14:
            header: Заглянем в следующий уровень...
            text: На следующем уровне вы научитесь использовать кавычки! Ещё на шаг ближе к настоящему коду Python!
    4:
        1:
            header: Добро пожаловать на уровень 4
            text: |-
                К концу этого урока вы сможете:
                * понимать, зачем в программировании нужны кавычки.
                * ставить кавычки в правильных местах.
                * понимать сообщения об ошибках, связанных с неверным использованием кавычек.
            code: "{print} 'Используй кавычки!'"
        2:
            header: Проблема
            text: 'На предыдущих уровнях вы могли столкнуться с такой проблемой:'
            code: |-
                name {is} Софи
                {print} Моё имя — name
            debug: 'True'
            notes: |-
                Этот код не работает на этом уровне!
                Пусть ученики предскажут вывод. Проблема в том, что если использовать имя переменной name, слово name больше нельзя использовать в тексте.
                Вывод этого кода будет «Моё Софи — Софи».
        3:
            header: Исправляем с помощью кавычек
            text: |-
                На этом уровне мы исправим эту проблему с помощью кавычек.

                Кроме того, код станет больше похож на «настоящий» код Python.
            code: |-
                name {is} Софи
                {print} 'Моё имя — ' name
            notes: |-
                Теперь компьютер различает текст 'name' и переменную name.
                Покажите ученикам, что теперь компьютер выводит «Моё имя — Софи».
                Ученик может сказать, что проблему можно было легко исправить, дав переменной другое имя. Это правда, но в программировании важно уметь показывать компьютеру разные типы данных и самому различать обычный текст и переменные.
                Кавычки вроде ' или двойные кавычки вроде ", а также обратные кавычки вроде ` не работают!
        4:
            header: Кавычки с print
            text: Каждый раз, когда используется ключевое слово `{print}`, текст, который должен появиться на экране, нужно заключать в кавычки.
            code: "{print} 'Используй кавычки!'"
        5:
            header: Кавычки с ask
            text: Это относится и к ключевому слову `{ask}`.
            code: name {is} {ask} 'имя, пожалуйста?'
        6:
            header: Кавычки и переменные
            text: |-
                Имена переменных не должны выводиться на экран.
                Поэтому переменные нужно оставлять вне кавычек, вот так:
            code: |-
                name {is} Гарри
                {print} 'Привет, ' name
        7:
            header: Кавычки и переменные
            text: |-
                Если имена переменных используются в середине предложения, переменные нужно оставлять вне кавычек.
                А остальная часть предложения должна быть в кавычках. Это выглядит так:
            code: |-
                name {is} Гарри
                {print} 'Привет, ' name ', как дела?'
        8:
            header: Кавычки и сокращения
            text: |-
                Осторожно! Теперь, когда используются кавычки, нельзя использовать апострофы в сокращениях.

                Попробуйте вывести сокращение вроде "you're" или "I'm" на экране ниже и посмотрите, что произойдёт...
            code: "{print} 'Это не сработает'"
            debug: 'True'
        9:
            header: Исправьте!
            text: Если в тексте нужен апостроф, используйте двойные кавычки, чтобы исправить проблему.
            code: |-
                {print} "Я использую двойные кавычки"
                {print} "Это просто сделать!"
            notes: "Важно начинать и заканчивать одним и тем же типом кавычек: нельзя, например, начать строку с ' а закончить на \"."
        10:
            header: Очистка
            text: |-
                На этом уровне вы также узнаете ключевое слово {clear}.
                С его помощью можно стереть весь текст с экрана вывода.

                Не забывайте использовать и ключевое слово sleep. Иначе компьютер сотрёт весь текст раньше, чем вы успеете его прочитать!
            code: |-
                {print} '3'
                {clear}
                {print} '2'
                {clear}
                {print} '1'
                {clear}
                {print} 'СЮРПРИЗ!'
            notes: Запустите код и покажите программу ученикам. Вы заметите, что 3, 2, 1 прочитать нельзя. Добавьте ключевые слова sleep перед ключевыми словами clear, чтобы исправить программу.
        11:
            header: Рисование в `{color}`
            text: Наконец, можно использовать `{color}`, чтобы сделать рисунки ещё лучше!
            code: |-
                {color} синий
                {forward} 30
                {color} красный
                {forward} 30
                {color} розовый
                {forward} 30
                {color} жёлтый
                {forward} 30
        12:
            header: Отладка
            text: Давайте отладим этот код!
            code: |-
                {clear}
                {print} Какой хороший день, чтобы пойти на пляж!
                {ask} 'Ты хочешь построить замок из песка или поплавать в океане?'
                {print} 'Ты хотел бы activity '
                {print} 'Мне тоже хотелось бы это сделать'
                {print} 'Посмотри на эти красивые ракушки!'
                colors {is} 'оранжевый, серебряный, белый, коричневый'
                {print} 'Мне нравится colors {at} {random}!'
                выбрать {is} {ask} Какая тебе нравится?
            debug: 'True'
            notes: Покажите, как использовать отладчик и значок глаза.
        13:
            header: На старт, внимание, марш!
            text: Наслаждайтесь приключениями на уровне 4!
        14:
            header: Повторим!
            text: Что вы узнали сегодня?
            notes: Попросите учеников перечислить, что они узнали сегодня.
        15:
            header: Повторим!
            text: |-
                Какое приключение понравилось больше всего? Почему?

                Какое приключение понравилось меньше всего? Почему?
            notes: Спросите мнение учеников.
        16:
            header: Покажи и расскажи!
            text: Кто-нибудь хочет показать классу программу, которую сделал?
            notes: Дайте нескольким ученикам показать классу свою работу.
        17:
            header: Заглянем в следующий уровень...
            text: На следующем уровне вы узнаете, как заставить компьютер по-разному реагировать на разные ответы!
    5:
        1:
            header: Добро пожаловать на уровень 5
            text: |-
                К концу этого урока вы сможете:
                * заставлять компьютер по-разному реагировать на разные ответы
                * использовать ключевые слова {if} и {else}
        2:
            header: if
            text: Ключевое слово `{if}` позволяет выбирать между двумя вариантами.
            code: |-
                name {is} {ask} 'как тебя зовут?'
                {if} name {is} Хеди {print} 'мило'
            notes: |-
                Покажите, что в этом примере компьютер выведет 'мило', если ответ — Хеди.
                Если ответ не Хеди, компьютер ничего не сделает.
        3:
            header: Не забудьте про print
            text: |-
                При использовании ключевого слова `{if}` не забывайте про ключевое слово `{print}`.
                Этот код не будет работать!
            code: "{if} name {is} Хеди 'мило'"
            debug: 'True'
            notes: Запустите код и исправьте ошибку, как на следующем слайде.
        4:
            header: Условные конструкции
            text: Код, который идёт после условия if, называется условной конструкцией.
            code: "{if} name {is} Хеди {print} 'мило'"
            notes: "Спросите учеников, что, по их мнению, является условной конструкцией. Здесь это: '{print} 'мило'.'"
        5:
            header: иначе
            text: При использовании ключевого слова `{if}` можно также добавить ключевое слово `{else}`.
            code: "{if} name {is} Хеди {print} 'мило' {else} {print} 'бу!'"
            notes: |-
                Покажите ученикам, что этот код даёт разный вывод при разных ответах:
                Если ответ — Хеди, компьютер выведет 'мило'.
                А если ответ другой, компьютер выведет 'бу'
        6:
            header: Длинные строки
            text: |-
                Вы могли заметить, что строки становятся очень длинными, когда есть и `{if}`, и `{else}`.
                Можно разделить ключевые слова и разместить их на 2 строках, вот так:
            code: |-
                {if} name {is} Хеди {print} 'мило'
                {else} {print} 'бу!'
            notes: |-
                Если ученикам несложно использовать две строки, мы рекомендуем сразу приучать их к двум строкам.
                Это делает программу аккуратнее и пригодится на следующих уровнях.
        7:
            header: Отладка
            text: Давайте отладим этот код!
            code: |-
                {print} Добро пожаловать в службу безопасности HedyAir!
                посадочный_талон {is} {ask} 'У вас есть посадочный талон?'
                {if} посадочный_талон да {print} Отлично!
                {else} Пожалуйста, приготовьте посадочный талон.
                паспорт {is} 'Можно посмотреть ваш паспорт?'
                {if} паспорт {is} да 'спасибо'
                {else} 'Вы не можете лететь без паспорта'
                декларация {is} {ask} Вам есть что декларировать?
                {if} декларация {is} да
                предмет_декларации {is} {ask} 'Что вы хотите задекларировать?'
                {else} Хорошо
                {print} Спасибо. Пожалуйста, пройдите к выходу A22.'
            debug: 'True'
        8:
            header: Вперёд!
            text: Наслаждайтесь приключениями на уровне 5!
        9:
            header: Повторим!
            text: Что вы узнали сегодня?
            notes: Попросите учеников перечислить, что они узнали сегодня.
        10:
            header: Повторим!
            text: |-
                Какое приключение понравилось больше всего? Почему?

                Какое приключение понравилось меньше всего? Почему?
            notes: Спросите мнение учеников.
        11:
            header: Покажи и расскажи!
            text: Кто-нибудь хочет показать классу программу, которую сделал?
            notes: Дайте нескольким ученикам показать классу свою работу.
        12:
            header: Заглянем в следующий уровень...
            text: На следующем уровне вы узнаете, что делать, если нужно 3 или больше вариантов вместо двух (if и else).
    6:
        1:
            header: Добро пожаловать на уровень 6
            text: |-
                К концу этого урока вы сможете:
                * использовать `{elif}`, чтобы добавить третий вариант в условные конструкции
                * использовать `{in}`, чтобы проверить, есть ли элемент в списке
        2:
            header: Повторим if и else
            text: Можете придумать код с `{if}` и `{else}`?
            code: |-
                пицца {is} {ask} 'Какая твоя любимая?'
                {if} пицца {is} пепперони
                {print} 'Да! Пепперони — лучшая!'
                {else}
                {print} 'Пепперони всё равно лучше!'
            notes: |-
                Дайте ученикам вместе придумать код, содержащий if и else.
                Когда они закончат, покажите пример кода и попросите предсказать результат.
                Также напомните, что часть после оператора {if} называется условной конструкцией.
        3:
            header: Использование нескольких строк
            text: Условные конструкции — это часть после {if} или {else}. С этого момента их следует размещать на следующей строке.
            code: |-
                аккуратно {is} {ask} 'Хочешь, чтобы твой код выглядел красиво и аккуратно?'
                {if} аккуратно {is} 'да'
                {print} 'Отличные новости! Всегда ставь условную конструкцию на вторую строку!'
                {else}
                {print} 'Как жаль! Всё равно ставь условную конструкцию на следующую строку!'
            notes: |
                Если ученикам трудно понять, почему условные конструкции нужно ставить на следующую строку, можно сказать им, что на следующем уровне они научатся размещать несколько строк кода после {if} или {else}.
        4:
            header: '`{elif}`'
            text: '`{elif}` — это комбинация ключевых слов `{else}` и `{if}`, нужная, когда требуется 3 (или больше!) варианта.'
            code: |-
                пицца {is} {ask} 'Какая твоя любимая?'
                {if} пицца {is} пепперони
                {print} 'Да! Пепперони — лучшая!'
                {elif} пицца {is} гавайская
                {print} 'Ты с ума сошёл?! Гавайская — худшая!'
                {else}
                {print} 'Пепперони всё равно лучше!'
            notes: Покажите ученикам этот код и попросите предсказать 3 возможных исхода. Затем пусть придумают свои идеи для кода с 3 или более вариантами.
        5:
            header: '`{in}`'
            text: Если вы потренировались с ключевыми словами `{if}`, `{else}` и `{elif}`, можно попробовать и ключевое слово `{in}`.
            code: |-
                красивые_цвета {is} зелёный, жёлтый
                любимый_цвет {is} {ask} 'Какой твой любимый цвет?'
                {if} любимый_цвет {in} красивые_цвета {print} 'красиво!'
                {else} {print} 'так себе'
            notes: |-
                С `{in}` можно заставить компьютер проверить, есть ли элемент в списке. Покажите пример.
                Обратите внимание, что Хеди различает регистр. Это значит, что если ответить «Зелёный» вместо «зелёный», Хеди выведет «так себе».
        6:
            header: Поддержание чистоты кода
            text: |-
                Теперь, когда вы знакомитесь со всё большим числом команд, программы становятся длиннее.
                Иногда код получается запутанным и трудным для чтения. Чтобы сделать код красивым и читаемым, можно добавлять комментарии с решёткой в начале строки, вот так:
            code: |-
                # Задаём имя персонажа
                имя {is} {ask} 'Как будет звать твоего персонажа?'
                {print} 'Его зовут ' имя

                # Бросаем кубик
                числа = 1, 2, 3
                бросок = числа {at} {random}

                # Назначаем питомца
                {if} бросок {is} 1
                    {print} имя ' получает собаку'
                {elif} бросок {is} 2
                    {print} имя ' получает кошку'
                {else}
                    {print} имя ' получает попугая'
        7:
