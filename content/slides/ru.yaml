        11:
            header: Покажи и расскажи!
            text: Хочешь показать классу свою программу?
            notes: |-
                Предложите нескольким ученикам показать свои работы классу.
        12:
            header: Заглянем на следующий уровень…
            text: |-
                На следующем уровне ты узнаешь, что делать, если нужны три или больше вариантов вместо двух (if и else).
    6:
        1:
            header: Добро пожаловать на уровень 6
            text: |-
                К концу этого урока ты сможешь:
                * Использовать `{elif}`, чтобы добавить третий вариант условного действия
                * Использовать `{in}`, чтобы проверить, есть ли элемент в списке
        2:
            header: Повторим if и else
            text: |-
                Можешь придумать код с `{if}` и `{else}`?
            code: |-
                пицца {is} {ask} 'Какая пицца тебе нравится больше всего?'
                {if} пицца {is} пепперони
                {print} 'Да! Пепперони лучше всех!'
                {else}
                {print} 'Пепперони лучше!'
            notes: |-
                Предложите ученикам вместе придумать код с if и else.
                Когда они закончат, покажите пример и попросите предположить результат.
                Заодно напомните, что часть после условия {if} называется условным действием.
        3:
            header: Используем несколько строк
            text: |-
                Условные действия — это часть после {if} или {else}. Теперь их нужно писать на следующей строке.
            code: |-
                аккуратно {is} {ask} 'Хочешь, чтобы твой код выглядел аккуратно?'
                {if} аккуратно {is} 'да'
                {print} 'Отличная новость! Условное действие всегда нужно писать на второй строке!'
                {else}
                {print} 'Жаль! Но условное действие всё равно нужно писать на следующей строке!'
            notes: |
                Если ученикам трудно понять, зачем переносить условные действия на следующую строку, объясните, что на следующем уровне они научатся писать несколько строк кода после {if} или {else}.
        4:
            header: '`{elif}`'
            text: |-
                `{elif}` объединяет ключевые слова `{else}` и `{if}`. Оно нужно, когда ты хочешь сделать три варианта (или даже больше!).
            code: |-
                пицца {is} {ask} 'Какая пицца тебе нравится больше всего?'
                {if} пицца {is} пепперони
                {print} 'Да! Пепперони лучше всех!'
                {elif} пицца {is} гавайская
                {print} 'Ты шутишь?! Гавайская хуже всех!'
                {else}
                {print} 'Пепперони лучше!'
            notes: |-
                Покажите код ученикам и предложите предположить три возможных результата. Затем попросите придумать свои идеи для программы с тремя или более вариантами.
        5:
            header: "`{in}`"
            text: |-
                Потренировавшись с `{if}`, `{else}` и {elif}, ты можешь попробовать ключевое слово `{in}`.
            code: |-
                красивые_цвета {is} зелёный, жёлтый
                любимый_цвет {is} {ask} 'Какой твой любимый цвет?'
                {if} любимый_цвет {in} красивые_цвета {print} 'красиво!'
                {else} {print} 'так себе'
            notes: |-
                С помощью `{in}` компьютер проверяет, есть ли элемент в списке. Покажите пример.
                Обратите внимание: Hedy различает прописные и строчные буквы. Если ответить «Зелёный» вместо «зелёный», Hedy выведет «так себе».
        6:
            header: Пишем аккуратный код
            text: |-
                Ты узнаёшь всё больше команд, и твои программы становятся длиннее.
                Иногда код бывает неаккуратным и трудным для чтения. Чтобы сделать его понятнее, добавляй комментарии, начиная строку со знака решётки, вот так:
            code: |-
                # Имя персонажа
                имя {is} {ask} 'Как будут звать твоего персонажа?'
                {print} 'Имя персонажа — ' имя

                # Бросаем кубик
                числа = 1, 2, 3
                бросок = числа {at} {random}

                # Выбираем питомца
                {if} бросок {is} 1
                    {print} имя ' получает собаку'
                {elif} бросок {is} 2
                    {print} имя ' получает кошку'
                {else}
                    {print} имя ' получает попугая'
        7:
            header: Отладка
            text: Давай отладим этот код!
            code: |-
                {print} 'Добро пожаловать в магазин мороженого.'
                вкус {is} {ask} 'Какой вкус ты хочешь?'
                {if} вкус клубничное
                {print} 'Хороший выбор!'
                вкус {is} ванильное
                {print} 'Точно не хочешь клубничное?''
                {else}
                {print} Извини, у нас есть только ванильное и клубничное.
                шарики {is} 'Сколько шариков ты хочешь?'
                {if} шарики {is} 1
                {print} С тебя 1.50.
                {elif} {is} 2
                {print} 'С тебя 2.50.'
                {else} 'Извини, это слишком много.'
            debug: 'True'
        8:
            header: Повторим!
            text: |-
                Какое приключение тебе понравилось больше всего? Почему?

                Какое приключение тебе понравилось меньше всего? Почему?

            notes: |-
                Спросите мнение учеников.
        9:
            header: Повторим!
            text: Что нового ты узнал сегодня?
            notes: |-
                Попросите учеников перечислить, чему они сегодня научились.
        10:
            header: Покажи и расскажи!
            text: Хочешь показать классу свою программу?
            notes: |-
                Предложите нескольким ученикам показать свои работы классу.
        11:
            header: Заглянем на следующий уровень…
            text: |-
                На следующем уровне ты научишься выполнять вычисления в Hedy.
    7:
        1:
            header: Добро пожаловать на уровень 7
            text: |-
                К концу этого урока ты сможешь:
                * Выполнять вычисления в Hedy
                * Использовать десятичные дроби в Hedy
                * Использовать переменные в вычислениях в Hedy
            notes: |-
                Спросите учеников, в каких случаях в программе могут понадобиться вычисления (например, подсчёт стоимости, количества людей, очков в игре и т. д.).
                Можно также спросить, как это будет выглядеть в коде. Скорее всего, они сами предложат знаки + и -.
        2:
            header: Сложение
            text: Чтобы сложить числа, просто используй знак плюса.
            code: '{print} ''5 плюс 5 равно '' 5 + 5'
            notes: |-
                Кратко покажите ученикам пример кода.
        3:
            header: Вычитание
            text: Чтобы вычесть одно число из другого, используй знак минуса.
            code: '{print} ''5 минус 5 равно '' 5 - 5'
            notes: |-
                Кратко покажите ученикам пример кода.
        4:
            header: Умножение
            text: Для умножения используй звёздочку.
            code: '{print} ''5 умножить на 5 равно '' 5 * 5'
            notes: |-
                Кратко покажите ученикам пример кода.
        5:
            header: Деление
            text: Для деления используй косую черту.
            code: '{print} ''5 разделить на 5 равно '' 5 / 5'
            notes: |-
                Кратко покажите ученикам пример кода.
        6:
            header: Подведём итог
            text: Итак, для вычислений можно использовать знаки +, -, * и /.
            code: |-
                {print} '5 плюс 5 равно ' 5 + 5
                {print} '5 минус 5 равно ' 5 - 5
                {print} '5 умножить на 5 равно ' 5 * 5
                {print} '5 разделить на 5 равно ' 5 / 5
            notes: |-
                Обратите внимание: сами вычисления не нужно заключать в кавычки.
                Предложите ученикам предположить, что выведет программа, если записать вычисления внутри кавычек.
        7:
            header: Знак =
            text: |-
                Теперь вместо ключевого слова `{is}` можно использовать знак =.
                Это работает и с числами, и со словами, в том числе после ключевых слов `{if}` или `{else}`.
            code: |-
                имя = Hedy
                ответ = 20 + 4
            notes: |-
                Кратко покажите ученикам пример кода.
        8:
            header: Вычисления с переменными
            text: 'В вычислениях можно использовать не только числа, но и переменные, вот так:'
            code: |-
                число_1 = {ask} 'Введи первое число:'
                число_2 = {ask} 'Введи второе число:'
                правильный_ответ = число_1 * число_2
                {print} число_1 ' умножить на ' число_2 ' равно ' правильный_ответ
            notes: |-
                Покажите ученикам пример кода и обратите их внимание на расположение кавычек.
                Если на предыдущих слайдах ученики предлагали примеры вычислений в Hedy, спросите, как мог бы выглядеть такой код.
                Например, если ученик предложил «подсчёт очков в игре», теперь он может придумать такой код:
                ```
                {if} ответ = правильный_ответ
                    очки = очки + 1
                {else}
                    очки = очки - 1
                ```
                Если ученикам пока трудно сделать это самостоятельно или в парах, выполните задание всем классом.
        9:
            header: Десятичные дроби
            text: |-
                До сих пор в Hedy нельзя было использовать десятичные дроби вроде 1.5, а теперь можно. Обрати внимание: в компьютерах целую и дробную части разделяют точкой.
            code: |-
                {print} 'Два с половиной плюс два с половиной равно...'
                {print} 2.5 + 2.5
        10:
            header: Отладка
            text: Давай отладим этот код!
            code: |-
                {print} 'Это автомат по продаже билетов в аквапарк'
                {print} 'Цены: детям до 12 лет — 3 доллара, взрослым — 5 долларов'
                {print} 'По понедельникам скидка 25%'
                количество_детей = 'Сколько детских билетов ты хочешь?'
                количество_взрослых = 'Сколько взрослых билетов ты хочешь?'
                день_недели = {ask} 'Какой сегодня день недели?'
                {clear}
                цена_детей = количество детей * 3
                цена_взрослых = количество_взрослых + 5
                общая_цена = цена_взрослых * цена_детей
                {if} день {is} понедельник
                общая_цена = общая_цена * 0.25
                {print} 'С тебя общая_цена'
            debug: 'True'
            notes: |-
                Отладьте этот код вместе с учениками.
        11:
            header: За работу!
            text: Увлекательных приключений на уровне 7!
            notes: |-
                Теперь ученики могут выполнять все приключения этого уровня.
        12:
            header: Повторим!
            text: |-
                Какое приключение тебе понравилось больше всего? Почему?

                Какое приключение тебе понравилось меньше всего? Почему?

            notes: |-
                Спросите мнение учеников.
        13:
            header: Повторим!
            text: Что нового ты узнал сегодня?
            notes: |-
                Попросите учеников перечислить, чему они сегодня научились.
        14:
            header: Покажи и расскажи!
            text: Хочешь показать классу свою программу?
            notes: |-
                Предложите нескольким ученикам показать свои работы классу.
        15:
            header: Заглянем на следующий уровень…
            text: |-
                На следующем уровне ты научишься повторять строку кода несколько раз!
    8:
        1:
            header: Добро пожаловать на уровень 8
            text: |-
                К концу этого урока ты сможешь:
                * Выполнять одну строку кода несколько раз
        2:
            header: Повторяем 3 раза
            text: |-
                Предположи, что выведет этот код:
            code: |-
                {print} 'Принц всё звал на помощь'
                {repeat} 5 {times} {print} 'Помогите!'
                {print} 'Почему мне никто не помогает?'
            notes: |-
                Предложите ученикам предположить, что появится на экране.
                Объясните: чтобы повторить строку кода, можно использовать `{repeat}` 3 `{times}`. Чтобы повторить её больше раз, достаточно изменить число.
                Например, если вы программируете историю, в которой герой пять раз зовёт на помощь, код может выглядеть как в примере.
        3:
            header: Не забудь ключевое слово print
            text: Используя repeat, не забывай про ключевое слово `{print}`.
            code: '{repeat} 5 {times} ''Помогите!'''
            debug: 'True'
            notes: |-
                Отладьте этот код вместе с учениками.
        4:
            header: Повторяем команду ask
            text: Можно также повторять команды `{ask}`, `{if}` или `{else}` несколько раз.
            code: |-
                {repeat} 2 {times} ответ = {ask} 'Ты знал, что вопрос можно задать несколько раз?'
                {if} ответ {is} да
                {repeat} 2 {times} {print} 'Ты это уже знал!'
                {else}
                {repeat} 3 {times} {print} 'Теперь ты знаешь что-то новое!'
            notes: |
                Снова попросите учеников предположить результат.
        5:
            header: 'Используй # для аккуратного кода'
            text: |-
                Не забывай делать код аккуратным и понятным: добавляй строки, начинающиеся с #, и объясняй в них, что делает эта часть программы!
            code: |-
                # Выводим совет
                {print} 'Пиши код так же аккуратно!'
        6:
            header: Отладка
            text: Давай отладим этот код!
            code: |-
                {print} Ты оказался на необитаемом острове.
                {repeat} 3 'Помогите!'
                спасён = {ask} Кто-нибудь пришёл на помощь?
                {if} спасён да {is}
                {print} Повезло!
                {else} {repeat} 3 {times} 'ПОМОГИТЕ!'
                спасён = 'А теперь?'
                {if} да
                {print} 'Ура!
                {else} 'Как жаль... Ну что ж... пора строить укрытие и искать еду.'
            debug: 'True'
            notes: |-
                Отладьте этот код вместе с учениками.
        7:
            header: На старт, внимание, марш!
            text: Увлекательных приключений на уровне 8!
            notes: |-
                Теперь ученики могут выполнять все приключения этого уровня.
        8:
            header: Повторим!
            text: Что нового ты узнал сегодня?
            notes: |-
                Попросите учеников перечислить, чему они сегодня научились.
        9:
            header: Повторим!
            text: |-
                Какое приключение тебе понравилось больше всего? Почему?

                Какое приключение тебе понравилось меньше всего? Почему?

            notes: |-
                Спросите мнение учеников.
        10:
            header: Покажи и расскажи!
            text: Хочешь показать классу свою программу?
            notes: |-
                Предложите нескольким ученикам показать свои работы классу.
        11:
            header: Поздравляем!
            text: |-
                Ты завершил Hedy Basic!
                Теперь ты знаешь основы программирования и уже создал свои первые программы!

                Если хочешь учиться дальше, переходи на уровень 9 — в Hedy Advanced!
        12:
            header: Заглянем на следующий уровень…
            text: |-
                Теперь ты умеешь повторять одну строку кода. Пора научиться повторять сразу несколько строк!
    9:
        1:
            header: Добро пожаловать на уровень 9
            text: |-
                Добро пожаловать в Hedy Advanced!

                На предыдущих уровнях ты освоил основы программирования! Теперь пора писать более сложные программы и изучать новые ключевые слова.

                К концу этого урока ты сможешь:
                * Повторять несколько строк кода
                * Правильно использовать отступы с {repeat}, {if} и {else}
        2:
            header: 'Команда {repeat} на уровне 8'
            text: |-
                Раньше команда repeat выглядела так.
            code: '{repeat} 5 {times} {print} ''Помогите!'''
            debug: 'True'
            notes: |-
                Напомните ученикам, что на предыдущем уровне они научились использовать repeat.
                Тогда можно было повторять только одну строку кода. На этом уровне они научатся повторять несколько строк.
        3:
            header: 'Команда {repeat} теперь'
            text: |-
                Как ты думаешь, что появится на экране?
            code: |-
                {repeat} 5 {times}
                    {print} 'Всем привет'
                    {print} 'Это будет выведено 5 раз'
            notes: |-
                Сначала снова попросите учеников предположить результат. Затем объясните:
                На этом уровне можно повторять несколько строк кода. Для этого нужно указать компьютеру, какие строки связаны между собой и должны повторяться.
                Это делается с помощью отступов. Добавляйте четыре пробела (или одну табуляцию) в начале каждой строки, которую нужно повторять.
        4:
            header: 'Команда {repeat} теперь'
            text: |-
                А что выведет этот код?
            code: |-
                {repeat} 3 {times}
                    {print} 'Привет!'
                {print} 'Повторение закончено!'
            notes: |-
                Спросите учеников, какие строки, по их мнению, будут повторяться, и запустите код.
                Объясните: после команды `{repeat}` можно продолжить писать код без отступа.
                Строки, которые начинаются без отступа, повторяться не будут.
        5:
            header: if и else раньше
            text: |-
                Как будут выглядеть команды {if} и {else} с отступами?
            code: |-
                {if} имя {is} Hedy
                {print} 'здорово'
                {else}
                {print} 'бу!'
            debug: 'True'
            notes: |-
                Так команды {if} и {else} выглядели раньше. Как они будут выглядеть теперь, когда можно использовать отступы?
        6:
            header: if и else теперь
            text: |-
                Теперь команды `{if}` и `{else}` выглядят так.
            code: |-
                имя = {ask} 'Как тебя зовут?'
                {if} имя {is} Hedy
                    {print} 'Добро пожаловать, Hedy'
                {else}
                    {print} 'Добро пожаловать, программист!'
            notes: |-
                Покажите ученикам, что отступы — это не просто лишняя работа по добавлению табуляции: они очень полезны.
                Добавьте несколько строк в пример и покажите, что теперь после {if} или {else} можно писать несколько строк вместо одной.
        7:
            header: Заканчиваем отступ
            text: Предположи результат
            code: "имя = {ask} 'Как тебя зовут?'\n{if} имя {is} Hedy\n    {print} 'Добро пожаловать, Hedy'\n{else}\n    {print} 'Добро пожаловать, программист!'\n{print} '3..2..1.. Начни программировать!'"
            notes: |-
                Предложите ученикам предположить результат и внимательно посмотреть на отступы.
                Как и с командой `{repeat}`, можно перестать делать отступ, и эти строки будут выполняться всегда.
                Не только когда условие истинно. Поэтому строки без отступа не зависят от условия {if} или {else}.
