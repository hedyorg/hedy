            text: Что вы узнали сегодня?
            notes: Попросите учеников перечислить, что они узнали сегодня.
        14:
            header: Покажи и расскажи!
            text: Кто-нибудь хочет показать классу программу, которую сделал?
            notes: Дайте нескольким ученикам показать классу свою работу.
        15:
