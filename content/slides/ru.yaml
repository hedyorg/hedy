    13:
        1:
            header: Добро пожаловать на уровень 13
            text: |-
                Добро пожаловать в Hedy Expert (уровни 13–16)!

                К концу этого урока ты сможешь:
                * Писать код, который является (почти) настоящим кодом Python
        2:
            header: Настоящий код Python
            text: |-
                До сих пор мы использовали упрощённый код.
                Теперь мы будем использовать настоящий код Python, который пригодится и за пределами Hedy.
            notes: |-
                Объясните ученикам, что Python — широко используемый язык программирования.
                До сих пор мы использовали разные упрощённые версии этого языка.
                Теперь мы дошли до того, что весь код, используемый в Hedy, является настоящим кодом Python, и его можно использовать в других местах.
                Также объясните, что изменений довольно много, но сами по себе они небольшие.
        3:
            header: '{print} в Python'
            text: Теперь с {print} нужно использовать круглые скобки.
            code: |-
                {print} ('Теперь этот код похож на настоящий код Python.')
                {print} ('Теперь ты можешь выводить текст и за пределами Hedy.')
                {print} ('Поздравляем, ты стал мастером программирования!')
            notes: |-
                Попросите учеников вспомнить, как раньше записывали команду print.
                Затем покажите новый код и убедитесь, что все заметили круглые скобки.
        4:
            header: '{ask}'
            text: Мы также заменим `{ask}` ключевым словом `{input}`, которое используется в Python, — тоже с круглыми скобками.
            code: |-
                возраст = {input} ('Сколько тебе лет?')
                {print} ('Тебе', возраст, 'лет.')
        5:
            header: '{print} с переменными'
            text: |-
                Ты можешь выводить переменные вместе с текстом, разделяя их запятыми:
            code: |-
                уровень = {input}('На каком ты уровне?')
                {print}('Удачи на уровне', уровень)
            notes: |-
                Предложите ученикам предположить результат этого кода.
                Затем запустите его и покажите, что текст внутри кавычек выводится буквально, а переменная вне кавычек заменяется своим значением.
                Покажите, что будет, если в последней строке заключить 'уровень' в кавычки.
        6:
            header: '`{if}` и `{else}`'
            text: |-
                Теперь в условии if нужно использовать два знака равенства: ==. Так принято в большинстве языков программирования. А в конце строки с if теперь нужно двоеточие.
            code: |-
                любимая_птица = input('Какая твоя любимая птица?')
                {if} любимая_птица == 'пингвин':
                    {print}('Да, моя тоже!')
                {elif} любимая_птица == 'попугай':
                    {print}('Отличный выбор!')
                {else}:
                    {print}("Нет, я не согласен")
            notes: |-
                Ученикам нужно привыкнуть к новому синтаксису. Это может быть трудно и вызывать раздражение, поэтому дайте им побольше возможностей потренироваться.
        7:
            header: '{range} в настоящем Python'
            text: |-
                Чтобы считать с помощью {range}, теперь тоже нужны круглые скобки.
            code: |-
                {for} i in {range} (1, 10):
                    {print} (i)
                {print} ('Мы досчитали до 10.')
            notes: |-
                Попросите учеников вспомнить, как они использовали эту команду раньше.
        8:
            header: Меньше и больше
            text: |-
                Возможно, ты уже знаешь знаки < и >. Знак < проверяет, меньше ли первое число второго. Например, возраст < 12 проверяет, меньше ли возраст, чем 12. Знак > проверяет, больше ли первое число второго. Например, очки > 10 проверяет, больше ли очки, чем 10.
            code: |-
                число = {input} ('Выбери число меньше 10')
                {if} число < 10:
                    {print}('Здорово, ты выбрал число!')
                {if} число > 10:
                    {print}('Это число не меньше 10.')
            notes: |-
                Покажите код ученикам. Попросите предположить, что произойдёт при разных числах.
                Запустите код с разными числами.
                В конце попробуйте число 10 и покажите, что программа ничего не выводит.
                Число 10 не больше и не меньше 10, поэтому вывода нет. На следующем слайде мы это исправим.
        9:
            header: Больше или равно
            text: |-
                Есть и знак «больше или равно».
                Видишь отличие от предыдущего кода?
            code: |-
                число = {input} ('Выбери число меньше 10')
                {if} число < 10:
                    print('Здорово, ты выбрал число!')
                {if} число >= 10:
                    print('Это число не меньше 10.')
            notes: |-
                Снова запустите код с разными числами, в том числе с числом 10.
                Убедитесь, что ученики понимают причину различий.
        10:
            header: Меньше или равно
            text: |-
                Есть и знак «меньше или равно».
                Он работает так же.
            code: |-
                число = {input} ('Выбери число между 10 и 20')
                {if} число <= 10:
                    print('Выбери другое число')
                {if}
                    print('Здорово, ты выбрал число!')
                {if} число >= 10:
                    print('Это число не меньше 10.')
            notes: |-
                Снова запустите код с разными числами, в том числе с числом 10.
                Убедитесь, что ученики понимают причину различий.
                Покажите, что так же можно сравнивать с помощью «меньше или равно», заменяя '>=' на '>' и '<=' на '<'.
        11:
            header: Равно или не равно
            text: Теперь для проверки равенства и неравенства тоже нужно использовать специальные знаки.
            code: |-
                ответ = {input} ('Сколько будет 5+5?')
                {if} ответ = 10:
                    {print} ('Ты дал правильный ответ!')
                {if} ответ != 10:
                    {print} ('Неверно. Попробуй ещё раз!')
            notes: |-
                Спросите учеников, что, по их мнению, означает знак '!='.
                Затем запустите код и покажите, что он означает «не равно».
