        13:
            header: Отладка
            text: Отладка кода — это исправление ошибок в нём. Давай вместе отладим этот код. Нажми кнопку с божьей коровкой, чтобы запустить отладчик.
            code: |-
                {print} Добро пожаловать в магазин пончиков!
                начинка {is} Какую начинку ты хочешь?
                {print} Твой выбор... Начинка! Вкусно!
                посыпка {ask} Какую посыпку ты хочешь?
                посыпка — это вкусно!
                {print} Пойду за твоим пончиком. {sleep}
                {print} Вот он! Пончик с начинка и посыка!
                {ask} Хорошего дня!
            debug: 'True'
            notes: |-
