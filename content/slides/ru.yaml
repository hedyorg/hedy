    10:
        1:
            header: Добро пожаловать на уровень 10
            text: |-
                К концу этого урока ты сможешь:
                * Вкладывать команды {if} и {repeat} друг в друга
                * Правильно использовать отступы с {repeat}, {if} и {else}
                * Использовать ключевые слова {and} и {or}
            notes: Использование команды {if} внутри другой команды {if} называется вложенностью.
        2:
            header: Вложенность с `{repeat}`
            text: На этом уровне ты можешь сочетать `{repeat}` и `{if}`. Это называется вложенностью.
            code: |-
                {repeat} 3 {times}
                    еда = {ask} 'Что ты хочешь?'
                    {if} еда {is} пицца
                        {print} 'здорово!'
                    {else}
                        {print} 'пицца лучше'
            notes: Запустите программу. Один раз ответьте «пицца», а затем попробуйте другие ответы.
        3:
            header: Отступы важны!
            text: 'Отступы очень важны: они показывают компьютеру, какие строки нужно повторять, а какие — выполнить только один раз.'
            code: |-
                {repeat} 3 {times}
                    {print} 'Эта строка будет повторяться...'
                    {print} 'И эта тоже...'
                {print} 'А эта — нет!'
            notes: |-
                Ещё раз напомните ученикам о важности правильных отступов. Запустите программу и спросите, что будет, если последняя строка тоже начнётся с отступа.
        4:
            header: Вложенность с `{if}`
            text: Можно также использовать `{if}` внутри `{if}`.
            code: |-
                продолжить = {ask} 'Хочешь продолжить?'
                {if} продолжить = да
                    точно = {ask} 'Точно?'
                    {if} точно {is} да
                        {print} 'Продолжаем'
                    {else}
                        {print} 'Ты не уверен'
                {else}
                    {print} 'Ты не хочешь продолжать'
            notes: Запустите программу несколько раз с разными ответами. Спросите учеников, какие ответы нужно дать, чтобы получить тот или иной результат.
        5:
            header: Отступы важны
            text: Отступы по-прежнему очень важны и могут сильно изменить поведение кода.
            code: |-
                продолжить = {ask} 'Хочешь продолжить?'
                {if} продолжить = да
                    точно = {ask} 'Точно?'
                    {if} точно {is} да
                        {print} 'Продолжаем'
                {else}
                    {print} 'Ты не уверен'
            notes: |-
                Поэкспериментируйте с отступами и покажите ученикам, что будет, если, например, убрать отступ перед второй командой {if}.
        6:
            header: Запутанный код
            text: |-
                Вложенность очень полезна, но иногда из-за неё код становится запутанным. Посмотри на этот пример:
            code: |-
                {print} 'Попробую угадать, кто ты'
                цвет_волос = {ask} 'Какого цвета твои волосы?'
                очки = {ask} 'Ты носишь очки?'
                {if} цвет_волос {is} чёрные
                    {if} очки {is} да
                        {print} 'Наверное, ты Джейд!'
                    {else}
                        {print} 'Наверное, ты Ахмед!'
                {elif} цвет_волос {is} светлые
                    {if} очки {is} да
                        {print} 'Наверное, ты Патрик!'
                    {else}
                        {print} 'Наверное, ты Миранда!'
                {else}
                    {print} 'Наверное, ты Джеки!'
            notes: |-
                Спросите учеников, у кого светлые волосы и нет очков. На чтение кода понадобится время.
                Покажите, что на следующем слайде код гораздо проще читать благодаря ключевому слову and.
        7:
            header: 'Ключевое слово {and}'
            text: |-
                Здесь пригодится ключевое слово `{and}`.

                С ним код гораздо понятнее, а об отступах можно беспокоиться меньше!
            code: |-
                {print} 'Попробую угадать, кто ты'
                цвет_волос = {ask} 'Какого цвета твои волосы?'
                очки = {ask} 'Ты носишь очки?'
                {if} цвет_волос {is} чёрные {and} очки {is} да
                    {print} 'Наверное, ты Джейд!'
                {elif} цвет_волос {is} чёрные {and} очки {is} нет
                    {print} 'Наверное, ты Ахмед!'
                {elif} цвет_волос {is} светлые {and} очки {is} да
                    {print} 'Наверное, ты Патрик!'
                {elif} цвет_волос {is} светлые {and} очки {is} нет
                    {print} 'Наверное, ты Миранда!'
                {else}
                    {print} 'Наверное, ты Джеки!'
            notes: |-
                Если теперь спросить учеников, у кого светлые волосы и нет очков, они ответят гораздо быстрее.
                Умение писать понятный код — ценный навык, а использование and наверняка покажется ученикам естественным.
        8:
            header: 'Ключевое слово {or}'
            text: |-
                Помимо ключевого слова `{and}`, есть ещё и `{or}`!
            code: |-
                {print} 'Выбери число от 1 до 6'
                {print} 'Два из этих чисел принесут тебе приз!'

                список_чисел = 1, 2, 3, 4, 5, 6
                призовое_число = список_чисел {at} {random}
                {remove} призовое_число {from} список_чисел
                второе_призовое_число = список_чисел {at} {random}

                выбранное_число = {ask} 'Какое число ты выбираешь?'
                {if} выбранное_число {is} призовое_число {or} выбранное_число {is} второе_призовое_число
                    {print} 'Ура! Ты выиграл приз!'
                {else}
                    {print} 'Увы, тебе не достался приз...'
            notes: |-
                Покажите ученикам этот код. Скорее всего, он покажется им понятным.
