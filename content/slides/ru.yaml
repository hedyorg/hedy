            text: |-
                К концу этого урока:
                * Ты сможешь создать цикл {while}.
                * Ты пройдёшь весь Hedy!
        2:
            header: Новый цикл
            text: |-
                С помощью ключевого слова {while} можно создать новый цикл.
                Он будет повторяться, пока условие истинно.
            code: |-
                температура = 15
                {while} температура < 25:
                    {print} ('Сейчас ', температура, ' градусов.')
                    {print} ('Без куртки на улицу выходить нельзя.')
                    температура = температура + 2
                {print} ('Сейчас ', температура, ' градусов. Теперь можно выйти без куртки.')
            notes: |-
                Попросите учеников предположить результат этого кода. При какой температуре он сообщит, что можно выходить без куртки?
                Запустите код и проверьте ответы. Затем спросите, что произойдёт, если убрать строку 'температура = температура + 2'.
                Покажите, что получится бесконечный цикл, потому что температура всегда остаётся ниже 25.
        3:
            header: '{while} и {input}'
            text: Ты можешь сочетать ключевое слово {while} с вопросами.
            code: |-
                {while} ответ != Hedy:
                    ответ = {input} ('Как меня зовут?')
                {print} ('Верно. Приятно познакомиться. Я Hedy!')
            notes: |-
                Снова попросите учеников предположить результат. Сколько раз программа задаст вопрос?
                Покажите, что вопрос будет повторяться, пока не будет дан правильный ответ — 'Hedy'.
        4:
            header: Отладка
            text: Давай отладим этот код!
            code: |-
                {print} ('Сейчас мы создадим улучшенную версию программы для вычислений. ')

                {def} проверить_ответ вопрос, правильный_ответ
                    {while} данный_ответ != правильный ответ
                    данный_ответ = {input} ('Сколько будет ' вопрос '?' )
                        {play} C2
                        {print} (Неверно. Попробуй ещё раз!)

                        {print} (Молодец, ты дал правильный ответ.)
                    {play} C5


                проверить_ответ 3+9, 12
                проверить ответ (7*8, 56)
            debug: 'True'
            notes: |-
                Отладьте этот код вместе.

        6:
            header: Посмотрим на приключения!
            text: Увлекательных приключений на уровне 16!
            notes: |-
                Теперь ученики могут выполнять все приключения уровня 16.
        7:
            header: Повторим!
            text: Что нового ты узнал сегодня?
            notes: |-
                Попросите учеников перечислить, чему они сегодня научились.
        8:
            header: Повторим!
            text: |-
                Какое приключение тебе понравилось больше всего? Почему?

                Какое приключение тебе понравилось меньше всего? Почему?

            notes: |-
                Спросите мнение учеников.
        9:
            header: Покажи и расскажи!
            text: Хочешь показать классу свою программу?
            notes: |-
                Предложите нескольким ученикам показать свои работы классу.
        10:
            header: Заглянем в твоё будущее…
            text: |-
                Это был последний уровень. Но это не значит, что теперь нужно перестать программировать.
                Ты многому научился и можешь создавать много интересных программ.
                Что ты хотел бы запрограммировать самостоятельно?
            notes: Предложите ученикам обсудить, что они хотели бы запрограммировать в будущем. Поддержите их идеи!
