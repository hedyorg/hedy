                    {else}
                        {print} 'Ты не уверен'
                {else}
                    {print} 'Ты не хочешь продолжать'
            notes: Запустите программу несколько раз с разными ответами. Спросите учеников, какие ответы нужно дать, чтобы получить тот или иной вывод.
