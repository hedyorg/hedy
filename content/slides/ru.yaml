levels:
    0:
        1:
            header: Добро пожаловать в Хеди!
            text: |-
                Добро пожаловать в язык программирования Хеди!

                Учителя, пожалуйста, нажмите S на клавиатуре, чтобы увидеть заметки докладчика.
            notes: Попросите учеников записать несколько слов, которые у них ассоциируются с программированием. Проведите быстрый опрос, чтобы услышать ответы.
        2:
            header: Программирование
            text: |-
                Программирование — это передача инструкций компьютеру на языке компьютера.

                Такой язык называется «языком программирования».
            notes: |-
                К сожалению, компьютеры не понимают обычный человеческий язык, например английский, — они говорят на своём языке.
                Не паникуйте: вам не придётся вводить строки из нулей и единиц, мы научимся давать компьютеру инструкции на языке программирования.
        3:
            header: Язык программирования
            text: |-
                Может быть, вы уже знаете какие-нибудь языки программирования?
                Некоторые примеры:
                * Scratch
                * Python
                * HTML
            notes: Спросите учеников об их опыте программирования или о том, знают ли они кого-нибудь, кто работает в IT.
        4:
            header: Программирование
            text: |-
                Если умеешь программировать, можно делать много крутых вещей:
                * Создавать интерактивные истории
                * Рисовать на компьютере и переносить рисунки на бумагу или ткань
                * Создавать собственные приложения для телефона
            notes: Это может звучать очень сложно, но мы будем учиться программированию шаг за шагом.
        5:
            header: Программирование в Хеди
            text: В Хеди мы используем специальные «ключевые слова», например `{print}`.
            code: '{print} Добро пожаловать в Хеди!'
            notes: |-
                Давайте посмотрим на Хеди. В Хеди мы используем кодовые слова (ключевые слова), чтобы дать компьютеру инструкцию.
                Мы вводим эти инструкции в левой части экрана. Это и называется кодом, или программой.
        6:
            header: Программирование в Хеди
            text: Ключевые слова отображаются розовым.
            code: '{print} Добро пожаловать в Хеди!'
            notes: Как видите, кодовые слова (или ключевые слова) становятся розовыми, если использовать их правильно.
        7:
            header: Программирование в Хеди
            text: Код запускается кнопкой «Запустить код» под кодом.
            code: '{print} Добро пожаловать в Хеди!'
            notes: Чтобы компьютер выполнил инструкции, нужно «запустить» код. Нажмите кнопку, чтобы показать ученикам, что произойдёт.
        8:
            header: Программирование в Хеди
            text: Вывод появляется справа.
            code: '{print} Добро пожаловать в Хеди!'
            notes: Когда мы запускаем код, появляется вывод. Вывод — это результат выполнения программы. Правая часть экрана, где появляется вывод, называется экраном вывода.
        9:
            header: Программирование в Хеди
            text: Выводом может быть и рисунок.
            code: |-
                {forward} 100
                {turn} {left}
            notes: 'В Хеди можно выводить не только текст: выводом может быть рисунок или...'
        10:
            header: Программирование в Хеди
            text: А ещё выводом может быть музыка!
            code: |-
                {play} C4
                {play} D4
                {play} E4
            notes: Перейдём на первый уровень, чтобы начать!
        11:
            header: Переход к следующему приключению через меню
            text: Используйте меню, чтобы перейти к следующему приключению или уровню.
            editor: /hedy/1
            notes: Иногда ученики не знают, как перейти к следующему приключению, — покажите им, как это сделать в Хеди.
        12:
            header: Программирование в Хеди
            text: Иногда в коде бывает ошибка. С помощью отладчика можно найти ошибку (баг) и исправить её.
            code: |-
                {print} Отладка — это поиск ошибки
                {print} Код можно выполнять построчно
                {print} Так легче найти ошибку
                {print} И исправить её!
                {print} Или нажмите на значок глаза, чтобы отключить строку кода
            debug: 'True'
            notes: |-
                **Как отлаживать код**
                Посмотрите это <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">видео</a>, чтобы увидеть, как работает отладчик, или прочитайте инструкции.
                Конечно, можно просто посмотреть на код и найти ошибки самому, но у нас есть инструменты, которые помогут.
                Нажмите на кнопку с божьей коровкой 🐞 под полем ввода. Это запускает **отладчик**. С его помощью программу можно выполнять построчно.
                Если в коде есть серьёзная ошибка (как в приключениях по отладке), отладчик скажет сначала исправить серьёзные ошибки. Прочитайте сообщения об ошибках, чтобы понять, как их исправить.
                Если серьёзных ошибок нет, отладчик будет выполнять программу построчно.
                Чтобы выполнить следующую строку, нажмите кнопку ⏭️ справа. Строка делает то, что должна? Отлично! Нажмите кнопку ещё раз, чтобы выполнить следующую строку, и так до тех пор, пока программа не заработает идеально.
                Чтобы остановить отладчик, нажмите кнопку 🛑 в середине.
                Чтобы начать выполнение кода с начала, нажмите кнопку 🔁 слева.
                Застряли на строке кода и хотите попробовать программу без неё?
                Строку можно отключить, нажав на значок глаза перед номером строки. Строка будет зачёркнута.
                Теперь эта строка будет пропускаться при выполнении кода. Чтобы снова включить строку, просто нажмите на значок глаза, и она перестанет пропускаться.
    1:
        1:
            header: Добро пожаловать на уровень 1!
            text: |-
                К концу этого урока вы сможете:
                * писать код, который выводит текст
                * создавать интерактивную историю
        2:
            header: '{print}'
            text: |-
                Первая команда, которую можно использовать на уровне 1, — `{print}`.

                `{print}` используется, чтобы показать текст на экране.
            code: '{print} Покажи этот текст на экране'
            notes: Сначала пусть ученики угадают, каким будет вывод. Затем запустите код, чтобы показать, что происходит при выполнении кода `print`.
        3:
            header: Ключевое слово {print}
            text: |-
                Текст после ключевого слова print можно менять как угодно.

                А можно вывести несколько строк, добавив ещё одну строку кода, которая тоже начинается с `{print}`.
            code: |-
                {print} Добро пожаловать в Хеди!
                {print} Начинай программировать!
            notes: Запустите код, а затем измените его на что-нибудь своё. Покажите, что можно выводить что угодно.
        4:
            header: '{ask}'
            text: |-
                Вторая команда, которую можно использовать на уровне 1, — `{ask}`.

                `{ask}` используется, чтобы задать вопрос, на который можно ответить.
            code: |-
                {print} Добро пожаловать в твои собственные «Камень, ножницы, бумага»!
                {ask} Что ты выберешь?
            notes: |-
                Покажите, что теперь компьютер задаёт вопрос. Введите ответ и покажите, что после ввода ответа ничего не происходит.
                Объясните ученикам, что компьютер выполняет только ваши инструкции и ничего не делает сам. Это значит, что если нужно, чтобы компьютер вывел ответ, нужно дать ему такую инструкцию.
        5:
            header: '{answer}'
            text: |-
                Чтобы показать ответ на экране вывода, можно использовать `{answer}`.
                `{answer}` никогда не используется сам по себе, только вместе с `{ask}`.
            code: |-
                {print} Привет!
                {ask} Как тебя зовут?
                {print} привет {answer}
            notes: Чтобы компьютер повторил ответ, используется ключевое слово `answer`.
        6:
            header: Программирование!
            text: Здесь можно найти список приключений.
            editor: /hedy/1
            notes: Перед началом покажите ученикам приключения. Не забудьте указать на упражнения. Именно там ученики прочитают, что именно нужно делать в приключении.
        7:
            header: Программирование!
            text: Жёлтые кнопки со стрелками используются для копирования примеров.
            editor: /hedy#print_command
            notes: Наконец, покажите ученикам, что пример кода можно скопировать в поле программирования, нажав жёлтую кнопку.
        8:
            header: Начнём!
            text: |-
                Самое время попробовать первые приключения.
                Используйте меню, чтобы перейти к следующему приключению. Если нужно снова прочитать объяснение ключевого слова, вернитесь к приключению со значком лампочки.
            editor: /hedy/1
            notes: Приступим!
        9:
            header: Отладка
            text: Отладка кода означает избавление от ошибок в коде. Давайте отладим этот код вместе. Нажмите кнопку с божьей коровкой, чтобы запустить отладчик.
            code: |-
                Я диджей Хеди
                {print} Какую песню ты хочешь услышать?
                {ask} Мне тоже нравится эта песня!
                {print} Следующая... {answer}
            debug: 'True'
            notes: |-
                **Как отлаживать код**
                Посмотрите это <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">видео</a>, чтобы увидеть, как работает отладчик, или прочитайте инструкции.
                Конечно, можно просто посмотреть на код и найти ошибки самому, но у нас есть инструменты, которые помогут.
                Нажмите на кнопку с божьей коровкой 🐞 под полем ввода. Это запускает **отладчик**. С его помощью программу можно выполнять построчно.
                Если в коде есть серьёзная ошибка (как в приключениях по отладке), отладчик скажет сначала исправить серьёзные ошибки. Прочитайте сообщения об ошибках, чтобы понять, как их исправить.
                Если серьёзных ошибок нет, отладчик будет выполнять программу построчно.
                Чтобы выполнить следующую строку, нажмите кнопку ⏭️ справа. Строка делает то, что должна? Отлично! Нажмите кнопку ещё раз, чтобы выполнить следующую строку, и так до тех пор, пока программа не заработает идеально.
                Чтобы остановить отладчик, нажмите кнопку 🛑 в середине.
                Чтобы начать выполнение кода с начала, нажмите кнопку 🔁 слева.
                Застряли на строке кода и хотите попробовать программу без неё?
                Строку можно отключить, нажав на значок глаза перед номером строки. Строка будет зачёркнута.
                Теперь эта строка будет пропускаться при выполнении кода. Чтобы снова включить строку, просто нажмите на значок глаза, и она перестанет пропускаться.
        10:
            header: Играем музыку
            text: |-
                Играйте ноты с помощью `{play}`
                Ноты идут: C - D - E - F - G - A - B
                Поставьте число после ноты, чтобы выбрать октаву: октавы идут от 1 до 10.
            code: |
                {play} C4
                {play} D4
                {play} E4
                {play} F4
                {play} G4
                {play} A4
                {play} B4
                {play} C5
            notes: Покажите ученикам, как использовать ключевое слово `{play}` в Хеди. Это также хороший момент, чтобы повторить правила класса об использовании наушников.
        11:
            header: 'Рисование черепашкой: {forward}'
            text: '`{forward}` используется, чтобы двигать черепашку вперёд.'
            code: '{forward} 50'
            notes: Теперь, когда мы увидели текстовые команды, посмотрим на команды рисования. Покажите ученикам, как использовать ключевое слово forward.
        12:
            header: 'Рисование черепашкой: {forward}'
            text: Как двигаться назад?
            code: '{forward} -50'
            notes: Спросите учеников, есть ли у них идеи, как двигаться назад. Ответ — использовать отрицательное число, например -50.
        13:
            header: 'Рисование черепашкой: {turn}'
            text: '`{turn}` используется, чтобы повернуть черепашку влево или вправо.'
            code: |-
                {forward} 50
                {turn} {left}
        14:
            header: Отладка
            text: Использование отладчика при рисовании
            code: |-
                {forward} 50
                {turn} {left}
                {forward} 100
                {turn} {left}
                {forward} 50
                {turn} {left}
            debug: 'True'
            notes: Отладчик может пригодиться при создании рисунка.
        15:
            header: Повторим!
            text: Что вы узнали сегодня?
            notes: Попросите учеников перечислить, что они узнали сегодня.
        16:
            header: Повторим!
            text: |-
                Какое приключение понравилось больше всего? Почему?

                Какое приключение понравилось меньше всего? Почему?
            notes: Спросите мнение учеников.
        17:
            header: Покажи и расскажи!
            text: Кто-нибудь хочет показать классу программу, которую сделал?
            notes: Дайте нескольким ученикам показать классу свою работу. Это можно сделать, перейдя на страницу класса и нажав на приключения учеников.
        18:
            header: Заглянем в следующий уровень...
            text: |-
                На следующем уровне вы узнаете, как использовать переменную, чтобы сделать программы ещё более интерактивными!
                А ещё научитесь использовать ключевое слово `{sleep}`, чтобы приостановить код!
    2:
        1:
            header: Добро пожаловать на уровень 2
            text: |-
                К концу этого урока вы сможете:
                * сохранять что-то в переменной
                * создавать историю или рисунок с использованием переменных
            notes: Ученикам может быть трудно понять концепцию переменной. Мы заметили, что несколько примеров переменных помогают лучше усвоить её.
        2:
            header: Проблема
            text: На предыдущем уровне вы могли столкнуться с такой проблемой...
            code: |-
                {print} Добро пожаловать в ресторан!
                {ask} Что бы вы хотели съесть?
                {print} Вы хотели бы съесть... {answer}
                {ask} Что бы вы хотели выпить?
                {print} Вы хотели бы выпить... {answer}
                {print} Спасибо за заказ у нас!
                {print} Наслаждайтесь вашим ... {answer}
            notes: |-
                Внимание: этот код не работает на этом уровне. Не запускайте программу, просто обсудите её.
                Дайте ученикам посмотреть на программу и предсказать вывод.
                Надеемся, они придут к выводу, что в последней строке будет только «Наслаждайтесь вашим (напитком, который заказали)», а еду компьютер забудет.
                С помощью 'ask' компьютер помнит только один элемент. На этом уровне вы научитесь использовать переменные, чтобы решить эту проблему.
        3:
            header: Что такое переменная?
            text: |-
                Переменная — это место в памяти компьютера, где хранится ответ на вопрос. 
                Это может звучать сложно, но посмотрите пример.
            code: |-
                answer {is} {ask} Как тебя зовут?
                {print} Привет, answer
            notes: |-
                В информатике слово «переменная» описывает место в памяти компьютера, где хранится изменяющаяся информация.
                Переменная похожа на коробку или контейнер, в котором лежит то, что меняется. Коробка остаётся той же, а содержимое может меняться.
                Покажите ученикам, как работают переменные. Обратите внимание, что имя переменной `answer` в последней строке заменяется значением переменной.
                Синяя рамка на экране вывода показывает использованные переменные и их значения.
        4:
            header: Команда `{is}`
            text: Чтобы создать или «задать» переменную, используется команда `{is}`. Имя переменной стоит перед `{is}`, а команда `{ask}` — после. Имя переменной можно выбрать и использовать не только `answer`.
            code: |-
                name {is} {ask} Как тебя зовут?
                {print} Привет, name
            notes: Попросите учеников придумать свои примеры.
        5:
            header: Переменные
            text: Переменную можно задать и без вопроса. Имя переменной стоит перед `{is}`, а значение переменной — после.
            code: |-
                еда {is} гамбургер
                напиток {is} вода
                {print} Я хотел бы съесть еда.
                {print} Я хотел бы выпить напиток.
            notes: Спросите учеников, могут ли они придумать другую переменную (рост, размер обуви, цвет волос и т.д.), и добавьте свои примеры в код.
        6:
            header: Несколько переменных
            text: Теперь, когда мы используем переменные, можно применять несколько переменных вместо одной `answer`.
            code: |-
                имя {is} Хеди
                возраст {is} 15
                {print} имя is возраст лет
        7:
            header: Пауза
            text: Можно также использовать ключевое слово `{sleep}`, чтобы приостановить код на время.
            code: |-
                {print} Мой любимый цвет —...
                {sleep} 2
                {print} зелёный!
            notes: |-
                Покажите ученикам ключевое слово '{sleep}'. Спросите, что, по их мнению, означает 2.
                Замените 2 на другое число, чтобы показать, что можно самому решать, на сколько секунд приостановить код.
        8:
            header: Пауза 5
            text: |-
                После ключевого слова `{sleep}` можно добавить число, если нужна более длинная пауза.

                При желании можно даже использовать переменную вместо числа, чтобы задать длительность паузы.
            code: |-
                пауза {is} 10
                {print} Мой любимый цвет —...
                {sleep} пауза
                {print} зелёный!
            notes: Покажите код и при желании даже замените 10 на ключевое слово `{ask}`.
        9:
            header: Рисование с переменными
            text: |-
                На уровне 1 вы научились использовать {forward} 100.
                Теперь можно использовать и переменную.
            code: |-
                расстояние {is} {ask} Как далеко мне идти?
                {forward} расстояние
            notes: |-
                Покажите ученикам, что теперь переменные можно использовать и с рисующей черепашкой!
                Запустите код несколько раз с разными ответами, чтобы показать использование переменных.
        10:
            header: Рисование с градусами
            text: Раньше можно было использовать {turn} {left} или {turn} {right}, теперь можно использовать градусы!
            code: |-
                {forward} 100
                {turn} 45
                {forward} 100
            notes: Покажите ученикам код. На следующем слайде мы покажем разные углы.
        11:
            header: Градусы
            text: |-
                Полный круг — 360 градусов.
                Половина круга — 180 градусов.
                Поворот направо — 90 градусов.
                Поворот налево — 270 градусов.

                Можно вписать любое число.
            code: |-
                {turn} 90
                {forward} 100
            notes: |-
                Убедитесь, что ученики понимают градусы. Они могли уже изучать это на математике, но для кого-то это может быть совершенно новым.
                Если ученики никогда не слышали о градусах, полезно показать им круговую шкалу градусов. Можно даже распечатать её для них.
                Используйте пример кода на слайдах, чтобы показать разные углы.
        12:
            header: Градусы и переменные
            text: Градусы тоже могут быть переменными!
            code: |-
                градусы {is} {ask} На сколько градусов должна повернуться черепашка?
                {turn} градусы
                {forward} 100
            notes: Покажите ученикам, что количество градусов тоже может быть переменной.
        13:
            header: Отладка
            text: Отладка кода означает избавление от ошибок в коде. Давайте отладим этот код вместе. Нажмите кнопку с божьей коровкой, чтобы запустить отладчик.
            code: |-
                {print} Добро пожаловать в магазин пончиков!
                начинка {is} Какую начинку вы хотите?
                {print} Вы выбрали... Начинку! Вкусно!
                топпинг {ask} Какой топпинг вы хотите?
                топпинг — это вкусно!
                {print} Я принесу ваш пончик. {sleep}
                {print} Вот, пожалуйста! Пончик с начинкой и топпингом!
                {ask} Хорошего дня!
            debug: 'True'
            notes: Покажите, как использовать отладчик и значок глаза.
        14:
            header: Повторим!
            text: Что вы узнали сегодня?
            notes: Попросите учеников перечислить, что они узнали сегодня.
