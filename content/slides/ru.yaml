    9:
        1:
            header: Добро пожаловать на уровень 9
            text: |-
                Добро пожаловать в Hedy Advanced!

                На предыдущих уровнях вы изучили основы программирования! Теперь пора перейти к более сложным программам и изучить более сложные ключевые слова.

                К концу этого урока вы сможете:
                * повторять несколько строк кода
                * правильно использовать отступы с {repeat}, {if} и {else}
        2:
            header: Ключевые слова {repeat} на уровне 8
            text: Раньше ключевое слово repeat выглядело так.
            code: "{repeat} 5 {times} {print} 'Помогите!'"
            debug: 'True'
            notes: |-
                Напомните ученикам, что они научились использовать ключевое слово repeat на предыдущем уровне.
                Повторять можно было только одну строку кода. На этом уровне вы научитесь повторять несколько строк кода.
        3:
            header: Ключевые слова {repeat} теперь
            text: Как вы думаете, каким будет вывод?
            code: |-
                {repeat} 5 {times}
                    {print} 'Привет всем'
                    {print} 'Это будет выведено 5 раз'
            notes: |-
                Сначала снова попросите учеников предсказать вывод. Затем объясните:
                На этом уровне можно повторять несколько строк кода. Для этого нужно сообщить компьютеру, какие строки относятся друг к другу и должны повторяться.
                Для этого используются отступы. Используйте 4 пробела (или одну табуляцию) в начале каждой строки, которую нужно повторить.
        4:
            header: Ключевые слова {repeat} теперь
            text: А как будет выглядеть этот вывод?
            code: |-
                {repeat} 3 {times}
                    {print} 'Привет!'
                {print} 'Мы закончили повторять!'
            notes: |-
                Спросите учеников, какие строки, по их мнению, будут повторены, и запустите код.
                Объясните: при желании после ключевого слова `{repeat}` можно продолжать без отступа.
                Строки, которые не начинаются с отступа, не будут повторяться.
        5:
            header: if и else раньше
            text: Как будут выглядеть ключевые слова {if} и {else} с отступами?
            code: |-
                {if} name {is} Хеди
                {print} 'мило'
                {else}
                {print} 'бу!'
            debug: 'True'
            notes: Вот так {if} и {else} выглядели всегда. А как они будут выглядеть теперь, когда можно использовать отступы?
        6:
            header: if и else теперь
            text: Вот так теперь выглядят ключевые слова `{if}` и `{else}`.
            code: |-
                имя = {ask} 'Как тебя зовут?'
                {if} имя {is} Хеди
                    {print} 'Добро пожаловать, Хеди'
                {else}
                    {print} 'Добро пожаловать, программист!'
            notes: |-
                Покажите ученикам, что отступы — это не просто лишняя работа с табуляцией, а очень полезная вещь.
                Продемонстрируйте, что теперь после {if} или {else} можно писать несколько строк вместо одной, добавив несколько строк кода в пример.
        7:
            header: Завершение отступа
            text: Предскажите вывод
            code: |-
                имя = {ask} 'Как тебя зовут?'
                {if} имя {is} Хеди
                    {print} 'Добро пожаловать, Хеди'
                {else}
                    {print} 'Добро пожаловать, программист!' 
                {print} '3..2..1.. Начинаем программировать!'
            notes: |-
                Пусть ученики предскажут вывод кода и внимательно посмотрят на отступы.
                Как и с ключевым словом `{repeat}`, можно прекратить использовать отступ, и строки будут показываться всегда.
                Не только если условие истинно. То есть строки без отступа не зависят от оператора {if} или {else}.
        8:
            header: Отладка
            text: Давайте отладим этот код!
            code: |-
                {print} 'Автомат по продаже билетов на автобусы HedyWheels'
                зона_1 = Ратуша, Библиотека, Кампус, Рыночная площадь
                зона_2 = Бассейн, Скейт-парк, Торговый центр, Аэропорт
                пункт_назначения = 'Куда вы хотите поехать?'
                {if} пункт_назначения {in} зона 1
                {print} пункт_назначения ' находится в зоне 1'
                цена = 3 евро
                    {if} пункт_назначения {is} зона_2
                {print} пункт_назначения ' находится в зоне 2'
                цена = 6
                типы_билетов = {ask} 'Нажмите 1 для билета в одну сторону.
                Нажмите 2 для билета туда и обратно:'
                {if} тип_билета = 1
                {print} 'Вы выбрали билет в одну сторону'
                {else}
                        {print} Вы выбрали билет туда и обратно'
                цена * 2
