                {print} ('Верно. Приятно познакомиться. Я Хеди!')
            notes: |-
                Снова попросите учеников предсказать результат. Сколько раз будет задан вопрос?
                Покажите, что вопрос будет задаваться, пока не будет дан правильный ответ, а именно «Хеди».
        4:
            header: Отладка
            text: Давайте отладим этот код!
            code: |-
                {print} ('Сейчас мы сделаем улучшенную версию инструмента для вычислений. ')

                {def} проверить_ответ(вопрос, правильный_ответ)
                    {while} данный_ответ != правильный_ответ
                    данный_ответ = {input} ('Сколько будет ' вопрос '?' )
                        {play} C2
                        {print} (Неверно. Попробуй ещё!)

                        {print} (Молодец, ты дал правильный ответ.)
                    {play} C5


                проверить_ответ 3+9, 12
                проверить_ответ (7*8, 56)
            debug: 'True'
            notes: Отладьте этот код вместе.
        6:
            header: Посмотрим приключения!
            text: Наслаждайтесь приключениями на уровне 16!
            notes: Теперь ученики могут выполнять все приключения уровня 16.
        7:
            header: Повторим!
            text: Что вы узнали сегодня?
            notes: Попросите учеников перечислить, что они узнали сегодня.
        8:
            header: Повторим!
            text: |-
                Какое приключение понравилось больше всего? Почему?

                Какое приключение понравилось меньше всего? Почему?
            notes: Спросите мнение учеников.
        9:
            header: Покажи и расскажи!
            text: Кто-нибудь хочет показать классу программу, которую сделал?
            notes: Дайте нескольким ученикам показать классу свою работу.
        10:
            header: Заглянем в ваше будущее...
            text: |-
                Это был последний уровень. Но это не значит, что нужно прекращать программировать.
                Вы многому научились и можете создавать много интересных программ.
                Что бы вы хотели запрограммировать сами?
            notes: Дайте ученикам обсудить, что бы они хотели запрограммировать в будущем. Поощряйте их!
