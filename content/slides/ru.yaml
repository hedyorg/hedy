    7:
        1:
            header: Добро пожаловать на уровень 7
            text: |-
                К концу этого урока вы сможете:
                * использовать математику в Хеди
                * использовать десятичные числа в Хеди
                * использовать переменные в математике в Хеди
            notes: |-
                Спросите учеников, когда в коде может понадобиться математика (например, расчёт цены, количества людей, очков в игре и т.д.).
                Можно также спросить, как это будет выглядеть. Скорее всего, они сами предложат + и -.
        2:
            header: Сложение
            text: Чтобы выполнить сложение, просто используйте знак плюс.
            code: "{print} '5 плюс 5 — это ' 5 + 5"
            notes: Кратко покажите ученикам пример кода.
        3:
            header: Вычитание
            text: Чтобы выполнить вычитание, используйте знак минус.
            code: "{print} '5 минус 5 — это ' 5 - 5"
            notes: Кратко покажите ученикам пример кода.
        4:
            header: Умножение
            text: Чтобы выполнить умножение, используйте звёздочку.
            code: "{print} '5 умножить на 5 — это ' 5 * 5"
            notes: Кратко покажите ученикам пример кода.
        5:
            header: Деление
            text: Для деления можно использовать косую черту.
            code: "{print} '5 разделить на 5 — это ' 5 / 5"
            notes: Кратко покажите ученикам пример кода.
        6:
            header: Итог
            text: Итак, для вычислений можно использовать +, -, * и /.
            code: |-
                {print} '5 плюс 5 — это ' 5 + 5
                {print} '5 минус 5 — это ' 5 - 5
                {print} '5 умножить на 5 — это ' 5 * 5
                {print} '5 разделить на 5 — это ' 5 / 5
            notes: |-
                Обратите внимание, что математический код не нуждается в кавычках.
                Пусть ученики предскажут, каким будет вывод, если поместить математический код в кавычки.
        7:
            header: Символ =
            text: |-
                С этого момента можно также использовать символ = вместо ключевого слова `{is}`.
                Это касается и чисел, и слов, а также используется после ключевых слов `{if}` или `{else}`.
            code: |-
                name = Хеди
                answer = 20 + 4
            notes: Кратко покажите ученикам пример кода.
        8:
            header: Вычисления с переменными
            text: 'Вычисления можно выполнять с числами, но и с переменными тоже можно, вот так:'
            code: |-
                число_1 = {ask} 'Введите первое число:'
                число_2 = {ask} 'Введите второе число:'
                правильный_ответ = число_1 * число_2
                {print} число_1 ' умножить на ' число_2 ' равно ' правильный_ответ
            notes: |-
                Покажите ученикам пример кода и обратите их внимание на расстановку кавычек.
                Если на предыдущих слайдах ученики предлагали примеры использования математики в Хеди, спросите, как, по их мнению, будет выглядеть этот код.
                Например, если ученик предложил «подсчёт очков в игре», теперь он может предложить код:
                ```
                {if} answer = correct_answer
                    points = points + 1
                {else}
                    points = points - 1
                ```
                Если это слишком сложно для индивидуальной или парной работы, выполните упражнение вместе со всем классом.
        9:
            header: Десятичные числа
            text: До сих пор Хеди не допускала десятичных чисел вроде 1.5, но теперь это разрешено. Обратите внимание, что компьютеры используют . для десятичных чисел.
            code: |-
                {print} 'Два с половиной плюс два с половиной — это...'
                {print} 2.5 + 2.5
        10:
            header: Отладка
            text: Давайте отладим этот код!
            code: |-
                {print} 'Это автомат по продаже билетов в аквапарк'
                {print} 'Прайс-лист: дети до 12 лет — $3, взрослые — $5'
                {print} 'По понедельникам скидка 25%'
                количество_детей = 'Сколько детских билетов вы хотите?'
                количество_взрослых = 'Сколько взрослых билетов вы хотите?'
                день_недели = {ask} 'Какой сегодня день?'
                {clear}
                цена_детская = количество детей * 3
                цена_взрослая = количество_взрослых + 5
                итого = цена_взрослая * цена_детская
                {if} день {is} понедельник
                итого = итого * 0.25
                {print} 'С вас итого, пожалуйста'
            debug: 'True'
            notes: Отладьте этот код вместе с учениками.
        11:
