        1:
            header: Benvenuti al livello 9
            text: |-
                Benvenuti in Hedy Avanzato!

                Nei livelli precedenti hai imparato le basi dell'informatica! Ora è il momento di andare avanti, scrivere programmi più complessi e imparare alcune parole chiave più difficili.

                Alla fine di questa lezione, saprai:
                * ripetere più righe di codice
                * usare correttamente l'indentazione con {repeat}, {if} e {else}
        2:
            header: Le parole chiave {repeat} nel livello 8
            text: Prima la parola chiave repeat si usava così.
            code: "{repeat} 5 {times} {print} 'Aiuto!'"
            debug: 'True'
            notes: |-
                Ricorda agli studenti che hanno imparato a usare la parola chiave repeat nel livello precedente.
                Si poteva ripetere solo una riga di codice. In questo livello imparerai a ripetere più righe di codice.
        3:
            header: Le parole chiave {repeat} adesso
            text: Secondo te quale sarà l'output?
            code: |-
                {repeat} 5 {times}
                    {print} 'Ciao a tutti'
                    {print} 'Questo verrà stampato 5 volte'
            notes: |-
                Prima chiedi di nuovo ai tuoi studenti di prevedere l'output. Poi spiega:
                In questo livello puoi ripetere più righe di codice. Per farlo devi dire al computer quali righe vanno insieme e devono essere ripetute.
                Lo fai usando l'indentazione. Usa 4 spazi (o una tabulazione) all'inizio di ogni riga che vuoi ripetere.
        4:
            header: Le parole chiave {repeat} adesso
            text: E come sarebbe questo output?
            code: |-
                {repeat} 3 {times}
                    {print} 'Ciao!'
                {print} 'Abbiamo finito di ripetere!'
            notes: |-
                Chiedi agli studenti quali righe pensano che verranno ripetute ed esegui il codice.
                Spiega: se vuoi, puoi continuare dopo la parola chiave `{repeat}` senza indentazione.
                Le righe che non iniziano con l'indentazione non verranno ripetute.
        5:
            header: if e else prima
            text: Come saranno le parole chiave {if} e {else} con l'indentazione?
            code: |-
                {if} nome {is} Hedy
                {print} 'fantastico'
                {else}
                {print} 'buuu!'
            debug: 'True'
            notes: Ecco come sono sempre state {if} e {else}. Come saranno ora che possiamo usare l'indentazione?
        6:
            header: if e else adesso
            text: Ecco come sono adesso le parole chiave `{if}` e `{else}`.
            code: |-
                nome = {ask} 'Come ti chiami?'
                {if} nome {is} Hedy
                    {print} 'Benvenuta Hedy'
                {else}
                    {print} 'Benvenuto nel mondo della programmazione!'
            notes: |-
                Mostra agli studenti che usare l'indentazione non significa solo il lavoro in più di aggiungere una tabulazione, ma che è molto utile.
                Dimostra come ora puoi scrivere più righe dopo un {if} o un {else} invece di una sola, aggiungendo qualche riga di codice all'esempio.
        7:
            header: Smettere di indentare
            text: Prevedi l'output
            code: |-
                nome = {ask} 'Come ti chiami?'
                {if} nome {is} Hedy
                    {print} 'Benvenuta Hedy'
                {else}
                    {print} 'Benvenuto nel mondo della programmazione!'
                {print} '3..2..1.. Inizia a programmare!'
            notes: |-
                Chiedi ai tuoi studenti di prevedere l'output del codice e invitali a osservare con attenzione l'indentazione.
                Proprio come con la parola chiave `{repeat}`, puoi smettere di usare l'indentazione e quelle righe verranno sempre mostrate.
                Non solo se la condizione è vera. Quindi, le righe senza indentazione non dipendono dall'istruzione {if} o {else}.
        8:
            header: Debugging
            text: Facciamo il debugging di questo codice!
            code: |-
                {print} 'Biglietteria automatica degli autobus HedyWheels'
