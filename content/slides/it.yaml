    5:
        1:
            header: Benvenuti al livello 5
            text: |-
                Alla fine di questa lezione, saprai:
                * far reagire il computer in modo diverso a seconda delle risposte.
                * usare le parole chiave {if} e {else}
        2:
            header: if
            text: La parola chiave `{if}` ti permette di scegliere tra due opzioni.
            code: |-
                nome {is} {ask} 'come ti chiami?'
                {if} nome {is} Hedy {print} 'fantastico'
            notes: |-
                Mostra come in questo esempio il computer stamperà 'fantastico' se la risposta data è Hedy.
                Se la risposta non è Hedy, il computer non farà nulla.
        3:
            header: Non dimenticare print
            text: |-
                Quando usi la parola chiave `{if}`, non dimenticare di usare la parola chiave `{print}`.
                Questo codice non funzionerà!
            code: "{if} nome {is} Hedy 'fantastico'"
            debug: 'True'
            notes: Esegui il codice e correggi il bug come nella prossima slide.
        4:
            header: Condizionali
            text: Il codice che segue una condizione if si chiama condizionale.
            code: "{if} nome {is} Hedy {print} 'fantastico'"
            notes: "Chiedi agli studenti quale pensano che sia il condizionale. Eccolo: '{print} 'fantastico'.'"
        5:
            header: else
            text: Quando usi una parola chiave `{if}`, puoi aggiungere anche una parola chiave `{else}`.
            code: "{if} nome {is} Hedy {print} 'fantastico' {else} {print} 'buuu!'"
            notes: |-
                Mostra agli studenti come questo codice darà output diversi per risposte diverse:
                Se la risposta è Hedy, il computer stamperà 'fantastico'.
                Ma se la risposta è un'altra, il computer stamperà 'buuu'
        6:
            header: Righe lunghe
            text: |-
                Forse hai notato che le righe possono diventare molto lunghe quando hai sia una parola chiave `{if}` sia una parola chiave `{else}`.
                Puoi scegliere di separare le parole chiave e metterle su 2 righe, così:
            code: |-
                {if} nome {is} Hedy {print} 'fantastico'
                {else} {print} 'buuu!'
            notes: |-
                Se ai tuoi studenti non dispiace usare due righe, ti consigliamo di iniziare subito a usarne due.
                Così il programma è meno disordinato e questo tornerà utile nei livelli successivi.
        7:
            header: Debugging
            text: Facciamo il debugging di questo codice!
            code: |-
                {print} Benvenuti ai controlli di sicurezza di HedyAir!
                carta_imbarco {is} {ask} 'Hai la tua carta di imbarco?'
                {if} carta_imbrco sì {print} Ottimo!
                {else} Per favore, prepara la tua carta di imbarco.
                passaporto {is} 'Posso vedere il tuo passaporto, per favore?'
                {if} passaporto {is} sì 'grazie'
                {else} 'Senza passaporto non c'è volo'
                dichiarare {is} {ask} Hai qualcosa da dichiarare?
                {if} dichiarare {is} sì
                oggetto_da_dichiarare {is} {ask} 'Cosa vorresti dichiarare'
                {else} Va bene
                {print} Grazie. Prosegui verso il gate A22.'
            debug: 'True'
