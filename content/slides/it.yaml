            header: Benvenuti al livello 12
            text: |-
                Alla fine di questa lezione, saprai:
                * usare le funzioni
            notes: |-
                In questo livello gli studenti conosceranno le funzioni. Può essere un concetto difficile da afferrare per i ragazzi.
                Più gli studenti si esercitano con le avventure, migliore sarà la loro comprensione.
                Quindi fai in modo che gli studenti non passino troppo tempo a cercare di capire e ne passino di più a fare da soli: capiranno facendo!
        2:
            header: Funzioni!
            text: |-
                In questo livello imparerai a usare le funzioni. Una funzione è un blocco di codice che puoi usare facilmente più volte.

                Esercizio:
                * Scrivi il testo della canzone 'Twinkle twinkle little star' (Brilla brilla la stellina)
                * Evidenzia le parti del testo che si ripetono
            notes: |-
                Per mostrare agli studenti a cosa potrebbe servire una funzione, usiamo Twinkle twinkle little star.
                Le parti del testo che si ripetono sono: 'Twinkle', 'Twinkle', 'Little star', 'How I wonder what you are?'
        3:
            header: Twinkle Twinkle little star!
            text: |-
                In questo programma vedi un esempio di funzione.
                Vediamo cosa succede se completi il resto della canzone!
            code: |-
                {define} twinkle
                     {print} 'Twinkle'
                     {print} '...'
            notes: |-
                Aggiungi alla funzione le parti del testo che si ripetono: 'Twinkle', 'Little star', 'How I wonder what you are?'.
                Spiega agli studenti che questa parte è la funzione e mostra loro che hai chiamato la funzione twinkle.
                Nella prossima slide chiameremo la funzione due volte per completare la canzone.
        4:
            header: Funzioni
            text: Come hai visto nell'esempio, una funzione è un blocco di codice che può essere chiamato in qualsiasi momento. Usi `{define}` per definire la funzione e `{call}` per usarla.
            code: |-
                {define} twinkle
                     {print} 'Twinkle'
