levels:
    0:
        1:
            header: Benvenuti in Hedy!
            text: |-
                Benvenuti nel linguaggio di programmazione Hedy!

                Insegnanti, premete S sulla tastiera per vedere le note del relatore.
            notes: Chiedi ai tuoi studenti di scrivere alcune parole che associano alla programmazione. Fai un breve giro per ascoltare le risposte.
        2:
            header: Programmazione
            text: |-
                Programmare significa dare istruzioni a un computer, usando la lingua del computer.

                Una lingua di questo tipo si chiama "linguaggio di programmazione".
            notes: |-
                Purtroppo i computer non capiscono la lingua delle persone, come l'italiano, ma parlano una loro lingua.
                Niente panico, non dovrete scrivere una sequenza di zeri e uno: impareremo a dare istruzioni al computer con un linguaggio di programmazione.
        3:
            header: Linguaggio di programmazione
            text: |-
                Forse conosci già qualche linguaggio di programmazione?
                Alcuni esempi sono:
                * Scratch
                * Python
                * HTML
            notes: Chiedi agli studenti se hanno già esperienza di programmazione, o se magari conoscono qualcuno che lavora nell'informatica.
        4:
            header: Programmazione
            text: |-
                Se sai programmare, puoi fare tante cose fantastiche:
                * Creare storie interattive
                * Creare disegni al computer e disegnarli su carta o su stoffa
                * Creare app tutte tue da usare sul telefono
            notes: Può sembrare molto difficile, ma impareremo a programmare passo dopo passo.
        5:
            header: Programmare in Hedy
            text: In Hedy usiamo delle 'parole chiave' speciali, come `{print}`.
            code: '{print} Benvenuto in Hedy!'
            notes: |-
                Diamo un'occhiata a Hedy. In Hedy usiamo delle parole del codice (parole chiave) per dare un'istruzione al computer.
                Scriviamo queste istruzioni nella schermata a sinistra. Questo è ciò che chiamiamo codice, o programma.
        6:
            header: Programmare in Hedy
            text: Le parole chiave vengono mostrate in rosa.
            code: '{print} Benvenuto in Hedy!'
            notes: Come puoi vedere, le parole del codice (o parole chiave) diventano rosa se le usi correttamente.
        7:
            header: Programmare in Hedy
            text: Avviamo il codice con il pulsante Esegui codice, che si trova sotto il codice.
            code: '{print} Benvenuto in Hedy!'
            notes: Per far seguire le istruzioni al computer devi 'eseguire' il codice. Premi il pulsante per mostrare agli studenti cosa succede.
        8:
            header: Programmare in Hedy
            text: L'output appare sul lato destro.
            code: '{print} Benvenuto in Hedy!'
            notes: Quando eseguiamo il codice, appare l'output. L'output è il risultato dell'esecuzione del nostro programma. La schermata a destra, dove appare l'output, si chiama schermata di output.
        9:
            header: Programmare in Hedy
            text: L'output può anche essere un disegno.
            code: |-
                {forward} 100
                {turn} {left}
            notes: "In Hedy non facciamo apparire solo del testo: l'output può anche essere un disegno, oppure..."
        10:
            header: Programmare in Hedy
            text: Oppure l'output può essere musica!
            code: |-
                {play} C4
                {play} D4
                {play} E4
            notes: Andiamo al primo livello per cominciare!
        11:
            header: Usa il menu per passare all'avventura successiva
            text: Usa il menu per passare all'avventura o al livello successivo.
            editor: /hedy/1
            notes: "A volte gli studenti non sanno come passare all'avventura successiva: mostra loro in Hedy come si fa."
        12:
            header: Programmare in Hedy
            text: A volte capita di fare un errore nel codice. Puoi usare il debugger per trovare l'errore (bug) e correggerlo.
            code: |-
                {print} Fare debugging significa trovare un errore
                {print} Puoi eseguire il codice riga per riga
                {print} Così è facile trovare il bug
                {print} E correggerlo!
                {print} Oppure clicca sull'icona a forma di occhio per disattivare una riga di codice
            debug: 'True'
            notes: |-
                **Come fare il debugging di un codice**
                Guarda questo <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">video</a> per vedere come funziona il debugger, oppure leggi le istruzioni.
                Naturalmente puoi semplicemente guardare il codice e trovare gli errori da solo, ma abbiamo anche degli strumenti per aiutarti.
                Clicca sul pulsante con la coccinella 🐞 sotto il campo di inserimento. Questo avvia il **debugger**. Con il debugger puoi eseguire un programma riga per riga.
                Se nel tuo codice c'è un errore grave (come nelle avventure di debugging), il debugger ti dirà di correggere prima gli errori gravi. Leggi i messaggi di errore per capire come correggerli.
                Quando gli errori principali sono stati eliminati, il debugger eseguirà il tuo programma riga per riga.
                Per eseguire la riga successiva, clicca sul pulsante ⏭️ a destra. La riga fa quello che deve fare? Ottimo! Clicca di nuovo il pulsante per eseguire la riga successiva, finché il tuo programma non funziona perfettamente.
                Per fermare il debugger, clicca sul pulsante 🛑 al centro.
                Per eseguire di nuovo il codice dall'inizio, clicca sul pulsante 🔁 a sinistra.
                Ti sei bloccato su una riga di codice e vuoi provare il programma senza quella riga?
                Puoi disattivare una riga di codice cliccando sull'icona a forma di occhio davanti al numero di riga. La riga verrà barrata.
                Ora la riga verrà saltata quando esegui il codice. Per riattivarla, clicca di nuovo sull'icona a forma di occhio e la riga non verrà più saltata.
    1:
        1:
            header: Benvenuti al livello 1!
            text: |-
                Alla fine di questa lezione, saprai:
                * Scrivere un codice che stampa un testo
                * Creare una storia interattiva
        2:
            header: '{print}'
            text: |-
                Il primo comando che puoi usare nel livello 1 è `{print}`.

                `{print}` serve a mostrare un testo sullo schermo.
            code: '{print} Mostra questo testo sullo schermo'
            notes: Prima chiedi agli studenti di indovinare quale sarà secondo loro l'output. Poi esegui il codice per mostrare cosa succede quando viene eseguito un comando `print`.
        3:
            header: La parola chiave {print}
            text: |-
                Puoi cambiare il testo dopo la parola chiave print con quello che vuoi.

                Oppure puoi stampare più righe aggiungendo un'altra riga di codice che inizia anch'essa con `{print}`.
            code: |-
                {print} Benvenuto in Hedy!
                {print} Inizia subito a programmare!
            notes: Esegui il codice e poi modificalo tu stesso. Mostra che puoi stampare tutto quello che vuoi.
        4:
            header: '{ask}'
            text: |-
                Il secondo comando che puoi usare nel livello 1 è `{ask}`.

                `{ask}` serve a fare una domanda a cui si può rispondere.
            code: |-
                {print} Benvenuto nel tuo gioco di sasso carta forbici!
                {ask} Cosa scegli?
            notes: |-
                Mostra che ora il computer ti fa una domanda. Inserisci una risposta e mostra anche che, una volta inserita la risposta, non succede nulla.
                Fai capire ai tuoi studenti che il computer seguirà solo le tue istruzioni, non farà nulla da solo. Questo significa che se vuoi che il computer stampi la risposta, devi dargli questa istruzione.
        5:
            header: '{answer}'
            text: |-
                Per mostrare la risposta nella schermata di output, puoi usare: `{answer}`.
                `{answer}` non si usa mai da solo, sempre insieme a un `{ask}`.
            code: |-
                {print} Ciao!
                {ask} Come ti chiami?
                {print} ciao {answer}
            notes: Per far ripetere al computer la tua risposta, usi la parola chiave `answer`.
        6:
            header: Programmiamo!
            text: Qui trovi l'elenco delle avventure.
            editor: /hedy/1
            notes: "Prima di iniziare, mostra agli studenti le avventure. Non dimenticare di far notare gli esercizi: è lì che gli studenti dovranno leggere cosa fare esattamente in un'avventura."
        7:
            header: Programmiamo!
            text: I pulsanti gialli con la freccia servono a copiare gli esempi.
            editor: /hedy#print_command
            notes: Infine mostra agli studenti che possono copiare il codice di esempio nel loro campo di programmazione premendo il pulsante giallo.
        8:
            header: Cominciamo!
            text: |-
                Questo è un buon momento per provare le prime avventure.
                Usa il menu per passare all'avventura successiva. Se vuoi rileggere la spiegazione di una parola chiave, torna all'avventura con l'icona della lampadina.
            editor: /hedy/1
            notes: Al lavoro!
        9:
            header: Debugging
            text: Fare debugging di un codice significa eliminare gli errori dal codice. Facciamo insieme il debugging di questo codice. Clicca sul pulsante con la coccinella per avviare il debugger.
            code: |-
                Sono DJ Hedy
                {print} Quale canzone vuoi ascoltare?
                {ask} Piace anche a me questa canzone!
                {print} Prossima canzone... {answer}
            debug: 'True'
            notes: |-
                **Come fare il debugging di un codice**
                Guarda questo <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">video</a> per vedere come funziona il debugger, oppure leggi le istruzioni.
                Naturalmente puoi semplicemente guardare il codice e trovare gli errori da solo, ma abbiamo anche degli strumenti per aiutarti.
                Clicca sul pulsante con la coccinella 🐞 sotto il campo di inserimento. Questo avvia il **debugger**. Con il debugger puoi eseguire un programma riga per riga.
                Se nel tuo codice c'è un errore grave (come nelle avventure di debugging), il debugger ti dirà di correggere prima gli errori gravi. Leggi i messaggi di errore per capire come correggerli.
                Quando gli errori principali sono stati eliminati, il debugger eseguirà il tuo programma riga per riga.
                Per eseguire la riga successiva, clicca sul pulsante ⏭️ a destra. La riga fa quello che deve fare? Ottimo! Clicca di nuovo il pulsante per eseguire la riga successiva, finché il tuo programma non funziona perfettamente.
                Per fermare il debugger, clicca sul pulsante 🛑 al centro.
                Per eseguire di nuovo il codice dall'inizio, clicca sul pulsante 🔁 a sinistra.
                Ti sei bloccato su una riga di codice e vuoi provare il programma senza quella riga?
                Puoi disattivare una riga di codice cliccando sull'icona a forma di occhio davanti al numero di riga. La riga verrà barrata.
                Ora la riga verrà saltata quando esegui il codice. Per riattivarla, clicca di nuovo sull'icona a forma di occhio e la riga non verrà più saltata.
        10:
            header: Suonare musica
            text: |-
                Suona le note musicali con `{play}`
                Le note sono: C - D - E - F - G - A - B (Do - Re - Mi - Fa - Sol - La - Si)
                Metti un numero dopo la nota per scegliere l'ottava, le ottave vanno da 1 a 10.
            code: |
                {play} C4
                {play} D4
                {play} E4
                {play} F4
                {play} G4
                {play} A4
                {play} B4
                {play} C5
            notes: Mostra agli studenti come usare la parola chiave `{play}` in Hedy. Questo è anche un buon momento per ripassare le regole della classe sull'uso delle cuffie.
        11:
            header: 'Disegnare con la tartaruga: {forward}'
            text: '`{forward}` serve a far avanzare la tartaruga.'
            code: '{forward} 50'
            notes: Dopo aver visto i comandi per il testo, ora vediamo i comandi per disegnare. Mostra agli studenti come usare la parola chiave forward.
        12:
            header: 'Disegnare con la tartaruga: {forward}'
            text: Come facciamo ad andare indietro?
            code: '{forward} -50'
            notes: Chiedi agli studenti se hanno idea di come andare indietro. La risposta è usare un numero negativo, come -50.
        13:
            header: 'Disegnare con la tartaruga: {turn}'
            text: '`{turn}` serve a far girare la tartaruga a sinistra o a destra.'
            code: |-
                {forward} 50
                {turn} {left}
        14:
            header: Debugging
            text: Usare il debugger quando si disegna
            code: |-
                {forward} 50
                {turn} {left}
                {forward} 100
                {turn} {left}
                {forward} 50
                {turn} {left}
            debug: 'True'
            notes: Il debugger può tornare utile quando si fa un disegno.
        15:
            header: Ripassiamo!
            text: Cosa hai imparato oggi?
            notes: Chiedi agli studenti di elencare cosa hanno imparato oggi.
        16:
            header: Ripassiamo!
            text: |-
                Quale avventura ti è piaciuta di più? Perché?

                Quale avventura ti è piaciuta di meno? Perché?
            notes: Chiedi agli studenti la loro opinione.
        17:
            header: Mostra e racconta!
            text: Qualcuno vuole mostrare alla classe un programma che ha creato?
            notes: Fai mostrare ad alcuni studenti il loro lavoro alla classe. Puoi farlo andando alla pagina della classe e cliccando sulle avventure degli studenti.
        18:
            header: Un'anteprima del prossimo livello...
            text: |-
                Nel prossimo livello imparerai a usare una variabile per rendere i tuoi programmi ancora più interattivi!
                E imparerai a usare la parola chiave `{sleep}` per mettere in pausa il codice!
    2:
        1:
            header: Benvenuti al livello 2
            text: |-
                Alla fine di questa lezione, saprai:
                * Salvare qualcosa in una variabile
                * Creare una storia o un disegno usando le variabili
            notes: Gli studenti potrebbero avere difficoltà a capire il concetto di variabile. Abbiamo notato che dare agli studenti molti esempi di variabili li aiuta a comprendere meglio il concetto.
        2:
            header: Problema
            text: Nel livello precedente potresti aver incontrato questo problema...
            code: |-
                {print} Benvenuti al ristorante!
                {ask} Cosa vorresti mangiare
                {print} Vorresti mangiare... {answer}
                {ask} Cosa vorresti bere?
                {print} Vorresti bere... {answer}
                {print} Grazie per aver ordinato da noi!
                {print} Buon appetito con il tuo... {answer}
            notes: |-
                Attenzione: questo codice non funziona in questo livello. Non eseguire il programma, limitati a discuterne.
                Fai guardare il programma ai tuoi studenti e chiedi loro di prevedere l'output.
                Speriamo che arrivino alla conclusione che l'ultima riga dirà solo 'Buon appetito con il tuo (bevanda ordinata)' e che il computer si sarà dimenticato del cibo.
                Con 'ask' il computer può ricordare una sola cosa. In questo livello imparerai a usare le variabili per risolvere questo problema.
        3:
            header: Cos'è una variabile?
            text: |-
                Una variabile è uno spazio nella memoria del computer, dove viene salvata la risposta alla domanda.
                Può sembrare difficile, ma guarda l'esempio.
            code: |-
                risposta {is} {ask} Come ti chiami?
                {print} Ciao risposta
            notes: |-
                In informatica usiamo la parola variabile per indicare uno spazio nella memoria del computer in cui vengono salvate informazioni che cambiano.
                La variabile è come una scatola o un contenitore che contiene la cosa che cambia. La scatola rimane la stessa, ma il suo contenuto può cambiare o variare.
                Mostra agli studenti come funzionano le variabili. Fai notare che il nome della variabile `risposta` nell'ultima riga viene sostituito con il valore della variabile.
                Il riquadro blu che appare nella schermata di output ti mostra le variabili che hai usato e il valore che hanno.
        4:
            header: Il comando `{is}`
            text: Per creare o 'impostare' una variabile usiamo il comando `{is}`. Il nome della variabile va prima di `{is}` e il comando `{ask}` dopo. Possiamo scegliere noi il nome della variabile e usare qualcosa di diverso da `risposta`.
            code: |-
                nome {is} {ask} Come ti chiami?
                {print} Ciao nome
            notes: Chiedi agli studenti di inventare i loro esempi.
        5:
            header: Variabili
            text: Possiamo anche impostare una variabile senza fare una domanda. Il nome della variabile va prima di `{is}` e il valore della variabile dopo.
            code: |-
                cibo {is} hamburger
                bevanda {is} acqua
                {print} Da mangiare vorrei cibo.
                {print} Da bere vorrei bevanda.
            notes: Chiedi agli studenti se riescono a pensare a un'altra variabile (altezza, numero di scarpe, colore dei capelli ecc.) e aggiungi i loro esempi al codice.
        6:
            header: Più variabili
            text: Ora che usiamo le variabili, possiamo usarne più di una invece della sola `answer`.
            code: |-
                nome {is} Hedy
                eta {is} 15
                {print} nome ha eta anni
        7:
            header: Pausa
            text: Puoi anche usare la parola chiave `{sleep}` per mettere in pausa il codice per un po'.
            code: |-
                {print} Il mio colore preferito è...
                {sleep} 2
                {print} il verde!
            notes: |-
                Mostra agli studenti la parola chiave '{sleep}'. Chiedi loro cosa pensano che indichi il 2.
                Cambia il 2 con un altro numero per mostrare che possono decidere per quanti secondi il codice resterà in pausa.
        8:
            header: Pausa 5
            text: |-
                Puoi aggiungere un numero dopo la parola chiave `{sleep}` se vuoi che la pausa duri di più.

                Se vuoi, puoi anche usare una variabile invece di un numero per decidere la durata della pausa.
            code: |-
                pausa {is} 10
                {print} Il mio colore preferito è...
                {sleep} pausa
                {print} il verde!
            notes: Mostra il codice e, se vuoi, puoi anche sostituire il 10 con una parola chiave {ask}.
        9:
            header: Disegnare con le variabili
            text: |-
                Nel livello 1 hai imparato a usare {forward} 100.
                Ora puoi usare anche una variabile.
            code: |-
                distanza {is} {ask} Di quanto devo andare avanti?
                {forward} distanza
            notes: |-
                Mostra agli studenti che ora possono usare le variabili anche con la tartaruga che disegna!
                Esegui il codice più volte con risposte diverse, per mostrare l'uso delle variabili.
        10:
            header: Disegnare con i gradi
            text: Prima potevi fare {turn} {left} o {turn} {right}, ora possiamo usare i gradi!
            code: |-
                {forward} 100
                {turn} 45
                {forward} 100
            notes: Mostra il codice agli studenti. Nella prossima slide mostreremo diversi angoli.
        11:
            header: Gradi
            text: |-
                Un giro completo è di 360 gradi.
                Mezzo giro è di 180 gradi.
                Una svolta a destra è di 90 gradi.
                Una svolta a sinistra è di 270 gradi.

                Puoi inserire qualsiasi numero tu voglia.
            code: |-
                {turn} 90
                {forward} 100
            notes: |-
                Assicurati che gli studenti capiscano i gradi. Potrebbero averli già studiati in matematica, ma potrebbero anche essere una novità assoluta per loro.
                Se gli studenti non hanno mai sentito parlare di gradi, potrebbe essere utile mostrare loro un goniometro. Potresti anche stamparne uno per loro.
                Usa il codice di esempio nelle slide per mostrare agli studenti diversi angoli.
        12:
            header: Gradi e variabili
            text: Anche i gradi possono essere variabili!
            code: |-
                gradi {is} {ask} Di quanti gradi deve girare la tartaruga?
                {turn} gradi
                {forward} 100
            notes: Mostra agli studenti che anche il numero di gradi può essere una variabile.
        13:
            header: Debugging
            text: Fare debugging di un codice significa eliminare gli errori dal codice. Facciamo insieme il debugging di questo codice. Clicca sul pulsante con la coccinella per avviare il debugger.
            code: |-
                {print} Benvenuti nel negozio di ciambelle!
                ripieno {is} Che ripieno vorresti?
                {print} Hai scelto... Ripieno! Gnam!
                copertura {ask} Che copertura vorresti?
                copertura è deliziosa!
                {print} Vado a prendere la tua ciambella. {sleep}
                {print} Ecco a te! Una ciambella ripieno con copetura!
                {ask} Buona giornata!
            debug: 'True'
            notes: Mostra come usare il debugger e l'icona a forma di occhio.
        14:
            header: Ripassiamo!
            text: Cosa hai imparato oggi?
            notes: Chiedi agli studenti di elencare cosa hanno imparato oggi.
        15:
            header: Ripassiamo!
            text: |-
                Quale avventura ti è piaciuta di più? Perché?

                Quale avventura ti è piaciuta di meno? Perché?
            notes: Chiedi agli studenti la loro opinione.
        16:
            header: Mostra e racconta!
            text: Qualcuno vuole mostrare alla classe un programma che ha creato?
            notes: Fai mostrare ad alcuni studenti il loro lavoro alla classe.
        17:
            header: Un'anteprima del prossimo livello...
            text: Nel prossimo livello imparerai a creare una lista e a far scegliere al computer un elemento a caso da quella lista!
    3:
        1:
            header: Benvenuti al livello 3
            text: |-
                Alla fine di questa lezione, saprai:
                * Salvare più elementi in una variabile: questa si chiama lista.
                * Creare una storia in cui succedono cose a caso.
                * Creare un disegno in cui vengono disegnate cose a caso.
        2:
            header: Creare una lista
            text: |-
                Crei una lista con `{is}`.

                Separa gli elementi della lista con una virgola.
            code: animali {is} cani, gatti, canguri
            notes: Chiedi agli studenti di scrivere un esempio di una loro lista.
        3:
            header: A caso
            text: |-
                Puoi usare la lista con la parola chiave `{at}` `{random}`.
                Il computer sceglierà a caso un elemento della lista.
                Ogni volta che esegui questo codice l'output sarà diverso.
            code: |-
                animali {is} cani, gatti, canguri
                {print} animali {at} {random}
            notes: Esegui il codice un paio di volte e mostra agli studenti che l'output è ogni volta diverso.
        4:
            header: A caso in una frase
            text: Puoi usare la parola chiave `{at}` `{random}` anche in una frase.
            code: |-
                animali {is} cani, gatti, canguri
                {print} I miei preferiti sono i animali {at} {random}
            notes: |-
                Di nuovo, mostra agli studenti che l'output cambia quando il codice viene eseguito un paio di volte.
                Puoi anche cambiare l'ordine delle parole, per mostrare che anche `{print} animali {at} {random} sono i miei preferiti` è consentito.
                Ora chiedi ai tuoi studenti di scrivere una riga con print e at random sotto la lista che hanno creato e di scambiare il loro codice con un altro studente.
                Fai prevedere all'altro studente un possibile output del programma.
                Discuti brevemente alcune risposte in classe.
        5:
            header: Cominciamo!
            text: Cominciamo con le avventure!
            notes: Lavoriamo sulle prime avventure!
        6:
            header: Aggiungere a
            text: Puoi aggiungere elementi a una lista con la parola chiave `{add}` `{to_list}`.
            code: |-
                animali {is} cane, gatto, canguro
                {add} pecora {to_list} animali
                {print} Scelgo animali {at} {random}
            notes: |-
                Speriamo che gli studenti notino che non ha molto senso usare la parola chiave add to in questo modo, perché si sarebbe potuto mettere la pecora nella lista fin dall'inizio.
                La prossima slide mostrerà come usare add to insieme a un ask e a una variabile, per rendere il programma interattivo.
        7:
            header: Aggiungere a
            text: |-
                Puoi scegliere cosa aggiungere alla lista oppure puoi usare la parola chiave `{add}` `{to}` insieme alla parola chiave `{ask}`.
                In questo modo puoi lasciar decidere al giocatore cosa aggiungere alla lista, per rendere il programma interattivo.
            code: |-
                animali {is} cane, gatto, canguro
                preferito {is} {ask} Qual è il tuo animale preferito?
                {add} preferito {to_list} animali
                {print} Scelgo animali {at} {random}
            notes: |-
                Esegui il programma più volte per mostrare che l'animale scelto ora viene aggiunto alla lista.
                Il riquadro blu che appare nella schermata di output ti mostra le variabili che hai usato e il valore che hanno.
        8:
            header: Rimuovere da
            text: |-
                L'opposto della parola chiave `{add}` `{to}` è la parola chiave `{remove}` `{from}`.
                Questa parola chiave rimuove un elemento da una lista.
            code: |-
                animali {is} cane, gatto, canguro
                antipatico {is} {ask} Quale animale non ti piace?
                {remove} antipatico {from} animali
                {print} Scelgo animali {at} {random}
            notes: |-
                Una volta che gli studenti hanno capito add to, probabilmente impareranno abbastanza facilmente la parola chiave remove from.
                Fate gli esercizi 4 e 5.
