    10:
        1:
            header: Benvenuti al livello 10
            text: |-
                Alla fine di questa lezione, saprai:
                * annidare le parole chiave {if} e {repeat}
                * usare correttamente l'indentazione con {repeat}, {if} e {else}
                * usare le parole chiave {and} e {or}
            notes: Usare una parola chiave {if} dentro un'altra parola chiave {if} si chiama annidamento.
        2:
            header: Annidare con `{repeat}`
            text: In questo livello puoi combinare `{repeat}` e `{if}`. Questo si chiama annidamento.
            code: |-
                {repeat} 3 {times}
                    cibo = {ask} 'Cosa vuoi mangiare?'
                    {if} cibo {is} pizza
                        {print} 'buona!'
                    {else}
                        {print} 'la pizza è più buona'
            notes: Esegui il programma. Rispondi 'pizza' una volta, ma dai anche altre risposte.
        3:
            header: L'indentazione è importante!
            text: L'indentazione è molto importante per dire al computer quali righe devono essere ripetute e quali devono essere eseguite una volta sola.
            code: |-
                {repeat} 3 {times}
                    {print} 'Questa riga verrà ripetuta...'
                    {print} 'Anche questa...'
                {print} 'ma questa no!'
            notes: Ripeti ai tuoi studenti quanto è importante usare correttamente l'indentazione. Esegui il programma e chiedi agli studenti cosa succederebbe se anche l'ultima riga iniziasse con l'indentazione.
        4:
            header: Annidare con `{if}`
            text: Puoi anche usare un `{if}` dentro un `{if}`
            code: |-
                continuare = {ask} 'Vuoi continuare?'
                {if} continuare = sì
                    conferma = {ask} 'Confermi?'
                    {if} conferma {is} sì
                        {print} 'Continuiamo'
                    {else}
                        {print} 'Non hai confermato'
                {else}
                    {print} 'Non vuoi continuare'
            notes: Esegui questo programma alcune volte con risposte diverse. Chiedi ai tuoi studenti quali risposte bisogna dare per ottenere ciascuno degli output.
        5:
            header: L'indentazione è importante
            text: Ancora una volta, l'indentazione è molto importante e può fare una grande differenza nel codice.
            code: |-
                continuare = {ask} 'Vuoi continuare?'
                {if} continuare = sì
                    conferma = {ask} 'Confermi?'
                    {if} conferma {is} sì
                        {print} 'Continuiamo'
                {else}
                    {print} 'Non hai confermato'
            notes: Prova a cambiare l'indentazione e mostra agli studenti cosa succede se, per esempio, togli l'indentazione della seconda parola chiave {if}.
        6:
            header: Codice disordinato
            text: "L'annidamento può essere molto utile, ma a volte può rendere il codice davvero disordinato. Guarda questo esempio:"
            code: |-
                {print} 'Fammi indovinare chi sei'
                colore_capelli = {ask} 'Di che colore sono i tuoi capelli?'
                occhiali = {ask} 'Porti gli occhiali?'
                {if} colore_capelli {is} neri
                    {if} occhiali {is} sì
                        {print} 'Tu sei Jade!'
                    {else}
                        {print} 'Tu sei Ahmed!'
                {elif} colore_capelli {is} biondi
                    {if} occhiali {is} sì
                        {print} 'Tu sei Patrick!'
                    {else}
                        {print} 'Tu sei Miranda!'
                {else}
                    {print} 'Tu sei Jackie!'
            notes: |-
                Chiedi agli studenti chi ha i capelli biondi e non porta gli occhiali. Ci metteranno un po' a leggere questo codice.
                Mostra loro che nella prossima slide il codice è molto più facile da leggere usando la parola chiave and.
        7:
            header: La parola chiave {and}
            text: |-
                In questo caso la parola chiave `{and}` torna utile.

                Così il codice è molto più leggibile e non devi preoccuparti troppo dell'indentazione!
            code: |-
                {print} 'Fammi indovinare chi sei'
                colore_capelli = {ask} 'Di che colore sono i tuoi capelli?'
                occhiali = {ask} 'Porti gli occhiali?'
                {if} colore_capelli {is} neri {and} occhiali {is} sì
                    {print} 'Tu sei Jade!'
                {elif} colore_capelli {is} neri {and} occhiali {is} no
                    {print} 'Tu sei Ahmed!'
                {elif} colore_capelli {is} biondi {and} occhiali {is} sì
                    {print} 'Tu sei Patrick!'
                {elif} colore_capelli {is} biondi {and} occhiali {is} no
                    {print} 'Tu sei Miranda!'
                {else}
                    {print} 'Tu sei Jackie!'
            notes: |-
                Se ora chiedessi agli studenti chi ha i capelli biondi e non porta gli occhiali, risponderebbero molto più velocemente.
                Rendere un codice leggibile è un'abilità preziosa da imparare per i tuoi studenti e la parola chiave and sembrerà loro probabilmente molto naturale.
        8:
            header: La parola chiave {or}
            text: Proprio come la parola chiave `{and}`, esiste anche `{or}`!
            code: |-
                {print} 'Scegli un numero da 1 a 6'
                {print} 'Due di questi numeri ti faranno vincere un premio!'

                lista_numeri = 1, 2, 3, 4, 5, 6
                numero_premio = lista_numeri {at} {random}
                {remove} numero_premio {from} lista_numeri
                secondo_numero_premio = lista_numeri {at} {random}

                numero_scelto = {ask} 'Quale numero scegli?'
                {if} numero_scelto {is} numero_premio {or} numero_scelto {is} secondo_numero_premio
                    {print} 'Evviva! Hai vinto un premio!'
                {else}
                    {print} 'Mi dispiace, niente premio per te...'
            notes: Mostra questo codice agli studenti. Molto probabilmente sembrerà loro naturale.
        9:
            header: Attenzione!
            text: |-
                Quando usi `{or}`, non dimenticare di scrivere due condizioni complete.
                Fai il debugging di questo codice.
            code: |-
                colore = {ask} 'Di che colore è il tuo biglietto?'
                {if} colore {is} blu {or} rosso
                    {print} "Hai vinto un premio!"
            debug: 'True'
        10:
            header: 'Usa # per un codice ordinato'
            text: 'Ricordati di mantenere il tuo codice ordinato e leggibile usando righe che iniziano con # per spiegare cosa fa quella parte del codice!'
            code: |-
                # stampiamo il consiglio
                {print} 'Tieni il tuo codice organizzato così!'
