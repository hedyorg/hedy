            header: Minore e maggiore
            text: Forse conosci già i simboli < e >. Il < controlla se il primo numero è minore del secondo, per esempio eta < 12 controlla se eta è minore di 12. Il > controlla se il primo numero è maggiore del secondo, per esempio punti > 10 controlla se punti è maggiore di 10.
            code: |-
                numero = {input} ('scegli un numero minore di 10')
                {if} numero < 10:
                    {print}('Bene, hai scelto un numero!')
                {if} numero > 10:
                    {print}('Questo non è un numero minore di 10.')
            notes: |-
                Mostra il codice ai tuoi studenti. Chiedi loro di prevedere cosa succede con i diversi numeri.
                Esegui il codice con numeri diversi.
                Infine, prova il numero 10 e mostra che ora il codice non dà nessun output.
                Il numero 10 non è né maggiore né minore di 10 e quindi non dà output, ma risolveremo questo problema nella prossima slide.
