    6:
        1:
            header: Benvenuti al livello 6
            text: |-
                Alla fine di questa lezione, saprai:
                * usare `{elif}` per aggiungere una terza opzione ai condizionali
                * usare `{in}` per controllare se un elemento è in una lista oppure no
        2:
            header: Ripassiamo if e else
            text: Ti viene in mente un codice con `{if}` e `{else}`?
            code: |-
                pizza {is} {ask} 'Qual è la tua preferita?'
                {if} pizza {is} salamino
                {print} 'Sì! La pizza al salamino è la migliore!'
                {else}
                {print} 'La pizza al salamino è più buona!'
            notes: |-
                Fai lavorare insieme gli studenti per inventare un codice che contenga un if e un else.
                Quando hanno finito, mostra loro il codice di esempio e chiedi di prevedere quale sarà il risultato.
                Ricorda loro anche che la parte dopo l'istruzione {if} si chiama condizionale.
        3:
            header: Usare più righe
            text: I condizionali sono la parte dopo {if} o {else}. D'ora in poi i condizionali vanno messi sulla riga successiva.
            code: |-
                ordinato {is} {ask} 'Vuoi che il tuo codice sia bello e ordinato?'
                {if} ordinato {is} 'sì'
                {print} 'Ottima notizia! Metti sempre il condizionale sulla seconda riga!'
                {else}
                {print} 'Peccato! Il condizionale va comunque sulla riga successiva!'
            notes: |
                Se i tuoi studenti fanno fatica a capire perché devono mettere i condizionali sulla riga successiva, puoi dire loro che nel prossimo livello impareranno a mettere più righe di codice dopo un {if} o un {else}.
        4:
            header: '`{elif}`'
            text: '`{elif}` è una combinazione delle parole chiave `{else}` e `{if}` e ti serve quando vuoi creare 3 (o più!) opzioni.'
            code: |-
                pizza {is} {ask} 'Qual è la tua preferita?'
                {if} pizza {is} salamino
                {print} 'Sì! La pizza al salamino è la migliore!'
                {elif} pizza {is} hawaiana
                {print} 'Ma scherzi?! La hawaiana è la peggiore!'
                {else}
                {print} 'La pizza al salamino è più buona!'
            notes: Mostra questo codice ai tuoi studenti e chiedi di prevedere i 3 possibili risultati. Poi chiedi loro di pensare a delle idee per un codice con 3 o più opzioni.
        5:
            header: '`{in}`'
            text: Se ti sei esercitato con le parole chiave `{if}`, `{else}` e {elif}, puoi provare anche la parola chiave `{in}`.
            code: |-
                colori_belli {is} verde, giallo
                colore_preferito {is} {ask} 'Qual è il tuo colore preferito?'
                {if} colore_preferito {in} colori_belli {print} 'bello!'
                {else} {print} 'mah'
            notes: |-
                Con `{in}` puoi far controllare al computer se un elemento è in una lista. Mostra l'esempio.
                Tieni presente che Hedy distingue tra maiuscole e minuscole. Questo significa che se rispondi "Verde" invece di "verde", Hedy stamperà "mah".
        6:
            header: Tenere il codice in ordine
            text: |-
                Ora che conosci sempre più comandi, i tuoi programmi diventeranno più lunghi.
                A volte il tuo codice sarà disordinato e difficile da leggere. Per rendere il codice ordinato e leggibile puoi aggiungere dei commenti, usando un cancelletto all'inizio della riga, così:
            code: |-
                # Diamo un nome al personaggio
                nome {is} {ask} 'Come si chiamerà il tuo personaggio?'
                {print} 'Si chiama ' nome

                # Lanciamo il dado
                numeri = 1, 2, 3
                lancio = numeri {at} {random}

                # Assegniamo l'animale
                {if} lancio {is} 1
                    {print} nome ' riceve un cane'
                {elif} lancio {is} 2
                    {print} nome ' riceve un gatto'
                {else}
                    {print} nome 'riceve un pappagallo'
        7:
            header: Debugging
            text: Facciamo il debugging di questo codice!
            code: |-
                {print} 'Benvenuti in gelateria.'
                gusto {is} {ask} 'Quale gusto vorresti?'
                {if} gusto fragola
                {print} 'Ottima scelta!'
                gusto {is} vaniglia
                {print} 'Non vuoi proprio la fragola?''
                {else}
                {print} Mi dispiace, abbiamo solo vaniglia e fragola.
                palline {is} 'Quante palline vorresti?'
                {if} palline {is} 1
                {print} sono 1.50, per favore.
                {elif} {is} 2
                {print} 'sono 2.50, per favore.'
                {else} 'mi dispiace, sono troppe.'
            debug: 'True'
        8:
            header: Ripassiamo!
            text: |-
                Quale avventura ti è piaciuta di più? Perché?

                Quale avventura ti è piaciuta di meno? Perché?
            notes: Chiedi agli studenti la loro opinione.
