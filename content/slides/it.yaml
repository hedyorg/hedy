    4:
        1:
            header: Benvenuti al livello 4
            text: |-
                Alla fine di questa lezione, saprai:
                * capire perché nella programmazione servono le virgolette.
                * mettere le virgolette nei punti giusti.
                * capire i messaggi di errore sull'uso sbagliato delle virgolette.
            code: "{print} 'Usa le virgolette!'"
        2:
            header: Problema
            text: 'Nei livelli precedenti potresti aver incontrato questo problema:'
            code: |-
                nome {is} Sophie
                {print} Il mio nome è nome
            debug: 'True'
            notes: |-
                Questo codice non funziona in questo livello!
                Fai prevedere l'output agli studenti. Il problema è che se usi la variabile nome, non puoi più usare la parola nome nel tuo testo.
                L'output di questo codice sarà 'Il mio Sophie è Sophie'.
        3:
            header: Risolverlo con le virgolette
            text: |-
                In questo livello risolveremo questo problema usando le virgolette.

                Così il nostro codice assomiglia anche di più al 'vero' codice Python.
            code: |-
                nome {is} Sophie
                {print} 'Il mio nome è ' nome
            notes: |-
                Ora il computer conosce la differenza tra il testo 'nome' e la variabile nome.
                Mostra agli studenti che ora il computer stampa 'Il mio nome è Sophie'.
                Uno studente potrebbe dire che si poteva risolvere facilmente il problema dando alla variabile un nome diverso. È vero, ma nella programmazione è un'abilità importante indicare al computer tipi di dati diversi e sapere tu stesso distinguere tra testo normale e variabili.
                Scrivi le virgolette così ' oppure le virgolette doppie così ", gli apici inversi come questo ` non funzionano!
        4:
            header: Le virgolette con print
            text: Ogni volta che usi la parola chiave `{print}` devi mettere tra virgolette il testo che vuoi far apparire sullo schermo.
            code: "{print} 'Usa le virgolette!'"
        5:
            header: Le virgolette con ask
            text: Lo stesso vale per la parola chiave `{ask}`.
            code: nome {is} {ask} 'Come ti chiami?'
        6:
            header: Virgolette e variabili
            text: |-
                Non vuoi che i nomi delle variabili vengano stampati sullo schermo.
                Per questo le variabili devono restare fuori dalle virgolette, così:
            code: |-
                nome {is} Harry
                {print} 'Ciao ' nome
        7:
            header: Virgolette e variabili
            text: |-
                Quando usi i nomi delle variabili in mezzo a una frase, devi lasciare le variabili fuori dalle virgolette.
                Il resto della frase, però, ha bisogno delle virgolette. Ecco come si fa:
            code: |-
                nome {is} Harry
                {print} 'Ciao ' nome ', come stai?'
        8:
            header: Virgolette e apostrofi
            text: |-
                Attenzione! Ora che usi le virgolette, non puoi usare l'apostrofo nelle parole.

                Prova a stampare una parola con l'apostrofo, come "c'è" o "l'amico", nella schermata qui sotto e guarda cosa succede...
            code: "{print} 'Questo non funzionerà, c'è un apostrofo'"
            debug: 'True'
        9:
            header: Correggilo!
            text: Se devi usare un apostrofo nel tuo testo, usa le virgolette doppie per risolvere il problema.
            code: |-
                {print} "Sto usando le virgolette doppie"
                {print} "Così l'apostrofo funziona!"
            notes: "È importante iniziare e finire con lo stesso tipo di virgolette: per esempio, non puoi iniziare una riga con ' e finirla con \"."
        10:
            header: Pulisci
            text: |-
                In questo livello imparerai anche la parola chiave {clear}.
                Con questa parola chiave puoi cancellare tutto il testo dalla schermata di output.

                Fai attenzione a usare sempre anche una parola chiave sleep. Altrimenti il computer cancellerà tutto il testo prima che tu possa leggerlo!
            code: |-
                {print} '3'
                {clear}
                {print} '2'
                {clear}
                {print} '1'
                {clear}
                {print} 'SORPRESA!'
            notes: Esegui il codice e mostra il programma agli studenti. Noterai che non riesci a leggere il 3, 2, 1. Aggiungi delle parole chiave sleep prima delle parole chiave clear per correggere il programma.
        11:
