                Premi 2 per un biglietto di andata e ritorno:'
                {if} tipo_biglietto = 1
                {print} 'Hai scelto un biglietto di sola andata'
                {else}
                        {print} Hai scelto un biglietto di andata e ritorno'
                prezzo * 2
                {print} 'Il totale è ' prezzo ' euro, per favore'
            debug: 'True'
            notes: Fai il debugging di questo codice insieme ai tuoi studenti.
