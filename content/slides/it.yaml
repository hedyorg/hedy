    15:
        1:
            header: Benvenuti al livello 15!
            text: |-
                Alla fine di questa lezione, saprai:
                * Rendere il tuo codice più corto ed efficiente usando le funzioni.
                * Usare funzioni con argomenti
                * Usare `{return} {value}` nelle funzioni
            notes: Chiedi agli studenti cosa ricordano delle funzioni e a cosa servono.
        2:
            header: Ti ricordi le funzioni?
            text: |-
                Le funzioni possono rendere il tuo codice più organizzato e ordinato, ripetendo un pezzo di codice in una funzione.
                Nel vero codice Python, le funzioni si definiscono con `{def}` seguito dal nome della funzione e poi da ():
                Non devi usare `{call}` per chiamare la funzione, basta scrivere il nome seguito da ().
            code: |-
                def quadrato():
                    {for} i {in} {range} (1,4):
                        {turn} 90
                        {forward} 10

                quadrato()
                {forward} 50
                quadrato()
                {forward} 50
                quadrato()
                {forward} 50
            notes: Mostra agli studenti come sono fatte ora le funzioni. Spiega che le parentesi verranno usate più avanti.
        3:
            header: Troppo codice?
            text: Il codice qui sotto contiene molte ripetizioni.
            code: |-
                {print} ('Questo codice calcolerà i primi 5 quadrati e stamperà il risultato.')

                quadrato1 = 1*1
                {print} ('il quadrato di 1 =', quadrato1)
                quadrato2 = 2*2
                {print} ('il quadrato di 2 = ', quadrato2)
                quadrato3 = 3*3
                {print} ('il quadrato di 3 = ', quadrato3)
                quadrato4 = 4*4
                {print} ('il quadrato di 4 = ', quadrato4)
                quadrato5 = 5*5
                {print} ('il quadrato di 5 = ', quadrato5)
            notes: |-
                Mostra il codice ai tuoi studenti. Vedono tutte le ripetizioni?
                Chiedi loro se riescono a trovare un modo per scrivere questo codice con meno righe.
                Probabilmente non ci riusciranno, quindi mostra loro la prossima slide!
        4:
            header: Usa una funzione!
            text: |-
                Ora proveremo a ottenere lo stesso output con meno righe di codice.
                Per farlo scriviamo una funzione: un pezzo di codice che possiamo ripetere più volte con input diversi.
            code: |-
                {def} calcola_quadrato(numero):
                    quadrato = numero*numero
                    {print} ('il quadrato di', numero, '=', quadrato)

                {print} ('Questo codice calcolerà i primi 5 quadrati e stamperà il risultato.')

                calcola_quadrato(1)
                calcola_quadrato(2)
                calcola_quadrato(3)
                calcola_quadrato(4)
                calcola_quadrato(5)
            notes: |-
                Esegui il codice. Assicurati che i tuoi studenti vedano come questo output deriva dal codice.
                Ora abbiamo solo due righe in meno rispetto alla slide precedente.

                Spiega ai tuoi studenti che più ripetizioni ci sono, più conviene usare le funzioni.
                Alcuni vantaggi: meno codice, quindi codice più organizzato, e lo si scrive più in fretta.
                Meno possibilità di fare errori ed è più facile trovarli se li fai.

                Mostra che puoi cambiare qualcosa nella funzione, in modo che cambi tutto l'output.
        5:
            header: Funzioni con più argomenti
            text: |-
                L'input che si trova tra le parentesi di una funzione si chiama argomento.
                Puoi usare più argomenti per una sola funzione:
            code: |-
                {def} fiaba(principessa, principe, qualcosa_di_velenoso, gesto_di_amore)
                risposta = {input}('Vuoi che ti racconti una fiaba?')
                {if} risposta == sì:
                    {print} ('Tanto tempo fa viveva una ragazza di nome ', principessa)
                    {print} ('Mangiò ', qualcosa_di_velenoso, ' e per poco non morì...')
                    {print} ('Ma il principe ', principe, ' andò a trovarla e le diede un ', gesto_di_amore )
                    {print} ('Questo guarì ', principessa ' che si innamorò di ', principe)
                    {print} (principessa, ' e ', principe, ' vissero felici e contenti.')
                {else}:
                    {print} ('Nessun problema. Magari la prossima volta.')

                fiaba('Biancaneve', 'Casper', 'una mela avvelenata', 'bacio')
            notes: Esegui il codice e mostra che puoi cambiare tutti e quattro gli argomenti per ottenere una storia diversa.
        6:
            header: Valore restituito
            text: |-
                A volte vuoi usare fuori da una funzione un numero che è stato calcolato dentro la funzione.
                Puoi usare il comando `{return}` per usare il valore fuori dalla funzione.
            code: |-
                {def} calcola_nuovo_prezzo(importo, percentuale):
                    percentuale = percentuale / 100
                    importo_sconto = importo * percentuale
                    {return} importo - importo_sconto

                vecchio_prezzo = input ('Quanto costa secondo il cartellino?')
                sconto = input ('Qual è la percentuale di sconto?')

                nuovo_prezzo = _ calcola_nuovo_prezzo(vecchio_prezzo, sconto)
                print('Il nuovo prezzo è ', nuovo_prezzo, ' euro')
            notes: Ai tuoi studenti vengono in mente altre situazioni in cui sarebbe utile restituire un valore da una funzione?
