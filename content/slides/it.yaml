    7:
        1:
            header: Benvenuti al livello 7
            text: |-
                Alla fine di questa lezione, saprai:
                * usare la matematica in Hedy
                * usare i numeri decimali in Hedy
                * usare le variabili nei calcoli in Hedy
            notes: |-
                Chiedi ai tuoi studenti di immaginare quando servirebbe la matematica in un codice (per esempio per calcolare un prezzo, un numero di persone, i punti in un gioco ecc.).
                Potresti anche chiedere loro di immaginare come sarebbe. Molto probabilmente penseranno da soli a + e -.
        2:
            header: Addizione
            text: Se vuoi calcolare un'addizione, usa semplicemente il segno più.
            code: "{print} '5 più 5 fa ' 5 + 5"
            notes: Mostra brevemente il codice di esempio ai tuoi studenti.
        3:
            header: Sottrazione
            text: Se vuoi fare una sottrazione, puoi usare il segno meno.
            code: "{print} '5 meno 5 fa ' 5 - 5"
            notes: Mostra brevemente il codice di esempio ai tuoi studenti.
        4:
            header: Moltiplicazione
            text: Se vuoi fare una moltiplicazione, puoi usare l'asterisco.
            code: "{print} '5 per 5 fa ' 5 * 5"
            notes: Mostra brevemente il codice di esempio ai tuoi studenti.
        5:
            header: Divisione
            text: Per la divisione puoi usare la barra.
            code: "{print} '5 diviso 5 fa ' 5 / 5"
            notes: Mostra brevemente il codice di esempio ai tuoi studenti.
        6:
            header: Riepilogo
            text: Riassumendo, puoi usare +, -, * e / per fare i calcoli.
            code: |-
                {print} '5 più 5 fa ' 5 + 5
                {print} '5 meno 5 fa ' 5 - 5
                {print} '5 per 5 fa ' 5 * 5
                {print} '5 diviso 5 fa ' 5 / 5
            notes: |-
                Nota che il codice dei calcoli non ha bisogno delle virgolette.
                Chiedi ai tuoi studenti di prevedere come sarebbe l'output se mettessi il codice dei calcoli dentro le virgolette.
        7:
            header: Il simbolo =
            text: |-
                D'ora in poi puoi usare anche il simbolo = invece della parola chiave `{is}`.
                Questo vale sia per i numeri sia per le parole, e vale anche dopo le parole chiave `{if}` o `{else}`.
            code: |-
                nome = Hedy
                risposta = 20 + 4
            notes: Mostra brevemente il codice di esempio ai tuoi studenti.
        8:
            header: Calcoli con le variabili
            text: 'Puoi fare calcoli con i numeri, ma puoi anche usare le variabili per fare i calcoli, così:'
            code: |-
                numero_1 = {ask} 'Inserisci il primo numero:'
                numero_2 = {ask} 'Inserisci il secondo numero:'
                risposta_corretta = numero_1 * numero_2
                {print} numero_1 ' per ' numero_2 ' fa ' risposta_corretta
            notes: |-
                Mostra agli studenti il codice di esempio e fai osservare loro la posizione delle virgolette.
                Se nelle slide precedenti hai chiesto loro di trovare degli esempi di uso della matematica in Hedy, chiedi come pensano che sarebbe questo codice.
                Per esempio, se uno studente ha risposto 'calcolare i punti di un gioco', ora potrebbe scrivere il codice:
                ```
                {if} risposta = risposta_corretta
                    punti = punti + 1
                {else}
                    punti = punti - 1
                ```
                Se pensi che sia troppo difficile per i tuoi studenti farlo da soli o in coppia, puoi fare questo esercizio insieme a tutta la classe.
        9:
            header: Numeri decimali
            text: Finora Hedy non permetteva di usare numeri decimali come 1.5, ma ora sì. Nota che i computer usano il . (punto) per i numeri decimali, non la virgola.
            code: |-
                {print} 'Due e mezzo più due e mezzo fa...'
                {print} 2.5 + 2.5
        10:
            header: Debugging
            text: Facciamo il debugging di questo codice!
            code: |-
                {print} 'Questa è la biglietteria del parco acquatico'
                {print} 'Listino prezzi: bambini sotto i 12 anni 3 euro, adulti 5 euro'
                {print} 'Il lunedì sconto del 25%'
                numero_bambini = 'Quanti biglietti per bambini vorresti?'
                numero_adulti = 'Quanti biglietti per adulti vorresti?'
                giorno_della_settimana = {ask} 'Che giorno è oggi?'
                {clear}
                prezzo_bambini = numero bambini * 3
                prezzo_adulti = numero_adulti + 5
                prezzo_totale = prezzo_adulti * prezzo_bambini
                {if} giorno {is} lunedì
                prezzo_totale = prezzo_totale * 0.25
                {print} 'Il totale è prezzo_totale, per favore'
            debug: 'True'
            notes: Fai il debugging di questo codice insieme ai tuoi studenti.
        11:
            header: Mettiamoci al lavoro!
            text: Buon divertimento con le avventure del livello 7!
            notes: Ora gli studenti possono fare tutte le avventure di questo livello.
