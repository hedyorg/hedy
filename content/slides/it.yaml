            notes: Chiedi agli studenti di elencare cosa hanno imparato oggi.
        8:
            header: Ripassiamo!
            text: |-
                Quale avventura ti è piaciuta di più? Perché?

                Quale avventura ti è piaciuta di meno? Perché?
            notes: Chiedi agli studenti la loro opinione.
        9:
            header: Mostra e racconta!
            text: Qualcuno vuole mostrare alla classe un programma che ha creato?
            notes: Fai mostrare ad alcuni studenti il loro lavoro alla classe.
        10:
            header: Un'anteprima del tuo futuro...
            text: |-
                Questo era l'ultimo livello. Ma questo non significa che ora devi smettere di programmare.
                Hai imparato molto e con quello che sai puoi creare tanti programmi interessanti.
                Cosa ti piacerebbe programmare da solo?
            notes: Fai discutere i tuoi studenti su cosa vorrebbero programmare in futuro. Incoraggiali a farlo!
