                bello {ask} Ti piace questo genere?
                {remove} genere_scelto {from} genere_scelto
                seconda_scelta {is} generi_musicali
                {print} oppure preferisci... seconda_scelta {at} {random}
                {remove} seconda_scelta {to} generi_musicali
                {print} Il mio genere preferito è genere_musicale {random}!
            debug: 'True'
            notes: Mostra come usare il debugger e l'icona a forma di occhio.
