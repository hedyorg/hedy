levels:
    0:
        1:
            header: Bienvenue dans Hedy !
            text: |-
                Bienvenue dans la programmation avec Hedy.

                Professeurs, appuyez sur la touche S du clavier pour voir les notes en commentaire.
            notes: Demandez à vos élèves d'écrire quelques mots qu'ils associent à la programmation. Faites un tour de table pour écouter les réponses.
        2:
            header: Programmation
            text: |-
                Programmer, c'est donner des instructions à l'ordinateur en utilisant le langage de l'ordinateur.

                Un tel langage est appelé un "langage de programmation".
            notes: |-
                Malheureusement, les ordinateurs ne comprennent pas le langage utilisé par les humains, comme le français, mais ils parlent dans leur propre langage.
                Pas de panique ! Pas besoin d'écrire des suites de uns et de zéros, mais nous allons apprendre comment donner des instructions à un ordinateur grâce à un langage de programmation.
        3:
            header: Langage de programmation
            text: |-
                Peut-être connaissez-vous déjà quelques langages de programmation ?
                Par exemple :
                * Scratch
                * Python
                * HTML
            notes: Posez des questions aux élèves sur leur expérience en programmation, ou s'ils et elles connaissent peut-être quelqu'un qui travaille dans l'informatique.
        4:
            header: Programmation
            text: |-
                Si vous savez programmer, vous pouvez faire beaucoup de choses intéressantes:
                * Écrire des histoires interactives
                * Créer des dessins sur l'ordinateur et les transférer sur du papier ou du tissu
                * Créer tes propres applications à installer sur ton smartphone
            notes: Cela peut paraître très difficile, mais nous allons apprendre la programmation étape par étape.
        5:
            header: Programmer dans Hedy
            text: Dans Hedy nous utilisons des 'mots clés' spéciaux, comme `{print}`.
            code: '{print} Bienvenue sur Hedy  !'
            notes: |-
                Jetons un œil à Hedy. Dans Hedy on utilise des mots code (des mots clés) pour donner une instruction à un ordinateur.
                On tape ces instructions dans l'écran de gauche. C'est ce qu'on appelle le code, ou le programme.
        6:
            header: Programmer avec Hedy
            text: Les mots clés sont affichés en rose.
            code: '{print} Bienvenue sur Hedy  !'
            notes: Comme vous pouvez le voir, les mots clés (ou mots code) deviennent roses si vous les utilisez correctement.
