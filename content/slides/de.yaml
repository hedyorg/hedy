levels:
    0:
        1:
            header: Willkommen bei Hedy!
            text: |-
                Hedy ist eine Programmiersprache.

                Lehrer, drückt bitte S auf eurer Tastatur, um die Foliennotizen anzuzeigen.
            notes: Bittet eure Schülerinnen und Schüler, ein paar Wörter aufzuschreiben, die sie mit Programmierung in Verbindung bringen. Geht die Antworten kurz durch.
        2:
            header: Programmierung
            text: |-
                Programmieren bedeutet, einem Computer Anweisungen zu geben, in einer Sprache, die der Computer versteht.

                So eine Sprache nennt man "Programmiersprache".
            notes: |-
                Leider verstehen Computer keine normale Menschensprache wie Deutsch. Sie sprechen ihre eigene Sprache.
                Keine Panik: du musst keine Liste von Nullen und Einsen tippen. Wir werden wernen, wie man dem Computer Anweisungen in einer Programmiersprache gibt.
        3:
            header: Programmiersprache
            text: |-
                Vielleicht kennst du schon einige Programmiersprachen?
                Einige Beispiele sind:
                * Scratch
                * Python
                * HTML
            notes: Frage die Schülerinnen und Schüler nach ihrer Programmiererfahrung. Vielleicht kennen sie auch jemanden, der in der IT arbeitet.
        4:
            header: Programmieren
            text: |-
                Wenn du programmieren kannst, kannst du viele coole Dinge machen:
                * Interaktive Geschichten bauen
                * Computergrafiken kreieren und sie auf Papier oder Stoff zeichnen
                * Deine eigenen Apps für dein Smartphone bauen
            notes: Das hört sich vielleicht wirklich kompliziert an, aber wir werden Programmieren Schritt für Schritt lernen.
        5:
            header: Programmieren in Hedy
            text: In Hedy benutzen wir speziellen Code, wie `{print}`.
            code: '{print} Willkommen bei Hedy!'
            notes: |-
                Sehen wir uns Hedy einmal an. In Hedy benutzen wir Codewörter (Schlüsselwörter), um einem Computer Anweisungen zu geben.
                Wir schreiben diese Anweisungen in das linke Fenster. Das nennen wir Code, oder ein Programm.
        6:
            header: Programmieren in Hedy
            text: Code-Wörter werden in pink angezeigt.
            code: '{print} Willkommen bei Hedy!'
            notes: Wie du sehen kannst, werden die Code-Wörter (oder Schlüsselwörter) pink, wenn du sie richtig verwendest.
        7:
            header: Programmieren in Hedy
            text: Wir starten den Code mit dem "Programm ausführen" Knopf unter dem Code.
            code: '{print} Willkommen bei Hedy!'
            notes: Um den Computer die Anweisungen folgen zu lassen, musst du den Code "ausführen" lassen. Drücke den Knopf, um den Schülerinnen und Schülern zu zeigen, was passiert.
        8:
            header: Programmieren in Hedy
            text: Die Ausgabe erscheint auf der rechten Seite.
            code: '{print} Willkommen bei Hedy!'
            notes: Wenn wir den Code ausführen, erscheint eine Ausgabe. Die Ausgabe ist das Ergebnis der Ausführung unseres Programmes. Das rechte Fenster, wo die Ausgabe erscheint, wird Ausgabefenster genannt.
        9:
            header: Programmieren in Hedy
            text: Die Ausgabe kann auch eine Zeichnung sein.
            code: |-
                {forward} 100
                {turn} {left}
            notes: In Hedy können wir nicht nur Text anzeigen lassen –die Ausgabe kann auch eine Zeichnung sein, oder…
        10:
            header: Programmieren in Hedy
            text: Die Ausgabe kann auch Musik sein!
            code: |-
                {play} C4
                {play} D4
                {play} E4
            notes: Fangen wir mit dem ersten Level an!
        11:
            header: Gehe über das Menü zum nächsten Abenteuer
            text: Benutze das Menü, um zum nächsten Abenteuer oder Level weiterzugehen.
            editor: /hedy/1
            notes: Manchmal wissen Schülerinnen und Schüler nicht, wie sie zum nächsten Abenteuer weitergehen sollen. Zeige ihnen in Hedy, wie sie das machen können.
        12:
            header: Programmieren in Hedy
            text: Manchmal machst du einen Fehler in deinem Code. Du kannst den Debugger benutzen, um den Fehler (Bug) zu finden und auszubessern.
            code: |-
                {print} Debuggen heißt Fehler suchen
                {print} Du kannst den Code Zeile für Zeile ausführen
                {print} Das macht es leichter, den Bug zu finden...
                {print} ...und auszubessern!
                {print} Du kannst auch auf das Augen-Symbol klicken, um eine Code-Zeile auszuschalten
            debug: Wahr
