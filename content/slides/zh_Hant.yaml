        2:
            header: 新的迴圈
            text: |-
                使用 {while} 關鍵字可以製作新的迴圈。
                只要陳述式為真，迴圈就會持續執行。
            code: |-
                temperature = 15
                {while} temperature < 25:
                    {print} ('現在是', temperature, '度。')
                    {print} ('你必須穿外套才能出門。')
                    temperature = temperature + 2
                {print} ('現在是', temperature, '度。你可以不穿外套出門了。')
            notes: |-
                請學生預測這段程式碼的輸出結果。溫度到達多少時，程式會輸出可以不穿外套出門？
                執行程式，看看他們是否答對。接著詢問學生，如果移除「temperature = temperature + 2」這一行會發生什麼事。
                示範這會造成無限迴圈，因為溫度會一直低於 25。
        3:
            header: '{while} 和 {input}'
            text: 也可以把 {while} 關鍵字和提問結合使用。
            code: |-
