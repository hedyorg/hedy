                {for} i {range} (1,3):
                    number = ('你想購買幾件', items[i], '？')
                    total = total + prices*number

                {if} total < 50:
                total = + 10
                {print} (你必須多付 10 元運費。)

                presents = [耳環, 太陽眼鏡, 耳塞]
                {else}
                    {print} '你可以免運，還能得到一份小禮物。'
                    present = present {random}
                    {print} '你的禮物是一副', present

                {print} (謝謝你在 Hedyclothes 購物。請支付, total,)
