                {print} '其中兩個數字可以贏得獎品！'

                list_of_numbers = 1, 2, 3, 4, 5, 6
                price_number = list_of_numbers {at} {random}
                {remove} price_number {from} list_of_numbers
                second_price_number = list_of_numbers {at} {random}

                chosen_number = {ask} '你選哪一個數字？'
                {if} chosen_number {is} price_number {or} chosen_number {is} second_price_number
                    {print} '太棒了！你贏得獎品了！'
                {else}
                    {print} '抱歉，你沒有獎品……'
            notes: 向學生展示這段程式碼，他們應該很容易就能理解。
