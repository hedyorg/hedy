        3:
            header: 包含文字的清單
            text: 如果清單中放的是文字而不是數字，也必須使用引號。
            code: favorite_animals = ['狗', '綿羊', '鸚鵡', '袋鼠']
        4:
            header: 取得清單中的項目
            text: 只要把項目編號放在清單名稱後面，就能輕鬆輸出清單中的項目：
            code: |-
                winners = ['Amber', 'Bryan', 'Clara']

                {print} (winners[1], '獲得第一名。')
                {print} (winners[2], '獲得第二名。')
                {print} (winners[3], '獲得第三名。')
            notes: |-
                先請學生猜猜第一部分程式碼的輸出結果。
                接著執行程式碼，看看他們是否答對。
        5:
            header: 從清單中隨機選擇項目
            text: 和先前一樣，我們也想從清單中隨機取得一個項目。
            code: |-
                candidates = ['Amber', 'Bryan', 'Clara']
                winner = candidates[random]
                {print} ('恭喜', winner, '，你贏得了一份獎品。')
            notes: 多次執行程式碼，示範它確實會隨機選出名稱。
        6:
            header: 真正 Python 中的 {for}
            text: 從現在起，每次使用 {for} 關鍵字時，都必須在該行結尾加上冒號：
            code: |-
                animals = 狗, 貓, 水滴魚
                {for} animal in animals:
                    {print} ('我喜歡' animal)
            notes: |-
                請學生注意，不只 {for} 關鍵字需要這樣做，只要下一行有縮排，前一行都會有相同的規則。
                接下來的投影片會看到這些例子。
        7:
