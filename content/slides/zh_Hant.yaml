    15:
        1:
            header: 歡迎來到第 15 級！
            text: |-
                完成這堂課後，你可以：
                * 使用函式，讓程式碼更短、更有效率。
                * 使用含有引數的函式
                * 在函式中使用 `{return} {value}`
            notes: 請學生分享他們還記得哪些函式知識，以及函式可以用來做什麼。
        2:
            header: 還記得函式嗎？
            text: |-
                函式可以重複使用一段程式碼，讓程式碼更有條理、更整齊。
                在真正的 Python 程式碼中，要先使用 `{def}`，接著輸入函式名稱和 () 來定義函式：
                呼叫函式時不需要使用 `{call}`，只要輸入名稱和 () 即可。
            code: |-
                def square():
                    {for} i {in} {range} (1,4):
                        {turn} 90
                        {forward} 10

                square()
                {forward} 50
                square()
                {forward} 50
                square()
                {forward} 50
            notes: 向學生展示現在的函式寫法，並告訴他們之後會用到括號。
        3:
            header: 程式碼太多了嗎？
            text: 下方程式碼有許多重複的部分。
            code: |-
                {print} ('這段程式碼會計算前 5 個平方數並輸出結果。')

                square1 = 1*1
                {print} ('1 的平方 =', square1)
                square2 = 2*2
                {print} ('2 的平方 =', square2)
                square3 = 3*3
                {print} ('3 的平方 =', square3)
                square4 = 4*4
                {print} ('4 的平方 =', square4)
                square5 = 5*5
                {print} ('5 的平方 =', square5)
            notes: |-
                向學生展示程式碼。他們是否看出有許多重複的部分？
                詢問他們能不能想出用更少行程式碼完成的方法。
                他們可能還想不到，所以接著展示下一張投影片吧！
        4:
            header: 使用函式！
            text: |-
                現在要試著用更少行程式碼，得到相同的輸出結果。
                為此，我們要編寫一個函式：一段可以使用不同輸入、重複執行多次的程式碼。
            code: |-
                {def} calculate_square(number):
                    square = number*number
                    {print} ('數字', number, '的平方 =', square)

                {print} ('這段程式碼會計算前 5 個平方數並輸出結果。')

                calculate_square(1)
                calculate_square(2)
                calculate_square(3)
                calculate_square(4)
                calculate_square(5)
            notes: |-
                執行程式碼，確認學生看得出輸出結果是如何由程式碼產生的。
                現在比上一張投影片少了兩行。

                向學生說明，重複的程式碼越多，就越適合使用函式。
                使用函式有幾項好處：程式碼更少、更有條理，也能更快寫完。
                犯錯的機會更少，即使犯錯也更容易找到。

                示範只要改變函式中的內容，所有輸出結果就會一起改變。
        5:
            header: 有多個引數的函式
            text: |-
                函式括號中的輸入稱為引數。
                一個函式可以使用多個引數：
            code: |-
                {def} fairy_tale(princess, prince, something_poisonous, expression_of_love)
                answer = {input}('你想聽我講一個童話故事嗎？')
                {if} answer == 是:
                    {print} ('從前從前，有一個女孩叫做', princess)
                    {print} ('她吃了', something_poisonous, '，差點死掉……')
                    {print} ('但是王子', prince, '前來探望她，並給了她一個', expression_of_love )
                    {print} ('這治好了', princess '，她也愛上了', prince)
                    {print} (princess, '和', prince, '從此過著幸福快樂的生活。')
                {else}:
                    {print} ('沒問題，下次再說吧。')

                fairy_tale('白雪公主', '卡斯柏', '毒藥', '親吻')
            notes: 執行程式碼，並示範改變四個引數，就能得到不同的故事。
        6:
            header: 回傳值
            text: |-
                有時候，你會想在函式外使用函式中計算出的數字。
                可以使用 `{return}` 指令，把這個值帶到函式外使用。
            code: |-
                {def} calculate_new_price(amount, percentage):
                    percentage = percentage / 100
                    discount_amount = amount * percentage
                    {return} amount - discount_amount

                old_price = input ('價格標籤上是多少錢？')
                discount = input ('折扣是百分之多少？')

                new_price = _ calculate_new_price(old_price, discount)
                print('新價格是', new_price, '美元')
            notes: 學生想得到其他適合讓函式回傳值的情況嗎？
