    13:
        1:
            header: 歡迎來到第 13 級
            text: |-
                歡迎來到 Hedy 專家課程（第 13～16 級）！

                完成這堂課後，你可以：
                * 編寫（幾乎）是真正 Python 的程式碼
        2:
            header: 真正的 Python 程式碼
            text: |-
                到目前為止，我們使用的是簡化的程式碼。
                但從現在起，我們會使用能在其他地方執行的真正 Python 程式碼。
            notes: |-
                向學生說明，Python 是一種廣泛使用的程式語言。
                到目前為止，我們使用的是這種語言的不同簡化版本。
                現在，我們已經來到 Hedy 中所有語法都是真正 Python 程式碼的階段，因此程式碼也能在其他地方使用。
                也要告訴學生，雖然有不少改變，但大多只是小幅調整。
        3:
            header: Python 中的 {print}
            text: 從現在起，使用 {print} 時必須加上括號。
            code: |-
                {print} ('這段程式碼現在看起來就像真正的 Python 程式語言。')
                {print} ('你現在也能在 Hedy 以外使用輸出指令。')
                {print} ('恭喜，你已經成為程式設計高手了！')
            notes: |-
                請學生回想以前如何編寫「輸出」關鍵字。
                接著展示新的程式碼，確認每個人都看得出括號的位置。
        4:
            header: '{ask}'
            text: 我們也要將 `{ask}` 換成 Python 使用的 `{input}` 關鍵字，並同樣加上括號。
            code: |-
                age = {input} ('你幾歲？')
                {print} ('你今年', age, '歲。')
        5:
            header: '{print} 搭配變數'
            text: 使用逗號分隔，就能同時輸出變數和文字：
            code: |-
                level = {input}('你目前在第幾級？')
                {print}('祝你順利完成第', level, '級')
            notes: |-
                請學生預測這段程式碼的執行結果。
                接著執行程式，示範程式會原樣輸出引號內的文字，而引號外的內容則會顯示變數的值。
                示範如果在最後一行也把 level 放進引號中，會發生什麼事。
        6:
            header: '`{if}` 和 `{else}`'
            text: 在 if 陳述式中，必須使用兩個等號：==。大多數程式語言也是這樣。在 if 陳述式結尾，現在還要加上冒號。
            code: |-
                favorite_bird = input('你最喜歡哪一種鳥？')
                {if} favorite_bird == '企鵝':
                    {print}('太棒了，我也最喜歡企鵝！')
                {elif} favorite_bird == '鸚鵡':
                    {print}('選得真好！')
                {else}:
                    {print}("嗯，我不太同意")
            notes: 學生需要時間適應所有新語法。這個過程可能有點困難，也容易令人挫折，請提供許多練習新語法的機會。
        7:
            header: 真正 Python 中的 {range}
            text: 現在使用 {range} 關鍵字計數時，也需要加上括號。
            code: |-
                {for} i in {range} (1, 10):
                    {print} (i)
                {print} ('我們已經數到 10 了。')
            notes: 請學生回想之前如何使用這個功能。
        8:
            header: 小於與大於
            text: 你可能已經看過 < 和 > 符號。< 會檢查第一個數字是否小於第二個數字，例如 age < 12 會檢查 age 是否小於 12。> 會檢查第一個數字是否大於第二個數字，例如 points > 10 會檢查 points 是否大於 10。
            code: |-
                number = {input} ('請選一個小於 10 的數字')
                {if} number < 10:
                    {print}('很好，你選了一個數字！')
                {if} number > 10:
                    {print}('這不是小於 10 的數字。')
            notes: |-
                向學生展示程式碼，請他們預測各種數字會發生什麼事。
                使用不同的數字執行程式碼。
                最後試試數字 10，示範程式現在不會產生任何輸出。
                10 既不大於 10，也不小於 10，所以沒有輸出；下一張投影片會解決這個問題。
        9:
            header: 大於或等於
            text: |-
                大於或等於也有專用符號。
                你看得出它和前一段程式碼有什麼不同嗎？
            code: |-
                number = {input} ('請選一個小於 10 的數字')
                {if} number < 10:
                    print('很好，你選了一個數字！')
                {if} number >= 10:
                    print('這不是小於 10 的數字。')
            notes: |-
                現在你也可以試試看。使用不同的數字執行程式碼，也要使用 10 執行一次。
                確認學生了解結果為何不同。
        10:
            header: 小於或等於
            text: |-
                小於或等於也有專用符號。
                用法相同。
            code: |-
                number = {input} ('請選一個介於 10 到 20 之間的數字')
                {if} number <= 10:
                    print('請選另一個數字')
                {if}
                    print('很好，你選了一個數字！')
                {if} number >= 10:
                    print('這不是小於 10 的數字。')
            notes: |-
                現在你也可以試試看。使用不同的數字執行程式碼，也要使用 10 執行一次。
                確認學生了解結果為何不同。
                示範把 '>=' 改成 '>'，並把 '<=' 改成 '<'，就能用相同方式處理小於或等於。
        11:
            header: 等於或不等於
            text: 從現在起，相等與不相等也要使用符號表示。
            code: |-
                answer = {input} ('5+5 等於多少？')
                {if} answer = 10:
                    {print} ('答對了！')
                {if} answer != 10:
                    {print} ('答錯了，請再試一次！')
            notes: |-
                詢問學生認為「!=」符號代表什麼。
                接著執行程式碼，示範它代表「不等於」。
        12:
