        2:
            header: 函式！
            text: |-
                這個級別將學習如何使用函式。函式是一段能輕鬆重複使用多次的程式碼。

                練習：
                * 寫下〈一閃一閃亮晶晶〉的歌詞
                * 標出重複出現的歌詞
            notes: |-
                為了讓學生了解函式的用途，我們會使用〈一閃一閃亮晶晶〉。
                重複的歌詞是：「一閃」、「一閃」、「亮晶晶」、「滿天都是小星星」。
        3:
            header: 一閃一閃亮晶晶！
            text: |-
                這個程式提供了一個函式範例。
                來看看把這首歌的其餘部分填完後，會發生什麼事！
            code: |-
                {define} twinkle
                     {print} '一閃'
                     {print} '……'
            notes: |-
                把重複的歌詞加入函式：「一閃」、「亮晶晶」、「滿天都是小星星」。
                告訴學生這個部分就是函式，並向他們指出你把函式命名為 twinkle。
                下一張投影片會呼叫函式兩次，完成整首歌。
        4:
            header: 函式
            text: 如範例所示，函式是一段能隨時呼叫的程式碼。使用 `{define}` 設定函式，再使用 `{call}` 執行它。
            code: |-
                {define} twinkle
                     {print} '一閃'
                     {print} '……'

                {call} twinkle
                {print} '掛在天上放光明'
                {print} '好像許多小眼睛'
                {call} twinkle
        5:
