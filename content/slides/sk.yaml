        1:
            header: Vitaj na úrovni 15!
            text: |-
                Na konci tejto hodiny vieš:
                * Skrátiť kód a spraviť ho efektívnejší funkciami.
                * Použiť funkcie s argumentmi
                * Použiť `{return} {value}` vo funkciách
            notes: Nechaj žiakov povedať, čo si o funkciách pamätajú a na čo sa funkcie používajú.
        2:
            header: Pamätáš si funkcie?
            text: |-
                Funkcie vedia kód usporiadať a spraviť ho prehľadný tak, že sa kus kódu zopakuje vo funkcii.
                V skutočnom kóde v Pythone sa funkcie definujú cez `{def}`, potom názov funkcie a ():
                Na zavolanie funkcie netreba `{call}`, stačí napísať názov s ().
            code: |-
                def square():
                    {for} i {in} {range} (1,4):
                        {turn} 90
                        {forward} 10

                square()
                {forward} 50
                square()
                {forward} 50
                square()
                {forward} 50
            notes: Ukáž žiakom, ako funkcie vyzerajú teraz. Povedz im, že zátvorky sa použijú neskôr.
        3:
            header: Priveľa kódu?
            text: Kód nižšie sa veľa opakuje.
            code: |-
                {print} ('Tento kód vypočíta prvých 5 druhých mocnín a vypíše výsledok.')

                square1 = 1*1
                {print} ('druhá mocnina 1 =', square1)
                square2 = 2*2
                {print} ('druhá mocnina 2 = ', square2)
                square3 = 3*3
                {print} ('druhá mocnina 3 = ', square3)
                square4 = 4*4
                {print} ('druhá mocnina 4 = ', square4)
                square5 = 5*5
                {print} ('druhá mocnina 5 = ', square5)
            notes: |-
                Ukáž kód žiakom. Vidia všetko to opakovanie?
                Opýtaj sa, či vedia tento kód napísať na menej riadkov.
                Najskôr na to neprídu, tak ukáž ďalšiu snímku!
        4:
            header: Použi funkciu!
            text: |-
                Teraz skúsime ten istý výstup na menej riadkov kódu.
                Napíšeme na to funkciu: kus kódu, ktorý sa dá zopakovať viackrát s iným vstupom.
            code: |-
                {def} calculate_square(number):
                    square = number*number
                    {print} ('druhá mocnina', number, '=', square)

                {print} ('Tento kód vypočíta prvých 5 druhých mocnín a vypíše výsledok.')

                calculate_square(1)
                calculate_square(2)
                calculate_square(3)
                calculate_square(4)
                calculate_square(5)
            notes: |-
                Spusti kód. Over, že žiaci vidia, ako tento výstup z kódu vzniká.
                Teraz máme len o dva riadky menej než na minulej snímke.

                Vysvetli žiakom, že čím viac sa niečo opakuje, tým viac sa oplatí funkcia.
                Výhody: menej kódu, takže kód je usporiadanejší a píše sa rýchlejšie.
                Menšia šanca na chybu a ľahšie sa chyba nájde, keď vznikne.

                Ukáž, že sa vo funkcii dá niečo zmeniť tak, že sa zmení celý výstup.
        5:
            header: Funkcie s viacerými argumentmi
            text: |-
                Vstup v zátvorkách funkcie sa volá argument.
                Na jednu funkciu sa dá použiť viac argumentov:
            code: |-
                {def} fairy_tale(princess, prince, something_poisonous, expression_of_love)
                answer = {input}('Mám porozprávať rozprávku?')
                {if} answer == áno:
                    {print} ('Kde bolo, tam bolo, dievča menom ', princess)
                    {print} ('Zjedlo ', something_poisonous, ' a skoro umrelo...')
                    {print} ('Ale princ ', prince, ' prišiel na návštevu a dal ', expression_of_love )
                    {print} ('Tým sa uzdraví ', princess ' a príde láska k ', prince)
                    {print} (princess, ' a ', prince, ' žili šťastne až naveky.')
                {else}:
