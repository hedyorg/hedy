                {print} 'Chcelo by sa ti aktivitu '
                {print} 'Aj ja to chcem'
                {print} 'Pozri na tieto krásne mušle!'
                colors {is} 'oranžová, strieborná, biela, hnedá'
                {print} 'Najradšej mám farby {at} {random} jedna!'
                choice {is} {ask} Ktorá sa ti páči?
            debug: 'True'
            notes: Ukáž, ako sa používa ladič a ikona oka.
        13:
            header: Pripraviť, pozor, štart!
            text: Uži si dobrodružstvá na úrovni 4!
        14:
            header: Zopakujme si!
            text: Čo dnes vieš nové?
            notes: Požiadaj žiakov, nech vymenujú, čo sa dnes naučili.
        15:
            header: Zopakujme si!
            text: |-
                Ktoré dobrodružstvo sa páčilo najviac? Prečo?

                Ktoré dobrodružstvo sa páčilo najmenej? Prečo?
            notes: Opýtaj sa žiakov na názor.
        16:
            header: Ukáž a povedz!
            text: Chce niekto ukázať triede program, ktorý vznikol?
            notes: Nechaj niekoľkých žiakov ukázať prácu triede.
        17:
            header: Nakuknutie do ďalšej úrovne...
            text: Na ďalšej úrovni počítač zareaguje inak na iný vstup!
    5:
        1:
            header: Vitaj na úrovni 5
            text: |-
                Na konci tejto hodiny vieš:
                * nechať počítač reagovať na rôzny vstup.
                * použiť kľúčové slová {if} a {else}
        2:
            header: ak
            text: Kľúčové slovo `{if}` dovolí vybrať si z dvoch možností.
            code: |-
                name {is} {ask} 'ako sa voláš?'
                {if} name {is} Hedy {print} 'super'
            notes: |-
                Ukáž, že v tomto príklade počítač vypíše „super“, ak je odpoveď Hedy.
                Ak odpoveď nie je Hedy, počítač neurobí nič.
        3:
            header: Nezabudni na print
            text: |-
                Pri kľúčovom slove `{if}` nezabudni na kľúčové slovo `{print}`.
                Tento kód nebude fungovať!
            code: "{if} name {is} Hedy 'super'"
            debug: 'True'
            notes: Spusti kód a chybu oprav ako na ďalšej snímke.
        4:
            header: Podmienky
            text: Kód, ktorý ide za podmienkou if, sa volá podmienený príkaz.
            code: "{if} name {is} Hedy {print} 'super'"
            notes: "Opýtaj sa žiakov, čo je podľa nich podmienený príkaz. Tu je to: „{print} 'super.“"
        5:
            header: inak
            text: Ku kľúčovému slovu `{if}` sa dá pridať aj kľúčové slovo `{else}`.
            code: "{if} name {is} Hedy {print} 'super' {else} {print} 'fuj!'"
            notes: |-
                Ukáž žiakom, že tento kód dá pri rôznych odpovediach rôzny výstup:
                Ak je odpoveď Hedy, počítač vypíše „super“.
                Ak je odpoveď niečo iné, počítač vypíše „fuj“
        6:
            header: Dlhé riadky
            text: |-
                Riadky bývajú veľmi dlhé, keď je tam `{if}` aj `{else}`.
                Kľúčové slová sa dajú rozdeliť na 2 riadky, takto:
            code: |-
                {if} name {is} Hedy {print} 'super'
                {else} {print} 'fuj!'
            notes: |-
                Ak žiakom dva riadky nevadia, odporúčame začať s dvoma riadkami hneď.
                Program je tak prehľadnejší a neskôr sa to hodí.
        7:
            header: Ladenie
            text: Poďme tento kód ladiť!
            code: |-
                {print} Vitaj na kontrole HedyAir!
                boarding_pass {is} {ask} 'Máš palubný lístok?'
                {if} bording_pass áno {print} Super!
                {else} Priprav si palubný lístok.
                passport {is} 'Môžem vidieť pas, prosím?'
                {if} passport {is} áno 'ďakujem'
                {else} 'Bez pasu sa lietať nedá'
                declare {is} {ask} Máš niečo na preclenie?
                {if} declare {is} áno
                item_to_declare {is} {ask} 'Čo chceš precliť'
                {else} Dobre
                {print} Ďakujem. Choď k bráne A22.'
            debug: 'True'
        8:
            header: Poďme!
            text: Uži si dobrodružstvá na úrovni 5!
        9:
            header: Zopakujme si!
            text: Čo dnes vieš nové?
            notes: Požiadaj žiakov, nech vymenujú, čo sa dnes naučili.
        10:
