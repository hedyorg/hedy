            header: Ukáž a povedz!
            text: Chce niekto ukázať triede program, ktorý vznikol?
            notes: Nechaj niekoľkých žiakov ukázať prácu triede.
        14:
            header: Nakuknutie do ďalšej úrovne...
            text: Na ďalšej úrovni prídu úvodzovky! O krok bližšie k skutočnému kódu v Pythone!
    4:
        1:
            header: Vitaj na úrovni 4
            text: |-
                Na konci tejto hodiny vieš:
                * prečo sú v programovaní potrebné úvodzovky.
                * dať úvodzovky na správne miesta.
                * rozumieť chybovým hláškam o zlom použití úvodzoviek.
            code: "{print} 'Použi úvodzovky!'"
        2:
            header: Problém
            text: 'Na predchádzajúcich úrovniach sa mohol objaviť tento problém:'
            code: |-
                name {is} Sophie
                {print} Moje name je name
            debug: 'True'
            notes: |-
                Tento kód na tejto úrovni nefunguje!
                Nechaj žiakov odhadnúť výstup. Problém je, že keď sa použije premenná name, slovo name už v texte nejde použiť.
                Výstup tohto kódu bude „Moje Sophie je Sophie“.
        3:
            header: Oprava úvodzovkami
            text: |-
                Na tejto úrovni sa to opraví úvodzovkami.

                Kód tak bude vyzerať viac ako „skutočný“ Python.
            code: |-
                name {is} Sophie
                {print} 'Volám sa ' name
            notes: |-
                Počítač teraz vie, aký je rozdiel medzi textom „name“ a premennou name.
                Ukáž žiakom, že počítač teraz vypíše „Volám sa Sophie“.
                Niekto môže povedať, že to šlo ľahko opraviť aj iným názvom premennej. To je pravda, ale v programovaní je dôležité ukázať počítaču rôzne typy údajov a sám vedieť, čo je bežný text a čo premenná.
                Úvodzovky píš ako ' alebo dvojité úvodzovky ako ". Spätné úvodzovky ako ` nefungujú!
        4:
            header: Úvodzovky pri print
            text: Pri každom kľúčovom slove `{print}` daj text, ktorý sa má objaviť na obrazovke, do úvodzoviek.
            code: "{print} 'Použi úvodzovky!'"
        5:
            header: Úvodzovky pri ask
            text: To isté platí pre kľúčové slovo `{ask}`.
            code: name {is} {ask} 'meno, prosím?'
        6:
            header: Úvodzovky a premenné
            text: |-
                Názvy premenných na obrazovke vypísané byť nemajú.
                Preto premenné ostanú mimo úvodzoviek, takto:
            code: |-
                name {is} Harry
                {print} 'Ahoj ' name
        7:
            header: Úvodzovky a premenné
            text: |-
                Keď je názov premennej uprostred vety, premenná ostane mimo úvodzoviek.
                Zvyšok vety však úvodzovky potrebuje. Vyzerá to takto:
            code: |-
                name {is} Harry
                {print} 'Ahoj ' name ', ako sa máš?'
        8:
            header: Úvodzovky a stiahnuté tvary
            text: |-
                Pozor! Keď sa používajú úvodzovky, v stiahnutých tvaroch nejde použiť apostrof.

                Skús na obrazovke nižšie vypísať stiahnutý tvar ako "you're" alebo "I'm" a pozri, čo sa stane....
            code: "{print} 'This won't work'"
            debug: 'True'
        9:
            header: Oprav to!
            text: Ak v texte musí byť apostrof, problém vyriešia dvojité úvodzovky.
            code: |-
                {print} "I'm using double quotes"
                {print} "It's easy to do!"
            notes: Dôležité je začať a skončiť rovnakým typom úvodzoviek. Riadok sa napríklad nedá začať ' a skončiť ".
        10:
            header: Vymazať
            text: |-
                Na tejto úrovni príde aj kľúčové slovo {clear}.
                Tým sa z obrazovky výstupu zmaže všetok text.

                Vždy použi aj kľúčové slovo sleep. Inak počítač text zmaže skôr, než sa stihne prečítať!
            code: |-
                {print} '3'
                {clear}
                {print} '2'
                {clear}
                {print} '1'
                {clear}
                {print} 'PREKVAPENIE!'
            notes: Spusti kód a ukáž žiakom program. 3, 2, 1 sa nedajú prečítať. Pred kľúčové slová clear pridaj sleep a program oprav.
        11:
            header: Kreslenie vo `{color}`
