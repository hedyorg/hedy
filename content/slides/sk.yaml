            text: Symboly < a > už možno poznáš. < zistí, či je prvé číslo menšie než druhé, napríklad age < 12 zistí, či je age menšie než 12. > zistí, či je prvé číslo väčšie než druhé, napríklad points > 10 zistí, či je points väčšie než 10.
            code: |-
                number = {input} ('vyber číslo menšie než 10')
                {if} number < 10:
                    {print}('Super, číslo sedí!')
                {if} number > 10:
                    {print}('To nie je číslo menšie než 10.')
            notes: |-
                Ukáž kód žiakom. Nechaj ich odhadnúť, čo sa stane pri ktorých číslach.
                Kód spusti s rôznymi číslami.
                Nakoniec skús číslo 10 a ukáž, že kód teraz nedá žiadny výstup.
                Číslo 10 nie je ani väčšie, ani menšie než 10, a preto výstup nie je, ale na ďalšej snímke to vyriešime.
