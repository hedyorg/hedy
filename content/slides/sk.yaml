            header: Ukáž a povedz!
            text: Chce niekto ukázať triede program, ktorý vznikol?
            notes: Nechaj niekoľkých žiakov ukázať prácu triede.
        12:
            header: Nakuknutie do ďalšej úrovne...
            text: Na ďalšej úrovni bude jasné, čo robiť, keď treba 3 alebo viac možností, nielen 2 (if a else).
    6:
        1:
            header: Vitaj na úrovni 6
            text: |-
                Na konci tejto hodiny vieš:
                * pridať k podmienkam tretiu možnosť cez `{elif}`
                * cez `{in}` zistiť, či je vec v zozname, alebo nie
        2:
            header: Zopakujme si if a else
            text: Vieš vymyslieť kód s `{if}` a `{else}`?
            code: |-
                pizza {is} {ask} 'Čo máš najradšej?'
                {if} pizza {is} pepperoni
                {print} 'Áno! Pepperoni je najlepšia!'
                {else}
                {print} 'Pepperoni je lepšia!'
            notes: |-
                Nechaj žiakov spolu vymyslieť kód, v ktorom je if aj else.
                Keď budú hotoví, ukáž im ukážkový kód a nechaj ich odhadnúť, aký bude výsledok.
                Pripomeň aj to, že časť za príkazom {if} sa volá podmienený príkaz.
        3:
            header: Viac riadkov
            text: Podmienený príkaz je časť za {if} alebo {else}. Odteraz patrí podmienený príkaz na ďalší riadok.
            code: |-
                tidy {is} {ask} 'Chceš, aby kód vyzeral pekne a uprataný?'
                {if} tidy {is} 'áno'
                {print} 'Skvelá správa! Podmienený príkaz patrí vždy na druhý riadok!'
                {else}
                {print} 'Škoda! Podmienený príkaz aj tak patrí na ďalší riadok!'
            notes: |
                Ak žiaci ťažko chápu, prečo má byť podmienený príkaz na ďalšom riadku, povedz im, že na ďalšej úrovni sa za {if} alebo {else} dá dať viac riadkov kódu.
        4:
            header: '`{elif}`'
            text: '`{elif}` je spojenie kľúčových slov `{else}` a `{if}` a treba ho, keď majú byť 3 (alebo viac!) možnosti.'
            code: |-
                pizza {is} {ask} 'Čo máš najradšej?'
                {if} pizza {is} pepperoni
                {print} 'Áno! Pepperoni je najlepšia!'
                {elif} pizza {is} hawaii
                {print} 'To nemyslíš vážne?! Hawaii je najhoršia!'
                {else}
                {print} 'Pepperoni je lepšia!'
            notes: Ukáž tento kód žiakom a nechaj ich odhadnúť 3 možné výsledky. Potom nech vymyslia vlastný kód s 3 alebo viac možnosťami.
        5:
            header: '`{in}`'
            text: Keď už je `{if}`, `{else}` a {elif} precvičené, dá sa skúsiť aj kľúčové slovo `{in}`.
            code: |-
                pretty_colors {is} zelená, žltá
                favorite_color {is} {ask} 'Aká je tvoja obľúbená farba?'
                {if} favorite_color {in} pretty_colors {print} 'pekná!'
                {else} {print} 'meh'
            notes: |-
                Cez `{in}` počítač zistí, či je vec v zozname. Ukáž príklad.
                Hedy rozlišuje veľké a malé písmená. Ak je odpoveď „Zelená“ namiesto „zelená“, Hedy vypíše „meh“.
        6:
            header: Aby bol kód čistý
            text: |-
                Keď je kódov čoraz viac, programy budú dlhšie.
                Niekedy je kód neprehľadný a ťažko sa číta. Aby bol pekný a čitateľný, na začiatok riadka sa dá dať komentár mriežkou, takto:
            code: |-
                # Pomenovanie postavy
                name {is} {ask} 'Ako sa bude postava volať?'
                {print} 'Volá sa ' name

                # Hod kockou
                numbers = 1, 2, 3
                throw = numbers {at} {random}

                # Priradenie domáceho zvieratka
                {if} throw {is} 1
                    {print} name ' dostane psa'
                {elif} throw {is} 2
                    {print} name ' dostane mačku'
                {else}
                    {print} name 'dostane papagája'
        7:
            header: Ladenie
            text: Poďme tento kód ladiť!
            code: |-
                {print} 'Vitaj v obchode so zmrzlinou.'
                flavour {is} {ask} 'Akú príchuť chceš?'
                {if} flavour jahoda
                {print} 'Dobrá voľba!'
                flavour {is} vanilka
                {print} 'Naozaj nechceš jahodu?''
                {else}
                {print} Prepáč, máme len vanilku a jahodu.
                scoops {is} 'Koľko kopčekov chceš?'
                {if} scoops {is} 1
                {print} to bude 1,50, prosím.
                {elif} {is} 2
                {print} 'to bude 2,50, prosím.'
                {else} 'prepáč, to je priveľa.'
            debug: 'True'
        8:
            header: Zopakujme si!
            text: |-
                Ktoré dobrodružstvo sa páčilo najviac? Prečo?

                Ktoré dobrodružstvo sa páčilo najmenej? Prečo?
            notes: Opýtaj sa žiakov na názor.
        9:
            header: Zopakujme si!
            text: Čo dnes vieš nové?
            notes: Požiadaj žiakov, nech vymenujú, čo sa dnes naučili.
        10:
            header: Ukáž a povedz!
            text: Chce niekto ukázať triede program, ktorý vznikol?
            notes: Nechaj niekoľkých žiakov ukázať prácu triede.
        11:
            header: Nakuknutie do ďalšej úrovne...
            text: Na ďalšej úrovni sa v Hedy bude počítať
    7:
        1:
            header: Vitaj na úrovni 7
            text: |-
                Na konci tejto hodiny vieš:
                * počítať v Hedy
                * použiť v Hedy desatinné čísla
                * použiť v počítaní v Hedy premenné
            notes: |-
                Nechaj žiakov odhadnúť, kedy v kóde treba počítať (napríklad cena, počet ľudí, body v hre a podobne).
                Dá sa ich opýtať aj na to, ako by to vyzeralo. Najskôr sami prídu na + a -.
        2:
            header: Sčítanie
            text: Sčítanie sa počíta znamienkom plus.
            code: "{print} '5 plus 5 je ' 5 + 5"
            notes: Žiakom ukáž ukážkový kód len krátko.
        3:
            header: Odčítanie
            text: Odčítanie ide znamienkom mínus.
            code: "{print} '5 mínus 5 je ' 5 - 5"
            notes: Žiakom ukáž ukážkový kód len krátko.
        4:
            header: Násobenie
            text: Násobenie ide hviezdičkou.
            code: "{print} '5 krát 5 je ' 5 * 5"
            notes: Žiakom ukáž ukážkový kód len krátko.
        5:
            header: Delenie
            text: Delenie ide lomkou.
            code: "{print} '5 delených 5 je ' 5 / 5"
            notes: Žiakom ukáž ukážkový kód len krátko.
        6:
            header: Zhrnutie
            text: 'Zhrnutie: na počítanie idú +, -, * a /.'
            code: |-
                {print} '5 plus 5 je ' 5 + 5
                {print} '5 mínus 5 je ' 5 - 5
                {print} '5 krát 5 je ' 5 * 5
                {print} '5 delených 5 je ' 5 / 5
            notes: |-
                Počítací kód úvodzovky nepotrebuje.
                Nechaj žiakov odhadnúť, ako by vyzeral výstup, keby bol počítací kód v úvodzovkách.
        7:
            header: Symbol =
            text: |-
                Odteraz sa namiesto kľúčového slova `{is}` dá použiť aj symbol =.
                Platí to pre čísla aj slová a platí to aj za kľúčovými slovami `{if}` alebo `{else}`.
            code: |-
                name = Hedy
                answer = 20 + 4
            notes: Žiakom ukáž ukážkový kód len krátko.
        8:
            header: Počítanie s premennými
            text: 'Počítať sa dá s číslami, ale aj s premennými, takto:'
            code: |-
                number_1 = {ask} 'Zadaj prvé číslo:'
                number_2 = {ask} 'Zadaj druhé číslo:'
                correct_answer = number_1 * number_2
