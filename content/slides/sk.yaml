levels:
    0:
        1:
            header: Vitaj v Hedy!
            text: |-
                Vitaj v programovacom jazyku Hedy!

                Ak učíš, stlač na klávesnici S a uvidia sa poznámky pre lektora.
            notes: Nechaj žiakov napísať slová, ktoré si spájajú s programovaním. Rýchlo ich nechaj povedať odpovede.
        2:
            header: Programovanie
            text: |-
                Programovanie je dávanie pokynov počítaču v jeho jazyku.

                Taký jazyk sa volá „programovací jazyk“.
            notes: |-
                Počítače, žiaľ, nerozumejú bežnej ľudskej reči, napríklad angličtine, ale hovoria vlastným jazykom.
                Nemaj obavy, netreba písať rad núl a jednotiek. Naučíme sa dávať počítaču pokyny v programovacom jazyku.
        3:
            header: Programovací jazyk
            text: |-
                Možno už niektoré programovacie jazyky poznáš?
                Príklady:
                * Scratch
                * Python
                * HTML
            notes: Opýtaj sa žiakov na ich skúsenosť s programovaním, alebo či poznajú niekoho, kto pracuje v IT.
        4:
            header: Programovanie
            text: |-
                Ak vieš programovať, dá sa robiť veľa skvelých vecí:
                * stavať interaktívne príbehy
                * tvoriť počítačové kresby a kresliť ich na papier alebo látku
                * stavať vlastné aplikácie do telefónu
            notes: Môže to znieť naozaj ťažko, ale programovanie sa naučíme krok za krokom.
        5:
            header: Programovanie v Hedy
            text: V Hedy používame špeciálne „kľúčové slová“, napríklad `{print}`.
            code: '{print} Vitaj v Hedy!'
            notes: |-
                Pozrime sa na Hedy. V Hedy dávame počítaču pokyn kódovými slovami (kľúčovými slovami).
                Tieto pokyny píšeme do ľavej obrazovky. Tomu hovoríme kód, alebo program.
        6:
            header: Programovanie v Hedy
            text: Kľúčové slová budú ružové.
            code: '{print} Vitaj v Hedy!'
            notes: Ako vidíš, kódové slová (alebo kľúčové slová) zružovejú, ak ich použiješ správne.
        7:
            header: Programovanie v Hedy
            text: Kód spustíme tlačidlom Spustiť kód pod kódom.
            code: '{print} Vitaj v Hedy!'
            notes: Aby počítač pokyny splnil, kód treba „spustiť“. Stlač tlačidlo a ukáž žiakom, čo sa stane.
        8:
            header: Programovanie v Hedy
            text: Výstup sa objaví na pravej strane.
            code: '{print} Vitaj v Hedy!'
            notes: Keď kód spustíme, objaví sa výstup. Výstup je výsledok spustenia programu. Pravá obrazovka, kde sa výstup objaví, sa volá obrazovka výstupu.
        9:
            header: Programovanie v Hedy
            text: Výstup môže byť aj kresba.
            code: |-
                {forward} 100
                {turn} {left}
            notes: V Hedy nielen ukazujeme text, výstup môže byť aj kresba, alebo....
        10:
            header: Programovanie v Hedy
            text: Alebo môže byť výstup hudba!
            code: |-
                {play} C4
                {play} D4
                {play} E4
            notes: Poďme na prvú úroveň a začnime!
        11:
            header: Prejdi na ďalšie dobrodružstvo cez menu
            text: Cez menu prejdi na ďalšie dobrodružstvo alebo ďalšiu úroveň.
            editor: /hedy/1
            notes: Žiaci niekedy nevedia, ako prejsť na ďalšie dobrodružstvo. Ukáž im to v Hedy.
        12:
            header: Programovanie v Hedy
            text: V kóde sa niekedy stane chyba. Ladič pomôže chybu (bug) nájsť a opraviť.
            code: |-
                {print} Ladenie znamená hľadanie chyby
                {print} Kód sa dá spúšťať riadok po riadku
                {print} Tak sa chyba ľahšie nájde
                {print} A opraví!
                {print} Alebo klikni na ikonu oka a riadok kódu vypni
            debug: 'True'
            notes: |-
                **Ako ladiť kód**
                Pozri si toto <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">video</a>, ako ladič funguje, alebo si prečítaj návod.
                Chyby sa dajú hľadať aj priamo v kóde, ale sú tu aj nástroje na pomoc.
                Klikni na tlačidlo lienky 🐞 pod poľom na vstup. Spustí sa **ladič**. S ladičom sa program spúšťa riadok po riadku.
                Ak je v kóde veľká chyba (ako v dobrodružstvách o ladení), ladič povie, aby sa najprv opravili veľké chyby. V chybových hláškach je, ako ich opraviť.
                Keď veľké chyby zmiznú, ladič spustí program riadok po riadku.
                Ďalší riadok spustíš kliknutím na tlačidlo ⏭️ vpravo. Robí riadok to, čo má? Skvelé! Klikni znova, kým program nebeží úplne správne.
                Ladič zastavíš tlačidlom 🛑 v strede.
                Spustenie kódu od začiatku je tlačidlo 🔁 vľavo.
                Zasekol si sa na riadku a chceš program skúsiť bez neho?
                Riadok kódu vypneš kliknutím na ikonu oka pred číslom riadka. Riadok sa prečiarkne.
                Pri spustení sa tento riadok preskočí. Ak ho chceš znova zapnúť, klikni na ikonu oka a riadok sa už preskakovať nebude.
    1:
        1:
            header: Vitaj na úrovni 1!
            text: |-
                Na konci tejto hodiny vieš:
                * napísať kód, ktorý vypíše text
                * vytvoriť interaktívny príbeh
        2:
            header: '{print}'
            text: |-
                Prvý kód na úrovni 1 je `{print}`.

                `{print}` ukáže text na obrazovke.
            code: '{print} Ukáž tento text na obrazovke'
            notes: Najprv nechaj žiakov odhadnúť výstup. Potom kód spusti a ukáž, čo sa stane, keď beží kód `print`.
        3:
            header: Kľúčové slovo {print}
            text: |-
                Text za kľúčovým slovom print môžeš zmeniť na čokoľvek.

                Alebo vypíš viac riadkov tak, že pridáš ďalší riadok kódu, ktorý tiež začína `{print}`.
            code: |-
                {print} Vitaj v Hedy!
                {print} Začni programovať!
            notes: Spusti kód a potom ho zmeň na niečo vlastné. Ukáž, že sa dá vypísať, čo len chceš.
        4:
            header: '{ask}'
            text: |-
                Druhý kód na úrovni 1 je `{ask}`.

                `{ask}` položí otázku, na ktorú sa dá odpovedať.
            code: |-
                {print} Vitaj vo vlastnej hre kameň, nožnice, papier!
                {ask} Čo si vyberieš?
            notes: |-
                Ukáž, že počítač teraz kladie otázku. Vyplň odpoveď a ukáž aj to, že po vyplnení sa nič nestane.
                Upozorni žiakov, že počítač splní len pokyny a sám od seba nič neurobí. Ak má vypísať odpoveď, treba mu dať tento pokyn.
        5:
            header: '{answer}'
            text: |-
                Odpoveď na obrazovke výstupu ukážeš takto: `{answer}`.
                `{answer}` sa nikdy nepoužíva samo, vždy s `{ask}`.
            code: |-
                {print} Ahoj!
                {ask} Ako sa voláš?
                {print} ahoj {answer}
            notes: Aby počítač odpoveď zopakoval, použije sa kľúčové slovo `answer`.
        6:
            header: Programovanie!
            text: Tu je zoznam dobrodružstiev.
            editor: /hedy/1
            notes: Než začneme, ukáž žiakom dobrodružstvá. Nezabudni ukázať cvičenia. Tam si žiaci prečítajú, čo majú v dobrodružstve presne robiť.
        7:
            header: Programovanie!
            text: Žlté šípky slúžia na kopírovanie príkladov.
            editor: /hedy#print_command
            notes: Nakoniec ukáž žiakom, že ukážkový kód skopírujú do poľa na program stlačením žltého tlačidla.
        8:
            header: Poďme na to!
            text: |-
                Teraz je dobrý čas vyskúšať prvé dobrodružstvá.
                Cez menu prejdi na ďalšie dobrodružstvo. Ak chceš znova čítať vysvetlenie kľúčového slova, vráť sa do dobrodružstva s ikonou žiarovky.
            editor: /hedy/1
            notes: Pustime sa do toho!
        9:
            header: Ladenie
            text: Ladiť kód znamená zbaviť sa chýb v kóde. Poďme tento kód ladiť spolu. Ladič spustíš tlačidlom lienky.
            code: |-
                Som DJ Hedy
                {print} Akú pesničku chceš počuť?
                {ask} Tá pesnička sa mi tiež páči!
                {print} Ďalej... {answer}
            debug: 'True'
            notes: |-
                **Ako ladiť kód**
                Pozri si toto <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">video</a>, ako ladič funguje, alebo si prečítaj návod.
                Chyby sa dajú hľadať aj priamo v kóde, ale sú tu aj nástroje na pomoc.
                Klikni na tlačidlo lienky 🐞 pod poľom na vstup. Spustí sa **ladič**. S ladičom sa program spúšťa riadok po riadku.
                Ak je v kóde veľká chyba (ako v dobrodružstvách o ladení), ladič povie, aby sa najprv opravili veľké chyby. V chybových hláškach je, ako ich opraviť.
                Keď veľké chyby zmiznú, ladič spustí program riadok po riadku.
                Ďalší riadok spustíš kliknutím na tlačidlo ⏭️ vpravo. Robí riadok to, čo má? Skvelé! Klikni znova, kým program nebeží úplne správne.
                Ladič zastavíš tlačidlom 🛑 v strede.
                Spustenie kódu od začiatku je tlačidlo 🔁 vľavo.
                Zasekol si sa na riadku a chceš program skúsiť bez neho?
                Riadok kódu vypneš kliknutím na ikonu oka pred číslom riadka. Riadok sa prečiarkne.
                Pri spustení sa tento riadok preskočí. Ak ho chceš znova zapnúť, klikni na ikonu oka a riadok sa už preskakovať nebude.
        10:
            header: Hranie hudby
            text: |-
                Hudobné tóny hráš príkazom `{play}`
                Tóny idú: C - D - E - F - G - A - B
                Za tón daj číslo a vyber oktávu, oktávy idú od 1 do 10.
            code: |
                {play} C4
                {play} D4
                {play} E4
                {play} F4
                {play} G4
                {play} A4
                {play} B4
                {play} C5
            notes: Ukáž žiakom, ako sa v Hedy používa kľúčové slovo `{play}`. Teraz je aj dobrý čas zopakovať pravidlá triedy o slúchadlách.
        11:
            header: 'Kreslenie korytnačkou: {forward}'
            text: '`{forward}` posunie korytnačku dopredu.'
            code: '{forward} 50'
            notes: Keď sme videli textové kódy, pozeráme sa na kresliace. Ukáž žiakom, ako použiť kľúčové slovo forward.
        12:
            header: 'Kreslenie korytnačkou: {forward}'
            text: Ako ísť dozadu?
            code: '{forward} -50'
            notes: Opýtaj sa žiakov, či vedia, ako ísť dozadu. Odpoveď je záporné číslo, napríklad -50.
        13:
            header: 'Kreslenie korytnačkou: {turn}'
            text: '`{turn}` korytnačku otočí doľava alebo doprava.'
            code: |-
                {forward} 50
                {turn} {left}
        14:
            header: Ladenie
            text: Ladič pri kreslení
            code: |-
                {forward} 50
                {turn} {left}
                {forward} 100
                {turn} {left}
                {forward} 50
                {turn} {left}
            debug: 'True'
            notes: Pri kresbe sa ladič hodí.
        15:
            header: Zopakujme si!
            text: Čo dnes vieš nové?
            notes: Požiadaj žiakov, nech vymenujú, čo sa dnes naučili.
        16:
            header: Zopakujme si!
            text: |-
                Ktoré dobrodružstvo sa páčilo najviac? Prečo?

                Ktoré dobrodružstvo sa páčilo najmenej? Prečo?
            notes: Opýtaj sa žiakov na názor.
        17:
            header: Ukáž a povedz!
            text: Chce niekto ukázať triede program, ktorý vznikol?
            notes: Nechaj niekoľkých žiakov ukázať prácu triede. Dá sa to cez stránku triedy, kliknutím na dobrodružstvá žiakov.
        18:
            header: Nakuknutie do ďalšej úrovne...
            text: |-
                Na ďalšej úrovni sa programy dajú ešte viac rozhýbať premennou!
                A kľúčové slovo `{sleep}` kód na chvíľu zastaví!
    2:
        1:
            header: Vitaj na úrovni 2
            text: |-
                Na konci tejto hodiny vieš:
                * uložiť niečo do premennej
                * vytvoriť príbeh alebo kresbu pomocou premenných
            notes: Pojem premenná býva pre žiakov ťažký. Viac príkladov premenných pomôže, aby to sadlo.
        2:
            header: Problém
            text: Na predchádzajúcej úrovni sa mohol objaviť tento problém...
            code: |-
                {print} Vitaj v reštaurácii!
                {ask} Čo chceš jesť
                {print} Jesť chceš... {answer}
                {ask} Čo chceš piť?
                {print} Piť chceš... {answer}
                {print} Ďakujeme za objednávku!
                {print} Nech chutí... {answer}
            notes: |-
                Pozor: tento kód na tejto úrovni nefunguje. Program nespúšťaj, len ho preber.
                Nechaj žiakov pozrieť sa na program a odhadnúť výstup.
                Snáď dôjdu k tomu, že posledný riadok povie len „Nech chutí (nápoj z objednávky)“ a jedlo počítač zabudne.
                S `ask` si počítač pamätá len jednu vec. Na tejto úrovni sa na tento problém použijú premenné.
        3:
            header: Čo je premenná?
            text: |-
                Premenná je miesto v pamäti počítača, kde sa uloží odpoveď na otázku. 
                Môže to znieť ťažko, ale pozri si príklad.
            code: |-
                answer {is} {ask} Ako sa voláš?
                {print} Ahoj answer
            notes: |-
                Slovo premenná v informatike označuje miesto v pamäti počítača, kde sa ukladá informácia, ktorá sa mení.
                Premenná je ako krabica, v ktorej je to, čo sa mení. Krabica ostáva rovnaká, ale vnútro sa môže meniť.
                Ukáž žiakom, ako premenné fungujú. Upozorni, že názov premennej `answer` v poslednom riadku sa nahradí hodnotou premennej.
                Modrý rámik na obrazovke výstupu ukazuje použité premenné a na čo sú nastavené.
        4:
            header: Príkaz `{is}`
            text: Premennú vytvoríš alebo „nastavíš“ príkazom `{is}`. Názov premennej je pred `{is}` a príkaz `{ask}` za ním. Názov premennej si môžeš vybrať a použiť aj niečo iné než `answer`.
            code: |-
                name {is} {ask} Ako sa voláš?
                {print} Ahoj name
            notes: Nechaj žiakov vymyslieť vlastné príklady.
        5:
            header: Premenné
            text: Premennú nastavíš aj bez otázky. Názov premennej je pred `{is}` a hodnota premennej za ním.
            code: |-
                food {is} hamburger
                drink {is} voda
                {print} Chcem jesť food.
                {print} Chcem drink.
            notes: Opýtaj sa žiakov, či vedia ďalšiu premennú (výška, číslo topánky, farba vlasov a podobne) a pridaj do kódu vlastné príklady.
        6:
            header: Viac premenných
            text: Keď sa používajú premenné, dá sa ich použiť viac, nielen jedno `answer`.
            code: |-
                name {is} Hedy
                age {is} 15
                {print} name má age rokov
        7:
            header: Čakanie
            text: Kľúčové slovo `{sleep}` kód na chvíľu zastaví.
            code: |-
                {print} Moja obľúbená farba je...
                {sleep} 2
                {print} zelená!
            notes: |-
                Ukáž žiakom kľúčové slovo `{sleep}`. Opýtaj sa, čo podľa nich znamená 2.
                Zmeň 2 na iné číslo a ukáž, že sa dá rozhodnúť, na koľko sekúnd sa kód zastaví.
        8:
            header: Čakaj 5
            text: |-
                Za kľúčové slovo `{sleep}` môžeš dať číslo, ak má pauza trvať dlhšie.

                Ak chceš, namiesto čísla môžeš použiť premennú a tak určiť, ako dlho sleep čaká.
            code: |-
                pause {is} 10
                {print} Moja obľúbená farba je...
                {sleep} pause
                {print} zelená!
            notes: Ukáž kód a ak chceš, 10 môžeš zmeniť na kľúčové slovo {ask}.
        9:
            header: Kreslenie s premennými
            text: |-
                Na úrovni 1 už ide použiť {forward} 100.
                Teraz sa dá použiť aj premenná.
            code: |-
                distance {is} {ask} Ako ďaleko mám ísť?
                {forward} distance
            notes: |-
                Ukáž žiakom, že premenné už idú aj s kresliacou korytnačkou!
                Kód spusti viackrát s rôznymi odpoveďami, aby bolo vidno, na čo premenné sú.
        10:
            header: Kreslenie v stupňoch
            text: Doteraz šlo {turn} {left} alebo {turn} {right}, teraz idú stupne!
            code: |-
                {forward} 100
                {turn} 45
                {forward} 100
            notes: Ukáž žiakom kód. Na ďalšej snímke bude viac uhlov.
        11:
            header: Stupne
            text: |-
                Celý kruh má 360 stupňov.
                Polovica kruhu má 180 stupňov.
                Otočenie doprava má 90 stupňov.
                Otočenie doľava má 270 stupňov.

                Doplniť sa dá akékoľvek číslo.
            code: |-
                {turn} 90
                {forward} 100
            notes: |-
                Over, že žiaci stupňom rozumejú. Možno ich už mali na matematike, ale môže to byť aj úplne nové.
                Ak o stupňoch ešte nepočuli, hodí sa ukázať uhlomer. Dá sa im aj vytlačiť.
                Na ukážkovom kóde na snímkach ukáž viac uhlov.
        12:
            header: Stupne a premenné
            text: Aj stupne môžu byť premenné!
            code: |-
                degrees {is} {ask} O koľko stupňov sa má korytnačka otočiť?
                {turn} degrees
                {forward} 100
            notes: Ukáž žiakom, že aj počet stupňov môže byť premenná.
        13:
            header: Ladenie
            text: Ladiť kód znamená zbaviť sa chýb v kóde. Poďme tento kód ladiť spolu. Ladič spustíš tlačidlom lienky.
            code: |-
                {print} Vitaj v obchode so šiškami!
                filling {is} Akú náplň chceš?
                {print} Vybrané... Filling! Mňam!
                topping {ask} Akú posýpku chceš?
                topping je výborná!
                {print} Idem po šišku. {sleep}
                {print} Tu je! Šiška s náplňou filling a posýpkou toping!
                {ask} Pekný deň!
            debug: 'True'
            notes: Ukáž, ako sa používa ladič a ikona oka.
        14:
            header: Zopakujme si!
            text: Čo dnes vieš nové?
            notes: Požiadaj žiakov, nech vymenujú, čo sa dnes naučili.
        15:
            header: Zopakujme si!
            text: |-
                Ktoré dobrodružstvo sa páčilo najviac? Prečo?

                Ktoré dobrodružstvo sa páčilo najmenej? Prečo?
            notes: Opýtaj sa žiakov na názor.
        16:
            header: Ukáž a povedz!
            text: Chce niekto ukázať triede program, ktorý vznikol?
            notes: Nechaj niekoľkých žiakov ukázať prácu triede.
        17:
            header: Nakuknutie do ďalšej úrovne...
            text: Na ďalšej úrovni sa robí zoznam a počítač z neho vyberie náhodnú vec!
    3:
        1:
            header: Vitaj na úrovni 3
            text: |-
                Na konci tejto hodiny vieš:
                * uložiť do premennej viac vecí, tomu sa hovorí zoznam.
                * vytvoriť príbeh, v ktorom sa stanú náhodné veci.
                * vytvoriť kresbu, v ktorej sa nakreslí náhodná vec.
        2:
            header: Tvorba zoznamu
            text: |-
                Zoznam sa robí cez `{is}`.

                Veci v zozname oddeľ čiarkou.
            code: animals {is} psy, mačky, kengury
            notes: Nechaj žiakov napísať príklad vlastného zoznamu.
        3:
            header: Náhodne
            text: |-
                Zoznam sa používa s kľúčovými slovami `{at}` `{random}`.
                Počítač náhodne vyberie jednu vec zo zoznamu.
                Pri každom spustení tohto kódu bude výstup iný.
            code: |-
                animals {is} psy, mačky, kengury
                {print} animals {at} {random}
            notes: Kód spusti niekoľkokrát a ukáž žiakom, že výstup je zakaždým iný.
        4:
            header: Náhodne vo vete
            text: Kľúčové slová `{at}` `{random}` idú aj vo vete.
            code: |-
                animals {is} psy, mačky, kengury
                {print} Moje obľúbené zviera je animals {at} {random}
            notes: |-
                Znova ukáž žiakom, že sa výstup pri viacerých spusteniach mení.
                Dá sa zmeniť aj poradie slov, aby bolo vidno, že `{print} animals {at} {random} je moje obľúbené zviera` tiež ide.
                Teraz nechaj žiakov pod svoj zoznam napísať print a at random a vymeniť si kód s iným žiakom.
                Druhý žiak nech odhadne možný výstup programu.
                Niektoré odpovede v triede krátko preber.
        5:
            header: Poďme na to!
            text: Poďme na dobrodružstvá!
            notes: Poďme na prvé dobrodružstvá!
        6:
            header: Pridať do
            text: Veci do zoznamu pridáš kľúčovými slovami `{add}` `{to_list}`.
            code: |-
                animals {is} pes, mačka, kengura
                {add} ovca {to_list} animals
                {print} Vyberám animals {at} {random}
            notes: |-
                Žiaci si snáď všimnú, že takto add to veľmi nedáva zmysel, lebo ovcu šlo dať do zoznamu hneď.
                Ďalšia snímka ukáže add to spolu s ask a premennou, aby bol program interaktívny.
        7:
            header: Pridať do
            text: |-
                Do zoznamu pridáš, čo chceš, alebo kľúčové slová `{add}` `{to}` spojíš s kľúčovým slovom `{ask}`.
                Tak necháš hráča rozhodnúť, čo sa do zoznamu pridá, a program je interaktívny.
            code: |-
                animals {is} pes, mačka, kengura
                like {is} {ask} Ktoré zviera máš najradšej?
                {add} like {to_list} animals
                {print} Vyberám animals {at} {random}
            notes: |-
                Program spusti viackrát a ukáž, že vybrané zviera je teraz v zozname.
                Modrý rámik na obrazovke výstupu ukazuje použité premenné a na čo sú nastavené.
        8:
            header: Odobrať zo
            text: |-
                Opak kľúčových slov `{add}` `{to}` sú kľúčové slová `{remove}` `{from}`.
                Tie odoberú vec zo zoznamu.
            code: |-
                animals {is} pes, mačka, kengura
                dislike {is} {ask} Ktoré zviera sa ti nepáči?
                {remove} dislike {from} animals
                {print} Vyberám animals {at} {random}
            notes: |-
                Keď je jasné add to, remove from pôjde ľahko.
                Sprav cvičenie 4 a 5.
        9:
            header: Ladenie
            text: Poďme tento kód ladiť!
            code: |-
                music_genres {is} rock, pop, metal, indie, jazz
                chosen_genre {is} music {at} {random}
                {print} Poďme počúvať chosen genre
                nice {ask} Páči sa ti ten žáner?
                {remove} chosen_genre {from} chosen_genre
                second_choice {is} music_genres
                {print} alebo radšej... second_choice {at} {random}
                {remove} second_choice {to} music_genres
                {print} Najradšej mám music_genre {random}!
            debug: 'True'
            notes: Ukáž, ako sa používa ladič a ikona oka.
        10:
            header: Poďme na to!
            text: Uži si dobrodružstvá na úrovni 3!
        11:
            header: Zopakujme si!
            text: Čo dnes vieš nové?
            notes: Požiadaj žiakov, nech vymenujú, čo sa dnes naučili.
        12:
            header: Zopakujme si!
            text: |-
                Ktoré dobrodružstvo sa páčilo najviac? Prečo?

