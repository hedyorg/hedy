                V Pythonu se funkce definuje pomocí `{def}`, následuje název funkce a ():
                K zavolání funkce nepotřebuješ `{call}`, stačí napsat její název s ().
            code: |-
                def čtverec():
                    {for} i {in} {range} (1,4):
                        {turn} 90
                        {forward} 10

                čtverec()
                {forward} 50
                čtverec()
                {forward} 50
                čtverec()
                {forward} 50
            notes: Ukažte žákům, jak funkce vypadají nyní. Řekněte jim, že kulaté závorky využijeme později.
