levels:
    0:
        1:
            header: Vítej v Hedy!
            text: |-
                Vítej v programovacím jazyce Hedy!

                Učitelé, stisknutím klávesy S zobrazíte poznámky pro přednášejícího.
            notes: Požádejte žáky, aby si napsali několik slov, která si spojují s programováním. V rychlém kolečku si poslechněte jejich odpovědi.
        2:
            header: Programování
            text: |-
                Programování znamená dávat počítači pokyny v jazyce, kterému rozumí.

                Takovému jazyku se říká „programovací jazyk“.
            notes: |-
                Počítače bohužel nerozumějí běžnému lidskému jazyku, například angličtině. Mají vlastní jazyk.
                Žádný strach, nebudeme muset psát řetězce nul a jedniček. Naučíme se dávat počítači pokyny v programovacím jazyce.
        3:
            header: Programovací jazyk
            text: |-
                Možná už nějaké programovací jazyky znáš?
                Patří mezi ně například:
                * Scratch
                * Python
                * HTML
            notes: Zeptejte se žáků na jejich vlastní zkušenosti s programováním nebo na to, zda znají někoho, kdo pracuje v IT.
        4:
            header: Programování
            text: |-
                Když umíš programovat, můžeš dělat spoustu skvělých věcí:
                * Vytvářet interaktivní příběhy
                * Vytvářet počítačové kresby a přenést je na papír nebo látku
                * Vytvářet vlastní aplikace pro telefon
            notes: Možná to zní velmi obtížně, ale programovat se budeme učit postupně.
        5:
            header: Programování v Hedy
            text: V Hedy používáme zvláštní „klíčová slova“, například `{print}`.
            code: '{print} Vítej v Hedy!'
            notes: |-
                Podívejme se na Hedy. V Hedy dáváme počítači pokyny pomocí zvláštních slov, kterým říkáme klíčová slova.
                Tyto pokyny píšeme do levé části obrazovky. Říkáme jim kód nebo program.
        6:
            header: Programování v Hedy
            text: Klíčová slova budou růžová.
            code: '{print} Vítej v Hedy!'
            notes: Jak vidíte, správně použitá klíčová slova se zbarví růžově.
        7:
            header: Programování v Hedy
            text: Kód spustíme tlačítkem Spustit kód pod ním.
            code: '{print} Vítej v Hedy!'
            notes: Aby počítač pokyny provedl, musíte kód spustit. Stiskněte tlačítko a ukažte žákům, co se stane.
        8:
            header: Programování v Hedy
            text: Výstup se zobrazí na pravé straně.
            code: '{print} Vítej v Hedy!'
            notes: Po spuštění kódu se objeví výstup. Výstup je výsledek běhu našeho programu. Pravé části obrazovky, kde se výstup objevuje, říkáme výstupní část.
        9:
            header: Programování v Hedy
            text: Výstupem může být i kresba.
            code: |-
                {forward} 100
                {turn} {left}
            notes: V Hedy nemusí být výstupem jen text. Může to být i kresba nebo…
        10:
            header: Programování v Hedy
            text: Výstupem může být i hudba!
            code: |-
                {play} C4
                {play} D4
                {play} E4
            notes: Přejděme do první úrovně a začněme!
        11:
            header: Pomocí nabídky přejdi na další dobrodružství
            text: Pomocí nabídky přejdi na další dobrodružství nebo úroveň.
            editor: /hedy/1
            notes: Žáci někdy nevědí, jak přejít na další dobrodružství. Ukažte jim to přímo v Hedy.
        12:
            header: Programování v Hedy
            text: V kódu se někdy objeví chyba. Pomocí ladicího nástroje ji můžeš najít a opravit.
            code: |-
                {print} Ladění znamená hledání chyby
                {print} Kód můžeš spouštět řádek po řádku
                {print} Chybu tak snadno najdeš
                {print} A opravíš ji!
                {print} Nebo klikni na ikonu oka a vypni řádek kódu
            debug: 'True'
            notes: |-
                **Jak ladit kód**
                Podívejte se na toto <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">video</a>, které ukazuje práci s ladicím nástrojem, nebo si přečtěte pokyny.
                Chyby samozřejmě můžete hledat sami přímo v kódu, ale máme i nástroje, které vám pomohou.
                Klikněte na tlačítko s beruškou 🐞 pod vstupním polem. Spustíte tím **ladicí nástroj**, který umožňuje provádět program řádek po řádku.
                Pokud kód obsahuje závažnou chybu, například v dobrodružstvích na ladění, nástroj vás vyzve, abyste ji nejprve opravili. Z chybových hlášení zjistíte, jak postupovat.
                Po odstranění závažných chyb můžete program procházet po jednotlivých řádcích.
                Další řádek spustíte tlačítkem ⏭️ vpravo. Dělá řádek to, co má? Výborně! Znovu klikněte a pokračujte, dokud program nefunguje správně.
                Ladicí nástroj zastavíte tlačítkem 🛑 uprostřed.
                Tlačítkem 🔁 vlevo spustíte kód znovu od začátku.
                Zasekli jste se na některém řádku a chcete program vyzkoušet bez něj?
                Řádek můžete vypnout kliknutím na ikonu oka před jeho číslem. Řádek se přeškrtne.
                Při spuštění se pak přeskočí. Znovu ho zapnete dalším kliknutím na ikonu oka a program ho opět provede.
    1:
        1:
            header: Vítej v úrovni 1!
            text: |-
                Na konci této lekce dokážeš:
                * Napsat kód, který vypíše text
                * Vytvořit interaktivní příběh
        2:
            header: '{print}'
            text: |-
                První příkaz, který můžeš v úrovni 1 použít, je `{print}`.

                `{print}` slouží k zobrazení textu na obrazovce.
            code: '{print} Zobraz tento text na obrazovce'
            notes: Nejprve nechte žáky odhadnout, jaký bude výstup. Potom kód spusťte a ukažte, co se stane při spuštění příkazu `print`.
        3:
            header: Klíčové slovo {print}
            text: |-
                Text za klíčovým slovem print můžeš změnit, jak chceš.

                Nebo vypiš více řádků: přidej další řádek kódu, který také začíná na `{print}`.
            code: |-
                {print} Vítej v Hedy!
                {print} Začni programovat!
            notes: Spusťte kód a potom ho podle sebe změňte. Ukažte, že můžete vypsat libovolný text.
        4:
            header: '{ask}'
            text: |-
                Druhý příkaz, který můžeš v úrovni 1 použít, je `{ask}`.

                `{ask}` slouží k položení otázky, na kterou lze odpovědět.
            code: |-
                {print} Vítej ve své vlastní hře kámen, nůžky, papír!
                {ask} Co si vybereš?
            notes: |-
                Ukažte, že se vás počítač nyní na něco ptá. Zadejte odpověď a ukažte také, že se po jejím zadání nic nestane.
                Upozorněte žáky, že počítač provádí jen zadané pokyny a sám od sebe nic neudělá. Pokud tedy chcete odpověď vypsat, musíte mu k tomu dát pokyn.
        5:
            header: '{answer}'
            text: |-
                Odpověď zobrazíš ve výstupní části pomocí `{answer}`.
                `{answer}` se nikdy nepoužívá samostatně, vždy spolu s `{ask}`.
            code: |-
                {print} Ahoj!
                {ask} Jak se jmenuješ?
                {print} ahoj {answer}
            notes: Aby počítač zadanou odpověď zopakoval, použijete klíčové slovo `answer`.
        6:
            header: Programování!
            text: Tady najdeš seznam dobrodružství.
            editor: /hedy/1
            notes: Než začneme, ukažte žákům dobrodružství. Nezapomeňte upozornit na cvičení. V nich si žáci musí přečíst, co přesně mají v dobrodružství dělat.
        7:
            header: Programování!
            text: Žlutými tlačítky se šipkou můžeš zkopírovat příklady.
            editor: /hedy#print_command
            notes: Nakonec žákům ukažte, že žlutým tlačítkem mohou zkopírovat ukázkový kód do editoru.
        8:
            header: Pusťme se do toho!
            text: |-
                Teď je vhodná chvíle vyzkoušet první dobrodružství.
                Pomocí nabídky přejdi na další dobrodružství. Pokud si chceš znovu přečíst vysvětlení klíčového slova, vrať se k dobrodružství s ikonou žárovky.
            editor: /hedy/1
            notes: Pusťme se do toho!
        9:
            header: Ladění
            text: Ladění kódu znamená hledat a odstraňovat chyby. Pojďme tento kód společně odladit. Ladicí nástroj spustíš tlačítkem s beruškou.
            debug: 'True'
            notes: |-
                **Jak ladit kód**
                Podívejte se na toto <a href="https://www.youtube.com/watch?v=jwitgommeRY;t=2s" target="_blank">video</a>, které ukazuje práci s ladicím nástrojem, nebo si přečtěte pokyny.
                Chyby samozřejmě můžete hledat sami přímo v kódu, ale máme i nástroje, které vám pomohou.
                Klikněte na tlačítko s beruškou 🐞 pod vstupním polem. Spustíte tím **ladicí nástroj**, který umožňuje provádět program řádek po řádku.
                Pokud kód obsahuje závažnou chybu, například v dobrodružstvích na ladění, nástroj vás vyzve, abyste ji nejprve opravili. Z chybových hlášení zjistíte, jak postupovat.
                Po odstranění závažných chyb můžete program procházet po jednotlivých řádcích.
                Další řádek spustíte tlačítkem ⏭️ vpravo. Dělá řádek to, co má? Výborně! Znovu klikněte a pokračujte, dokud program nefunguje správně.
                Ladicí nástroj zastavíte tlačítkem 🛑 uprostřed.
                Tlačítkem 🔁 vlevo spustíte kód znovu od začátku.
                Zasekli jste se na některém řádku a chcete program vyzkoušet bez něj?
                Řádek můžete vypnout kliknutím na ikonu oka před jeho číslem. Řádek se přeškrtne.
                Při spuštění se pak přeskočí. Znovu ho zapnete dalším kliknutím na ikonu oka a program ho opět provede.
        10:
            header: Hraní hudby
            text: |-
                Tóny zahraješ pomocí `{play}`.
                V kódu je zapisujeme: C - D - E - F - G - A - B.
                Číslem za tónem vybereš stupnici od 1 do 10.
            code: |
                {play} C4
                {play} D4
                {play} E4
                {play} F4
                {play} G4
                {play} A4
                {play} B4
                {play} C5
            notes: Ukažte žákům, jak v Hedy používat klíčové slovo `{play}`. Je to také vhodná chvíle připomenout třídní pravidla pro používání sluchátek.
        11:
            header: 'Kreslení se želvou: {forward}'
            text: '`{forward}` slouží k pohybu želvy dopředu.'
            code: '{forward} 50'
            notes: Po programech s textovým výstupem se podíváme na kreslení. Ukažte žákům, jak používat klíčové slovo forward.
        12:
            header: 'Kreslení se želvou: {forward}'
            text: Jak se dostaneme dozadu?
            code: '{forward} -50'
            notes: Zeptejte se žáků, zda je napadá, jak se pohybovat dozadu. Řešením je záporné číslo, například -50.
        13:
            header: 'Kreslení se želvou: {turn}'
            text: '`{turn}` slouží k otočení želvy doleva nebo doprava.'
            code: |-
                {forward} 50
                {turn} {left}
        14:
            header: Ladění
            text: Použití ladicího nástroje při kreslení
            code: |-
                {forward} 50
                {turn} {left}
                {forward} 100
                {turn} {left}
                {forward} 50
                {turn} {left}
            debug: 'True'
            notes: Ladicí nástroj se může hodit i při kreslení.
        15:
            header: Zopakujme si to!
            text: Co ses dnes naučil*a?
            notes: Požádejte žáky, aby vyjmenovali, co se dnes naučili.
        16:
            header: Zopakujme si to!
            text: |-
                Které dobrodružství se ti líbilo nejvíc? Proč?

                Které dobrodružství se ti líbilo nejméně? Proč?
            notes: Zeptejte se žáků na jejich názor.
        17:
            header: Ukaž a povídej!
            text: Chce někdo třídě ukázat svůj program?
            notes: Nechte několik žáků ukázat práci třídě. Můžete to udělat tak, že na stránce třídy kliknete na dobrodružství daných žáků.
        18:
            header: Nahlédnutí do další úrovně...
            text: |-
                V další úrovni se naučíš používat proměnnou, díky které budou programy ještě interaktivnější!
                Také se naučíš pomocí `{sleep}` běh kódu pozastavit!
    2:
        1:
            header: Vítej v úrovni 2
            text: |-
                Na konci této lekce dokážeš:
                * Uložit něco do proměnné
                * Vytvořit příběh nebo kresbu pomocí proměnných
            notes: Pojem proměnná může být pro žáky obtížný. Osvědčilo se nám ukázat více příkladů proměnných, aby žáci pojem lépe pochopili.
        2:
            header: Problém
            text: V předchozí úrovni se ti možná stalo tohle…
            code: |-
                {print} Vítej v restauraci!
                {ask} Co si dáš k jídlu
                {print} K jídlu chceš… {answer}
                {ask} Co si dáš k pití?
                {print} K pití chceš… {answer}
                {print} Děkujeme za objednávku!
                {print} Vychutnej si… {answer}
            notes: |-
                Pozor: Tento kód v této úrovni nefunguje. Nespouštějte ho, jen o něm diskutujte.
                Nechte žáky prohlédnout si program a odhadnout jeho výstup.
                Snad dojdou k závěru, že poslední řádek vypíše jen „Vychutnej si (objednaný nápoj)“ a že počítač na jídlo zapomene.
                Pomocí ask si počítač pamatuje jen jednu věc. V této úrovni se žáci naučí tento problém řešit pomocí proměnných.
        3:
            header: Co je proměnná?
            text: |-
                Proměnná je místo v paměti počítače, kam se uloží odpověď na otázku.
                Možná to zní složitě, ale podívej se na příklad.
            code: |-
                odpověď {is} {ask} Jak se jmenuješ?
                {print} Ahoj odpověď
            notes: |-
                V informatice označuje proměnná místo v paměti počítače, kde se ukládají informace, které se mohou měnit.
                Proměnná je jako krabička nebo nádoba, ve které je uložená měnící se hodnota. Krabička zůstává stejná, ale její obsah se může měnit.
                Ukažte žákům, jak proměnné fungují. Upozorněte, že název proměnné `odpověď` na posledním řádku se nahradí její hodnotou.
                Modrý rámeček ve výstupní části ukazuje použité proměnné a jejich hodnoty.
        4:
            header: Příkaz `{is}`
            text: K vytvoření proměnné nebo nastavení její hodnoty používáme příkaz `{is}`. Název proměnné píšeme před `{is}` a příkaz `{ask}` za něj. Název proměnné si můžeme zvolit, nemusí to být `answer`.
            code: |-
                jméno {is} {ask} Jak se jmenuješ?
                {print} Ahoj jméno
            notes: Požádejte žáky, aby vymysleli vlastní příklady.
        5:
            header: Proměnné
            text: Proměnné můžeme nastavit hodnotu i bez otázky. Název proměnné píšeme před `{is}` a hodnotu za něj.
            code: |-
                jídlo {is} hamburger
                nápoj {is} voda
                {print} Dám si toto jídlo: jídlo.
                {print} Dám si tento nápoj: nápoj.
            notes: Zeptejte se žáků, zda je napadá další proměnná, například výška, velikost bot nebo barva vlasů. Přidejte do kódu vlastní příklady.
        6:
            header: Více proměnných
            text: Díky proměnným už nejsme omezeni na jednu `answer`. Můžeme používat více proměnných.
            code: |-
                jméno {is} Hedy
                věk {is} 15
                {print} jméno má věk let
        7:
            header: Pozastavení
            text: Klíčovým slovem `{sleep}` můžeš běh kódu na chvíli pozastavit.
            code: |-
                {print} Moje oblíbená barva je…
                {sleep} 2
                {print} zelená!
            notes: |-
                Ukažte žákům klíčové slovo {sleep}. Zeptejte se, co podle nich znamená číslo 2.
                Změňte ho na jiné číslo a ukažte, že mohou zvolit, na kolik sekund se program pozastaví.
        8:
            header: Pozastavení na 5 sekund
            text: |-
                Za `{sleep}` můžeš přidat číslo, pokud chceš delší pauzu.

                Délku pauzy můžeš určit také proměnnou místo čísla.
            code: |-
                pauza {is} 10
                {print} Moje oblíbená barva je…
                {sleep} pauza
                {print} zelená!
            notes: Ukažte kód a případně nahraďte číslo 10 otázkou s klíčovým slovem {ask}.
        9:
            header: Kreslení s proměnnými
            text: |-
                V úrovni 1 ses naučil*a používat {forward} 100.
                Teď můžeš použít i proměnnou.
            code: |-
                vzdálenost {is} {ask} Jak daleko mám jít?
                {forward} vzdálenost
            notes: |-
                Ukažte žákům, že teď mohou proměnné používat i při kreslení se želvou!
                Spusťte kód několikrát s různými odpověďmi, abyste předvedli využití proměnných.
        10:
            header: Kreslení pomocí stupňů
            text: Dříve šlo použít {turn} {left} nebo {turn} {right}. Teď můžeme zadat stupně!
            code: |-
                {forward} 100
                {turn} 45
                {forward} 100
            notes: Ukažte žákům kód. Na dalším snímku předvedeme různé úhly.
        11:
            header: Stupně
            text: |-
                Celý kruh má 360 stupňů.
                Půlkruh má 180 stupňů.
                Pro otočení doprava zadej 90 stupňů.
                Pro otočení doleva zadej 270 stupňů.

                Můžeš zadat libovolné číslo.
            code: |-
                {turn} 90
                {forward} 100
            notes: |-
                Ujistěte se, že žáci rozumějí měření úhlů ve stupních. Možná už ho znají z matematiky, ale může pro ně být úplně nové.
                Pokud o stupních ještě neslyšeli, může se hodit ukázat jim kruh s vyznačenými stupni. Můžete jim ho i vytisknout.
                Pomocí ukázkového kódu na snímcích předveďte různé úhly.
        12:
            header: Stupně a proměnné
            text: Počet stupňů můžeš uložit i do proměnné!
            code: |-
                stupně {is} {ask} O kolik stupňů se má želva otočit?
                {turn} stupně
                {forward} 100
            notes: Ukažte žákům, že i počet stupňů může být uložený v proměnné.
        13:
            header: Ladění
            text: Ladění kódu znamená hledat a odstraňovat chyby. Pojďme tento kód společně odladit. Ladicí nástroj spustíš tlačítkem s beruškou.
            code: |-
                {print} Vítej v obchodě s koblihami!
                náplň {is} Jakou náplň si dáš?
                {print} Tvoje volba… Náplň! Mňam!
                poleva {ask} Jakou polevu si dáš?
                poleva je výborná!
                {print} Dojdu pro tvoji koblihu. {sleep}
                {print} Tady je! Kobliha s náplň a s polva!
                {ask} Hezký den!
            debug: 'True'
            notes: Předveďte práci s ladicím nástrojem a ikonou oka.
        14:
            header: Zopakujme si to!
            text: Co ses dnes naučil*a?
            notes: Požádejte žáky, aby vyjmenovali, co se dnes naučili.
        15:
            header: Zopakujme si to!
            text: |-
                Které dobrodružství se ti líbilo nejvíc? Proč?

