                {print}('Hodně štěstí v úrovni ', úroveň)
            notes: |-
                Nechte žáky odhadnout výstup kódu.
                Potom kód spusťte a ukažte, že text v uvozovkách se vypíše doslova, zatímco mimo uvozovky se vypíše hodnota proměnné.
                Ukažte, co se stane, když na posledním řádku dáte do uvozovek i úroveň.
        6:
            header: '`{if}` a `{else}`'
            text: 'V podmínce if odteď používáme dvě rovnítka: ==. Stejně to dělá většina programovacích jazyků. Na konci řádku s if teď také potřebujeme dvojtečku.'
            code: |-
                oblíbený_pták = input('Jaký je tvůj oblíbený pták?')
                {if} oblíbený_pták == 'tučňák':
                    {print}('Jo, můj taky!')
                {elif} oblíbený_pták == 'papoušek':
                    {print}('Skvělá volba!')
                {else}:
                    {print}("Nic moc, nesouhlasím")
            notes: Na novou syntaxi si žáci budou muset zvyknout. Může to být obtížné a frustrující, proto jim dejte dost příležitostí k procvičování.
        7:
            header: '{range} v Pythonu'
            text: Pro počítání pomocí {range} teď také potřebuješ kulaté závorky.
            code: |-
