            text: V následujícím kódu se toho hodně opakuje.
            code: |-
                {print} ('Tento program vypočítá druhé mocniny prvních 5 kladných celých čísel a vypíše výsledky.')

                mocnina1 = 1*1
                {print} ('Druhá mocnina čísla 1 =', mocnina1)
                mocnina2 = 2*2
                {print} ('Druhá mocnina čísla 2 = ', mocnina2)
                mocnina3 = 3*3
                {print} ('Druhá mocnina čísla 3 = ', mocnina3)
                mocnina4 = 4*4
                {print} ('Druhá mocnina čísla 4 = ', mocnina4)
                mocnina5 = 5*5
                {print} ('Druhá mocnina čísla 5 = ', mocnina5)
            notes: |-
                Ukažte žákům kód. Vidí, kolik částí se opakuje?
                Zeptejte se, zda je napadá, jak ho zapsat s menším počtem řádků.
                Nejspíš na řešení nepřijdou, proto jim ukažte další snímek!
        4:
            header: Použij funkci!
            text: |-
                Teď zkusíme získat stejný výstup s menším počtem řádků kódu.
                Napíšeme funkci: část kódu, kterou můžeme opakovaně použít s různými argumenty.
            code: |-
                {def} vypočti_mocninu(číslo):
                    mocnina = číslo*číslo
                    {print} ('Druhá mocnina čísla', číslo, '=', mocnina)

                {print} ('Tento program vypočítá druhé mocniny prvních 5 kladných celých čísel a vypíše výsledky.')

                vypočti_mocninu(1)
                vypočti_mocninu(2)
                vypočti_mocninu(3)
                vypočti_mocninu(4)
                vypočti_mocninu(5)
            notes: |-
                Spusťte kód. Ujistěte se, že žáci chápou, jak z něj vzniká daný výstup.
                Oproti předchozímu snímku teď máme jen o dva řádky kódu méně.

                Vysvětlete, že čím více částí se opakuje, tím více se vyplatí použít funkce.
                Výhody: Méně kódu znamená větší přehlednost a rychlejší psaní.
                Také vzniká méně chyb a případné chyby se snáze hledají.

                Ukažte, že změnou ve funkci se změní všechny příslušné výstupy.
        5:
            header: Funkce s více argumenty
            text: |-
                Vstupům v závorkách funkce říkáme argumenty.
                Jedna funkce může mít více argumentů:
            code: |-
                {def} pohádka(princezna, princ, něco_jedovatého, projev_lásky)
                odpověď = {input}('Chceš vyprávět pohádku?')
                {if} odpověď == ano:
                    {print} ('Kdysi žila dívka jménem ', princezna)
                    {print} ('Snědla něco jedovatého: ', něco_jedovatého, '. Málem zemřela…')
                    {print} ('Princ ', princ, ' ji ale přišel navštívit a dal jí: ', projev_lásky)
                    {print} ('Dívka jménem ', princezna ' se tak uzdravila a zamilovala se do prince jménem ', princ)
                    {print} (princezna, ' a ', princ, ' pak žili šťastně až do smrti.')
                {else}:
                    {print} ('Nevadí. Třeba příště.')

                pohádka('Sněhurka', 'Casper', 'jed', 'polibek')
            notes: Spusťte kód a ukažte, že změnou všech čtyř argumentů můžete získat jiný příběh.
        6:
            header: Návratová hodnota
            text: |-
                Někdy chceš číslo vypočítané uvnitř funkce použít i mimo ni.
                Pomocí `{return}` vrátíš hodnotu z funkce, aby šla použít i mimo její tělo.
            code: |-
                {def} vypočti_novou_cenu(částka, procenta):
                    procenta = procenta / 100
                    výše_slevy = částka * procenta
                    {return} částka - výše_slevy

                stará_cena = input ('Jaká cena je na cenovce?')
                sleva = input ('Kolik procent je sleva?')

                nová_cena = _ vypočti_novou_cenu(stará_cena, sleva)
                print('Nová cena: ', nová_cena, ' v dolarech')
            notes: Napadají žáky další situace, kdy by se hodilo vrátit z funkce hodnotu?
