    6:
        1:
            header: Vítej v úrovni 6
            text: |-
                Na konci této lekce dokážeš:
                * Pomocí `{elif}` přidat k podmíněnému kódu třetí možnost
                * Pomocí `{in}` ověřit, zda je položka v seznamu
        2:
            header: Zopakujme si if a else
            text: Napadne tě kód s `{if}` a `{else}`?
            code: |-
                pizza {is} {ask} 'Jaká pizza ti chutná nejvíc?'
                {if} pizza {is} pepperoni
                {print} 'Jo! Pepperoni je nejlepší!'
                {else}
                {print} 'Pepperoni je lepší!'
            notes: |-
                Nechte žáky společně vymyslet program s if a else.
                Až budou hotoví, ukažte jim příklad a nechte je odhadnout výstup.
                Také jim připomeňte, že části za příkazem {if} říkáme podmíněný kód.
        3:
            header: Použití více řádků
            text: Podmíněný kód je část za {if} nebo {else}. Odteď se píše na další řádek.
            code: |-
                přehlednost {is} {ask} 'Chceš mít kód pěkný a přehledný?'
                {if} přehlednost {is} 'ano'
                {print} 'Skvělá zpráva! Podmíněný kód vždy piš na další řádek!'
                {else}
                {print} 'Škoda! Podmíněný kód stejně piš na další řádek!'
            notes: |
                Pokud žáci nechápou, proč by měli podmíněný kód psát na další řádek, můžete jim říct, že se v další úrovni naučí psát za {if} nebo {else} více řádků kódu.
        4:
            header: '`{elif}`'
            text: '`{elif}` je spojení klíčových slov `{else}` a `{if}`. Potřebuješ ho, když chceš mít tři nebo i více možností.'
            code: |-
                pizza {is} {ask} 'Jaká pizza ti chutná nejvíc?'
                {if} pizza {is} pepperoni
                {print} 'Jo! Pepperoni je nejlepší!'
                {elif} pizza {is} hawaii
                {print} 'To snad ne?! Hawaii je nejhorší!'
                {else}
                {print} 'Pepperoni je lepší!'
            notes: Ukažte žákům tento kód a nechte je odhadnout tři možné výsledky. Potom je nechte vymyslet vlastní náměty na program se třemi nebo více možnostmi.
        5:
            header: '`{in}`'
            text: Až si procvičíš klíčová slova `{if}`, `{else}` a {elif}, můžeš vyzkoušet také `{in}`.
            code: |-
                hezké_barvy {is} zelená, žlutá
                oblíbená_barva {is} {ask} 'Jaká je tvoje oblíbená barva?'
                {if} oblíbená_barva {in} hezké_barvy {print} 'hezká!'
                {else} {print} 'nic moc'
            notes: |-
                Pomocí `{in}` může počítač ověřit, zda je položka v seznamu. Ukažte příklad.
                Pozor, Hedy rozlišuje velká a malá písmena. Pokud tedy odpovíte „Zelená“ místo „zelená“, vypíše „nic moc“.
        6:
            header: Přehledný kód
            text: |-
                Jak poznáváš další příkazy, tvoje programy budou delší.
                Někdy může být kód nepřehledný a špatně se číst. Pomůžou komentáře: začni řádek znakem # a napiš poznámku, například takto:
            code: |-
                # Pojmenování postavy
                jméno {is} {ask} 'Jak se bude tvoje postava jmenovat?'
                {print} 'Jmenuje se ' jméno

                # Hod kostkou
                čísla = 1, 2, 3
                hod = čísla {at} {random}

                # Výběr mazlíčka
                {if} hod {is} 1
                    {print} jméno ' dostane psa'
                {elif} hod {is} 2
                    {print} jméno ' dostane kočku'
                {else}
                    {print} jméno 'dostane papouška'
        7:
            header: Ladění
            text: Pojďme vyladit tento kód!
            code: |-
                {print} 'Vítej v naší zmrzlinárně.'
                příchuť {is} {ask} 'Jakou příchuť si dáš?'
                {if} příchuť jahodová
                {print} 'Dobrá volba!'
                příchuť {is} vanilková
                {print} 'Opravdu nechceš jahodovou?''
                {else}
                {print} Bohužel máme jen vanilkovou a jahodovou.
                kopečky {is} 'Kolik kopečků si dáš?'
                {if} kopečky {is} 1
