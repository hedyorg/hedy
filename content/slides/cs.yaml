    5:
        1:
            header: Vítej v úrovni 5
            text: |-
                Na konci této lekce dokážeš:
                * Nechat počítač reagovat na různé vstupy.
                * Používat klíčová slova {if} a {else}
        2:
            header: if
            text: Klíčové slovo `{if}` ti umožní volit mezi dvěma možnostmi.
            code: |-
                jméno {is} {ask} 'Jak se jmenuješ?'
                {if} jméno {is} Hedy {print} 'super'
            notes: |-
                Ukažte, že v tomto příkladu počítač vypíše „super“, pokud je odpověď Hedy.
                Pokud odpověď není Hedy, počítač neudělá nic.
        3:
            header: Nezapomeň na print
            text: |-
                S klíčovým slovem `{if}` nezapomeň použít také `{print}`.
                Tento kód nebude fungovat!
            code: "{if} jméno {is} Hedy 'super'"
            debug: 'True'
            notes: Spusťte kód a opravte chybu podle následujícího snímku.
        4:
            header: Podmíněný kód
            text: Kód, který se provede při splnění podmínky if, je podmíněný kód.
            code: "{if} jméno {is} Hedy {print} 'super'"
            notes: "Zeptejte se žáků, co je podle nich podmíněný kód. Zde je to: `{print} 'super'`."
        5:
            header: else
            text: Ke klíčovému slovu `{if}` můžeš přidat také `{else}`.
            code: "{if} jméno {is} Hedy {print} 'super' {else} {print} 'fuj!'"
            notes: |-
                Ukažte žákům, že program dává různé výstupy pro různé odpovědi:
                Pokud je odpověď Hedy, počítač vypíše „super“.
                Pokud je odpověď jiná, vypíše „fuj“.
        6:
            header: Dlouhé řádky
            text: |-
                Možná už víš, že řádky s `{if}` i `{else}` mohou být velmi dlouhé.
                Příkazy můžeš rozdělit na dva řádky, například takto:
            code: |-
                {if} jméno {is} Hedy {print} 'super'
                {else} {print} 'fuj!'
            notes: |-
                Pokud žákům nevadí používat dva řádky, doporučujeme s tím začít hned.
                Program je pak přehlednější a v dalších úrovních se to bude hodit.
