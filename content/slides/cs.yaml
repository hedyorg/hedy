                        {print} 'Budeme pokračovat'
                    {else}
                        {print} 'Nemáš jistotu'
                {else}
                    {print} 'Nechceš pokračovat'
            notes: Spusťte program několikrát s různými odpověďmi. Zeptejte se žáků, jaké odpovědi máte zadat, abyste získali jednotlivé výstupy.
        5:
            header: Na odsazení záleží
            text: Odsazení je stále velmi důležité a může výrazně změnit chování kódu.
            code: |-
                pokračování = {ask} 'Chceš pokračovat?'
                {if} pokračování = ano
                    jistota = {ask} 'Opravdu?'
                    {if} jistota {is} ano
                        {print} 'Budeme pokračovat'
                {else}
                    {print} 'Nemáš jistotu'
            notes: Vyzkoušejte různé odsazení a ukažte žákům, co se stane například po odstranění odsazení druhého příkazu {if}.
        6:
            header: Nepřehledný kód
            text: 'Vnoření může být velmi užitečné, ale někdy kvůli němu bývá kód hodně nepřehledný. Podívej se na tento příklad:'
            code: |-
                {print} 'Zkusím uhodnout, kdo jsi'
                barva_vlasů = {ask} 'Jakou máš barvu vlasů?'
                brýle = {ask} 'Nosíš brýle?'
                {if} barva_vlasů {is} černá
                    {if} brýle {is} ano
                        {print} 'Musíš být Jade!'
                    {else}
                        {print} 'Musíš být Ahmed!'
                {elif} barva_vlasů {is} blond
                    {if} brýle {is} ano
                        {print} 'Musíš být Patrick!'
                    {else}
                        {print} 'Musíš být Miranda!'
                {else}
                    {print} 'Musíš být Jackie!'
            notes: |-
                Zeptejte se žáků, kdo má blond vlasy a nenosí brýle. Čtení tohoto kódu jim chvíli potrvá.
                Na dalším snímku ukažte, že s klíčovým slovem and je kód mnohem přehlednější.
        7:
            header: Klíčové slovo {and}
            text: |-
                Tady se hodí klíčové slovo `{and}`.

                Kód je tak mnohem přehlednější a nemusíš tolik hlídat odsazení!
            code: |-
                {print} 'Zkusím uhodnout, kdo jsi'
                barva_vlasů = {ask} 'Jakou máš barvu vlasů?'
                brýle = {ask} 'Nosíš brýle?'
                {if} barva_vlasů {is} černá {and} brýle {is} ano
                    {print} 'Musíš být Jade!'
                {elif} barva_vlasů {is} černá {and} brýle {is} ne
                    {print} 'Musíš být Ahmed!'
                {elif} barva_vlasů {is} blond {and} brýle {is} ano
                    {print} 'Musíš být Patrick!'
                {elif} barva_vlasů {is} blond {and} brýle {is} ne
                    {print} 'Musíš být Miranda!'
                {else}
                    {print} 'Musíš být Jackie!'
