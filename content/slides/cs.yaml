                    {print} (i)
                {print} ('Počítání do 10 skončilo.')
            notes: Požádejte žáky, aby si vzpomněli, jak tento zápis používali dříve.
        8:
            header: Menší a větší
            text: Znaménka < a > už možná znáš. Znaménko < ověří, zda je první číslo menší než druhé. Například věk < 12 ověří, zda je věk menší než 12. Znaménko > ověří, zda je první číslo větší než druhé. Například body > 10 ověří, zda jsou body větší než 10.
            code: |-
                číslo = {input} ('Vyber číslo menší než 10')
                {if} číslo < 10:
                    {print}('Super, číslo je vybrané!')
                {if} číslo > 10:
                    {print}('To není číslo menší než 10.')
            notes: |-
                Ukažte žákům kód. Nechte je odhadnout, co se stane pro různá čísla.
                Spusťte kód s několika různými čísly.
                Nakonec zkuste číslo 10 a ukažte, že program nic nevypíše.
                Číslo 10 není větší ani menší než 10, proto se nic nevypíše. Na dalším snímku to vyřešíme.
