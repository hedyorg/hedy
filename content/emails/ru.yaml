welcome_teacher_body: |-
    <strong>Добро пожаловать!</strong>
    Поздравляем с созданием учётной записи учителя Hedy. Добро пожаловать во всемирное сообщество учителей Hedy!

    <strong>Возможности учётной записи учителя</strong>
    Теперь тебе доступен ряд дополнительных возможностей.

    1. Подробные объяснения можно найти в <a href=\"https://hedy.org/for-teachers/manual\">руководстве для учителя</a>.
    2. С учётной записью учителя ты можешь создавать классы. Ученики смогут присоединяться к ним, а ты — следить за их успехами. Создавать классы и управлять ими можно на <a href=\"https://hedycode.com/for-teachers\">странице для учителей</a>.
    3. Ты можешь полностью настроить свои классы: например, открывать и закрывать уровни, включать и отключать приключения и создавать собственные!

    <strong>Присоединяйся к нашему онлайн-сообществу!</strong>
    Приглашаем всех учителей, программистов и других поклонников Hedy на наш <a href=\"https://discord.gg/8yY7dEme9r\">сервер Discord</a>. Это отличное место для общения о Hedy: у нас есть каналы, где можно показывать свои интересные проекты и уроки, сообщать об ошибках, общаться с другими учителями и командой Hedy.

    <strong>Как получить помощь</strong>
    Если что-то непонятно, напиши нам в Discord или <a href=\"mailto: hello@hedy.org\">по электронной почте</a>.

    <strong>Как сообщить об ошибке</strong>
    В Discord есть специальный канал для сообщений об ошибках — #bugs. Именно там можно рассказать о возникших проблемах. Если ты умеешь пользоваться GitHub, можешь создать там <a href=\"https://github.com/hedyorg/hedy/issues/new?assignees=&labels=&template=bug_report.md&title=%5BBUG%5D\">сообщение об ошибке</a>.

    Продолжай программировать!
    Команда Hedy
welcome_teacher_subject: Твоя учётная запись учителя Hedy готова
