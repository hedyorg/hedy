name: Resolve Weblate conflicts (only run if Weblate sends us an email about merge conflicts)

on:
  workflow_dispatch: {}

jobs:
  resolve_weblate:

    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
      contents: write
      # For commenting on a PR
      pull-requests: write

    steps:
    - name: Check for presence of GitHub Token
      id: secret
      run: |
        if [ ! -z "${{ secrets.HEDY_BOT_TOKEN }}" ]; then
          echo "We have a token!"
          echo "secret=${{ secrets.HEDY_BOT_TOKEN }}" >> $GITHUB_OUTPUT
        else
          echo "We do not have a token"
          echo "secret=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
        fi

    #----------------------------------------------------------------------
    #  Checkout source
    #
    # We need to pass the token here -- the commit action below will not overwrite the token to push.
    # This is necessary to bypass branch protection (which will disallow non-reviewed pushes otherwise)
    #
    # Make a distinction between Pull Request checkout and Push checkout. Push checkout
    # works mostly automatically, but for PRs we must be very explicit to get the right
    # branch and also support forks.
    - uses: actions/checkout@v6
      name: Checkout branch
      with:
        fetch-depth: 0
        token: ${{ steps.secret.outputs.secret }}
    - name: Configure Git identity
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com

    #----------------------------------------------------------------------
    #  Actual build

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: 3.12
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Install Weblate Client
      run: pip install wlc
    - name: Prepare client config
      run: |
        echo '[weblate]' >> .weblate
        echo 'url = https://hosted.weblate.org/api/' >> .weblate
        echo 'translation = hedy' >> .weblate
        echo '[keys]' >> .weblate
        echo 'https://hosted.weblate.org/api/ = ${{ secrets.WEBLATE_API_KEY }}' >> .weblate

    # Translator edits live in Weblate's database until something serializes them into a
    # commit, which by default does not happen for 'commit_pending_age' hours. The merge
    # script below reads Weblate's *git* branch, so anything still pending is invisible to
    # it and would be missing from the PR -- and then destroyed by the reset that runs once
    # the PR is merged. Commit first, so that everything this PR is meant to resolve is
    # actually in the branch we resolve it from.
    - name: Commit pending translations before reading Weblate's branch
      run: |
        set -x

        # Weblate runs one repository operation at a time and refuses the rest with
        # HTTP 423. Wait for it rather than giving up on the first refusal.
        for attempt in $(seq 1 10); do
          if output=$(wlc commit 2>&1); then
            echo "$output"
            break
          fi
          echo "$output"
          grep -q 'HTTP error 423' <<< "$output" || exit 1
          echo "Weblate is busy with another repository operation; retrying in 30s ($attempt/10)"
          sleep 30
        done

        # 'commit' is asynchronous, and the git export lags behind it, so wait for Weblate
        # to report that nothing is pending before anyone fetches the branch.
        # https://github.com/WeblateOrg/weblate/issues/12400
        for attempt in $(seq 1 10); do
          sleep 30
          wlc repo | tee repo.txt
          if grep -q "needs_commit: False" repo.txt; then
            echo "Weblate has written its pending translations to git"
            exit 0
          fi
        done

        echo "Weblate still reports pending changes after five minutes. Stopping, because"
        echo "resolving from a branch that is missing them would lose those translations."
        exit 1

    #----------------------------------------------------------------------
    #  Set up cache so that running snippet tests is somewhat cheap
    - name: Calculate hedy cache key
      run: "echo value=$(ls -1 hedy.py hedy_*.py grammars/* | sort | xargs tail -n 99999999 | sha256sum | cut -f 1 -d ' ') >> $GITHUB_OUTPUT"
      id: hedy_cache_key
    - name: Cache hedy test runs
      uses: actions/cache@v3
      with:
        path: .test-cache
        key: "hedy-test-cache-${{ steps.hedy_cache_key.outputs.value }}"

    - name: Run weblate merge script
      env:
        WEBLATE_MERGE_REPORT: ${{ runner.temp }}/weblate-merge-report.md
      run: |
        bash tools/merge-weblate-resolving-conflicts.sh

    # The create-pull-request action wants to commit the changes, and wants to
    # have them be on the main branch. Hence, move the current working tree to
    # main (detach HEAD, move working tree, then reattach)
    - name: Switch back to main
      run: |
        git checkout --detach
        git reset --soft main
        git checkout main

    - name: Compose the pull request body
      id: pr_body
      env:
        WEBLATE_MERGE_REPORT: ${{ runner.temp }}/weblate-merge-report.md
      run: |
        {
          echo 'body<<WEBLATE_PR_BODY'
          echo 'This PR merges pending commits from the Weblate repository that are conflicting'
          echo 'with changes on `main`, while resolving conflicts in favor of `main`.'
          if [ -s "$WEBLATE_MERGE_REPORT" ]; then
            echo
            cat "$WEBLATE_MERGE_REPORT"
          fi
          echo 'WEBLATE_PR_BODY'
        } >> "$GITHUB_OUTPUT"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.secret.outputs.secret }}
        commit-message: 'Changes from Weblate repository'
        title: 'Translations from Hosted Weblate'
        body: ${{ steps.pr_body.outputs.body }}
        labels: translations
        branch: automatic/weblate-conflicts
        delete-branch: true
        base: main

    # After we've created the PR, lock Weblate so that nothing new lands while the PR is
    # open. The resolved content is in the PR now and Weblate is unlocked again when it
    # closes.
    #
    # Note that this deliberately does NOT reset Weblate here. Resetting while the PR is
    # still open puts us straight back into the loop this workflow exists to break: 'main'
    # does not carry the resolved content yet, Weblate's add-ons start committing
    # regenerated files within minutes of the reset, and the squash merge that eventually
    # lands then arrives as unrelated history and conflicts again. 'unlock-weblate.yml'
    # owns the reset and runs it once the PR is merged, when both sides agree.
    #
    # The cost is that Weblate keeps reporting this merge conflict (and emailing about it)
    # for as long as the PR is open. That is noise rather than breakage: the resolution is
    # already in the PR, and merging it is what clears the conflict.
    - name: Prevent updates and merge conflicts until merged
      run: |
        # Have to lock each component individually. Not in the UI, but using the CLI we do.
        for component in glossary adventures keywords client-messages web-texts webpages slides; do
          wlc lock hedy/$component
        done
