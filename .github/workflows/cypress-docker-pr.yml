# This workflow runs a few Cypress smoke tests against the app in Docker using doit.
# The full Cypress suite already runs in cypresstests.yml; this only checks that the
# container builds and serves a working app.

name: Cypress tests (Docker PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  cypress-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Puppeteer is only used to print workbooks, so skip its Chrome download
      PUPPETEER_SKIP_DOWNLOAD: true

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: 3.12
        cache: pip

    - name: Set up NodeJS 22
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: 'npm'

    - name: Cache the Cypress binary
      uses: actions/cache@v4
      with:
        path: ~/.cache/Cypress
        key: cypress-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Install Nodejs dependencies (for Cypress)
      run: |
        npm ci

    - name: Prepare the dev database
      run: |
        doit run devdb

    - name: Build Docker container
      run: |
        nohup doit run build_container

    - name: Run Docker container
      run: |
        nohup doit run container > /tmp/hedy-container.log 2>&1 &

    - name: Wait for app to be ready
      run: |
        for i in {1..60}; do
          if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
            echo "Hedy is ready on port 8080"
            exit 0
          fi
          sleep 2
        done
        echo "Hedy container did not become ready in time"
        tail -n 200 /tmp/hedy-container.log || true
        exit 1

    - name: Cypress run
      uses: cypress-io/github-action@v6
      with:
        install: false
        record: false
        working-directory: tests/
        spec: cypress/e2e/home_page/start_buttons.cy.js,cypress/e2e/hedy_page/run_code_button.cy.js,cypress/e2e/for-teacher_page/general/see_teacher_page.cy.js,cypress/e2e/signup_page/signup.cy.js

    - name: Print container logs on failure
      if: failure()
      run: |
        docker ps -a || true
        docker logs hedy || true
        tail -n 200 /tmp/hedy-container.log || true

    - name: Stop Docker container
      if: always()
      run: |
        docker rm -f hedy || true
