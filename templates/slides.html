<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hedy - Slides - {{ level }} </title>
    <link rel="stylesheet" href="{{static('css/reveal-js-custom.css')}}">
    <link rel="stylesheet" href="{{static('vendor/reveal/dist/reset.css')}}">
    <link rel="stylesheet" href="{{static('vendor/reveal/dist/reveal.css')}}">
    <link rel="stylesheet" href="{{static('vendor/reveal/dist/theme/sky.css')}}">

    <!-- Theme used for syntax highlighted code -->
    <link rel="stylesheet" href="{{static('vendor/reveal/plugin/highlight/monokai.css')}}">
</head>
<body>
    <div class="reveal">
      <div class="slides">
          {% for index, slide in slides.items() %}
            {# Embedded previews get shorter slides: with the editor laid out side by
               side there is no need for the full 1018px, and a shorter slide means
               Reveal scales it down far less, so the preview stays readable. #}
            <section data-markdown style="text-align: left; height: {{ '640px' if embed else '1018px' }}; font-size:0.8em">
                {{ slide['header'] }}
                <textarea data-template>
                    ### {{ slide['header'] }}

                    {{ slide['text'] }}
                    {% if slide['code'] %}
                    <iframe class="fragment" src="/render_code/{{ level }}?code={{ slide['code'] | urlencode }}"></iframe>
                    {% endif %}
                    {% if slide['editor'] %}
                    <iframe class="fragment" src="{{ slide['editor'] }}"></iframe>
                    {% endif %}
                    <aside class="notes">{{ slide['notes'] }}</aside>
                </textarea>
            </section>
          {% endfor %}
      </div>
    </div>
    <script src="{{static('vendor/reveal/dist/reveal.js')}}"></script>
    <script src="{{static('vendor/reveal/plugin/notes/notes.js')}}"></script>
    <script src="{{static('vendor/reveal/plugin/markdown/markdown.js')}}"></script>
    <script src="{{static('vendor/reveal/plugin/highlight/highlight.js')}}"></script>
    <script>
        // More info about initialization & config:
        // - https://revealjs.com/initialization/
        // - https://revealjs.com/config/
        Reveal.initialize({
            hash: true,
            transition: 'none',
            slideNumber: true,
            keyboard: true,
            {# A preview frame is narrower than a browser window, and Reveal sizes slides
               relative to it, so a percentage width would drop the embedded Hedy editor
               below its 1024px breakpoint and stack editor and output on top of each
               other. Pin a wide slide instead and let Reveal scale it down: the editor
               then lays out side by side exactly as it does when presenting. #}
            width: {% if embed %}1200{% else %}"90%"{% endif %},
            // Learn about plugins: https://revealjs.com/plugins/
            plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
        });
    </script>
</body>
</html>
