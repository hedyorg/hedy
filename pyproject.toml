[tool.doit]
backend = "json"
dep_file = ".doit.db.json"

[tool.doit.plugins.command]
watch = "doit_watch:Watch"

# https://djlint.com/docs/configuration/
[tool.djlint]
profile = "jinja"
ignore="H021,H030,H031"
format_attribute_js_json=true
preserve_class_newlines=true
preserve_blank_lines=true
single_attribute_per_line=true